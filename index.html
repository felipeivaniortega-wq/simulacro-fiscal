guntas nuevas", "t": "vf", "m": "PP", "e": "Las resoluciones dictadas en audiencia se entienden notificadas a los intervinientes que asistieron o debieron asistir a ella.", "f": "Art. 30 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 30 CPP", "t": "Artículo 30.- Notificaciones de las resoluciones en las audiencias judiciales. Las resoluciones pronunciadas durante las audiencias judiciales se entenderán notificadas a los intervinientes en el procedimiento que hubieren asistido o debido asistir a las mismas. De estas notificaciones se dejará constancia en el estado diario, pero su omisión no invalidará la notificación. Los interesados podrán pedir copias de los registros en que constaren estas resoluciones, las que se expedirán sin demora."}], "grp": "30|CPP"}, {"id": "N-VF-19", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Las personas obligadas a denunciar deben hacerlo dentro de las cuarenta y ocho horas siguientes a que tomaron conocimiento del hecho.", "f": "Art. 176 CPP: dentro de las veinticuatro horas siguientes.", "g": "N", "r": 0, "x": [{"c": "Art. 176 CPP", "t": "Artículo 176.- Plazo para efectuar la denuncia. Las personas indicadas en el artículo anterior deberán hacer la denuncia dentro de las veinticuatro horas siguientes al momento en que tomaren conocimiento del hecho criminal. Respecto de los capitanes de naves o de aeronaves, este plazo se contará desde que arribaren a cualquier puerto o aeropuerto de la República."}], "grp": "176|CPP"}, {"id": "N-VF-20", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La omisión de denuncia obligatoria no se sanciona cuando quien la omite arriesgaba la persecución penal propia, de su cónyuge, conviviente, ascendientes, descendientes o hermanos.", "f": "Art. 177 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 177 CPP", "t": "Artículo 177.- Incumplimiento de la obligación de denunciar. Las personas indicadas en el artículo 175 que omitieren hacer la denuncia que en él se prescribe incurrirán en la pena prevista en el artículo 494 del Código Penal, o en la señalada en disposiciones especiales, en lo que correspondiere. La pena por el delito en cuestión no será aplicable cuando apareciere que quien hubiere omitido formular la denuncia arriesgaba la persecución penal propia, del cónyuge, de su conviviente o de ascendientes, descendientes o hermanos."}], "grp": "177|CPP"}, {"id": "N-VF-21", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Tras la Ley 21.845, cuando la detención la practican agentes policiales, el tiempo inmediato de las letras d), e) y f) del artículo 130 del Código Procesal Penal no puede exceder de veinticuatro horas.", "f": "Art. 130 inc. final CPP, sustituido por la Ley 21.845 (D.O. 10.10.2026).", "g": "N", "r": 1, "x": [{"c": "Art. 130 CPP", "t": "… que las víctimas de un delito que reclamen auxilio, o testigos presenciales, señalaren como autor o cómplice de un delito que se hubiere cometido en un tiempo inmediato. f) El que aparezca en un registro audiovisual Art. cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato. Para los efectos de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier …"}], "grp": "130|CPP"}, {"id": "N-VF-22", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Si la detención en flagrancia la practica un particular, el tiempo inmediato del artículo 130 del Código Procesal Penal se extiende hasta veinticuatro horas.", "f": "Art. 130 inc. final CPP (Ley 21.845): doce horas si la practica cualquier persona distinta de los agentes policiales y de la Autoridad Marítima.", "g": "N", "r": 0, "x": [{"c": "Art. 130 CPP", "t": "… cómplice de un delito que se hubiere cometido en un tiempo inmediato. f) El que aparezca en un registro audiovisual Art. cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato. Para los efectos de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}], "grp": "130|CPP"}, {"id": "N-VF-23", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Cuando la detención la practica la Autoridad Marítima en funciones de Policía Marítima, el tiempo inmediato del artículo 130 del Código Procesal Penal alcanza hasta cuarenta y ocho horas.", "f": "Art. 130 inc. final CPP (Ley 21.845).", "g": "N", "r": 1, "x": [{"c": "Art. 130 CPP", "t": "… en un tiempo inmediato. f) El que aparezca en un registro audiovisual Art. cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato. Para los efectos de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}], "grp": "130|CPP"}, {"id": "N-VF-24", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La policía debe informar al Ministerio Público de la detención por flagrancia dentro de un plazo máximo de doce horas.", "f": "Art. 131 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 131 CPP", "t": "… Cuando la detención se practicare en cumplimiento de una orden judicial, los agentes policiales que la hubieren realizado o el encargado del recinto de detención conducirán inmediatamente al detenido a presencia del juez que hubiere expedido la orden. Si ello no fuere posible por no ser hora de despacho, el detenido podrá permanecer en el recinto policial o de detención hasta el momento de la primera audiencia judicial, por un período que en caso alguno excederá las veinticuatro horas. Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. …"}], "grp": "131|CPP"}, {"id": "N-VF-25", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El detenido por flagrancia debe ser conducido ante el juez dentro de un plazo máximo de cuarenta y ocho horas desde la detención.", "f": "Art. 131 inc. 2° CPP: veinticuatro horas contadas desde que la detención se practicó.", "g": "N", "r": 0, "x": [{"c": "Art. 131 CPP", "t": "… inmediatamente al detenido a presencia del juez que hubiere expedido la orden. Si ello no fuere posible por no ser hora de despacho, el detenido podrá permanecer en el recinto policial o de detención hasta el momento de la primera audiencia judicial, por un período que en caso alguno excederá las veinticuatro horas. Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. El fiscal podrá dejar sin efecto la detención u ordenar que el detenido sea conducido ante el juez dentro de un plazo máximo de veinticuatro horas, contado desde que la detención se hubiere practicado. …"}], "grp": "131|CPP"}, {"id": "N-VF-26", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Si el fiscal o el abogado asistente no concurre a la primera audiencia del detenido, el juez puede suspenderla por un plazo no superior a dos horas.", "f": "Art. 132 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 132 CPP", "t": "Artículo 132. Comparecencia judicial. A la primera audiencia judicial del detenido deberá concurrir el fiscal o el abogado asistente del fiscal. La ausencia de éstos dará lugar a la liberación del detenido. No obstante lo anterior, el juez podrá suspender la audiencia por un plazo breve y perentorio no superior a dos horas, con el fin de permitir la concurrencia del fiscal o su abogado asistente. Transcurrido este plazo sin que concurriere ninguno de ellos, se procederá a la liberación del detenido. En todo caso, el juez deberá comunicar la ausencia del Art. fiscal o de su abogado asistente al fiscal regional respectivo o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, a la mayor brevedad, con el objeto de determinar la eventual responsabilidad disciplinaria que correspondiere. …"}], "grp": "132|CPP"}, {"id": "N-VF-27", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La instancia particular previa impide la detención por flagrancia en los delitos de los artículos 361 a 366 quáter del Código Penal.", "f": "Art. 129 inc. 3° CPP: no obsta a la detención la circunstancia de requerirse instancia particular en esos delitos.", "g": "N", "r": 0, "x": [{"c": "Art. 129 CPP", "t": "… Cualquier persona podrá detener a quien sorprendiere en delito flagrante, debiendo entregar inmediatamente al aprehendido a la policía, al ministerio público o a la autoridad judicial más próxima. Los agentes policiales estarán obligados a detener a quienes sorprendieren in fraganti en la comisión de un delito. En el mismo acto, la policía podrá proceder al registro de las vestimentas, equipaje o vehículo de la persona detenida, debiendo cumplir con lo señalado en el inciso segundo del artículo 89 de este Código. No obstará a la detención la circunstancia de que la persecución penal requiriere instancia particular previa, si el delito flagrante fuere de aquellos previstos y sancionados en los artículos 361 a 366 quater del Código Penal. …"}], "grp": "129|CPP"}, {"id": "N-VF-28", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La policía que se encuentra en actual persecución de quien debe detener puede ingresar a un lugar cerrado para practicar la detención.", "f": "Art. 129 inc. final CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 129 CPP", "t": "… y d) del artículo 17 ter de la ley Nº 18.216 y al que violare la condición del artículo 238, letra b), que le hubiere sido impuesta para la protección de otras personas. Sin perjuicio de lo señalado en el inciso anterior, el Art. tribunal que correspondiere deberá, en caso de quebrantamiento de condena y tan pronto tenga conocimiento del mismo, despachar la respectiva orden de detención en contra del condenado. En los casos de que trata este artículo, la policía podrá ingresar a un lugar cerrado, mueble o inmueble, cuando se encontrare en actual persecución del individuo a quien debiere detener, para practicar la respectiva detención. En este caso, la policía podrá registrar el lugar e incautar los objetos y documentos vinculados al caso que dio origen a la persecución, dando aviso de inmediato al fiscal, quien los conservará. …"}], "grp": "129|CPP"}, {"id": "N-VF-29", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Respecto de las faltas sólo procede, como medida cautelar que recae sobre la libertad, la citación.", "f": "Art. 124 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 124 CPP", "t": "Artículo 124. Exclusión de otras medidas. Cuando la imputación se refiriere a faltas, o delitos que la ley no sancionare con penas privativas ni restrictivas de libertad, no se podrán ordenar medidas cautelares que recaigan sobre la libertad del imputado, con excepción de la citación. Lo dispuesto en el inciso anterior no tendrá lugar en los casos a que se refiere el inciso cuarto del artículo 134 o cuando procediere el arresto por falta de comparecencia, la detención o la prisión preventiva de acuerdo a lo dispuesto en el artículo 33."}], "grp": "124|CPP"}, {"id": "N-VF-30", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Es improcedente la prisión preventiva cuando el delito imputado está sancionado únicamente con penas pecuniarias o privativas de derechos.", "f": "Art. 141 letra a) CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 141 CPP", "t": "Artículo 141. Improcedencia de la prisión preventiva. No se podrá ordenar la prisión preventiva: a) Cuando el delito imputado estuviere sancionado únicamente con penas pecuniarias o privativas de derechos; b) Cuando se tratare de delitos de acción privada, y c) Cuando el imputado se encontrare cumpliendo efectivamente una pena privativa de libertad. Si por cualquier motivo fuere a cesar el cumplimiento efectivo de la pena y el fiscal o el querellante estimaren necesaria la prisión preventiva o alguna de las medidas previstas en el Párrafo 6º, podrá solicitarlas anticipadamente, de conformidad a las disposiciones de este Párrafo, a fin de que, si el tribunal acogiere la solicitud, la medida se aplique al imputado en cuanto cese el cumplimiento efectivo de la pena, sin solución de continuidad. …"}], "grp": "141|CPP"}, {"id": "N-VF-31", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Procede la prisión preventiva en los delitos de acción privada cuando existe peligro de fuga.", "f": "Art. 141 letra b) CPP: no puede ordenarse tratándose de delitos de acción privada.", "g": "N", "r": 0, "x": [{"c": "Art. 141 CPP", "t": "Artículo 141. Improcedencia de la prisión preventiva. No se podrá ordenar la prisión preventiva: a) Cuando el delito imputado estuviere sancionado únicamente con penas pecuniarias o privativas de derechos; b) Cuando se tratare de delitos de acción privada, y c) Cuando el imputado se encontrare cumpliendo efectivamente una pena privativa de libertad. Si por cualquier motivo fuere a cesar el cumplimiento efectivo de la pena y el fiscal o el querellante estimaren necesaria la prisión preventiva o alguna de las medidas previstas en el Párrafo 6º, podrá solicitarlas anticipadamente, de conformidad a las disposiciones de este Párrafo, a fin de que, si el tribunal acogiere la solicitud, la medida se aplique al imputado en cuanto cese el cumplimiento efectivo de la pena, sin solución de continuidad. …"}], "grp": "141|CPP"}, {"id": "N-VF-32", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La presencia del imputado y de su defensor es requisito de validez de la audiencia en que se resuelve la solicitud de prisión preventiva.", "f": "Art. 142 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 142 CPP", "t": "Artículo 142.- Tramitación de la solicitud de prisión preventiva. La solicitud de prisión preventiva podrá plantearse verbalmente en la audiencia de formalización de la investigación, en la audiencia de preparación del juicio oral o en la audiencia del juicio oral. También podrá solicitarse en cualquier etapa de la investigación, respecto del imputado contra quien se hubiere formalizado ésta, caso en el cual el juez fijará una audiencia para la resolución de la solicitud, citando a ella al imputado, su defensor y a los demás intervinientes. La presencia del imputado y su defensor constituye un requisito de validez de la audiencia en que se resolviere la solicitud de prisión preventiva. Una vez expuestos los fundamentos de la solicitud por quien la hubiere formulado, el tribunal oirá en todo caso al defensor, a los demás intervinientes si estuvieren presentes y quisieren hacer uso de la palabra y …"}], "grp": "142|CPP"}, {"id": "N-VF-33", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Transcurridos seis meses desde que se ordenó la prisión preventiva o desde el último debate oral en que se decidió, el tribunal debe citar de oficio a audiencia para considerar su cesación o prolongación.", "f": "Art. 145 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 145 CPP", "t": "Artículo 145.- Substitución de la prisión preventiva y revisión de oficio. En cualquier momento del procedimiento el tribunal, de oficio o a petición de parte, podrá substituir la prisión preventiva por alguna de las medidas que se contemplan en las disposiciones del Párrafo 6º de este Título. Transcurridos seis meses desde que se hubiere ordenado la prisión preventiva o desde el último debate oral en que ella se hubiere decidido, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}], "grp": "145|CPP"}, {"id": "N-VF-34", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Cuando la prisión preventiva alcanza la mitad de la pena privativa de libertad esperable, el tribunal debe citar de oficio a una audiencia para considerar su cesación o prolongación.", "f": "Art. 152 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 152 CPP", "t": "Artículo 152.- Límites temporales de la prisión preventiva. El tribunal, de oficio o a petición de cualquiera de los intervinientes, decretará la terminación de la prisión preventiva cuando no subsistieren los motivos que la hubieren justificado. En todo caso, cuando la duración de la prisión preventiva hubiere alcanzado la mitad de la pena privativa de libertad que se pudiere esperar en el evento de dictarse sentencia condenatoria, o de la que se hubiere impuesto existiendo recursos pendientes, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}], "grp": "152|CPP"}, {"id": "N-VF-35", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Las medidas cautelares del artículo 155 del Código Procesal Penal pueden decretarse antes de la formalización de la investigación.", "f": "Art. 155 CPP: proceden después de formalizada la investigación, a petición del fiscal, del querellante o de la víctima.", "g": "N", "r": 0, "x": [{"c": "Art. 155 CPP", "t": "Artículo 155.- Enumeración y aplicación de otras medidas cautelares personales. Para garantizar el éxito de las diligencias de investigación o la seguridad de la sociedad, proteger al ofendido o asegurar la comparecencia del imputado a las actuaciones del procedimiento o ejecución de la sentencia, después de formalizada la investigación el tribunal, a petición del fiscal, del querellante o la víctima, podrá imponer al imputado una o más de las siguientes medidas: a) La privación de libertad, total o parcial, en su Art. casa o en la que el propio imputado señalare, si aquélla se encontrare fuera de la ciudad asiento del tribunal; b) La sujeción a la vigilancia de una persona o institución determinada, las que informarán periódicamente al juez; …"}], "grp": "155|CPP"}, {"id": "N-VF-36", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La apelación del artículo 149 inciso segundo del Código Procesal Penal contra la resolución que niega, sustituye o revoca la prisión preventiva debe interponerse en la misma audiencia.", "f": "Art. 149 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 149 CPP", "t": "… se encontrare en prisión preventiva no podrá ser puesto en libertad mientras no se encontrare ejecutoriada la resolución que negare, sustituyere o revocare la prisión preventiva. El recurso de apelación contra esta resolución deberá interponerse en la misma audiencia, gozará de preferencia para su vista y fallo y será agregado extraordinariamente a la tabla el mismo día de su ingreso al Tribunal de Alzada, o a más tardar a la del día siguiente hábil. Cada Corte de Apelaciones deberá establecer una sala de turno que conozca estas apelaciones en días feriados. En los casos en que no sea aplicable lo dispuesto en el inciso anterior, estando pendiente el recurso contra la resolución que dispone la libertad, para impedir la posible fuga del imputado la Corte de Apelaciones respectiva tendrá la facultad de decretar una orden de no innovar, desde luego y …"}], "grp": "149|CPP"}, {"id": "N-VF-37", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Recibida la noticia de un delito de acción penal pública, el fiscal debe proceder a las diligencias pertinentes y útiles dentro de las veinticuatro horas siguientes.", "f": "Art. 180 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 180 CPP", "t": "Artículo 180.- Investigación de los fiscales. Los fiscales dirigirán la investigación y podrán realizar por sí mismos o encomendar a la policía todas las diligencias de investigación que consideraren conducentes al esclarecimiento de los hechos. Sin perjuicio de lo dispuesto en el Párrafo 1º de este Título, dentro de las veinticuatro horas siguientes a que tomare conocimiento de la existencia de un hecho que revistiere caracteres de delito de acción penal pública por alguno de los medios previstos en la ley, el fiscal deberá proceder a la práctica de todas aquellas diligencias pertinentes y útiles al esclarecimiento y averiguación del mismo, de las circunstancias relevantes para la aplicación de la ley penal, de los partícipes del hecho y de las circunstancias que sirvieren para verificar su responsabilidad. …"}], "grp": "180|CPP"}, {"id": "N-VF-38", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El secreto de determinadas actuaciones respecto del imputado puede disponerse por un plazo no superior a cuarenta días.", "f": "Art. 182 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 182 CPP", "t": "… Las actuaciones de investigación realizadas por el ministerio público y por la policía serán secretas para los terceros ajenos al procedimiento. El imputado y los demás intervinientes en el procedimiento podrán examinar y obtener copias, a su cargo, de los registros y documentos de la investigación fiscal y podrán examinar los de la investigación policial. El fiscal podrá disponer que determinadas actuaciones, Art. registros o documentos sean mantenidas en secreto respecto del imputado o de los demás intervinientes, cuando lo considerare necesario para la eficacia de la investigación. En tal caso deberá identificar las piezas o actuaciones respectivas, de modo que no se vulnere la reserva y fijar un plazo no superior a cuarenta días para la mantención del secreto, el cual podrá ser ampliado por el mismo período, por una sola vez, con motivos fundados. …"}], "grp": "182|CPP"}, {"id": "N-VF-39", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La ampliación del secreto de actuaciones de investigación es oponible al imputado y a su defensa.", "f": "Art. 182 inc. 3° CPP: puede ampliarse por el mismo período, por una sola vez y con motivos fundados, pero la ampliación no es oponible al imputado ni a su defensa.", "g": "N", "r": 0, "x": [{"c": "Art. 182 CPP", "t": "… El imputado y los demás intervinientes en el procedimiento podrán examinar y obtener copias, a su cargo, de los registros y documentos de la investigación fiscal y podrán examinar los de la investigación policial. El fiscal podrá disponer que determinadas actuaciones, Art. registros o documentos sean mantenidas en secreto respecto del imputado o de los demás intervinientes, cuando lo considerare necesario para la eficacia de la investigación. En tal caso deberá identificar las piezas o actuaciones respectivas, de modo que no se vulnere la reserva y fijar un plazo no superior a cuarenta días para la mantención del secreto, el cual podrá ser ampliado por el mismo período, por una sola vez, con motivos fundados. …"}], "grp": "182|CPP"}, {"id": "N-VF-40", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El fiscal debe pronunciarse sobre las diligencias propuestas por los intervinientes dentro de los diez días siguientes a la solicitud.", "f": "Art. 183 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 183 CPP", "t": "Artículo 183.- Proposición de diligencias. Durante la investigación, tanto el imputado como los demás intervinientes en el procedimiento podrán solicitar al fiscal todas aquellas diligencias que consideraren pertinentes y útiles para el esclarecimiento de los hechos. El fiscal deberá pronunciarse dentro de los diez días siguientes a la solicitud y ordenará que se lleven a efecto aquellas que estimare conducentes. Si el fiscal rechazare la solicitud o no se pronunciare dentro del plazo establecido en el inciso anterior, se podrá reclamar ante las autoridades del Ministerio Público según lo disponga la ley orgánica constitucional respectiva, dentro del plazo de cinco días contado desde el rechazo o desde el vencimiento del señalado plazo, con el propósito de obtener un pronunciamiento definitivo acerca de la procedencia de la diligencia."}], "grp": "183|CPP"}, {"id": "N-VF-41", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El reclamo ante las autoridades del Ministerio Público por el rechazo de una diligencia propuesta debe formularse dentro de cinco días.", "f": "Art. 183 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 183 CPP", "t": "Artículo 183.- Proposición de diligencias. Durante la investigación, tanto el imputado como los demás intervinientes en el procedimiento podrán solicitar al fiscal todas aquellas diligencias que consideraren pertinentes y útiles para el esclarecimiento de los hechos. El fiscal deberá pronunciarse dentro de los diez días siguientes a la solicitud y ordenará que se lleven a efecto aquellas que estimare conducentes. Si el fiscal rechazare la solicitud o no se pronunciare dentro del plazo establecido en el inciso anterior, se podrá reclamar ante las autoridades del Ministerio Público según lo disponga la ley orgánica constitucional respectiva, dentro del plazo de cinco días contado desde el rechazo o desde el vencimiento del señalado plazo, con el propósito de obtener un pronunciamiento definitivo acerca de la procedencia de la diligencia."}], "grp": "183|CPP"}, {"id": "N-VF-42", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Quien se considere afectado por una investigación no formalizada puede pedir al juez de garantía que ordene al fiscal informar sobre los hechos y que le fije un plazo para formalizar.", "f": "Art. 186 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 186 CPP", "t": "Artículo 186.- Control judicial anterior a la formalización de la investigación. Cualquier persona que se considerare afectada por una investigación que no se hubiere formalizado judicialmente, podrá pedir al juez de garantía que le ordene al fiscal informar acerca de los hechos que fueren objeto de ella. También podrá el juez fijarle un plazo para que formalice la investigación."}], "grp": "186|CPP"}, {"id": "N-VF-43", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La orden de entrada y registro tiene una vigencia máxima de diez días, tras los cuales caduca la autorización.", "f": "Art. 208 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 208 CPP", "t": "Artículo 208.- Contenido de la orden de registro. La orden que autorizare la entrada y registro deberá señalar: a) El o los edificios o lugares que hubieren de ser registrados; b) El fiscal que lo hubiere solicitado; c) La autoridad encargada de practicar el registro, y d) El motivo del registro y, en su caso, del ingreso nocturno. La orden tendrá una vigencia máxima de diez días, después de los cuales caducará la autorización. Con todo, el juez que emitiere la orden podrá establecer un plazo de vigencia inferior."}], "grp": "208|CPP"}, {"id": "N-VF-44", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La interceptación de comunicaciones telefónicas del artículo 222 del Código Procesal Penal procede respecto de delitos a los que la ley asigna pena de simple delito.", "f": "Art. 222 inc. 1° CPP: exige un delito al que la ley asigne pena de crimen.", "g": "N", "r": 0, "x": [{"c": "Art. 222 CPP", "t": "Artículo 222.- Ámbito de aplicación. El juez de garantía, a petición del Ministerio Público, podrá ordenar la interceptación y grabación de las comunicaciones telefónicas o de otras formas de comunicación cuando existan fundadas sospechas basadas en hechos determinados de que una persona ha cometido o participado en la preparación o comisión, o que ella prepara actualmente la comisión o participación en un delito al que la ley le asigna pena de crimen, y la investigación de tales delitos lo haga imprescindible. La orden a que se refiere el inciso precedente sólo podrá afectar al imputado o a personas respecto de las cuales existieren fundadas sospechas basadas en hechos determinados, de que sirven de intermediarias de dichas comunicaciones y, asimismo, de aquellas que facilitaren sus medios de comunicación al imputado o sus intermediarios y la investigación de tales delitos lo hiciere …"}], "grp": "222|CPP"}, {"id": "N-VF-45", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La formalización de la investigación suspende el curso de la prescripción de la acción penal.", "f": "Art. 233 letra a) CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 233 CPP", "t": "Artículo 233.- Efectos de la formalización de la investigación. La formalización de la investigación producirá los siguientes efectos: a) Suspenderá el curso de la prescripción de la acción penal en conformidad a lo dispuesto en el artículo 96 del Código Penal; b) Comenzará a correr el plazo previsto en el artículo 247, y c) El ministerio público perderá la facultad de archivar provisionalmente el procedimiento."}], "grp": "233|CPP"}, {"id": "N-VF-46", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El imputado puede reclamar ante las autoridades del Ministerio Público de la formalización que considere arbitraria.", "f": "Art. 232 inc. final CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 232 CPP", "t": "Artículo 232.- Audiencia de formalización de la investigación. En la audiencia, el juez ofrecerá la palabra al fiscal para que exponga verbalmente los cargos que presentare en contra del imputado y las solicitudes que efectuare al tribunal. Enseguida, el imputado podrá manifestar lo que estimare conveniente. A continuación el juez abrirá debate sobre las demás peticiones que los intervinientes plantearen. El imputado podrá reclamar ante las autoridades del ministerio público, según lo disponga la ley orgánica constitucional respectiva, de la formalización de la investigación realizada en su contra, cuando considerare que ésta hubiere sido arbitraria."}], "grp": "232|CPP"}, {"id": "N-VF-47", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "En el juicio inmediato, el juez puede postergar el auto de apertura otorgando al imputado un plazo no menor de quince ni mayor de treinta días para plantear sus solicitudes de prueba.", "f": "Art. 235 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 235 CPP", "t": "… En la audiencia de formalización de la investigación, el fiscal podrá solicitar al juez que la causa pase directamente a juicio oral. Si el juez acogiere dicha solicitud, en la misma audiencia el fiscal deberá formular verbalmente su acusación y ofrecer prueba. También en la audiencia el querellante podrá adherirse a la acusación del fiscal o acusar particularmente y deberá indicar las pruebas de que pensare valerse en el juicio. El imputado podrá realizar las alegaciones que correspondieren y ofrecer, a su turno, prueba. Al término de la audiencia, el juez dictará auto de apertura del juicio oral. No obstante, podrá suspender la audiencia y postergar esta resolución, otorgando al imputado un plazo no menor de quince ni mayor de treinta días, dependiendo de la naturaleza del delito, para plantear sus solicitudes de prueba. …"}], "grp": "235|CPP"}, {"id": "N-VF-48", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La suspensión condicional del procedimiento exige que la pena que pudiere imponerse no exceda de cinco años de privación de libertad.", "f": "Art. 237 letra a) CPP: no debe exceder de tres años.", "g": "N", "r": 0, "x": [{"c": "Art. 237 CPP", "t": "Artículo 237.- Suspensión condicional del procedimiento. El fiscal, con el acuerdo del imputado, podrá solicitar al juez de garantía la suspensión condicional del procedimiento. El juez podrá requerir del ministerio público los antecedentes que estimare necesarios para resolver. La suspensión condicional del procedimiento podrá Art. a) decretarse: a) Si la pena que pudiere imponerse al imputado, en el evento de dictarse sentencia condenatoria, no excediere de tres años de privación de libertad; b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. …"}], "grp": "237|CPP"}, {"id": "N-VF-49", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El plazo de observación de la suspensión condicional del procedimiento no puede ser inferior a un año ni superior a tres.", "f": "Art. 237 inc. 6° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 237 CPP", "t": "… por los delitos o cuasidelitos contemplados en otros cuerpos legales que se cometan empleando alguna de las armas o elementos mencionados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º de la citada ley Nº17.798, y por conducción en estado de ebriedad causando la muerte o lesiones graves o gravísimas, el fiscal deberá someter su decisión de solicitar la suspensión condicional del procedimiento al Fiscal Regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Al decretar la suspensión condicional del procedimiento, el juez de garantía establecerá las condiciones a las que deberá someterse el imputado, por el plazo que determine, el que no podrá ser inferior a un año ni superior a tres. …"}], "grp": "237|CPP"}, {"id": "N-VF-50", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La presencia del defensor en la audiencia en que se ventila la suspensión condicional del procedimiento es requisito de validez.", "f": "Art. 237 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 237 CPP", "t": "… a) decretarse: a) Si la pena que pudiere imponerse al imputado, en el evento de dictarse sentencia condenatoria, no excediere de tres años de privación de libertad; b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. La presencia del defensor del imputado en la audiencia en que se ventilare la solicitud de suspensión condicional del procedimiento constituirá un requisito de validez de la misma. …"}], "grp": "237|CPP"}, {"id": "N-VF-51", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La resolución que revoca la suspensión condicional del procedimiento es apelable.", "f": "Art. 239 inc. final CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 239 CPP", "t": "Artículo 239.- Revocación de la suspensión condicional. Cuando el imputado incumpliere, sin justificación, grave o reiteradamente las condiciones impuestas, o fuere objeto de una nueva formalización de la investigación por hechos distintos, el juez, a petición del fiscal o la víctima, revocará la suspensión condicional del procedimiento, y éste continuará de acuerdo a las reglas generales. Respecto de la suspensión condicional del procedimiento para el tratamiento de drogas y/o alcohol, se entenderá como incumplimiento de las condiciones la no adherencia al tratamiento y el incumplimiento grave y reiterado de las actividades determinantes para su rehabilitación. La resolución dictada de conformidad a este artículo será apelable."}], "grp": "239|CPP"}, {"id": "N-VF-52", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Los acuerdos reparatorios proceden respecto de hechos que afecten bienes jurídicos disponibles de carácter patrimonial, lesiones menos graves o delitos culposos.", "f": "Art. 241 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 241 CPP", "t": "Artículo 241.- Procedencia de los acuerdos reparatorios. El imputado y la víctima podrán convenir acuerdos reparatorios, los que el juez de garantía aprobará, en audiencia a la que citará a los intervinientes para escuchar sus planteamientos, si verificare que los concurrentes al acuerdo hubieren prestado su consentimiento en forma libre y con pleno conocimiento de sus derechos. Los acuerdos reparatorios sólo podrán referirse a hechos investigados que afectaren bienes jurídicos disponibles de carácter patrimonial, consistieren en lesiones menos graves o constituyeren delitos culposos. Sin perjuicio de lo señalado en los incisos precedentes, los acuerdos reparatorios procederán también respecto de los delitos de los artículos 144 inciso primero, 146, 161-A, 161 B, 231, inciso segundo del 247, 284, 296, 297, 494 Nº 4 y 494 Nº 5, todos del Código Penal. …"}], "grp": "241|CPP"}, {"id": "N-VF-53", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Dejado sin efecto un acuerdo reparatorio por incumplimiento, el asunto puede ser objeto de un nuevo acuerdo reparatorio.", "f": "Art. 242 inc. 2° CPP: en ese caso el asunto no es susceptible de un nuevo acuerdo reparatorio.", "g": "N", "r": 0, "x": [{"c": "Art. 242 CPP", "t": "Artículo 242.- Efectos penales del acuerdo reparatorio. Una vez cumplidas las obligaciones contraídas por el imputado en el acuerdo reparatorio o garantizadas debidamente a satisfacción de la víctima, el tribunal dictará sobreseimiento definitivo, total o parcial, en la causa, con lo que se extinguirá, total o parcialmente, la responsabilidad penal del imputado que lo hubiere celebrado. Cuando el imputado incumpliere de forma injustificada, Art. grave o reiterada las obligaciones contraídas, la víctima podrá solicitar que el juez resuelva el cumplimiento de las obligaciones de conformidad al artículo siguiente o que se deje sin efecto el acuerdo reparatorio y se oficie al Ministerio Público a fin de reiniciar la investigación penal. En este último caso, el asunto no será susceptible de un nuevo acuerdo reparatorio."}], "grp": "242|CPP"}, {"id": "N-VF-54", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Cerrada la investigación, la suspensión condicional y el acuerdo reparatorio sólo pueden decretarse, por regla general, durante la audiencia de preparación del juicio oral.", "f": "Art. 245 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 245 CPP", "t": "Artículo 245.- Oportunidad para pedir y decretar la suspensión condicional del procedimiento o los acuerdos reparatorios. La suspensión condicional del procedimiento y el acuerdo reparatorio podrán solicitarse y decretarse en cualquier momento posterior a la formalización de la investigación. Si no se planteare en esa misma audiencia la solicitud respectiva, el juez citará a una audiencia, a la que podrán comparecer todos los intervinientes en el procedimiento. Una vez declarado el cierre de la investigación, la suspensión condicional del procedimiento y el acuerdo reparatorio sólo podrán ser decretados durante la audiencia de preparación del juicio oral. Sin perjuicio de lo señalado precedentemente, podrán, excepcionalmente, solicitarse y decretarse la suspensión condicional del procedimiento y los acuerdos reparatorios, aun cuando hubiere finalizado la audiencia de preparación del juicio oral y hasta antes del envío del auto de apertura al tribunal de juicio oral en lo penal. …"}], "grp": "245|CPP"}, {"id": "N-VF-55", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La comunicación de la decisión de no perseverar deja sin efecto la formalización y la prescripción continúa corriendo como si nunca se hubiere interrumpido.", "f": "Art. 248 inc. final CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 248 CPP", "t": "… Practicadas las diligencias necesarias para la averiguación del hecho punible y sus autores, cómplices o encubridores, el fiscal declarará cerrada la investigación y podrá, dentro de los diez días siguientes: a) Solicitar el sobreseimiento definitivo o temporal de la causa; b) Formular acusación, cuando estimare que la investigación proporciona fundamento serio para el enjuiciamiento del imputado contra quien se hubiere formalizado la misma, o c) Comunicar la decisión del ministerio público de no perseverar en el procedimiento, por no haberse reunido durante la investigación los antecedentes suficientes para fundar una acusación. La comunicación de la decisión contemplada en la letra c) precedente dejará sin efecto la formalización de la investigación, dará lugar a que el juez revoque las medidas cautelares que se hubieren decretado, y la prescripción de la acción penal continuará corriendo como si nunca se hubiere interrumpido."}], "grp": "248|CPP"}, {"id": "N-VF-56", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Si el fiscal se allana al cierre de la investigación en la audiencia del artículo 247, dispone de diez días para deducir acusación.", "f": "Art. 247 inc. 4° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 247 CPP", "t": "… cuenta de ello al fiscal regional o el Fiscal Jefe de la Fiscalía Supraterritorial, si corresponde. Transcurrido tal plazo sin que el fiscal se pronuncie o si, compareciendo, se negare a declarar cerrada la investigación, el juez decretará el sobreseimiento definitivo de la causa, informando de ello al fiscal regional o al Fiscal Jefe de la Fiscalía Supraterritorial, si corresponde, a fin de que éste aplique las sanciones disciplinarias correspondientes. Esta resolución será apelable. Si el fiscal se allanare a la solicitud de cierre de la investigación, deberá formular en la audiencia la declaración en tal sentido y tendrá el plazo de diez días para deducir acusación. Transcurrido este plazo sin que se hubiere deducido …"}], "grp": "247|CPP"}, {"id": "N-VF-57", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El archivo provisional puede decretarse aunque ya se haya producido la intervención del juez de garantía en el procedimiento.", "f": "Art. 167 inc. 1° CPP: procede en tanto no se hubiere producido la intervención del juez de garantía.", "g": "N", "r": 0, "x": [{"c": "Art. 167 CPP", "t": "Artículo 167.- Archivo provisional. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}], "grp": "167|CPP"}, {"id": "N-VF-58", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El principio de oportunidad no procede respecto del imputado beneficiado con él dentro de los dos años anteriores al hecho.", "f": "Art. 170 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 170 CPP", "t": "Artículo 170.- Principio de oportunidad. Los fiscales del ministerio público podrán no iniciar la persecución penal o abandonar la ya iniciada cuando se tratare de un hecho que no comprometiere gravemente el interés público, a menos que la pena mínima asignada al delito excediere la de presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. Tampoco procederá el ejercicio de esta facultad respecto del imputado que hubiere sido beneficiado con ella dentro de los dos años anteriores al hecho de que se trate, contados desde la resolución que lo tuvo por comunicado. El ejercicio de esta facultad se regulará mediante Art. …"}], "grp": "170|CPP"}, {"id": "N-VF-59", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Presentada la acusación, la audiencia de preparación del juicio oral debe realizarse en un plazo no inferior a veinticinco ni superior a treinta y cinco días.", "f": "Art. 260 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 260 CPP", "t": "Artículo 260.- Citación a la audiencia. Presentada la acusación, el juez de garantía ordenará su notificación a todos los intervinientes y citará, dentro de las veinticuatro horas siguientes, a la audiencia de preparación del juicio oral, la que deberá tener lugar en un plazo no inferior a veinticinco ni superior a treinta y cinco días. Al acusado se le entregará la copia de la acusación, en la que se dejará constancia, además, del hecho de encontrarse a su disposición, en el tribunal, los antecedentes acumulados durante la investigación."}], "grp": "260|CPP"}, {"id": "N-VF-60", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El querellante puede adherir a la acusación o acusar particularmente hasta quince días antes de la audiencia de preparación del juicio oral.", "f": "Art. 261 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 261 CPP", "t": "Artículo 261.- Actuación del querellante. Hasta quince días antes de la fecha fijada para la realización de la audiencia de preparación del juicio oral, el querellante, por escrito, podrá: a) Adherir a la acusación del ministerio público o acusar particularmente. En este segundo caso, podrá plantear una distinta calificación de los hechos, otras formas de participación del acusado, solicitar otra pena o ampliar la acusación del fiscal, extendiéndola a hechos o a imputados distintos, siempre que hubieren sido objeto de la formalización de la investigación; b) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; c) Ofrecer la prueba que estimare necesaria para sustentar su acusación, lo que deberá hacerse en los mismos términos previstos en el artículo 259, y d) Deducir demanda civil, cuando procediere."}], "grp": "261|CPP"}, {"id": "N-VF-61", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El acusado sólo puede ejercer las facultades del artículo 263 del Código Procesal Penal por escrito y hasta la víspera de la audiencia de preparación.", "f": "Art. 263 CPP: por escrito hasta la víspera, o verbalmente al inicio de la audiencia.", "g": "N", "r": 0, "x": [{"c": "Art. 263 CPP", "t": "Artículo 263.- Facultades del acusado. Hasta la víspera del inicio de la audiencia de preparación del juicio oral, por escrito, o al inicio de dicha audiencia, en forma verbal, el acusado podrá: a) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; b) Deducir excepciones de previo y especial pronunciamiento, y c) Exponer los argumentos de defensa que considere necesarios y señalar los medios de prueba cuyo examen en el juicio oral solicitare, en los mismos términos previstos en el artículo 259."}], "grp": "263|CPP"}, {"id": "N-VF-62", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La presencia del fiscal y del defensor en la audiencia de preparación del juicio oral es requisito de validez.", "f": "Art. 269 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 269 CPP", "t": "Artículo 269.- Comparecencia del fiscal y del defensor. La presencia del fiscal y del defensor del imputado durante la audiencia constituye un requisito de validez de la misma. Si en la audiencia se ventilare la aprobación de convenciones probatorias, procedimiento abreviado, suspensión condicional del procedimiento o un acuerdo reparatorio, o cualquier otra actuación en que la ley exigiere expresamente la participación del imputado, su presencia constituirá un requisito de validez de aquella. La inasistencia o el abandono injustificado de la Art. audiencia por parte del fiscal deberá ser subsanada de inmediato por el tribunal, el que, además, pondrá este hecho en conocimiento del fiscal regional respectivo o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda para que determine la responsabilidad del fiscal ausente, de conformidad a lo que disponga la ley orgánica constitucional del Ministerio Público. …"}], "grp": "269|CPP"}, {"id": "N-VF-63", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La suspensión de la audiencia de preparación para corregir vicios formales no puede exceder de cinco días.", "f": "Art. 270 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 270 CPP", "t": "Artículo 270.- Corrección de vicios formales en la audiencia de preparación del juicio oral. Cuando el juez considerare que la acusación del fiscal, la del querellante o la demanda civil adolecen de vicios formales, ordenará que los mismos sean subsanados, sin suspender la audiencia, si ello fuere posible. En caso contrario, ordenará la suspensión de la misma por el período necesario para la corrección del procedimiento, el que en ningún caso podrá exceder de cinco días. Transcurrido este plazo, si la acusación del querellante o la demanda civil no hubieren sido rectificadas, se tendrán por no presentadas. Si no lo hubiere sido la acusación del fiscal, a petición de éste, el juez podrá conceder una prórroga hasta por otros cinco días, sin perjuicio de lo cual informará al fiscal regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. …"}], "grp": "270|CPP"}, {"id": "N-VF-64", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Si el Ministerio Público no subsana oportunamente los vicios formales de su acusación y no hay querellante que haya acusado, el juez decreta el sobreseimiento definitivo.", "f": "Art. 270 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 270 CPP", "t": "… fuere posible. En caso contrario, ordenará la suspensión de la misma por el período necesario para la corrección del procedimiento, el que en ningún caso podrá exceder de cinco días. Transcurrido este plazo, si la acusación del querellante o la demanda civil no hubieren sido rectificadas, se tendrán por no presentadas. Si no lo hubiere sido la acusación del fiscal, a petición de éste, el juez podrá conceder una prórroga hasta por otros cinco días, sin perjuicio de lo cual informará al fiscal regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el ministerio público no subsanare oportunamente los vicios, el juez procederá a decretar el sobreseimiento definitivo de la causa, a menos que existiere querellante particular, que hubiere deducido acusación o se hubiere adherido a la del fiscal. …"}], "grp": "270|CPP"}, {"id": "N-VF-65", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El auto de apertura se remite al tribunal de juicio oral no antes de las veinticuatro ni después de las setenta y dos horas siguientes a que queda firme.", "f": "Art. 281 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 281 CPP", "t": "Artículo 281.- Fecha, lugar, integración y citaciones. El juez de garantía hará llegar el auto de apertura del juicio oral al tribunal competente, no antes de las veinticuatro horas ni después de las setenta y dos horas siguientes al momento en que quedare firme. También pondrá a disposición del tribunal de juicio Art. oral en lo penal las personas sometidas a prisión preventiva o a otras medidas cautelares personales. Una vez distribuida la causa, cuando procediere, el Art. juez presidente de la sala respectiva procederá de inmediato a decretar la fecha para la celebración de la audiencia del mismo, la que deberá tener lugar no antes de quince ni después de sesenta días desde la notificación del auto de apertura del juicio oral. …"}], "grp": "281|CPP"}, {"id": "N-VF-66", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La audiencia de juicio oral debe tener lugar no antes de quince ni después de sesenta días desde la notificación del auto de apertura.", "f": "Art. 281 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 281 CPP", "t": "… El juez de garantía hará llegar el auto de apertura del juicio oral al tribunal competente, no antes de las veinticuatro horas ni después de las setenta y dos horas siguientes al momento en que quedare firme. También pondrá a disposición del tribunal de juicio Art. oral en lo penal las personas sometidas a prisión preventiva o a otras medidas cautelares personales. Una vez distribuida la causa, cuando procediere, el Art. juez presidente de la sala respectiva procederá de inmediato a decretar la fecha para la celebración de la audiencia del mismo, la que deberá tener lugar no antes de quince ni después de sesenta días desde la notificación del auto de apertura del juicio oral. …"}], "grp": "281|CPP"}, {"id": "N-VF-67", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La suspensión de la audiencia o la interrupción del juicio oral por más de diez días impide su continuación y obliga a decretar la nulidad de lo obrado.", "f": "Art. 283 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 283 CPP", "t": "… Al reanudarla, efectuará un breve resumen de los actos realizados hasta ese momento. El juicio se suspenderá por las causas señaladas en el artículo 252. Con todo, el juicio seguirá adelante cuando la declaración de rebeldía se produjere respecto del imputado a quien se le hubiere otorgado la posibilidad de prestar declaración en el juicio oral, siempre que el tribunal estimare que su ulterior presencia no resulta indispensable para la prosecución del juicio o cuando sólo faltare la dictación de la sentencia. La suspensión de la audiencia o la interrupción del juicio oral por un período que excediere de diez días impedirá su continuación. En tal caso, el tribunal deberá decretar la nulidad de lo obrado en él y ordenar su reinicio. …"}], "grp": "283|CPP"}, {"id": "N-VF-68", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Cuando el juicio se ha prolongado por más de dos días y la complejidad lo exige, el tribunal puede prolongar su deliberación hasta por veinticuatro horas.", "f": "Art. 343 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 343 CPP", "t": "Artículo 343.- Decisión sobre absolución o condena. Una vez concluida la deliberación privada de los jueces, de conformidad a lo previsto en el artículo 339, la sentencia definitiva que recayere en el juicio oral deberá ser pronunciada en la audiencia respectiva, comunicándose la decisión relativa a la absolución o condena del acusado por cada uno de los delitos que se le imputaren, indicando respecto de cada uno de ellos los fundamentos principales tomados en consideración para llegar a dichas conclusiones. Excepcionalmente, cuando la audiencia del juicio se hubiere prolongado por más de dos días y la complejidad del caso no permitiere pronunciar la decisión inmediatamente, el tribunal podrá prolongar su deliberación hasta por veinticuatro horas, hecho que será dado a conocer a los intervinientes en la misma audiencia, fijándose de inmediato la oportunidad en que la decisión les será comunicada. …"}], "grp": "343|CPP"}, {"id": "N-VF-69", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El tribunal de juicio oral puede diferir la redacción del fallo hasta por un plazo de diez días.", "f": "Art. 344 inc. 1° CPP (según la versión vigente del Código).", "g": "N", "r": 1, "x": [{"c": "Art. 344 CPP", "t": "Artículo 344. Plazo para redacción de la sentencia. Al pronunciarse sobre la absolución o condena, el tribunal podrá diferir la redacción del fallo y, en su caso, la determinación de la pena hasta por un plazo de diez días, fijando la fecha de la audiencia en que tendrá lugar su lectura. No obstante, si el juicio hubiere durado más de cinco días, el tribunal dispondrá, para la fijación de la fecha de la audiencia para su comunicación, de un día adicional por cada dos de exceso de duración del juicio. En ambos casos, si el vencimiento del plazo para la redacción del fallo coincidiere con un día domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o festivo. …"}], "grp": "344|CPP"}, {"id": "N-VF-70", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Para el abono a la pena, se computa un día por cada día completo o fracción igual o superior a doce horas de detención, prisión preventiva o privación de libertad del artículo 155 letra a).", "f": "Art. 348 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 348 CPP", "t": "… La sentencia condenatoria fijará todas las penas principales y accesorias que corresponda imponer, con indicación específica de cada una de ellas, y se pronunciará sobre la eventual aplicación de alguna de las penas sustitutivas a la privación o restricción de libertad previstas en la ley. La sentencia que condenare a una pena temporal deberá expresar con toda precisión el día desde el cual empezará ésta a contarse y fijará el tiempo de detención, prisión preventiva y privación de libertad impuesta en conformidad a la letra a) del artículo 155 que deberá servir de abono para su cumplimiento. Para estos efectos, se abonará a la pena impuesta un día por cada día completo, o fracción igual o superior a doce horas, de dichas medidas cautelares que hubiere cumplido el condenado. …"}], "grp": "348|CPP"}, {"id": "N-VF-71", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La sentencia se entiende notificada a todas las partes desde la audiencia de comunicación, aun cuando no asistan a ella.", "f": "Art. 346 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 346 CPP", "t": "Artículo 346.- Audiencia de comunicación de la sentencia. Una vez redactada la sentencia, de conformidad a lo previsto en el artículo 342, se procederá a darla a conocer en la audiencia fijada al efecto, oportunidad a contar de la cual se entenderá notificada a todas las partes, aun cuando no asistieren a la misma."}], "grp": "346|CPP"}, {"id": "N-VF-72", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "El recurso de nulidad debe interponerse dentro de los diez días siguientes a la notificación de la sentencia definitiva.", "f": "Art. 372 inc. 2° CPP vigente: dentro de los quince días siguientes.", "g": "N", "r": 0, "x": [{"c": "Art. 372 CPP", "t": "Artículo 372.- Del recurso de nulidad. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda, por las causales expresamente señaladas en la ley. Deberá interponerse, por escrito, dentro de los quince Art. días siguientes a la notificación de la sentencia definitiva, ante el tribunal que hubiere conocido del juicio oral. No obstante, si el juicio hubiere durado más de cinco días, el recurrente dispondrá para la interposición del recurso de un día adicional por cada dos de exceso de duración del juicio. En ningún caso este plazo podrá ser superior a treinta días. Si el vencimiento del plazo para la interposición del recurso coincide con un domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o …"}], "grp": "372|CPP"}, {"id": "N-VF-73", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Si el juicio duró más de cinco días, el plazo para recurrir de nulidad aumenta un día por cada dos de exceso, sin que pueda superar treinta días.", "f": "Art. 372 inc. 3° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 372 CPP", "t": "Artículo 372.- Del recurso de nulidad. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda, por las causales expresamente señaladas en la ley. Deberá interponerse, por escrito, dentro de los quince Art. días siguientes a la notificación de la sentencia definitiva, ante el tribunal que hubiere conocido del juicio oral. No obstante, si el juicio hubiere durado más de cinco días, el recurrente dispondrá para la interposición del recurso de un día adicional por cada dos de exceso de duración del juicio. En ningún caso este plazo podrá ser superior a treinta días. Si el vencimiento del plazo para la interposición del recurso coincide con un domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o …"}], "grp": "372|CPP"}, {"id": "N-VF-74", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La interposición del recurso de nulidad suspende los efectos de la sentencia condenatoria recurrida.", "f": "Art. 379 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 379 CPP", "t": "Artículo 379.- Efectos de la interposición del recurso. La interposición del recurso de nulidad suspende los efectos de la sentencia condenatoria recurrida. En lo demás, se aplicará lo dispuesto en el artículo 355. Interpuesto el recurso, no podrán invocarse nuevas causales. Con todo, la Corte, de oficio, podrá acoger el recurso que se hubiere deducido en favor del imputado por un motivo distinto del invocado por el recurrente, siempre que aquél fuere alguno de los señalados en el artículo 374."}], "grp": "379|CPP"}, {"id": "N-VF-75", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Interpuesto el recurso de nulidad, el recurrente puede invocar nuevas causales hasta antes de la vista.", "f": "Art. 379 inc. 2° CPP: interpuesto el recurso no pueden invocarse nuevas causales.", "g": "N", "r": 0, "x": [{"c": "Art. 379 CPP", "t": "Artículo 379.- Efectos de la interposición del recurso. La interposición del recurso de nulidad suspende los efectos de la sentencia condenatoria recurrida. En lo demás, se aplicará lo dispuesto en el artículo 355. Interpuesto el recurso, no podrán invocarse nuevas causales. Con todo, la Corte, de oficio, podrá acoger el recurso que se hubiere deducido en favor del imputado por un motivo distinto del invocado por el recurrente, siempre que aquél fuere alguno de los señalados en el artículo 374."}], "grp": "379|CPP"}, {"id": "N-VF-76", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La Corte puede acoger de oficio un recurso de nulidad deducido en favor del imputado por un motivo distinto del invocado, siempre que sea alguno de los del artículo 374.", "f": "Art. 379 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 379 CPP", "t": "Artículo 379.- Efectos de la interposición del recurso. La interposición del recurso de nulidad suspende los efectos de la sentencia condenatoria recurrida. En lo demás, se aplicará lo dispuesto en el artículo 355. Interpuesto el recurso, no podrán invocarse nuevas causales. Con todo, la Corte, de oficio, podrá acoger el recurso que se hubiere deducido en favor del imputado por un motivo distinto del invocado por el recurrente, siempre que aquél fuere alguno de los señalados en el artículo 374."}], "grp": "379|CPP"}, {"id": "N-VF-77", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Ingresado el recurso de nulidad a la Corte, las demás partes tienen cinco días para pedir que se declare inadmisible, adherirse o formular observaciones.", "f": "Art. 382 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 382 CPP", "t": "Artículo 382.- Actuaciones previas al conocimiento del recurso. Ingresado el recurso a la Corte, se abrirá un plazo de cinco días para que las demás partes solicitaren que se le declare inadmisible, se adhirieren a él o le formularen observaciones por escrito. La adhesión al recurso deberá cumplir con todos los requisitos necesarios para interponerlo y su admisibilidad se resolverá de plano por la Corte. Hasta antes de la audiencia en que se conociere el recurso, el acusado podrá solicitar la designación de un defensor penal público con domicilio en la ciudad asiento de la Corte, para que asuma su representación, cuando el juicio oral se hubiere desarrollado en una ciudad distinta."}], "grp": "382|CPP"}, {"id": "N-VF-78", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La Corte debe fallar el recurso de nulidad dentro de los veinte días siguientes a la fecha en que terminó de conocer de él.", "f": "Art. 384 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 384 CPP", "t": "Artículo 384.- Fallo del recurso. La Corte deberá fallar el recurso dentro de los veinte días siguientes a la fecha en que hubiere terminado de conocer de él. En la sentencia, el tribunal deberá exponer los fundamentos que sirvieren de base a su decisión; pronunciarse sobre las cuestiones controvertidas, salvo que acogiere el recurso, en cuyo caso podrá limitarse a la causal o causales que le hubieren sido suficientes, y declarar si es nulo o no total o parcialmente el juicio oral y la sentencia definitiva reclamados, o si solamente es nula dicha sentencia, en los casos que se indican en el artículo siguiente. El fallo del recurso se dará a conocer en la audiencia Art. indicada al efecto, con la lectura de su parte resolutiva o de una breve síntesis de la misma."}], "grp": "384|CPP"}, {"id": "N-VF-79", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "El recurso de apelación se entabla dentro de los cinco días siguientes a la notificación de la resolución impugnada.", "f": "Art. 366 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 366 CPP", "t": "Artículo 366.- Plazo para interponer el recurso de apelación. El recurso de apelación deberá entablarse dentro de los cinco días siguientes a la notificación de la resolución impugnada."}], "grp": "366|CPP"}, {"id": "N-VF-80", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "El recurso de hecho se interpone ante el tribunal de alzada dentro de tercero día.", "f": "Art. 369 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 369 CPP", "t": "Artículo 369.- Recurso de hecho. Denegado el recurso de apelación, concedido siendo improcedente u otorgado con efectos no ajustados a derecho, los intervinientes podrán ocurrir de hecho, dentro de tercero día, ante el tribunal de alzada, con el fin de que resuelva si hubiere lugar o no al recurso y cuáles debieren ser sus efectos. Presentado el recurso, el tribunal de alzada solicitará, cuando correspondiere, los antecedentes señalados en el artículo 371 y luego fallará en cuenta. Si acogiere el recurso por haberse denegado la apelación, retendrá tales antecedentes o los recabará, si no los hubiese pedido, para pronunciarse sobre la apelación."}], "grp": "369|CPP"}, {"id": "N-VF-81", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Las resoluciones dictadas por un tribunal de juicio oral en lo penal son inapelables.", "f": "Art. 364 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 364 CPP", "t": "Artículo 364.- Resoluciones inapelables. Serán inapelables las resoluciones dictadas por un tribunal de juicio oral en lo penal."}], "grp": "364|CPP"}, {"id": "N-VF-82", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "El conocimiento del recurso de nulidad fundado en la causal del artículo 373 letra a) corresponde a la Corte Suprema.", "f": "Art. 376 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 376 CPP", "t": "… La respectiva Corte de Apelaciones conocerá de los recursos que se fundaren en las causales señaladas en el artículo 373, letra b), y en el artículo 374. No obstante lo dispuesto en el inciso precedente, cuando el recurso se fundare en la causal prevista en el artículo 373, letra b), y respecto de la materia de derecho objeto del mismo existieren distintas interpretaciones sostenidas en diversos fallos emanados de los tribunales superiores, corresponderá pronunciarse a la Corte Suprema. Del mismo modo, si un recurso se fundare en distintas causales y por aplicación de las reglas contempladas en los incisos precedentes correspondiere el conocimiento de al menos una de ellas a la Corte Suprema, ésta se pronunciará sobre todas. …"}], "grp": "376|CPP"}, {"id": "N-VF-83", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "El procedimiento simplificado se aplica a los simples delitos para los que el Ministerio Público requiere una pena que no exceda de presidio o reclusión menores en su grado mínimo.", "f": "Art. 388 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 388 CPP", "t": "Artículo 388.- Ámbito de aplicación. El conocimiento y fallo de las faltas se sujetará al procedimiento previsto en este Título. El procedimiento se aplicará, además, respecto de los hechos constitutivos de simple delito para los cuales el ministerio público requiriere la imposición de una pena que no excediere de presidio o reclusión menores en su grado mínimo."}], "grp": "388|CPP"}, {"id": "N-VF-84", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento monitorio el imputado puede reclamar del requerimiento y de la multa dentro de los quince días siguientes a su notificación.", "f": "Art. 392 letra a) CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 392 CPP", "t": "Artículo 392.- Procedimiento monitorio. Se aplicará el procedimiento monitorio a la tramitación de las faltas respecto de las cuales el fiscal pidiere sólo pena de multa. En el requerimiento señalado en el artículo precedente el fiscal indicará el monto de la multa que solicitare imponer. Si el juez estimare suficientemente fundado el requerimiento y la proposición relativa a la multa, deberá acogerlos inmediatamente, dictando una resolución que así lo declare. Dicha resolución contendrá, además, las siguientes indicaciones: a) La instrucción acerca del derecho del imputado de reclamar en contra del requerimiento y de la imposición de la sanción, dentro de los quince días siguientes a su notificación, así como de los efectos de la interposición del reclamo; …"}], "grp": "392|CPP"}, {"id": "N-VF-85", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La audiencia del procedimiento simplificado no puede tener lugar antes de veinte ni después de cuarenta días desde la fecha de la resolución que cita a ella.", "f": "Art. 393 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 393 CPP", "t": "Artículo 393.- Citación a audiencia. Recibido el requerimiento, el tribunal ordenará su notificación al imputado y citará a todos los intervinientes a la audiencia a que se refiere el artículo 394, la que no podrá tener lugar antes de veinte ni después de cuarenta días contados desde la fecha de la resolución. El imputado deberá ser citado con, a lo menos, diez días de anticipación a la fecha de la audiencia. La citación del imputado se hará bajo el apercibimiento señalado en el artículo 33 y a la misma se acompañarán copias del requerimiento y de la querella, en su caso. En el procedimiento simplificado no procederá la interposición de demandas civiles, salvo aquella que tuviere por objeto la restitución de la cosa o su valor. …"}], "grp": "393|CPP"}, {"id": "N-VF-86", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento simplificado procede toda clase de demandas civiles.", "f": "Art. 393 inc. 2° CPP: sólo la que tenga por objeto la restitución de la cosa o su valor.", "g": "N", "r": 0, "x": [{"c": "Art. 393 CPP", "t": "… Recibido el requerimiento, el tribunal ordenará su notificación al imputado y citará a todos los intervinientes a la audiencia a que se refiere el artículo 394, la que no podrá tener lugar antes de veinte ni después de cuarenta días contados desde la fecha de la resolución. El imputado deberá ser citado con, a lo menos, diez días de anticipación a la fecha de la audiencia. La citación del imputado se hará bajo el apercibimiento señalado en el artículo 33 y a la misma se acompañarán copias del requerimiento y de la querella, en su caso. En el procedimiento simplificado no procederá la interposición de demandas civiles, salvo aquella que tuviere por objeto la restitución de la cosa o su valor. …"}], "grp": "393|CPP"}, {"id": "N-VF-87", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "Si el imputado admite responsabilidad en el procedimiento simplificado, el fiscal puede solicitar una pena inferior en un grado al mínimo de los señalados por la ley.", "f": "Art. 395 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 395 CPP", "t": "Artículo 395.- Resolución inmediata. Una vez efectuado lo prescrito en el artículo anterior, el tribunal preguntará al imputado si admite responsabilidad en los hechos contenidos en el requerimiento o si, por el contrario, solicitará la realización de la audiencia. Para los efectos de lo dispuesto en el presente inciso, en caso de que del imputado admitiere su responsabilidad, el fiscal podrá modificar la pena requerida y solicitar una pena inferior en un grado al mínimo de los señalados por la ley y en el caso de la multa, podrá solicitar una inferior al mínimo legal. Con todo, la regla señalada en el inciso anterior Art. sobre la facultad del fiscal para modificar la pena, sólo será aplicable en la primera audiencia a la que se haya citado al imputado, o en la nueva audiencia a la que se le deba citar, cuando …"}], "grp": "395|CPP"}, {"id": "N-VF-88", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el juicio simplificado, el texto escrito de la sentencia debe darse a conocer en una audiencia fijada dentro de los cinco días próximos.", "f": "Art. 396 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 396 CPP", "t": "… El juicio simplificado deberá tener lugar en la misma audiencia en que se proceda con su preparación, si ello fuere posible, o a más tardar dentro de trigésimo día. El juicio simplificado comenzará dándose lectura al Art. requerimiento del fiscal y a la querella, si la hubiere. En seguida, se oirá a los comparecientes y se recibirá la prueba, tras lo cual se preguntará al imputado si tuviere algo que agregar. Con su nueva declaración o sin ella, el juez pronunciará su decisión de absolución o condena, y fijará una nueva audiencia, para dentro de los cinco días próximos, para dar a conocer el texto escrito de la sentencia. Sin perjuicio de lo anterior, si el vencimiento del plazo para la redacción del fallo coincidiere con un día domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea …"}], "grp": "396|CPP"}, {"id": "N-VF-89", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento abreviado la sentencia condenatoria puede fundarse exclusivamente en la aceptación de los hechos por el imputado.", "f": "Art. 412 inc. 2° CPP: no puede emitirse exclusivamente sobre la base de esa aceptación.", "g": "N", "r": 0, "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}], "grp": "412|CPP"}, {"id": "N-VF-90", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La sentencia del procedimiento abreviado no se pronuncia sobre la demanda civil interpuesta.", "f": "Art. 412 inc. final CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}], "grp": "412|CPP"}, {"id": "N-VF-91", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La extradición activa procede cuando la investigación formalizada se refiere a un delito con pena privativa de libertad cuya duración mínima excede de un año.", "f": "Art. 431 inc. 1° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 431 CPP", "t": "Artículo 431.- Procedencia de la extradición activa. Cuando en la tramitación de un procedimiento penal se hubiere formalizado la investigación por un delito que tuviere señalada en la ley una pena privativa de libertad cuya duración mínima excediere de un año, respecto de un individuo que se encontrare en país extranjero, el ministerio público deberá solicitar del juez de garantía que eleve los antecedentes a la Corte de Apelaciones, a fin de que este tribunal, si estimare procedente la extradición del imputado al país en el que actualmente se encontrare, ordene sea pedida. Igual solicitud podrá hacer el querellante, si no la formulare el ministerio público. El mismo procedimiento se empleará en los casos enumerados en el artículo 6º del Código Orgánico de Tribunales. …"}], "grp": "431|CPP"}, {"id": "N-VF-92", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "Para la extradición activa, el juez de garantía eleva los antecedentes a la Corte Suprema.", "f": "Art. 431 inc. 1° CPP: los eleva a la Corte de Apelaciones.", "g": "N", "r": 0, "x": [{"c": "Art. 431 CPP", "t": "Artículo 431.- Procedencia de la extradición activa. Cuando en la tramitación de un procedimiento penal se hubiere formalizado la investigación por un delito que tuviere señalada en la ley una pena privativa de libertad cuya duración mínima excediere de un año, respecto de un individuo que se encontrare en país extranjero, el ministerio público deberá solicitar del juez de garantía que eleve los antecedentes a la Corte de Apelaciones, a fin de que este tribunal, si estimare procedente la extradición del imputado al país en el que actualmente se encontrare, ordene sea pedida. Igual solicitud podrá hacer el querellante, si no la formulare el ministerio público. El mismo procedimiento se empleará en los casos enumerados en el artículo 6º del Código Orgánico de Tribunales. …"}], "grp": "431|CPP"}, {"id": "N-VF-93", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La revisión de una sentencia firme puede pedirse en cualquier tiempo.", "f": "Art. 474 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 474 CPP", "t": "Artículo 474.- Plazo y titulares de la solicitud de revisión. La revisión de la sentencia firme podrá ser pedida, en cualquier tiempo, por el ministerio público, por el condenado, o su cónyuge o conviviente civil, ascendientes, descendientes o hermanos de éste. Asimismo, podrá interponer tal solicitud quien hubiere cumplido su condena o sus herederos, cuando el condenado hubiere muerto y se tratare de rehabilitar su memoria."}], "grp": "474|CPP"}, {"id": "N-VF-94", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional dura ocho años en su cargo y no puede ser designado para el período siguiente.", "f": "Art. 85 CPR y art. 16 Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}, {"c": "Art. 16 Ley 19.640", "t": "Artículo 16.- El Fiscal Nacional durará ocho años en su cargo y no podrá ser designado para el período siguiente. Si el Fiscal Nacional dejare de servir su cargo por Art. ÚNICO N° 2 razones diversas de la expiración del plazo legal de duración de sus funciones, la Corte Suprema llamará a concurso público dentro de tercero día de ocurrido ese hecho. Los plazos de días contemplados en este artículo y en el precedente serán de días corridos. El inciso 2º del Ar
