tículo 85 de la Constitución Política de la República, aprobada por el Decreto 100, Secretaría General de la Presidencia, publicado el 22.09.2005, dispone que el Fiscal Nacional durará 8 años en el ejercicio de sus funciones."}], "grp": "85|CPR"}, {"id": "N-VF-95", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Para ser nombrado Fiscal Nacional se requiere tener a lo menos diez años el título de abogado y haber cumplido cuarenta años de edad.", "f": "Art. 14 Ley 19.640 y art. 85 CPR.", "g": "N", "r": 1, "x": [{"c": "Art. 14 Ley 19.640", "t": "Artículo 14.- Para ser nombrado Fiscal Nacional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos diez años el título de abogado; c) Haber cumplido cuarenta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}, {"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}], "grp": "14|Ley 19.640"}, {"id": "N-VF-96", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Para ser nombrado Fiscal Regional se requiere tener a lo menos diez años el título de abogado.", "f": "Art. 31 Ley 19.640: cinco años de título y treinta años de edad.", "g": "N", "r": 0, "x": [{"c": "Art. 31 Ley 19.640", "t": "Artículo 31.- Para ser nombrado Fiscal Regional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos cinco años el título de abogado; c) Haber cumplido treinta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}], "grp": "31|Ley 19.640"}, {"id": "N-VF-97", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El acuerdo del Senado para designar al Fiscal Nacional requiere los dos tercios de sus miembros en ejercicio.", "f": "Art. 85 inc. 1° CPR.", "g": "N", "r": 1, "x": [{"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}], "grp": "85|CPR"}, {"id": "N-VF-98", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "La quina para Fiscal Nacional se forma en una misma y única votación en que cada integrante del pleno de la Corte Suprema vota por tres personas.", "f": "Art. 87 CPR y art. 15 Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 87 CPR", "t": "Artículo 87.- La Corte Suprema y las Cortes de Apelaciones, en su caso, llamarán a concurso público de antecedentes para la integración de las quinas y ternas, las que serán acordadas por la mayoría absoluta de sus miembros en ejercicio, en pleno especialmente convocado al efecto. No podrán integrar las quinas y ternas los miembros activos o pensionados del Poder Judicial. Las quinas y ternas se formarán en una misma y única votación en la cual cada integrante del pleno tendrá derecho a votar por tres o dos personas, respectivamente. Resultarán elegidos quienes obtengan las cinco o las tres primeras mayorías, según corresponda. De producirse un empate, éste se resolverá mediante sorteo."}, {"c": "Art. 15 Ley 19.640", "t": "Artículo 15.- Para los efectos de la designación del Fiscal Nacional, la Corte Suprema, con noventa días de anticipación a la fecha de expiración del plazo legal del Fiscal Nacional en funciones, llamará a concurso público con la adecuada difusión. Los postulantes que reúnan los requisitos legales serán recibidos en una audiencia pública citada especialmente al efecto por el pleno de la Corte Suprema, en la cual se dará a conocer la nómina de candidatos y los antecedentes presentados por cada uno de ellos. La Corte Suprema establecerá la forma en que se desarrollará esta audiencia. La quina, que será acordada por la mayoría absoluta de sus miembros en ejercicio, en pleno especialmente convocado al efecto, se formará en una misma y única votación, en la cual cada integrante del pleno tendrá derecho a votar por tres personas. …"}], "grp": "87|CPR"}, {"id": "N-VF-99", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales regionales son nombrados por el Presidente de la República a propuesta en terna de la Corte de Apelaciones respectiva.", "f": "Art. 86 CPR y art. 29 Ley 19.640: los nombra el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones.", "g": "N", "r": 0, "x": [{"c": "Art. 86 CPR", "t": "Artículo 86.- Existirá un Fiscal Regional en cada una de las regiones en que se divida administrativamente el país, a menos que la población o la extensión geográfica de la región hagan necesario nombrar más de uno. Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. En caso que en la región exista más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la Corte de más antigua creación. Los fiscales regionales deberán tener a lo menos cinco años de título de abogado, haber cumplido 30 años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; …"}, {"c": "Art. 29 Ley 19.640", "t": "Artículo 29.- Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. Si en la región existiere más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la de más antigua creación, en cuya sede se reunirán. Para formar la terna, la Corte de Apelaciones, con noventa días de anticipación a la fecha de expiración del plazo legal del Fiscal Regional en funciones, llamará a concurso público de antecedentes con la adecuada difusión, la que comprenderá al menos publicaciones en diarios de circulación nacional. Los postulantes que reúnan los requisitos legales serán recibidos en una audiencia pública citada especialmente al efecto, por el pleno de la Corte de Apelaciones, en la cual se dará a conocer la nómina …"}], "grp": "86|CPR"}, {"id": "N-VF-100", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales adjuntos cesan en su cargo al cumplir 75 años de edad.", "f": "Art. 84 CPR y art. 43 letra a) Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 84 CPR", "t": "Artículo 84.- Una ley orgánica constitucional determinará la organización y atribuciones del Ministerio Público, señalará las calidades y requisitos que deberán tener y cumplir los fiscales para su nombramiento y las causales de remoción de los fiscales adjuntos, en lo no contemplado en la Constitución. Las personas que sean designadas fiscales no podrán tener impedimento alguno que las inhabilite para desempeñar el cargo de juez. Los fiscales regionales, el Fiscal Jefe de la Fiscalía Supraterritorial, especializada en crimen organizado y delitos de alta complejidad, y los fiscales adjuntos cesarán en su cargo al cumplir 75 años de edad. La ley orgánica constitucional establecerá el grado 24.10.1980 de independencia y autonomía y la responsabilidad que tendrán los fiscales en la dirección de la investigación y en el ejercicio de la acción penal pública, en los casos que tengan a su cargo."}, {"c": "Art. 43 Ley 19.640", "t": "Artículo 43.- Los fiscales adjuntos cesarán en sus cargos por: a) Cumplir 75 años de edad. b) Renuncia. c) Muerte. d) Salud incompatible con el cargo o enfermedad irrecuperable, de acuerdo a lo establecido en el reglamento. e) Evaluación deficiente de su desempeño funcionario, de conformidad al reglamento. f) Incapacidad o incompatibilidad sobreviniente, cuando corresponda."}], "grp": "84|CPR"}, {"id": "N-VF-101", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional y los fiscales regionales sólo pueden ser removidos por la Corte Suprema.", "f": "Art. 89 CPR.", "g": "N", "r": 1, "x": [{"c": "Art. 89 CPR", "t": "Artículo 89.- El Fiscal Nacional y los fiscales Nº7 regionales sólo podrán ser removidos por la Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados, o de diez de sus miembros, por incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones. La Corte conocerá del asunto en pleno especialmente convocado al efecto y para acordar la remoción deberá reunir el voto conforme de la mayoría de sus miembros en ejercicio. La remoción de los fiscales regionales también podrá ser solicitada por el Fiscal Nacional. Al Fiscal Jefe de la Fiscalía Supraterritorial, único especializada en crimen organizado y delitos de alta complejidad, le será aplicable lo dispuesto en el inciso primero, además de la remoción por parte del Fiscal Nacional. …"}], "grp": "89|CPR"}, {"id": "N-VF-102", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "La acción para perseguir la responsabilidad patrimonial del Estado por conductas injustificadamente erróneas o arbitrarias del Ministerio Público prescribe en cuatro años desde la actuación dañina.", "f": "Art. 5° Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 5 Ley 19.640", "t": "Artículo 5º.- El Estado será responsable por las conductas injustificadamente erróneas o arbitrarias del Ministerio Público. La acción para perseguir esta responsabilidad patrimonial prescribirá en cuatro años, contados desde la fecha de la actuación dañina. En todo caso, no obstará a la responsabilidad que pudiese afectar al fiscal o funcionario que produjo el daño, y, cuando haya mediado culpa grave o dolo de su parte, al derecho del Estado para repetir en su contra. Artículo 5º.- En tanto no se hubieren designado todos los fiscales regionales, el Consejo General del Ministerio Público funcionará con el Fiscal Nacional, que lo presidirá, y los fiscales regionales que se hubieren nombrado."}], "grp": "5|Ley 19.640"}, {"id": "N-VF-103", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los abogados asistentes de fiscal pueden comparecer, con delegación expresa, a las audiencias de juicio oral.", "f": "Art. 2° inc. 3° Ley 19.640: actúan ante los tribunales de garantía, con excepción de las audiencias de juicio oral.", "g": "N", "r": 0, "x": [{"c": "Art. 2 Ley 19.640", "t": "Artículo 2º.- El Ministerio Público realizará sus actuaciones procesales a través de cualquiera de los fiscales que, con sujeción a lo dispuesto en la ley, intervenga en ellas. Los fiscales, en los casos que tengan a su cargo, dirigirán la investigación y ejercerán la acción penal pública con el grado de independencia, autonomía y responsabilidad que establece esta ley. Sin perjuicio de lo dispuesto en el inciso primero, el Ministerio Público también podrá realizar sus actuaciones procesales ante los tribunales de garantía, a través de los abogados asistentes de fiscal, con excepción de la comparecencia a las audiencias de juicio oral. Para tal efecto, será necesaria la delegación expresa y específica para la actuación de que se trate, por parte de un fiscal del Ministerio Público, a dichos profesionales. …"}], "grp": "2|Ley 19.640"}, {"id": "N-VF-104", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "En la Región Metropolitana de Santiago existen cuatro fiscales regionales.", "f": "Art. 28 Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 28 Ley 19.640", "t": "Artículo 28.- Existirá un fiscal regional en cada una de las regiones del país, con excepción de la Región Metropolitana de Santiago, en la que existirán cuatro fiscales regionales. Las fiscalías regionales tendrán su sede en la capital regional respectiva. En la Región Metropolitana, la sede y la distribución territorial serán determinadas por el Fiscal Nacional."}], "grp": "28|Ley 19.640"}, {"id": "N-VF-105", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "La Fiscalía Supraterritorial tiene su asiento en la ciudad de Santiago.", "f": "Art. 37 quinquies Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 37 quinquies Ley 19.640", "t": "Artículo 37 quinquies.- La Fiscalía Supraterritorial tendrá su asiento en la ciudad de Santiago."}], "grp": "37 quinquies|Ley 19.640"}, {"id": "N-VF-106", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Jefe de la Fiscalía Supraterritorial es designado por el Fiscal Nacional y es de su exclusiva confianza.", "f": "Art. 37 sexies Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 37 sexies Ley 19.640", "t": "Artículo 37 sexies.- El Fiscal Jefe de la Fiscalía Supraterritorial será designado por el Fiscal Nacional, será de su exclusiva confianza y se mantendrá en su cargo mientras cuente con ella, sin perjuicio de lo dispuesto en el inciso primero del artículo 84 y en el inciso tercero del artículo 89 de la Constitución Política de la República. El fiscal adjunto titular que hubiere sido designado Fiscal Jefe de la Fiscalía Supraterritorial, una vez cesado en su cargo por pérdida de confianza, podrá volver a asumir su cargo de origen, siempre y cuando no sea en la Fiscalía Supraterritorial. En este caso, el Fiscal Nacional podrá disponer su designación en alguna Fiscalía Regional, según las necesidades del servicio y las circunstancias del caso."}], "grp": "37 sexies|Ley 19.640"}, {"id": "N-VF-107", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Las contiendas de competencia entre una Fiscalía Regional y la Fiscalía Supraterritorial las resuelve la Corte Suprema.", "f": "Art. 37 bis inc. 4° Ley 19.640: las resuelve el Fiscal Nacional.", "g": "N", "r": 0, "x": [{"c": "Art. 37 bis Ley 19.640", "t": "Artículo 37 bis.- La Fiscalía Supraterritorial, especializada en crimen organizado y delitos de alta complejidad, desempeñará sus funciones respecto a ilícitos en los cuales existan antecedentes de la intervención de asociaciones delictivas o criminales, y cuando los hechos requieran una dirección supraterritorial o transnacional de la investigación. Estará a cargo de un Fiscal Jefe, al que corresponderá ejercer las funciones propias del Ministerio Público, por sí o por medio de los fiscales adjuntos que se encuentren bajo su dependencia. Tendrá a su cargo las investigaciones penales de hechos respecto de los cuales concurran las circunstancias descritas en el inciso primero, sea que se hayan iniciado directamente por la Fiscalía Supraterritorial o por alguna Fiscalía Regional. …"}], "grp": "37 bis|Ley 19.640"}, {"id": "N-VF-108", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "La permanencia de los fiscales adjuntos en la Fiscalía Supraterritorial no puede exceder de cinco años, renovables por una sola vez.", "f": "Art. 37 quáter inc. 3° Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 37 quáter Ley 19.640", "t": "… Fiscalía Supraterritorial. El Fiscal Jefe de la Fiscalía Supraterritorial y los fiscales adjuntos mencionados en el inciso anterior podrán desempeñar sus funciones en todo el territorio de la República, tratándose de investigaciones y procesos penales respecto de los ilícitos mencionados en el artículo 37 bis. Un reglamento dictado por el Fiscal Nacional regulará las condiciones de experiencia o especialización y las reglas especiales en materia de evaluación de desempeño tanto de los fiscales adjuntos de la Fiscalía Supraterritorial, como de los profesionales, técnicos y administrativos que trabajen en ella. Dicho reglamento regulará, además, el plazo de permanencia de los fiscales adjuntos, el que no podrá exceder de cinco años, renovables por una sola vez de conformidad con lo dispuesto en aquel, y, en tal caso, se deberán proveer las correspondientes suplencias en su fiscalía de origen en tanto ejerzan esa labor. …"}], "grp": "37 quáter|Ley 19.640"}, {"id": "N-VF-109", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales adjuntos de la Fiscalía Supraterritorial pueden desempeñar sus funciones en todo el territorio de la República respecto de los ilícitos del artículo 37 bis.", "f": "Art. 37 quáter inc. 2° Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 37 quáter Ley 19.640", "t": "Artículo 37 quater.- La Fiscalía Supraterritorial contará con fiscales adjuntos, profesionales y personal de apoyo, y con los medios materiales que determine el Fiscal Nacional, a propuesta del Fiscal Jefe de la Fiscalía Supraterritorial. El Fiscal Jefe de la Fiscalía Supraterritorial y los fiscales adjuntos mencionados en el inciso anterior podrán desempeñar sus funciones en todo el territorio de la República, tratándose de investigaciones y procesos penales respecto de los ilícitos mencionados en el artículo 37 bis. Un reglamento dictado por el Fiscal Nacional regulará las condiciones de experiencia o especialización y las reglas especiales en materia de evaluación de desempeño tanto de los fiscales adjuntos de la Fiscalía Supraterritorial, como de los profesionales, técnicos y administrativos que trabajen en ella. …"}], "grp": "37 quáter|Ley 19.640"}, {"id": "N-VF-110", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El fiscal adjunto impedido de desempeñar su cargo es subrogado, por el solo ministerio de la ley, por el abogado asistente de la misma fiscalía designado por el Fiscal Regional.", "f": "Art. 40 inc. 2° Ley 19.640.", "g": "N", "r": 1, "x": [{"c": "Art. 40 Ley 19.640", "t": "Artículo 40.- Cuando una fiscalía local cuente con más de un fiscal adjunto, la distribución de los casos entre los distintos fiscales adjuntos será realizada por el fiscal jefe de conformidad a las instrucciones que al respecto imparta el Fiscal Nacional. En todo caso, la distribución de casos deberá hacerse siempre sobre la base de criterios objetivos, tales como la carga de trabajo, la especialización y la experiencia. En todos los casos en que el fiscal adjunto se encontrare impedido de desempeñar el cargo por cualquier causa será subrogado, por el solo ministerio de la ley, con todas sus facultades y obligaciones, por el abogado asistente perteneciente a la misma fiscalía, designado por el Fiscal Regional. …"}], "grp": "40|Ley 19.640"}, {"id": "N-VF-111", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los jueces de garantía resuelven unipersonalmente los asuntos sometidos a su conocimiento.", "f": "Art. 14 inc. 1° COT.", "g": "N", "r": 1, "x": [{"c": "Art. 14 COT", "t": "Art. 14. Los juzgados de garantía estarán conformados por uno o más jueces con competencia en un mismo territorio jurisdiccional, que actúan y resuelven unipersonalmente los asuntos sometidos a su conocimiento. Corresponderá a los jueces de garantía: a) Asegurar los derechos del imputado y demás intervinientes en el proceso penal, de acuerdo a la ley procesal penal; b) Dirigir personalmente las audiencias que procedan, de conformidad a la ley procesal penal; c) Dictar sentencia, cuando corresponda, en el procedimiento abreviado que contemple la ley procesal penal; d) Conocer y fallar las faltas penales de conformidad con el procedimiento contenido en la ley procesal penal; e) Conocer y fallar, conforme a los procedimientos regulados en el Título I del Libro IV del Código Procesal Penal, las faltas e infracciones contempladas en la Ley de Alcoholes, cualquiera sea la pena que ella les asigne; …"}], "grp": "14|COT"}, {"id": "N-VF-112", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Corresponde al juez de garantía dictar sentencia en el procedimiento abreviado.", "f": "Art. 14 letra c) COT.", "g": "N", "r": 1, "x": [{"c": "Art. 14 COT", "t": "Art. 14. Los juzgados de garantía estarán conformados por uno o más jueces con competencia en un mismo territorio jurisdiccional, que actúan y resuelven unipersonalmente los asuntos sometidos a su conocimiento. Corresponderá a los jueces de garantía: a) Asegurar los derechos del imputado y demás intervinientes en el proceso penal, de acuerdo a la ley procesal penal; b) Dirigir personalmente las audiencias que procedan, de conformidad a la ley procesal penal; c) Dictar sentencia, cuando corresponda, en el procedimiento abreviado que contemple la ley procesal penal; d) Conocer y fallar las faltas penales de conformidad con el procedimiento contenido en la ley procesal penal; e) Conocer y fallar, conforme a los procedimientos regulados en el Título I del Libro IV del Código Procesal Penal, las faltas e infracciones contempladas en la Ley de Alcoholes, cualquiera sea la pena que ella les asigne; …"}], "grp": "14|COT"}, {"id": "N-VF-113", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los civiles y los menores de edad, sean víctimas o imputados, en ningún caso quedan sujetos a la competencia de los tribunales militares.", "f": "Art. 1° Ley 20.477.", "g": "N", "r": 1, "x": [{"c": "Art. 1 Ley 20.477", "t": "Artículo 1º.- Restricción de la competencia de los tribunales militares. En ningún caso, los civiles y los menores de edad, que revistan la calidad de víctimas o de imputados, estarán sujetos a la competencia de los tribunales militares. Ésta siempre se radicará en los tribunales ordinarios con competencia en materia penal. Para estos efectos, se entenderá que civil es una persona que no reviste la calidad de militar, de acuerdo al artículo 6º del Código de Justicia Militar. Artículo 1°.- Al momento de entrar en vigencia la presente ley, los juicios seguidos ante Tribunales Militares, en que se persiga la responsabilidad penal de una persona que no tuviere la calidad de militar, continuarán su tramitación ante la Justicia Ordinaria, de conformidad a los procedimientos que a esos tribunales ordinarios en materia criminal les corresponda aplicar."}], "grp": "1|Ley 20.477"}, {"id": "N-VF-114", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las penas temporales mayores duran de cinco años y un día a veinte años.", "f": "Art. 25 inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 25 CP", "t": "ART. 25. Las penas temporales mayores duran de cinco años y un día a veinte años, y las temporales menores de sesenta y un días a cinco años. Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; …"}], "grp": "25|CP"}, {"id": "N-VF-115", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las penas temporales menores duran de sesenta y un días a tres años.", "f": "Art. 25 inc. 1° CP: de sesenta y un días a cinco años.", "g": "N", "r": 0, "x": [{"c": "Art. 25 CP", "t": "ART. 25. Las penas temporales mayores duran de cinco años y un día a veinte años, y las temporales menores de sesenta y un días a cinco años. Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; …"}], "grp": "25|CP"}, {"id": "N-VF-116", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La pena de prisión dura de uno a sesenta días.", "f": "Art. 25 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 25 CP", "t": "ART. 25. Las penas temporales mayores duran de cinco años y un día a veinte años, y las temporales menores de sesenta y un días a cinco años. Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; …"}], "grp": "25|CP"}, {"id": "N-VF-117", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de los simples delitos prescribe en cinco años.", "f": "Art. 94 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}], "grp": "94|CP"}, {"id": "N-VF-118", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de crímenes con pena de presidio, reclusión o relegación perpetuos prescribe en veinte años.", "f": "Art. 94 CP: prescribe en quince años; los demás crímenes, en diez.", "g": "N", "r": 0, "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}], "grp": "94|CP"}, {"id": "N-VF-119", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las penas de faltas impuestas por sentencia ejecutoria prescriben en seis meses.", "f": "Art. 97 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 97 CP", "t": "ART. 97. Las penas impuestas por sentencia ejecutoria prescriben: La de presidio, reclusión y relegación perpetuos, en quince años. Las demás penas de crímenes, en diez años. Las penas de simples delitos, en cinco años. Las de faltas, en seis meses."}], "grp": "97|CP"}, {"id": "N-VF-120", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Si la prosecución del procedimiento se paraliza por tres años, la prescripción de la acción penal continúa como si no se hubiere interrumpido.", "f": "Art. 96 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 96 CP", "t": "ART. 96. Esta prescripción se interrumpe, perdiéndose el tiempo trascurrido, siempre que el delincuente comete nuevamente crimen o simple delito, y se suspende desde que el procedimiento se dirige contra él; pero si se paraliza su prosecución por tres años o se termina sin condenarle, continúa la prescripción como si no se hubiere interrumpido."}], "grp": "96|CP"}, {"id": "N-VF-121", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Cuando el responsable se ausenta del territorio de la República, para la prescripción se cuenta un día por cada dos de ausencia.", "f": "Art. 100 inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 100 CP", "t": "ART. 100. Cuando el responsable se ausentare del territorio de la República sólo podrá prescribir la acción penal o la pena contando por uno cada dos días de ausencia, para el cómputo de los años. Para los efectos de aplicar la prescripción de la acción penal o de la pena, no se entenderán ausentes del territorio nacional los que hubieren estado sujetos a prohibición o impedimento de ingreso al país por decisión de la autoridad política o administrativa, por el tiempo que les hubiere afectado tal prohibición o impedimento."}], "grp": "100|CP"}, {"id": "N-VF-122", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las agravantes de reincidencia de los números 15 y 16 del artículo 12 no se consideran, tratándose de simples delitos, después de cinco años desde el hecho.", "f": "Art. 104 CP: diez años para crímenes y cinco para simples delitos.", "g": "N", "r": 1, "x": [{"c": "Art. 104 CP", "t": "ART. 104. Las circunstancias agravantes comprendidas en los núms. 15 y 16 del art. 12, no se tomarán en cuenta tratándose de crímenes, después de diez años, a contar desde la fecha en que tuvo lugar el hecho, ni después de cinco, en los casos de simples delitos."}], "grp": "104|CP"}, {"id": "N-VF-123", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La conspiración y la proposición para cometer un crimen o simple delito son siempre punibles.", "f": "Art. 8° inc. 1° CP: sólo son punibles en los casos en que la ley las pena especialmente.", "g": "N", "r": 0, "x": [{"c": "Art. 8 CP", "t": "ART. 8. La conspiración y proposición para cometer un crimen o un simple delito, sólo son punibles en los casos en que la ley las pena especialmente. La conspiración existe cuando dos o más personas se conciertan para la ejecución del crimen o simple delito. La proposición se verifica cuando el que ha resuelto cometer un crimen o un simple delito, propone su ejecución a otra u otras personas. Exime de toda pena por la conspiración o proposición para cometer un crimen o un simple delito, el desistimiento de la ejecución de éstos antes de principiar a ponerlos por obra y de iniciarse procedimiento judicial contra el culpable, con tal que denuncie a la autoridad pública el plan y sus circunstancias."}], "grp": "8|CP"}, {"id": "N-VF-124", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La duración de las penas temporales se cuenta desde el día de la aprehensión del imputado.", "f": "Art. 26 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 26 CP", "t": "ART. 26. La duración de las penas temporales empezará a contarse desde el día de la aprehensión del imputado. PENAS QUE LLEVAN CONSIGO OTRAS ACCESORIAS."}], "grp": "26|CP"}, {"id": "N-VF-125", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La pena de presidio sujeta al condenado a los trabajos prescritos por los reglamentos del establecimiento; la reclusión y la prisión no imponen trabajo alguno.", "f": "Art. 32 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 32 CP", "t": "ART. 32. La pena de presidio sujeta al condenado a los trabajos prescritos por los reglamentos del respectivo establecimiento penal. Las de reclusión y prisión no le imponen trabajo alguno. ART. 32. BIS La imposición del presidio perpetuo calificado importa la privación de libertad del condenado de por vida, bajo un régimen especial de cumplimiento que se rige por las siguientes reglas: 1.ª No se podrá conceder la libertad condicional sino una vez transcurridos cuarenta años de privación de libertad efectiva, debiendo en todo caso darse cumplimiento a las demás normas y requisitos que regulen su otorgamiento y revocación; 2.ª El condenado no podrá ser favorecido con ninguno de los beneficios que contemple el reglamento de establecimientos penitenciarios, o cualquier otro cuerpo legal o reglamentario, que importe su puesta en libertad, aun en forma transitoria. …"}], "grp": "32|CP"}, {"id": "N-VF-126", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "En el concurso ideal y en el medial se impone la pena mayor asignada al delito más grave.", "f": "Art. 75 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 75 CP", "t": "ART. 75. La disposición del artículo anterior no es aplicable en el caso de que un solo hecho constituya dos o más delitos, o cuando uno de ellos sea el medio necesario para cometer el otro. En estos casos solo se impondrá la pena mayor asignada al delito más grave."}], "grp": "75|CP"}, {"id": "N-VF-127", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Al autor de un delito de femicidio el juez puede reconocerle la atenuante del artículo 11 N° 5 del Código Penal.", "f": "Art. 390 quinquies CP: tratándose de femicidio no puede aplicarse esa atenuante.", "g": "N", "r": 0, "x": [{"c": "Art. 390 quinquies CP", "t": "Artículo 390 quinquies.- Tratándose del delito de femicidio, el juez no podrá aplicar la circunstancia atenuante de responsabilidad penal prevista en el N° 5 del artículo 11."}], "grp": "390 quinquies|CP"}, {"id": "N-VF-128", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El secuestro simple se castiga con presidio o reclusión menor en su grado máximo.", "f": "Art. 141 inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 141 CP", "t": "ART. 141. El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}], "grp": "141|CP"}, {"id": "N-VF-129", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El secuestro se agrava a presidio mayor en su grado mínimo a medio si el encierro o detención se prolonga por más de veinticuatro horas.", "f": "Art. 141 inc. 3° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 141 CP", "t": "ART. 141. El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}], "grp": "141|CP"}, {"id": "N-VF-130", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El auxilio al suicidio se sanciona con presidio menor en sus grados medio a máximo, si se efectúa la muerte.", "f": "Art. 393 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 393 CP", "t": "ART. 393. El que con conocimiento de causa prestare auxilio a otro para que se suicide, sufrirá la pena de presidio menor en sus grados medio a máximo, si se efectúa la muerte."}], "grp": "393|CP"}, {"id": "N-VF-131", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La castración maliciosa se castiga con presidio mayor en sus grados mínimo a medio.", "f": "Art. 395 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 395 CP", "t": "ART. 395. El que maliciosamente castrare a otro será castigado con presidio mayor en sus grados mínimo a medio."}], "grp": "395|CP"}, {"id": "N-VF-132", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El abuso sexual por sorpresa del artículo 366 inciso tercero se sanciona con presidio menor en su grado mínimo a medio.", "f": "Art. 366 inc. 3° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}], "grp": "366|CP"}, {"id": "N-VF-133", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La receptación del inciso primero del artículo 456 bis A se castiga con presidio menor en cualquiera de sus grados y multa de cinco a cien unidades tributarias mensuales.", "f": "Art. 456 bis A inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 456 bis A CP", "t": "ART. 456 bis A. El que conociendo su origen o no pudiendo menos que conocerlo, tenga en su poder, a cualquier título, especies hurtadas, robadas u objeto de abigeato o sustracción de madera, de receptación o de apropiación indebida del artículo 470, número 1°, las transporte, compre, venda, transforme o comercialice en cualquier forma, aun cuando ya hubiese dispuesto de ellas, sufrirá la pena de presidio menor en cualquiera de sus grados y multa de cinco a cien unidades tributarias mensuales. Para la determinación de la pena aplicable el tribunal tendrá especialmente en cuenta el valor de las especies, así como la gravedad del delito en que se obtuvieron, si éste era conocido por el autor. …"}], "grp": "456 bis A|CP"}, {"id": "N-VF-134", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La receptación de vehículos motorizados se sanciona con presidio menor en su grado máximo y multa equivalente al valor de la tasación fiscal del vehículo.", "f": "Art. 456 bis A inc. 3° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 456 bis A CP", "t": "… cualquiera de sus grados y multa de cinco a cien unidades tributarias mensuales. Para la determinación de la pena aplicable el tribunal tendrá especialmente en cuenta el valor de las especies, así como la gravedad del delito en que se obtuvieron, si éste era conocido por el autor. Cuando el objeto de la receptación sean vehículos motorizados o cosas que forman parte de redes de suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telecomunicaciones, se impondrá la pena de presidio menor en su grado máximo y multa equivalente al valor de la tasación fiscal del vehículo o la pena de presidio menor en su grado máximo, y multa de cinco a veinte unidades tributarias mensuales, respectivamente. …"}], "grp": "456 bis A|CP"}, {"id": "N-VF-135", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El ingreso no autorizado de teléfonos a un establecimiento penitenciario se sanciona con presidio menor en su grado mínimo a medio.", "f": "Art. 304 bis inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 304 bis CP", "t": "ART. 304 bis. El que sin estar legal o reglamentariamente autorizado al efecto ingresare, intentare o permitiere ingresar por cualquier medio a un establecimiento penitenciario intercomunicadores, teléfonos, partes de ellos, chips telefónicos u otros elementos tecnológicos que permitan comunicarse con el exterior, será sancionado con la pena de presidio menor en su grado mínimo a medio. El que ingresare, intentare o permitiere ingresar mediante lanzamiento desde el exterior o por vía no destinada al efecto, con dirección al interior de un establecimiento penitenciario, cualquier objeto o sustancia, será sancionado con la pena de presidio menor en sus grados mínimo a medio. La pena establecida en el inciso anterior se aumentará Art. …"}], "grp": "304 bis|CP"}, {"id": "N-VF-136", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Si el ingreso de teléfonos a un establecimiento penitenciario lo comete un abogado, procurador o empleado público, la pena no se aplica en su grado mínimo.", "f": "Art. 304 bis inc. 4° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 304 bis CP", "t": "… único N° 2 mediante lanzamiento desde el exterior o por vía no destinada al efecto, con dirección al interior de un establecimiento penitenciario, cualquier objeto o sustancia, será sancionado con la pena de presidio menor en sus grados mínimo a medio. La pena establecida en el inciso anterior se aumentará en un grado si se determina que el objeto o sustancia, por su naturaleza o función, es idóneo para afectar la seguridad o el control del recinto, la integridad de quienes se encuentren en su interior o facilitar la fuga de personas privadas de libertad. Si las conductas a que se refieren los incisos anteriores fueren perpetradas por un abogado, procurador o empleado público, la pena no se aplicará en su grado mínimo y, además, conllevará desde suspensión en su grado mínimo a inhabilitación absoluta temporal en cualquiera de sus …"}], "grp": "304 bis|CP"}, {"id": "N-VF-137", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el homicidio en riña sin autor conocido, quienes causaron lesiones graves al occiso son castigados con presidio menor en su grado máximo.", "f": "Art. 392 inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 392 CP", "t": "ART. 392. Cometiéndose un homicidio en riña o pelea y no constando el autor de la muerte, pero sí los que causaron lesiones graves al occiso, se impondrá a todos éstos la pena de presidio menor en su grado máximo. Si no constare tampoco quienes causaron lesiones graves al ofendido, se impondrá a todos los que hubieren ejercido violencia en su persona la de presidio menor en su grado medio."}], "grp": "392|CP"}, {"id": "N-VF-138", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El maltrato corporal relevante del inciso primero del artículo 403 bis se sanciona con prisión en cualquiera de sus grados o multa de una a cuatro unidades tributarias mensuales.", "f": "Art. 403 bis inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 403 bis CP", "t": "ART. 403 bis.- El que, de manera relevante, maltratare corporalmente a un niño, niña o adolescente menor de dieciocho años, a una persona adulta mayor o a una persona en situación de discapacidad en los términos de la ley N° 20.422 será sancionado con prisión en cualquiera de sus grados o multa de una a cuatro unidades tributarias mensuales, salvo que el hecho sea constitutivo de un delito de mayor gravedad. El que teniendo un deber especial de cuidado o protección respecto de alguna de las personas referidas en el inciso primero, la maltratare corporalmente de manera relevante o no impidiere su maltrato debiendo hacerlo, será castigado con la pena de presidio menor en su grado mínimo, salvo que el hecho fuere constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la …"}], "grp": "403 bis|CP"}, {"id": "N-VF-139", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El particular que comete falsedad en documento público sufre la pena de presidio menor en sus grados medio a máximo.", "f": "Art. 194 CP.", "g": "N", "r": 1, "x": [{"c": "Art. 194 CP", "t": "ART. 194. El particular que cometiere en documento público o auténtico alguna de las falsedades designadas en el artículo anterior, sufrirá la pena de presidio menor en sus grados medio a máximo."}], "grp": "194|CP"}, {"id": "N-VF-140", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La aplicación pública diferente de caudales sólo se castiga si resulta daño o entorpecimiento para el servicio.", "f": "Art. 236 CP: se castiga con suspensión en su grado medio si resulta daño o entorpecimiento y en su grado mínimo si no resulta.", "g": "N", "r": 0, "x": [{"c": "Art. 236 CP", "t": "ART. 236. El empleado público que arbitrariamente diere a los caudales o efectos que administre una aplicación pública diferente de aquella a que estuvieren destinados, será castigado con la pena de suspensión del empleo en su grado medio, si de ello resultare daño o entorpecimiento para el servicio u objeto en que debían emplearse, y con la misma en su grado mínimo, si no resultare daño o entorpecimiento."}], "grp": "236|CP"}, {"id": "N-VF-141", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Quien contamina sin haber sometido su actividad a evaluación de impacto ambiental, a sabiendas de estar obligado, es sancionado con presidio o reclusión menor en sus grados mínimo a medio.", "f": "Art. 305 inc. 1° CP.", "g": "N", "r": 1, "x": [{"c": "Art. 305 CP", "t": "ART. 305.- Será sancionado con presidio o reclusión menor en sus grados mínimo a medio el que sin haber sometido su actividad a una evaluación de impacto ambiental a sabiendas de estar obligado a ello: 1. Vierta sustancias contaminantes en aguas marítimas o continentales. 2. Extraiga aguas continentales, sean superficiales o subterráneas, o aguas marítimas. 3. Vierta o deposite sustancias contaminantes en el suelo o subsuelo, continental o marítimo. 4. Vierta tierras u otros sólidos en humedales. 5. Extraiga componentes del suelo o subsuelo. 6. Libere sustancias contaminantes al aire. La pena será de presidio o reclusión menor en sus grados medio a máximo si el infractor perpetra el hecho estando obligado a someter su actividad a un estudio de impacto ambiental."}], "grp": "305|CP"}, {"id": "N-VF-142", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El tráfico de pequeñas cantidades del artículo 4° de la Ley 20.000 se castiga con presidio menor en sus grados medio a máximo y multa de diez a cuarenta unidades tributarias mensuales.", "f": "Art. 4° inc. 1° Ley 20.000.", "g": "N", "r": 1, "x": [{"c": "Art. 4 Ley 20.000", "t": "Artículo 4º.- El que, sin la competente autorización posea, transporte, guarde o porte consigo pequeñas cantidades de sustancias o drogas estupefacientes o sicotrópicas, productoras de dependencia física o síquica, o de materias primas que sirvan para obtenerlas, sea que se trate de las indicadas en los incisos primero o segundo del artículo 1º, será castigado con presidio menor en sus grados medio a máximo y multa de diez a cuarenta unidades tributarias mensuales, a menos que justifique que están destinadas a la atención de un tratamiento médico o a su uso o consumo personal exclusivo y próximo en el tiempo. En igual pena incurrirá el que adquiera, transfiera, suministre o facilite a cualquier título pequeñas cantidades de estas sustancias, drogas o materias primas, con el objetivo de que sean consumidas o usadas por otro. …"}], "grp": "4|Ley 20.000"}, {"id": "N-VF-143", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La elaboración de drogas del artículo 1° de la Ley 20.000 se castiga con presidio mayor en sus grados mínimo a medio y multa de cuarenta a cuatrocientas unidades tributarias mensuales.", "f": "Art. 1° inc. 1° Ley 20.000.", "g": "N", "r": 1, "x": [{"c": "Art. 1 Ley 20.000", "t": "Artículo 1º.- Los que elaboren, fabriquen, transformen, preparen o extraigan sustancias o drogas estupefacientes o sicotrópicas productoras de dependencia física o síquica, capaces de provocar graves efectos tóxicos o daños considerables a la salud, sin la debida autorización, serán castigados con presidio mayor en sus grados mínimo a medio y multa de cuarenta a cuatrocientas unidades tributarias mensuales. Si se tratare de otras drogas o sustancias de esta índole que no produzcan los efectos indicados en el inciso anterior, podrá rebajarse la pena hasta en un grado. Incurren también en este delito, quienes tengan en su poder elementos, instrumentos, materiales o equipos comúnmente destinados a la elaboración, fabricación, preparación, transformación o extracción de las sustancias o drogas a que se refieren los incisos anteriores. …"}], "grp": "1|Ley 20.000"}, {"id": "N-VF-144", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las agravantes del artículo 19 de la Ley 20.000 obligan a aumentar la pena en un grado.", "f": "Art. 19 Ley 20.000: 'la pena deberá ser aumentada en un grado'.", "g": "N", "r": 1, "x": [{"c": "Art. 19 Ley 20.000", "t": "Artículo 19.- Tratándose de los delitos anteriormente descritos, la pena deberá ser aumentada en un grado si concurre alguna de las circunstancias siguientes: a) Si el imputado formó parte de una agrupación o reunión de delincuentes, sin incurrir en el delito de organización del artículo 16. b) Si se utilizó violencia, armas o engaño en su comisión. c) Si se suministró, promovió, indujo o facilitó el uso o consumo de drogas o sustancias estupefacientes o sicotrópicas a menores de dieciocho años de edad, o a personas con sus facultades mentales disminuidas o perturbadas. d) Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales. e) Si el delito se cometió valiéndose de niños, niñas o adolescentes o personas exentas de responsabilidad penal. …"}], "grp": "19|Ley 20.000"}, {"id": "N-VF-145", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El consumo de drogas en lugares públicos o abiertos al público puede sancionarse con multa de una a diez unidades tributarias mensuales.", "f": "Art. 50 letra a) Ley 20.000.", "g": "N", "r": 1, "x": [{"c": "Art. 50 Ley 20.000", "t": "Artículo 50.- Los que consumieren alguna de las drogas o sustancias estupefacientes o sicotrópicas de que hace mención el artículo 1º, en lugares públicos o abiertos al público, tales como calles, caminos, plazas, teatros, cines, hoteles, cafés, restaurantes, bares, estadios, centros de baile o de música; o en establecimientos educacionales o de capacitación, serán sancionados con alguna de las siguientes penas: a) Multa de una a diez unidades tributarias mensuales. b) Asistencia obligatoria a programas de prevención hasta por sesenta días, o tratamiento o rehabilitación en su caso por un período de hasta ciento ochenta días en instituciones autorizadas por el Servicio de Salud competente. Para estos efectos, el Ministerio de Salud o el Servicio Nacional para la Prevención y Rehabilitación del Consumo de Drogas y Alcohol deberán asignar preferentemente los recursos que se requieran. …"}], "grp": "50|Ley 20.000"}, {"id": "N-VF-146", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Conforme a la Ley 20.000, es el juez de garantía quien autoriza a los funcionarios policiales a desempeñarse como agentes encubiertos.", "f": "Art. 25 Ley 20.000: los autoriza el Ministerio Público.", "g": "N", "r": 0, "x": [{"c": "Art. 25 Ley 20.000", "t": "Artículo 25.- El Ministerio Público podrá autorizar a funcionarios policiales para que se desempeñen como agentes encubiertos o agentes reveladores y, a propuesta de dichos funcionarios, para que determinados informantes de esos Servicios actúen en alguna de las dos calidades anteriores. Agente encubierto es el funcionario policial que oculta su identidad oficial y se involucra o introduce en las organizaciones delictuales o en meras asociaciones o agrupaciones con propósitos delictivos, con el objetivo de identificar a los participantes, reunir información y recoger antecedentes necesarios para la investigación. El agente encubierto podrá tener una historia ficticia. La Dirección Nacional del Servicio de Registro Civil e Identificación deberá otorgar los medios necesarios para la oportuna y debida materialización de ésta. …"}], "grp": "25|Ley 20.000"}, {"id": "N-VF-147", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La posesión, tenencia o porte de un arma de fuego sin autorización ni inscripción se sanciona con presidio menor en su grado máximo.", "f": "Art. 9° inc. 1° Ley 17.798 (letras b y d del art. 2°).", "g": "N", "r": 1, "x": [{"c": "Art. 9 Ley 17.798", "t": "Artículo 9º.- Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras b) y d) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado máximo. Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras c) y e) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado medio. Si el infractor tuviere algún permiso de los establecidos en el artículo 4 y en el reglamento de esta ley para los elementos señalados en los literales b) y c) del artículo 2, pero diferente a aquel cuya falta se sanciona en los …"}], "grp": "9|Ley 17.798"}, {"id": "N-VF-148", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La posesión, tenencia o porte ilegal de municiones se sanciona con presidio menor en su grado medio.", "f": "Art. 9° inc. 2° Ley 17.798 (letras c y e del art. 2°).", "g": "N", "r": 1, "x": [{"c": "Art. 9 Ley 17.798", "t": "Artículo 9º.- Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras b) y d) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado máximo. Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras c) y e) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado medio. Si el infractor tuviere algún permiso de los establecidos en el artículo 4 y en el reglamento de esta ley para los elementos señalados en los literales b) y c) del artículo 2, pero diferente a aquel cuya falta se sanciona en los …"}], "grp": "9|Ley 17.798"}, {"id": "N-VF-149", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las penas de la Ley de Control de Armas absorben las de los delitos cometidos empleando esas armas.", "f": "Art. 17 B Ley 17.798: se imponen sin perjuicio de las que correspondan por los delitos o cuasidelitos cometidos con ellas.", "g": "N", "r": 0, "x": [{"c": "Art. 17 B Ley 17.798", "t": "Artículo 17 B.- Las penas por los delitos sancionados en esta ley se impondrán sin perjuicio de las que correspondan por los delitos o cuasidelitos que se cometan empleando las armas o elementos señalados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º, de conformidad con lo dispuesto en el artículo 74 del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en …"}], "grp": "17 B|Ley 17.798"}, {"id": "N-VF-150", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Hay desempeño en estado de ebriedad cuando el informe o la prueba arroja una dosificación igual o superior a 0,8 gramos por mil de alcohol en la sangre.", "f": "Art. 111 inc. 2° Ley de Tránsito.", "g": "N", "r": 1, "x": [{"c": "Art. 111 Ley de Tránsito", "t": "Artículo 111.- Para la determinación del estado de ebriedad del imputado o del hecho de encontrarse bajo la influencia del alcohol, el tribunal podrá considerar todos los medios de prueba, evaluando especialmente el estado general del imputado en relación con el control de sus sentidos, como también el nivel de alcohol presente en el flujo sanguíneo, que conste en el informe de alcoholemia o en el resultado de la prueba respiratoria que hubiera sido practicada por Carabineros. Sin perjuicio de lo anterior, se entenderá que hay desempeño en estado de ebriedad cuando el informe o prueba arroje una dosificación igual o superior a 0,8 gramos por mil de alcohol en la sangre o en el organismo. …"}], "grp": "111|Ley de Tránsito"}, {"id": "N-VF-151", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Hay desempeño bajo la influencia del alcohol cuando la dosificación es superior a 0,3 e inferior a 0,8 gramos por mil de alcohol en la sangre.", "f": "Art. 111 inc. 2° Ley de Tránsito.", "g": "N", "r": 1, "x": [{"c": "Art. 111 Ley de Tránsito", "t": "… 19.01.2004 ebriedad del imputado o del hecho de encontrarse bajo la influencia del alcohol, el tribunal podrá considerar todos los medios de prueba, evaluando especialmente el estado general del imputado en relación con el control de sus sentidos, como también el nivel de alcohol presente en el flujo sanguíneo, que conste en el informe de alcoholemia o en el resultado de la prueba respiratoria que hubiera sido practicada por Carabineros. Sin perjuicio de lo anterior, se entenderá que hay desempeño en estado de ebriedad cuando el informe o prueba arroje una dosificación igual o superior a 0,8 gramos por mil de alcohol en la sangre o en el organismo. Se entenderá que hay desempeño bajo la influencia del Art. …"}], "grp": "111|Ley de Tránsito"}, {"id": "N-VF-152", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El manejo en estado de ebriedad sin daños ni lesiones se sanciona con presidio menor en su grado mínimo, multa de dos a diez unidades tributarias mensuales y suspensión de la licencia por dos años en la primera ocasión.", "f": "Art. 196 inc. 1° Ley de Tránsito.", "g": "N", "r": 1, "x": [{"c": "Art. 196 Ley de Tránsito", "t": "Artículo 196.- El que infrinja la prohibición establecida en el inciso segundo del artículo 110, cuando la conducción, operación o desempeño fueren ejecutados en estado de ebriedad, o bajo la influencia de sustancias estupefacientes o sicotrópicas, será sancionado con la pena de presidio menor en su grado mínimo y multa de dos a diez unidades tributarias mensuales, además de la suspensión de la licencia para conducir vehículos motorizados por el término de dos años, si fuese sorprendido en una primera ocasión, la suspensión por el término de cinco años, si es sorprendido en un segundo evento y, finalmente, con la cancelación de la licencia al ser sorprendido en una tercera ocasión, ya sea que no se ocasione daño alguno, o que con ello se causen daños materiales o lesiones leves. …"}], "grp": "196|Ley de Tránsito"}, {"id": "N-VF-153", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Quien es sorprendido por tercera vez conduciendo en estado de ebriedad sufre la cancelación de la licencia.", "f": "Art. 196 inc. 1° Ley de Tránsito: suspensión por cinco años en el segundo evento y cancelación en el tercero.", "g": "N", "r": 1, "x": [{"c": "Art. 196 Ley de Tránsito", "t": "Artículo 196.- El que infrinja la prohibición establecida en el inciso segundo del artículo 110, cuando la conducción, operación o desempeño fueren ejecutados en estado de ebriedad, o bajo la influencia de sustancias estupefacientes o sicotrópicas, será sancionado con la pena de presidio menor en su grado mínimo y multa de dos a diez unidades tributarias mensuales, además de la suspensión de la licencia para conducir vehículos motorizados por el término de dos años, si fuese sorprendido en una primera ocasión, la suspensión por el término de cinco años, si es sorprendido en un segundo evento y, finalmente, con la cancelación de la licencia al ser sorprendido en una tercera ocasión, ya sea que no se ocasione daño alguno, o que con ello se causen daños materiales o lesiones leves. …"}], "grp": "196|Ley de Tránsito"}, {"id": "N-VF-154", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El incumplimiento de la obligación de detener la marcha, prestar ayuda y dar cuenta en un accidente con lesiones se sanciona con presidio menor en su grado medio e inhabilidad perpetua para conducir.", "f": "Art. 195 inc. 2° Ley de Tránsito.", "g": "N", "r": 1, "x": [{"c": "Art. 195 Ley de Tránsito", "t": "Artículo 195.- El incumplimiento de la obligación de LEY Nº19.495 dar cuenta a la autoridad de todo accidente en que sólo se produzcan daños, señalada en el artículo 168, será sancionado con multa de tres a siete unidades tributarias mensuales y con la suspensión de la licencia hasta por un mes. El incumplimiento de la obligación de detener la marcha, prestar la ayuda posible y dar cuenta a la autoridad de todo accidente en que se produzcan lesiones, señalada en el artículo 176, se sancionará con la pena de presidio menor en su grado medio, inhabilidad perpetua para conducir vehículos de tracción mecánica y multa de siete a diez unidades tributarias mensuales. …"}], "grp": "195|Ley de Tránsito"}, {"id": "N-VF-155", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La internación provisoria de un adolescente sólo procede por conductas que, cometidas por un adulto, constituirían crímenes.", "f": "Art. 32 Ley 20.084.", "g": "N", "r": 1, "x": [{"c": "Art. 32 Ley 20.084", "t": "Artículo 32.- Medidas cautelares del procedimiento. La internación provisoria en un centro cerrado sólo será procedente tratándose de la imputación de las conductas que de ser cometidas por una persona mayor de dieciocho años constituirían crímenes, debiendo aplicarse cuando los objetivos señalados en el inciso primero del artículo 155 del Código Procesal Penal no pudieren ser alcanzados mediante la aplicación de alguna de las demás medidas cautelares personales. Se deberá levantar el informe técnico de que trata el artículo 37 bis respecto de todo imputado que permaneciere más de 15 días sujeto a internación provisoria o bajo sujeción a la vigilancia de una autoridad."}], "grp": "32|Ley 20.084"}, {"id": "N-VF-156", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El plazo máximo de investigación formalizada respecto de un adolescente es de seis meses, ampliable fundadamente por un máximo de dos meses.", "f": "Art. 38 Ley 20.084.", "g": "N", "r": 1, "x": [{"c": "Art. 38 Ley 20.084", "t": "Artículo 38.- Plazo para declarar el cierre de la investigación. Transcurrido el plazo máximo de seis meses desde la fecha en que la investigación hubiere sido formalizada, el fiscal procederá a cerrarla, a menos que el juez le hubiere fijado un plazo inferior, y sin perjuicio de la posibilidad de solicitar una ampliación en dicho caso de conformidad con las reglas generales. Antes de cumplirse cualquiera de estos plazos, el fiscal podrá solicitar, fundadamente, su ampliación por un máximo de dos meses. En cualquier caso, dicho plazo se deberá suspender si se hubiere derivado el conflicto a una instancia de mediación y mientras ésta dure. Párrafo 7º Juicio oral y sentencia"}], "grp": "38|Ley 20.084"}, {"id": "N-VF-157", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La internación en régimen cerrado de un adolescente no puede imponerse por un período inferior a un año.", "f": "Art. 18 inc. 1° Ley 20.084.", "g": "N", "r": 1, "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}], "grp": "18|Ley 20.084"}, {"id": "N-VF-158", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La libertad asistida especial con internación parcial no puede imponerse por más de cinco años ni por menos de seis meses.", "f": "Art. 18 inc. 2° Ley 20.084.", "g": "N", "r": 1, "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}], "grp": "18|Ley 20.084"}, {"id": "N-VF-159", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La remisión condicional exige que la pena impuesta no exceda de tres años.", "f": "Art. 4° letra a) Ley 18.216.", "g": "N", "r": 1, "x": [{"c": "Art. 4 Ley 18.216", "t": "Artículo 4°.- La remisión condicional podrá decretarse: a) Si la pena privativa o restrictiva de libertad que impusiere la sentencia no excediere de tres años; b) Si el penado no hubiese sido condenado anteriormente por crimen o simple delito. En todo caso, no se considerarán para estos efectos las condenas cumplidas diez o cinco años antes, respectivamente, de la comisión del nuevo ilícito; c) Si los antecedentes personales del condenado, su conducta anterior y posterior al hecho punible y la naturaleza, modalidades y móviles determinantes del delito permitieren presumir que no volverá a delinquir, y d) Si las circunstancias indicadas en las letras b) y c) precedentes hicieren innecesaria una intervención o la ejecución efectiva de la pena. …"}], "grp": "4|Ley 18.216"}, {"id": "N-VF-160", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La libertad vigilada intensiva procede, por regla general, cuando la pena impuesta es superior a tres años y no excede de cinco.", "f": "Art. 15 bis letra a) Ley 18.216.", "g": "N", "r": 1, "x": [{"c": "Art. 15 bis Ley 18.216", "t": "Artículo 15 bis.- La libertad vigilada intensiva podrá decretarse: a) Si la pena privativa o restrictiva de libertad que impusiere la sentencia fuere superior a tres años y no excediere de cinco, o b) Si se tratare de alguno de los delitos establecidos en los artículos 296, 297, 390, 390 bis, 390 ter, 391, 395, 396, 397, 398 o 399 del Código Penal, cometidos en el contexto de violencia intrafamiliar, y aquellos contemplados en los artículos 363, 365 bis, 366, 366 bis, 366 quáter, 367, 367 ter, 367 quáter inciso segundo, y 411 ter del mismo Código, y la pena privativa o restrictiva de libertad que se impusiere fuere superior a quinientos cuarenta días y no excediere de cinco años. …"}], "grp": "15 bis|Ley 18.216"}, {"id": "N-VF-161", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La libertad vigilada procede, por regla general, cuando la pena impuesta es superior a dos años y no excede de tres.", "f": "Art. 15 letra a) Ley 18.216.", "g": "N", "r": 1, "x": [{"c": "Art. 15 Ley 18.216", "t": "Artículo 15.- La libertad vigilada podrá decretarse: a) Si la pena privativa o restrictiva de libertad que impusiere la sentencia fuere superior a dos años y no excediere de tres, o b) Si se tratare de alguno de los delitos contemplados en el artículo 4° de la ley N° 20.000, que sanciona el tráfico ilícito de estupefacientes y sustancias sicotrópicas, o en los incisos segundo y tercero del artículo 196 del decreto con fuerza de ley N° 1, de 2009, del Ministerio de Transportes y Telecomunicaciones, que fija el texto refundido, coordinado y sistematizado de la Ley de Tránsito, y la pena privativa o restrictiva de libertad que se impusiere fuere superior a quinientos cuarenta días y no excediere de tres años. …"}], "grp": "15|Ley 18.216"}, {"id": "N-VF-162", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La expulsión como pena sustitutiva procede respecto del extranjero condenado a una pena igual o inferior a cinco años de presidio o reclusión menor en su grado máximo.", "f": "Art. 34 Ley 18.216.", "g": "N", "r": 1, "x": [{"c": "Art. 34 Ley 18.216", "t": "Artículo 34.- Si el condenado a una pena igual o inferior a cinco años de presidio o reclusión menor en su grado máximo fuere un extranjero que no residiere legalmente en el país, el juez, de oficio o a petición de parte, podrá sustituir el cumplimiento de dicha pena por la expulsión de aquél del territorio nacional. La misma sustitución se aplicará respecto del extranjero que resida legalmente en el país, a menos que el juez, fundadamente, establezca que su arraigo en el país aconseje no aplicar esta medida, debiendo recabar para estos efectos un informe técnico al Servicio Nacional de Migraciones, el que deberá ser evacuado al tenor del artículo 129 de la Ley de Migración y Extranjería. …"}], "grp": "34|Ley 18.216"}, {"id": "N-VF-163", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El maltrato habitual se sanciona con presidio menor en su grado mínimo a medio, salvo que el hecho constituya un delito de mayor gravedad.", "f": "Art. 14 inc. 1° Ley 20.066.", "g": "N", "r": 1, "x": [{"c": "Art. 14 Ley 20.066", "t": "Artículo 14.- Delito de maltrato habitual. El ejercicio habitual de violencia física, sexual, psíquica o económica respecto de alguna de las personas referidas en el artículo 5º de esta ley se sancionará con la pena de presidio menor en su grado mínimo a medio, salvo que el hecho sea constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la ley a éste. Para apreciar la habitualidad, se atenderá al número de actos ejecutados, así como a la proximidad temporal de los mismos, con independencia de que dicha violencia se haya ejercido sobre la misma o diferente víctima. Para estos efectos, no se considerarán los hechos anteriores respecto de los cuales haya recaído sentencia penal absolutoria o condenatoria. Inciso eliminado."}], "grp": "14|Ley 20.066"}, {"id": "N-VF-164", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "En causas de violencia intrafamiliar puede decretarse la suspensión condicional imponiendo como única condición la asistencia a programas terapéuticos o de orientación familiar.", "f": "Art. 17 Ley 20.066: en ningún caso puede imponerse esa medida como única condición.", "g": "N", "r": 0, "x": [{"c": "Art. 17 Ley 20.066", "t": "… Para decretar la suspensión del procedimiento, el juez de garantía impondrá como condición una o más de las medidas accesorias establecidas en el artículo 9°, sin perjuicio de las demás que autoriza el artículo 238 del Código Procesal Penal. En ningún caso podrá decretarse la suspensión del procedimiento e imponerse como única condición a la persona imputada la medida de asistencia a programas terapéuticos o de orientación familiar. Al decretar la suspensión condicional del procedimiento, se procurará otorgar seguridad a la víctima, para lo cual se considerará si aquella se encuentra en alguna de las situaciones de riesgo inminente descritas en el artículo 7, el comportamiento de la persona que ejerce la violencia y la existencia de antecedentes y denuncias previas, entre otros, que se estimen relevantes para dicho fin. …"}], "grp": "17|Ley 20.066"}, {"id": "N-VF-165", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Quien es parte de una asociación terrorista es sancionado con presidio mayor en su grado mínimo.", "f": "Art. 1° inc. 1° Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 1 Ley 21.732", "t": "Artículo 1º.- Quien sea parte de una asociación terrorista será sancionado con presidio mayor en su grado mínimo. La pena será de presidio mayor en sus grados mínimo a medio para quien tomare parte en la asociación reclutando nuevos miembros o entregando entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos; y de presidio mayor en su grado medio para quien tomare parte en ella cumpliendo funciones de jefatura, ejerciendo mando en ella, proveyéndole recursos o medios, o habiéndola fundado. La pena será de presidio mayor en su grado medio para quien tomare parte en la asociación reclutando a menores de dieciocho años como miembros o entregándoles entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos. …"}], "grp": "1|Ley 21.732"}, {"id": "N-VF-166", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La asociación terrorista requiere una organización de tres o más personas con acción sostenida en el tiempo.", "f": "Art. 2° Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 2 Ley 21.732", "t": "Artículo 2º.- Se entenderá por asociación terrorista toda organización de tres o más personas, con acción sostenida en el tiempo, que tenga entre sus objetivos la perpetración de los delitos que se indican a continuación y entre sus fines los de socavar o desestabilizar las estructuras políticas, sociales o económicas del Estado democrático; imponer o inhibir alguna decisión a una autoridad del Estado democrático; o cuando, por los métodos previstos para su perpetración o efectivamente utilizados, esos delitos tengan la aptitud para someter o desmoralizar a la población civil o a una parte de ella: 1º Los previstos en los artículos 141; 142; 150 A; 150 D, inciso segundo; 268 ter; 268 quáter, números 1º y 2º; …"}], "grp": "2|Ley 21.732"}, {"id": "N-VF-167", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las conductas realizadas por menores de dieciocho años pueden calificarse de terroristas.", "f": "Art. 15 Ley 21.732: no se califican de terroristas y se rigen por la Ley 20.084.", "g": "N", "r": 0, "x": [{"c": "Art. 15 Ley 21.732", "t": "Artículo 15.- Sin perjuicio de lo dispuesto en el artículo 72 del Código Penal, no se calificarán de terroristas las conductas realizadas por personas menores de 18 años, quienes se regirán por la ley Nº 20.084, que establece un sistema de responsabilidad de los adolescentes por infracciones a la ley penal."}], "grp": "15|Ley 21.732"}, {"id": "N-VF-168", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "En la Ley 21.732 el plazo especial de investigación es de tres años contados desde la formalización.", "f": "Art. 18 Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 18 Ley 21.732", "t": "Artículo 18.- Para la investigación de los delitos sancionados en la presente ley, el fiscal dispondrá un plazo especial de investigación de tres años contado desde la fecha en que la investigación hubiere sido formalizada."}], "grp": "18|Ley 21.732"}, {"id": "N-VF-169", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La conspiración para cometer los delitos de los artículos 3°, 4°, 7° y 8° de la Ley 21.732 se sanciona con la pena del delito rebajada en dos grados.", "f": "Art. 11 Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 11 Ley 21.732", "t": "Artículo 11.- La conspiración para cometer alguno de los delitos contemplados en los artículos 3º, 4º, 7º y 8º se sancionará con la pena señalada en éstos, rebajada en dos grados."}], "grp": "11|Ley 21.732"}, {"id": "N-VF-170", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "En los procedimientos de la Ley 21.732 el arraigo puede decretarse antes de la formalización, por una única vez y por un máximo de sesenta días.", "f": "Art. 17 Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 17 Ley 21.732", "t": "Artículo 17.- En los procedimientos por delitos contemplados en la presente ley, a petición del Ministerio Público, el juez podrá decretar la prohibición de salida del país del imputado, en cualquier etapa de la investigación o procedimiento y aun antes de la formalización, por una única vez y por el período máximo de sesenta días, cuando concurran los demás requisitos de procedencia de las medidas cautelares personales establecidas en el Código Procesal Penal. Para estos efectos, deberá comunicar la prohibición y su alzamiento a la Policía de Investigaciones de Chile. En todo caso, transcurrido el plazo, la medida de arraigo caducará por el solo ministerio de la ley, de lo cual deberán tomar nota de oficio los organismos señalados."}], "grp": "17|Ley 21.732"}, {"id": "N-VF-171", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El financiamiento del terrorismo del artículo 10 de la Ley 21.732 se castiga con presidio menor en su grado máximo.", "f": "Art. 10 Ley 21.732.", "g": "N", "r": 1, "x": [{"c": "Art. 10 Ley 21.732", "t": "Artículo 10.- Quien, por cualquier medio, directa o indirectamente, provea o recolecte fondos con la finalidad de que se utilicen en la comisión de cualquiera de los delitos señalados en la presente ley o a sabiendas de que serán utilizados en su comisión, será castigado con la pena de presidio menor en su grado máximo, a menos que en virtud de dicha conducta le quepa responsabilidad como integrante de una asociación terrorista o en algún otro delito determinado, en cuyo caso se le sancionará por este último."}], "grp": "10|Ley 21.732"}, {"id": "N-VF-172", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la pena de los delitos de los artículos 3°, 4° y 5° de la Ley 21.732 el tribunal aplica las reglas de los artículos 65 a 69 del Código Penal.", "f": "Art. 6° Ley 21.732: no las considera; determina la cuantía dentro de los límites de la pena según el número y entidad de las circunstancias y la extensión del mal producido.", "g": "N", "r": 0, "x": [{"c": "Art. 6 Ley 21.732", "t": "Artículo 6º.- Para determinar la pena de los delitos establecidos en los tres artículos anteriores, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito de que se trate, en atención al número y entidad de circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito."}], "grp": "6|Ley 21.732"}, {"id": "N-VF-173", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La Ley 21.849 se aplica también a las Fuerzas Armadas cuando son llamadas a cumplir funciones de resguardo del orden público o de la seguridad pública interior, o en la protección de recintos militares.", "f": "Art. 1° inc. 2° Ley 21.849.", "g": "N", "r": 1, "x": [{"c": "Art. 1 Ley 21.849", "t": "Artículo 1.- Objeto. La presente ley tiene por objeto establecer los principios y reglas para el uso de la fuerza por el personal de las Fuerzas de Orden y Seguridad Pública, en el cumplimiento de sus funciones, en conformidad con lo dispuesto en la Constitución y la ley. Esta ley se aplicará también al personal de las Fuerzas Armadas cuando es llamado a cumplir funciones de resguardo del orden público o de la seguridad pública interior, o en la protección de los recintos militares, conforme con la Constitución y la ley."}], "grp": "1|Ley 21.849"}, {"id": "N-VF-174", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La Ley 21.849 contempla cinco grados de resistencia o agresión, que no siguen necesariamente un orden secuencial.", "f": "Art. 6° Ley 21.849: cooperación, resistencia pasiva, resistencia activa, agresión activa y agresión activa potencialmente letal.", "g": "N", "r": 1, "x": [{"c": "Art. 6 Ley 21.849", "t": "Artículo 6.- Grados de resistencia o agresión. Los grados de resistencia o agresión a los que se pueden enfrentar las Fuerzas de Orden y Seguridad Pública y que pueden afectar la integridad física del personal, de terceros, los derechos de las personas o bienes y serv
