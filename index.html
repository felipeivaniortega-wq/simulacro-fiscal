es o descendientes de la víctima. 4. Ejecutarlo en el contexto de violencia física o psicológica habitual del hechor contra la víctima."}]}, {"id": "SUR-VF-1", "o": "Prueba Sur", "t": "vf", "m": "PP", "e": "El cumplimiento del principio de objetividad exige que el Ministerio Público deba siempre incorporar en la acusación o requerimiento, los testigos o peritajes de la defensa.", "f": "El principio de objetividad (art. 3° Ley 19.640; art. 77 CPP) obliga a investigar lo que funda, exime o atenúa, no a ofrecer la prueba de la defensa: ésta la ofrece el acusado (art. 263 CPP).", "g": "", "r": 0, "x": [{"c": "Art. 3 Ley 19.640", "t": "Artículo 3º.- En el ejercicio de su función, los fiscales del Ministerio Público adecuarán sus actos a un criterio objetivo, velando únicamente por la correcta aplicación de la ley. De acuerdo con ese criterio, deberán investigar con igual celo no sólo los hechos y circunstancias que funden o agraven la responsabilidad del imputado, sino también los que le eximan de ella, la extingan o la atenúen. Artículo 3º.- El Fiscal Nacional solicitará a las Cortes de Apelaciones con asiento en comunas ubicadas en las restantes regiones del país la elaboración de las ternas para la designación de los Fiscales Regionales con doce meses de anticipación respecto de los plazos que se establecen en el artículo siguiente. …"}, {"c": "Art. 77 CPP", "t": "Artículo 77.- Facultades. Los fiscales ejercerán y sustentarán la acción penal pública en la forma prevista por la ley. Con ese propósito practicarán todas las diligencias que fueren conducentes al éxito de la investigación y dirigirán la actuación de la policía, con estricta sujeción al principio de objetividad consagrado en la Ley Orgánica Constitucional del Ministerio Público."}]}, {"id": "SUR-VF-2", "o": "Prueba Sur", "t": "vf", "m": "PB", "e": "En el nombramiento del Fiscal Nacional interviene únicamente el Poder Judicial y el Poder Ejecutivo a través del Presidente de la República.", "f": "Art. 85 CPR: el Presidente designa a propuesta en quina de la Corte Suprema y con acuerdo del Senado; interviene también el Poder Legislativo.", "g": "", "r": 0, "x": [{"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}]}, {"id": "SUR-VF-3", "o": "Prueba Sur", "t": "vf", "m": "LE", "e": "A un adolescente de 15 años que comete un robo con homicidio, la máxima sanción que se le puede imponer es la de 10 años de internación en régimen cerrado.", "f": "Art. 18 Ley 20.084: la internación en régimen cerrado no puede exceder de cinco años si el infractor tiene menos de dieciséis años.", "g": "", "r": 0, "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}]}, {"id": "SUR-VF-4", "o": "Prueba Sur", "t": "vf", "m": "PP", "e": "Se concederá siempre acción penal respecto de los delitos cometidos en contra de los menores de edad. Esto significa que cualquier persona podrá denunciar el hecho.", "f": "Art. 53 inc. 2° CPP: se concede siempre acción penal pública para la persecución de los delitos cometidos contra menores de edad.", "g": "", "r": 1, "x": [{"c": "Art. 53 CPP", "t": "Artículo 53.- Clasificación de la acción penal. La acción penal es pública o privada. La acción penal pública para la persecución de todo delito que no esté sometido a regla especial deberá ser ejercida de oficio por el ministerio público. Podrá ser ejercida, además, por las personas que determine la ley, con arreglo a las disposiciones de este Código. Se concede siempre acción penal pública para la persecución de los delitos cometidos contra menores de edad. La acción penal privada sólo podrá ser ejercida por la víctima. Excepcionalmente, la persecución de algunos delitos de acción penal pública requiere la denuncia previa de la víctima."}]}, {"id": "SUR-VF-5", "o": "Prueba Sur", "t": "vf", "m": "PX", "e": "El procedimiento abreviado nunca procede para el conocimiento y fallo de hechos respecto de los cuales el fiscal requiere la imposición de una pena privativa de libertad que excede el presidio o reclusión menores en su grado máximo.", "f": "Art. 406 CPP vigente: procede cuando el fiscal requiere una pena privativa de libertad no superior a diez años de presidio mayor en su grado mínimo.", "g": "A", "r": 0, "x": [{"c": "Art. 406 CPP", "t": "Artículo 406.- Presupuestos del procedimiento abreviado. Se aplicará el procedimiento abreviado para conocer y fallar, los hechos respecto de los cuales el fiscal requiriere la imposición de una pena privativa de libertad no superior a diez años de presidio mayor en su grado mínimo, o bien cualesquiera otras penas de distinta naturaleza, cualquiera fuere su entidad o monto, ya fueren ellas únicas, conjuntas o alternativas. Para ello, será necesario que el imputado, en Art. conocimiento de los hechos materia de la acusación y de los antecedentes de la investigación que la fundaren, los acepte expresamente y manifieste su conformidad con la aplicación de este procedimiento. La existencia de varios acusados o la atribución de …"}]}, {"id": "SUR-VF-6", "o": "Prueba Sur", "t": "vf", "m": "PI", "e": "La decisión de no perseverar en el procedimiento es una facultad del Ministerio Público que los fiscales deben ejercer antes del cierre de la investigación y que requiere ser aprobada por el competente Juez de Garantía para producir efecto.", "f": "Art. 248 letra c) CPP: se comunica una vez cerrada la investigación y no requiere aprobación judicial.", "g": "", "r": 0, "x": [{"c": "Art. 248 CPP", "t": "Artículo 248- Cierre de la investigación. Practicadas las diligencias necesarias para la averiguación del hecho punible y sus autores, cómplices o encubridores, el fiscal declarará cerrada la investigación y podrá, dentro de los diez días siguientes: a) Solicitar el sobreseimiento definitivo o temporal de la causa; b) Formular acusación, cuando estimare que la investigación proporciona fundamento serio para el enjuiciamiento del imputado contra quien se hubiere formalizado la misma, o c) Comunicar la decisión del ministerio público de no perseverar en el procedimiento, por no haberse reunido durante la investigación los antecedentes suficientes para fundar una acusación. La comunicación de la decisión contemplada en la letra c) precedente dejará sin efecto la formalización de la investigación, dará lugar a que el juez revoque las medidas cautelares que se hubieren decretado, y la prescripción de la acción penal continuará corriendo como si nunca se hubiere interrumpido."}]}, {"id": "SUR-VF-7", "o": "Prueba Sur", "t": "vf", "m": "PG", "e": "La circunstancia agravante prevista en el número 21 del art. 12 CP, no es aplicable a quien comete el delito motivado por la apariencia personal que tiene la víctima.", "f": "Art. 12 N° 21 CP: incluye expresamente la apariencia personal de la víctima.", "g": "", "r": 0, "x": [{"c": "Art. 12 CP", "t": "… 17.° Cometer el delito en lugar destinado al ejercicio de un culto permitido en la República. 18.° Ejecutar el hecho con ofensa o desprecio del respeto que por la dignidad, autoridad, edad o sexo mereciere el ofendido, o en su morada, cuando él no haya provocado el suceso. 19.° Ejecutarlo por medio de fractura o escalamiento de lugar cerrado. 20.° Ejecutarlo portando armas de aquellas referidas en el artículo 132. 21ª. Cometer el delito o participar en él motivado por la ideología, opinión política, religión o creencias de la víctima; la nación, raza, etnia o grupo social a que pertenezca; su sexo, género, orientación sexual, identidad de género, edad, filiación, apariencia personal o la enfermedad o discapacidad que padezca. …"}]}, {"id": "SUR-VF-9", "o": "Prueba Sur", "t": "vf", "m": "PP", "e": "Las lesiones menos graves son delitos de acción pública previa instancia particular.", "f": "Art. 54 letra a) CPP: lesiones de los arts. 399 y 494 N° 5 CP.", "g": "", "r": 1, "x": [{"c": "Art. 54 CPP", "t": "Artículo 54.- Delitos de acción pública previa instancia particular. En los delitos de acción pública previa instancia particular no podrá procederse de oficio sin que, a lo menos, el ofendido por el delito hubiere denunciado el hecho a la justicia, al ministerio público o a la policía. Tales delitos son: a) Las lesiones previstas en los artículos 399 y 494, número 5º, del Código Penal; b) La violación de domicilio; c) La violación de secretos prevista en los artículos 231 y 247, inciso segundo, del Código Penal; d) Las amenazas previstas en los artículos 296 y 297 del Código Penal; e) Los previstos en la ley N° 19.039, que establece normas aplicables a los privilegios industriales y protección de los derechos de propiedad industrial; …"}, {"c": "Art. 399 CP", "t": "ART. 399. Las lesiones no comprendidas en los artículos precedentes se reputan menos graves, y serán penadas con relegación o presidio menores en sus grados mínimos o con multa de once a veinte unidades tributarias mensuales."}]}, {"id": "SUR-VF-10", "o": "Prueba Sur", "t": "vf", "m": "PI", "e": "Para la aplicación del Principio de Oportunidad, el fiscal debe estar frente a un hecho que no comprometa gravemente el interés público, salvo que la pena mínima asignada al delito supere el presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones.", "f": "Art. 170 inc. 1° CPP.", "g": "", "r": 1, "x": [{"c": "Art. 170 CPP", "t": "Artículo 170.- Principio de oportunidad. Los fiscales del ministerio público podrán no iniciar la persecución penal o abandonar la ya iniciada cuando se tratare de un hecho que no comprometiere gravemente el interés público, a menos que la pena mínima asignada al delito excediere la de presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. Tampoco procederá el ejercicio de esta facultad respecto del imputado que hubiere sido beneficiado con ella dentro de los dos años anteriores al hecho de que se trate, contados desde la resolución que lo tuvo por comunicado. El ejercicio de esta facultad se regulará mediante Art. …"}]}, {"id": "SUR-VF-12", "o": "Prueba Sur", "t": "vf", "m": "PJ", "e": "Se denomina “Forzamiento de la acusación” aquella institución conforme a la cual el Juez de Garantía le ordena al fiscal presentar acusación, luego que el querellante particular se opusiere fundadamente a la solicitud de sobreseimiento definitivo presentada por el representante del ente persecutor.", "f": "Art. 258 CPP: el juez no ordena acusar; remite los antecedentes al Fiscal Regional y, si éste ratifica, puede autorizar al querellante a sostener la acusación.", "g": "", "r": 0, "x": [{"c": "Art. 258 CPP", "t": "Artículo 258.- Forzamiento de la acusación. Si el querellante particular se opusiere a la solicitud de sobreseimiento formulada por el fiscal, el juez dispondrá que los antecedentes sean remitidos al fiscal regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, a objeto que éste revise la decisión del fiscal a cargo de la causa. Si el fiscal regional o el Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, dentro de los tres días siguientes, decidiere que el ministerio público formulará acusación, dispondrá simultáneamente si el caso habrá de continuar a cargo del fiscal que hasta el momento lo hubiere conducido, o si designará uno distinto. En dicho evento, la acusación del ministerio público deberá ser formulada dentro de los diez días siguientes, de conformidad a las reglas generales. …"}]}, {"id": "SUR-VF-13", "o": "Prueba Sur", "t": "vf", "m": "PJ", "e": "El Tribunal del Juicio Oral en lo Penal, puede suspender la audiencia de juicio oral hasta por dos veces, por razones de absoluta necesidad y por el tiempo mínimo necesario de acuerdo al motivo de la suspensión.", "f": "Art. 283 inc. 1° CPP.", "g": "", "r": 1, "x": [{"c": "Art. 283 CPP", "t": "Artículo 283.- Suspensión de la audiencia o del juicio oral. El tribunal podrá suspender la audiencia hasta por dos veces solamente por razones de absoluta necesidad y por el tiempo mínimo necesario de acuerdo con el motivo de la suspensión. Al reanudarla, efectuará un breve resumen de los actos realizados hasta ese momento. El juicio se suspenderá por las causas señaladas en el artículo 252. Con todo, el juicio seguirá adelante cuando la declaración de rebeldía se produjere respecto del imputado a quien se le hubiere otorgado la posibilidad de prestar declaración en el juicio oral, siempre que el tribunal estimare que su ulterior presencia no resulta indispensable para la prosecución del juicio o cuando sólo faltare la dictación de la sentencia. …"}]}, {"id": "SUR-VF-14", "o": "Prueba Sur", "t": "vf", "m": "PP", "e": "Se considera intervinientes en el procedimiento penal al fiscal, imputado, defensor, al querellante, a la víctima y familiares en primera línea de consanguineidad.", "f": "Art. 12 CPP: son intervinientes el fiscal, el imputado, el defensor, la víctima y el querellante. Los familiares sólo lo son cuando tienen la calidad de víctima conforme al art. 108.", "g": "", "r": 0, "x": [{"c": "Art. 12 CPP", "t": "Artículo 12.- Intervinientes. Para los efectos regulados en este Código, se considerará intervinientes en el procedimiento al fiscal, al imputado, al defensor, a la víctima y al querellante, desde que realizaren cualquier actuación procesal o desde el momento en que la ley les permitiere ejercer facultades determinadas."}]}, {"id": "SUR-VF-15", "o": "Prueba Sur", "t": "vf", "m": "PI", "e": "La facultad de no iniciar investigación y el archivo provisional en delitos con pena aflictiva, requiere de aprobación previa del Fiscal Regional.", "f": "La aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial rige sólo para el archivo provisional con pena aflictiva (art. 167 CPP). La facultad de no iniciar investigación se somete a la aprobación del juez de garantía (art. 168).", "g": "A", "r": 0, "x": [{"c": "Art. 167 CPP", "t": "Artículo 167.- Archivo provisional. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}]}, {"id": "SUR-VF-17", "o": "Prueba Sur", "t": "vf", "m": "PI", "e": "El acuerdo reparatorio no puede ser dejado sin efecto por ninguna acción civil.", "f": "Art. 243 inc. final CPP: el acuerdo reparatorio no podrá ser dejado sin efecto por ninguna acción civil.", "g": "", "r": 1, "x": [{"c": "Art. 243 CPP", "t": "Artículo 243.- Efectos civiles del acuerdo reparatorio. Ejecutoriada la resolución judicial que aprobare el acuerdo reparatorio, podrá solicitarse su cumplimiento ante el juez de garantía con arreglo a lo establecido en los artículos 233 y siguientes del Código de Procedimiento Civil. El acuerdo reparatorio no podrá ser dejado sin efecto por ninguna acción civil."}]}, {"id": "SUR-VF-19", "o": "Prueba Sur", "t": "vf", "m": "PR", "e": "Respecto de la resolución sobre prisión preventiva, solo es apelable la resolución que ordena o niega lugar a dicha medida cautelar.", "f": "Art. 149 inc. 1° CPP: es apelable la resolución que ordene, mantenga, niegue lugar o revoque la prisión preventiva, cuando haya sido dictada en audiencia.", "g": "", "r": 0, "x": [{"c": "Art. 149 CPP", "t": "Artículo 149.- Recursos relacionados con la medida de prisión preventiva. La resolución que ordenare, mantuviere, negare lugar o revocare la prisión preventiva será apelable cuando hubiere sido dictada en una audiencia. No obstará a la procedencia del recurso, la circunstancia de haberse decretado, a petición de cualquiera de los intervinientes, alguna de las medidas cautelares señaladas en el artículo 155. En los demás casos no será susceptible de recurso alguno. Tratándose de los delitos establecidos en los Art. artículos 141, 142, 292, 293, 361, 362, 363, 365 bis, 366 incisos primero y segundo, 366 bis, 390, 390 bis, 390 ter, 391, 411 bis, 411 ter, 411 quáter, 433, 436, 438 y 440 del Código Penal, en las leyes N°17.798 y N°20.000 y de los delitos de castración, mutilaciones y lesiones contra miembros de Carabineros, de la Policía de Investigaciones y de Gendarmería …"}]}, {"id": "SUR-VF-22", "o": "Prueba Sur", "t": "vf", "m": "PE", "e": "El sujeto que, en conocimiento de que una persona determinada desea quitarse la vida, le entrega a ésta una soga para que se ahorque, será sancionado por el delito de auxilio al suicidio frustrado, si finalmente no se produce la muerte a consecuencia de la intervención oportuna de un tercero.", "f": "Art. 393 CP: el auxilio al suicidio sólo se sanciona si se efectúa la muerte; no admite formas imperfectas punibles.", "g": "", "r": 0, "x": [{"c": "Art. 393 CP", "t": "ART. 393. El que con conocimiento de causa prestare auxilio a otro para que se suicide, sufrirá la pena de presidio menor en sus grados medio a máximo, si se efectúa la muerte."}]}, {"id": "SUR-VF-24", "o": "Prueba Sur", "t": "vf", "m": "LE", "e": "La diferencia más relevante entre el “microtráfico” (artículo 4º ley 20.000) y el “consumo” (Artículo 50 ley 20.000) se funda, según nuestra jurisprudencia y doctrina mayoritaria, en lo siguiente: En el “consumo”, el peso total bruto de droga que se encuentra en poder del imputado no debe exceder de 5 gramos, lo que permitirá entender que las “pequeñas cantidades” de droga están destinadas, justamente, para el consumo personal y próximo en el tiempo. Al contrario, si la cantidad excede el referido peso bruto, existirán presunciones fundadas de tratarse de microtráfico.", "f": "El art. 4° de la Ley 20.000 no fija un umbral de peso: 'pequeña cantidad' es un concepto que se valora caso a caso (pureza, forma de ocultación, dinero, circunstancias de la tenencia).", "g": "", "r": 0, "x": [{"c": "Art. 4 Ley 20.000", "t": "… y multa de diez a cuarenta unidades tributarias mensuales, a menos que justifique que están destinadas a la atención de un tratamiento médico o a su uso o consumo personal exclusivo y próximo en el tiempo. En igual pena incurrirá el que adquiera, transfiera, suministre o facilite a cualquier título pequeñas cantidades de estas sustancias, drogas o materias primas, con el objetivo de que sean consumidas o usadas por otro. Se entenderá que no concurre la circunstancia de uso o consumo personal exclusivo y próximo en el tiempo, cuando la droga poseída, transportada, guardada o portada no permita racionalmente suponer que está destinada al uso o consumo descrito o cuando las circunstancias de la posesión, transporte, guarda o porte sean indiciarias del propósito de traficar a cualquier título. …"}]}, {"id": "SUR-VF-25", "o": "Prueba Sur", "t": "vf", "m": "PX", "e": "El procedimiento abreviado puede solicitarse en cualquier etapa del procedimiento luego de la formalización de la investigación y hasta la audiencia de preparación de juicio oral.", "f": "Art. 407 inc. 1° CPP. Además, el inc. 2° vigente lo admite después de la audiencia de preparación y hasta antes del envío del auto de apertura (art. 280 bis).", "g": "A", "r": 1, "x": [{"c": "Art. 407 CPP", "t": "Artículo 407. Oportunidad para solicitar el procedimiento abreviado. Una vez formalizada la investigación, la tramitación de la causa conforme a las reglas del procedimiento abreviado podrá ser acordada en cualquier etapa del procedimiento, hasta la audiencia de preparación del juicio oral. Sin perjuicio de lo señalado en el inciso precedente, podrá solicitarse el procedimiento abreviado, aun cuando hubiere finalizado la audiencia de preparación del juicio oral y hasta antes del envío del auto de apertura al tribunal de juicio oral en lo penal. La solicitud se resolverá de conformidad a lo establecido en el artículo 280 bis. Si no se hubiere deducido aún acusación, el fiscal y el querellante, en su caso, las formularán verbalmente en la audiencia que el tribunal convocare para resolver la solicitud de procedimiento abreviado, a la que deberá citar a todos los intervinientes. …"}]}, {"id": "QUE-VF-1", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Las presentaciones por escrito realizadas ante un tribunal penal deben ser resueltas dentro de las 48 horas posteriores a su interposición.", "f": "Art. 38 inc. 2° CPP: antes de las veinticuatro horas siguientes a su recepción.", "g": "", "r": 0, "x": [{"c": "Art. 38 CPP", "t": "Artículo 38.- Plazos generales para dictar las resoluciones. Las cuestiones debatidas en una audiencia deberán ser resueltas en ella. Las presentaciones escritas serán resueltas por el tribunal antes de las veinticuatro horas siguientes a su recepción. Párrafo 6°. Registro de las actuaciones judiciales"}]}, {"id": "QUE-VF-3", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Los registros de actuaciones judiciales son públicos transcurridos 5 años desde su realización.", "f": "Art. 44 inc. 3° CPP.", "g": "", "r": 1, "x": [{"c": "Art. 44 CPP", "t": "Artículo 44.- Examen del registro y certificaciones. Salvas las excepciones expresamente previstas en la ley, los intervinientes siempre tendrán acceso al contenido de los registros. Los registros podrán también ser consultados por terceros cuando dieren cuenta de actuaciones que fueren públicas de acuerdo con la ley, a menos que, durante la investigación o la tramitación de la causa, el tribunal restringiere el acceso para evitar que se afecte su normal substanciación o el principio de inocencia. En todo caso, los registros serán públicos transcurridos cinco años desde la realización de las actuaciones consignadas en ellos. A petición de un interviniente o de cualquier persona, el funcionario competente del tribunal expedirá copias fieles de los registros o de la parte de ellos que fuere pertinente, con sujeción a lo dispuesto en los incisos anteriores. …"}]}, {"id": "QUE-VF-5", "o": "Prueba Quellón", "t": "vf", "m": "PI", "e": "Si requerida la comparecencia de un testigo por un Fiscal mediante citación, este no concurriera, este puede ordenar directamente a la policía su conducción compulsiva.", "f": "Art. 23 CPP: si la persona citada no comparece, el fiscal debe ocurrir ante el juez de garantía para que lo autorice a conducirla compulsivamente.", "g": "", "r": 0, "x": [{"c": "Art. 23 CPP", "t": "Artículo 23.- Citación del ministerio público. Cuando en el desarrollo de su actividad de investigación el fiscal requiriere la comparecencia de una persona, podrá citarla por cualquier medio idóneo. Si la persona citada no compareciere, el fiscal podrá ocurrir ante el juez de garantía para que lo autorice a conducirla compulsivamente a su presencia. Con todo, el fiscal no podrá recabar directamente la comparecencia personal de las personas o autoridades a que se refiere el artículo 300. Si la declaración de dichas personas o autoridades fuere necesaria, procederá siempre previa autorización del juez de garantía y conforme lo establece el artículo 301. Párrafo 4º Notificaciones y citaciones judiciales"}]}, {"id": "QUE-VF-6", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Para la contabilización de un plazo legal y/o judicial, se considera todo día desde el hito que le da inicio hasta su término.", "f": "Art. 14 CPP: todos los días y horas son hábiles y los plazos no se suspenden por la interposición de días feriados.", "g": "", "r": 1, "x": [{"c": "Art. 14 CPP", "t": "Artículo 14.- Días y horas hábiles. Todos los días y horas serán hábiles para las actuaciones del procedimiento penal y no se suspenderán los plazos por la interposición de días feriados. No obstante, cuando un plazo de días concedido a los intervinientes venciere en día feriado, se considerará ampliado hasta las veinticuatro horas del día siguiente que no fuere feriado."}]}, {"id": "QUE-VF-7", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Las amenazas condicionales y no condicionales perpetradas contra un mayor de edad, constituyen delitos de acción penal pública previa instancia particular.", "f": "Art. 54 letra c) CPP: amenazas de los arts. 296 y 297 CP.", "g": "", "r": 1, "x": [{"c": "Art. 54 CPP", "t": "Artículo 54.- Delitos de acción pública previa instancia particular. En los delitos de acción pública previa instancia particular no podrá procederse de oficio sin que, a lo menos, el ofendido por el delito hubiere denunciado el hecho a la justicia, al ministerio público o a la policía. Tales delitos son: a) Las lesiones previstas en los artículos 399 y 494, número 5º, del Código Penal; b) La violación de domicilio; c) La violación de secretos prevista en los artículos 231 y 247, inciso segundo, del Código Penal; d) Las amenazas previstas en los artículos 296 y 297 del Código Penal; e) Los previstos en la ley N° 19.039, que establece normas aplicables a los privilegios industriales y protección de los derechos de propiedad industrial; …"}, {"c": "Art. 296 CP", "t": "… El que amenazare seriamente a otro con causar a él mismo o a su familia, en su persona, honra o propiedad, un mal que constituya delito, siempre que por los antecedentes aparezca verosímil la consumación del hecho, será castigado: 1º. Con presidio menor en sus grados medio a máximo, si hubiere hecho la amenaza exigiendo una cantidad o imponiendo ilegítimamente cualquiera otra condición y el culpable hubiere conseguido su propósito. 2° Con presidio menor en sus grados mínimo a medio, si hecha la amenaza bajo condición el culpable no hubiere conseguido su propósito, 3.° Con presidio menor en su grado mínimo, si la amenaza no fuere condicional; a no ser que merezca mayor pena el hecho consumado, caso en el cual se impondrá ésta. …"}]}, {"id": "QUE-VF-9", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "La cautela de garantías (art. 10 CPP) es un instrumento jurídico que busca resguardar el ejercicio eficaz de los derechos reconocidos a todo interviniente.", "f": "Art. 10 CPP: protege el ejercicio de los derechos del imputado, no los de todo interviniente.", "g": "", "r": 0, "x": [{"c": "Art. 10 CPP", "t": "Artículo 10.- Cautela de garantías. En cualquiera etapa del procedimiento en que el juez de garantía estimare que el imputado no está en condiciones de ejercer los derechos que le otorgan las garantías judiciales consagradas en la Constitución Política, en las leyes o en los tratados internacionales ratificados por Chile y que se encuentren vigentes, adoptará, de oficio o a petición de parte, las medidas necesarias para permitir dicho ejercicio. Si esas medidas no fueren suficientes para evitar que pudiere producirse una afectación sustancial de los derechos del imputado, el juez ordenará la suspensión del procedimiento por el menor tiempo posible y citará a los intervinientes a una audiencia que se celebrará con los que asistan. …"}]}, {"id": "QUE-VF-10", "o": "Prueba Quellón", "t": "vf", "m": "PE", "e": "El delito de Homicidio simple es subsidiario del parricidio, del femicidio y del homicidio calificado.", "f": "Art. 391 N° 2 CP: figura residual ('en cualquier otro caso').", "g": "", "r": 1, "x": [{"c": "Art. 391 CP", "t": "ART.391. El que mate a otro y no esté comprendido en los artículos 390, 390 bis y 390 ter, será penado: 1.° Con presidio mayor en su grado máximo a presidio perpetuo, si ejecutare el homicidio con alguna de las circunstancias siguientes: Primera.- Con alevosía. Segunda.- Por premio o promesa remuneratoria, o por beneficio económico o de otra naturaleza en provecho propio o de un tercero. Tercera.- Por medio de veneno. Cuarta.- Con ensañamiento, aumentando deliberada e inhumanamente el dolor al ofendido. Quinta.- Con premeditación conocida. 2.º Con presidio mayor en su grado medio a máximo en cualquier otro caso."}]}, {"id": "QUE-VF-11", "o": "Prueba Quellón", "t": "vf", "m": "LE", "e": "Los delitos contemplados en la ley sobre tráfico ilícito de estupefacientes y sustancias sicotrópicas, se sancionan como consumados desde que existe principio de ejecución.", "f": "Art. 18 Ley 20.000.", "g": "", "r": 1, "x": [{"c": "Art. 18 Ley 20.000", "t": "Artículo 18.- Los delitos de que trata esta ley se sancionarán como consumados desde que haya principio de ejecución. Párrafo 2º De las circunstancias agravantes"}]}, {"id": "QUE-VF-12", "o": "Prueba Quellón", "t": "vf", "m": "PG", "e": "Al encubridor de un delito frustrado, se le aplica la pena inferior en tres grados a la que señala la ley para el delito.", "f": "Art. 53 CP: pena inferior en tres grados a la señalada por la ley para el crimen o simple delito.", "g": "", "r": 1, "x": [{"c": "Art. 53 CP", "t": "ART. 53. A los cómplices de tentativa de crimen o simple delito y a los encubridores de crimen o simple delito frustrado, se impondrá la pena inferior en tres grados a la que señala la ley para el crimen o simple delito."}]}, {"id": "QUE-VF-13", "o": "Prueba Quellón", "t": "vf", "m": "PE", "e": "La amenaza de un mal que no constituya delito es atípica.", "f": "Art. 297 CP: sanciona las amenazas de un mal que no constituya delito hechas en la forma del N° 1 o 2 del art. 296.", "g": "", "r": 0, "x": [{"c": "Art. 297 CP", "t": "ART. 297. Las amenazas de un mal que no constituya delito hechas en la forma expresada en los números 1º o 2º del artículo anterior, serán castigadas con la pena de reclusión menor en sus grados mínimo a medio. ART. 297. BIS Cuando las amenazas se hicieren contra los profesionales y funcionarios de los establecimientos de salud, públicos o privados, o contra los profesionales, funcionarios y manipuladores de alimentos de establecimientos educacionales, públicos o privados, al interior de sus dependencias o mientras éstos se encontraren en el ejercicio de sus funciones o en razón, con motivo u ocasión de ellas, se impondrá el grado máximo o el máximum de las penas previstas en los dos artículos anteriores en sus respectivos casos."}]}, {"id": "QUE-VF-14", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "El art. 26 CPP establece como sanción al incumplimiento de un interviniente de informar un domicilio fidedigno para ser notificado, la posibilidad de ser conducidos compulsivamente a las actuaciones del procedimiento.", "f": "Art. 26 inc. 2° CPP: el efecto es que las resoluciones se notifican por el estado diario.", "g": "", "r": 0, "x": [{"c": "Art. 26 CPP", "t": "Artículo 26.- Señalamiento de domicilio de los intervinientes en el procedimiento. En su primera intervención en el procedimiento los intervinientes deberán ser conminados por el juez, por el ministerio público, o por el funcionario público que practicare la primera notificación, a indicar un domicilio dentro de los límites urbanos de la ciudad en que funcionare el tribunal respectivo y en el cual puedan practicárseles las notificaciones posteriores. Asimismo, deberán comunicar cualquier cambio de su domicilio. En caso de omisión del señalamiento del domicilio o de la comunicación de sus cambios, o de cualquier inexactitud del mismo o de la inexistencia del domicilio indicado, las resoluciones que se dictaren se notificarán por el estado diario. Para tal efecto, los intervinientes en el procedimiento deberán ser advertidos de esta circunstancia, lo que se hará constar en el acta que se levantare. …"}]}, {"id": "QUE-VF-15", "o": "Prueba Quellón", "t": "vf", "m": "PE", "e": "El delito de abuso sexual por sorpresa, art. 366 inciso 3° del Código Penal, se comete sólo respecto de víctimas mayores de 14 años.", "f": "Art. 366 inc. 3° CP: 'siempre que ésta sea mayor de catorce años'.", "g": "", "r": 1, "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}]}, {"id": "QUE-VF-16", "o": "Prueba Quellón", "t": "vf", "m": "PI", "e": "Las investigaciones por hechos constitutivos de delitos tributarios sancionados con penas privativas de libertad, solo pueden iniciarse por denuncia o querella del Servicio de Impuestos Internos.", "f": "Art. 162 Código Tributario: sólo por denuncia o querella del Servicio de Impuestos Internos.", "g": "", "r": 1}, {"id": "QUE-VF-17", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Si el Ministerio Público solicita el sobreseimiento definitivo de una causa, la regla general es que debe soportar las costas.", "f": "Art. 48 CPP: absuelto o sobreseído definitivamente el imputado, el Ministerio Público es condenado en costas, salvo las excepciones que la norma indica.", "g": "", "r": 1, "x": [{"c": "Art. 48 CPP", "t": "Artículo 48.- Absolución y sobreseimiento definitivo. Cuando el imputado fuere absuelto o sobreseído definitivamente, el ministerio público será condenado en costas, salvo que hubiere formulado la acusación en cumplimiento de la orden judicial a que se refiere el inciso segundo del artículo 462 o cuando el tribunal estime razonable eximirle por razones fundadas. En dicho evento será también condenado el querellante, salvo que el tribunal lo eximiere del pago, total o parcialmente, por razones fundadas que expresará determinadamente."}]}, {"id": "QUE-VF-18", "o": "Prueba Quellón", "t": "vf", "m": "PC", "e": "El imputado que no comparece injustificadamente a una actuación judicial puede ser sometido a prisión preventiva.", "f": "Art. 33 inc. 3° CPP: puede ser detenido o sometido a prisión preventiva hasta la realización de la actuación.", "g": "", "r": 1, "x": [{"c": "Art. 33 CPP", "t": "… Se hará saber a los citados el tribunal ante el cual debieren comparecer, su domicilio, la fecha y hora de la audiencia, la identificación del proceso de que se tratare y el motivo de su comparecencia. Al mismo tiempo se les advertirá que la no comparecencia injustificada dará lugar a que sean conducidos por medio de la fuerza pública, que quedarán obligados al pago de las costas que causaren y que pueden imponérseles sanciones. También se les deberá indicar que, en caso de impedimento, deberán comunicarlo y justificarlo ante el tribunal, con anterioridad a la fecha de la audiencia, si fuere posible. El tribunal podrá ordenar que el imputado que no compareciere injustificadamente sea detenido o sometido a prisión preventiva hasta la realización de la actuación respectiva. …"}]}, {"id": "QUE-VF-19", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "Toda resolución judicial está sujeta a la obligación de fundamentación.", "f": "Art. 36 CPP: se exceptúan las resoluciones sobre cuestiones de mero trámite.", "g": "", "r": 0, "x": [{"c": "Art. 36 CPP", "t": "Artículo 36.- Fundamentación. Será obligación del tribunal fundamentar las resoluciones que dictare, con excepción de aquellas que se pronunciaren sobre cuestiones de mero trámite. La fundamentación expresará sucintamente, pero con precisión, los motivos de hecho y de derecho en que se basaren las decisiones tomadas. La simple relación de los documentos del procedimiento o la mención de los medios de prueba o solicitudes de los intervinientes no sustituirá en caso alguno la fundamentación."}]}, {"id": "QUE-VF-20", "o": "Prueba Quellón", "t": "vf", "m": "PG", "e": "La minoría de edad excluye la antijuridicidad.", "f": "La minoría de edad excluye la imputabilidad (culpabilidad), no la antijuridicidad (art. 10 N° 2 CP).", "g": "", "r": 0, "x": [{"c": "Art. 10 CP", "t": "ART. 10. Están exentos de responsabilidad criminal: 1.° El loco o demente, a no ser que haya obrado en un intervalo lúcido, y el que, por cualquier causa independiente de su voluntad, se halla privado totalmente de razón. Inciso Derogado. Inciso Derogado. Art. DECIMONOVENO 2.º El menor de dieciocho años. La responsabilidad de N° 1 los menores de dieciocho años y mayores de catorce se regulará por lo dispuesto en la ley de responsabilidad penal juvenil. 3.° Derogado. 4.° El que obra en defensa de su persona o derechos, siempre que concurran las circunstancias siguientes: Primera.-Agresión Ilegítima. Segunda.- Necesidad racional del medio empleado para …"}]}, {"id": "QUE-VF-21", "o": "Prueba Quellón", "t": "vf", "m": "PP", "e": "La interpretación restrictiva de la ley procesal penal, se aplica exclusivamente a las medidas privativas y/o restrictivas de libertad aplicadas sobre el imputado (art. 5 CPP).", "f": "Art. 5° inc. 2° CPP: alcanza a toda disposición que autorice restringir la libertad u otros derechos del imputado o el ejercicio de sus facultades.", "g": "", "r": 0, "x": [{"c": "Art. 5 CPP", "t": "Artículo 5º.- Legalidad de las medidas privativas o restrictivas de libertad. No se podrá citar, arrestar, detener, someter a prisión preventiva ni aplicar cualquier otra forma de privación o restricción de libertad a ninguna persona, sino en los casos y en la forma señalados por la Constitución y las leyes. Las disposiciones de este Código que autorizan la restricción de la libertad o de otros derechos del imputado o del ejercicio de alguna de sus facultades serán interpretadas restrictivamente y no se podrán aplicar por analogía."}]}, {"id": "QUE-VF-22", "o": "Prueba Quellón", "t": "vf", "m": "PI", "e": "El término de una investigación por empleo de la facultad de no iniciar investigación, genera el sobreseimiento definitivo de la misma.", "f": "Art. 168 CPP: es una decisión administrativa del fiscal aprobada por el juez; no produce sobreseimiento ni cosa juzgada.", "g": "", "r": 0, "x": [{"c": "Art. 168 CPP", "t": "Artículo 168.- Facultad para no iniciar investigación. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el fiscal podrá abstenerse de toda investigación, cuando los hechos relatados en la denuncia no fueren constitutivos de delito o cuando los antecedentes y datos suministrados permitieren establecer que se encuentra extinguida la responsabilidad penal del imputado. Esta decisión será siempre fundada y se someterá a la aprobación del juez de garantía."}]}, {"id": "QUE-VF-23", "o": "Prueba Quellón", "t": "vf", "m": "PG", "e": "Cuando la pena señalada en la ley consta de dos o más grados y, no concurriendo circunstancias atenuantes, concurre una circunstancia agravante, el tribunal podrá imponer la pena inmediatamente superior en grado al máximo de los asignados por la ley.", "f": "Art. 68 inc. 2° CP: con una sola agravante y sin atenuantes, el tribunal no aplica el grado mínimo. El aumento al grado superior exige dos o más agravantes (inc. 4°).", "g": "", "r": 0, "x": [{"c": "Art. 68 CP", "t": "… divisible, o diversos grados de penas divisibles, el tribunal al aplicarla podrá recorrer toda su extensión, si no concurren en el hecho circunstancias atenuantes ni agravantes. Habiendo una sola circunstancia atenuante o una sola circunstancia agravante, no aplicará en el primer caso el grado máximo ni en el segundo el mínimo. Si son dos o más las circunstancias atenuantes y no hay ninguna agravante, el tribunal podrá imponer la pena inferior en uno, dos o tres grados al mínimo de los señalados por la ley, según sea el número y entidad de dichas circunstancias. Cuando, no concurriendo circunstancias atenuantes, hay dos o más agravantes, podrá imponer la inmediatamente superior en grado al máximo de los designados por la ley. …"}]}, {"id": "QUE-VF-24", "o": "Prueba Quellón", "t": "vf", "m": "PG", "e": "Los delitos impropios de omisión (también denominados de comisión por omisión) son delitos comunes que consisten en “no impedir un resultado”, pudiendo hacerlo.", "f": "La comisión por omisión exige posición de garante: son delitos especiales, no comunes.", "g": "", "r": 0}, {"id": "QUE-VF-25", "o": "Prueba Quellón", "t": "vf", "m": "PG", "e": "La pena de multa sólo es aplicable en caso de faltas y de simples delitos.", "f": "Art. 21 CP: la multa es pena común a crímenes, simples delitos y faltas.", "g": "", "r": 0, "x": [{"c": "Art. 21 CP", "t": "… o en empresas que participen en concesiones otorgadas por el Estado o cuyo objeto sea la provisión de servicios de utilidad pública. Inhabilitación especial temporal para emitir licencias médicas. Suspensión de cargo u oficio público o profesión titular. Inhabilidad perpetua para conducir vehículos a tracción mecánica o animal. Suspensión para conducir vehículos a tracción mecánica o animal. Inhabilidad absoluta perpetua para la tenencia de animales. PENAS DE LAS FALTAS. Prisión. Inhabilidad perpetua para conducir vehículos a tracción mecánica o animal. Suspensión para conducir vehículos a tracción mecánica o animal. PENAS COMUNES A LAS TRES CLASES ANTERIORES. Multa. Pérdida o comiso de los instrumentos o efectos del delito. …"}]}, {"id": "CN-VF-1", "o": "Prueba CN", "t": "vf", "m": "PG", "e": "Toda sentencia condenatoria en materia criminal lleva envuelta la obligación de pagar las costas, daños y perjuicios por parte de los autores, cómplices, encubridores y demás personas legalmente responsables", "f": "Art. 24 CP.", "g": "", "r": 1, "x": [{"c": "Art. 24 CP", "t": "ART. 24. Toda sentencia condenatoria en materia criminal lleva envuelta la obligación de pagar las costas, daños y perjuicios por parte de los autores, cómplices, encubridores y demás personas legalmente responsables."}]}, {"id": "CN-VF-2", "o": "Prueba CN", "t": "vf", "m": "LE", "e": "La ley de violencia intrafamiliar no resulta aplicable a las agresiones que se cometan entre los padres de un hijo común, si estos no tienen o no han tenido una relación de matrimonio o convivencia.", "f": "Art. 5° N° 4 Ley 20.066: comprende a quienes son padre o madre de un hijo o hija en común, sin exigir matrimonio ni convivencia.", "g": "", "r": 0, "x": [{"c": "Art. 5 Ley 20.066", "t": "… Será constitutivo de violencia intrafamiliar todo maltrato que afecte la vida o la integridad física o psíquica, la libertad o indemnidad sexual, o la subsistencia o autonomía económica, en contra de una persona que tenga o haya tenido, respecto de quien ejerce la violencia, alguna de las siguientes calidades: 1. Cónyuge o conviviente civil. 2. Conviviente. 3. Pareja de carácter sentimental o sexual sin convivencia. 4. Padre o madre de un hijo o hija en común. 5. Pariente por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de quien agrede. También será constitutiva de violencia intrafamiliar la conducta referida en el inciso precedente cuando sea ejercida en contra de o por quien tiene una relación de parentesco por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de …"}]}, {"id": "CN-VF-3", "o": "Prueba CN", "t": "vf", "m": "LE", "e": "Para determinar si existe reincidencia en los delitos contemplados en la Ley 20.000, la misma ley permite considerar las sentencias firmes dictadas en un Estado extranjero, aun cuando la pena impuesta no haya sido cumplida.", "f": "Art. 21 Ley 20.000.", "g": "", "r": 1, "x": [{"c": "Art. 21 Ley 20.000", "t": "Artículo 21.- Para determinar si existe reincidencia en los delitos castigados en esta ley, se considerarán las sentencias firmes dictadas en un Estado extranjero, aun cuando la pena impuesta no haya sido cumplida. Párrafo 3º De la cooperación eficaz"}]}, {"id": "CN-VF-5", "o": "Prueba CN", "t": "vf", "m": "PG", "e": "El agotamiento del delito faculta al tribunal para aumentar la pena en un grado por sobre el máximo de la pena prevista por la ley para el delito consumado.", "f": "El agotamiento no es una etapa punible autónoma ni autoriza a exceder el marco penal del delito consumado.", "g": "", "r": 0}, {"id": "CN-VF-8", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "La castración es un tipo de mutilación que se encuentra sancionada de manera independiente en el Código Penal.", "f": "Art. 395 CP.", "g": "", "r": 1, "x": [{"c": "Art. 395 CP", "t": "ART. 395. El que maliciosamente castrare a otro será castigado con presidio mayor en sus grados mínimo a medio."}]}, {"id": "CN-VF-9", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "En aquellos casos que se cometa un homicidio en riña o pelea sin que conste el autor de la muerte, se castigará como autores de homicidio a todos los que ocasionaron lesiones graves al occiso.", "f": "Art. 392 CP: se impone a quienes causaron lesiones graves una pena propia (presidio menor en su grado máximo), no la del homicidio.", "g": "", "r": 0, "x": [{"c": "Art. 392 CP", "t": "ART. 392. Cometiéndose un homicidio en riña o pelea y no constando el autor de la muerte, pero sí los que causaron lesiones graves al occiso, se impondrá a todos éstos la pena de presidio menor en su grado máximo. Si no constare tampoco quienes causaron lesiones graves al ofendido, se impondrá a todos los que hubieren ejercido violencia en su persona la de presidio menor en su grado medio."}]}, {"id": "CN-VF-10", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "La ley castiga como autor del delito de abigeato a la persona en cuyo poder se encuentren animales, que sean objeto de este delito, o partes de los mismos y no puedan justificar su adquisición o legitima tenencia.", "f": "Art. 448 quáter inc. 1° CP.", "g": "", "r": 1, "x": [{"c": "Art. 448 quáter CP", "t": "ART. 448 quáter. Se castigará como autor de abigeato a aquel en cuyo poder se encuentren animales o partes de los mismos referidos en este Párrafo, cuando no pueda justificar su adquisición o legítima tenencia y, del mismo modo, al que sea habido en predio ajeno, arreando, transportando, manteniendo cautivas, inmovilizadas o maniatadas dichas especies animales. El porte de armas, herramientas o utensilios comúnmente empleados para el faenamiento de animales por quien no diere descargo suficiente de su tenencia, se castigará de conformidad a lo establecido en el artículo 445. Las marcas registradas, señales conocidas, dispositivos de identificación individual oficial registrados ante el Servicio Agrícola y Ganadero u otras de carácter electrónico o tecnológico puestas sobre el animal, constituyen presunción de dominio a favor del dueño de la marca o señal. …"}]}, {"id": "CN-VF-12", "o": "Prueba CN", "t": "vf", "m": "PC", "e": "Entre las hipótesis que hacen procedente el control de identidad del artículo 85 del Código Procesal Penal, se encuentran los casos en que los funcionarios policiales tengan algún antecedente que les permita inferir que una determinada persona tiene una orden de detención pendiente.", "f": "Art. 85 inc. 1° CPP.", "g": "", "r": 1, "x": [{"c": "Art. 85 CPP", "t": "… El funcionario policial deberá otorgar a la persona facilidades para encontrar y exhibir estos instrumentos. Procederá también tal solicitud cuando los funcionarios policiales tengan algún antecedente que les permita inferir que una determinada persona tiene alguna orden de detención pendiente. La identificación se realizará en el lugar en que la persona se encontrare, por medio de documentos de identificación expedidos por la autoridad pública, como cédula de identidad, licencia de conducir o pasaporte. El funcionario policial deberá otorgar a la persona facilidades para encontrar y exhibir estos instrumentos. Durante este procedimiento, sin necesidad de nuevo indicio, la policía podrá proceder al registro de las vestimentas, equipaje o vehículo de la persona cuya identidad se controla, y cotejar la existencia de las órdenes de detención que pudieren afectarle. …"}]}, {"id": "CN-VF-13", "o": "Prueba CN", "t": "vf", "m": "PP", "e": "La cautela de garantías a que hace referencia el artículo 10 del Código Procesal Penal sólo puede ejercerse hasta la audiencia de preparación de juicio oral.", "f": "Art. 10 CPP: procede en cualquier etapa del procedimiento.", "g": "", "r": 0, "x": [{"c": "Art. 10 CPP", "t": "Artículo 10.- Cautela de garantías. En cualquiera etapa del procedimiento en que el juez de garantía estimare que el imputado no está en condiciones de ejercer los derechos que le otorgan las garantías judiciales consagradas en la Constitución Política, en las leyes o en los tratados internacionales ratificados por Chile y que se encuentren vigentes, adoptará, de oficio o a petición de parte, las medidas necesarias para permitir dicho ejercicio. Si esas medidas no fueren suficientes para evitar que pudiere producirse una afectación sustancial de los derechos del imputado, el juez ordenará la suspensión del procedimiento por el menor tiempo posible y citará a los intervinientes a una audiencia que se celebrará con los que asistan. …"}]}, {"id": "CN-VF-14", "o": "Prueba CN", "t": "vf", "m": "PI", "e": "La suspensión condicional del procedimiento extingue las acciones civiles de la víctima.", "f": "Art. 240 CPP: la suspensión condicional no extingue las acciones civiles de la víctima o de terceros.", "g": "", "r": 0, "x": [{"c": "Art. 240 CPP", "t": "Artículo 240.- Efectos de la suspensión condicional del procedimiento. La suspensión condicional del procedimiento no extingue las acciones civiles de la víctima o de terceros. Sin embargo, si la víctima recibiere pagos en virtud de lo previsto en el artículo 238, letra e), ellos se imputarán a la indemnización de perjuicios que le pudiere corresponder. Transcurrido el plazo que el tribunal hubiere fijado de conformidad al artículo 237, inciso quinto, sin que la suspensión fuere revocada, se extinguirá la acción penal, debiendo el tribunal dictar de oficio o a petición de parte el sobreseimiento definitivo."}]}, {"id": "CN-VF-15", "o": "Prueba CN", "t": "vf", "m": "PI", "e": "El sobreseimiento definitivo tiene autoridad de cosa juzgada.", "f": "Art. 251 CPP.", "g": "", "r": 1, "x": [{"c": "Art. 251 CPP", "t": "Artículo 251.- Efectos del sobreseimiento definitivo. El sobreseimiento definitivo pone término al procedimiento y tiene la autoridad de cosa juzgada."}]}, {"id": "CN-VF-16", "o": "Prueba CN", "t": "vf", "m": "PI", "e": "Si un fiscal estima necesario exhumar un cadáver para la práctica de diligencias, debe pedir autorización judicial.", "f": "Art. 202 CPP: el fiscal debe solicitar autorización judicial.", "g": "", "r": 1, "x": [{"c": "Art. 202 CPP", "t": "Artículo 202.- Exhumación. En casos calificados y cuando considerare que la exhumación de un cadáver pudiere resultar de utilidad en la investigación de un hecho punible, el fiscal podrá solicitar autorización judicial para la práctica de dicha diligencia. El tribunal resolverá según lo estimare pertinente, previa citación del cónyuge o del conviviente civil, o de los parientes más cercanos del difunto. En todo caso, practicados el examen o la autopsia iii) correspondientes se procederá a la inmediata sepultura del cadáver."}]}, {"id": "CN-VF-17", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "Sólo pueden ser sujetos pasivos del delito de maltrato corporal relevante (art. 403 bis CP) las personas menores de 18 años.", "f": "Art. 403 bis CP: también protege a personas adultas mayores y a personas en situación de discapacidad.", "g": "", "r": 0, "x": [{"c": "Art. 403 bis CP", "t": "ART. 403 bis.- El que, de manera relevante, maltratare corporalmente a un niño, niña o adolescente menor de dieciocho años, a una persona adulta mayor o a una persona en situación de discapacidad en los términos de la ley N° 20.422 será sancionado con prisión en cualquiera de sus grados o multa de una a cuatro unidades tributarias mensuales, salvo que el hecho sea constitutivo de un delito de mayor gravedad. El que teniendo un deber especial de cuidado o protección respecto de alguna de las personas referidas en el inciso primero, la maltratare corporalmente de manera relevante o no impidiere su maltrato debiendo hacerlo, será castigado con la pena de presidio menor en su grado mínimo, salvo que el hecho fuere constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la …"}]}, {"id": "CN-VF-18", "o": "Prueba CN", "t": "vf", "m": "PI", "e": "En los delitos en que fuere necesaria la realización de exámenes médicos para la determinación del hecho punible, el fiscal sólo podrá ordenar que éstos sean llevados a efecto por el Servicio Médico Legal.", "f": "Arts. 198 y 199 CPP: los exámenes pueden practicarse en hospitales, clínicas y establecimientos de salud públicos o privados, no sólo en el Servicio Médico Legal.", "g": "", "r": 0, "x": [{"c": "Art. 198 CPP", "t": "Artículo 198.- Exámenes médicos y pruebas relacionadas con los delitos previstos en los artículos 361 a 367 y en el artículo 375 del Código Penal. Tratándose de los delitos previstos en los artículos 361 a 367 y en el artículo 375 del Código Penal, los hospitales, clínicas y establecimientos de salud semejantes, sean públicos o privados, deberán practicar los reconocimientos, exámenes médicos y pruebas biológicas conducentes a acreditar el hecho punible y a identificar a los partícipes en su comisión, debiendo conservar los antecedentes y muestras correspondientes. Se levantará acta, en duplicado, del reconocimiento y de los exámenes realizados, la que será suscrita por el jefe del establecimiento o de la respectiva sección y por los profesionales que los hubieren practicado. …"}]}, {"id": "CN-VF-19", "o": "Prueba CN", "t": "vf", "m": "LE", "e": "La responsabilidad de los adolescentes por la comisión de simples delitos prescribe en cuatro años.", "f": "Art. 5° Ley 20.084: dos años para simples delitos, cinco para crímenes y seis meses para faltas (con la regla especial de su inc. 2° para ciertos delitos contra menores).", "g": "", "r": 0, "x": [{"c": "Art. 5 Ley 20.084", "t": "Artículo 5º.- Prescripción. La prescripción de la acción penal y de la pena será de dos años, con excepción de las conductas constitutivas de crímenes, respecto de las cuales será de cinco años, y de las faltas, en que será de seis meses. No obstante, tratándose de los crímenes y simples delitos descritos y sancionados en los artículos 141, inciso final; 142, inciso final, ambos en relación con la violación; los artículos 150 B y 150 E, ambos en relación con los artículos 361, 362 y 365 bis; los artículos 361, 362, 363, 365 bis, 366, 366 bis, 366 quáter, 366 quinquies, 367, 367 ter; el artículo 411 quáter en relación con la explotación sexual; …"}]}, {"id": "CN-VF-20", "o": "Prueba CN", "t": "vf", "m": "LE", "e": "Conforme a la Ley de Responsabilidad Penal Adolescente, los menores de 16 años no son responsables por las faltas penales que cometan.", "f": "Art. 1° inc. 3° Ley 20.084: por faltas sólo responden los mayores de dieciséis años y por las que ahí se indican.", "g": "", "r": 1, "x": [{"c": "Art. 1 Ley 20.084", "t": "Artículo 1º.- Contenido de la ley. La presente ley regula la responsabilidad penal de los adolescentes por los delitos que cometan, el procedimiento para la averiguación y establecimiento de dicha responsabilidad, la determinación de las sanciones procedentes y la forma de ejecución de éstas. En lo no previsto por ella serán aplicables, supletoriamente, las disposiciones contenidas en el Código Penal y en las leyes penales especiales. Tratándose de faltas, sólo serán responsables en conformidad con la presente ley los adolescentes mayores de dieciséis años y exclusivamente tratándose de aquellas tipificadas en los artículos 494 números 1, 4, 5 y 19, sólo en relación con el artículo 477, 494 bis, 495, número 21, y 496, números 5 y 26, del Código Penal y de las tipificadas en la ley Nº 20.000. …"}]}, {"id": "CN-VF-21", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "El delito de abuso sexual por sorpresa (art. 366 inc 3) sanciona aquellas conductas en las que el sujeto activo utilice la sorpresa u otra maniobra que no implique el consentimiento de la víctima, siempre que se cometa el hecho en lugares públicos o de libre acceso público.", "f": "Art. 366 inc. 3° CP: no exige lugar público; ese elemento pertenece al acoso sexual del art. 494 ter.", "g": "", "r": 0, "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}]}, {"id": "CN-VF-22", "o": "Prueba CN", "t": "vf", "m": "PE", "e": "El delito de violación con femicidio (art. 372 bis inc 2) tiene asignada la misma pena que el de violación con homicidio.", "f": "Art. 372 bis CP: la violación con femicidio (inc. 2°) es una denominación del mismo delito y tiene la misma pena, presidio perpetuo a presidio perpetuo calificado.", "g": "", "r": 1, "x": [{"c": "Art. 372 bis CP", "t": "ART. 372 BIS. El que, con ocasión de violación, cometiere además homicidio en la persona de la víctima, será castigado con presidio perpetuo a presidio perpetuo calificado. Si el autor del delito descrito en el inciso anterior es un hombre y la víctima una mujer, el delito tendrá el nombre de violación con femicidio."}]}, {"id": "CN-VF-23", "o": "Prueba CN", "t": "vf", "m": "PX", "e": "La solicitud de revisión de sentencias firmes (Art. 473 y siguientes CPP) se debe presentar por escrito ante la Secretaria Penal de la Corte de Apelaciones respectiva.", "f": "Arts. 473 y 474 CPP: la revisión se solicita ante la Corte Suprema.", "g": "", "r": 0, "x": [{"c": "Art. 473 CPP", "t": "Artículo 473.- Procedencia de la revisión. La Corte Suprema podrá rever extraordinariamente las sentencias firmes en que se hubiere condenado a alguien por un crimen o simple delito, para anularlas, en los siguientes casos: a) Cuando, en virtud de sentencias contradictorias, estuvieren sufriendo condena dos o más personas por un mismo delito que no hubiere podido ser cometido más que por una sola; b) Cuando alguno estuviere sufriendo condena como autor, cómplice o encubridor del homicidio de una persona cuya existencia se comprobare después de la condena; c) Cuando alguno estuviere sufriendo condena en virtud de sentencia fundada en un documento o en el testimonio de una o más personas, siempre que dicho documento o dicho testimonio hubiere sido declarado falso por sentencia firme en causa criminal; …"}]}, {"id": "CN-VF-24", "o": "Prueba CN", "t": "vf", "m": "PC", "e": "El tribunal debe poner término a la prisión preventiva cuando decrete el sobreseimiento definitivo o temporal de la causa, aun cuando dicha resolución no se encuentre ejecutoriada.", "f": "Art. 153 CPP.", "g": "", "r": 1, "x": [{"c": "Art. 153 CPP", "t": "Artículo 153.- Término de la prisión preventiva por absolución o sobreseimiento. El tribunal deberá poner término a la prisión preventiva cuando dictare sentencia absolutoria y cuando decretare sobreseimiento definitivo o temporal, aunque dichas resoluciones no se encontraren ejecutoriadas. En los casos indicados en el inciso precedente, se podrá imponer alguna de las medidas señaladas en el párrafo 6º de este Título, cuando se consideraren necesarias para asegurar la presencia del imputado. Párrafo 5º Requisitos comunes a la prisión preventiva y a la detención"}]}, {"id": "CN-VF-25", "o": "Prueba CN", "t": "vf", "m": "PI", "e": "La resolución judicial que se pronuncia acerca de la suspensión condicional del procedimiento solo puede ser apelada por el imputado o por el querellante.", "f": "Art. 237 CPP: la resolución es apelable por el imputado, la víctima, el Ministerio Público y el querellante.", "g": "", "r": 0, "x": [{"c": "Art. 237 CPP", "t": "… corresponda. Al decretar la suspensión condicional del procedimiento, el juez de garantía establecerá las condiciones a las que deberá someterse el imputado, por el plazo que determine, el que no podrá ser inferior a un año ni superior a tres. Durante dicho período no se reanudará el curso de la prescripción de la acción penal. Asimismo, durante el término por el que se prolongare la suspensión condicional del procedimiento se suspenderá el plazo previsto en el artículo 247. La resolución que se pronunciare acerca de la Art. c) suspensión condicional del procedimiento será apelable por el imputado, por la víctima, por el ministerio público y por el querellante. …"}]}, {"id": "CN23-VF-1", "o": "Prueba CN 2023", "t": "vf", "m": "PR", "e": "Solo será susceptible de recurso de apelación el auto de apertura de juicio oral por el Ministerio Público por la exclusión de pruebas que provinieren de actuaciones o diligencias declaradas nulas y aquellas que hubieren sido obtenidas con inobservancia de garantías fundamentales.", "f": "Art. 277 inc. 2° CPP en relación con el art. 276 inc. 3°.", "g": "", "r": 1, "x": [{"c": "Art. 277 CPP", "t": "… b) La o las acusaciones que deberán ser objeto del juicio y las correcciones formales que se hubieren realizado en ellas; c) La demanda civil; d) Los hechos que se dieren por acreditados, en conformidad con lo dispuesto en el artículo 275; e) Las pruebas que deberán rendirse en el juicio oral, de acuerdo a lo previsto en el artículo anterior, y f) La individualización de quienes debieren ser citados a la audiencia del juicio oral, con mención de los testigos a los que debiere pagarse anticipadamente sus gastos de traslado y habitación y los montos respectivos. El auto de apertura del juicio oral sólo será susceptible del recurso de apelación, cuando lo interpusiere el ministerio público por la exclusión de pruebas decretada por el juez de garantía de acuerdo a lo previsto en el inciso tercero del artículo precedente. …"}]}, {"id": "CN23-VF-2", "o": "Prueba CN 2023", "t": "vf", "m": "PG", "e": "A partir del 18 de julio del año 2019, es imprescriptible la acción penal de las figuras penales relacionadas con delitos de connotación sexual cuando al momento de la perpetración de los hechos, la víctima fuere menor de 18 años.", "f": "Art. 94 bis CP, incorporado por la Ley 21.160 (D.O. 18.07.2019); rige para hechos posteriores a su publicación.", "g": "", "r": 1, "x": [{"c": "Art. 94 bis CP", "t": "ART. 94 bis. No prescribirá la acción penal respecto de los crímenes y simples delitos descritos y sancionados en los artículos 141, inciso final, y 142, inciso final, ambos en relación con la violación; los artículos 150 B y 150 E, ambos en relación con los artículos 361, 362 y 365 bis; los artículos 361, 362, 363, 365 bis, 366, 366 bis, 366 quáter, 367, 367 ter, 367 quáter, 367 septies; el artículo 411 quáter en relación con la explotación sexual; y el artículo 433, N° 1, en relación con la violación, cuando al momento de la perpetración del hecho la víctima fuere menor de edad. En caso de que el delito previsto en el inciso primero del artículo 366 se cometiere contra mayores de edad, la prescripción de la acción penal será de diez años."}]}, {"id": "CN23-VF-3", "o": "Prueba CN 2023", "t": "vf", "m": "LE", "e": "Las medidas cautelares en materia de Violencia Intrafamiliar se someten siempre a las mismas reglas que las contendidas en el Código Procesal Penal en cuanto a la oportunidad procesal para su imposición.", "f": "Art. 15 Ley 20.066: pueden decretarse aun antes de la formalización, a diferencia de la regla general de los arts. 140 y 155 CPP.", "g": "", "r": 0, "x": [{"c": "Art. 15 Ley 20.066", "t": "Artículo 15.- Medidas cautelares. En cualquier etapa de la investigación o del procedimiento sobre delitos constitutivos de violencia intrafamiliar, y aun antes de la formalización, el juez de garantía o el tribunal de juicio oral en lo penal, según corresponda, podrá decretar las medidas cautelares que sean necesarias para proteger a la víctima de manera eficaz y oportuna, tales como las que establecen el artículo 92 de la ley N°19.968, que crea los Tribunales de Familia, o la ley que estatuye medidas para prevenir, sancionar y erradicar la violencia en contra de las mujeres, en razón de su género."}, {"c": "Art. 140 CPP", "t": "… ejercicio de sus funciones, que tengan asignada una pena igual o superior a la de presidio menor en su grado máximo en la ley que los consagra; cuando haya actuado haciendo uso de arma de fuego o de las armas señaladas en el artículo 3 de la ley Nº17.798, sobre control de armas; cuando se encontrare sujeto a alguna medida cautelar personal como orden de detención judicial pendiente u otras, en libertad condicional o gozando de alguno de los beneficios alternativos a la ejecución de las penas privativas o restrictivas de libertad contemplados en la ley; cuando, en los últimos dos años, ha sido reiteradamente sometido a las medidas cautelares personales de detención, prisión preventiva o a la señalada en el literal a) del inciso primero del artículo 155, si éstas se han decretado por delitos que tengan asignada pena aflictiva. …"}]}, {"id": "CN23-VF-4", "o": "Prueba CN 2023", "t": "vf", "m": "PC", "e": "La caución procede cuando la prisión preventiva persigue asegurar la comparecencia del imputado al juicio, la seguridad del ofendido o la seguridad de la sociedad.", "f": "Art. 146 CPP: la caución sólo reemplaza la prisión preventiva impuesta únicamente para garantizar la comparecencia al juicio y la eventual ejecución de la pena.", "g": "", "r": 0, "x": [{"c": "Art. 146 CPP", "t": "Artículo 146.- Caución para reemplazar la prisión preventiva. Cuando la prisión preventiva hubiere sido o debiere ser impuesta únicamente para garantizar la comparecencia del imputado al juicio y a la eventual ejecución de la pena, el tribunal podrá autorizar su reemplazo por una caución económica suficiente, cuyo monto fijará. La caución podrá consistir en el depósito por el imputado u otra persona de dinero o valores, la constitución de prendas o hipotecas, o la fianza de una o más personas idóneas calificadas por el tribunal."}]}, {"id": "CN23-VF-6", "o": "Prueba CN 2023", "t": "vf", "m": "PP", "e": "En Chile tienen validez las sentencias penales extranjeras.", "f": "Art. 13 CPP.", "g": "", "r": 1, "x": [{"c": "Art. 13 CPP", "t": "Artículo 13.- Efecto en Chile de las sentencias penales de tribunales extranjeros. Tendrán valor en Chile las sentencias penales extranjeras. En consecuencia, nadie podrá ser juzgado ni sancionado por un delito por el cual hubiere sido ya condenado o absuelto por una sentencia firme de acuerdo a la ley y al procedimiento de un país extranjero, a menos que el juzgamiento en dicho país hubiere obedecido al propósito de sustraer al individuo de su responsabilidad penal por delitos de competencia de los tribunales nacionales o, cuando el imputado lo solicitare expresamente, si el proceso respectivo no hubiere sido instruido de conformidad con las garantías de un debido proceso o lo hubiere sido en términos que revelaren falta de intención de juzgarle seriamente. …"}]}, {"id": "CN23-VF-7", "o": "Prueba CN 2023", "t": "vf", "m": "PX", "e": "El imputado enajenado mental debe ser siempre sobreseído definitivamente.", "f": "Arts. 458 y ss. CPP: puede seguirse el procedimiento para aplicar medidas de seguridad; si la enajenación sobreviene, procede sobreseimiento temporal (art. 252 letra c).", "g": "", "r": 0, "x": [{"c": "Art. 458 CPP", "t": "Artículo 458.- Imputado enajenado mental. Cuando en el curso del procedimiento aparecieren antecedentes calificados que permitieren presumir fundadamente la inimputabilidad por enajenación mental del imputado, el ministerio público o juez de garantía, de oficio o a petición de parte, solicitará el informe psiquiátrico correspondiente, explicitando la conducta punible que se investiga en relación a éste. El juez ordenará la suspensión del procedimiento hasta tanto no se remitiere el informe requerido, sin perjuicio de continuarse respecto de los demás coimputados, si los hubiere. Mientras no se reciba el informe del inciso anterior, el juez podrá otorgar, mantener, sustituir o revocar las medidas cautelares señaladas en el Título V del Libro I, o bien disponer la internación provisional prevista en el artículo 464, según resulte más idóneo a los fines del proceso y la condición del imputado, conforme a los antecedentes del procedimiento."}]}, {"id": "CN23-VF-8", "o": "Prueba CN 2023", "t": "vf", "m": "PC", "e": "La resolución que denegare la orden de detención será susceptible del recurso de apelación verbal por el Ministerio Público.", "f": "Art. 127 inc. final CPP: es apelable por el Ministerio Público, pero la ley no establece apelación verbal para este caso.", "g": "", "r": 0, "x": [{"c": "Art. 127 CPP", "t": "… Además, podrá decretarse la detención del imputado por un hecho al que la ley asigne una pena privativa de libertad de crimen. Tratándose de hechos a los que la ley asigne las penas de crimen o simple delito, el juez podrá considerar como razón suficiente para ordenar la detención la circunstancia de que el imputado haya concurrido voluntariamente ante el fiscal o la policía, y reconocido voluntariamente su participación en ellos. También se decretará la detención del imputado cuya presencia en una audiencia judicial fuere condición de ésta y que, legalmente citado, no compareciere sin causa justificada. La resolución que denegare la orden de detención será susceptible del recurso de apelación por el Ministerio Público."}]}, {"id": "CN23-VF-9", "o": "Prueba CN 2023", "t": "vf", "m": "PB", "e": "El Fiscal Regional puede impartir instrucción particular en una causa asignada a un Fiscal Adjunto, no así el Fiscal Nacional.", "f": "Art. 17 letra a) Ley 19.640 (el Fiscal Nacional no puede dar instrucciones en casos particulares, salvo el art. 18) y art. 44 (el Fiscal Regional sí puede).", "g": "", "r": 1, "x": [{"c": "Art. 17 Ley 19.640", "t": "… el artículo 18. Asimismo, el Fiscal Nacional estará facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial, en las investigaciones de delitos de crimen organizado o de alta complejidad que estén a su cargo. Sin embargo, en las investigaciones en que pueda Art. a) existir una afectación a la unidad de acción así consideradas por las Unidades Especializadas o la Unidad de Supervisión, cuando corresponda, el Fiscal Nacional podrá ordenar al Fiscal Regional correspondiente que adopte las medidas que sean necesarias con el fin de garantizar el adecuado cumplimiento de la instrucción general. Asimismo, cuando tal afectación comprometa gravemente la unidad de acción, el Fiscal Nacional podrá impartir al Fiscal Regional correspondiente, medidas específicas sobre las diligencias investigativas y las actuaciones procesales que considere pertinentes. …"}]}, {"id": "CN23-VF-10", "o": "Prueba CN 2023", "t": "vf", "m": "PR", "e": "La resolución que declara la ilegalidad de la detención debe ser apelada verbalmente por el Fiscal o Abogado Asistente que concurre a la audiencia de Control de la Detención.", "f": "Art. 132 bis CPP: sólo es apelable respecto de los delitos que enumera y la norma no exige interposición verbal; la apelación verbal en la misma audiencia es la del art. 149 inc. 2°.", "g": "", "r": 0, "x": [{"c": "Art. 132 bis CPP", "t": "Artículo 132 bis.- Apelación de la resolución que declara la ilegalidad de la detención. Tratándose de los delitos establecidos en los artículos 141, 142, 361, 362, 365 bis, 390, 390 bis, 390 ter, 391, 433, 436 y 440 del Código Penal, en las leyes N°17.798 y N°20.000 que tengan penas de crimen o simple delito, y de los delitos de castración, mutilaciones y lesiones contra miembros de Carabineros, de la Policía de Investigaciones y de Gendarmería de Chile, en el ejercicio de sus funciones, la resolución que declare la ilegalidad de la detención será apelable por el fiscal o el abogado asistente del fiscal en el solo efecto devolutivo. En los demás casos no será apelable."}]}, {"id": "CN23-VF-12", "o": "Prueba CN 2023", "t": "vf", "m": "PX", "e": "En Chile, a diferencia del extranjero, no aplica la institución de la detención previa.", "f": "Art. 442 CPP: la ley chilena regula expresamente la detención previa del requerido antes de recibirse la solicitud formal de extradición.", "g": "", "r": 0, "x": [{"c": "Art. 442 CPP", "t": "Artículo 442.- Detención previa. Antes de recibirse la solicitud formal de extradición, el Ministro de la Corte Suprema podrá decretar la detención del imputado, si así se hubiere estipulado en el tratado respectivo o lo requiriere el Estado extranjero mediante una solicitud que contemple las siguientes menciones mínimas: a) La identificación del imputado; b) La existencia de una sentencia condenatoria firme o de una orden restrictiva o privativa de la libertad personal del imputado; c) La calificación del delito que motivare la solicitud, el lugar y la fecha de comisión de aquél, y d) La declaración de que se solicitará formalmente la extradición. La detención previa se decretará por el plazo que determinare el tratado aplicable o, en su defecto, por un máximo de dos meses a contar de la fecha en que el Estado requirente fuere notificado del hecho de haberse producido la detención …"}]}, {"id": "CN23-VF-13", "o": "Prueba CN 2023", "t": "vf", "m": "PG", "e": "En los delitos de mera actividad, sólo se admite el delito consumado y la tentativa, no el delito frustrado.", "f": "Doctrina mayoritaria: en los delitos de mera actividad la ejecución completa de la conducta ya consuma el tipo, por lo que no cabe frustración.", "g": "", "r": 1}, {"id": "CN23-VF-15", "o": "Prueba CN 2023", "t": "vf", "m": "PG", "e": "El concurso ideal de delitos se sanciona con una pena que excede el umbral máximo de la que establece la ley, como marco punitivo, al delito más grave.", "f": "Art. 75 CP: se impone la pena mayor asignada al delito más grave, sin exceder su marco.", "g": "", "r": 0, "x": [{"c": "Art. 75 CP", "t": "ART. 75. La disposición del artículo anterior no es aplicable en el caso de que un solo hecho constituya dos o más delitos, o cuando uno de ellos sea el medio necesario para cometer el otro. En estos casos solo se impondrá la pena mayor asignada al delito más grave."}]}, {"id": "CN23-VF-16", "o": "Prueba CN 2023", "t": "vf", "m": "PR", "e": "La causal del recurso de nulidad prevista en el artículo 373 letra b) del Código Procesal Penal, siempre será conocida por la Corte Suprema.", "f": "Art. 376 CPP: la causal del art. 373 b) la conoce la Corte de Apelaciones, salvo que existan distintas interpretaciones sostenidas por los tribunales superiores (inc. 3°).", "g": "", "r": 0, "x": [{"c": "Art. 376 CPP", "t": "Artículo 376.- Tribunal competente para conocer del recurso. El conocimiento del recurso que se fundare en la causal prevista en el artículo 373, letra a), corresponderá a la Corte Suprema. La respectiva Corte de Apelaciones conocerá de los recursos que se fundaren en las causales señaladas en el artículo 373, letra b), y en el artículo 374. No obstante lo dispuesto en el inciso precedente, cuando el recurso se fundare en la causal prevista en el artículo 373, letra b), y respecto de la materia de derecho objeto del mismo existieren distintas interpretaciones sostenidas en diversos fallos emanados de los tribunales superiores, corresponderá pronunciarse a la Corte Suprema. Del mismo modo, si un recurso se fundare en distintas causales y por aplicación de las reglas contempladas en los incisos precedentes correspondiere el conocimiento de al menos una de ellas a la Corte Suprema, ésta se …"}]}, {"id": "CN23-VF-19", "o": "Prueba CN 2023", "t": "vf", "m": "PG", "e": "El plazo de prescripción de la acción penal en el caso del delito de abuso sexual con contacto de persona mayor de 14 años es de 5 años", "f": "Art. 366 CP (simple delito) y art. 94 CP: los simples delitos prescriben en cinco años.", "g": "", "r": 1, "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}, {"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "CN23-VF-20", "o": "Prueba CN 2023", "t": "vf", "m": "PJ", "e": "La única oportunidad para rendir la prueba válidamente es en la audiencia de Juicio Oral.", "f": "Art. 296 CPP y arts. 190 a 192 y 280: se admite la prueba anticipada.", "g": "", "r": 0, "x": [{"c": "Art. 296 CPP", "t": "Artículo 296.- Oportunidad para la recepción de la prueba. La prueba que hubiere de servir de base a la sentencia deberá rendirse durante la audiencia del juicio oral, salvas las excepciones expresamente previstas en la ley. En estos últimos casos, la prueba deberá ser incorporada en la forma establecida en el Párrafo 9º de este Título."}]}, {"id": "CN23-VF-21", "o": "Prueba CN 20
