23", "t": "vf", "m": "PG", "e": "El término de la prescripción penal empieza a correr desde el día en que se hubiere cometido el delito.", "f": "Art. 95 CP (sin perjuicio de las reglas especiales de los arts. 94 bis y 369 quáter).", "g": "", "r": 1, "x": [{"c": "Art. 95 CP", "t": "ART. 95. El término de la prescripción empieza a correr desde el día en que se hubiere cometido el delito."}]}, {"id": "CN23-VF-22", "o": "Prueba CN 2023", "t": "vf", "m": "LE", "e": "Todos los delitos que están contemplados en la Ley de Armas suponen que, en el evento de condena, el cumplimiento de la pena sea efectivo.", "f": "Art. 1° inc. 2° Ley 18.216: la exclusión de penas sustitutivas alcanza sólo a los delitos y armas que ahí se indican, no a toda la Ley 17.798.", "g": "", "r": 0, "x": [{"c": "Art. 1 Ley 18.216", "t": "… 22.11.2016 la letra f) del inciso primero a los condenados por crímenes o simples delitos señalados por las leyes números 20.000, 19.366 y 18.403. No se aplicará ninguna de las penas sustitutivas contempladas en esta ley a las personas que hubieren sido condenadas con anterioridad por alguno de dichos crímenes o simples delitos en virtud de sentencia ejecutoriada, hayan cumplido o no efectivamente la condena. Tratándose de los autores de los delitos consumados que la ley califica como terroristas, no podrán aplicarse las penas señaladas en el inciso primero ni la del artículo 33. Tampoco podrán imponerse las penas establecidas en el inciso primero a los condenados por crímenes o simples delitos contemplados en la ley N° 17.798. …"}]}, {"id": "CN23-VF-23", "o": "Prueba CN 2023", "t": "vf", "m": "PR", "e": "Siempre que se interponga un recurso, se suspenderá la ejecución de la decisión del tribunal.", "f": "Art. 355 CPP: la interposición de un recurso no suspende la ejecución, salvo la sentencia definitiva condenatoria o que la ley disponga lo contrario.", "g": "", "r": 0, "x": [{"c": "Art. 355 CPP", "t": "Artículo 355.- Efecto de la interposición de recursos. La interposición de un recurso no suspenderá la ejecución de la decisión, salvo que se impugnare una sentencia definitiva condenatoria o que la ley dispusiere expresamente lo contrario."}]}, {"id": "CN23-VF-25", "o": "Prueba CN 2023", "t": "vf", "m": "PG", "e": "La prescripción será declarada de oficio por el tribunal aún cuando el imputado o acusado no la alegue, con tal que se halle presente en el juicio.", "f": "Art. 102 CP.", "g": "", "r": 1, "x": [{"c": "Art. 102 CP", "t": "ART. 102. La prescripción será declarada de oficio por el tribunal aún cuando el imputado o acusado no la alegue, con tal que se halle presente en el juicio."}]}, {"id": "SF-VF-26", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "Al que proporciona el lugar para cometer el secuestro se le sanciona aplicando la pena del cómplice.", "f": "Art. 141 inc. 2° CP: incurre en la misma pena que el autor.", "g": "P", "r": 0, "x": [{"c": "Art. 141 CP", "t": "ART. 141. El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}]}, {"id": "SF-VF-27", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "La malversación de caudales o efectos públicos sólo es un delito doloso.", "f": "Art. 234 CP: admite comisión por abandono o negligencia inexcusable.", "g": "P", "r": 0, "x": [{"c": "Art. 234 CP", "t": "ART. 234. El empleado público que, por abandono o negligencia inexcusables, diere ocasión a que se efectúe por otra persona la sustracción de caudales o efectos públicos o de particulares de que se trata en los tres números del artículo anterior, incurrirá en la pena de suspensión en cualquiera de sus grados, quedando además obligado a la devolución de la cantidad o efectos sustraídos."}]}, {"id": "SF-VF-28", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "El delito de amenazas requiere seriedad y verosimilitud.", "f": "Art. 296 CP: amenaza seria y verosímil.", "g": "", "r": 1, "x": [{"c": "Art. 296 CP", "t": "ART. 296. El que amenazare seriamente a otro con causar a él mismo o a su familia, en su persona, honra o propiedad, un mal que constituya delito, siempre que por los antecedentes aparezca verosímil la consumación del hecho, será castigado: 1º. Con presidio menor en sus grados medio a máximo, si hubiere hecho la amenaza exigiendo una cantidad o imponiendo ilegítimamente cualquiera otra condición y el culpable hubiere conseguido su propósito. 2° Con presidio menor en sus grados mínimo a medio, si hecha la amenaza bajo condición el culpable no hubiere conseguido su propósito, 3.° Con presidio menor en su grado mínimo, si la amenaza no fuere condicional; a no ser que merezca mayor pena el hecho consumado, caso en el cual se impondrá ésta. …"}]}, {"id": "SF-VF-29", "o": "Prueba San Felipe", "t": "vf", "m": "LE", "e": "En el manejo en estado de ebriedad sólo puede decretarse la suspensión de la licencia de conducir.", "f": "Art. 196 Ley de Tránsito: procede suspensión y también inhabilidad perpetua o cancelación de la licencia según el resultado y la reincidencia.", "g": "P", "r": 0, "x": [{"c": "Art. 196 Ley de Tránsito", "t": "… el caso de producirse lesiones menos graves, y de cinco años en el caso de lesiones graves. En caso de reincidencia, el juez deberá decretar la cancelación de la licencia. Si se causare alguna de las lesiones indicadas en el D.O 07.02.1984 número 1º del artículo 397 del Código Penal o la muerte de alguna persona, se impondrán las penas de presidio menor en su grado máximo, en el primer caso, y de presidio menor en su grado máximo a presidio mayor en su grado mínimo, en el segundo. En ambos casos, se aplicarán también las penas de multa de ocho a veinte unidades tributarias mensuales, de inhabilidad perpetua para conducir vehículos de tracción mecánica y el comiso del vehículo con que se ha cometido el delito, sin perjuicio de los derechos del tercero propietario, que podrá hacer valer conforme a las reglas generales del …"}]}, {"id": "SF-VF-30", "o": "Prueba San Felipe", "t": "vf", "m": "LE", "e": "La importación de armas de fuego, cualquier sea su calibre, sin competente autorización es delito.", "f": "Art. 10 Ley 17.798.", "g": "P", "r": 1, "x": [{"c": "Art. 10 Ley 17.798", "t": "Artículo 10.- Los que sin la competente autorización fabricaren, armaren, elaboraren, adaptaren, transformaren, importaren, internaren al país, exportaren, transportaren, almacenaren, distribuyeren, ofrecieren, adquirieren o celebraren convenciones respecto de los elementos indicados en las letras b), c), d) y e) del artículo 2º serán sancionados con la pena de presidio mayor en su grado mínimo. Si alguna de las conductas descritas en el inciso anterior se realizare respecto de los elementos a que se hace referencia en los incisos primero y segundo del artículo 3º, la pena será de presidio mayor en su grado mínimo a medio. Si las armas fueren material de uso bélico de la letra a) del artículo 2º o aquellas a que se hace referencia en el inciso final del artículo 3º, la pena será de presidio mayor en sus grados medio a máximo. …"}]}, {"id": "SF-VF-31", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "El particular que comete falsificación de instrumento público del art. 193 del Código Penal. Arriesga la misma pena asignada al empleado público.", "f": "Art. 194 CP: presidio menor en sus grados medio a máximo, inferior a la pena del empleado público del art. 193.", "g": "P", "r": 0, "x": [{"c": "Art. 194 CP", "t": "ART. 194. El particular que cometiere en documento público o auténtico alguna de las falsedades designadas en el artículo anterior, sufrirá la pena de presidio menor en sus grados medio a máximo."}]}, {"id": "SF-VF-32", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "En el delito de usurpación de nombre del art. 214 del Código Penal. La pena asignada al delito es independiente a la que pudiese corresponderle al autor por las consecuencias en el daño que en su fama o intereses ocasionare a la persona cuyo nombre ha usurpado.", "f": "Art. 214 CP: 'sin perjuicio de la pena que pudiere corresponderle a consecuencia del daño que en su fama o intereses ocasionare'.", "g": "", "r": 1, "x": [{"c": "Art. 214 CP", "t": "Artículo 214° El que usurpare el nombre de otro será castigado con presidio menor en su grado mínimo, sin perjuicio de la pena que pudiere corresponderle a consecuencia del daño que en su fama o intereses ocasionare a la persona cuyo nombre ha usurpado."}]}, {"id": "SF-VF-33", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "En el delito de malversación de caudales por aplicación pública diferente del art. 236 del Código Penal. El tipo penal exige que concurra daño o entorpecimiento, por lo tanto de no verificarse ello la conducta es impune.", "f": "Art. 236 CP: el daño o entorpecimiento sólo agrava la pena; sin él la conducta sigue siendo punible.", "g": "P", "r": 0, "x": [{"c": "Art. 236 CP", "t": "ART. 236. El empleado público que arbitrariamente diere a los caudales o efectos que administre una aplicación pública diferente de aquella a que estuvieren destinados, será castigado con la pena de suspensión del empleo en su grado medio, si de ello resultare daño o entorpecimiento para el servicio u objeto en que debían emplearse, y con la misma en su grado mínimo, si no resultare daño o entorpecimiento."}]}, {"id": "SF-VF-34", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "En el delito de soborno del art. 250 del Código Penal. El delito no se consuma por el mero ofrecimiento de un beneficio económico al funcionario público, siendo además necesario que aquel de inicio a lo menos a la ejecución de la conducta o incurra en la omisión solicitada o requerida por el sobornante.", "f": "Art. 250 CP: se consuma con dar, ofrecer o consentir en dar el beneficio; no exige que el funcionario ejecute u omita el acto.", "g": "", "r": 0, "x": [{"c": "Art. 250 CP", "t": "… El que diere, ofreciere o consintiere en dar a un empleado público un beneficio económico o de otra naturaleza, en provecho de éste o de un tercero, en razón del cargo del empleado en los términos del inciso primero del artículo 248, o para que realice las acciones o incurra en las omisiones señaladas en los artículos 248, inciso segundo, 248 bis y 249, o por haberlas realizado o haber incurrido en ellas, será castigado con las mismas penas de multa e inhabilitación establecidas en dichas disposiciones. Tratándose del beneficio dado, ofrecido o consentido en razón del cargo del empleado público en los términos del inciso primero del artículo 248, el sobornante será sancionado, además, con la pena de reclusión menor en su grado medio, en el caso del beneficio dado u ofrecido, o de reclusión menor en su grado mínimo, …"}]}, {"id": "SF-VF-35", "o": "Prueba San Felipe", "t": "vf", "m": "PE", "e": "En el delito de malversación de caudales del art. 233 del Código Penal, el único requisito del sujeto activo es que tenga la calidad de funcionario público.", "f": "Art. 233 CP: además debe tener a su cargo caudales o efectos públicos o de particulares en depósito, consignación o secuestro.", "g": "P", "r": 0, "x": [{"c": "Art. 233 CP", "t": "Artículo 233.- El empleado público que, teniendo a su cargo caudales o efectos públicos o de particulares en depósito, consignación o secuestro, los substrajere o consintiere que otro los substraiga, será castigado: 1.º Con presidio menor en sus grados medio a máximo, si la substracción excediere de una unidad tributaria mensual y no pasare de cuatro unidades tributarias mensuales. 2.º Con presidio menor en su grado máximo a presidio a), b) mayor en su grado mínimo, si excediere de cuatro unidades tributarias mensuales y no pasare de cuarenta unidades tributarias mensuales. 3.º Con presidio mayor en sus grados mínimo a medio, si excediere de cuarenta unidades tributarias mensuales. …"}]}, {"id": "SF-VF-36", "o": "Prueba San Felipe", "t": "vf", "m": "PX", "e": "El fiscal y el querellante pueden formular acusación verbal para efectos de solicitar un procedimiento abreviado, si la causa se encuentra formalizada y se ha citado a todos los intervinientes a una audiencia para tal efecto.", "f": "Art. 407 inc. 3° CPP.", "g": "P", "r": 1, "x": [{"c": "Art. 407 CPP", "t": "… Oportunidad para solicitar el procedimiento abreviado. Una vez formalizada la investigación, la tramitación de la causa conforme a las reglas del procedimiento abreviado podrá ser acordada en cualquier etapa del procedimiento, hasta la audiencia de preparación del juicio oral. Sin perjuicio de lo señalado en el inciso precedente, podrá solicitarse el procedimiento abreviado, aun cuando hubiere finalizado la audiencia de preparación del juicio oral y hasta antes del envío del auto de apertura al tribunal de juicio oral en lo penal. La solicitud se resolverá de conformidad a lo establecido en el artículo 280 bis. Si no se hubiere deducido aún acusación, el fiscal y el querellante, en su caso, las formularán verbalmente en la audiencia que el tribunal convocare para resolver la solicitud de procedimiento abreviado, a la que deberá citar a todos los intervinientes. …"}]}, {"id": "SF-VF-37", "o": "Prueba San Felipe", "t": "vf", "m": "PX", "e": "La aceptación de los hechos materia de la acusación, de los antecedentes que la fundaren y la conformidad con la aplicación del procedimiento abreviado, puede ser considerada por el fiscal como suficiente para estimar que concurre la circunstancia atenuante del artículo 11 N° 9 del Código Penal.", "f": "Art. 407 inc. 4° CPP.", "g": "P", "r": 1, "x": [{"c": "Art. 407 CPP", "t": "… 30.11.2021 el querellante, en su caso, las formularán verbalmente en la audiencia que el tribunal convocare para resolver la solicitud de procedimiento abreviado, a la que deberá citar a todos los intervinientes. Deducidas verbalmente las acusaciones, se procederá en lo demás en conformidad a las reglas de este Título. Si se hubiere deducido acusación, el fiscal y el acusador particular podrán modificarla según las reglas generales, así como la pena requerida, con el fin de permitir la tramitación del caso conforme a las reglas de este Título. Para estos efectos, la aceptación de los hechos a que se refiere el inciso segundo del artículo 406 podrá ser considerada por el fiscal como suficiente para estimar que concurre la circunstancia atenuante del artículo 11, Nº 9, del Código Penal, sin perjuicio de las demás reglas que fueren aplicables para la determinación de la pena. …"}]}, {"id": "SF-VF-38", "o": "Prueba San Felipe", "t": "vf", "m": "PR", "e": "Respecto de la sentencia definitiva dictada por el juez de garantía en un procedimiento abreviado, procede el recurso de nulidad conforme las reglas de los artículos 372 y siguientes del Código Procesal Penal, lo mismo que respecto de aquéllas dictadas en procedimiento simplificado.", "f": "Art. 414 CPP: contra la sentencia del procedimiento abreviado sólo procede apelación; la nulidad es propia del simplificado (art. 399).", "g": "P", "r": 0, "x": [{"c": "Art. 414 CPP", "t": "Artículo 414.- Recursos en contra de la sentencia dictada en el procedimiento abreviado. La sentencia definitiva dictada por el juez de garantía en el procedimiento abreviado sólo será impugnable por apelación, que se deberá conceder en ambos efectos. En el conocimiento del recurso de apelación la Corte podrá pronunciarse acerca de la concurrencia de los supuestos del procedimiento abreviado previstos en el artículo 406."}]}, {"id": "SF-VF-39", "o": "Prueba San Felipe", "t": "vf", "m": "LE", "e": "La suspensión condicional del procedimiento regulada en los artículos 237 y siguientes del Código Procesal Penal es aplicable tanto a los imputados adultos como adolescentes, estableciendo los mismos plazos y condiciones para ambos, sin que exista regla especial en la Ley 20.084.", "f": "Art. 41 inc. final Ley 20.084: la suspensión condicional del adolescente se decreta por un plazo no inferior a seis ni superior a doce meses.", "g": "P", "r": 0, "x": [{"c": "Art. 41 Ley 20.084", "t": "… Cuando hubiere mérito para aplicar sanciones privativas o restrictivas de libertad iguales o inferiores a 540 días, pero concurrieren antecedentes favorables que hicieren desaconsejable su imposición, el juez podrá dictar la sentencia y disponer en ella la suspensión de la pena y sus efectos por un plazo de seis meses. Transcurrido el plazo previsto en el inciso anterior sin que el imputado hubiere sido objeto de nuevo requerimiento o de una formalización de la investigación, el tribunal dejará sin efecto la sentencia y, en su reemplazo, decretará el sobreseimiento definitivo de la causa. Esta suspensión no afectará la responsabilidad civil derivada del delito. Lo dispuesto en este artículo es sin perjuicio de la posibilidad de decretar la suspensión condicional del procedimiento por un plazo no inferior a 6 ni superior a los 12 meses."}]}, {"id": "SF-VF-41", "o": "Prueba San Felipe", "t": "vf", "m": "PJ", "e": "El juez de garantía excluirá de ser rendidas en juicio las pruebas manifiestamente impertinentes, las que tuvieran por objeto acreditar hechos públicos y notorios y las que provinieren de actuaciones que hubieren sido declaradas nulas y aquellas que hubieren sido obtenidas con inobservancia de garantías fundamentales.", "f": "Art. 276 CPP.", "g": "", "r": 1, "x": [{"c": "Art. 276 CPP", "t": "… las que tuvieren por objeto acreditar hechos públicos y notorios. Si estimare que la aprobación en los mismos términos en que hubieren sido ofrecidas las pruebas testimonial y documental produciría efectos puramente dilatorios en el juicio oral, dispondrá también que el respectivo interviniente reduzca el número de testigos o de documentos, cuando mediante ellos deseare acreditar unos mismos hechos o circunstancias que no guardaren pertinencia sustancial con la materia que se someterá a conocimiento del tribunal de juicio oral en lo penal. Del mismo modo, el juez excluirá las pruebas que provinieren de actuaciones o diligencias que hubieren sido declaradas nulas y aquellas que hubieren sido obtenidas con inobservancia de garantías fundamentales. Las demás pruebas que se hubieren ofrecido serán admitidas por el juez de garantía al dictar el auto de apertura del juicio oral."}]}, {"id": "SF-VF-42", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "De acuerdo con lo dispuesto en el artículo 9° del Código Penal, las faltas sólo se castigan cuando han sido consumadas.", "f": "Art. 9° CP.", "g": "", "r": 1, "x": [{"c": "Art. 9 CP", "t": "ART. 9. Las faltas sólo se castigan cuando han sido consumadas. § II. De las circunstancias que eximen de responsabilidad criminal."}]}, {"id": "SF-VF-43", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "Es circunstancia atenuante o agravante, según la naturaleza y accidente del delito, ser el agraviado cónyuge o conviviente civil, pariente por consanguinidad o afinidad en toda la línea recta y en la colateral hasta el segundo grado, padre o hijo del ofensor.", "f": "Art. 13 CP.", "g": "", "r": 1, "x": [{"c": "Art. 13 CP", "t": "ART. 13. Es circunstancia atenuante o agravante, según la naturaleza y accidentes del delito. Ser el agraviado cónyuge o conviviente civil, pariente por consanguinidad o afinidad en toda la línea recta y en la colateral hasta el segundo grado, padre o hijo del ofensor. TÍTULO SEGUNDO. DE LAS PERSONAS RESPONSABLES DE LOS DELITOS."}]}, {"id": "SF-VF-44", "o": "Prueba San Felipe", "t": "vf", "m": "LE", "e": "La llamada “revocación de pleno derecho” de las penas sustitutivas, tiene lugar cuando, durante su cumplimiento, el condenado cometiere nuevo crimen, simple delito o falta, y fuere condenado por sentencia firme.", "f": "Art. 27 Ley 18.216: la revocación por el solo ministerio de la ley exige nuevo crimen o simple delito; las faltas no la provocan.", "g": "P", "r": 0, "x": [{"c": "Art. 27 Ley 18.216", "t": "Artículo 27.- Las penas sustitutivas reguladas en esta ley siempre se considerarán quebrantadas por el solo ministerio de la ley y darán lugar a su revocación, si durante su cumplimiento el condenado cometiere nuevo crimen o simple delito y fuere condenado por sentencia firme."}]}, {"id": "SF-VF-46", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "Se consideran autores, de acuerdo con lo dispuesto en el artículo 15 N° 3 del Código Penal, los que toman parte en la ejecución del hecho, sea de una manera inmediata y directa; sea impidiendo o procurando impedir que se evite.", "f": "Esa descripción corresponde al art. 15 N° 1 CP; el N° 3 se refiere a los concertados que facilitan los medios o presencian el hecho.", "g": "", "r": 0, "x": [{"c": "Art. 15 CP", "t": "ART. 15. Se consideran autores: 1.° Los que toman parte en la ejecución del hecho, sea de una manera inmediata y directa; sea impidiendo o procurando impedir que se evite. 2.° Los que fuerzan o inducen directamente a otro a ejecutarlo. 3.° Los que, concertados para su ejecución, facilitan los medios con que se lleva a efecto el hecho o lo presencian sin tomar parte inmediata en él."}]}, {"id": "SF-VF-47", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "Toda Ley penal en blanco constituye un atentado contra el principio de legalidad y, por tanto, deviene en inconstitucional.", "f": "Las leyes penales en blanco se admiten si el núcleo de la conducta está descrito en la ley (art. 19 N° 3 CPR y jurisprudencia del Tribunal Constitucional).", "g": "", "r": 0, "x": [{"c": "Art. 19 CPR", "t": "… Una ley orgánica constitucional regulará las demás materias que les conciernan y las sanciones que se aplicarán por el incumplimiento de sus preceptos, dentro de las cuales podrá considerar su disolución. Las asociaciones, movimientos, organizaciones o grupos de personas que persigan o realicen actividades propias de los partidos políticos sin ajustarse a las normas anteriores son ilícitos y serán sancionados de acuerdo a la referida ley orgánica constitucional. La Constitución Política garantiza el pluralismo único Nº 7 político. Son inconstitucionales los partidos, movimientos u otras formas de organización cuyos objetivos, actos o conductas no respeten los principios básicos del régimen democrático y constitucional, procuren el establecimiento de un sistema totalitario, como asimismo aquellos que hagan uso de la violencia, la propugnen o inciten a ella como método de acción política. …"}]}, {"id": "SF-VF-49", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "El error en la persona es irrelevante en nuestro sistema para el surgimiento del injusto típico, aunque tendrá incidencia en el surgimiento de las circunstancias modificatorias.", "f": "Art. 1° inc. 3° CP: el error en la persona no excluye la responsabilidad, pero no se consideran las circunstancias no conocidas que agravarían y sí las que atenúan.", "g": "", "r": 1, "x": [{"c": "Art. 1 CP", "t": "ARTÍCULO 1. Es delito toda acción u omisión voluntaria penada por la ley. Las acciones u omisiones penadas por la ley se reputan siempre voluntarias, a no ser que conste lo contrario. El que cometiere delito será responsable de él e incurrirá en la pena que la ley señale, aunque el mal recaiga sobre persona distinta de aquella a quien se proponía ofender. En tal caso no se tomarán en consideración las circunstancias, no conocidas por el delincuente, que agravarían su responsabilidad; pero sí aquellas que la atenúen."}]}, {"id": "SF-VF-50", "o": "Prueba San Felipe", "t": "vf", "m": "PG", "e": "El encubrimiento de parientes constituye siempre una eximente de responsabilidad penal.", "f": "Art. 17 inc. final CP: la exención no alcanza al que se aprovecha o facilita el aprovechamiento de los efectos del delito (N° 1).", "g": "", "r": 0, "x": [{"c": "Art. 17 CP", "t": "ART. 17. Son encubridores los que con conocimiento de la perpetración de un crimen o de un simple delito o de los actos ejecutados para llevarlo a cabo, sin haber tenido participación en él como autores ni como cómplices, intervienen, con posterioridad a su ejecución, de alguno de los modos siguientes: 1.° Aprovechándose por sí mismos o facilitando a los delincuentes medios para que se aprovechen de los efectos del crimen o simple delito. 2.° Ocultando o inutilizando el cuerpo, los efectos o instrumentos del crimen o simple delito para impedir su descubrimiento. 3.° Albergando, ocultando o proporcionando la fuga del culpable. 4.° Acogiendo, receptando o protegiendo habitualmente a los malhechores, sabiendo que lo son, aun sin conocimiento de los crímenes o simples delitos determinados que hayan cometido, o facilitándoles los medios de reunirse u ocultar sus armas o efectos, o …"}]}, {"id": "SF-SM-11", "o": "Prueba San Felipe", "t": "sm", "m": "PB", "e": "De acuerdo con la Constitución Política de la República, el Ministerio Público tiene las siguientes características y competencias:", "f": "Art. 83 CPR: organismo autónomo y jerarquizado que dirige en forma exclusiva la investigación, ejerce la acción penal pública y protege a víctimas y testigos; en caso alguno puede ejercer funciones jurisdiccionales.", "g": "P", "i": ["I. Es un organismo autónomo y jerarquizado.", "II. Dirige en forma exclusiva la investigación de los hechos constitutivos de delito y, en su caso, ejerce la acción penal pública en la forma prevista por la ley.", "III. Le corresponde adoptar las medidas de protección adecuadas para víctimas y testigos.", "IV. En determinados casos, definidos por la ley, ejerce funciones jurisdiccionales limitadas."], "a": ["Sólo III y IV", "Sólo II y III", "Sólo I, II y III", "Todas los enunciados", "Ninguno de los enunciados"], "r": 2, "x": [{"c": "Art. 83 CPR", "t": "Artículo 83.- Un organismo autónomo, jerarquizado, con el nombre de Ministerio Público, dirigirá en forma exclusiva la investigación de los hechos constitutivos de delito, los que determinen la participación punible y los que acrediten la inocencia del imputado y, en su caso, ejercerá la acción penal pública en la forma prevista por la ley. De igual manera, le corresponderá la adopción de medidas para proteger a las víctimas y a los testigos. En caso alguno podrá ejercer funciones jurisdiccionales. El ofendido por el delito y las demás personas que 24.10.1980 determine la ley podrán ejercer igualmente la acción penal. El Ministerio Público podrá impartir órdenes Nº7 directas a las Fuerzas de Orden y Seguridad durante la investigación. …"}]}, {"id": "SF-SM-13", "o": "Prueba San Felipe", "t": "sm", "m": "PI", "e": "Cierre de la investigación: Dentro del término de los diez días siguientes a declarar cerrada investigación, el fiscal podrá:", "f": "Art. 248 CPP: dentro de los diez días el fiscal puede a) solicitar sobreseimiento definitivo o temporal, b) formular acusación o c) comunicar la decisión de no perseverar.", "g": "P", "i": ["I. Solicitar el sobreseimiento definitivo o temporal de la causa.", "II. Formular acusación.", "III. Presentar requerimiento en procedimiento simplificado.", "IV. Solicitar audiencia para ventilar un procedimiento abreviado verbal.", "V. Comunicar la decisión del Ministerio Público de no perseverar en el procedimiento."], "a": ["Sólo II y IV", "Sólo I, II y V", "Sólo I, II, III y V", "Ninguno de los enunciados", "Todos los enunciados"], "r": 1, "x": [{"c": "Art. 248 CPP", "t": "Artículo 248- Cierre de la investigación. Practicadas las diligencias necesarias para la averiguación del hecho punible y sus autores, cómplices o encubridores, el fiscal declarará cerrada la investigación y podrá, dentro de los diez días siguientes: a) Solicitar el sobreseimiento definitivo o temporal de la causa; b) Formular acusación, cuando estimare que la investigación proporciona fundamento serio para el enjuiciamiento del imputado contra quien se hubiere formalizado la misma, o c) Comunicar la decisión del ministerio público de no perseverar en el procedimiento, por no haberse reunido durante la investigación los antecedentes suficientes para fundar una acusación. La comunicación de la decisión contemplada en la letra c) precedente dejará sin efecto la formalización de la investigación, dará lugar a que el juez revoque las medidas cautelares que se hubieren decretado, y la prescripción de la acción penal continuará corriendo como si nunca se hubiere interrumpido."}]}, {"id": "SF-SM-14", "o": "Prueba San Felipe", "t": "sm", "m": "PJ", "e": "Exclusión de pruebas para el juicio oral:", "f": "Art. 276 CPP (II y III) y su aplicación al simplificado (I). La IV es falsa: el auto de apertura sólo es apelable por el Ministerio Público y por la exclusión del inc. 3° del art. 276 (art. 277).", "g": "P", "i": ["I. Las reglas establecidas en el artículo 276 del Código Procesal Penal (que regula la exclusión de pruebas) es aplicable tanto al juicio oral ordinario como al simplificado.", "II. El juez de garantía excluirá de ser rendidas en juicio las pruebas manifiestamente impertinentes, las que tuvieren por objeto acreditar hechos públicos y notorios y las que provinieren de actuaciones que hubieren sido declaradas nulas y aquellas que hubieren sido obtenidas con inobservancia de garantías fundamentales.", "III. El juez de garantía podrá disponer que un interviniente reduzca el número de medios de prueba ofrecidos si estima que la forma en que se han presentado sólo tendrá efectos dilatorios en el juicio oral.", "IV. La resolución que excluye fundadamente prueba ofrecida por cualquiera de los intervinientes puede ser objeto del recurso de apelación, el que deberá ser interpuesto por la parte perjudicada dentro de quinto día."], "a": ["Sólo II y III", "Sólo II y IV", "Sólo I, II y III", "Ninguno de los enunciados", "Todos los enunciados"], "r": 2, "x": [{"c": "Art. 276 CPP", "t": "Artículo 276.- Exclusión de pruebas para el juicio oral. El juez de garantía, luego de examinar las pruebas ofrecidas y escuchar a los intervinientes que hubieren comparecido a la audiencia, ordenará fundadamente que se excluyan de ser rendidas en el juicio oral aquellas que fueren manifiestamente impertinentes y las que tuvieren por objeto acreditar hechos públicos y notorios. Si estimare que la aprobación en los mismos términos en que hubieren sido ofrecidas las pruebas testimonial y documental produciría efectos puramente dilatorios en el juicio oral, dispondrá también que el respectivo interviniente reduzca el número de testigos o de documentos, cuando mediante ellos deseare acreditar unos mismos hechos o circunstancias que no guardaren pertinencia sustancial con la materia que se someterá a conocimiento del tribunal de juicio oral en lo penal. …"}]}, {"id": "SF-SM-15", "o": "Prueba San Felipe", "t": "sm", "m": "PR", "e": "Sobre los recursos en materia penal:", "f": "Arts. 372 y 386 CPP (III) y arts. 362 y 363 CPP (IV). La II es falsa: el plazo de apelación es de cinco días (art. 366) y las sentencias del tribunal oral son inapelables (art. 364).", "g": "P", "i": ["I. Las reglas establecidas en el artículo 276 del Código Procesal Penal (que regula la exclusión de pruebas) es aplicable tanto al juicio oral ordinario como al simplificado.", "II. El plazo para interponer el recurso de apelación en materia penal es por regla general de cinco días contados desde la notificación de la resolución impugnada, salvo que se trate de una sentencia definitiva, cuyo plazo se aumenta a diez días.", "III. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según sea la causal que se esgrime y los efectos de la misma.", "IV. La reposición de las resoluciones dictadas fuera de audiencia podrá pedirse al mismo tribunal que las hubiere pronunciado, por escrito y dentro de tercero día; respecto de las dictadas en audiencia, deberá promoverse tan pronto se dicten y sólo serán admisibles cuando no hubieren sido precedidas de debate."], "a": ["Sólo II y III", "Sólo II y IV", "Sólo I, III y IV", "Ninguno de los enunciados", "Todos los enunciados"], "r": 2, "x": [{"c": "Art. 372 CPP", "t": "Artículo 372.- Del recurso de nulidad. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda, por las causales expresamente señaladas en la ley. Deberá interponerse, por escrito, dentro de los quince Art. días siguientes a la notificación de la sentencia definitiva, ante el tribunal que hubiere conocido del juicio oral. No obstante, si el juicio hubiere durado más de cinco días, el recurrente dispondrá para la interposición del recurso de un día adicional por cada dos de exceso de duración del juicio. En ningún caso este plazo podrá ser superior a treinta días. Si el vencimiento del plazo para la interposición del recurso coincide con un domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o …"}, {"c": "Art. 362 CPP", "t": "Artículo 362.- Reposición de las resoluciones dictadas fuera de audiencias. De las sentencias interlocutorias, de los autos y de los decretos dictados fuera de audiencias, podrá pedirse reposición al tribunal que los hubiere pronunciado. El recurso deberá interponerse dentro de tercero día y deberá ser fundado. El tribunal se pronunciará de plano, pero podrá oír a los demás intervinientes si se hubiere deducido en un asunto cuya complejidad así lo aconsejare. Cuando la reposición se interpusiere respecto de una resolución que también fuere susceptible de apelación y no se dedujere a la vez este recurso para el caso de que la reposición fuere denegada, se entenderá que la parte renuncia a la apelación. La reposición no tendrá efecto suspensivo, salvo cuando contra la misma resolución procediere también la apelación en este efecto."}]}, {"id": "SF-SM-18", "o": "Prueba San Felipe", "t": "sm", "m": "PG", "e": "Son circunstancias atenuantes de la responsabilidad penal:", "f": "Art. 11 CP N° 5 (arrebato y obcecación), N° 10 (celo de la justicia) y N° 3 (provocación o amenaza proporcionada). Fuerza irresistible y miedo insuperable son eximentes (art. 10 N° 9).", "g": "P", "i": ["I. Obrar violentado por una fuerza irresistible;", "II. Obrar impulsado por un miedo insuperable;", "III. Obrar por estímulos tan poderosos que naturalmente hayan producido arrebato y obcecación;", "IV. Obrar por celo de la justicia;", "V. La de haber procedido inmediatamente de parte del ofendido, provocación o amenaza proporcionada al delito."], "a": ["Sólo I, II, III, y IV", "Sólo III, IV y V", "Sólo I, III, IV y V", "Sólo II, III, IV y V", "Todas son correctas"], "r": 1, "x": [{"c": "Art. 11 CP", "t": "ART. 11. Son circunstancias atenuantes: 1.° Las expresadas en el artículo anterior, cuando no concurren todos los requisitos necesarios para eximir de responsabilidad en sus respectivos casos. 2.° Derogado. 3.° La de haber precedido inmediatamente de parte del ofendido, provocación o amenaza proporcionada al delito. 4.° La de haberse ejecutado el hecho en vindicación próxima de una ofensa grave causada al autor, a su cónyuge, o su conviviente, a sus parientes legítimos por consanguinidad o afinidad en toda la línea recta y en la colateral hasta el segundo grado inclusive, a sus padres o hijos naturales o ilegítimos reconocidos. 5.° La de obrar por estímulos tan poderosos que Art. …"}]}, {"id": "SF-SM-19", "o": "Prueba San Felipe", "t": "sm", "m": "PG", "e": "De acuerdo con lo dispuesto en el artículo 49 sexies del Código Penal, el juez podrá revocar la pena de servicios en beneficio de la comunidad cuando el condenado:", "f": "Art. 49 sexies CP, letras a) a d): las cuatro hipótesis están contempladas.", "g": "", "i": ["I. No se presentare, injustificadamente, ante Gendarmería de Chile a cumplir la pena en el plazo que determine el juez, el que no podrá ser menor a tres ni superior a siete días;", "II. Se ausentare del trabajo durante al menos dos jornadas laborales. Si el penado faltare al trabajo por causa justificada no se entenderá dicha ausencia como abandono de la actividad;", "III. Su rendimiento en la ejecución de los servicios fuere sensiblemente inferior al mínimo exigible, a pesar de los requerimientos del responsable del centro de trabajo, o", "IV. Se opusiere o incumpliere de forma reiterada y manifiesta las instrucciones que se le dieren por el responsable del centro de trabajo."], "a": ["Sólo I, II y III", "Sólo I, III y IV", "Sólo I, III y V", "Ninguna es correcta", "Todas son correctas"], "r": 4, "x": [{"c": "Art. 49 sexies CP", "t": "sexies. El juez podrá revocar la pena de servicios en beneficio de la comunidad cuando el condenado: a) No se presentare, injustificadamente, ante Gendarmería de Chile a cumplir la pena en el plazo que determine el juez, el que no podrá ser menor a tres ni superior a siete días; b) Se ausentare del trabajo durante al menos dos jornadas laborales. Si el penado faltare al trabajo por causa justificada no se entenderá dicha ausencia como abandono de la actividad; c) Su rendimiento en la ejecución de los servicios fuere sensiblemente inferior al mínimo exigible, a pesar de los requerimientos del responsable del centro de trabajo, o d) Se opusiere o incumpliere de forma reiterada y manifiesta las instrucciones que se le dieren por el responsable del centro de trabajo. …"}]}, {"id": "SF-SM-22", "o": "Prueba San Felipe", "t": "sm", "m": "PG", "e": "Cuál de los siguientes delitos no constituye un delito de omisión propia.", "f": "El homicidio por omisión es comisión por omisión (omisión impropia): exige posición de garante y resultado. Los demás son tipos de omisión propia.", "g": "P", "i": [], "a": ["Omisión de Socorro (Art. 494 Nº 13 y 14 Código Penal)", "Omisión de denuncia (Art. 177 Código Procesal Penal)", "Omisión de detener la marcha, prestar toda la ayuda posible y dar aviso a la autoridad ante la participación en accidentes de tránsito en que se produjeren Lesiones graves gravísimas o Muerte (Art. 195 Ley del Tránsito)", "Homicidio por omisión"], "r": 3}, {"id": "SF-SM-23", "o": "Prueba San Felipe", "t": "sm", "m": "PG", "e": "Cuál de las siguientes afirmaciones es incorrecta.", "f": "En la teoría de la culpabilidad el error de prohibición invencible excluye la culpabilidad, no el dolo, que pertenece al tipo.", "g": "", "i": [], "a": ["Bajo la teoría del dolo, este elemento se entiende incluido dentro de la culpabilidad", "Bajo la teoría del dolo, el error sobre el carácter antijurídico de la conducta, cuando es vencible, excluye el dolo pero subsiste la culpa", "Bajo la teoría de la Culpabilidad, el error de prohibición invencible excluye el dolo pero subsiste la culpa", "Bajo la teoría de la culpabilidad el dolo se entiende incluido en la tipicidad"], "r": 2}, {"id": "SF-SM-1", "o": "Prueba San Felipe", "t": "sm", "m": "PE", "e": "En el delito de lesiones es correcto decir:", "f": "Art. 494 N° 5 CP (en VIF no pueden calificarse de leves), art. 400 CP (agravación) y art. 1° inc. 3° Ley 20.084 (los mayores de 16 años responden por la falta del art. 494 N° 5).", "g": "P", "i": ["1. En contexto de violencia intrafamiliar no se persiguen como lesiones leves.", "2. Si ocurren en contexto de violencia intrafamiliar se debe tener presente el artículo 400 del Código Penal.", "3. Es un atentado contra la vida e integridad física.", "4. Sólo se regulan en el Código Penal.", "5. Los imputados sujetos a la Ley 20.084 son responsables por la falta de lesiones leves."], "a": ["Sólo 1 y 4", "Sólo 1, 2 y 5", "Sólo 2, 3 y 5", "Sólo 3", "Todas las anteriores"], "r": 1, "x": [{"c": "Art. 494 CP", "t": "… en otras áreas de conservación de la biodiversidad declaradas bajo protección oficial. La pena consistirá en la prestación de servicios en Art. ÚNICO beneficio de la comunidad consistente en la limpieza de playas, lagos o ríos. Esta pena se regulará conforme a lo dispuesto en los artículos 49, 49 bis, 49 ter, 49 quáter, 49 quinquies y 49 sexies, debiendo existir consentimiento previo del condenado. En caso de no haber consentimiento, se aplicará la pena de multa. 4.° El que amenazare a otro con armas blancas y el que riñendo con otro las sacare, como no sea con motivo justo. 5.° El que causare lesiones leves, entendiéndose por tales las que, en concepto del tribunal, no se hallaren comprendidas en el art. …"}, {"c": "Art. 400 CP", "t": "ART. 400. Si los hechos a que se refieren los artículos anteriores de este párrafo se ejecutan en contra de alguna de las personas que menciona el artículo 5º de la Ley sobre Violencia Intrafamiliar, o con cualquiera de las circunstancias Segunda, Tercera o Cuarta del número 1º del artículo 391 de este Código, las penas se aumentarán en un grado. Asimismo, si los hechos a que se refieren los artículos anteriores de este párrafo se ejecutan en contra de un menor de dieciocho años de edad, adulto mayor o persona en situación de discapacidad, por quienes tengan encomendado su cuidado, la pena señalada para el delito se aumentará en un grado. …"}]}, {"id": "SF-SM-2", "o": "Prueba San Felipe", "t": "sm", "m": "PE", "e": "En el delito de femicidio:", "f": "Arts. 390 bis y 390 ter (sujetos, relación o razón de género), 390 quáter (agravantes especiales) y 390 quinquies CP (no procede la atenuante del art. 11 N° 5); el homicidio simple es residual (art. 391 N° 2).", "g": "P", "i": ["1. El sujeto pasivo es una mujer y el sujeto activo un hombre.", "2. Hay circunstancias agravantes especiales.", "3. Se tipifica atendida la relación que tuvo o tiene la víctima con el imputado o las circunstancias en que ocurre.", "4. No todas las circunstancias atenuantes del artículo 11 del Código Penal pueden ser reconocidas.", "5. Quien mata a otro y no comete parricidio o femicidio, puede ser responsable de homicidio."], "a": ["Sólo 1, 2 y 3", "Sólo 1 y 5", "Sólo 2, 3 y 4", "Ninguna de las anteriores", "Todas las anteriores"], "r": 4, "x": [{"c": "Art. 390 bis CP", "t": "Artículo 390 bis.- El hombre que matare a una mujer que es o ha sido su cónyuge o conviviente, o con quien tiene o ha tenido un hijo en común, será sancionado con la pena de presidio mayor en su grado máximo a presidio perpetuo calificado. La misma pena se impondrá al hombre que matare a una mujer en razón de tener o haber tenido con ella una relación de pareja de carácter sentimental o sexual sin convivencia."}]}, {"id": "SF-SM-3", "o": "Prueba San Felipe", "t": "sm", "m": "PE", "e": "En los delitos de robo:", "f": "Art. 432 CP (violencia, intimidación o fuerza), art. 436 inc. 2° (sorpresa) y art. 450 inc. 1° (se castigan como consumados desde la tentativa). La graduación por monto es propia del hurto (art. 446).", "g": "P", "i": ["1. El elemento característico es la violencia o intimidación en las personas o la fuerza en las cosas.", "2. La penalidad se gradúa por el monto de lo sustraído.", "3. Considera la sorpresa como medio comisivo.", "4. Los robos con violencia, robos con intimidación y robo en lugar habitado, aunque estén en grado de desarrollo imperfecto, siempre se castigarán como consumados, de acuerdo al Código Penal.", "5. Permite su configuración sólo en lugar habitado."], "a": ["Sólo 1, 2 y 3", "Sólo 1, 3, 4 y 5", "Sólo 1, 3 y 4", "Sólo 1, 2 y 5", "Todas las anteriores"], "r": 2, "x": [{"c": "Art. 432 CP", "t": "ART. 432. El que sin la voluntad de su dueño y con ánimo de lucrarse se apropia cosa mueble ajena usando de violencia o intimidación en las personas o de fuerza en las cosas, comete robo; si faltan la violencia, la intimidación y la fuerza, el delito se califica de hurto. El N° 7 de la ley 11183, publicada el 10.06.1956, modifica el presente artículo, en el sentido de derogar su inciso segundo. § II. Del robo con violencia o intimidación en las personas."}]}, {"id": "SF-SM-4", "o": "Prueba San Felipe", "t": "sm", "m": "PE", "e": "En las estafas y otros engaños:", "f": "Art. 467 CP (pena según el monto defraudado), art. 494 N° 19 (falta) y art. 469 (adulteraciones). La falta de autorización del titular integra el tipo y el art. 473 castiga los engaños no expresados en los artículos anteriores.", "g": "P", "i": ["1. La penalidad está determinada por el perjuicio producido.", "2. Puede constituir una falta.", "3. Para la utilización de claves confidenciales que habilitan el acceso u operación de un sistema informático es indiferente la autorización del titular.", "4. Puede configurarse ante determinado tipo de falsificaciones.", "5. Los engaños no expresamente tipificados no constituyen delito."], "a": ["Sólo 1, 2 y 4", "Sólo 3, 4 y 5", "Sólo 1, 2 y 3", "Sólo 1, 2, 4 y 5", "Todas las anteriores"], "r": 0, "x": [{"c": "Art. 467 CP", "t": "ART. 467.- El que para obtener provecho patrimonial para sí o para un tercero mediante engaño provocare un error en otro, haciéndolo incurrir en una disposición patrimonial consistente en ejecutar, omitir o tolerar alguna acción en perjuicio suyo o de un tercero será sancionado: 1. Con presidio menor en su grado máximo y multa de veintiuna a trescientas unidades tributarias mensuales, si el perjuicio excede de cuatrocientas unidades tributarias mensuales y no pasa de cuarenta mil. 2. Con presidio menor en sus grados medio a máximo y multa de once a quince unidades tributarias mensuales, si excede de cuarenta unidades tributarias mensuales y no pasa de cuatrocientas. 3. Con presidio menor en su grado medio y multa de seis a diez unidades tributarias mensuales, si excede de cuatro unidades tributarias mensuales y no pasa de cuarenta. …"}]}, {"id": "SF-SM-6", "o": "Prueba San Felipe", "t": "sm", "m": "LE", "e": "Son delitos tipificados en la Ley de Control de Armas los siguientes:", "f": "Art. 9° Ley 17.798: sanciona la posesión, tenencia o porte de armas de fuego y de municiones sin autorización. Los bastones eléctricos (art. 2° letra h) quedan sujetos a control administrativo, sin tipo penal por su porte.", "g": "P", "i": [], "a": ["El porte de armas de fuego", "El porte de municiones", "El porte de bastones de electroshock", "Todas las anteriores", "Sólo el porte de armas de fuego y el de municiones"], "r": 4, "x": [{"c": "Art. 9 Ley 17.798", "t": "Artículo 9º.- Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras b) y d) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado máximo. Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras c) y e) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado medio. Si el infractor tuviere algún permiso de los establecidos en el artículo 4 y en el reglamento de esta ley para los elementos señalados en los literales b) y c) del artículo 2, pero diferente a aquel cuya falta se sanciona en los …"}]}, {"id": "SF-SM-7", "o": "Prueba San Felipe", "t": "sm", "m": "LE", "e": "Los adolescentes mayores de 16 años responden penalmente por las siguientes faltas:", "f": "Art. 1° inc. 3° Ley 20.084: arts. 494 N° 1, 4, 5 y 19 (éste sólo en relación con el art. 477), 494 bis, 495 N° 21 y 496 N° 5 y 26 CP, y las faltas de la Ley 20.000.", "g": "P", "i": [], "a": ["Art. 494 N° 1 del Código Penal", "Art. 494 N° 4 del Código Penal", "Faltas tipificadas en la Ley 20.000", "Todas las anteriores", "Sólo las dos primeras"], "r": 3, "x": [{"c": "Art. 1 Ley 20.084", "t": "Artículo 1º.- Contenido de la ley. La presente ley regula la responsabilidad penal de los adolescentes por los delitos que cometan, el procedimiento para la averiguación y establecimiento de dicha responsabilidad, la determinación de las sanciones procedentes y la forma de ejecución de éstas. En lo no previsto por ella serán aplicables, supletoriamente, las disposiciones contenidas en el Código Penal y en las leyes penales especiales. Tratándose de faltas, sólo serán responsables en conformidad con la presente ley los adolescentes mayores de dieciséis años y exclusivamente tratándose de aquellas tipificadas en los artículos 494 números 1, 4, 5 y 19, sólo en relación con el artículo 477, 494 bis, 495, número 21, y 496, números 5 y 26, del Código Penal y de las tipificadas en la ley Nº 20.000. …"}, {"c": "Art. 477 CP", "t": "Artículo 477.- El incendiario de objetos no comprendidos en los artículos anteriores será penado: 1.º Con presidio menor en su grado máximo a presidio mayor en su grado mínimo y multa de once a quince unidades tributarias mensuales, si el daño causado a terceros excediere de cuarenta unidades tributarias mensuales. 2.º Con presidio menor en sus grados medio a máximo y multa de seis a diez unidades tributarias mensuales, si el daño excediere de cuatro unidades tributarias mensuales y no pasare de cuarenta unidades tributarias mensuales. 3.º Con presidio menor en sus grados mínimo a medio y multa de cinco unidades tributarias mensuales, si el daño excediere de una unidad tributaria mensual y no pasare de cuatro unidades tributarias mensuales."}]}, {"id": "SF-SM-8", "o": "Prueba San Felipe", "t": "sm", "m": "LE", "e": "La Ley 20.066 remite al delito de desacato del art. 240 del Código de Procedimiento Civil en caso de incumplimiento de:", "f": "Arts. 10 y 18 Ley 20.066: el incumplimiento de medidas cautelares, de condiciones de la suspensión condicional y de medidas accesorias se pone en conocimiento del Ministerio Público para los efectos del art. 240 inc. 2° CPC.", "g": "P", "i": [], "a": ["Medidas cautelares", "Medidas accesorias", "Condiciones de la suspensión condicional del procedimiento", "Sólo medidas cautelares y medidas accesorias", "Todas las anteriores"], "r": 4, "x": [{"c": "Art. 10 Ley 20.066", "t": "Artículo 10.- Sanciones. En caso de incumplimiento de las medidas cautelares, condiciones de suspensión condicional del procedimiento o medidas accesorias decretadas que se deba a actos u omisiones del imputado o condenado, el juez pondrá en conocimiento del Ministerio Público los antecedentes para los efectos de lo previsto en el inciso segundo del artículo 240 del Código de Procedimiento Civil, sin perjuicio de imponer al infractor, como medida de apremio, arresto hasta por quince días. La policía deberá detener a quien sea sorprendido en quebrantamiento flagrante de las medidas mencionadas en el inciso precedente."}]}, {"id": "SF-SM-9", "o": "Prueba San Felipe", "t": "sm", "m": "LE", "e": "El art. 3° de la Ley 20.000 señala quiénes trafican. Entre los verbos que emplea se encuentran:", "f": "Art. 3° inc. 2° Ley 20.000: importen, exporten, transporten, adquieran, transfieran, sustraigan, posean, suministren, guarden o porten. El cultivo se sanciona en el art. 8°.", "g": "P", "i": [], "a": ["Sustraigan", "Importen", "Cultiven", "Sólo sustraigan e importen", "Todas las anteriores"], "r": 3, "x": [{"c": "Art. 3 Ley 20.000", "t": "Artículo 3º.- Las penas establecidas en el artículo 1º se aplicarán también a quienes trafiquen, bajo cualquier título, con las sustancias a que dicha disposición se refiere, o con las materias primas que sirvan para obtenerlas y a quienes, por cualquier medio, induzcan, promuevan o faciliten el uso o consumo de tales sustancias. Se entenderá que trafican los que, sin contar con la autorización competente, importen, exporten, transporten, adquieran, transfieran, sustraigan, posean, suministren, guarden o porten tales sustancias o materias primas. Artículo 3º.- En la Región Metropolitana de Santiago, mientras no se implemente el Ministerio Público, ni entre a regir el Código Procesal Penal establecido en la ley Nº 19.696, se aplicarán las siguientes reglas: a) Se mantendrá vigente la ley Nº 19.366, en lo relativo a las normas procesales de carácter orgánico y penal que ésta contempla, salvo en lo que respecta al inciso …"}]}, {"id": "SF-SM-10", "o": "Prueba San Felipe", "t": "sm", "m": "LE", "e": "El art. 19 de la Ley 20.000 contempla, entre otras, las siguientes circunstancias agravantes:", "f": "Art. 19 Ley 20.000, letras b), d) y g).", "g": "", "i": [], "a": ["Si se utilizó violencia, armas o engaño", "Si se cometió por funcionarios públicos aprovechando o abusando de su calidad", "Si el delito se perpetró en una institución deportiva, cultural o social", "Todas las anteriores"], "r": 3, "x": [{"c": "Art. 19 Ley 20.000", "t": "Artículo 19.- Tratándose de los delitos anteriormente descritos, la pena deberá ser aumentada en un grado si concurre alguna de las circunstancias siguientes: a) Si el imputado formó parte de una agrupación o reunión de delincuentes, sin incurrir en el delito de organización del artículo 16. b) Si se utilizó violencia, armas o engaño en su comisión. c) Si se suministró, promovió, indujo o facilitó el uso o consumo de drogas o sustancias estupefacientes o sicotrópicas a menores de dieciocho años de edad, o a personas con sus facultades mentales disminuidas o perturbadas. d) Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales. e) Si el delito se cometió valiéndose de niños, niñas o adolescentes o personas exentas de responsabilidad penal. …"}]}, {"id": "SUR-SM-3", "o": "Prueba Sur", "t": "sm", "m": "LE", "e": "Juan y María tuvieron una relación de pololeo durante cuatro años sin convivencia y producto de dicha relación nació una hija. La relación terminó hace un año y Juan, al ver a María con una nueva pareja, la agrede verbalmente y con golpes de puño ocasionándole lesiones menos graves. En relación a este delito es correcto afirmar:", "f": "Art. 5° Ley 20.066: comprende al padre o madre de un hijo en común (N° 4) y, tras la Ley 21.675, a la pareja de carácter sentimental o sexual sin convivencia (N° 3).", "g": "A", "i": [], "a": ["Los hechos descritos constituyen un ilícito de lesiones menos graves en contexto de violencia intrafamiliar", "No resulta aplicable en este caso la ley de violencia intrafamiliar al no existir convivencia entre los involucrados", "Si fuese aplicable la ley de violencia intrafamiliar en este caso, el fiscal debería agravar las lesiones por las circunstancias del hecho y formalizar por lesiones graves", "Ninguna de las anteriores"], "r": 0, "x": [{"c": "Art. 5 Ley 20.066", "t": "… Será constitutivo de violencia intrafamiliar todo maltrato que afecte la vida o la integridad física o psíquica, la libertad o indemnidad sexual, o la subsistencia o autonomía económica, en contra de una persona que tenga o haya tenido, respecto de quien ejerce la violencia, alguna de las siguientes calidades: 1. Cónyuge o conviviente civil. 2. Conviviente. 3. Pareja de carácter sentimental o sexual sin convivencia. 4. Padre o madre de un hijo o hija en común. 5. Pariente por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de quien agrede. También será constitutiva de violencia intrafamiliar la conducta referida en el inciso precedente cuando sea ejercida en contra de o por quien tiene una relación de parentesco por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de …"}]}, {"id": "SUR-SM-14", "o": "Prueba Sur", "t": "sm", "m": "PX", "e": "El procedimiento abreviado podrá ser acordado:", "f": "Art. 407 inc. 1° CPP. El inc. 2° vigente permite además solicitarlo terminada la audiencia de preparación y hasta antes del envío del auto de apertura, siempre ante el juez de garantía (art. 280 bis).", "g": "A", "i": [], "a": ["Una vez formalizada la investigación y hasta antes del inicio de la audiencia de juicio oral, ante el Tribunal Oral en lo Penal", "Una vez formalizada la investigación y hasta la audiencia de cierre de investigación", "Una vez formalizada la investigación y hasta la audiencia de preparación de juicio oral", "Una vez formulada la acusación y hasta la audiencia de preparación de juicio oral"], "r": 2, "x": [{"c": "Art. 407 CPP", "t": "Artículo 407. Oportunidad para solicitar el procedimiento abreviado. Una vez formalizada la investigación, la tramitación de la causa conforme a las reglas del procedimiento abreviado podrá ser acordada en cualquier etapa del procedimiento, hasta la audiencia de preparación del juicio oral. Sin perjuicio de lo señalado en el inciso precedente, podrá solicitarse el procedimiento abreviado, aun cuando hubiere finalizado la audiencia de preparación del juicio oral y hasta antes del envío del auto de apertura al tribunal de juicio oral en lo penal. La solicitud se resolverá de conformidad a lo establecido en el artículo 280 bis. Si no se hubiere deducido aún acusación, el fiscal y el querellante, en su caso, las formularán verbalmente en la audiencia que el tribunal convocare para resolver la solicitud de procedimiento abreviado, a la que deberá citar a todos los intervinientes. …"}]}, {"id": "SUR-SM-16", "o": "Prueba Sur", "t": "sm", "m": "PE", "e": "En relación al delito de receptación del artículo 456 bis A del Código Penal, es FALSO señalar:", "f": "Art. 456 bis A inc. 3° CP: para vehículos motorizados y redes de suministro la figura es agravada (presidio menor en su grado máximo), no privilegiada.", "g": "", "i": [], "a": ["Para determinar la pena el tribunal debe tener especialmente en cuenta el valor de las especies y la gravedad del delito en que se obtuvieron, si esto era conocido por el autor", "Se impone el grado máximo de la pena del inciso primero cuando el autor haya incurrido en reiteración de este delito o sea reincidente en él", "La norma contempla una figura privilegiada para la receptación de vehículos motorizados o cosas que forman parte de redes de suministro de servicios públicos", "Si el valor de lo receptado excede de cuatrocientas unidades tributarias mensuales, se impone el grado máximo o el máximum de la pena que corresponda"], "r": 2, "x": [{"c": "Art. 456 bis A CP", "t": "… cualquier forma, aun cuando ya hubiese dispuesto de ellas, sufrirá la pena de presidio menor en cualquiera de sus grados y multa de cinco a cien unidades tributarias mensuales. Para la determinación de la pena aplicable el tribunal tendrá especialmente en cuenta el valor de las especies, así como la gravedad del delito en que se obtuvieron, si éste era conocido por el autor. Cuando el objeto de la receptación sean vehículos motorizados o cosas que forman parte de redes de suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telecomunicaciones, se impondrá la pena de presidio menor en su grado máximo y multa equivalente al valor de la tasación fiscal del vehículo o la pena de presidio menor en su grado máximo, y multa de cinco a veinte unidades tributarias mensuales, …"}]}, {"id": "SUR-SM-25", "o": "Prueba Sur", "t": "sm", "m": "PG", "e": "Señale cuál de los siguientes enunciados relativos a la extinción de la responsabilidad penal es correcto:", "f": "Art. 93 N° 4 CP. La responsabilidad se extingue por el cumplimiento de la condena (N° 2), no por su dictación, y el perdón del ofendido sólo opera en delitos de acción privada (N° 5).", "g": "", "i": [], "a": ["La responsabilidad penal se extingue por la dictación de sentencia condenatoria ejecutoriada", "El indulto sólo remite o conmuta la pena, pero no quita al beneficiario el carácter de condenado para los efectos de la reincidencia o nuevo delinquimiento y demás que determinen las leyes", "La responsabilidad penal se extingue por el perdón del ofendido en los delitos de acción penal privada y previa instancia particular", "Todas las anteriores", "Ninguna de las anteriores"], "r": 1, "x": [{"c": "Art. 93 CP", "t": "ART. 93. La responsabilidad penal se extingue: 1.° Por la muerte del responsable, siempre en cuanto a las penas personales, y respecto de las pecuniarias sólo cuando a su fallecimiento no se hubiere dictado sentencia ejecutoriada. 2.° Por el cumplimiento de la condena. 3.° Por amnistía, la cual extingue por completo la pena y todos sus efectos. 4.° Por indulto. La gracia de indulto sólo remite o conmuta la pena; pero no quita al favorecido el carácter de condenado para los efectos de la reincidencia o nuevo delinquimiento y demás que determinan las leyes. 5.° Por el perdón del ofendido cuando la pena se haya impuesto por delitos respecto de los cuales la ley sólo concede acción privada. 6.° Por la prescripción de la acción penal. 7.° Por la prescripción de la pena."}]}, {"id": "CN23-SM-31", "o": "Prueba CN 2023", "t": "sm", "m": "PE", "e": "En el robo por sorpresa, la expresión \"dineros o especies que los ofendidos lleven consigo\" NO comprende:", "f": "Art. 436 inc. 2° CP: la especie debe estar en la esfera de custodia corporal inmediata de la víctima; el equipaje en el portamaletas de un bus queda fuera y su sustracción es hurto.", "g": "", "i": [], "a": ["Llevarlas puestas (por ejemplo, ropas fáciles de arrebatar)", "Llevarlas en la ropa (por ejemplo, en los bolsillos)", "Llevarlas asidas o cogidas de las manos u otra parte del cuerpo (bolsos, carteras, mochilas y lo que contienen)", "Aquellas que se guardan en el portamaletas de un bus y son sustraídas en el paradero", "Las cosas dejadas en el suelo u otra parte, pero dentro de la esfera de resguardo material del propio cuerpo de la víctima"], "r": 3, "x": [{"c": "Art. 436 CP", "t": "ART. 436. Fuera de los casos previstos en los artículos precedentes, los robos ejecutados con violencia o intimidación en las personas, serán penados con presidio mayor en sus grados mínimo a máximo, cualquiera que sea el valor de las especies sustraídas. Se considerará como robo y se castigará con la pena de presidio menor en sus grados medio a máximo, la apropiación de dinero u otras especies que los ofendidos lleven consigo, cuando se proceda por sorpresa o aparentando riñas en lugares de concurrencia o haciendo otras maniobras dirigidas a causar agolpamiento o confusión. También será considerado robo, y se sancionará con la Art. UNICO, N° 7 pena de presidio menor en su grado máximo, la apropiación de vehículos motorizados, siempre que se valga de la sorpresa, de la distracción de la víctima o se genere por parte del autor cualquier …"}]}, {"id": "CN23-SM-45", "o": "Prueba CN 2023", "t": "sm", "m": "PE", "e": "Conforme al art. 456 bis del Código Penal, NO es circunstancia agravante en los delitos de robo y hurto:", "f": "Art. 456 bis CP: sus numerales no incluyen la calidad de funcionario público del autor.", "g": "", "i": [], "a": ["Ejecutar el delito en sitios faltos de vigilancia policial, obscuros, solitarios, sin tránsito habitual o que por cualquiera otra condición favorezcan la impunidad", "Ser la víctima niño, anciano, inválido o persona en manifiesto estado de inferioridad física", "Ser cometido por funcionario público", "Ejercer la violencia en las personas que intervengan en defensa de la víctima, salvo que este hecho importe otro delito", "Actuar con personas exentas de responsabilidad criminal, según el número 1° del artículo 10"], "r": 2, "x": [{"c": "Art. 456 bis CP", "t": "… o con cualquiera oculta o con vidrios oscuros o polarizados, en contravención a la ley N° 18.290, de Tránsito; o en el que se haya utilizado cualquier otra práctica, técnica, intervención, herramienta, dispositivo o condición que favorezca su impunidad; 4°) Ejercer la violencia en las personas que intervengan en defensa de la víctima, salvo que este hecho importe otro delito; 5°) Actuar con personas exentas de responsabilidad criminal, según el número 1.o del artículo 10, y 6º) Ejecutar los delitos de robo o hurto de cosas que forman parte de redes de suministro de servicios públicos o domiciliarios, simulando ser trabajador de alguna empresa proveedora de dichos servicios o haciendo uso de información obtenida como trabajador de la misma empresa. …"}]}, {"id": "N-VF-1", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "El plazo para solicitar un nuevo plazo conforme al artículo 17 del Código Procesal Penal es de cinco días contados desde que cesó el impedimento.", "f": "Art. 17 CPP: la solicitud debe formularse dentro de los cinco días siguientes a aquel en que hubiere cesado el impedimento.", "g": "N", "r": 1, "x": [{"c": "Art. 17 CPP", "t": "Artículo 17.- Nuevo plazo. El que, por un hecho que no le fuere imputable, por defecto en la notificación, por fuerza mayor o por caso fortuito, se hubiere visto impedido de ejercer un derecho o desarrollar una actividad dentro del plazo establecido por la ley, podrá solicitar al tribunal un nuevo plazo, que le podrá ser otorgado por el mismo período. Dicha solicitud deberá formularse dentro de los cinco días siguientes a aquél en que hubiere cesado el impedimento."}], "grp": "17|CPP"}, {"id": "N-VF-2", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "El nuevo plazo que el tribunal concede en virtud del artículo 17 del Código Procesal Penal puede otorgarse hasta por el doble del período original.", "f": "Art. 17 CPP: el nuevo plazo puede ser otorgado por el mismo período.", "g": "N", "r": 0, "x": [{"c": "Art. 17 CPP", "t": "Artículo 17.- Nuevo plazo. El que, por un hecho que no le fuere imputable, por defecto en la notificación, por fuerza mayor o por caso fortuito, se hubiere visto impedido de ejercer un derecho o desarrollar una actividad dentro del plazo establecido por la ley, podrá solicitar al tribunal un nuevo plazo, que le podrá ser otorgado por el mismo período. Dicha solicitud deberá formularse dentro de los cinco días siguientes a aquél en que hubiere cesado el impedimento."}], "grp": "17|CPP"}, {"id": "N-VF-3", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Los fiscales pueden ser condenados personalmente al pago de las costas en casos de notorio desconocimiento del derecho o de grave negligencia en el desempeño de sus funciones.", "f": "Art. 50 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 50 CPP", "t": "Artículo 50.- Personas exentas. Los fiscales, los abogados y los mandatarios de los intervinientes en el procedimiento no podrán ser condenados personalmente al pago de las costas, salvo los casos de notorio desconocimiento del derecho o de grave negligencia en el desempeño de sus funciones, en los cuales se les podrá imponer, por resolución fundada, el pago total o parcial de las costas."}], "grp": "50|CPP"}, {"id": "N-VF-4", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La calumnia y la injuria son delitos de acción penal privada.", "f": "Art. 55 letra a) CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 55 CPP", "t": "Artículo 55.- Delitos de acción privada. No podrán ser ejercidas por otra persona que la víctima, las acciones que nacen de los siguientes delitos: a) La calumnia y la injuria; b) La falta descrita en el número 11 del artículo 496 del Código Penal; c) La provocación a duelo y el denuesto o descrédito público por no haberlo aceptado, y d) El matrimonio del menor llevado a efecto sin el consentimiento de las personas designadas por la ley y celebrado de acuerdo con el funcionario llamado a autorizarlo."}], "grp": "55|CPP"}, {"id": "N-VF-5", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La acción penal pública se extingue por la renuncia de la persona ofendida.", "f": "Art. 56 CPP: la acción penal pública no se extingue por la renuncia del ofendido; sí la acción penal privada y la civil.", "g": "N", "r": 0, "x": [{"c": "Art. 56 CPP", "t": "Artículo 56.- Renuncia de la acción penal. La acción penal pública no se extingue por la renuncia de la persona ofendida. Pero se extinguen por esa renuncia la acción penal privada y la civil derivada de cualquier clase de delitos. Si el delito es de aquellos que no pueden ser perseguidos sin previa instancia particular, la renuncia de la víctima a denunciarlo extinguirá la acción penal, salvo que se tratare de delito perpetrado contra menores de edad. Esta renuncia no la podrá realizar el ministerio público."}], "grp": "56|CPP"}, {"id": "N-VF-6", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "En los delitos de acción pública previa instancia particular, el Ministerio Público puede renunciar a la denuncia en representación de la víctima.", "f": "Art. 56 inc. final CPP: esta renuncia no la puede realizar el Ministerio Público.", "g": "N", "r": 0, "x": [{"c": "Art. 56 CPP", "t": "Artículo 56.- Renuncia de la acción penal. La acción penal pública no se extingue por la renuncia de la persona ofendida. Pero se extinguen por esa renuncia la acción penal privada y la civil derivada de cualquier clase de delitos. Si el delito es de aquellos que no pueden ser perseguidos sin previa instancia particular, la renuncia de la víctima a denunciarlo extinguirá la acción penal, salvo que se tratare de delito perpetrado contra menores de edad. Esta renuncia no la podrá realizar el ministerio público."}], "grp": "56|CPP"}, {"id": "N-VF-7", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Cuando sólo se ejerce la acción civil respecto de un hecho punible de acción privada, se considera extinguida la acción penal.", "f": "Art. 66 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 66 CPP", "t": "Artículo 66.- Efectos del ejercicio exclusivo de la acción civil. Cuando sólo se ejerciere la acción civil respecto de un hecho punible de acción privada se considerará extinguida, por esa circunstancia, la acción penal. Para estos efectos no constituirá ejercicio de la acción civil la solicitud de diligencias destinadas a preparar la demanda civil o a asegurar su resultado, que se formulare en el procedimiento penal."}], "grp": "66|CPP"}, {"id": "N-VF-8", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el procedimiento penal termina sin decisión sobre la acción civil deducida oportunamente, la prescripción sigue interrumpida siempre que la víctima demande ante el tribunal civil dentro de los sesenta días siguientes.", "f": "Art. 68 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 68 CPP", "t": "… Si antes de comenzar el juicio oral, el procedimiento penal continuare de conformidad a las normas que regulan el procedimiento abreviado, o por cualquier causa terminare o se suspendiere, sin decisión acerca de la acción civil que se hubiere deducido oportunamente, la prescripción continuará interrumpida siempre que la víctima presentare su demanda ante el tribunal civil competente en el término de sesenta días siguientes a aquél en que, por resolución ejecutoriada, se dispusiere la suspensión o terminación del procedimiento penal. En este caso, la demanda y la resolución que recayere en ella se notificarán por cédula y el juicio se sujetará a las reglas del procedimiento sumario. Si la demanda no fuere deducida ante el tribunal civil competente dentro del referido plazo, la prescripción continuará corriendo como si no se hubiere interrumpido. …"}], "grp": "68|CPP"}, {"id": "N-VF-9", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La declaración judicial del imputado se presta bajo juramento o promesa de decir verdad.", "f": "Art. 98 CPP: la declaración del imputado no puede recibirse bajo juramento; el juez sólo lo exhorta a decir verdad.", "g": "N", "r": 0, "x": [{"c": "Art. 98 CPP", "t": "Artículo 98.- Declaración del imputado como medio de defensa. Durante todo el procedimiento y en cualquiera de sus etapas el imputado tendrá siempre derecho a prestar declaración, como un medio de defenderse de la imputación que se le dirigiere. La declaración judicial del imputado se prestará en audiencia a la cual podrán concurrir los intervinientes en el procedimiento, quienes deberán ser citados al efecto. La declaración del imputado no podrá recibirse bajo juramento. El juez o, en su caso, el presidente del tribunal, se limitará a exhortarlo a que diga la verdad y a que responda con claridad y precisión las preguntas que se le formularen. Regirá, correspondientemente, lo dispuesto en el artículo 326. Si con ocasión de su declaración judicial, el imputado o su defensor solicitaren la práctica de diligencias de investigación, el juez podrá recomendar al ministerio público la realización de las mismas, …"}], "grp": "98|CPP"}, {"id": "N-VF-10", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el defensor no está presente, las preguntas de la policía al imputado deben limitarse a constatar su identidad.", "f": "Art. 91 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 91 CPP", "t": "Artículo 91.- Declaraciones del imputado ante la policía. La policía sólo podrá interrogar autónomamente al imputado en presencia de su defensor. Si éste no estuviere presente durante el interrogatorio, las preguntas se limitarán a constatar la identidad del sujeto. Si, en ausencia del defensor, el imputado manifestare su deseo de declarar, la policía tomará las medidas necesarias para que declare inmediatamente ante el fiscal. Si esto no fuere posible, la policía podrá consignar las declaraciones que se allanare a prestar, bajo la responsabilidad y con la autorización del fiscal. El defensor podrá incorporarse siempre y en cualquier momento a esta diligencia."}], "grp": "91|CPP"}, {"id": "N-VF-11", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La declaración de rebeldía suspende la investigación.", "f": "Art. 101 CPP: la investigación no se suspende y el procedimiento continúa hasta la audiencia de preparación del juicio oral.", "g": "N", "r": 0, "x": [{"c": "Art. 101 CPP", "t": "Artículo 101.- Efectos de la rebeldía. Declarada la rebeldía, las resoluciones que se dictaren en el procedimiento se tendrán por notificadas personalmente al rebelde en la misma fecha en que se pronunciaren. La investigación no se suspenderá por la declaración de rebeldía y el procedimiento continuará hasta la realización de la audiencia de preparación del juicio oral, en la cual se podrá sobreseer definitiva o temporalmente la causa de acuerdo al mérito de lo obrado. Si la declaración de rebeldía se produjere durante la etapa de juicio oral, el procedimiento se sobreseerá temporalmente, hasta que el imputado compareciere o fuere habido. El sobreseimiento afectará sólo al rebelde y el procedimiento continuará con respecto a los imputados presentes. El imputado que fuere habido pagará las costas causadas con su rebeldía, a menos que justificare debidamente su ausencia. Párrafo 5º La defensa"}], "grp": "101|CPP"}, {"id": "N-VF-12", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si la rebeldía se declara durante la etapa de juicio oral, el procedimiento se sobresee temporalmente hasta que el imputado comparezca o sea habido.", "f": "Art. 101 inc. 2° CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 101 CPP", "t": "Artículo 101.- Efectos de la rebeldía. Declarada la rebeldía, las resoluciones que se dictaren en el procedimiento se tendrán por notificadas personalmente al rebelde en la misma fecha en que se pronunciaren. La investigación no se suspenderá por la declaración de rebeldía y el procedimiento continuará hasta la realización de la audiencia de preparación del juicio oral, en la cual se podrá sobreseer definitiva o temporalmente la causa de acuerdo al mérito de lo obrado. Si la declaración de rebeldía se produjere durante la etapa de juicio oral, el procedimiento se sobreseerá temporalmente, hasta que el imputado compareciere o fuere habido. El sobreseimiento afectará sólo al rebelde y el procedimiento continuará con respecto a los imputados presentes. El imputado que fuere habido pagará las costas causadas con su rebeldía, a menos que justificare debidamente su ausencia. Párrafo 5º La defensa"}], "grp": "101|CPP"}, {"id": "N-VF-13", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La querella puede presentarse en cualquier momento mientras el fiscal no declare cerrada la investigación.", "f": "Art. 112 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 112 CPP", "t": "Artículo 112.- Oportunidad para presentar la querella. La querella podrá presentarse en cualquier momento, mientras el fiscal no declarare cerrada la investigación. Admitida a tramitación, el juez la remitirá al ministerio público y el querellante podrá hacer uso de los derechos que le confiere el artículo 261."}], "grp": "112|CPP"}, {"id": "N-VF-14", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "El heredero testamentario de la víctima puede interponer querella.", "f": "Art. 111 inc. 1° CPP: víctima, su representante legal o su heredero testamentario.", "g": "N", "r": 1, "x": [{"c": "Art. 111 CPP", "t": "Artículo 111.- Querellante. La querella podrá ser interpuesta por la víctima, su representante legal o su heredero testamentario. También se podrá querellar cualquier persona capaz de parecer en juicio domiciliada en la provincia, respecto de hechos punibles cometidos en la misma que constituyeren delitos terroristas, o delitos cometidos por un funcionario público que afectaren derechos de las personas garantizados por la Constitución o contra la probidad pública. Los órganos y servicios públicos sólo podrán interponer querella cuando sus respectivas leyes orgánicas les otorguen expresamente las potestades correspondientes."}], "grp": "111|CPP"}, {"id": "N-VF-15", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La resolución que declara abandonada la querella es inapelable.", "f": "Art. 120 inc. final CPP: la resolución que declara el abandono es apelable.", "g": "N", "r": 0, "x": [{"c": "Art. 120 CPP", "t": "Artículo 120.- Abandono de la querella. El tribunal, de oficio o a petición de cualquiera de los intervinientes, declarará abandonada la querella por quien la hubiere interpuesto: a) Cuando no adhiriere a la acusación fiscal o no acusare particularmente en la oportunidad que correspondiere; b) Cuando no asistiere a la audiencia de preparación del juicio oral sin causa debidamente justificada, y c) Cuando no concurriere a la audiencia del juicio oral o se ausentare de ella sin autorización del tribunal. La resolución que declarare el abandono de la querella será apelable, sin que en la tramitación del recurso pueda disponerse la suspensión del procedimiento. La resolución que negare lugar al abandono será inapelable."}], "grp": "120|CPP"}, {"id": "N-VF-16", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "El querellante que no adhiere a la acusación fiscal ni acusa particularmente en la oportunidad legal incurre en causal de abandono de la querella.", "f": "Art. 120 letra a) CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 120 CPP", "t": "Artículo 120.- Abandono de la querella. El tribunal, de oficio o a petición de cualquiera de los intervinientes, declarará abandonada la querella por quien la hubiere interpuesto: a) Cuando no adhiriere a la acusación fiscal o no acusare particularmente en la oportunidad que correspondiere; b) Cuando no asistiere a la audiencia de preparación del juicio oral sin causa debidamente justificada, y c) Cuando no concurriere a la audiencia del juicio oral o se ausentare de ella sin autorización del tribunal. La resolución que declarare el abandono de la querella será apelable, sin que en la tramitación del recurso pueda disponerse la suspensión del procedimiento. La resolución que negare lugar al abandono será inapelable."}], "grp": "120|CPP"}, {"id": "N-VF-17", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "El querellante puede desistirse de su querella en cualquier momento del procedimiento.", "f": "Art. 118 CPP.", "g": "N", "r": 1, "x": [{"c": "Art. 118 CPP", "t": "Artículo 118.- Desistimiento. El querellante podrá desistirse de su querella en cualquier momento del procedimiento. En ese caso, tomará a su cargo las costas propias y quedará sujeto a la decisión general sobre costas que dictare el tribunal al finalizar el procedimiento."}], "grp": "118|CPP"}, {"id": "N-VF-18", "o": "Pre
