<style>
/* Layout: una columna de lectura (máx. 820px) con barra superior fija; fichas de pregunta tipo hoja de examen. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18222d; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1f5a7a; --accent-ink:#ffffff; --soft:#e6eef3;
  --ok:#1e7a4c; --ok-bg:#e3f3ea; --bad:#b3372f; --bad-bg:#f9e6e4; --warn:#8a5a00; --warn-bg:#fbf0d6;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11171d; --surface:#1a222b; --ink:#e7edf2; --muted:#9aa8b5; --line:#2f3b47;
    --accent:#6fb4d6; --accent-ink:#0d1a22; --soft:#22303b;
    --ok:#6fcf9c; --ok-bg:#17352a; --bad:#f08a80; --bad-bg:#3b1f1d; --warn:#e6b65a; --warn-bg:#3a2d12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11171d; --surface:#1a222b; --ink:#e7edf2; --muted:#9aa8b5; --line:#2f3b47;
  --accent:#6fb4d6; --accent-ink:#0d1a22; --soft:#22303b;
  --ok:#6fcf9c; --ok-bg:#17352a; --bad:#f08a80; --bad-bg:#3b1f1d; --warn:#e6b65a; --warn-bg:#3a2d12;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
header.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.1rem;font-weight:600;margin-right:auto}
@media (max-width:440px){.brand{font-size:.95rem}.bar-in{flex-wrap:nowrap;gap:8px}.timer{padding:3px 8px}#homeBtn{padding:6px 4px}}
.timer{font-variant-numeric:tabular-nums;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.timer.low{color:var(--bad);border-color:var(--bad)}
main{max-width:820px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.2rem;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px}
button:disabled{opacity:.5;cursor:not-allowed}
.opt:disabled{opacity:1;cursor:default}
select,input[type=number]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.mode h2{font-size:1.1rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.qnum{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stem{font-size:1.05rem}
ol.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
ol.items li{padding-left:12px;border-left:3px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px}
.opt .k{font-weight:600;min-width:1.4em;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fund{border-left:3px solid var(--accent);padding:10px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:.95rem;display:flex;flex-direction:column;gap:10px}
.lex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--display);font-weight:400;font-size:.95rem;line-height:1.55}
.lex p{font-family:var(--display);font-weight:400}
.lexc{font-family:var(--body);font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.verdict{font-weight:600} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.om{color:var(--warn)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav button{padding:6px 0;font-size:.8rem;font-variant-numeric:tabular-nums}
.nav button.done{background:var(--soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--accent)}
.nav button.r{background:var(--ok-bg);border-color:var(--ok)} .nav button.w{background:var(--bad-bg);border-color:var(--bad)} .nav button.o{background:var(--warn-bg);border-color:var(--warn)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.score div{border:1px solid var(--line);border-radius:8px;padding:12px}
.score b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.confirm{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: no-preference){button{transition:border-color .12s, background-color .12s}}
</style>

siguientes. …"}]}, {"id": "SM-SM-3", "o": "Prueba SM", "t": "sm", "m": "PI", "e": "La orden que autoriza la entrada y registro en un lugar cerrado debe señalar:", "f": "Art. 208 CPP: la orden debe señalar el o los edificios o lugares a registrar, el fiscal que la solicitó, la autoridad encargada de practicarla y el motivo del registro y, en su caso, del ingreso nocturno.", "g": "", "i": [], "a": ["El o los edificios o lugares que deben ser registrados", "El fiscal que hubiere solicitado la orden", "El motivo del registro y, en su caso, del ingreso nocturno", "Todas las anteriores"], "r": 3, "x": [{"c": "Art. 208 CPP", "t": "Artículo 208.- Contenido de la orden de registro. La orden que autorizare la entrada y registro deberá señalar: a) El o los edificios o lugares que hubieren de ser registrados; b) El fiscal que lo hubiere solicitado; c) La autoridad encargada de practicar el registro, y d) El motivo del registro y, en su caso, del ingreso nocturno. La orden tendrá una vigencia máxima de diez días, después de los cuales caducará la autorización. Con todo, el juez que emitiere la orden podrá establecer un plazo de vigencia inferior."}]}, {"id": "SM-SM-4", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "Natalia, de 13 años de edad, mantiene una relación de pololeo con Pedro, que tiene 17 años, los dos están muy enamorados y quieren casarse. Natalia queda embarazada y va al médico, quien decide presentar una denuncia luego de conocer la edad de Natalia. En relación a la situación descrita es correcto afirmar:", "f": "Art. 362 CP (acceso carnal a menor de 14 años, sin necesidad de fuerza). El art. 4° de la Ley 20.084 sólo impide proceder si la diferencia de edad es inferior a dos años en la hipótesis del art. 362; aquí es de cuatro.", "g": "", "i": [], "a": ["No existe delito, atendida la diferencia de edad existente entre ambos", "Pedro cometió un delito de violación impropia contra Natalia", "Pedro cometió un delito de estupro contra Natalia", "No existe delito, ya que las relaciones sexuales fueron consentidas"], "r": 1, "x": [{"c": "Art. 362 CP", "t": "ART. 362. El que accediere carnalmente, por vía vaginal, anal o bucal, a una persona menor de catorce años, será castigado con presidio mayor en sus grados medio a máximo, aunque no concurra circunstancia alguna de las enumeradas en el artículo anterior. § VI. Del estupro y otros delitos sexuales."}, {"c": "Art. 4 Ley 20.084", "t": "Artículo 4º.- Regla especial para delitos sexuales. No podrá procederse penalmente respecto de los delitos previstos en los artículos 362, 365, 366 bis, 366 quáter y 367 quáter inciso segundo, del Código Penal, cuando la conducta se hubiere realizado con una persona menor de 14 años y no concurra ninguna de las circunstancias enumeradas en los artículos 361 ó 363 de dicho Código, según sea el caso, a menos que exista entre aquélla y el imputado una diferencia de, a lo menos, dos años de edad, tratándose de la conducta descrita en el artículo 362, o de tres años en los demás casos. Artículo 4º. Establécese una comisión formada por expertos, la que se encargará de evaluar la implementación de la presente ley e informar trimestralmente acerca del estado de avance de la misma a la Comisión de Constitución, Legislación, Justicia y Reglamento del Senado …"}]}, {"id": "SM-SM-5", "o": "Prueba SM", "t": "sm", "m": "PX", "e": "En relación con el procedimiento simplificado es correcto afirmar:", "f": "Art. 390 incs. 2° y 3° CPP (I y II) y art. 398 inc. final CPP (III). La IV es falsa: contra la sentencia del simplificado procede el recurso de nulidad (art. 399 CPP).", "g": "", "i": ["I. Si el fiscal formulare acusación por un delito y la pena requerida no excediere de presidio o reclusión menores en su grado mínimo, la acusación presentada se tendrá como requerimiento simplificado.", "II. Tratándose de las faltas indicadas en los artículos 494 N° 5 (lesiones leves) y 496 N° 11 (injurias livianas) del Código Penal, sólo podrán efectuar el requerimiento simplificado las personas a quienes correspondiere la titularidad de la acción.", "III. La suspensión de la imposición de una condena por falta a que hace referencia el artículo 398 del Código Procesal Penal no afecta la responsabilidad civil derivada del delito.", "IV. La sentencia definitiva que se dicta en un procedimiento simplificado sólo es impugnable a través del recurso de apelación."], "a": ["Sólo I y II", "I, II y IV", "I, III y IV", "I, II y III"], "r": 3, "x": [{"c": "Art. 390 CPP", "t": "… insuficientes los antecedentes aportados, se encontrare extinguida la responsabilidad penal del imputado o el fiscal decidiere hacer aplicación de la facultad que le concede el artículo 170. De igual manera, cuando los antecedentes lo ameritaren y hasta la deducción de la acusación, el fiscal podrá dejar sin efecto la formalización de la investigación que ya hubiere realizado de acuerdo con lo previsto en el artículo 230, y proceder conforme a las reglas de este Título. Asimismo, si el fiscal formulare acusación y la pena requerida no excediere de presidio o reclusión menores en su grado mínimo, la acusación se tendrá como requerimiento, debiendo el juez disponer la continuación del procedimiento de conformidad a las normas de este Título. …"}, {"c": "Art. 399 CPP", "t": "Artículo 399.- Recursos. Contra la sentencia definitiva sólo podrá interponerse el recurso de nulidad previsto en el Título IV del Libro Tercero. El fiscal requirente y el querellante, en su caso, sólo podrán recurrir si hubieren concurrido al juicio. Título II Procedimiento por delito de acción privada"}]}, {"id": "SM-SM-6", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "El artículo 458 bis del Código Penal agrava las penas en caso que la ocupación de inmuebles se realice:", "f": "Art. 458 bis CP: máximum o grado máximo si la ocupación se realiza 1° en lugar habitado o destinado a la habitación, 2° obstaculizando acciones contra la propagación de incendios, 3° obstaculizando el suministro de servicios públicos o domiciliarios. La hipótesis II no existe.", "g": "", "i": ["I. Obstaculizando una acción destinada a impedir o dificultar la propagación de incendios.", "II. En un inmueble que haya sido previamente objeto de delito de usurpación y que el imputado haya tenido conocimiento de dicha circunstancia.", "III. En un lugar habitado o destinado a la habitación.", "IV. Obstaculizando el suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telefonía."], "a": ["I y II", "II, III y IV", "I, III y IV", "Todas las anteriores"], "r": 2, "x": [{"c": "Art. 458 bis CP", "t": "ART. 458 BIS. Se impondrá el máximum o el grado máximo, según corresponda, de las penas previstas en los tres artículos anteriores si la ocupación se realiza: 1.° En un lugar habitado o destinado a la habitación. 2.° Obstaculizando una acción destinada a impedir o dificultar la propagación de incendios. 3.° Obstaculizando el suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telefonía."}]}, {"id": "SM-SM-7", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "El artículo 304 bis establece que “el que sin estar legal o reglamentariamente autorizado al efecto ingresare, intentare o permitiere ingresar por cualquier medio a un establecimiento penitenciario intercomunicadores, teléfonos, partes de ellos, chips telefónicos u otros elementos tecnológicos que permitan comunicarse con el exterior, será sancionado con”:", "f": "Art. 304 bis inc. 1° CP: presidio menor en su grado mínimo a medio.", "g": "", "i": [], "a": ["Presidio menor en su grado mínimo y multa de entre 4 y 40 UTM", "Presidio menor en su grado mínimo a medio", "Presidio menor en su grado medio y multa de entre 4 y 40 UTM", "Presidio menor en su grado medio a máximo"], "r": 1, "x": [{"c": "Art. 304 bis CP", "t": "ART. 304 bis. El que sin estar legal o reglamentariamente autorizado al efecto ingresare, intentare o permitiere ingresar por cualquier medio a un establecimiento penitenciario intercomunicadores, teléfonos, partes de ellos, chips telefónicos u otros elementos tecnológicos que permitan comunicarse con el exterior, será sancionado con la pena de presidio menor en su grado mínimo a medio. El que ingresare, intentare o permitiere ingresar mediante lanzamiento desde el exterior o por vía no destinada al efecto, con dirección al interior de un establecimiento penitenciario, cualquier objeto o sustancia, será sancionado con la pena de presidio menor en sus grados mínimo a medio. La pena establecida en el inciso anterior se aumentará Art. …"}]}, {"id": "SM-SM-8", "o": "Prueba SM", "t": "sm", "m": "PR", "e": "El artículo 377 del Código Procesal Penal establece que el recurso de nulidad requiere ser preparado para su admisibilidad en los siguientes casos:", "f": "Art. 377 CPP: la preparación se exige cuando la infracción invocada se refiere a una ley que regula el procedimiento; no es necesaria en los motivos absolutos del art. 374.", "g": "", "i": [], "a": ["Cuando en el juicio oral hubieren sido violadas las disposiciones establecidas por la ley sobre publicidad y continuidad del juicio", "Cuando la infracción invocada se refiriere a una ley que regula el procedimiento", "Cuando la sentencia hubiere sido pronunciada por tribunal incompetente", "Cuando la sentencia hubiere sido acordada por un menor número de votos o menor número de jueces que el requerido legalmente"], "r": 1, "x": [{"c": "Art. 377 CPP", "t": "Artículo 377.- Preparación del recurso. Si la infracción invocada como motivo del recurso se refiriere a una ley que regulare el procedimiento, el recurso sólo será admisible cuando quien lo entablare hubiere reclamado oportunamente del vicio o defecto. No será necesaria la reclamación del inciso anterior cuando se tratare de alguna de las causales del artículo 374; cuando la ley no admitiere recurso alguno contra la resolución que contuviere el vicio o defecto, cuando éste hubiere tenido lugar en el pronunciamiento mismo de la sentencia que se tratare de anular, ni cuando dicho vicio o defecto hubiere llegado al conocimiento de la parte después de pronunciada la sentencia."}]}, {"id": "SM-SM-9", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "Según el Código Penal, en el delito de robo con violencia o intimidación, la violencia o intimidación puede ejercerse:", "f": "Art. 433 CP: la violencia o intimidación puede tener lugar antes del robo para facilitar su ejecución, en el acto de cometerlo o después de cometido para favorecer su impunidad.", "g": "", "i": [], "a": ["Sólo durante la comisión del ilícito", "Sólo en forma previa a la comisión del ilícito para forzar la manifestación o entrega de las cosas", "Antes del robo para facilitar su ejecución, en el acto de cometerlo o después de cometido para favorecer su impunidad", "Ninguna de las anteriores"], "r": 2, "x": [{"c": "Art. 433 CP", "t": "ART. 433. El culpable de robo con violencia o intimidación en las personas, sea que la violencia o la intimidación tenga lugar antes del robo para facilitar su ejecución, en el acto de cometerlo o después de cometido para favorecer su impunidad, será castigado: 1°. Con presidio mayor en su grado máximo a presidio perpetuo calificado cuando, con motivo u ocasión del robo, se cometiere, además, homicidio o violación. 2°. Con presidio mayor en su grado máximo a presidio perpetuo cuando, con motivo u ocasión del robo, se cometiere alguna de las lesiones comprendidas en los artículos 395, 396 y 397, número 1°. 3°. Con presidio mayor en su grado medio a máximo cuando se cometieren lesiones de las que trata el número 2° del artículo 397 o cuando las víctimas fueren retenidas bajo rescate o por un lapso mayor a …"}]}, {"id": "SM-SM-10", "o": "Prueba SM", "t": "sm", "m": "PR", "e": "La resolución que declara la ilegalidad de la detención será apelable tratándose de los siguientes delitos:", "f": "Art. 132 bis CPP: apelable por el fiscal o abogado asistente respecto de los arts. 141, 142, 361, 362, 365 bis, 390, 390 bis, 390 ter, 391, 433, 436 y 440 CP, Leyes 17.798 y 20.000 con pena de crimen o simple delito, y castración, mutilaciones y lesiones contra Carabineros, PDI y Gendarmería. El robo por sorpresa está en el art. 436; el robo en lugar no habitado (art. 442) no figura.", "g": "", "i": ["I. Delitos de la Ley N° 17.798 de Armas, que tengan penas de crimen o simple delito.", "II. Delito de robo en lugar no habitado.", "III. Delitos de lesiones cometidos contra funcionarios de Carabineros, Policía de Investigaciones de Chile o Gendarmería, que se encuentren en el ejercicio de sus funciones.", "IV. Delito de robo por sorpresa."], "a": ["I, II y IV", "I, II y III", "I, III y IV", "II, III y IV"], "r": 2, "x": [{"c": "Art. 132 bis CPP", "t": "Artículo 132 bis.- Apelación de la resolución que declara la ilegalidad de la detención. Tratándose de los delitos establecidos en los artículos 141, 142, 361, 362, 365 bis, 390, 390 bis, 390 ter, 391, 433, 436 y 440 del Código Penal, en las leyes N°17.798 y N°20.000 que tengan penas de crimen o simple delito, y de los delitos de castración, mutilaciones y lesiones contra miembros de Carabineros, de la Policía de Investigaciones y de Gendarmería de Chile, en el ejercicio de sus funciones, la resolución que declare la ilegalidad de la detención será apelable por el fiscal o el abogado asistente del fiscal en el solo efecto devolutivo. En los demás casos no será apelable."}]}, {"id": "SM-SM-11", "o": "Prueba SM", "t": "sm", "m": "PI", "e": "¿Cuál (es) de las siguientes actuaciones puede realizar la policía sin orden previa ni conocimiento del fiscal?", "f": "Art. 83 CPP: sin orden previa la policía presta auxilio a la víctima, resguarda el sitio del suceso e identifica testigos y consigna sus declaraciones voluntarias. La declaración del imputado se rige por el art. 91 CPP (presencia del defensor o autorización del fiscal).", "g": "", "i": ["I. Resguardar el sitio del suceso.", "II. Prestar auxilio a la víctima.", "III. Tomar declaración al imputado, siempre que previamente se proceda a la lectura de sus derechos.", "IV. Identificar a los testigos y consignar las declaraciones que éstos prestaren voluntariamente, en los casos de delitos flagrantes, en que se esté resguardando el sitio del suceso."], "a": ["I y II", "I, II y IV", "II, III y IV", "I y IV"], "r": 1, "x": [{"c": "Art. 83 CPP", "t": "Artículo 83.- Actuaciones de la policía sin orden previa. Corresponderá a los funcionarios de Carabineros de Chile, de la Policía de Investigaciones de Chile, de la Autoridad Marítima en el ejercicio de funciones de Policía Marítima y de Gendarmería de Chile, realizar las siguientes actuaciones, sin necesidad de recibir previamente instrucciones particulares de los fiscales: a) Prestar auxilio a la víctima; b) Practicar la detención en los casos de flagrancia, conforme a la ley. Para estos efectos, podrán coordinarse con entidades públicas o solicitar la colaboración de entidades privadas, cuando ello fuere útil para asegurar el éxito de la detención; c) Resguardar el sitio del suceso. Deberán preservar Art. …"}, {"c": "Art. 91 CPP", "t": "Artículo 91.- Declaraciones del imputado ante la policía. La policía sólo podrá interrogar autónomamente al imputado en presencia de su defensor. Si éste no estuviere presente durante el interrogatorio, las preguntas se limitarán a constatar la identidad del sujeto. Si, en ausencia del defensor, el imputado manifestare su deseo de declarar, la policía tomará las medidas necesarias para que declare inmediatamente ante el fiscal. Si esto no fuere posible, la policía podrá consignar las declaraciones que se allanare a prestar, bajo la responsabilidad y con la autorización del fiscal. El defensor podrá incorporarse siempre y en cualquier momento a esta diligencia."}]}, {"id": "SM-SM-12", "o": "Prueba SM", "t": "sm", "m": "PI", "e": "En el caso del Archivo Provisional, ¿Cuál de las siguientes afirmaciones es correcta?", "f": "Art. 167 CPP (procedencia, IV) y art. 169 CPP (la querella admitida obliga a seguir adelante, I). La II es inexacta: la aprobación corresponde al Fiscal Regional o al Fiscal Jefe de la Fiscalía Supraterritorial, no a un fiscal jefe local. La III es falsa: la reapertura se pide al Ministerio Público (art. 167 inc. 3°).", "g": "A", "i": ["I. La víctima puede enervar el archivo provisional, deduciendo una querella que sea admitida a tramitación por el respectivo Juzgado de Garantía.", "II. De acuerdo al Código Procesal Penal, si el delito merece pena aflictiva se debe someter la decisión a aprobación del Fiscal Jefe.", "III. La víctima puede solicitar al Juez de Garantía la reapertura del procedimiento y la realización de diligencias de investigación.", "IV. Procede el archivo provisional en aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos."], "a": ["II y IV", "I y III", "I y IV", "II y III"], "r": 2, "x": [{"c": "Art. 167 CPP", "t": "… En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}, {"c": "Art. 169 CPP", "t": "Artículo 169.- Control judicial. En los casos contemplados en los dos artículos anteriores, la víctima podrá provocar la intervención del juez de garantía deduciendo la querella respectiva. Si el juez admitiere a tramitación la querella, el fiscal deberá seguir adelante la investigación conforme a las reglas generales."}]}, {"id": "SM-SM-13", "o": "Prueba SM", "t": "sm", "m": "LE", "e": "De acuerdo al artículo 19 de la ley 20.000, constituyen agravantes específicas en delitos de la Ley de Drogas:", "f": "Art. 19 Ley 20.000: letra b) violencia, armas o engaño; letra d) funcionarios públicos aprovechando o abusando de su calidad. Las hipótesis III y IV son agravantes generales del art. 12 CP.", "g": "", "i": ["I. Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales.", "II. Si se utilizó violencia, armas o engaño en su comisión.", "III. Ser la víctima anciano, inválido o persona en manifiesto estado de inferioridad física.", "IV. Cometer el delito con ocasión de incendio, naufragio, sedición, tumulto o conmoción popular u otra calamidad o desgracia."], "a": ["II y IV", "I y III", "III y IV", "I y II"], "r": 3, "x": [{"c": "Art. 19 Ley 20.000", "t": "Artículo 19.- Tratándose de los delitos anteriormente descritos, la pena deberá ser aumentada en un grado si concurre alguna de las circunstancias siguientes: a) Si el imputado formó parte de una agrupación o reunión de delincuentes, sin incurrir en el delito de organización del artículo 16. b) Si se utilizó violencia, armas o engaño en su comisión. c) Si se suministró, promovió, indujo o facilitó el uso o consumo de drogas o sustancias estupefacientes o sicotrópicas a menores de dieciocho años de edad, o a personas con sus facultades mentales disminuidas o perturbadas. d) Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales. e) Si el delito se cometió valiéndose de niños, niñas o adolescentes o personas exentas de responsabilidad penal. …"}, {"c": "Art. 12 CP", "t": "… de personas con discapacidad. 23ª. Ejecutar el hecho formando parte de una agrupación u organización de dos o más personas destinada a cometer crímenes o simples delitos, siempre que ésta o aquélla no constituya una asociación delictiva o criminal de que trata el Párrafo 10 del Título VI del Libro II, y ello ha facilitado la perpetración del delito o ha aumentado el peligro para la integridad física de la víctima, o haber ejecutado el hecho con violencia, intimidación o engaño. 24.° Cometer el delito en contra de un vigilante privado, guardia de seguridad, nochero, portero, rondín o cualquier otro personal que ejerza actividades de seguridad privada, de acuerdo con la ley que regula esa materia, sea con motivo de su cargo o en el ejercicio de sus funciones cuando porte uniforme, credencial visible al público o cualquier otro …"}]}, {"id": "SM-SM-14", "o": "Prueba SM", "t": "sm", "m": "PP", "e": "Respecto de la regulación de los plazos en el Código Procesal Penal, cuáles de las siguientes afirmaciones son verdaderas:", "f": "Art. 14 CPP (todos los días y horas son hábiles; los plazos no se suspenden por feriados) y art. 16 CPP (plazos fatales e improrrogables). Los intervinientes pueden renunciar a los plazos establecidos a su favor (art. 18 CPP).", "g": "", "i": ["I. La regla general es que son plazos fatales e improrrogables.", "II. Los plazos se suspenden en los días feriados.", "III. Todos los días y horas son hábiles para las actuaciones del procedimiento penal.", "IV. Los intervinientes no pueden renunciar a los plazos establecidos en su favor."], "a": ["II y IV", "I y III", "I y IV", "II y III"], "r": 1, "x": [{"c": "Art. 14 CPP", "t": "Artículo 14.- Días y horas hábiles. Todos los días y horas serán hábiles para las actuaciones del procedimiento penal y no se suspenderán los plazos por la interposición de días feriados. No obstante, cuando un plazo de días concedido a los intervinientes venciere en día feriado, se considerará ampliado hasta las veinticuatro horas del día siguiente que no fuere feriado."}, {"c": "Art. 16 CPP", "t": "Artículo 16.- Plazos fatales e improrrogables. Los plazos establecidos en este Código son fatales e improrrogables, a menos que se indicare expresamente lo contrario."}]}, {"id": "SM-SM-15", "o": "Prueba SM", "t": "sm", "m": "PR", "e": "Respecto del recurso de apelación, es FALSO afirmar que:", "f": "Falsas I y IV: existe apelación verbal (art. 149 inc. 2° CPP) y el recurso se interpone ante el mismo juez que dictó la resolución (art. 365 CPP). Son verdaderas II (art. 414 CPP) y III (art. 37 Ley 18.216).", "g": "", "i": ["I. Siempre debe interponerse por escrito y debe contener antecedentes de hecho, fundamentos de derecho y peticiones concretas.", "II. Procede en contra de la sentencia definitiva dictada en un procedimiento abreviado.", "III. Es apelable la resolución del tribunal que concede, deniega, revoca, sustituye, reemplaza, reduce, intensifica o termina anticipadamente una pena sustitutiva.", "IV. El recurso de apelación se interpone ante la Corte de Apelaciones respectiva y ésta verificará la admisibilidad de este."], "a": ["II y IV", "I y III", "I y IV", "II y III"], "r": 2, "x": [{"c": "Art. 149 CPP", "t": "… 438 y 440 del Código Penal, en las leyes N°17.798 y N°20.000 y de los delitos de castración, mutilaciones y lesiones contra miembros de Carabineros, de la Policía de Investigaciones y de Gendarmería de Chile, en el ejercicio de sus funciones, el imputado que hubiere sido puesto a disposición del tribunal en calidad de detenido o se encontrare en prisión preventiva no podrá ser puesto en libertad mientras no se encontrare ejecutoriada la resolución que negare, sustituyere o revocare la prisión preventiva. El recurso de apelación contra esta resolución deberá interponerse en la misma audiencia, gozará de preferencia para su vista y fallo y será agregado extraordinariamente a la tabla el mismo día de su ingreso al Tribunal de Alzada, o a más tardar a la del día siguiente hábil. …"}, {"c": "Art. 365 CPP", "t": "Artículo 365.- Tribunal ante el que se entabla el recurso de apelación. El recurso de apelación deberá entablarse ante el mismo juez que hubiere dictado la resolución y éste lo concederá o lo denegará."}]}, {"id": "SM-SM-16", "o": "Prueba SM", "t": "sm", "m": "PG", "e": "Respecto de las faltas, cuál de las siguientes afirmaciones es FALSA:", "f": "Las faltas admiten pena de prisión además de multa (art. 21 CP; p. ej., art. 494 bis). Las demás son correctas: arts. 9°, 498 y 94 CP.", "g": "", "i": [], "a": ["Por regla general, sólo se sancionan cuando están consumadas", "Las faltas sólo pueden ser sancionadas con pena de multa", "La regla general es que los cómplices en las faltas se castigan con una pena que no exceda de la mitad de la que corresponda a los autores", "La acción penal prescribe en seis meses desde la comisión de la falta"], "r": 1, "x": [{"c": "Art. 21 CP", "t": "… 11 a) empleos, oficios o profesiones en empresas que contraten con órganos o empresas del Estado o con empresas o asociaciones en que éste tenga una participación mayoritaria; o en empresas que participen en concesiones otorgadas por el Estado o cuyo objeto sea la provisión de servicios de utilidad pública. Inhabilitación especial temporal para emitir licencias médicas. Suspensión de cargo u oficio público o profesión titular. Inhabilidad perpetua para conducir vehículos a tracción mecánica o animal. Suspensión para conducir vehículos a tracción mecánica o animal. Inhabilidad absoluta perpetua para la tenencia de animales. PENAS DE LAS FALTAS. Prisión. Inhabilidad perpetua para conducir vehículos a tracción mecánica o animal. …"}, {"c": "Art. 9 CP", "t": "ART. 9. Las faltas sólo se castigan cuando han sido consumadas. § II. De las circunstancias que eximen de responsabilidad criminal."}]}, {"id": "SM-SM-17", "o": "Prueba SM", "t": "sm", "m": "PI", "e": "Dentro de los diez días siguientes a la comunicación de un principio de oportunidad, el Juez de Garantía podrá dejarlo sin efecto en diversas hipótesis. ¿Cuál de estas hipótesis no está contemplada en el Código Procesal Penal para dejarlo sin efecto?", "f": "Art. 170 CPP: el juez deja sin efecto la decisión si el fiscal excedió sus atribuciones (pena mínima superior a presidio menor en su grado mínimo o delito de funcionario público en ejercicio de funciones) o si la víctima manifiesta interés. El compromiso grave del interés público no es causal de control judicial.", "g": "", "i": [], "a": ["Cuando considerare que el Ministerio Público ha excedido sus atribuciones en cuanto la pena mínima excediere la de presidio o reclusión menores en su grado mínimo", "Cuando se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones", "Cuando considerare que el delito pudiese comprometer gravemente el interés público", "Cuando, dentro de dicho plazo la víctima manifestare de cualquier modo su interés en el inicio o en la continuación de la persecución penal"], "r": 2, "x": [{"c": "Art. 170 CPP", "t": "… Para estos efectos, el fiscal deberá emitir una decisión motivada, la que comunicará al juez de garantía. Éste, a su vez, la notificará a los intervinientes, si los hubiere. Dentro de los diez días siguientes a la comunicación de la decisión del fiscal, el juez, de oficio o a petición de cualquiera de los intervinientes, podrá dejarla sin efecto cuando considerare que aquél ha excedido sus atribuciones en cuanto la pena mínima prevista para el hecho de que se tratare excediere la de presidio o reclusión menores en su grado mínimo, o se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. También la dejará sin efecto cuando, dentro del mismo plazo, la víctima manifestare de cualquier modo su interés en el inicio o en la continuación de la persecución penal. …"}]}, {"id": "SM-SM-18", "o": "Prueba SM", "t": "sm", "m": "PC", "e": "Respecto a la detención, cuál de las siguientes afirmaciones es falsa:", "f": "Art. 132 CPP: la ausencia del fiscal o del abogado asistente da lugar a la liberación del detenido, no a una amonestación. Las demás son correctas (arts. 129 y 131 CPP).", "g": "", "i": [], "a": ["La detención en situación de flagrancia obliga a la policía a informar de ella al Ministerio Público dentro de un plazo máximo de doce horas", "En casos de flagrancia de un delito de abuso sexual “propio” (Art. 366 CP), la policía podrá detener al imputado, independiente de tratarse de un delito cuya persecución penal requiere instancia particular previa", "A la primera audiencia judicial del detenido deberá concurrir el fiscal o el abogado asistente del fiscal. La ausencia de éstos dará lugar a una amonestación, debiéndose fijar nueva audiencia a la brevedad", "Cualquier persona podrá detener a quien sorprendiere en delito flagrante, debiendo entregar inmediatamente al aprehendido a la policía, al Ministerio Público o a la autoridad judicial más próxima"], "r": 2, "x": [{"c": "Art. 132 CPP", "t": "Artículo 132. Comparecencia judicial. A la primera audiencia judicial del detenido deberá concurrir el fiscal o el abogado asistente del fiscal. La ausencia de éstos dará lugar a la liberación del detenido. No obstante lo anterior, el juez podrá suspender la audiencia por un plazo breve y perentorio no superior a dos horas, con el fin de permitir la concurrencia del fiscal o su abogado asistente. Transcurrido este plazo sin que concurriere ninguno de ellos, se procederá a la liberación del detenido. En todo caso, el juez deberá comunicar la ausencia del Art. fiscal o de su abogado asistente al fiscal regional respectivo o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, a la mayor brevedad, con el objeto de determinar la eventual responsabilidad disciplinaria que correspondiere. …"}, {"c": "Art. 129 CPP", "t": "… personas. Sin perjuicio de lo señalado en el inciso anterior, el Art. tribunal que correspondiere deberá, en caso de quebrantamiento de condena y tan pronto tenga conocimiento del mismo, despachar la respectiva orden de detención en contra del condenado. En los casos de que trata este artículo, la policía podrá ingresar a un lugar cerrado, mueble o inmueble, cuando se encontrare en actual persecución del individuo a quien debiere detener, para practicar la respectiva detención. En este caso, la policía podrá registrar el lugar e incautar los objetos y documentos vinculados al caso que dio origen a la persecución, dando aviso de inmediato al fiscal, quien los conservará. Lo anterior procederá sin perjuicio de lo establecido en el artículo 215."}]}, {"id": "SM-SM-19", "o": "Prueba SM", "t": "sm", "m": "PG", "e": "Cuál de los siguientes es un concurso aparente de leyes penales:", "f": "Quien intervino en el robo no puede ser sancionado además como receptador: la receptación es un acto posterior copenado (consunción). La estafa con instrumento falso es concurso medial; armas (art. 17 B Ley 17.798) y asociación (art. 294 bis CP) se penan por separado.", "g": "", "i": [], "a": ["Un delito de estafa cometido a través de un instrumento público falso", "Un delito de receptación cometido por quien previamente cometió el robo", "Un delito de homicidio cometido con arma de fuego y el porte ilegal de dicha arma", "Un delito de asociación ilícita con el delito base que la genera"], "r": 1, "x": [{"c": "Art. 17 B Ley 17.798", "t": "Artículo 17 B.- Las penas por los delitos sancionados en esta ley se impondrán sin perjuicio de las que correspondan por los delitos o cuasidelitos que se cometan empleando las armas o elementos señalados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º, de conformidad con lo dispuesto en el artículo 74 del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en …"}, {"c": "Art. 294 bis CP", "t": "ART. 294 BIS. Se impondrá asimismo el comiso de las ganancias obtenidas por una organización delictiva o criminal, en los términos del artículo anterior, si se dicta: 1. Sobreseimiento temporal conforme a las letras b) y c) del inciso primero, y el inciso segundo del artículo 252 del Código Procesal Penal. 2. Sentencia absolutoria fundada en la falta de convicción a que se refiere el artículo 340 del Código Procesal Penal o sobreseimiento definitivo fundado en la letra b) del artículo 250 del mismo Código. 3. Sobreseimiento definitivo o sentencia absolutoria fundados en la concurrencia de circunstancias eximentes de responsabilidad que no excluyen la ilicitud del hecho. 4. Sobreseimiento definitivo o sentencia absolutoria fundados en haberse extinguido la responsabilidad penal o en haber sobrevenido un hecho que, con arreglo a la ley, pone fin a esa responsabilidad. …"}]}, {"id": "SM-SM-20", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "Respecto al delito de Secuestro, tipificado en el Art. 141 del Código Penal, es correcto señalar:", "f": "Art. 141 CP: inc. 1° presidio o reclusión menor en su grado máximo (I); inc. 4° más de quince días o daño grave, presidio mayor en su grado medio a máximo (IV). Quien proporciona el lugar sufre la misma pena (II falsa) y el umbral del inc. 3° es de 24 horas, no 48 (III falsa).", "g": "", "i": ["I. Será castigado con la pena de presidio o reclusión menor en su grado máximo.", "II. Quien proporcionare lugar para la ejecución del delito sufrirá la pena establecida para el secuestro, disminuida en un grado.", "III. Si el encierro o detención se prolongare por más de 48 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio.", "IV. Si el encierro o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo"], "a": ["I y IV", "I, II y III", "III y IV", "I, II y IV"], "r": 0, "x": [{"c": "Art. 141 CP", "t": "… El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}]}, {"id": "SM-SM-21", "o": "Prueba SM", "t": "sm", "m": "PR", "e": "Son motivos absolutos de nulidad los siguientes:", "f": "Art. 374 CPP: letra a) tribunal incompetente y letra c) impedir al defensor ejercer las facultades que la ley le otorga. La errónea aplicación del derecho es causal del art. 373 b), no motivo absoluto.", "g": "", "i": ["I. Cuando al defensor se le hubiere impedido ejercer las facultades que la ley otorga.", "II. Cuando se hubiere hecho una errónea aplicación del derecho que hubiere influido sustancialmente en lo dispositivo del fallo.", "III. Cuando la sentencia hubiere sido pronunciada por un tribunal incompetente.", "IV. Cuando la sentencia no concede penas sustitutivas de la Ley 18.216."], "a": ["Sólo I y III", "Sólo II y IV", "Sólo III y IV", "Solo I y II"], "r": 0, "x": [{"c": "Art. 374 CPP", "t": "Artículo 374.- Motivos absolutos de nulidad. El juicio oral y la sentencia, o parte de éstos, serán siempre anulados: a) Cuando la sentencia hubiere sido pronunciada por un Art. tribunal incompetente, o no integrado por los jueces designados por la ley; cuando hubiere sido pronunciada por un juez de garantía o con la concurrencia de un juez de tribunal de juicio oral en lo penal legalmente implicado, o cuya recusación estuviere pendiente o hubiere sido declarada por tribunal competente; y cuando hubiere sido acordada por un menor número de votos o pronunciada por menor número de jueces que el requerido por la ley, o con concurrencia de jueces que no hubieren asistido al juicio; …"}]}, {"id": "SM-SM-22", "o": "Prueba SM", "t": "sm", "m": "PE", "e": "Se configura el delito de “abuso sexual” en toda acción sexual distinta del acceso carnal en los siguientes casos:", "f": "Art. 366 inc. 1° CP en relación con el art. 361: fuerza o intimidación, incapacidad para oponerse y abuso de enajenación o trastorno mental. Respecto de menores de 14 años (art. 366 bis) no se exige circunstancia alguna, tampoco desamparo.", "g": "", "i": ["I. Cuando el autor se aprovecha de la incapacidad para oponerse de la víctima.", "II. Si el autor ejerce fuerza respecto de la víctima.", "III. Cuando se abusa de la enajenación o trastorno mental de la víctima.", "IV. Si la víctima es menor de 14 años, no se requiere la fuerza, enajenación o trastorno mental. Sólo se debe acreditar el grave desamparo."], "a": ["I, II y III", "I, III y IV", "II, III y IV", "I y II"], "r": 0, "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}]}, {"id": "SM-SM-23", "o": "Prueba SM", "t": "sm", "m": "PG", "e": "Respecto del encubrimiento, es correcto decir que:", "f": "Art. 17 CP: el encubridor no debe haber tenido participación como autor ni como cómplice. La rebaja es de dos grados (art. 52); la exención de parientes excluye el N° 1; el N° 4 no exige conocimiento de un delito determinado.", "g": "", "i": [], "a": ["Se sanciona con la pena del delito consumado, rebajada en un grado", "Tiene una eximente cuando es cometida por ciertos parientes respecto de las cuatro hipótesis de comisión", "Siempre es necesaria para su comisión que el encubridor tenga conocimiento del delito base que se está encubriendo", "Es una forma de participación delictual residual, es decir, se pide que los encubridores no hayan tenido participación en el hecho base en calidad de autores o cómplices"], "r": 3, "x": [{"c": "Art. 17 CP", "t": "ART. 17. Son encubridores los que con conocimiento de la perpetración de un crimen o de un simple delito o de los actos ejecutados para llevarlo a cabo, sin haber tenido participación en él como autores ni como cómplices, intervienen, con posterioridad a su ejecución, de alguno de los modos siguientes: 1.° Aprovechándose por sí mismos o facilitando a los delincuentes medios para que se aprovechen de los efectos del crimen o simple delito. 2.° Ocultando o inutilizando el cuerpo, los efectos o instrumentos del crimen o simple delito para impedir su descubrimiento. 3.° Albergando, ocultando o proporcionando la fuga del culpable. 4.° Acogiendo, receptando o protegiendo habitualmente a los malhechores, sabiendo que lo son, aun sin conocimiento de los crímenes o simples delitos determinados que hayan cometido, o facilitándoles los medios de reunirse u ocultar sus armas o efectos, o …"}]}, {"id": "SM-SM-25", "o": "Prueba SM", "t": "sm", "m": "PJ", "e": "La lectura de apoyo memoria en el juicio oral, en virtud de lo señalado en el artículo 332, se podrá realizar:", "f": "Art. 332 CPP: sólo una vez que el acusado o el testigo hubieren prestado declaración se pueden leer sus declaraciones anteriores ante el fiscal, el abogado asistente o el juez de garantía. Para el perito lo que se lee son partes de su informe (inc. 2°).", "g": "", "i": [], "a": ["Antes de que declare el testigo para aclarar puntos dudosos que podrían resultar de su declaración", "Sólo una vez que el acusado, el perito o el testigo hubieren prestado declaración, se podrá leer en el interrogatorio parte o partes de sus declaraciones anteriores prestadas ante el fiscal, el asistente del fiscal, o el juez de garantía", "Después de que declare el testigo, cuando constan en la carpeta declaraciones prestadas ante la policía o Fiscalía", "Antes de que el testigo o perito hubieran prestado declaración, se podrá leer en el interrogatorio parte o partes de sus declaraciones anteriores prestadas ante el fiscal o el asistente del fiscal, o con delegación expresa de éstos"], "r": 1, "x": [{"c": "Art. 332 CPP", "t": "Artículo 332.- Lectura para apoyo de memoria en la audiencia del juicio oral. Sólo una vez que el acusado o el testigo hubieren prestado declaración, se podrá leer en el interrogatorio parte o partes de sus declaraciones anteriores prestadas ante el fiscal, el abogado asistente del fiscal, en su caso, o el juez de garantía, cuando fuere necesario para ayudar la memoria del respectivo acusado o testigo, para demostrar o superar contradicciones o para solicitar las aclaraciones pertinentes. Con los mismos objetivos, se podrá leer durante la declaración de un perito partes del informe que él hubiere elaborado."}]}, {"id": "SM-SM-26", "o": "Prueba SM", "t": "sm", "m": "PI", "e": "Cuál(es) de estas situaciones son susceptibles de ser discutidas en una audiencia de formalización de la investigación:", "f": "En la audiencia de formalización pueden discutirse el plazo judicial de investigación (art. 234 CPP), medidas cautelares (arts. 140 y 155) y el sobreseimiento definitivo (art. 93 letra f). La exclusión de prueba es propia de la audiencia de preparación (art. 276).", "g": "", "i": ["I. Respecto a la fijación de un plazo de investigación inferior al legal, de dos años.", "II. Respecto a la fijación de medidas cautelares.", "III. Respecto a la exclusión de medios de prueba.", "IV. Respecto a un eventual sobreseimiento definitivo"], "a": ["I, II y IV", "II, III y IV", "I, III y IV", "I, II y III"], "r": 0, "x": [{"c": "Art. 234 CPP", "t": "Artículo 234.- Plazo judicial para el cierre de la investigación. Cuando el juez de garantía, de oficio o a petición de alguno de los intervinientes y oyendo al ministerio público, lo considerare necesario con el fin de cautelar las garantías de los intervinientes y siempre que las características de la investigación lo permitieren, podrá fijar en la misma audiencia un plazo para el cierre de la investigación, al vencimiento del cual se producirán los efectos previstos en el artículo 247."}]}, {"id": "SM-VF-27", "o": "Prueba SM", "t": "vf", "m": "PI", "e": "El plazo legal máximo para una investigación penal es de un año.", "f": "Art. 247 CPP: el plazo legal es de dos años desde la formalización.", "g": "", "r": 0, "x": [{"c": "Art. 247 CPP", "t": "Artículo 247.- Plazo para declarar el cierre de la investigación. Transcurrido el plazo de dos años desde la fecha en que la investigación hubiere sido formalizada, el fiscal deberá proceder a cerrarla. Si el fiscal no declarare cerrada la investigación en el plazo señalado, el imputado o el querellante podrán solicitar al juez que aperciba al fiscal para que proceda a tal cierre. Para estos efectos, el juez citará a los intervinientes a una audiencia y si el fiscal no compareciere, el juez otorgará un plazo máximo de dos días para que éste se pronuncie, dando cuenta de ello al fiscal regional o el Fiscal Jefe de la Fiscalía Supraterritorial, si corresponde. Transcurrido tal plazo sin que el fiscal se pronuncie o si, compareciendo, se negare a declarar cerrada la investigación, el juez decretará el sobreseimiento definitivo de la causa, informando de ello al fiscal …"}]}, {"id": "SM-VF-28", "o": "Prueba SM", "t": "vf", "m": "PC", "e": "En el proceso penal, la caución económica para reemplazar la prisión preventiva puede consistir en el depósito por parte del imputado u otra persona de dinero o valores, la constitución de prendas o hipotecas, o la fianza de una o más personas idóneas calificadas por el tribunal.", "f": "Art. 146 inc. 2° CPP.", "g": "", "r": 1, "x": [{"c": "Art. 146 CPP", "t": "Artículo 146.- Caución para reemplazar la prisión preventiva. Cuando la prisión preventiva hubiere sido o debiere ser impuesta únicamente para garantizar la comparecencia del imputado al juicio y a la eventual ejecución de la pena, el tribunal podrá autorizar su reemplazo por una caución económica suficiente, cuyo monto fijará. La caución podrá consistir en el depósito por el imputado u otra persona de dinero o valores, la constitución de prendas o hipotecas, o la fianza de una o más personas idóneas calificadas por el tribunal."}]}, {"id": "SM-VF-29", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Quien, entre otras conductas, yierta sustancias contaminantes en aguas marítimas o continentales, o libere sustancias contaminantes al aire, sin haber sometido su actividad a un evaluación de impacto ambiental a sabiendas de estar obligado a ello, será sancionado con presidio o reclusión menor en sus grados medio a máximo, conforme a la primera parte del artículo 305 del Código Penal", "f": "Art. 305 inc. 1° CP: la pena es presidio o reclusión menor en sus grados mínimo a medio. El rango medio a máximo corresponde a quien debía someterse a un estudio de impacto ambiental (inc. final).", "g": "", "r": 0, "x": [{"c": "Art. 305 CP", "t": "ART. 305.- Será sancionado con presidio o reclusión menor en sus grados mínimo a medio el que sin haber sometido su actividad a una evaluación de impacto ambiental a sabiendas de estar obligado a ello: 1. Vierta sustancias contaminantes en aguas marítimas o continentales. 2. Extraiga aguas continentales, sean superficiales o subterráneas, o aguas marítimas. 3. Vierta o deposite sustancias contaminantes en el suelo o subsuelo, continental o marítimo. 4. Vierta tierras u otros sólidos en humedales. 5. Extraiga componentes del suelo o subsuelo. 6. Libere sustancias contaminantes al aire. La pena será de presidio o reclusión menor en sus grados medio a máximo si el infractor perpetra el hecho estando obligado a someter su actividad a un estudio de impacto ambiental."}]}, {"id": "SM-VF-30", "o": "Prueba SM", "t": "vf", "m": "LE", "e": "La Ley N° 20.000 permite archivar provisionalmente causas, aunque se encuentren con una autorización judicial para la interceptación de comunicaciones telefónicas.", "f": "Art. 24 inc. final Ley 20.000: no obstante el art. 167 CPP, si las diligencias ordenadas no dieren resultado, el fiscal puede archivar provisionalmente.", "g": "", "r": 1, "x": [{"c": "Art. 24 Ley 20.000", "t": "Artículo 24.- Las medidas de retención e incautación de correspondencia, obtención de copias de comunicaciones o transmisiones, interceptación de comunicaciones telefónicas y uso de otros medios técnicos de investigación, se podrán aplicar respecto de todos los delitos previstos en esta ley y cualquiera sea la pena que merecieren, de conformidad a las disposiciones pertinentes del Código Procesal Penal. Sin perjuicio de lo anterior, no regirá lo dispuesto en el inciso cuarto del artículo 222 de ese Código, en cuanto a indicar circunstanciadamente el nombre y dirección del afectado por la medida, siendo suficiente consignar las circunstancias que lo individualizaren o determinaren. Asimismo, no obstante lo prevenido en el artículo 167 de dicho Código, si las diligencias ordenadas no dieren resultado, el fiscal podrá archivar provisionalmente la investigación hasta que aparezcan mejores y nuevos antecedentes. …"}, {"c": "Art. 167 CPP", "t": "Artículo 167.- Archivo provisional. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}]}, {"id": "SM-VF-31", "o": "Prueba SM", "t": "vf", "m": "PP", "e": "El delito de lesiones graves es de aquellos de acción penal pública previa instancia particular", "f": "Art. 54 letra a) CPP: sólo las lesiones de los arts. 399 y 494 N° 5 CP requieren instancia particular previa. Las lesiones graves son de acción pública.", "g": "", "r": 0, "x": [{"c": "Art. 54 CPP", "t": "Artículo 54.- Delitos de acción pública previa instancia particular. En los delitos de acción pública previa instancia particular no podrá procederse de oficio sin que, a lo menos, el ofendido por el delito hubiere denunciado el hecho a la justicia, al ministerio público o a la policía. Tales delitos son: a) Las lesiones previstas en los artículos 399 y 494, número 5º, del Código Penal; b) La violación de domicilio; c) La violación de secretos prevista en los artículos 231 y 247, inciso segundo, del Código Penal; d) Las amenazas previstas en los artículos 296 y 297 del Código Penal; e) Los previstos en la ley N° 19.039, que establece normas aplicables a los privilegios industriales y protección de los derechos de propiedad industrial; …"}, {"c": "Art. 399 CP", "t": "ART. 399. Las lesiones no comprendidas en los artículos precedentes se reputan menos graves, y serán penadas con relegación o presidio menores en sus grados mínimos o con multa de once a veinte unidades tributarias mensuales."}]}, {"id": "SM-VF-32", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "El deudor que oculte total o parcialmente sus bienes o sus haberes, dentro de los dos años anteriores a la resolución de liquidación o reorganización, o con posterioridad a esa resolución, será castigado con la pena de presidio menor en su grado medio a presidio mayor en su grado mínimo, conforme al artículo 463 bis del Código Penal.", "f": "Art. 463 bis N° 4 CP.", "g": "", "r": 1, "x": [{"c": "Art. 463 bis CP", "t": "ART. 463 bis.- Será castigado con la pena de presidio menor en su grado medio a presidio mayor en su grado mínimo, el deudor que realizare alguna de las siguientes conductas: 1.° Favorecer a uno o más acreedores en desmedro de otro pagando deudas que no fueren actualmente exigibles u otorgando garantías para deudas contraídas previamente sin garantía, dentro de los dos años anteriores a la resolución de reorganización o liquidación o durante el tiempo que medie entre la notificación de la demanda de liquidación forzosa y la dictación de la respectiva resolución. 2.° Percibir, apropiarse o distraer bienes que deban ser objeto de cualquier clase de procedimiento concursal de liquidación, después de dictada la resolución de liquidación. …"}]}, {"id": "SM-VF-33", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Será aplicable lo dispuesto en el artículo 8 de la ley N° 20.009 para la investigación de los delitos contemplados en el artículo 468 del Código Penal.", "f": "Art. 468 CP, inciso penúltimo: en la investigación de los delitos de ese artículo es aplicable el art. 8° de la Ley 20.009.", "g": "", "r": 1, "x": [{"c": "Art. 468 CP", "t": "… Utilizando sin la autorización del titular una o más claves confidenciales que habiliten el acceso u operación de un sistema informático, o 3. Haciendo uso no autorizado de una tarjeta de pago ajena o de los datos codificados en una tarjeta de pago que la identifiquen y habiliten como medio de pago. Sin perjuicio de las penas que correspondan conforme al inciso anterior, sufrirá la pena de presidio menor en su grado medio y multa de seis a diez unidades tributarias mensuales el que obtenga indebidamente los datos codificados en una tarjeta de pago que la identifiquen y habiliten como medio de pago. La misma pena sufrirá el que los adquiera o ponga a disposición de otro a cualquier título. …"}]}, {"id": "SM-VF-35", "o": "Prueba SM", "t": "vf", "m": "PB", "e": "El Fiscal Regional no puede intervenir, mediante instrucciones, en investigaciones particulares que llevan a cargo los fiscales adjuntos.", "f": "Art. 44 Ley 19.640: el Fiscal Regional puede dictar instrucciones particulares respecto de un caso asignado a un fiscal adjunto.", "g": "", "r": 0, "x": [{"c": "Art. 44 Ley 19.640", "t": "Artículo 44.- Dentro de cada fiscalía local los fiscales adjuntos ejercerán directamente las funciones del Ministerio Público en los casos que se les asignen. Con dicho fin dirigirán la investigación de los hechos constitutivos de delitos y, cuando proceda, ejercerán las demás atribuciones que la ley les entregue, de conformidad a esta última y a las instrucciones generales que, dentro del ámbito de sus facultades, respectivamente impartan el Fiscal Nacional y el Fiscal Regional. Los fiscales adjuntos estarán igualmente obligados a obedecer las instrucciones particulares que el Fiscal Regional les dirija con respecto a un caso que les hubiere sido asignado, a menos que estimen que tales instrucciones son manifiestamente arbitrarias o que atentan contra la ley o la ética profesional. …"}]}, {"id": "SM-VF-36", "o": "Prueba SM", "t": "vf", "m": "PI", "e": "Siempre debe contarse con la autorización de la víctima –en los casos en que corresponda– para proponer una suspensión condicional del procedimiento.", "f": "Art. 237 CPP: basta el acuerdo entre fiscal e imputado y la aprobación judicial; la víctima y el querellante deben ser oídos si asisten, pero no se requiere su autorización.", "g": "", "r": 0, "x": [{"c": "Art. 237 CPP", "t": "… b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. La presencia del defensor del imputado en la audiencia en que se ventilare la solicitud de suspensión condicional del procedimiento constituirá un requisito de validez de la misma. Si el querellante o la víctima asistieren a la Art. b) audiencia en que se ventile la solicitud de suspensión condicional del procedimiento, deberán ser oídos por el tribunal. …"}]}, {"id": "SM-VF-37", "o": "Prueba SM", "t": "vf", "m": "LE", "e": "Respecto de las lesiones clínicamente leves en contexto de violencia intrafamiliar, es improcedente formular requerimiento en procedimiento monitorio.", "f": "Art. 494 N° 5 CP: en contexto de violencia intrafamiliar las lesiones no pueden calificarse como leves; se sancionan como simple delito (art. 399) y el monitorio sólo procede por faltas con pena de multa (art. 392 CPP).", "g": "", "r": 1, "x": [{"c": "Art. 494 CP", "t": "… Esta pena se regulará conforme a lo dispuesto en los artículos 49, 49 bis, 49 ter, 49 quáter, 49 quinquies y 49 sexies, debiendo existir consentimiento previo del condenado. En caso de no haber consentimiento, se aplicará la pena de multa. 4.° El que amenazare a otro con armas blancas y el que riñendo con otro las sacare, como no sea con motivo justo. 5.° El que causare lesiones leves, entendiéndose por tales las que, en concepto del tribunal, no se hallaren comprendidas en el art. 399, atendidas la calidad de las personas y circunstancias del hecho. En ningún caso el tribunal podrá calificar como leves las lesiones cometidas en contra de las personas mencionadas en el artículo 5° de la Ley sobre Violencia Intrafamiliar, ni aquéllas cometidas en contra de las personas a que se refiere el inciso primero del …"}, {"c": "Art. 392 CPP", "t": "Artículo 392.- Procedimiento monitorio. Se aplicará el procedimiento monitorio a la tramitación de las faltas respecto de las cuales el fiscal pidiere sólo pena de multa. En el requerimiento señalado en el artículo precedente el fiscal indicará el monto de la multa que solicitare imponer. Si el juez estimare suficientemente fundado el requerimiento y la proposición relativa a la multa, deberá acogerlos inmediatamente, dictando una resolución que así lo declare. Dicha resolución contendrá, además, las siguientes indicaciones: a) La instrucción acerca del derecho del imputado de reclamar en contra del requerimiento y de la imposición de la sanción, dentro de los quince días siguientes a su notificación, así como de los efectos de la interposición del reclamo; …"}]}, {"id": "SM-VF-38", "o": "Prueba SM", "t": "vf", "m": "LE", "e": "La ley 20.066 excluye expresamente la procedencia de los acuerdos reparatorios en delitos en contexto de violencia intrafamiliar.", "f": "Art. 19 Ley 20.066: en estos procesos no tiene aplicación el art. 241 CPP.", "g": "", "r": 1, "x": [{"c": "Art. 19 Ley 20.066", "t": "Artículo 19.- Improcedencia de acuerdos reparatorios. En los procesos por delitos constitutivos de violencia intrafamiliar no tendrá aplicación el artículo 241 del Código Procesal Penal."}, {"c": "Art. 241 CPP", "t": "Artículo 241.- Procedencia de los acuerdos reparatorios. El imputado y la víctima podrán convenir acuerdos reparatorios, los que el juez de garantía aprobará, en audiencia a la que citará a los intervinientes para escuchar sus planteamientos, si verificare que los concurrentes al acuerdo hubieren prestado su consentimiento en forma libre y con pleno conocimiento de sus derechos. Los acuerdos reparatorios sólo podrán referirse a hechos investigados que afectaren bienes jurídicos disponibles de carácter patrimonial, consistieren en lesiones menos graves o constituyeren delitos culposos. Sin perjuicio de lo señalado en los incisos precedentes, los acuerdos reparatorios procederán también respecto de los delitos de los artículos 144 inciso primero, 146, 161-A, 161 B, 231, inciso segundo del 247, 284, 296, 297, 494 Nº 4 y 494 Nº 5, todos del Código Penal. …"}]}, {"id": "SM-VF-39", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "El fraude al Fisco puede ser cometido por un funcionario público, pero asimismo admite la intervención de particulares.", "f": "Art. 239 CP: el sujeto activo es el empleado público, pero se admite la intervención punible de particulares (extraneus) como partícipes.", "g": "", "r": 1, "x": [{"c": "Art. 239 CP", "t": "ART. 239. El empleado público que en las operaciones en que interviniere por razón de su cargo, defraudare o consintiere que se defraude al Estado, a las municipalidades o a los establecimientos públicos de instrucción o de beneficencia, sea originándoles pérdida o privándoles de un lucro legítimo, incurrirá en la pena de presidio menor en sus grados medio a máximo. En aquellos casos en que el monto de lo defraudado Art. UNICO N° 1 excediere de cuarenta unidades tributarias mensuales, se impondrá la pena de presidio menor en su grado máximo a presidio mayor en su grado mínimo. Si la defraudación excediere de cuatrocientas unidades a), b) tributarias mensuales se aplicará la pena de presidio mayor en sus grados mínimo a medio. …"}]}, {"id": "SM-VF-40", "o": "Prueba SM", "t": "vf", "m": "LE", "e": "Las causas por delitos cometidos en contexto de violencia intrafamiliar permiten que los Juzgados de Garantía puedan decretar medidas cautelares con anterioridad a la formalización", "f": "Art. 15 Ley 20.066: en cualquier etapa de la investigación o del procedimiento, y aun antes de la formalización.", "g": "", "r": 1, "x": [{"c": "Art. 15 Ley 20.066", "t": "Artículo 15.- Medidas cautelares. En cualquier etapa de la investigación o del procedimiento sobre delitos constitutivos de violencia intrafamiliar, y aun antes de la formalización, el juez de garantía o el tribunal de juicio oral en lo penal, según corresponda, podrá decretar las medidas cautelares que sean necesarias para proteger a la víctima de manera eficaz y oportuna, tales como las que establecen el artículo 92 de la ley N°19.968, que crea los Tribunales de Familia, o la ley que estatuye medidas para prevenir, sancionar y erradicar la violencia en contra de las mujeres, en razón de su género."}]}, {"id": "SM-VF-41", "o": "Prueba SM", "t": "vf", "m": "PP", "e": "La víctima debe elegir si ejerce la acción penal a través de una denuncia o de una querella, no puede utilizar ambas conjuntamente.", "f": "Denuncia y querella no son excluyentes: la víctima puede denunciar y luego querellarse (arts. 109, 111 y 173 CPP).", "g": "", "r": 0, "x": [{"c": "Art. 109 CPP", "t": "Artículo 109.- Derechos de la víctima. La víctima podrá intervenir en el procedimiento penal conforme a lo establecido en este Código, y tendrá, entre otros, los siguientes derechos: a) Solicitar medidas de protección frente a probables hostigamientos, amenazas o atentados en contra suya o de su familia; b) Presentar querella; c) Ejercer contra el imputado acciones tendientes a perseguir las responsabilidades civiles provenientes del hecho punible; d) Ser oída, si lo solicitare, por el fiscal antes de que éste pidiere o se resolviere la suspensión del procedimiento o su terminación anticipada; e) Ser oída, si lo solicitare, por el tribunal antes de pronunciarse acerca del sobreseimiento temporal o definitivo u otra resolución que pusiere término a la causa. …"}]}, {"id": "SM-VF-42", "o": "Prueba SM", "t": "vf", "m": "PG", "e": "El delito descrito en la doctrina como “homicidio preterintencional” consiste en cometer el homicidio con error en la persona o aberratio ictus.", "f": "El homicidio preterintencional supone dolo de lesionar y resultado de muerte imputable a culpa. El error en la persona y la aberratio ictus son problemas distintos (art. 1° inc. 3° CP).", "g": "", "r": 0, "x": [{"c": "Art. 1 CP", "t": "ARTÍCULO 1. Es delito toda acción u omisión voluntaria penada por la ley. Las acciones u omisiones penadas por la ley se reputan siempre voluntarias, a no ser que conste lo contrario. El que cometiere delito será responsable de él e incurrirá en la pena que la ley señale, aunque el mal recaiga sobre persona distinta de aquella a quien se proponía ofender. En tal caso no se tomarán en consideración las circunstancias, no conocidas por el delincuente, que agravarían su responsabilidad; pero sí aquellas que la atenúen."}]}, {"id": "SM-VF-43", "o": "Prueba SM", "t": "vf", "m": "PI", "e": "Al tratarse la suspensión condicional del procedimiento, de un acuerdo entre el fiscal y el imputado, el juez podrá decretarla incluso cuando el querellante se oponga expresamente a ella.", "f": "Art. 237 CPP: el querellante debe ser oído y puede apelar, pero su oposición no impide que el juez decrete la suspensión.", "g": "", "r": 1, "x": [{"c": "Art. 237 CPP", "t": "Artículo 237.- Suspensión condicional del procedimiento. El fiscal, con el acuerdo del imputado, podrá solicitar al juez de garantía la suspensión condicional del procedimiento. El juez podrá requerir del ministerio público los antecedentes que estimare necesarios para resolver. La suspensión condicional del procedimiento podrá Art. a) decretarse: a) Si la pena que pudiere imponerse al imputado, en el evento de dictarse sentencia condenatoria, no excediere de tres años de privación de libertad; b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. …"}]}, {"id": "SM-VF-44", "o": "Prueba SM", "t": "vf", "m": "PR", "e": "La resolución que declara la ilegalidad de la detención siempre es apelable por parte de la Fiscalía.", "f": "Art. 132 bis CPP: sólo es apelable respecto del catálogo de delitos que señala; en los demás casos no lo es.", "g": "", "r": 0, "x": [{"c": "Art. 132 bis CPP", "t": "Artículo 132 bis.- Apelación de la resolución que declara la ilegalidad de la detención. Tratándose de los delitos establecidos en los artículos 141, 142, 361, 362, 365 bis, 390, 390 bis, 390 ter, 391, 433, 436 y 440 del Código Penal, en las leyes N°17.798 y N°20.000 que tengan penas de crimen o simple delito, y de los delitos de castración, mutilaciones y lesiones contra miembros de Carabineros, de la Policía de Investigaciones y de Gendarmería de Chile, en el ejercicio de sus funciones, la resolución que declare la ilegalidad de la detención será apelable por el fiscal o el abogado asistente del fiscal en el solo efecto devolutivo. En los demás casos no será apelable."}]}, {"id": "SM-VF-45", "o": "Prueba SM", "t": "vf", "m": "PR", "e": "Es procedente el recurso de apelación respecto del Auto de Apertura del Juicio Oral, cuando lo interpone el Ministerio Público por la exclusión de pruebas decretada por el Juez de Garantía, fundada en que dichas pruebas resultarían manifiestamente impertinentes.", "f": "Art. 277 inc. 2° CPP: sólo es apelable por el Ministerio Público la exclusión fundada en el inc. 3° del art. 276 (diligencias nulas o inobservancia de garantías), no la de prueba impertinente.", "g": "", "r": 0, "x": [{"c": "Art. 277 CPP", "t": "… b) La o las acusaciones que deberán ser objeto del juicio y las correcciones formales que se hubieren realizado en ellas; c) La demanda civil; d) Los hechos que se dieren por acreditados, en conformidad con lo dispuesto en el artículo 275; e) Las pruebas que deberán rendirse en el juicio oral, de acuerdo a lo previsto en el artículo anterior, y f) La individualización de quienes debieren ser citados a la audiencia del juicio oral, con mención de los testigos a los que debiere pagarse anticipadamente sus gastos de traslado y habitación y los montos respectivos. El auto de apertura del juicio oral sólo será susceptible del recurso de apelación, cuando lo interpusiere el ministerio público por la exclusión de pruebas decretada por el juez de garantía de acuerdo a lo previsto en el inciso tercero del artículo precedente. …"}]}, {"id": "SM-VF-46", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Respecto del delito de robo con violencia o intimidación en las personas, no procede la atenuante de responsabilidad penal prevista en el artículo 11 N° 7 del Código Penal.", "f": "Art. 450 bis CP.", "g": "", "r": 1, "x": [{"c": "Art. 450 bis CP", "t": "ART. 450 bis. En el robo con violencia o intimidación en las personas Art. UNICO, N° 3 no procederá la atenuante de responsabilidad penal contenida en el artículo 11, N° 7."}]}, {"id": "SM-VF-47", "o": "Prueba SM", "t": "vf", "m": "PR", "e": "La resolución que declara inadmisible la apelación verbal del Ministerio Público en los casos en que se sustituya o revoque la internación provisoria de un imputado adolescente, no es susceptible de recurso alguno.", "f": "Denegada una apelación procede el recurso de hecho ante el tribunal de alzada dentro de tercero día (art. 369 CPP).", "g": "", "r": 0, "x": [{"c": "Art. 369 CPP", "t": "Artículo 369.- Recurso de hecho. Denegado el recurso de apelación, concedido siendo improcedente u otorgado con efectos no ajustados a derecho, los intervinientes podrán ocurrir de hecho, dentro de tercero día, ante el tribunal de alzada, con el fin de que resuelva si hubiere lugar o no al recurso y cuáles debieren ser sus efectos. Presentado el recurso, el tribunal de alzada solicitará, cuando correspondiere, los antecedentes señalados en el artículo 371 y luego fallará en cuenta. Si acogiere el recurso por haberse denegado la apelación, retendrá tales antecedentes o los recabará, si no los hubiese pedido, para pronunciarse sobre la apelación."}]}, {"id": "SM-VF-48", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Entre las modalidades comisivas del robo en lugar habitado o destinado a la habitación, se encuentra la fractura de muebles interiores, armarios, arcas u otra clase de muebles sellados o cerrados.", "f": "Art. 440 CP: escalamiento, uso de llaves falsas o semejantes y entrada mediante seducción, engaño o simulación. La fractura de muebles interiores cerrados pertenece al art. 442 N° 2 (lugar no habitado).", "g": "", "r": 0, "x": [{"c": "Art. 440 CP", "t": "ART. 440. El culpable de robo con fuerza en las cosas efectuado en lugar habitado o destinado a la habitación o en sus dependencias, sufrirá la pena de presidio mayor en su grado mínimo si cometiere el delito: 1.º Con escalamiento, entendiéndose que lo hay cuando se entra por vía no destinada al efecto, por forado o con rompimiento de pared o techos, o fractura de puertas o ventanas. 2.º Haciendo uso de llaves falsas, o verdadera que hubiere sido sustraída, de ganzúas u otros instrumentos semejantes para entrar en el lugar del robo. 3.º A Introduciéndose en el lugar del robo mediante la seducción de algún doméstico, o a favor de nombres supuestos o simulación de autoridad. 4.° Eliminado."}]}, {"id": "SM-VF-49", "o": "Prueba SM", "t": "vf", "m": "PG", "e": "Se considera cómplice al que se aprovecha por sí mismo o facilita a los delincuentes medios para que se aprovechen de los efectos del crimen o simple delito.", "f": "Esa conducta es encubrimiento por aprovechamiento (art. 17 N° 1 CP), no complicidad (art. 16).", "g": "", "r": 0, "x": [{"c": "Art. 17 CP", "t": "ART. 17. Son encubridores los que con conocimiento de la perpetración de un crimen o de un simple delito o de los actos ejecutados para llevarlo a cabo, sin haber tenido participación en él como autores ni como cómplices, intervienen, con posterioridad a su ejecución, de alguno de los modos siguientes: 1.° Aprovechándose por sí mismos o facilitando a los delincuentes medios para que se aprovechen de los efectos del crimen o simple delito. 2.° Ocultando o inutilizando el cuerpo, los efectos o instrumentos del crimen o simple delito para impedir su descubrimiento. 3.° Albergando, ocultando o proporcionando la fuga del culpable. 4.° Acogiendo, receptando o protegiendo habitualmente a los malhechores, sabiendo que lo son, aun sin conocimiento de los crímenes o simples delitos determinados que hayan cometido, o facilitándoles los medios de reunirse u ocultar sus armas o efectos, o …"}]}, {"id": "SM-VF-50", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Según la doctrina se denomina “violación impropia” el acceso carnal vía anal o bucal a una persona menor de 18 años, mediando fuerza.", "f": "Se llama violación impropia a la del art. 362 CP: acceso carnal a menor de 14 años aunque no concurra fuerza ni otra circunstancia del art. 361.", "g": "", "r": 0, "x": [{"c": "Art. 362 CP", "t": "ART. 362. El que accediere carnalmente, por vía vaginal, anal o bucal, a una persona menor de catorce años, será castigado con presidio mayor en sus grados medio a máximo, aunque no concurra circunstancia alguna de las enumeradas en el artículo anterior. § VI. Del estupro y otros delitos sexuales."}]}, {"id": "SM-VF-51", "o": "Prueba SM", "t": "vf", "m": "PE", "e": "Es una circunstancia agravante para el delito de femicidio el ejecutarlo en presencia de ascendientes o descendientes de la víctima", "f": "Art. 390 quáter N° 3 CP.", "g": "", "r": 1, "x": [{"c": "Art. 390 quáter CP", "t": "Artículo 390 quáter.- Son circunstancias agravantes de responsabilidad penal para el delito de femicidio, las siguientes: 1. Encontrarse la víctima embarazada. 2. Ser la víctima una niña o una adolescente menor de dieciocho años de edad, una mujer adulta mayor o una mujer en situación de discapacidad en los términos de la ley N° 20.422. 3. Ejecutarlo en presencia de ascendient
