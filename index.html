Tránsito", "g": "N", "i": [], "a": ["Un año, durante el cual el condenado cumple en forma efectiva la pena privativa de libertad", "Dos años, durante los cuales el condenado cumple en forma efectiva la pena privativa de libertad", "Un tercio de la pena impuesta", "Seis meses, durante los cuales el condenado cumple en forma efectiva la pena privativa de libertad"], "r": 0, "grp": "196 ter|Ley de Tránsito", "x": [{"c": "Art. 196 ter Ley de Tránsito", "t": "Artículo 196 ter.- Respecto del delito previsto en el inciso tercero del artículo 196, será aplicable lo previsto en la ley Nº 18.216, conforme a las reglas generales. Sin embargo, la ejecución de la respectiva pena sustitutiva quedará en suspenso por un año, tiempo durante el cual el condenado deberá cumplir en forma efectiva la pena privativa de libertad a la que fuere condenado. Con todo, no se aplicará en estas situaciones lo dispuesto en el artículo 38 de dicha ley y en ningún caso la sustitución de la pena privativa de libertad implicará la sustitución o suspensión del cumplimiento de las multas, comiso e inhabilitaciones impuestas."}]}, {"id": "N-160", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Para la Ley 21.732, asociación terrorista es toda organización de:", "f": "Art. 2 Ley 21.732. Encabezado.", "g": "N", "i": [], "a": ["Cinco o más personas, con estructura jerárquica", "Dos o más personas, con acción sostenida en el tiempo", "Tres o más personas, con acción sostenida en el tiempo", "Tres o más personas, aunque su acción sea ocasional"], "r": 2, "grp": "2|Ley 21.732", "x": [{"c": "Art. 2 Ley 21.732", "t": "Artículo 2º.- Se entenderá por asociación terrorista toda organización de tres o más personas, con acción sostenida en el tiempo, que tenga entre sus objetivos la perpetración de los delitos que se indican a continuación y entre sus fines los de socavar o desestabilizar las estructuras políticas, sociales o económicas del Estado democrático; imponer o inhibir alguna decisión a una autoridad del Estado democrático; o cuando, por los métodos previstos para su perpetración o efectivamente utilizados, esos delitos tengan la aptitud para someter o desmoralizar a la población civil o a una parte de ella: 1º Los previstos en los artículos 141; 142; 150 A; 150 D, inciso segundo; 268 ter; 268 quáter, números 1º y 2º; …"}]}, {"id": "N-161", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Quien sea parte de una asociación terrorista, sin funciones calificadas, es sancionado con:", "f": "Art. 1 Ley 21.732. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio mayor en su grado medio", "Presidio mayor en su grado mínimo", "Presidio mayor en sus grados medio a máximo", "Presidio menor en su grado máximo"], "r": 1, "grp": "1|Ley 21.732", "x": [{"c": "Art. 1 Ley 21.732", "t": "Artículo 1º.- Quien sea parte de una asociación terrorista será sancionado con presidio mayor en su grado mínimo. La pena será de presidio mayor en sus grados mínimo a medio para quien tomare parte en la asociación reclutando nuevos miembros o entregando entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos; y de presidio mayor en su grado medio para quien tomare parte en ella cumpliendo funciones de jefatura, ejerciendo mando en ella, proveyéndole recursos o medios, o habiéndola fundado. La pena será de presidio mayor en su grado medio para quien tomare parte en la asociación reclutando a menores de dieciocho años como miembros o entregándoles entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos. …"}]}, {"id": "N-162", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El plazo especial de investigación para los delitos de la Ley 21.732, contado desde la formalización, es de:", "f": "Art. 18 Ley 21.732", "g": "N", "i": [], "a": ["Dos años", "Cuatro años", "Tres años", "Cinco años"], "r": 2, "grp": "18|Ley 21.732", "x": [{"c": "Art. 18 Ley 21.732", "t": "Artículo 18.- Para la investigación de los delitos sancionados en la presente ley, el fiscal dispondrá un plazo especial de investigación de tres años contado desde la fecha en que la investigación hubiere sido formalizada."}]}, {"id": "N-163v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "No se califican de terroristas las conductas realizadas por menores de dieciocho años, quienes se rigen por la Ley 20.084.", "f": "Art. 15 Ley 21.732", "g": "N", "r": 1, "grp": "15|Ley 21.732", "x": [{"c": "Art. 15 Ley 21.732", "t": "Artículo 15.- Sin perjuicio de lo dispuesto en el artículo 72 del Código Penal, no se calificarán de terroristas las conductas realizadas por personas menores de 18 años, quienes se regirán por la ley Nº 20.084, que establece un sistema de responsabilidad de los adolescentes por infracciones a la ley penal."}]}, {"id": "N-163f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Los mayores de dieciséis años responden como adultos por las conductas terroristas.", "f": "Art. 15 Ley 21.732", "g": "N", "r": 0, "grp": "15|Ley 21.732", "x": [{"c": "Art. 15 Ley 21.732", "t": "Artículo 15.- Sin perjuicio de lo dispuesto en el artículo 72 del Código Penal, no se calificarán de terroristas las conductas realizadas por personas menores de 18 años, quienes se regirán por la ley Nº 20.084, que establece un sistema de responsabilidad de los adolescentes por infracciones a la ley penal."}]}, {"id": "N-164v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La conspiración para cometer los delitos de los artículos 3°, 4°, 7° y 8° de la Ley 21.732 se sanciona con la pena señalada en éstos, rebajada en dos grados.", "f": "Art. 11 Ley 21.732", "g": "N", "r": 1, "grp": "11|Ley 21.732", "x": [{"c": "Art. 11 Ley 21.732", "t": "Artículo 11.- La conspiración para cometer alguno de los delitos contemplados en los artículos 3º, 4º, 7º y 8º se sancionará con la pena señalada en éstos, rebajada en dos grados."}]}, {"id": "N-164f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La conspiración para cometer los delitos de los artículos 3°, 4°, 7° y 8° de la Ley 21.732 se sanciona con la pena señalada en éstos, rebajada en un grado.", "f": "Art. 11 Ley 21.732", "g": "N", "r": 0, "grp": "11|Ley 21.732", "x": [{"c": "Art. 11 Ley 21.732", "t": "Artículo 11.- La conspiración para cometer alguno de los delitos contemplados en los artículos 3º, 4º, 7º y 8º se sancionará con la pena señalada en éstos, rebajada en dos grados."}]}, {"id": "N-165", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La prohibición de salida del país que puede decretarse aun antes de la formalización en procedimientos por delitos de la Ley 21.732 procede:", "f": "Art. 17 Ley 21.732", "g": "N", "i": [], "a": ["Por una única vez y por el período máximo de sesenta días", "Por todo el tiempo que dure la investigación", "Por una única vez y por el período máximo de noventa días", "Por períodos renovables de treinta días"], "r": 0, "grp": "17|Ley 21.732", "x": [{"c": "Art. 17 Ley 21.732", "t": "Artículo 17.- En los procedimientos por delitos contemplados en la presente ley, a petición del Ministerio Público, el juez podrá decretar la prohibición de salida del país del imputado, en cualquier etapa de la investigación o procedimiento y aun antes de la formalización, por una única vez y por el período máximo de sesenta días, cuando concurran los demás requisitos de procedencia de las medidas cautelares personales establecidas en el Código Procesal Penal. Para estos efectos, deberá comunicar la prohibición y su alzamiento a la Policía de Investigaciones de Chile. En todo caso, transcurrido el plazo, la medida de arraigo caducará por el solo ministerio de la ley, de lo cual deberán tomar nota de oficio los organismos señalados."}]}, {"id": "N-166v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la pena de los delitos de los artículos 3°, 4° y 5° de la Ley 21.732, el tribunal no considera los artículos 65 a 69 del Código Penal.", "f": "Art. 6 Ley 21.732", "g": "N", "r": 1, "grp": "6|Ley 21.732", "x": [{"c": "Art. 6 Ley 21.732", "t": "Artículo 6º.- Para determinar la pena de los delitos establecidos en los tres artículos anteriores, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito de que se trate, en atención al número y entidad de circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito."}]}, {"id": "N-166f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la pena de los delitos terroristas rigen sin modificación los artículos 65 a 69 del Código Penal.", "f": "Art. 6 Ley 21.732", "g": "N", "r": 0, "grp": "6|Ley 21.732", "x": [{"c": "Art. 6 Ley 21.732", "t": "Artículo 6º.- Para determinar la pena de los delitos establecidos en los tres artículos anteriores, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito de que se trate, en atención al número y entidad de circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito."}]}, {"id": "N-167", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El financiamiento del terrorismo del artículo 10 de la Ley 21.732 se castiga con:", "f": "Art. 10 Ley 21.732", "g": "N", "i": [], "a": ["Presidio menor en su grado medio", "Presidio menor en su grado máximo", "Presidio mayor en su grado medio", "Presidio mayor en su grado mínimo"], "r": 1, "grp": "10|Ley 21.732", "x": [{"c": "Art. 10 Ley 21.732", "t": "Artículo 10.- Quien, por cualquier medio, directa o indirectamente, provea o recolecte fondos con la finalidad de que se utilicen en la comisión de cualquiera de los delitos señalados en la presente ley o a sabiendas de que serán utilizados en su comisión, será castigado con la pena de presidio menor en su grado máximo, a menos que en virtud de dicha conducta le quepa responsabilidad como integrante de una asociación terrorista o en algún otro delito determinado, en cuyo caso se le sancionará por este último."}]}, {"id": "N-168", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "¿Cuál de los siguientes NO figura entre los principios del artículo 3 de la Ley 21.849?", "f": "Art. 3 Ley 21.849. Legalidad, necesidad, responsabilidad y racionalidad.", "g": "N", "i": [], "a": ["Principio de legalidad", "Principio de racionalidad", "Principio de necesidad", "Principio de oportunidad"], "r": 3, "grp": "3|Ley 21.849", "x": [{"c": "Art. 3 Ley 21.849", "t": "Artículo 3.- Principios. El personal de las Fuerzas de Orden y Seguridad Pública y de las Fuerzas Armadas, en los supuestos señalados en el artículo 1, deberá ajustar su acción a los siguientes principios de actuación: 1. Principio de legalidad: las actuaciones que realicen siempre deben ajustarse a la Constitución, a los tratados internacionales ratificados por Chile y que se encuentren vigentes, y a la ley. 2. Principio de necesidad: sólo se podrá utilizar la fuerza cuando sea necesaria para el cumplimiento del objetivo encomendado. 3. Principio de responsabilidad: el uso de la fuerza, fuera de los parámetros establecidos en la presente ley, conlleva las responsabilidades de quienes la ejercen y, cuando la ley lo determine, la responsabilidad de los mandos respectivos y de la autoridad civil. …"}]}, {"id": "N-169", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El personal que cumple las reglas de uso de la fuerza de la Ley 21.849 queda amparado por la eximente de:", "f": "Art. 15 Ley 21.849", "g": "N", "i": [], "a": ["Legítima defensa del artículo 10 N° 4 del Código Penal", "Fuerza irresistible del artículo 10 N° 9 del Código Penal", "Estado de necesidad del artículo 10 N° 11 del Código Penal", "Cumplimiento del deber del artículo 10 N° 10 del Código Penal"], "r": 3, "grp": "15|Ley 21.849", "x": [{"c": "Art. 15 Ley 21.849", "t": "Artículo 15.- El personal de las Fuerzas de Orden y Seguridad Pública o de las Fuerzas Armadas que cumpliere las reglas de uso de la fuerza establecidas en la presente ley estará amparado por la circunstancia eximente de responsabilidad penal de cumplimiento del deber contemplada en el número 10º del artículo 10 del Código Penal. En casos de uso de la fuerza por el personal que realice las funciones descritas en el artículo 1, deberá acreditarse el incumplimiento de las reglas de uso de la fuerza para establecer su responsabilidad penal. Asimismo, serán aplicables, cuando corresponda, las eximentes de responsabilidad penal previstas en los numerales 4º, 6º y 7º del artículo 10 del Código Penal y, en lo pertinente y de conformidad con sus respectivos ámbitos de aplicación, las contempladas en los artículos 208, 410, 411 y 412 del Código de Justicia Militar, sin perjuicio …"}]}, {"id": "N-170v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La Ley 21.849 se aplica también al personal de las Fuerzas Armadas cuando es llamado a cumplir funciones de resguardo del orden público o de la seguridad pública interior, o en la protección de recintos militares.", "f": "Art. 1 Ley 21.849. Inc. 2°.", "g": "N", "r": 1, "grp": "1|Ley 21.849", "x": [{"c": "Art. 1 Ley 21.849", "t": "Artículo 1.- Objeto. La presente ley tiene por objeto establecer los principios y reglas para el uso de la fuerza por el personal de las Fuerzas de Orden y Seguridad Pública, en el cumplimiento de sus funciones, en conformidad con lo dispuesto en la Constitución y la ley. Esta ley se aplicará también al personal de las Fuerzas Armadas cuando es llamado a cumplir funciones de resguardo del orden público o de la seguridad pública interior, o en la protección de los recintos militares, conforme con la Constitución y la ley."}]}, {"id": "N-170f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La Ley 21.849 se aplica exclusivamente a Carabineros de Chile y a la Policía de Investigaciones.", "f": "Art. 1 Ley 21.849. Inc. 2°.", "g": "N", "r": 0, "grp": "1|Ley 21.849", "x": [{"c": "Art. 1 Ley 21.849", "t": "Artículo 1.- Objeto. La presente ley tiene por objeto establecer los principios y reglas para el uso de la fuerza por el personal de las Fuerzas de Orden y Seguridad Pública, en el cumplimiento de sus funciones, en conformidad con lo dispuesto en la Constitución y la ley. Esta ley se aplicará también al personal de las Fuerzas Armadas cuando es llamado a cumplir funciones de resguardo del orden público o de la seguridad pública interior, o en la protección de los recintos militares, conforme con la Constitución y la ley."}]}, {"id": "N-171v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las Fuerzas de Orden y Seguridad Pública deben enviar informes semestrales sobre uso de la fuerza al Ministerio de Seguridad Pública.", "f": "Art. 10 Ley 21.849", "g": "N", "r": 1, "grp": "10|Ley 21.849", "x": [{"c": "Art. 10 Ley 21.849", "t": "Artículo 10.- Informes. Las Fuerzas de Orden y Seguridad Pública enviarán informes semestrales al Ministerio de Seguridad Pública, por medio de la subsecretaría respectiva, que contengan información estadística relativa al uso de la fuerza y episodios violentos en el mantenimiento del orden público o la seguridad pública interior. Título III Del uso de la fuerza por las Fuerzas Armadas en determinadas circunstancias establecidas en la Constitución y la ley"}]}, {"id": "N-171f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las Fuerzas de Orden y Seguridad Pública deben enviar informes anuales sobre uso de la fuerza al Ministerio Público.", "f": "Art. 10 Ley 21.849", "g": "N", "r": 0, "grp": "10|Ley 21.849", "x": [{"c": "Art. 10 Ley 21.849", "t": "Artículo 10.- Informes. Las Fuerzas de Orden y Seguridad Pública enviarán informes semestrales al Ministerio de Seguridad Pública, por medio de la subsecretaría respectiva, que contengan información estadística relativa al uso de la fuerza y episodios violentos en el mantenimiento del orden público o la seguridad pública interior. Título III Del uso de la fuerza por las Fuerzas Armadas en determinadas circunstancias establecidas en la Constitución y la ley"}]}, {"id": "N-172v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El personal dispuesto para la protección de infraestructura crítica puede hacer uso de fuerza potencialmente letal para impedir daños graves e inminentes a ella.", "f": "Art. 8 Ley 21.849", "g": "N", "r": 1, "grp": "8|Ley 21.849", "x": [{"c": "Art. 8 Ley 21.849", "t": "Artículo 8.- Protección de infraestructura crítica. El personal dispuesto para la protección de infraestructura crítica hará uso de la fuerza de conformidad con lo establecido en los artículos precedentes. Asimismo, podrá hacer uso de la fuerza potencialmente letal cuando tuviere por objeto impedir daños graves e inminentes a la infraestructura crítica."}]}, {"id": "N-172f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El personal dispuesto para la protección de infraestructura crítica no puede en caso alguno hacer uso de fuerza potencialmente letal.", "f": "Art. 8 Ley 21.849", "g": "N", "r": 0, "grp": "8|Ley 21.849", "x": [{"c": "Art. 8 Ley 21.849", "t": "Artículo 8.- Protección de infraestructura crítica. El personal dispuesto para la protección de infraestructura crítica hará uso de la fuerza de conformidad con lo establecido en los artículos precedentes. Asimismo, podrá hacer uso de la fuerza potencialmente letal cuando tuviere por objeto impedir daños graves e inminentes a la infraestructura crítica."}]}, {"id": "N-173", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El lavado de activos del artículo 27 de la Ley 19.913 se castiga con:", "f": "Art. 27 Ley 19.913. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio mayor en su grado medio a máximo y multa de mil a diez mil UTM", "Presidio menor en su grado máximo y multa de cien a quinientas UTM", "Presidio mayor en sus grados mínimo a medio y multa de doscientas a mil UTM", "Presidio menor en sus grados medio a máximo y multa de doscientas a mil UTM"], "r": 2, "grp": "27|Ley 19.913", "x": [{"c": "Art. 27 Ley 19.913", "t": "Artículo 27.- Será castigado con presidio mayor en sus grados mínimo a medio y multa de doscientas a mil unidades tributarias mensuales: a) El que de cualquier forma oculte o disimule el origen ilícito de determinados bienes, a sabiendas de que provienen, directa o indirectamente, de la perpetración de hechos constitutivos de alguno de los delitos contemplados en la ley Nº 20.000, que Sanciona el tráfico ilícito de estupefacientes y sustancias psicotrópicas; en la ley Nº 18.314, que Determina conductas terroristas y fija su penalidad; en el artículo 10 de la ley Nº 17.798, sobre Control de Armas; en el Título XI de la ley Nº 18.045, sobre Mercado de Valores; en el inciso primero del artículo 39 y en el Título XVII del decreto con fuerza de ley Nº 3, de 1997, del Ministerio de Hacienda, Ley General de Bancos; …"}]}, {"id": "N-174", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "¿Cuál de los siguientes NO es un registro del Sistema Nacional de Registros de ADN?", "f": "Art. 4 Ley 19.970. Registros de condenados, imputados, evidencias y antecedentes, víctimas, y desaparecidos y sus familiares.", "g": "N", "i": [], "a": ["Registro de Testigos", "Registro de Evidencias y Antecedentes", "Registro de Desaparecidos y sus Familiares", "Registro de Condenados"], "r": 0, "grp": "4|Ley 19.970", "x": [{"c": "Art. 4 Ley 19.970", "t": "Artículo 4º.- Registros. El Sistema estará integrado por el Registro de Condenados, el Registro de Imputados, el Registro de Evidencias y Antecedentes, el Registro de Víctimas y el Registro de Desaparecidos y sus Familiares."}]}, {"id": "N-175v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En ningún caso los civiles y los menores de edad, en calidad de imputados o de víctimas, están sujetos a la competencia de los tribunales militares.", "f": "Art. 1 Ley 20.477", "g": "N", "r": 1, "grp": "1|Ley 20.477", "x": [{"c": "Art. 1 Ley 20.477", "t": "Artículo 1º.- Restricción de la competencia de los tribunales militares. En ningún caso, los civiles y los menores de edad, que revistan la calidad de víctimas o de imputados, estarán sujetos a la competencia de los tribunales militares. Ésta siempre se radicará en los tribunales ordinarios con competencia en materia penal. Para estos efectos, se entenderá que civil es una persona que no reviste la calidad de militar, de acuerdo al artículo 6º del Código de Justicia Militar. Artículo 1°.- Al momento de entrar en vigencia la presente ley, los juicios seguidos ante Tribunales Militares, en que se persiga la responsabilidad penal de una persona que no tuviere la calidad de militar, continuarán su tramitación ante la Justicia Ordinaria, de conformidad a los procedimientos que a esos tribunales ordinarios en materia criminal les corresponda aplicar."}]}, {"id": "N-175f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "Los civiles quedan sujetos a la competencia de los tribunales militares cuando son coautores de un delito militar junto con uniformados.", "f": "Art. 1 Ley 20.477", "g": "N", "r": 0, "grp": "1|Ley 20.477", "x": [{"c": "Art. 1 Ley 20.477", "t": "Artículo 1º.- Restricción de la competencia de los tribunales militares. En ningún caso, los civiles y los menores de edad, que revistan la calidad de víctimas o de imputados, estarán sujetos a la competencia de los tribunales militares. Ésta siempre se radicará en los tribunales ordinarios con competencia en materia penal. Para estos efectos, se entenderá que civil es una persona que no reviste la calidad de militar, de acuerdo al artículo 6º del Código de Justicia Militar. Artículo 1°.- Al momento de entrar en vigencia la presente ley, los juicios seguidos ante Tribunales Militares, en que se persiga la responsabilidad penal de una persona que no tuviere la calidad de militar, continuarán su tramitación ante la Justicia Ordinaria, de conformidad a los procedimientos que a esos tribunales ordinarios en materia criminal les corresponda aplicar."}]}, {"id": "N-176", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional dura en su cargo:", "f": "Art. 16 Ley 19.640. Art. 85 CPR.", "g": "N", "i": [], "a": ["Seis años y no puede ser designado para el período siguiente", "Ocho años y puede ser designado por un período adicional", "Ocho años y no puede ser designado para el período siguiente", "Diez años y no puede ser designado para el período siguiente"], "r": 2, "grp": "16|Ley 19.640", "x": [{"c": "Art. 16 Ley 19.640", "t": "Artículo 16.- El Fiscal Nacional durará ocho años en su cargo y no podrá ser designado para el período siguiente. Si el Fiscal Nacional dejare de servir su cargo por Art. ÚNICO N° 2 razones diversas de la expiración del plazo legal de duración de sus funciones, la Corte Suprema llamará a concurso público dentro de tercero día de ocurrido ese hecho. Los plazos de días contemplados en este artículo y en el precedente serán de días corridos. El inciso 2º del Artículo 85 de la Constitución Política de la República, aprobada por el Decreto 100, Secretaría General de la Presidencia, publicado el 22.09.2005, dispone que el Fiscal Nacional durará 8 años en el ejercicio de sus funciones."}, {"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}]}, {"id": "N-177", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Para ser nombrado Fiscal Nacional se requiere, entre otros requisitos:", "f": "Art. 14 Ley 19.640", "g": "N", "i": [], "a": ["Tener a lo menos diez años el título de abogado y haber cumplido cuarenta años de edad", "Tener a lo menos quince años el título de abogado y haber cumplido cincuenta años de edad", "Tener a lo menos cinco años el título de abogado y haber cumplido treinta años de edad", "Tener a lo menos diez años el título de abogado y haber cumplido treinta y cinco años de edad"], "r": 0, "grp": "14|Ley 19.640", "x": [{"c": "Art. 14 Ley 19.640", "t": "Artículo 14.- Para ser nombrado Fiscal Nacional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos diez años el título de abogado; c) Haber cumplido cuarenta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}]}, {"id": "N-178", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Para ser nombrado Fiscal Regional se requiere, entre otros requisitos:", "f": "Art. 31 Ley 19.640", "g": "N", "i": [], "a": ["Tener a lo menos cinco años el título de abogado y haber cumplido treinta años de edad", "Tener a lo menos tres años el título de abogado y haber cumplido veinticinco años de edad", "Tener a lo menos diez años el título de abogado y haber cumplido cuarenta años de edad", "Tener el título de abogado, sin exigencia de antigüedad ni de edad"], "r": 0, "grp": "31|Ley 19.640", "x": [{"c": "Art. 31 Ley 19.640", "t": "Artículo 31.- Para ser nombrado Fiscal Regional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos cinco años el título de abogado; c) Haber cumplido treinta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}]}, {"id": "N-179", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los fiscales regionales son nombrados por:", "f": "Art. 29 Ley 19.640", "g": "N", "i": [], "a": ["El Presidente de la República, a propuesta en terna de la Corte Suprema", "El Fiscal Nacional, a propuesta en quina de la Corte Suprema", "La Corte de Apelaciones respectiva, a propuesta en terna del Fiscal Nacional", "El Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región"], "r": 3, "grp": "29|Ley 19.640", "x": [{"c": "Art. 29 Ley 19.640", "t": "Artículo 29.- Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. Si en la región existiere más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la de más antigua creación, en cuya sede se reunirán. Para formar la terna, la Corte de Apelaciones, con noventa días de anticipación a la fecha de expiración del plazo legal del Fiscal Regional en funciones, llamará a concurso público de antecedentes con la adecuada difusión, la que comprenderá al menos publicaciones en diarios de circulación nacional. Los postulantes que reúnan los requisitos legales serán recibidos en una audiencia pública citada especialmente al efecto, por el pleno de la Corte de Apelaciones, en la cual se dará a conocer la nómina …"}]}, {"id": "N-180", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los fiscales adjuntos son designados por:", "f": "Art. 41 Ley 19.640", "g": "N", "i": [], "a": ["El Fiscal Nacional, a propuesta en terna del Fiscal Regional respectivo o del Fiscal Jefe de la Fiscalía Supraterritorial, previo concurso público", "El Fiscal Regional respectivo, previo concurso público", "El Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones respectiva", "El Consejo General del Ministerio Público, previo concurso público"], "r": 0, "grp": "41|Ley 19.640", "x": [{"c": "Art. 41 Ley 19.640", "t": "Artículo 41.- Los fiscales adjuntos serán designados por el Fiscal Nacional, a propuesta en terna del Fiscal Regional respectivo o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, la que deberá formarse previo concurso público. Los concursos se regirán por las reglas generales y bases que al efecto dicte el Fiscal Nacional e incluirán exámenes escritos, orales y una evaluación de los antecedentes académicos y laborales de los postulantes. Las bases que se dicten para el concurso público referido en el inciso anterior serán incorporadas en su llamado, el que será convocado por el Fiscal Regional respectivo o el Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Dicho llamado se efectuará mediante avisos que deberán publicarse en el Diario Oficial, al menos dos veces en un diario de circulación nacional y, en el caso de las Fiscalías Regionales, además, …"}]}, {"id": "N-181v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales adjuntos cesan en sus cargos al cumplir 75 años de edad.", "f": "Art. 43 Ley 19.640. Letra a).", "g": "N", "r": 1, "grp": "43|Ley 19.640", "x": [{"c": "Art. 43 Ley 19.640", "t": "Artículo 43.- Los fiscales adjuntos cesarán en sus cargos por: a) Cumplir 75 años de edad. b) Renuncia. c) Muerte. d) Salud incompatible con el cargo o enfermedad irrecuperable, de acuerdo a lo establecido en el reglamento. e) Evaluación deficiente de su desempeño funcionario, de conformidad al reglamento. f) Incapacidad o incompatibilidad sobreviniente, cuando corresponda."}]}, {"id": "N-181f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales adjuntos cesan en sus cargos al cumplir 70 años de edad.", "f": "Art. 43 Ley 19.640. Letra a).", "g": "N", "r": 0, "grp": "43|Ley 19.640", "x": [{"c": "Art. 43 Ley 19.640", "t": "Artículo 43.- Los fiscales adjuntos cesarán en sus cargos por: a) Cumplir 75 años de edad. b) Renuncia. c) Muerte. d) Salud incompatible con el cargo o enfermedad irrecuperable, de acuerdo a lo establecido en el reglamento. e) Evaluación deficiente de su desempeño funcionario, de conformidad al reglamento. f) Incapacidad o incompatibilidad sobreviniente, cuando corresponda."}]}, {"id": "N-182v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales regionales duran ocho años en el ejercicio de sus funciones y no pueden ser designados como tales por el período siguiente.", "f": "Art. 30 Ley 19.640", "g": "N", "r": 1, "grp": "30|Ley 19.640", "x": [{"c": "Art. 30 Ley 19.640", "t": "Artículo 30.- Los Fiscales Regionales durarán ocho años en el ejercicio de sus funciones y no podrán ser designados como tales por el período siguiente, lo que no obsta a que puedan ser nombrados en otro cargo del Ministerio Público. Los funcionarios que hubiesen sido nombrados Fiscales Regionales, una vez concluido su período, podrán volver a asumir su cargo de origen como funcionario, siempre y cuando no sea en la misma región en donde ejercieron como Fiscal Regional. En estos casos, el Fiscal Nacional definirá la procedencia de tal designación, por resolución fundada, en mérito de sus evaluaciones de desempeño, los informes de supervisión de la persecución penal de la región en que hubiere ejercido como Fiscal Regional y las necesidades del Servicio. …"}]}, {"id": "N-182f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales regionales duran diez años en el ejercicio de sus funciones y pueden ser designados por un período adicional.", "f": "Art. 30 Ley 19.640", "g": "N", "r": 0, "grp": "30|Ley 19.640", "x": [{"c": "Art. 30 Ley 19.640", "t": "Artículo 30.- Los Fiscales Regionales durarán ocho años en el ejercicio de sus funciones y no podrán ser designados como tales por el período siguiente, lo que no obsta a que puedan ser nombrados en otro cargo del Ministerio Público. Los funcionarios que hubiesen sido nombrados Fiscales Regionales, una vez concluido su período, podrán volver a asumir su cargo de origen como funcionario, siempre y cuando no sea en la misma región en donde ejercieron como Fiscal Regional. En estos casos, el Fiscal Nacional definirá la procedencia de tal designación, por resolución fundada, en mérito de sus evaluaciones de desempeño, los informes de supervisión de la persecución penal de la región en que hubiere ejercido como Fiscal Regional y las necesidades del Servicio. …"}]}, {"id": "N-183", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional y los fiscales regionales sólo pueden ser removidos por:", "f": "Art. 53 Ley 19.640. Art. 89 CPR.", "g": "N", "i": [], "a": ["El Senado, a requerimiento del Presidente de la República", "La Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados o de diez de sus miembros", "El Presidente de la República, con acuerdo del Senado", "La Corte Suprema, de oficio o a petición de cualquier interviniente"], "r": 1, "grp": "53|Ley 19.640", "x": [{"c": "Art. 53 Ley 19.640", "t": "Artículo 53.- El Fiscal Nacional y los Fiscales Regionales sólo podrán ser removidos por la Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados o de diez de sus miembros, por incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones. Al Fiscal Jefe de la Fiscalía Supraterritorial le será aplicable lo dispuesto en el inciso anterior, además de la remoción por parte del Fiscal Nacional. La solicitud de remoción señalará con claridad y precisión los hechos que configuraren la causal invocada y a ella se acompañarán o se ofrecerán, si fuera el caso, los medios de prueba en que se fundare. …"}, {"c": "Art. 89 CPR", "t": "Artículo 89.- El Fiscal Nacional y los fiscales Nº7 regionales sólo podrán ser removidos por la Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados, o de diez de sus miembros, por incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones. La Corte conocerá del asunto en pleno especialmente convocado al efecto y para acordar la remoción deberá reunir el voto conforme de la mayoría de sus miembros en ejercicio. La remoción de los fiscales regionales también podrá ser solicitada por el Fiscal Nacional. Al Fiscal Jefe de la Fiscalía Supraterritorial, único especializada en crimen organizado y delitos de alta complejidad, le será aplicable lo dispuesto en el inciso primero, además de la remoción por parte del Fiscal Nacional. …"}]}, {"id": "N-184v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Las instrucciones generales del Fiscal Nacional no pueden ordenar realizar u omitir actuaciones en casos particulares, con la sola excepción del artículo 18.", "f": "Art. 17 Ley 19.640. Letra a).", "g": "N", "r": 1, "grp": "17|Ley 19.640", "x": [{"c": "Art. 17 Ley 19.640", "t": "… 5º a) que estime necesarias para fijar la unidad de acción de los órganos de la institución, en especial, para la consistencia y eficacia en la persecución penal y el adecuado cumplimiento de las tareas de dirección de la investigación de los hechos punibles, ejercicio de la acción penal y protección de las víctimas y testigos. Las instrucciones que dicte el Fiscal Nacional no podrán ordenar realizar u omitir la realización de actuaciones en casos particulares, con la sola excepción de lo establecido en el artículo 18. Asimismo, el Fiscal Nacional estará facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial, en las investigaciones de delitos de crimen organizado o de alta complejidad que estén a su cargo. …"}]}, {"id": "N-184f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional puede impartir instrucciones particulares a cualquier fiscal adjunto en los casos que estime de interés público.", "f": "Art. 17 Ley 19.640. Letra a).", "g": "N", "r": 0, "grp": "17|Ley 19.640", "x": [{"c": "Art. 17 Ley 19.640", "t": "… 5º a) que estime necesarias para fijar la unidad de acción de los órganos de la institución, en especial, para la consistencia y eficacia en la persecución penal y el adecuado cumplimiento de las tareas de dirección de la investigación de los hechos punibles, ejercicio de la acción penal y protección de las víctimas y testigos. Las instrucciones que dicte el Fiscal Nacional no podrán ordenar realizar u omitir la realización de actuaciones en casos particulares, con la sola excepción de lo establecido en el artículo 18. Asimismo, el Fiscal Nacional estará facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial, en las investigaciones de delitos de crimen organizado o de alta complejidad que estén a su cargo. …"}]}, {"id": "N-185v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional está facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial en las investigaciones de crimen organizado o de alta complejidad a su cargo.", "f": "Art. 17 Ley 19.640. Letra a), tras la Ley 21.771.", "g": "N", "r": 1, "grp": "17|Ley 19.640", "x": [{"c": "Art. 17 Ley 19.640", "t": "… la investigación de los hechos punibles, ejercicio de la acción penal y protección de las víctimas y testigos. Las instrucciones que dicte el Fiscal Nacional no podrán ordenar realizar u omitir la realización de actuaciones en casos particulares, con la sola excepción de lo establecido en el artículo 18. Asimismo, el Fiscal Nacional estará facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial, en las investigaciones de delitos de crimen organizado o de alta complejidad que estén a su cargo. Sin embargo, en las investigaciones en que pueda Art. a) existir una afectación a la unidad de acción así consideradas por las Unidades Especializadas o la Unidad de Supervisión, cuando corresponda, el Fiscal Nacional podrá ordenar al Fiscal Regional correspondiente que adopte las medidas que sean necesarias con el fin de garantizar el adecuado cumplimiento de la instrucción general. …"}]}, {"id": "N-185f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional no puede dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial.", "f": "Art. 17 Ley 19.640. Letra a), tras la Ley 21.771.", "g": "N", "r": 0, "grp": "17|Ley 19.640", "x": [{"c": "Art. 17 Ley 19.640", "t": "… la investigación de los hechos punibles, ejercicio de la acción penal y protección de las víctimas y testigos. Las instrucciones que dicte el Fiscal Nacional no podrán ordenar realizar u omitir la realización de actuaciones en casos particulares, con la sola excepción de lo establecido en el artículo 18. Asimismo, el Fiscal Nacional estará facultado para dictar instrucciones particulares al Fiscal Jefe de la Fiscalía Supraterritorial, en las investigaciones de delitos de crimen organizado o de alta complejidad que estén a su cargo. Sin embargo, en las investigaciones en que pueda Art. a) existir una afectación a la unidad de acción así consideradas por las Unidades Especializadas o la Unidad de Supervisión, cuando corresponda, el Fiscal Nacional podrá ordenar al Fiscal Regional correspondiente que adopte las medidas que sean necesarias con el fin de garantizar el adecuado cumplimiento de la instrucción general. …"}]}, {"id": "N-186v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "En la Región Metropolitana de Santiago existen cuatro fiscales regionales.", "f": "Art. 28 Ley 19.640", "g": "N", "r": 1, "grp": "28|Ley 19.640", "x": [{"c": "Art. 28 Ley 19.640", "t": "Artículo 28.- Existirá un fiscal regional en cada una de las regiones del país, con excepción de la Región Metropolitana de Santiago, en la que existirán cuatro fiscales regionales. Las fiscalías regionales tendrán su sede en la capital regional respectiva. En la Región Metropolitana, la sede y la distribución territorial serán determinadas por el Fiscal Nacional."}]}, {"id": "N-186f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "En la Región Metropolitana de Santiago existen cinco fiscales regionales.", "f": "Art. 28 Ley 19.640", "g": "N", "r": 0, "grp": "28|Ley 19.640", "x": [{"c": "Art. 28 Ley 19.640", "t": "Artículo 28.- Existirá un fiscal regional en cada una de las regiones del país, con excepción de la Región Metropolitana de Santiago, en la que existirán cuatro fiscales regionales. Las fiscalías regionales tendrán su sede en la capital regional respectiva. En la Región Metropolitana, la sede y la distribución territorial serán determinadas por el Fiscal Nacional."}]}, {"id": "N-187", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional puede asumir de oficio y de manera excepcional la dirección de una investigación cuando:", "f": "Art. 18 Ley 19.640. La gravedad o complejidad es el supuesto del art. 19, en que designa a un Fiscal Regional.", "g": "N", "i": [], "a": ["El delito cause conmoción pública", "La gravedad del delito o la complejidad de la investigación lo hicieren necesario", "La investidura de las personas involucradas como imputados o víctimas lo hiciere necesario para garantizar independencia y autonomía", "Lo solicite el Fiscal Regional respectivo"], "r": 2, "grp": "18|Ley 19.640", "x": [{"c": "Art. 18 Ley 19.640", "t": "Artículo 18.- El Fiscal Nacional podrá asumir, de oficio y de manera excepcional, la dirección de la investigación, el ejercicio de la acción penal pública y la protección de las víctimas o testigos respecto de determinados hechos que se estimaren constitutivos de delitos, cuando la investidura de las personas involucradas como imputados o víctimas lo hiciere necesario para garantizar que dichas tareas se cumplirán con absoluta independencia y autonomía."}]}, {"id": "N-188v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Conforme al criterio objetivo, los fiscales deben investigar con igual celo los hechos que funden o agraven la responsabilidad del imputado y los que la eximan, extingan o atenúen.", "f": "Art. 3 Ley 19.640", "g": "N", "r": 1, "grp": "3|Ley 19.640", "x": [{"c": "Art. 3 Ley 19.640", "t": "Artículo 3º.- En el ejercicio de su función, los fiscales del Ministerio Público adecuarán sus actos a un criterio objetivo, velando únicamente por la correcta aplicación de la ley. De acuerdo con ese criterio, deberán investigar con igual celo no sólo los hechos y circunstancias que funden o agraven la responsabilidad del imputado, sino también los que le eximan de ella, la extingan o la atenúen. Artículo 3º.- El Fiscal Nacional solicitará a las Cortes de Apelaciones con asiento en comunas ubicadas en las restantes regiones del país la elaboración de las ternas para la designación de los Fiscales Regionales con doce meses de anticipación respecto de los plazos que se establecen en el artículo siguiente. …"}]}, {"id": "N-188f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Conforme al criterio objetivo, los fiscales sólo están obligados a investigar los hechos que funden o agraven la responsabilidad del imputado.", "f": "Art. 3 Ley 19.640", "g": "N", "r": 0, "grp": "3|Ley 19.640", "x": [{"c": "Art. 3 Ley 19.640", "t": "Artículo 3º.- En el ejercicio de su función, los fiscales del Ministerio Público adecuarán sus actos a un criterio objetivo, velando únicamente por la correcta aplicación de la ley. De acuerdo con ese criterio, deberán investigar con igual celo no sólo los hechos y circunstancias que funden o agraven la responsabilidad del imputado, sino también los que le eximan de ella, la extingan o la atenúen. Artículo 3º.- El Fiscal Nacional solicitará a las Cortes de Apelaciones con asiento en comunas ubicadas en las restantes regiones del país la elaboración de las ternas para la designación de los Fiscales Regionales con doce meses de anticipación respecto de los plazos que se establecen en el artículo siguiente. …"}]}, {"id": "N-189v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "No pueden ser fiscales quienes tengan alguna incapacidad o incompatibilidad que los inhabilite para desempeñarse como jueces.", "f": "Art. 60 Ley 19.640", "g": "N", "r": 1, "grp": "60|Ley 19.640", "x": [{"c": "Art. 60 Ley 19.640", "t": "Artículo 60.- No podrán ser fiscales quienes tengan alguna incapacidad o incompatibilidad que los inhabilite para desempeñarse como jueces."}]}, {"id": "N-189f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Las incapacidades para ser juez no se aplican a los fiscales del Ministerio Público.", "f": "Art. 60 Ley 19.640", "g": "N", "r": 0, "grp": "60|Ley 19.640", "x": [{"c": "Art. 60 Ley 19.640", "t": "Artículo 60.- No podrán ser fiscales quienes tengan alguna incapacidad o incompatibilidad que los inhabilite para desempeñarse como jueces."}]}, {"id": "N-190", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "La quina para el cargo de Fiscal Nacional es acordada por la Corte Suprema por:", "f": "Art. 15 Ley 19.640. El Senado la aprueba por dos tercios (art. 85 CPR).", "g": "N", "i": [], "a": ["Los dos tercios de sus miembros en ejercicio", "La mayoría absoluta de sus miembros en ejercicio", "La unanimidad de sus miembros presentes", "La mayoría simple de los miembros presentes"], "r": 1, "grp": "15|Ley 19.640", "x": [{"c": "Art. 15 Ley 19.640", "t": "… Los postulantes que reúnan los requisitos legales serán recibidos en una audiencia pública citada especialmente al efecto por el pleno de la Corte Suprema, en la cual se dará a conocer la nómina de candidatos y los antecedentes presentados por cada uno de ellos. La Corte Suprema establecerá la forma en que se desarrollará esta audiencia. La quina, que será acordada por la mayoría absoluta de sus miembros en ejercicio, en pleno especialmente convocado al efecto, se formará en una misma y única votación, en la cual cada integrante del pleno tendrá derecho a votar por tres personas. Resultarán elegidos quienes obtengan las cinco primeras mayorías. De producirse un empate, éste se resolverá mediante sorteo. …"}, {"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}]}, {"id": "M-0", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El acceso ilícito a un sistema informático, en su figura base, se castiga con:", "f": "Art. 2 Ley 21.459. La figura base exige obrar sin autorización o excediéndola y superar barreras técnicas o medidas de seguridad. Si se accede con ánimo de apoderarse o usar la información, la pena sube a presidio menor en sus grados mínimo a medio.", "g": "N", "i": [], "a": ["Presidio menor en su grado medio", "Presidio menor en su grado mínimo o multa de once a veinte UTM", "Multa de once a veinte UTM únicamente", "Presidio menor en sus grados medio a máximo"], "r": 1, "grp": "2|Ley 21.459", "x": [{"c": "Art. 2 Ley 21.459", "t": "Artículo 2°.- Acceso ilícito. El que, sin autorización o excediendo la autorización que posea y superando barreras técnicas o medidas tecnológicas de seguridad, acceda a un sistema informático será castigado con la pena de presidio menor en su grado mínimo o multa de once a veinte unidades tributarias mensuales. Si el acceso fuere realizado con el ánimo de apoderarse o usar la información contenida en el sistema informático, se aplicará la pena de presidio menor en sus grados mínimo a medio. Igual pena se aplicará a quien divulgue la información a la cual se accedió de manera ilícita, si no fuese obtenida por éste. En caso de ser una misma persona la que hubiere obtenido y divulgado la información, se aplicará la pena de presidio menor en sus grados medio a máximo. …"}]}, {"id": "M-1", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El ataque a la integridad de un sistema informático se castiga con:", "f": "Art. 1 Ley 21.459. Sanciona obstaculizar o impedir el normal funcionamiento, total o parcial, del sistema mediante introducción, transmisión, daño, deterioro, alteración o supresión de datos.", "g": "N", "i": [], "a": ["Presidio menor en su grado mínimo o multa", "Presidio menor en sus grados medio a máximo", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio menor en su grado medio"], "r": 1, "grp": "1|Ley 21.459", "x": [{"c": "Art. 1 Ley 21.459", "t": "Artículo 1°.- Ataque a la integridad de un sistema informático. El que obstaculice o impida el normal funcionamiento, total o parcial, de un sistema informático, a través de la introducción, transmisión, daño, deterioro, alteración o supresión de los datos informáticos, será castigado con la pena de presidio menor en sus grados medio a máximo."}]}, {"id": "M-2v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La receptación de datos informáticos se castiga con la pena asignada a los delitos de origen rebajada en un grado.", "f": "Art. 6 Ley 21.459. Castiga comercializar, transferir o almacenar datos provenientes de acceso ilícito, interceptación ilícita o falsificación informática (arts. 2°, 3° y 5°), conociendo su origen o no pudiendo menos que conocerlo.", "g": "N", "r": 1, "grp": "6|Ley 21.459", "x": [{"c": "Art. 6 Ley 21.459", "t": "Artículo 6°.- Receptación de datos informáticos. El que conociendo su origen o no pudiendo menos que conocerlo comercialice, transfiera o almacene con el mismo objeto u otro fin ilícito, a cualquier título, datos informáticos, provenientes de la realización de las conductas descritas en los artículos 2°, 3° y 5°, sufrirá la pena asignada a los respectivos delitos, rebajada en un grado."}]}, {"id": "M-2f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La receptación de datos informáticos se castiga con la pena asignada a los delitos de origen rebajada en dos grados.", "f": "Art. 6 Ley 21.459. Castiga comercializar, transferir o almacenar datos provenientes de acceso ilícito, interceptación ilícita o falsificación informática (arts. 2°, 3° y 5°), conociendo su origen o no pudiendo menos que conocerlo.", "g": "N", "r": 0, "grp": "6|Ley 21.459", "x": [{"c": "Art. 6 Ley 21.459", "t": "Artículo 6°.- Receptación de datos informáticos. El que conociendo su origen o no pudiendo menos que conocerlo comercialice, transfiera o almacene con el mismo objeto u otro fin ilícito, a cualquier título, datos informáticos, provenientes de la realización de las conductas descritas en los artículos 2°, 3° y 5°, sufrirá la pena asignada a los respectivos delitos, rebajada en un grado."}]}, {"id": "M-3v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El ataque a la integridad de los datos informáticos exige que la alteración, daño o supresión cause un daño grave al titular de los datos.", "f": "Art. 4 Ley 21.459. El daño grave al titular es un elemento del tipo: sin él la conducta no se sanciona por este artículo. La pena es presidio menor en su grado medio.", "g": "N", "r": 1, "grp": "4|Ley 21.459", "x": [{"c": "Art. 4 Ley 21.459", "t": "Artículo 4°.- Ataque a la integridad de los datos informáticos. El que indebidamente altere, dañe o suprima datos informáticos, será castigado con presidio menor en su grado medio, siempre que con ello se cause un daño grave al titular de estos mismos."}]}, {"id": "M-3f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El ataque a la integridad de los datos informáticos se consuma con la sola alteración de los datos, aunque no cause daño alguno a su titular.", "f": "Art. 4 Ley 21.459. El daño grave al titular es un elemento del tipo: sin él la conducta no se sanciona por este artículo. La pena es presidio menor en su grado medio.", "g": "N", "r": 0, "grp": "4|Ley 21.459", "x": [{"c": "Art. 4 Ley 21.459", "t": "Artículo 4°.- Ataque a la integridad de los datos informáticos. El que indebidamente altere, dañe o suprima datos informáticos, será castigado con presidio menor en su grado medio, siempre que con ello se cause un daño grave al titular de estos mismos."}]}, {"id": "M-5", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La interceptación ilícita de la transmisión no pública de información en un sistema informático se castiga con:", "f": "Art. 3 Ley 21.459. El inciso primero sanciona interceptar, interrumpir o interferir indebidamente, por medios técnicos, la transmisión no pública de información.", "g": "N", "i": [], "a": ["Presidio menor en su grado medio", "Presidio menor en su grado máximo", "Presidio menor en sus grados mínimo a medio", "Presidio menor en su grado mínimo"], "r": 0, "grp": "3|Ley 21.459", "x": [{"c": "Art. 3 Ley 21.459", "t": "Artículo 3°.- Interceptación ilícita. El que indebidamente intercepte, interrumpa o interfiera, por medios técnicos, la transmisión no pública de información en un sistema informático o entre dos o más de aquellos, será castigado con la pena de presidio menor en su grado medio. El que, sin contar con la debida autorización, capte, por medios técnicos, datos contenidos en sistemas informáticos a través de las emisiones electromagnéticas provenientes de éstos, será castigado con la pena de presidio menor en sus grados medio a máximo."}]}, {"id": "M-7v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La falta de declaración de responsabilidad penal de la persona natural que perpetró el hecho no obsta a la responsabilidad penal de la persona jurídica.", "f": "Art. 5 Ley 20.393. Es la regla de autonomía: la responsabilidad de la persona jurídica subsiste aunque la persona natural no sea responsable, su responsabilidad se haya extinguido o no pueda seguirse el procedimiento en su contra.", "g": "N", "r": 1, "grp": "5|Ley 20.393", "x": [{"c": "Art. 5 Ley 20.393", "t": "Artículo 5°.- Autonomía de la responsabilidad penal de la persona jurídica. No obstará a la responsabilidad penal de una persona jurídica la falta de declaración de responsabilidad penal de la persona natural que hubiere perpetrado el hecho o intervenido en su perpetración, sea porque ésta, a pesar de la ilicitud del hecho, no hubiere sido penalmente responsable, sea porque tal responsabilidad se hubiere extinguido, sea porque no se hubiere podido continuar el procedimiento en su contra no obstante la punibilidad del hecho. Asimismo, no obstará a la responsabilidad penal de la persona jurídica la falta de identificación de la o las personas naturales que hubieren perpetrado el hecho o intervenido en su perpetración, siempre que conste que el hecho no pudo sino haber sido perpetrado por o con la intervención de alguna de las personas y en las circunstancias señaladas en …"}]}, {"id": "M-7f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La persona jurídica sólo puede ser condenada si previamente se declara la responsabilidad penal de la persona natural que perpetró el hecho.", "f": "Art. 5 Ley 20.393. Es la regla de autonomía: la responsabilidad de la persona jurídica subsiste aunque la persona natural no sea responsable, su responsabilidad se haya extinguido o no pueda seguirse el procedimiento en su contra.", "g": "N", "r": 0, "grp": "5|Ley 20.393", "x": [{"c": "Art. 5 Ley 20.393", "t": "Artículo 5°.- Autonomía de la responsabilidad penal de la persona jurídica. No obstará a la responsabilidad penal de una persona jurídica la falta de declaración de responsabilidad penal de la persona natural que hubiere perpetrado el hecho o intervenido en su perpetración, sea porque ésta, a pesar de la ilicitud del hecho, no hubiere sido penalmente responsable, sea porque tal responsabilidad se hubiere extinguido, sea porque no se hubiere podido continuar el procedimiento en su contra no obstante la punibilidad del hecho. Asimismo, no obstará a la responsabilidad penal de la persona jurídica la falta de identificación de la o las personas naturales que hubieren perpetrado el hecho o intervenido en su perpetración, siempre que conste que el hecho no pudo sino haber sido perpetrado por o con la intervención de alguna de las personas y en las circunstancias señaladas en …"}]}, {"id": "M-8", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "¿Cuál de las siguientes entidades NO está mencionada en el ámbito de aplicación personal de la Ley 20.393?", "f": "Art. 2 Ley 20.393. Responden las personas jurídicas de derecho privado, las empresas públicas creadas por ley, las empresas, sociedades y universidades del Estado, los partidos políticos y las personas jurídicas religiosas de derecho público.", "g": "N", "i": [], "a": ["Las municipalidades", "Las universidades del Estado", "Las personas jurídicas religiosas de derecho público", "Los partidos políticos"], "r": 0, "grp": "2|Ley 20.393", "x": [{"c": "Art. 2 Ley 20.393", "t": "Artículo 2°.- Ámbito de aplicación personal. Serán penalmente responsables en los términos de esta ley las personas jurídicas de derecho privado, las empresas públicas creadas por ley; las empresas, sociedades y universidades del Estado; los partidos políticos y las personas jurídicas religiosas de derecho público. TÍTULO I Responsabilidad Penal de las Personas Jurídicas 1.- De la atribución de responsabilidad penal de las personas jurídicas"}]}, {"id": "M-9", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Para que la persona jurídica responda penalmente, la perpetración del hecho debe verse favorecida o facilitada por:", "f": "Art. 3 Ley 20.393. Además, el delito debe ser perpetrado en el marco de su actividad por o con la intervención de una persona natural que ocupe un cargo, función o posición en ella o le preste servicios gestionando asuntos suyos ante terceros.", "g": "N", "i": [], "a": ["La falta de implementación efectiva de un modelo adecuado de prevención de delitos", "La inexistencia de un encargado de prevención", "La intervención de sus dueños o controladores", "El beneficio económico directo obtenido por la persona jurídica"], "r": 0, "grp": "3|Ley 20.393", "x": [{"c": "Art. 3 Ley 20.393", "t": "… Una persona jurídica será penalmente responsable por cualquiera de los delitos señalados en el artículo 1, perpetrado en el marco de su actividad por o con la intervención de alguna persona natural que ocupe un cargo, función o posición en ella, o le preste servicios gestionando asuntos suyos ante terceros, con o sin su representación, siempre que la perpetración del hecho se vea favorecida o facilitada por la falta de implementación efectiva de un modelo adecuado de prevención de tales delitos, por parte de la persona jurídica. Si concurrieren los requisitos previstos en el inciso anterior, una persona jurídica también será responsable por el hecho perpetrado por o con la intervención de una persona natural relacionada en los términos previstos por dicho inciso con una persona jurídica distinta, siempre que ésta le preste servicios gestionando asuntos suyos ante terceros, con o …"}]}, {"id": "M-10v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Son atenuantes de la responsabilidad penal de la persona jurídica las de los números 7° y 9° del artículo 11 del Código Penal.", "f": "Art. 6 Ley 20.393. La irreprochable conducta anterior (N° 6) no figura; sí la reparación celosa del mal (N° 7) y la colaboración sustancial (N° 9).", "g": "N", "r": 1, "grp": "6|Ley 20.393", "x": [{"c": "Art. 6 Ley 20.393", "t": "Artículo 6°.- Circunstancias atenuantes. Serán circunstancias atenuantes de la responsabilidad penal de la persona jurídica, las siguientes: 1) La prevista en el número 7° del artículo 11 del Código Penal. 2) La prevista en el número 9° del artículo 11 del Código Penal. Se entenderá especialmente que la persona jurídica colabora sustancialmente cuando, en cualquier estado de la investigación o del procedimiento judicial, sus representantes legales hayan puesto, antes de conocer que el procedimiento judicial se dirige contra ella, el hecho punible en conocimiento de las autoridades o aportado antecedentes para establecer los hechos investigados. 3) La adopción por parte de la persona jurídica, antes de la formalización de la investigación, de medidas eficaces para prevenir la reiteración de la misma clase de delitos objeto de la investigación. …"}]}, {"id": "M-10f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Son atenuantes de la responsabilidad penal de la persona jurídica las de los números 6° y 9° del artículo 11 del Código Penal.", "f": "Art. 6 Ley 20.393. La irreprochable conducta anterior (N° 6) no figura; sí la reparación celosa del mal (N° 7) y la colaboración sustancial (N° 9).", "g": "N", "r": 0, "grp": "6|Ley 20.393", "x": [{"c": "Art. 6 Ley 20.393", "t": "Artículo 6°.- Circunstancias atenuantes. Serán circunstancias atenuantes de la responsabilidad penal de la persona jurídica, las siguientes: 1) La prevista en el número 7° del artículo 11 del Código Penal. 2) La prevista en el número 9° del artículo 11 del Código Penal. Se entenderá especialmente que la persona jurídica colabora sustancialmente cuando, en cualquier estado de la investigación o del procedimiento judicial, sus representantes legales hayan puesto, antes de conocer que el procedimiento judicial se dirige contra ella, el hecho punible en conocimiento de las autoridades o aportado antecedentes para establecer los hechos investigados. 3) La adopción por parte de la persona jurídica, antes de la formalización de la investigación, de medidas eficaces para prevenir la reiteración de la misma clase de delitos objeto de la investigación. …"}]}, {"id": "M-11v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La pena de extinción de la persona jurídica produce la pérdida definitiva de la personalidad jurídica.", "f": "Art. 9 Ley 20.393. Para imponerla el tribunal considera especialmente el peligro de reiteración delictiva que represente el funcionamiento de la persona jurídica.", "g": "N", "r": 1, "grp": "9|Ley 20.393", "x": [{"c": "Art. 9 Ley 20.393", "t": "Artículo 9°.- Extinción de la persona jurídica. Por la pena de extinción de la persona jurídica se dispone la pérdida definitiva de la personalidad jurídica. Para su imposición el tribunal tendrá especialmente en cuenta el peligro de reiteración delictiva que pueda representar el funcionamiento de la persona jurídica. Esta pena sólo se podrá imponer tratándose de crímenes, si concurre la circunstancia agravante establecida en el número 1 del artículo 7 o en caso de reiteración delictiva. La pena de extinción de la persona jurídica no se aplicará a las empresas públicas creadas por ley ni a las personas jurídicas que presten un servicio de utilidad pública cuya interrupción pueda causar graves consecuencias sociales y económicas o daños serios a la comunidad o sea perjudicial para el Estado."}]}, {"id": "M-11f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La pena de extinción de la persona jurídica produce la suspensión de la personalidad jurídica por el tiempo de la condena.", "f": "Art. 9 Ley 20.393. Para imponerla el tribunal considera especialmente el peligro de reiteración delictiva que represente el funcionamiento de la persona jurídica.", "g": "N", "r": 0, "grp": "9|Ley 20.393", "x": [{"c": "Art. 9 Ley 20.393", "t": "Artículo 9°.- Extinción de la persona jurídica. Por la pena de extinción de la persona jurídica se dispone la pérdida definitiva de la personalidad jurídica. Para su imposición el tribunal tendrá especialmente en cuenta el peligro de reiteración delictiva que pueda representar el funcionamiento de la persona jurídica. Esta pena sólo se podrá imponer tratándose de crímenes, si concurre la circunstancia agravante establecida en el número 1 del artículo 7 o en caso de reiteración delictiva. La pena de extinción de la persona jurídica no se aplicará a las empresas públicas creadas por ley ni a las personas jurídicas que presten un servicio de utilidad pública cuya interrupción pueda causar graves consecuencias sociales y económicas o daños serios a la comunidad o sea perjudicial para el Estado."}]}, {"id": "M-12", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "En la asociación para cometer lavado de activos, quien financia, ejerce el mando o dirección o planifica los actos es sancionado con:", "f": "Art. 28 Ley 19.913. Se sanciona por el solo hecho de asociarse u organizarse. Quien suministra vehículos, armas, alojamiento o colabora de otra forma recibe presidio mayor en su grado mínimo.", "g": "N", "i": [], "a": ["Presidio mayor en su grado máximo", "Presidio mayor en su grado medio", "Presidio menor en su grado máximo", "Presidio mayor en su grado mínimo"], "r": 1, "grp": "28|Ley 19.913", "x": [{"c": "Art. 28 Ley 19.913", "t": "Artículo 28.- Los que se asociaren u organizaren con el objeto de llevar a cabo algunas de las conductas descritas en el artículo anterior, serán sancionados por este solo hecho, según las normas que siguen: 1.- Con presidio mayor en su grado medio, al que financie, ejerza el mando o dirección, o planifique los actos que se propongan, y 2.- Con presidio mayor en su grado mínimo, al que suministre vehículos, armas, municiones, instrumentos, alojamiento, escondite, lugares de reunión, o colabore de cualquier otra forma para la consecución de los fines de la organización. Cuando la asociación se hubiere formado a través de una persona jurídica, se impondrá además, como consecuencia accesoria de la pena impuesta a los responsables individuales, la disolución o cancelación de la personalidad jurídica."}]}, {"id": "M-13v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "A los delitos de los artículos 27 y 28 de la Ley 19.913 les son aplicables las normas de investigación de la Ley 20.000.", "f": "Art. 33 Ley 19.913. La remisión comprende investigación (colaboración de organismos del Estado, actuaciones fuera del territorio, entregas vigiladas, agentes encubiertos, interceptación), entre otras materias.", "g": "N", "r": 1, "grp": "33|Ley 19.913", "x": [{"c": "Art. 33 Ley 19.913", "t": "Artículo 33.- Sin perjuicio de lo dispuesto en la presente ley, serán aplicables respecto de los delitos establecidos en los artículos 27 y 28, todas las normas de la ley Nº 20.000, sobre tráfico ilícito de estupefacientes y substancias psicotrópicas, y las que contenga cualquier otra ley que la sustituya o modifique, que se refieran a las siguientes materias: a) Investigación: se comprenden, especialmente, la colaboración de organismos del Estado, la facultad del Ministerio Público para efectuar actuaciones fuera del territorio nacional o sin previo conocimiento del afectado y la cooperación internacional en general; levantamiento del secreto bancario; gratuidad de los antecedentes requeridos durante la investigación; técnicas especiales de investigación, como la entrega u operación vigilada, la utilización de agentes encubiertos e informantes, la interceptación de comunicaciones y demás medios técnicos; …"}]}, {"id": "M-13f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "A los delitos de los artículos 27 y 28 de la Ley 19.913 no les son aplicables las técnicas de investigación de la Ley 20.000.", "f": "Art. 33 Ley 19.913. La remisión comprende investigación (colaboración de organismos del Estado, actuaciones fuera del territorio, entregas vigiladas, agentes encubiertos, interceptación), entre otras materias.", "g": "N", "r": 0, "grp": "33|Ley 19.913", "x": [{"c": "Art. 33 Ley 19.913", "t": "Artículo 33.- Sin perjuicio de lo dispuesto en la presente ley, serán aplicables respecto de los delitos establecidos en los artículos 27 y 28, todas las normas de la ley Nº 20.000, sobre tráfico ilícito de estupefacientes y substancias psicotrópicas, y las que contenga cualquier otra ley que la sustituya o modifique, que se refieran a las siguientes materias: a) Investigación: se comprenden, especialmente, la colaboración de organismos del Estado, la facultad del Ministerio Público para efectuar actuaciones fuera del territorio nacional o sin previo conocimiento del afectado y la cooperación internacional en general; levantamiento del secreto bancario; gratuidad de los antecedentes requeridos durante la investigación; técnicas especiales de investigación, como la entrega u operación vigilada, la utilización de agentes encubiertos e informantes, la interceptación de comunicaciones y demás medios técnicos; …"}]}, {"id": "M-14", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La entrevista investigativa videograbada es realizada por un entrevistador:", "f": "Art. 6 Ley 21.057. En la etapa de investigación designa el fiscal. Distinto es el intermediario de la declaración judicial, que lo designa el juez de garantía en la audiencia de preparación (art. 15).", "g": "N", "i": [], "a": ["Designado por la policía que recibió la denuncia", "Designado por el juez de garantía, de entre los peritos del Servicio Médico Legal", "Designado por la Unidad de Atención a Víctimas y Testigos, sin necesidad de acreditación", "Designado por el fiscal, de entre los que cuentan con acreditación vigente en el registro del Ministerio de Justicia y Derechos Humanos"], "r": 3, "grp": "6|Ley 21.057", "x": [{"c": "Art. 6 Ley 21.057", "t": "Artículo 6°.- Designación del entrevistador. La entrevista investigativa videograbada será realizada por un entrevistador designado por el fiscal, de entre los que cuenten con acreditación vigente en el registro de entrevistadores elaborado por el Ministerio de Justicia y Derechos Humanos."}]}, {"id": "M-15v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La entrevista investigativa videograbada debe realizarse en el tiempo más próximo a la denuncia, salvo que el niño, niña o adolescente no esté disponible y en condiciones de participar.", "f": "Art. 7 Ley 21.057. La disponibilidad y las condiciones físicas y psíquicas las califica un profesional de la Unidad de Atención a Víctimas y Testigos de la fiscalía.", "g": "N", "r": 1, "grp": "7|Ley 21.057", "x": [{"c": "Art. 7 Ley 21.057", "t": "Artículo 7°.- Oportunidad de la entrevista investigativa videograbada. La entrevista investigativa videograbada se realizará en el tiempo más próximo a la denuncia, a menos que el niño, niña o adolescente no se encuentre disponible y en condiciones físicas y psíquicas para participar en ella, lo que deberá ser calificado por un profesional de la Unidad de Atención a Víctimas y Testigos de la fiscalía respectiva. La evaluación del profesional de la Unidad de Atención a Víctimas y Testigos del Ministerio Público se realizará en el menor tiempo posible y en condiciones que garanticen la menor interacción presencial del niño, niña o adolescente. Los profesionales a cargo de esta evaluación en ningún caso podrán hacer al niño, niña o adolescente preguntas que busquen establecer la ocurrencia de los hechos o la determinación de sus partícipes. …"}]}, {"id": "M-15f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La entrevista investigativa videograbada debe realizarse una vez formalizada la investigación.", "f": "Art. 7 Ley 21.057. La disponibilidad y las condiciones físicas y psíquicas las califica un profesional de la Unidad de Atención a Víctimas y Testigos de la fiscalía.", "g": "N", "r": 0, "grp": "7|Ley 21.057", "x": [{"c": "Art. 7 Ley 21.057", "t": "Artículo 7°.- Oportunidad de la entrevista investigativa videograbada. La entrevista investigativa videograbada se realizará en el tiempo más próximo a la denuncia, a menos que el niño, niña o adolescente no se encuentre disponible y en condiciones físicas y psíquicas para participar en ella, lo que deberá ser calificado por un profesional de la Unidad de Atención a Víctimas y Testigos de la fiscalía respectiva. La evaluación del profesional de la Unidad de Atención a Víctimas y Testigos del Ministerio Público se realizará en el menor tiempo posible y en condiciones que garanticen la menor interacción presencial del niño, niña o adolescente. Los profesionales a cargo de esta evaluación en ningún caso podrán hacer al niño, niña o adolescente preguntas que busquen establecer la ocurrencia de los hechos o la determinación de sus partícipes. …"}]}, {"id": "M-16", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El entrevistador que actúa como intermediario en la declaración judicial del niño, niña o adolescente es designado por:", "f": "Art. 15 Ley 21.057. El juez de garantía lo selecciona en la audiencia de preparación de entre quienes tienen acreditación vigente.", "g": "N", "i": [], "a": ["El Ministerio de Justicia y Derechos Humanos, a solicitud del tribunal", "El juez de garantía, durante la audiencia de preparación del juicio oral", "El tribunal de juicio oral, al inicio de la audiencia de juicio", "El fiscal, al presentar la acusación"], "r": 1, "grp": "15|Ley 21.057", "x": [{"c": "Art. 15 Ley 21.057", "t": "Artículo 15.- Designación del entrevistador que actuará como intermediario en la declaración judicial. Durante la audiencia de preparación de juicio oral, el juez de garantía designará al entrevistador que actuará como intermediario en la declaración judicial. Para tales efectos, el juez seleccionará al entrevistador de entre aquellos que cuenten con acreditación vigente ante el Ministerio de Justicia y Derechos Humanos, debiendo escuchar previamente a los intervinientes. El tribunal de juicio oral en lo penal, al momento de dictar la resolución a que se refiere el artículo 281 del Código Procesal Penal, podrá modificar la designación a que se refiere el inciso anterior, disponiendo que actúe como intermediario en la declaración judicial un funcionario del Poder Judicial o un juez del mismo tribunal, que cuente con acreditación vigente ante el Ministerio de Justicia y Derechos Humanos. …"}]}, {"id": "M-17v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Los adolescentes pueden declarar en el juicio sin la intervención de entrevistador cuando así lo manifiestan libre y voluntariamente.", "f": "Art. 14 Ley 21.057. El tribunal, antes de autorizarlo, debe velar por que el adolescente esté disponible y en condiciones físicas y psíquicas para declarar.", "g": "N", "r": 1, "grp": "14|Ley 21.057", "x": [{"c": "Art. 14 Ley 21.057", "t": "Artículo 14.- Declaración voluntaria en juicio de los adolescentes. No obstante lo indicado en el artículo anterior, los adolescentes, cuando así lo manifestaren libre y voluntariamente, podrán declarar en el juicio sin la intervención de entrevistador. El tribunal, previo a autorizar dicha solicitud, deberá velar por que el adolescente se encuentre disponible y en condiciones físicas y psíquicas para participar en ella. En tal caso, el adolescente prestará declaración en una sala distinta de aquella en que se encuentren los demás intervinientes, especialmente acondicionada para ello y que cuente con un sistema interconectado de comunicación que permita que el juez lo interrogue presencialmente en dicha sala, debiendo los demás intervinientes dirigir las preguntas por su intermedio."}]}, {"id": "M-17f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Los adolescentes deben declarar siempre en juicio por medio de un entrevistador, sin excepción.", "f": "Art. 14 Ley 21.057. El tribunal, antes de autorizarlo, debe velar por que el adolescente esté disponible y en condiciones físicas y psíquicas para declarar.", "g": "N", "r": 0, "grp": "14|Ley 21.057", "x": [{"c": "Art. 14 Ley 21.057", "t": "Artículo 14.- Declaración voluntaria en juicio de los adolescentes. No obstante lo indicado en el artículo anterior, los adolescentes, cuando así lo manifestaren libre y voluntariamente, podrán declarar en el juicio sin la intervención de entrevistador. El tribunal, previo a autorizar dicha solicitud, deberá velar por que el adolescente se encuentre disponible y en condiciones físicas y psíquicas para participar en ella. En tal caso, el adolescente prestará declaración en una sala distinta de aquella en que se encuentren los demás intervinientes, especialmente acondicionada para ello y que cuente con un sistema interconectado de comunicación que permita que el juez lo interrogue presencialmente en dicha sala, debiendo los demás intervinientes dirigir las preguntas por su intermedio."}]}, {"id": "M-18", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La declaración judicial anticipada de niños, niñas y adolescentes víctimas puede solicitarse:", "f": "Art. 16 Ley 21.057. Pueden pedirla el fiscal, la víctima, el querellante y el curador ad litem.", "g": "N", "i": [], "a": ["Desde la formalización de la investigación y hasta antes del inicio de la audiencia de juicio, siempre ante el juez de garantía", "En cualquier momento, ante el tribunal de juicio oral", "Sólo en la audiencia de preparación del juicio oral", "Desde la denuncia y hasta el cierre de la investigación, ante el fiscal"], "r": 0, "grp": "16|Ley 21.057", "x": [{"c": "Art. 16 Ley 21.057", "t": "Artículo 16.- De la declaración judicial anticipada. El fiscal, la víctima, el querellante y el curador ad litem podrán solicitar la declaración judicial anticipada de los niños, niñas y adolescentes víctimas de los delitos contemplados en el artículo 1°. La solicitud de prueba anticipada podrá realizarse desde la formalización de la investigación y hasta antes del inicio de la audiencia de juicio, debiendo siempre plantearse y desarrollarse ante el juez de garantía. Una vez efectuada la solicitud de prueba anticipada, el juez citará a los intervinientes a una audiencia donde se discutirá su procedencia. En caso de acogerse la solicitud planteada, el juez citará a una audiencia para rendir la prueba de que se trate, notificando a todos los intervinientes y al entrevistador que designe. …"}]}, {"id": "M-19v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Una segunda entrevista investigativa videograbada sólo procede cuando aparecen hechos o antecedentes que no fueron materia de la primera, modifican lo expuesto y pueden afectar sustancialmente la investigación.", "f": "Art. 10 Ley 21.057. La regla es una sola entrevista, para evitar la exposición reiterada de la víctima; la segunda es excepcional.", "g": "N", "r": 1, "grp": "10|Ley 21.057", "x": [{"c": "Art. 10 Ley 21.057", "t": "Artículo 10.- De la realización de otras entrevistas investigativas videograbadas. Sólo cuando aparezcan hechos o antecedentes que no hayan sido materia de la entrevista investigativa videograbada, que modifiquen lo expuesto en ella y puedan afectar sustancialmente el curso de la investigación, el fiscal, de oficio o a solicitud de cualquiera de los intervinientes, podrá disponer la realización de una segunda entrevista investigativa videograbada, la que, en todo caso, se sujetará a las disposiciones de esta ley. Se dejará constancia en la carpeta investigativa de la decisión del fiscal y de los hechos y antecedentes que se tuvieron en cuenta para adoptarla. No obstante lo señalado en el inciso anterior, la decisión del fiscal de disponer la realización de una segunda entrevista investigativa videograbada deberá someterse a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. …"}]}, {"id": "M-19f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El fiscal puede disponer una segunda entrevista investigativa videograbada cada vez que lo estime conveniente para la investigación.", "f": "Art. 10 Ley 21.057. La regla es una sola entrevista, para evitar la exposición reiterada de la víctima; la segunda es excepcional.", "g": "N", "r": 0, "grp": "10|Ley 21.057", "x": [{"c": "Art. 10 Ley 21.057", "t": "Artículo 10.- De la realización de otras entrevistas investigativas videograbadas. Sólo cuando aparezcan hechos o antecedentes que no hayan sido materia de la entrevista investigativa videograbada, que modifiquen lo expuesto en ella y puedan afectar sus
