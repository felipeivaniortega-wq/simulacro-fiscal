tancialmente el curso de la investigación, el fiscal, de oficio o a solicitud de cualquiera de los intervinientes, podrá disponer la realización de una segunda entrevista investigativa videograbada, la que, en todo caso, se sujetará a las disposiciones de esta ley. Se dejará constancia en la carpeta investigativa de la decisión del fiscal y de los hechos y antecedentes que se tuvieron en cuenta para adoptarla. No obstante lo señalado en el inciso anterior, la decisión del fiscal de disponer la realización de una segunda entrevista investigativa videograbada deberá someterse a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. …"}]}, {"id": "M-20v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "En la sala en que se presta la declaración judicial sólo están presentes el entrevistador y el niño, niña o adolescente.", "f": "Art. 13 Ley 21.057. Excepcionalmente, si hay dificultades de comunicación, el tribunal puede autorizar la presencia de un traductor, intérprete u otro especialista.", "g": "N", "r": 1, "grp": "13|Ley 21.057", "x": [{"c": "Art. 13 Ley 21.057", "t": "Artículo 13.- Objeto de la declaración judicial. Esta declaración tendrá como propósito que el niño, niña o adolescente preste declaración en juicio en una sala que cumpla con lo previsto en los artículos 20 y 21 de esta ley, y en la que sólo estarán presentes el entrevistador y el niño, niña o adolescente. Sin perjuicio de lo anterior, en aquellos casos en que existan dificultades de comunicación con el niño, niña o adolescente, el tribunal podrá autorizar la presencia de un traductor, intérprete u otro especialista profesional o técnico idóneo. Sin perjuicio del registro de la audiencia, esta declaración deberá ser videograbada de manera independiente, según lo dispone el artículo 22."}]}, {"id": "M-20f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "En la sala en que se presta la declaración judicial están presentes el entrevistador, el fiscal y el defensor.", "f": "Art. 13 Ley 21.057. Excepcionalmente, si hay dificultades de comunicación, el tribunal puede autorizar la presencia de un traductor, intérprete u otro especialista.", "g": "N", "r": 0, "grp": "13|Ley 21.057", "x": [{"c": "Art. 13 Ley 21.057", "t": "Artículo 13.- Objeto de la declaración judicial. Esta declaración tendrá como propósito que el niño, niña o adolescente preste declaración en juicio en una sala que cumpla con lo previsto en los artículos 20 y 21 de esta ley, y en la que sólo estarán presentes el entrevistador y el niño, niña o adolescente. Sin perjuicio de lo anterior, en aquellos casos en que existan dificultades de comunicación con el niño, niña o adolescente, el tribunal podrá autorizar la presencia de un traductor, intérprete u otro especialista profesional o técnico idóneo. Sin perjuicio del registro de la audiencia, esta declaración deberá ser videograbada de manera independiente, según lo dispone el artículo 22."}]}, {"id": "M-21", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La incorporación de las huellas genéticas de condenados o imputados en los registros respectivos se ejecuta por orden de:", "f": "Art. 16 Ley 19.970. Condenados e imputados: orden del tribunal. Víctimas, evidencias y desaparecidos o sus familiares: orden del fiscal.", "g": "N", "i": [], "a": ["El tribunal", "El Servicio de Registro Civil e Identificación", "El fiscal del Ministerio Público", "El Servicio Médico Legal"], "r": 0, "grp": "16|Ley 19.970", "x": [{"c": "Art. 16 Ley 19.970", "t": "Artículo 16.- Incorporación de las huellas genéticas en los Registros del Sistema. Tratándose de huellas genéticas correspondientes a condenados o imputados, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del tribunal. Tratándose de huellas genéticas correspondientes a víctimas, evidencias o desaparecidos o sus familiares, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del fiscal del Ministerio Público, sin perjuicio de lo dispuesto en el artículo 8º. En los casos a que se refieren los incisos precedentes, la incorporación en los Registros será ejecutada por el organismo que hubiere determinado la huella genética. En todo caso, las instituciones públicas o privadas no especialmente acreditadas para el ingreso de información al Sistema, remitirán la huella genética al Servicio Médico Legal para que éste la incorpore en el Registro correspondiente. …"}]}, {"id": "M-22v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La incorporación de huellas genéticas de víctimas, evidencias o desaparecidos y sus familiares se ejecuta por orden del fiscal del Ministerio Público.", "f": "Art. 16 Ley 19.970. La orden judicial se reserva para condenados e imputados.", "g": "N", "r": 1, "grp": "16|Ley 19.970", "x": [{"c": "Art. 16 Ley 19.970", "t": "Artículo 16.- Incorporación de las huellas genéticas en los Registros del Sistema. Tratándose de huellas genéticas correspondientes a condenados o imputados, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del tribunal. Tratándose de huellas genéticas correspondientes a víctimas, evidencias o desaparecidos o sus familiares, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del fiscal del Ministerio Público, sin perjuicio de lo dispuesto en el artículo 8º. En los casos a que se refieren los incisos precedentes, la incorporación en los Registros será ejecutada por el organismo que hubiere determinado la huella genética. En todo caso, las instituciones públicas o privadas no especialmente acreditadas para el ingreso de información al Sistema, remitirán la huella genética al Servicio Médico Legal para que éste la incorpore en el Registro correspondiente. …"}]}, {"id": "M-22f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La incorporación de huellas genéticas de víctimas, evidencias o desaparecidos y sus familiares se ejecuta por orden del tribunal.", "f": "Art. 16 Ley 19.970. La orden judicial se reserva para condenados e imputados.", "g": "N", "r": 0, "grp": "16|Ley 19.970", "x": [{"c": "Art. 16 Ley 19.970", "t": "Artículo 16.- Incorporación de las huellas genéticas en los Registros del Sistema. Tratándose de huellas genéticas correspondientes a condenados o imputados, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del tribunal. Tratándose de huellas genéticas correspondientes a víctimas, evidencias o desaparecidos o sus familiares, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del fiscal del Ministerio Público, sin perjuicio de lo dispuesto en el artículo 8º. En los casos a que se refieren los incisos precedentes, la incorporación en los Registros será ejecutada por el organismo que hubiere determinado la huella genética. En todo caso, las instituciones públicas o privadas no especialmente acreditadas para el ingreso de información al Sistema, remitirán la huella genética al Servicio Médico Legal para que éste la incorpore en el Registro correspondiente. …"}]}, {"id": "M-23v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "No se incorpora al Registro de Víctimas la huella genética de la víctima que expresamente se opone a ello.", "f": "Art. 8 Ley 19.970. Quien toma la muestra debe consignar que corresponde a una víctima.", "g": "N", "r": 1, "grp": "8|Ley 19.970", "x": [{"c": "Art. 8 Ley 19.970", "t": "Artículo 8º.- Registro de Víctimas. El Registro de Víctimas contendrá las huellas genéticas de las víctimas de un delito, determinadas en el curso de un procedimiento criminal. En todo caso, no se incorporará al Registro la huella genética de la víctima que expresamente se opusiere a ello. Para tal efecto, quien tome la muestra biológica consignará el hecho de corresponder a una víctima. El Servicio Médico Legal o, en su caso, la institución especialmente acreditada que hubiere determinado la huella genética, se abstendrán de incorporarla en el Registro hasta recibir tal instrucción del Ministerio Público, el que previamente consultará a la víctima, informándola acerca de su derecho. Las huellas agregadas a este Registro serán eliminadas en la forma prevista en el artículo 18."}]}, {"id": "M-23f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La huella genética de la víctima se incorpora al Registro de Víctimas aun contra su oposición expresa.", "f": "Art. 8 Ley 19.970. Quien toma la muestra debe consignar que corresponde a una víctima.", "g": "N", "r": 0, "grp": "8|Ley 19.970", "x": [{"c": "Art. 8 Ley 19.970", "t": "Artículo 8º.- Registro de Víctimas. El Registro de Víctimas contendrá las huellas genéticas de las víctimas de un delito, determinadas en el curso de un procedimiento criminal. En todo caso, no se incorporará al Registro la huella genética de la víctima que expresamente se opusiere a ello. Para tal efecto, quien tome la muestra biológica consignará el hecho de corresponder a una víctima. El Servicio Médico Legal o, en su caso, la institución especialmente acreditada que hubiere determinado la huella genética, se abstendrán de incorporarla en el Registro hasta recibir tal instrucción del Ministerio Público, el que previamente consultará a la víctima, informándola acerca de su derecho. Las huellas agregadas a este Registro serán eliminadas en la forma prevista en el artículo 18."}]}, {"id": "M-24", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Comunicado el término del procedimiento, el Servicio de Registro Civil e Identificación debe eliminar las huellas de los Registros de Imputados y de Víctimas en un plazo no superior a:", "f": "Art. 18 Ley 19.970. Las huellas de imputados y víctimas se eliminan una vez terminado el procedimiento; si hubo juicio, desde la resolución ejecutoriada.", "g": "N", "i": [], "a": ["Veinticuatro horas", "Treinta días", "Tres días", "Diez días"], "r": 2, "grp": "18|Ley 19.970", "x": [{"c": "Art. 18 Ley 19.970", "t": "… Las huellas genéticas contenidas en los Registros de Imputados y de Víctimas, serán eliminadas una vez que se hubiere puesto término al procedimiento criminal respectivo. Si hubo juicio, procederá la eliminación desde que se falló por resolución ejecutoriada, sin perjuicio de lo previsto en el inciso primero del artículo precedente. El Servicio de Registro Civil e Identificación deberá proceder a la eliminación o reingreso a que se refiere el inciso precedente en un plazo no superior a tres días, contado desde que le fuere comunicado el término del procedimiento por el fiscal. Dicha comunicación se efectuará por cualquier medio idóneo que permita dejar constancia fehaciente de su despacho y recepción. Igualmente procederá el Servicio de Registro Civil e Identificación a solicitud de la víctima o del imputado, cuando éstos acreditaren el término del procedimiento, mediante certificación expedida por el fiscal o el tribunal respectivo. …"}]}, {"id": "M-25v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El Registro de Evidencias y Antecedentes conserva las huellas genéticas obtenidas en una investigación criminal que corresponden a personas no identificadas.", "f": "Art. 7 Ley 19.970. Es el registro de los rastros hallados cuya fuente aún no se identifica.", "g": "N", "r": 1, "grp": "7|Ley 19.970", "x": [{"c": "Art. 7 Ley 19.970", "t": "Artículo 7º.- Registro de Evidencias y Antecedentes. En el Registro de Evidencias y Antecedentes se conservarán las huellas genéticas que hubieren sido obtenidas en el curso de una investigación criminal y que correspondieren a personas no identificadas."}]}, {"id": "M-25f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El Registro de Evidencias y Antecedentes conserva las huellas genéticas de los testigos de una investigación criminal.", "f": "Art. 7 Ley 19.970. Es el registro de los rastros hallados cuya fuente aún no se identifica.", "g": "N", "r": 0, "grp": "7|Ley 19.970", "x": [{"c": "Art. 7 Ley 19.970", "t": "Artículo 7º.- Registro de Evidencias y Antecedentes. En el Registro de Evidencias y Antecedentes se conservarán las huellas genéticas que hubieren sido obtenidas en el curso de una investigación criminal y que correspondieren a personas no identificadas."}]}, {"id": "M-26", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los tribunales de juicio oral en lo penal funcionan en una o más salas integradas por:", "f": "Art. 17 COT. Cada sala es dirigida por un juez presidente de sala; pueden integrarla además jueces alternos sólo para subrogar.", "g": "N", "i": [], "a": ["Dos de sus miembros", "Un juez presidente y dos abogados integrantes", "Tres de sus miembros", "Cinco de sus miembros"], "r": 2, "grp": "17|COT", "x": [{"c": "Art. 17 COT", "t": "Art. 17. Los tribunales de juicio oral en lo penal funcionarán en una o más salas integradas por tres de sus miembros. Cada sala será dirigida por un juez presidente de sala, quien tendrá las atribuciones a que alude el artículo 92 y las demás de orden que la ley procesal penal indique. Sin perjuicio de lo anterior, podrán integrar también cada sala otros jueces en calidad de alternos, con el solo propósito de subrogar, si fuere necesario, a los miembros que se vieren impedidos de continuar participando en el desarrollo del juicio oral, en los términos que contemplan los artículos 76, inciso final, y 281, inciso quinto, del Código Procesal Penal. …"}]}, {"id": "M-27", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "¿Cuál de las siguientes NO es una atribución de los jueces de garantía conforme al artículo 14 del Código Orgánico de Tribunales?", "f": "Art. 14 COT. Conocer y juzgar las causas por crimen o simple delito en juicio oral corresponde al tribunal de juicio oral en lo penal (art. 18 COT).", "g": "N", "i": [], "a": ["Hacer ejecutar las condenas criminales y las medidas de seguridad", "Conocer y fallar las faltas penales", "Dictar sentencia en el procedimiento abreviado", "Conocer y juzgar las causas por crimen en juicio oral"], "r": 3, "grp": "14|COT", "x": [{"c": "Art. 14 COT", "t": "… Los juzgados de garantía estarán conformados por uno o más jueces con competencia en un mismo territorio jurisdiccional, que actúan y resuelven unipersonalmente los asuntos sometidos a su conocimiento. Corresponderá a los jueces de garantía: a) Asegurar los derechos del imputado y demás intervinientes en el proceso penal, de acuerdo a la ley procesal penal; b) Dirigir personalmente las audiencias que procedan, de conformidad a la ley procesal penal; c) Dictar sentencia, cuando corresponda, en el procedimiento abreviado que contemple la ley procesal penal; d) Conocer y fallar las faltas penales de conformidad con el procedimiento contenido en la ley procesal penal; e) Conocer y fallar, conforme a los procedimientos regulados en el Título I del Libro IV del Código Procesal Penal, las faltas e infracciones contempladas en la Ley de Alcoholes, cualquiera sea la pena que ella les asigne; …"}, {"c": "Art. 18 COT", "t": "Art. 18. Corresponderá a los tribunales de juicio oral en lo penal: a) Conocer y juzgar las causas por crimen o simple delito, salvo aquellas relativas a simples delitos cuyo conocimiento y fallo corresponda a un juez de garantía; b) Resolver, en su caso, sobre la libertad o prisión preventiva de los acusados puestos a su disposición; c) Resolver todos los incidentes que se promuevan durante el juicio oral; d) Conocer y resolver todas las cuestiones y asuntos que la ley de responsabilidad penal juvenil les encomienden, y e) Conocer y resolver los demás asuntos que la ley y procesal penal y la ley que establece disposiciones especiales sobre el Sistema de Justicia Militar les encomiende."}]}, {"id": "M-28v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Sólo pueden concurrir a las decisiones del tribunal de juicio oral en lo penal los jueces que hubieren asistido a la totalidad de la audiencia del juicio oral.", "f": "Art. 19 COT. Es la expresión orgánica del principio de inmediación.", "g": "N", "r": 1, "grp": "19|COT", "x": [{"c": "Art. 19 COT", "t": "… Las decisiones de los tribunales de juicio oral en lo penal se regirán, en lo que no resulte contrario a las normas de este párrafo, por las reglas sobre acuerdos en las Cortes de Apelaciones contenidas en los artículos 72, 81, 83, 84 y 89 de este Código. Sólo podrán concurrir a las decisiones del tribunal los jueces que hubieren asistido a la totalidad de la audiencia del juicio oral. La decisión deberá ser adoptada por la mayoría de los miembros de la sala. Cuando existiere dispersión de votos en relación con una decisión, la sentencia o la determinación de la pena si aquélla fuere condenatoria, el juez que sostuviere la opinión más desfavorable al condenado deberá optar por alguna de las otras. …"}]}, {"id": "M-28f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Pueden concurrir a las decisiones del tribunal de juicio oral en lo penal los jueces que hubieren asistido a la mayor parte de la audiencia del juicio oral.", "f": "Art. 19 COT. Es la expresión orgánica del principio de inmediación.", "g": "N", "r": 0, "grp": "19|COT", "x": [{"c": "Art. 19 COT", "t": "… Las decisiones de los tribunales de juicio oral en lo penal se regirán, en lo que no resulte contrario a las normas de este párrafo, por las reglas sobre acuerdos en las Cortes de Apelaciones contenidas en los artículos 72, 81, 83, 84 y 89 de este Código. Sólo podrán concurrir a las decisiones del tribunal los jueces que hubieren asistido a la totalidad de la audiencia del juicio oral. La decisión deberá ser adoptada por la mayoría de los miembros de la sala. Cuando existiere dispersión de votos en relación con una decisión, la sentencia o la determinación de la pena si aquélla fuere condenatoria, el juez que sostuviere la opinión más desfavorable al condenado deberá optar por alguna de las otras. …"}]}, {"id": "M-30v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Corresponde a los tribunales de juicio oral en lo penal resolver todos los incidentes que se promuevan durante el juicio oral.", "f": "Art. 18 COT. También les corresponde conocer y juzgar las causas por crimen o simple delito y resolver sobre la libertad o prisión preventiva de los acusados puestos a su disposición.", "g": "N", "r": 1, "grp": "18|COT", "x": [{"c": "Art. 18 COT", "t": "Art. 18. Corresponderá a los tribunales de juicio oral en lo penal: a) Conocer y juzgar las causas por crimen o simple delito, salvo aquellas relativas a simples delitos cuyo conocimiento y fallo corresponda a un juez de garantía; b) Resolver, en su caso, sobre la libertad o prisión preventiva de los acusados puestos a su disposición; c) Resolver todos los incidentes que se promuevan durante el juicio oral; d) Conocer y resolver todas las cuestiones y asuntos que la ley de responsabilidad penal juvenil les encomienden, y e) Conocer y resolver los demás asuntos que la ley y procesal penal y la ley que establece disposiciones especiales sobre el Sistema de Justicia Militar les encomiende."}]}, {"id": "M-30f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los incidentes que se promuevan durante el juicio oral son resueltos por el juez de garantía que dictó el auto de apertura.", "f": "Art. 18 COT. También les corresponde conocer y juzgar las causas por crimen o simple delito y resolver sobre la libertad o prisión preventiva de los acusados puestos a su disposición.", "g": "N", "r": 0, "grp": "18|COT", "x": [{"c": "Art. 18 COT", "t": "Art. 18. Corresponderá a los tribunales de juicio oral en lo penal: a) Conocer y juzgar las causas por crimen o simple delito, salvo aquellas relativas a simples delitos cuyo conocimiento y fallo corresponda a un juez de garantía; b) Resolver, en su caso, sobre la libertad o prisión preventiva de los acusados puestos a su disposición; c) Resolver todos los incidentes que se promuevan durante el juicio oral; d) Conocer y resolver todas las cuestiones y asuntos que la ley de responsabilidad penal juvenil les encomienden, y e) Conocer y resolver los demás asuntos que la ley y procesal penal y la ley que establece disposiciones especiales sobre el Sistema de Justicia Militar les encomiende."}]}, {"id": "M-31", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Las contiendas de competencia entre tribunales ordinarios y militares son resueltas por:", "f": "Art. 3 Ley 20.477. Regla de la Ley 20.477.", "g": "N", "i": [], "a": ["La Corte Marcial", "La Corte Suprema, sin la integración del Auditor General del Ejército", "La Corte Suprema, integrada por el Auditor General del Ejército", "La Corte de Apelaciones respectiva"], "r": 1, "grp": "3|Ley 20.477", "x": [{"c": "Art. 3 Ley 20.477", "t": "Artículo 3°.- Contiendas de competencia. En el caso de contiendas de competencias entre tribunales ordinarios y militares, la cuestión deberá ser resuelta por la Corte Suprema, sin la integración del Auditor General del Ejército o quien deba subrogarlo. Artículo 3°.- El Tribunal Militar deberá comunicar al Tribunal que corresponda, la individualización completa del procesado y su defensor, copias del auto de procesamiento, y la indicación de si estuviere sometido a prisión preventiva o afecto a alguna otra medida cautelar personal o real. Recibidos los antecedentes por el Tribunal de Garantía, se radicará la competencia en dicho Tribunal. Este Tribunal deberá oficiar, dentro de las veinticuatro horas siguientes, a la Fiscalía Regional del Ministerio Público, acompañando copia íntegra de todos los antecedentes correspondientes a tal investigación."}]}, {"id": "M-32v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "En los casos de coautoría y coparticipación de civiles y militares en delitos sujetos a la justicia militar, son competentes la justicia ordinaria respecto de los civiles y los tribunales militares respecto de los militares.", "f": "Art. 2 Ley 20.477. Se divide la competencia según la calidad del imputado.", "g": "N", "r": 1, "grp": "2|Ley 20.477", "x": [{"c": "Art. 2 Ley 20.477", "t": "Artículo 2º.- Tribunal competente en casos de coautoría y coparticipación. En los casos de coautoría y coparticipación de civiles y militares en la comisión de aquellos delitos sujetos a la justicia militar de acuerdo a las normas del Código de Justicia Militar, serán competentes, respecto de los civiles, la Justicia Ordinaria y, respecto de los militares, los Tribunales Militares. Artículo 2°.- La remisión de los antecedentes del proceso a la justicia ordinaria se hará en un plazo no superior a los sesenta días de entrada en vigencia de la presente ley. En los procesos que se sustancien exclusivamente contra civiles, se remitirá íntegramente el expediente con todos sus anexos. En los procesos que se sustancien contra civiles y militares, se enviarán compulsas autorizadas del expediente principal y de todos sus anexos, manteniendo el original en la Jurisdicción Castrense para el juzgamiento del militar."}]}, {"id": "M-32f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "En los casos de coautoría y coparticipación de civiles y militares en delitos sujetos a la justicia militar, todos son juzgados por los tribunales militares.", "f": "Art. 2 Ley 20.477. Se divide la competencia según la calidad del imputado.", "g": "N", "r": 0, "grp": "2|Ley 20.477", "x": [{"c": "Art. 2 Ley 20.477", "t": "Artículo 2º.- Tribunal competente en casos de coautoría y coparticipación. En los casos de coautoría y coparticipación de civiles y militares en la comisión de aquellos delitos sujetos a la justicia militar de acuerdo a las normas del Código de Justicia Militar, serán competentes, respecto de los civiles, la Justicia Ordinaria y, respecto de los militares, los Tribunales Militares. Artículo 2°.- La remisión de los antecedentes del proceso a la justicia ordinaria se hará en un plazo no superior a los sesenta días de entrada en vigencia de la presente ley. En los procesos que se sustancien exclusivamente contra civiles, se remitirá íntegramente el expediente con todos sus anexos. En los procesos que se sustancien contra civiles y militares, se enviarán compulsas autorizadas del expediente principal y de todos sus anexos, manteniendo el original en la Jurisdicción Castrense para el juzgamiento del militar."}]}, {"id": "M-33", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El que mata a un carabinero en razón de su cargo o con motivo u ocasión del ejercicio de sus funciones es castigado, en la figura base, con:", "f": "Art. 416 CJM. Presidio perpetuo a perpetuo calificado es la pena de la figura agravada del inciso segundo (precio o recompensa, entre otras circunstancias).", "g": "N", "i": [], "a": ["Presidio mayor en su grado máximo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo", "Presidio perpetuo a presidio perpetuo calificado", "Presidio mayor en su grado medio a presidio perpetuo"], "r": 0, "grp": "416|CJM", "x": [{"c": "Art. 416 CJM", "t": "Artículo 416.- El que matare a un carabinero en razón de su cargo o con motivo u ocasión del ejercicio de sus funciones será castigado con la pena de presidio mayor en su grado máximo a presidio perpetuo calificado. La conducta establecida en el inciso anterior será Art. castigada con presidio perpetuo a presidio perpetuo calificado si concurre alguna de las circunstancias siguientes: a) Si se comete mediante precio, recompensa o promesa, o cualquier otro tipo de beneficio para sí o para un tercero. b) Si se ejecuta con auxilio de gente armada o de personas que aseguren o proporcionen impunidad. c) Si el imputado actúa con su rostro cubierto con el objeto de ocultar su identidad."}]}, {"id": "M-34", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Las lesiones a un carabinero que le producen enfermedad o incapacidad para el trabajo por más de treinta días se castigan con:", "f": "Art. 416 bis CJM. N° 1 (demente, inútil para el trabajo, etc.): presidio mayor en su grado medio a máximo. N° 2: presidio mayor en su grado mínimo. N° 3 (menos graves): presidio menor en grado medio a máximo.", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio menor en grado medio a máximo", "Presidio mayor en su grado medio a máximo", "Presidio mayor en su grado mínimo"], "r": 3, "grp": "416 bis|CJM", "x": [{"c": "Art. 416 bis CJM", "t": "Artículo 416 bis.- El que hiriere, golpeare o maltratare de obra a un carabinero en razón de su cargo o con motivo u ocasión del ejercicio de sus funciones, será castigado: 1º. Con la pena de presidio mayor en su grado medio a Art. máximo, si de resultas de las lesiones quedare el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. 2º. Con presidio mayor en su grado mínimo, si las lesiones produjeren al ofendido enfermedad o incapacidad para el trabajo por más de treinta días. 3º. Con presidio menor en grado medio a máximo, si le causare lesiones menos graves. 4º. Con presidio menor en su grado mínimo si le ocasionare lesiones leves."}]}, {"id": "M-35v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las amenazas de los artículos 296 y 297 del Código Penal proferidas contra un integrante de Carabineros, con conocimiento de su calidad, se castigan con presidio menor en su grado mínimo a medio.", "f": "Art. 417 CJM. Exige conocimiento de la calidad de miembro de la institución.", "g": "N", "r": 1, "grp": "417|CJM", "x": [{"c": "Art. 417 CJM", "t": "Artículo 417.- El que amenazare en los términos de los artículos 296 y 297 del Código Penal a uno de los integrantes de Carabineros de Chile con conocimiento de su calidad de miembro de esa Institución, unidades o reparticiones, sufrirá la pena de presidio menor en su grado mínimo a medio."}]}, {"id": "M-35f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las amenazas de los artículos 296 y 297 del Código Penal proferidas contra un integrante de Carabineros, con conocimiento de su calidad, se castigan con presidio menor en su grado máximo.", "f": "Art. 417 CJM. Exige conocimiento de la calidad de miembro de la institución.", "g": "N", "r": 0, "grp": "417|CJM", "x": [{"c": "Art. 417 CJM", "t": "Artículo 417.- El que amenazare en los términos de los artículos 296 y 297 del Código Penal a uno de los integrantes de Carabineros de Chile con conocimiento de su calidad de miembro de esa Institución, unidades o reparticiones, sufrirá la pena de presidio menor en su grado mínimo a medio."}]}, {"id": "M-36", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El que mata a un miembro de Gendarmería de Chile durante el desempeño de sus funciones o en razón de ellas es castigado con:", "f": "Art. 15 A DL 2.859 (Ley 20.214). La Ley 20.214 agregó los arts. 15 A a 15 D a la Ley Orgánica de Gendarmería.", "g": "N", "i": [], "a": ["Presidio mayor en su grado medio a máximo", "Presidio perpetuo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo"], "r": 2, "grp": "15 A|DL 2.859 (Ley 20.214)", "x": [{"c": "DL 2.859 (Ley 20.214), art. 15 A", "t": "… \"Artículo único.- Agréganse en el decreto ley N° 2.859, de 1979, que aprobó la Ley Orgánica de Gendarmería de Chile, a continuación del artículo 15, los siguientes artículos 15 A, 15 B, 15 C y 15 D: \"Artículo 15 A.- El que matare a un miembro de Gendarmería de Chile durante el desempeño de sus funciones o en razón de ellas, será castigado con la pena de presidio mayor en su grado máximo a presidio perpetuo calificado. Artículo 15 B.- El que hiriere, golpeare o maltratare de obra a un miembro de Gendarmería de Chile durante el desempeño de sus funciones o en razón de ellas, será castigado: 1. Con la pena de presidio mayor en su grado medio, si del resultado de las lesiones quedare el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. …"}]}, {"id": "M-37v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las penas de los artículos 395 y 396 del Código Penal se aumentan en un grado cuando esos delitos se cometen contra un funcionario de Gendarmería en el desempeño de sus funciones o en razón de ellas.", "f": "Art. 15 C DL 2.859 (Ley 20.214). Se trata de la castración y las mutilaciones.", "g": "N", "r": 1, "grp": "15 C|DL 2.859 (Ley 20.214)", "x": [{"c": "DL 2.859 (Ley 20.214), art. 15 C", "t": "… más de treinta días. 3. Con presidio menor en su grado medio a máximo, si le causare lesiones menos graves. 4. Con presidio menor en su grado mínimo, o multa de seis a once unidades tributarias mensuales, si le ocasionare lesiones leves. Artículo 15 C.- Las penas establecidas en los artículos 395 y 396 del Código Penal, serán aumentadas en un grado cuando los delitos que estos preceptos establecen se cometan contra un funcionario de Gendarmería de Chile que se encontrare en el desempeño de sus funciones o en razón de ellas. Artículo 15 D.- El que amenazare a un miembro de Gendarmería de Chile en los términos de los artículos 296 y 297 del Código Penal durante el desempeño de sus funciones o en razón de ellas, será castigado con el grado máximo de las penas previstas en dichos artículos para los distintos tipos …"}]}, {"id": "M-37f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las penas de los artículos 395 y 396 del Código Penal se aumentan en dos grados cuando esos delitos se cometen contra un funcionario de Gendarmería en el desempeño de sus funciones o en razón de ellas.", "f": "Art. 15 C DL 2.859 (Ley 20.214). Se trata de la castración y las mutilaciones.", "g": "N", "r": 0, "grp": "15 C|DL 2.859 (Ley 20.214)", "x": [{"c": "DL 2.859 (Ley 20.214), art. 15 C", "t": "… más de treinta días. 3. Con presidio menor en su grado medio a máximo, si le causare lesiones menos graves. 4. Con presidio menor en su grado mínimo, o multa de seis a once unidades tributarias mensuales, si le ocasionare lesiones leves. Artículo 15 C.- Las penas establecidas en los artículos 395 y 396 del Código Penal, serán aumentadas en un grado cuando los delitos que estos preceptos establecen se cometan contra un funcionario de Gendarmería de Chile que se encontrare en el desempeño de sus funciones o en razón de ellas. Artículo 15 D.- El que amenazare a un miembro de Gendarmería de Chile en los términos de los artículos 296 y 297 del Código Penal durante el desempeño de sus funciones o en razón de ellas, será castigado con el grado máximo de las penas previstas en dichos artículos para los distintos tipos …"}]}, {"id": "M-38", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional es designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por:", "f": "Art. 85 CPR. Si el Senado no aprueba la proposición, la Corte Suprema completa la quina con un nuevo nombre y el procedimiento se repite.", "g": "N", "i": [], "a": ["La mayoría de los miembros presentes", "Los dos tercios de sus miembros en ejercicio", "Los tres quintos de sus miembros en ejercicio", "La mayoría absoluta de sus miembros en ejercicio"], "r": 1, "grp": "85|CPR", "x": [{"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}]}, {"id": "M-39v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Ministerio Público en caso alguno puede ejercer funciones jurisdiccionales.", "f": "Art. 83 CPR. Dirige en forma exclusiva la investigación, ejerce la acción penal pública y protege a víctimas y testigos, pero no juzga.", "g": "N", "r": 1, "grp": "83|CPR", "x": [{"c": "Art. 83 CPR", "t": "Artículo 83.- Un organismo autónomo, jerarquizado, con el nombre de Ministerio Público, dirigirá en forma exclusiva la investigación de los hechos constitutivos de delito, los que determinen la participación punible y los que acrediten la inocencia del imputado y, en su caso, ejercerá la acción penal pública en la forma prevista por la ley. De igual manera, le corresponderá la adopción de medidas para proteger a las víctimas y a los testigos. En caso alguno podrá ejercer funciones jurisdiccionales. El ofendido por el delito y las demás personas que 24.10.1980 determine la ley podrán ejercer igualmente la acción penal. El Ministerio Público podrá impartir órdenes Nº7 directas a las Fuerzas de Orden y Seguridad durante la investigación. …"}]}, {"id": "M-39f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Ministerio Público puede ejercer funciones jurisdiccionales en los casos que la ley orgánica constitucional determine.", "f": "Art. 83 CPR. Dirige en forma exclusiva la investigación, ejerce la acción penal pública y protege a víctimas y testigos, pero no juzga.", "g": "N", "r": 0, "grp": "83|CPR", "x": [{"c": "Art. 83 CPR", "t": "Artículo 83.- Un organismo autónomo, jerarquizado, con el nombre de Ministerio Público, dirigirá en forma exclusiva la investigación de los hechos constitutivos de delito, los que determinen la participación punible y los que acrediten la inocencia del imputado y, en su caso, ejercerá la acción penal pública en la forma prevista por la ley. De igual manera, le corresponderá la adopción de medidas para proteger a las víctimas y a los testigos. En caso alguno podrá ejercer funciones jurisdiccionales. El ofendido por el delito y las demás personas que 24.10.1980 determine la ley podrán ejercer igualmente la acción penal. El Ministerio Público podrá impartir órdenes Nº7 directas a las Fuerzas de Orden y Seguridad durante la investigación. …"}]}, {"id": "M-40", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Las actuaciones del Ministerio Público que priven al imputado o a terceros del ejercicio de derechos asegurados por la Constitución, o lo restrinjan o perturben, requieren:", "f": "Art. 83 CPR. La autoridad requerida debe cumplir las órdenes del Ministerio Público sin calificar su fundamento, salvo exhibir la autorización judicial previa cuando proceda.", "g": "N", "i": [], "a": ["Autorización del Fiscal Regional", "Aprobación judicial previa", "Acuerdo del afectado", "Comunicación posterior al juez de garantía"], "r": 1, "grp": "83|CPR", "x": [{"c": "Art. 83 CPR", "t": "… El ofendido por el delito y las demás personas que 24.10.1980 determine la ley podrán ejercer igualmente la acción penal. El Ministerio Público podrá impartir órdenes Nº7 directas a las Fuerzas de Orden y Seguridad durante la investigación. Sin embargo, las actuaciones que priven al imputado o a terceros del ejercicio de los derechos que esta Constitución asegura, o lo restrinjan o perturben, requerirán de aprobación judicial previa. La autoridad requerida deberá cumplir sin más trámite dichas órdenes y no podrá calificar su fundamento, oportunidad, justicia o legalidad, salvo requerir la exhibición de la autorización judicial previa, en su caso. El ejercicio de la acción penal pública, y la dirección de las investigaciones de los hechos que configuren el delito, de los que determinen la participación punible y de los que acrediten la inocencia del imputado en las causas que sean de conocimiento …"}]}, {"id": "M-41v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "El Fiscal Nacional tiene la superintendencia directiva, correccional y económica del Ministerio Público.", "f": "Art. 91 CPR. El Ministerio Público es autónomo: no está sujeto a la superintendencia de la Corte Suprema.", "g": "N", "r": 1, "grp": "91|CPR", "x": [{"c": "Art. 91 CPR", "t": "Artículo 91.- El Fiscal Nacional tendrá la superintendencia directiva, correccional y económica del Ministerio Público, en conformidad a la ley orgánica constitucional respectiva. Capítulo VIII TRIBUNAL CONSTITUCIONAL LEY N° 20.050 Art."}]}, {"id": "M-41f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "La Corte Suprema tiene la superintendencia directiva, correccional y económica del Ministerio Público.", "f": "Art. 91 CPR. El Ministerio Público es autónomo: no está sujeto a la superintendencia de la Corte Suprema.", "g": "N", "r": 0, "grp": "91|CPR", "x": [{"c": "Art. 91 CPR", "t": "Artículo 91.- El Fiscal Nacional tendrá la superintendencia directiva, correccional y económica del Ministerio Público, en conformidad a la ley orgánica constitucional respectiva. Capítulo VIII TRIBUNAL CONSTITUCIONAL LEY N° 20.050 Art."}]}, {"id": "M-42v", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales regionales son nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región.", "f": "Art. 86 CPR. Si en la región hay más de una Corte de Apelaciones, la terna se forma en pleno conjunto.", "g": "N", "r": 1, "grp": "86|CPR", "x": [{"c": "Art. 86 CPR", "t": "Artículo 86.- Existirá un Fiscal Regional en cada una de las regiones en que se divida administrativamente el país, a menos que la población o la extensión geográfica de la región hagan necesario nombrar más de uno. Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. En caso que en la región exista más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la Corte de más antigua creación. Los fiscales regionales deberán tener a lo menos cinco años de título de abogado, haber cumplido 30 años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; …"}]}, {"id": "M-42f", "o": "Preguntas nuevas", "t": "vf", "m": "PB", "e": "Los fiscales regionales son nombrados por el Fiscal Nacional, a propuesta en terna de la Corte Suprema.", "f": "Art. 86 CPR. Si en la región hay más de una Corte de Apelaciones, la terna se forma en pleno conjunto.", "g": "N", "r": 0, "grp": "86|CPR", "x": [{"c": "Art. 86 CPR", "t": "Artículo 86.- Existirá un Fiscal Regional en cada una de las regiones en que se divida administrativamente el país, a menos que la población o la extensión geográfica de la región hagan necesario nombrar más de uno. Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. En caso que en la región exista más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la Corte de más antigua creación. Los fiscales regionales deberán tener a lo menos cinco años de título de abogado, haber cumplido 30 años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; …"}]}, {"id": "M-43", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El cultivo no autorizado de especies vegetales del género cannabis u otras productoras de drogas se castiga con:", "f": "Art. 8 Ley 20.000. No se sanciona si se justifica que están destinadas al uso o consumo personal exclusivo y próximo en el tiempo, caso en que se aplican los arts. 50 y siguientes.", "g": "N", "i": [], "a": ["Presidio mayor en sus grados mínimo a medio y multa de cuarenta a cuatrocientas UTM", "Presidio menor en sus grados medio a máximo y multa de diez a cuarenta UTM", "Presidio menor en su grado medio y multa de diez a cien UTM", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo y multa de cuarenta a cuatrocientas UTM"], "r": 3, "grp": "8|Ley 20.000", "x": [{"c": "Art. 8 Ley 20.000", "t": "Artículo 8º.- El que, careciendo de la debida autorización, siembre, plante, cultive o coseche especies vegetales del género cannabis u otras productoras de sustancias estupefacientes o sicotrópicas, incurrirá en la pena de presidio menor en su grado máximo a presidio mayor en su grado mínimo y multa de cuarenta a cuatrocientas unidades tributarias mensuales, a menos que justifique que están destinadas a su uso o consumo personal exclusivo y próximo en el tiempo, caso en el cual sólo se aplicarán las sanciones de los artículos 50 y siguientes. Se entenderá justificado el cultivo de especies vegetales del género cannabis para la atención de un tratamiento médico, con la presentación de la receta extendida para ese efecto por un médico cirujano tratante, la que deberá indicar el diagnóstico de la enfermedad, su tratamiento y duración, además de la forma de administración del cannabis, la que no …"}]}, {"id": "M-44v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El Ministerio Público puede autorizar que los envíos ilícitos de drogas se trasladen, guarden, intercepten o circulen bajo la técnica de entregas vigiladas o controladas.", "f": "Art. 23 Ley 20.000. Es una técnica que autoriza el propio Ministerio Público para individualizar a los partícipes y establecer el plan delictivo.", "g": "N", "r": 1, "grp": "23|Ley 20.000", "x": [{"c": "Art. 23 Ley 20.000", "t": "… las sustancias por las que se hayan sustituido, total o parcialmente, las anteriormente mencionadas, los instrumentos que hubieren servido o pudieren servir para la comisión de alguno de los delitos sancionados en esta ley y los efectos de tales delitos, se trasladen, guarden, intercepten o circulen dentro del territorio nacional, salgan de él o entren en él, bajo la vigilancia o el control de la autoridad correspondiente, con el propósito de individualizar a las personas que participen en la ejecución de tales hechos, conocer sus planes, evitar el uso ilícito de las especies referidas o prevenir y comprobar cualquiera de tales delitos. Se utilizará esta técnica de investigación cuando se presuma fundadamente que ella facilitará la individualización de otros partícipes, sea en el país o en el extranjero, como, asimismo, el cumplimiento de alguno de los fines descritos en el inciso anterior. …"}]}, {"id": "M-44f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las entregas vigiladas o controladas de drogas requieren siempre autorización previa del juez de garantía.", "f": "Art. 23 Ley 20.000. Es una técnica que autoriza el propio Ministerio Público para individualizar a los partícipes y establecer el plan delictivo.", "g": "N", "r": 0, "grp": "23|Ley 20.000", "x": [{"c": "Art. 23 Ley 20.000", "t": "… las sustancias por las que se hayan sustituido, total o parcialmente, las anteriormente mencionadas, los instrumentos que hubieren servido o pudieren servir para la comisión de alguno de los delitos sancionados en esta ley y los efectos de tales delitos, se trasladen, guarden, intercepten o circulen dentro del territorio nacional, salgan de él o entren en él, bajo la vigilancia o el control de la autoridad correspondiente, con el propósito de individualizar a las personas que participen en la ejecución de tales hechos, conocer sus planes, evitar el uso ilícito de las especies referidas o prevenir y comprobar cualquiera de tales delitos. Se utilizará esta técnica de investigación cuando se presuma fundadamente que ella facilitará la individualización de otros partícipes, sea en el país o en el extranjero, como, asimismo, el cumplimiento de alguno de los fines descritos en el inciso anterior. …"}]}, {"id": "M-45v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El Ministerio Público puede autorizar a funcionarios policiales para que se desempeñen como agentes encubiertos o agentes reveladores.", "f": "Art. 25 Ley 20.000. También puede autorizar, a propuesta policial, que determinados informantes actúen en alguna de esas calidades.", "g": "N", "r": 1, "grp": "25|Ley 20.000", "x": [{"c": "Art. 25 Ley 20.000", "t": "Artículo 25.- El Ministerio Público podrá autorizar a funcionarios policiales para que se desempeñen como agentes encubiertos o agentes reveladores y, a propuesta de dichos funcionarios, para que determinados informantes de esos Servicios actúen en alguna de las dos calidades anteriores. Agente encubierto es el funcionario policial que oculta su identidad oficial y se involucra o introduce en las organizaciones delictuales o en meras asociaciones o agrupaciones con propósitos delictivos, con el objetivo de identificar a los participantes, reunir información y recoger antecedentes necesarios para la investigación. El agente encubierto podrá tener una historia ficticia. La Dirección Nacional del Servicio de Registro Civil e Identificación deberá otorgar los medios necesarios para la oportuna y debida materialización de ésta. …"}]}, {"id": "M-45f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Sólo el juez de garantía puede autorizar a funcionarios policiales para que se desempeñen como agentes encubiertos.", "f": "Art. 25 Ley 20.000. También puede autorizar, a propuesta policial, que determinados informantes actúen en alguna de esas calidades.", "g": "N", "r": 0, "grp": "25|Ley 20.000", "x": [{"c": "Art. 25 Ley 20.000", "t": "Artículo 25.- El Ministerio Público podrá autorizar a funcionarios policiales para que se desempeñen como agentes encubiertos o agentes reveladores y, a propuesta de dichos funcionarios, para que determinados informantes de esos Servicios actúen en alguna de las dos calidades anteriores. Agente encubierto es el funcionario policial que oculta su identidad oficial y se involucra o introduce en las organizaciones delictuales o en meras asociaciones o agrupaciones con propósitos delictivos, con el objetivo de identificar a los participantes, reunir información y recoger antecedentes necesarios para la investigación. El agente encubierto podrá tener una historia ficticia. La Dirección Nacional del Servicio de Registro Civil e Identificación deberá otorgar los medios necesarios para la oportuna y debida materialización de ésta. …"}]}, {"id": "M-46", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La posesión, tenencia o porte de municiones o cartuchos sin autorización se sanciona con:", "f": "Art. 9 Ley 17.798. El inciso primero castiga las armas de fuego con presidio menor en su grado máximo; el inciso segundo, las municiones con presidio menor en su grado medio.", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Multa de once a cincuenta y siete UTM", "Presidio menor en su grado medio", "Presidio menor en su grado mínimo"], "r": 2, "grp": "9|Ley 17.798", "x": [{"c": "Art. 9 Ley 17.798", "t": "… en el artículo 5º, serán sancionados con presidio menor en su grado máximo. Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras c) y e) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado medio. Si el infractor tuviere algún permiso de los establecidos en el artículo 4 y en el reglamento de esta ley para los elementos señalados en los literales b) y c) del artículo 2, pero diferente a aquel cuya falta se sanciona en los incisos anteriores, o no hubiesen transcurrido más de seis meses desde la pérdida de vigencia de cualquiera de ellos, el tribunal podrá prescindir de toda pena, sin perjuicio de las sanciones administrativas que correspondan. …"}]}, {"id": "M-47", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Si a consecuencia de la conducción en estado de ebriedad se causa la muerte, la pena privativa de libertad es:", "f": "Art. 196 Ley de Tránsito. Lesiones del art. 397 N° 1 CP: presidio menor en su grado máximo. Muerte: presidio menor en su grado máximo a presidio mayor en su grado mínimo, con multa, inhabilidad perpetua para conducir y comiso del vehículo.", "g": "N", "i": [], "a": ["Presidio mayor en su grado mínimo a medio", "Presidio menor en su grado máximo", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio menor en sus grados medio a máximo"], "r": 2, "grp": "196|Ley de Tránsito", "x": [{"c": "Art. 196 Ley de Tránsito", "t": "… graves. En caso de reincidencia, el juez deberá decretar la cancelación de la licencia. Si se causare alguna de las lesiones indicadas en el D.O 07.02.1984 número 1º del artículo 397 del Código Penal o la muerte de alguna persona, se impondrán las penas de presidio menor en su grado máximo, en el primer caso, y de presidio menor en su grado máximo a presidio mayor en su grado mínimo, en el segundo. En ambos casos, se aplicarán también las penas de multa de ocho a veinte unidades tributarias mensuales, de inhabilidad perpetua para conducir vehículos de tracción mecánica y el comiso del vehículo con que se ha cometido el delito, sin perjuicio de los derechos del tercero propietario, que podrá hacer valer conforme a las reglas generales del Código Procesal Penal. …"}, {"c": "Art. 397 CP", "t": "Art. 397. El que hiriere, golpeare o maltratare de obra a otro, será castigado como responsable de lesiones graves: 1.° Con la pena de presidio mayor en su grado mínimo, si de resultas de las lesiones queda el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. 2.° Con la de presidio menor en su grado medio, si las lesiones produjeren al ofendido enfermedad o incapacidad para el trabajo por más de treinta días."}]}, {"id": "M-48", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Se entiende que hay desempeño en estado de ebriedad cuando el informe o prueba arroja una dosificación de alcohol en la sangre:", "f": "Art. 111 Ley de Tránsito. Bajo la influencia del alcohol: superior a 0,3 e inferior a 0,8 gramos por mil. Estado de ebriedad: igual o superior a 0,8.", "g": "N", "i": [], "a": ["Superior a 0,5 gramos por mil", "Superior a 0,3 e inferior a 0,8 gramos por mil", "Igual o superior a 0,8 gramos por mil", "Igual o superior a 1,0 gramo por mil"], "r": 2, "grp": "111|Ley de Tránsito", "x": [{"c": "Art. 111 Ley de Tránsito", "t": "… de sus sentidos, como también el nivel de alcohol presente en el flujo sanguíneo, que conste en el informe de alcoholemia o en el resultado de la prueba respiratoria que hubiera sido practicada por Carabineros. Sin perjuicio de lo anterior, se entenderá que hay desempeño en estado de ebriedad cuando el informe o prueba arroje una dosificación igual o superior a 0,8 gramos por mil de alcohol en la sangre o en el organismo. Se entenderá que hay desempeño bajo la influencia del B alcohol cuando el informe o prueba arroje una dosificación superior a 0,3 e inferior a 0,8 gramos por mil de alcohol en la sangre. Si la dosificación fuere menor, se estará a lo establecido en el artículo 109 y en el Nº 1 del artículo 200, si correspondiere."}]}, {"id": "M-51", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La internación provisoria en un centro cerrado sólo procede tratándose de la imputación de conductas que, de ser cometidas por un mayor de dieciocho años, constituirían:", "f": "Art. 32 Ley 20.084. Además debe aplicarse sólo cuando los objetivos del art. 155 CPP no puedan alcanzarse con otra medida cautelar personal.", "g": "N", "i": [], "a": ["Cualquier delito de acción penal pública", "Delitos con pena aflictiva", "Crímenes", "Crímenes o simples delitos"], "r": 2, "grp": "32|Ley 20.084", "x": [{"c": "Art. 32 Ley 20.084", "t": "Artículo 32.- Medidas cautelares del procedimiento. La internación provisoria en un centro cerrado sólo será procedente tratándose de la imputación de las conductas que de ser cometidas por una persona mayor de dieciocho años constituirían crímenes, debiendo aplicarse cuando los objetivos señalados en el inciso primero del artículo 155 del Código Procesal Penal no pudieren ser alcanzados mediante la aplicación de alguna de las demás medidas cautelares personales. Se deberá levantar el informe técnico de que trata el artículo 37 bis respecto de todo imputado que permaneciere más de 15 días sujeto a internación provisoria o bajo sujeción a la vigilancia de una autoridad."}, {"c": "Art. 155 CPP", "t": "Artículo 155.- Enumeración y aplicación de otras medidas cautelares personales. Para garantizar el éxito de las diligencias de investigación o la seguridad de la sociedad, proteger al ofendido o asegurar la comparecencia del imputado a las actuaciones del procedimiento o ejecución de la sentencia, después de formalizada la investigación el tribunal, a petición del fiscal, del querellante o la víctima, podrá imponer al imputado una o más de las siguientes medidas: a) La privación de libertad, total o parcial, en su Art. casa o en la que el propio imputado señalare, si aquélla se encontrare fuera de la ciudad asiento del tribunal; b) La sujeción a la vigilancia de una persona o institución determinada, las que informarán periódicamente al juez; …"}]}, {"id": "M-52v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la sanción aplicable al adolescente, el tribunal parte de la pena inferior en un grado al mínimo de los señalados por la ley para el ilícito.", "f": "Art. 21 Ley 20.084. Sobre esa pena rebajada se aplican luego las reglas de determinación y la tabla del art. 23.", "g": "N", "r": 1, "grp": "21|Ley 20.084", "x": [{"c": "Art. 21 Ley 20.084", "t": "Artículo 21.- Reglas para la determinación de la pena de base. Para establecer la pena que servirá de base a la determinación de la que deba imponerse con arreglo a la presente ley, el tribunal deberá aplicar, a partir de la pena inferior en un grado al mínimo de los señalados por la ley para cada uno de los delitos correspondientes, las reglas previstas en los artículos 50 a 78 del Código Penal que resulten aplicables, con excepción de lo dispuesto en el artículo 69 de dicho Código. No se aplicará por ello ninguna de las demás disposiciones que inciden en la cuantificación de la pena conforme a las reglas generales incluyendo al artículo 351 del Código Procesal Penal."}]}, {"id": "M-52f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la sanción aplicable al adolescente, el tribunal parte de la pena inferior en dos grados al mínimo de los señalados por la ley para el ilícito.", "f": "Art. 21 Ley 20.084. Sobre esa pena rebajada se aplican luego las reglas de determinación y la tabla del art. 23.", "g": "N", "r": 0, "grp": "21|Ley 20.084", "x": [{"c": "Art. 21 Ley 20.084", "t": "Artículo 21.- Reglas para la determinación de la pena de base. Para establecer la pena que servirá de base a la determinación de la que deba imponerse con arreglo a la presente ley, el tribunal deberá aplicar, a partir de la pena inferior en un grado al mínimo de los señalados por la ley para cada uno de los delitos correspondientes, las reglas previstas en los artículos 50 a 78 del Código Penal que resulten aplicables, con excepción de lo dispuesto en el artículo 69 de dicho Código. No se aplicará por ello ninguna de las demás disposiciones que inciden en la cuantificación de la pena conforme a las reglas generales incluyendo al artículo 351 del Código Procesal Penal."}]}, {"id": "M-53", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Las medidas accesorias del artículo 9° de la Ley 20.066 se fijan por un plazo que, por regla general:", "f": "Art. 9 Ley 20.066. Entre ellas: abandono del hogar común, prohibición de acercarse a la víctima, prohibición de porte y tenencia de armas y asistencia a programas terapéuticos. Pueden prorrogarse a petición de la víctima.", "g": "N", "i": [], "a": ["No puede exceder de seis meses", "No puede ser inferior a seis meses ni superior a dos años", "No puede ser inferior a tres meses ni superior a un año", "No puede ser inferior a un año ni superior a tres"], "r": 1, "grp": "9|Ley 20.066", "x": [{"c": "Art. 9 Ley 20.066", "t": "… Las instituciones que desarrollen dichos programas darán cuenta al respectivo tribunal del tratamiento que deba seguir el agresor, de su inicio y término. e) Obligación de presentarse regularmente ante la unidad policial que determine el juez. f) Prohibición o restricción de las comunicaciones del ofensor respecto de la víctima. El juez fijará prudencialmente el plazo de estas medidas, que no podrá ser inferior a seis meses ni superior a dos años, atendidas las circunstancias que las justifiquen. Ellas podrán ser prorrogadas, a petición de la víctima, si se mantienen los hechos que las justificaron. En el caso de la letra d), la duración de la medida será fijada, y podrá prorrogarse, tomando en consideración los antecedentes proporcionados por la institución respectiva. …"}]}, {"id": "M-54", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El delito de maltrato habitual se sanciona, en su figura base, con:", "f": "Art. 14 Ley 20.066. Sanciona el ejercicio habitual de violencia física, psíquica o económica respecto de alguna de las personas del art. 5°, salvo que el hecho constituya un delito de mayor gravedad.", "g": "N", "i": [], "a": ["Presidio menor en su grado medio a máximo", "Presidio menor en su grado máximo", "Presidio menor en su grado mínimo a medio", "Prisión en cualquiera de sus grados"], "r": 2, "grp": "14|Ley 20.066", "x": [{"c": "Art. 14 Ley 20.066", "t": "Artículo 14.- Delito de maltrato habitual. El ejercicio habitual de violencia física, sexual, psíquica o económica respecto de alguna de las personas referidas en el artículo 5º de esta ley se sancionará con la pena de presidio menor en su grado mínimo a medio, salvo que el hecho sea constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la ley a éste. Para apreciar la habitualidad, se atenderá al número de actos ejecutados, así como a la proximidad temporal de los mismos, con independencia de que dicha violencia se haya ejercido sobre la misma o diferente víctima. Para estos efectos, no se considerarán los hechos anteriores respecto de los cuales haya recaído sentencia penal absolutoria o condenatoria. Inciso eliminado."}]}, {"id": "M-55", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El homicidio calificado del artículo 391 N° 1 se castiga con:", "f": "Art. 391 CP. Concurre con alevosía, premio o promesa remuneratoria, veneno, ensañamiento o premeditación conocida.", "g": "N", "i": [], "a": ["Presidio perpetuo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo", "Presidio mayor en su grado máximo a presidio perpetuo calificado", "Presidio mayor en su grado medio a máximo"], "r": 1, "grp": "391|CP", "x": [{"c": "Art. 391 CP", "t": "ART.391. El que mate a otro y no esté comprendido en los artículos 390, 390 bis y 390 ter, será penado: 1.° Con presidio mayor en su grado máximo a presidio perpetuo, si ejecutare el homicidio con alguna de las circunstancias siguientes: Primera.- Con alevosía. Segunda.- Por premio o promesa remuneratoria, o por beneficio económico o de otra naturaleza en provecho propio o de un tercero. Tercera.- Por medio de veneno. Cuarta.- Con ensañamiento, aumentando deliberada e inhumanamente el dolor al ofendido. Quinta.- Con premeditación conocida. 2.º Con presidio mayor en su grado medio a máximo en cualquier otro caso."}]}, {"id": "M-56", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El parricidio se castiga con:", "f": "Art. 390 CP. Requiere conocer las relaciones que ligan al autor con la víctima: padre, madre, hijo, otros ascendientes o descendientes, o quien es o ha sido su cónyuge o conviviente.", "g": "N", "i": [], "a": ["Presidio perpetuo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo calificado", "Presidio mayor en su grado máximo a presidio perpetuo", "Presidio mayor en su grado medio a presidio perpetuo"], "r": 1, "grp": "390|CP", "x": [{"c": "Art. 390 CP", "t": "ART. 390. El que, conociendo las relaciones que los ligan, mate a su padre, madre o hijo, a cualquier otro de sus ascendientes o descendientes o a quien es o ha sido su cónyuge o su conviviente, será castigado, como parricida, con la pena de presidio mayor en su grado máximo a presidio perpetuo calificado. §1 bis. Del femicidio a)"}]}, {"id": "M-57", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Las lesiones menos graves se castigan con:", "f": "Art. 399 CP. Son las lesiones no comprendidas en los artículos precedentes: categoría residual respecto de las graves.", "g": "N", "i": [], "a": ["Relegación o presidio menores en sus grados mínimos o multa de once a veinte UTM", "Presidio menor en sus grados mínimo a medio y multa de once a veinte UTM", "Prisión en cualquiera de sus grados o multa de una a cuatro UTM", "Presidio menor en su grado medio"], "r": 0, "grp": "399|CP", "x": [{"c": "Art. 399 CP", "t": "ART. 399. Las lesiones no comprendidas en los artículos precedentes se reputan menos graves, y serán penadas con relegación o presidio menores en sus grados mínimos o con multa de once a veinte unidades tributarias mensuales."}]}, {"id": "M-58", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El robo con violencia o intimidación en que, con motivo u ocasión del robo, se comete además homicidio o violación se castiga con:", "f": "Art. 433 CP. Es el N° 1 del art. 433; los numerales siguientes cubren castración, mutilaciones y lesiones graves, con penas menores.", "g": "N", "i": [], "a": ["Presidio mayor en su grado medio a presidio perpetuo", "Presidio mayor en su grado máximo a presidio perpetuo calificado", "Presidio perpetuo a presidio perpetuo calificado", "Presidio mayor en su grado mínimo a máximo"], "r": 1, "grp": "433|CP", "x": [{"c": "Art. 433 CP", "t": "ART. 433. El culpable de robo con violencia o intimidación en las personas, sea que la violencia o la intimidación tenga lugar antes del robo para facilitar su ejecución, en el acto de cometerlo o después de cometido para favorecer su impunidad, será castigado: 1°. Con presidio mayor en su grado máximo a presidio perpetuo calificado cuando, con motivo u ocasión del robo, se cometiere, además, homicidio o violación. 2°. Con presidio mayor en su grado máximo a presidio perpetuo cuando, con motivo u ocasión del robo, se cometiere alguna de las lesiones comprendidas en los artículos 395, 396 y 397, número 1°. 3°. Con presidio mayor en su grado medio a máximo cuando se cometieren lesiones de las que trata el número 2° del artículo 397 o cuando las víctimas fueren retenidas bajo rescate o por un lapso mayor a …"}]}, {"id": "M-59", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El empleado público que, abusando de su cargo o sus funciones, aplica, ordena o consiente en que se aplique tortura es castigado con:", "f": "Art. 150 A CP. Igual pena recibe el empleado público que, conociendo la ocurrencia de estas conductas, no las impide o no las hace cesar teniendo la facultad o autoridad para ello.", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio mayor en su grado medio", "Presidio menor en sus grados medio a máximo", "Presidio mayor en su grado mínimo"], "r": 3, "grp": "150 A|CP", "x": [{"c": "Art. 150 A CP", "t": "ART. 150 A. El empleado público que, abusando de su cargo o sus funciones, aplicare, ordenare o consintiere en que se aplique tortura, será penado con presidio mayor en su grado mínimo. Igual sanción se impondrá al empleado público que, conociendo de la ocurrencia de estas conductas, no impidiere o no hiciere cesar la aplicación de tortura, teniendo la facultad o autoridad necesaria para ello o estando en posición para hacerlo. La misma pena se aplicará al particular que, en el ejercicio de funciones públicas, o a instigación de un empleado público, o con el consentimiento o aquiescencia de éste, ejecutare los actos a que se refiere este artículo. Se entenderá por tortura todo acto por el cual se inflija intencionalmente a una persona dolores o sufrimientos graves, ya sean físicos, sexuales o psíquicos, con el fin de obtener de ella …"}]}, {"id": "M-60", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La negociación incompatible se castiga con:", "f": "Art. 240 CP. Sanciona al funcionario (y demás sujetos que enumera) que se interesa en cualquier negociación, actuación, contrato u operación en que deba intervenir en razón de su cargo.", "g": "N", "i": [], "a": ["Reclusión menor en su grado mínimo y multa", "Presidio mayor en su grado mínimo e inhabilitación", "Suspensión del empleo en cualquiera de sus grados y multa", "Reclusión menor en sus grados medio a máximo, inhabilitación y multa"], "r": 3, "grp": "240|CP", "x": [{"c": "Art. 240 CP", "t": "ART. 240. Será sancionado con la pena de reclusión menor en sus grados medio a máximo, inhabilitación absoluta temporal para cargos, empleos u oficios públicos en sus grados medio a máximo y multa de la mitad al tanto del valor del interés que hubiere tomado en el negocio: 1° El empleado público que directa o indirectamente se interesare en cualquier negociación, actuación, contrato, operación o gestión en la cual hubiere de intervenir en razón de su cargo. 2º El árbitro o el liquidador comercial que directa o indirectamente se interesare en cualquier negociación, actuación, contrato, operación o gestión en la cual hubiere de intervenir en relación con los bienes, cosas o intereses patrimoniales cuya adjudicación, partición o administración estuviere a su cargo. …"}]}, {"id": "M-61", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La falsificación de documento público cometida por empleado público abusando de su oficio se castiga con:", "f": "Art. 193 CP. El particular que comete alguna de esas falsedades recibe presidio menor en sus grados medio a máximo (art. 194).", "g": "N", "i": [], "a": ["Presidio menor en sus grados medio a máximo", "Presidio menor en cualquiera de sus grados", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio mayor en su grado mínimo a medio"], "r": 2, "grp": "193|CP", "x": [{"c": "Art. 193 CP", "t": "ART. 193. Será castigado con presidio menor en su grado máximo a presidio mayor en su grado mínimo el empleado público que, abusando de su oficio, cometiere falsedad: 1.° Contrahaciendo o fingiendo letra, firma o rúbrica. 2.° Suponiendo en un acto la intervención de personas que no la han tenido. 3.° Atribuyendo a los que han intervenido en él declaraciones o manifestaciones diferentes de las que hubieren hecho. 4.° Faltando a la verdad en la narración de hechos sustanciales. 5.° Alterando las fechas verdaderas. 6.° Haciendo en documento verdadero cualquiera alteración o intercalación que varíe su sentido. 7.° Dando copia en forma fehaciente de un documento supuesto, o manifestando en ella cosa contraria o diferente de la que contenga el verdadero original. 8.° Ocultando en perjuicio del Estado o de un particular cualquier documento oficial."}]}, {"id": "M-62", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La falsificación de instrumento privado en perjuicio de tercero se castiga con:", "f": "Art. 197 CP. A diferencia de la falsificación de instrumento público, exige perjuicio de tercero. Si el documento es mercantil, la pena es mayor (inciso segundo).", "g": "N", "i": [], "a": ["Presidio menor en sus grados medio a máximo", "Presidio menor en cualquiera de sus grados y multa de once a quince UTM, o sólo la primera de ellas según las circunstancias", "Presidio menor en su grado mínimo o multa de once a quince UTM", "Presidio menor en su grado máximo y multa de dieciséis a veinte UTM"], "r": 1, "grp": "197|CP", "x": [{"c": "Art. 197 CP", "t": "ART. 197. El que, con perjuicio de tercero, cometiere en instrumento privado alguna de las falsedades designadas en el art. 193, sufrirá las penas de presidio menor en cualquiera de sus grados y multa de once a quince unidades tributarias mensuales, o sólo la primera de ellas según las circunstancias. Si tales falsedades se hubieren cometido en letras de cambio u otra clase de documentos mercantiles, se castigará a los culpables con presidio menor en su grado máximo y multa de dieciséis a veinte unidades tributarias mensuales, o sólo con la primera de estas penas atendidas las circunstancias."}]}, {"id": "M-63", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La obstrucción a la investigación del artículo 269 bis se castiga con:", "f": "Art. 269 bis CP. Sanciona a quien, a sabiendas, obstaculiza gravemente el esclarecimiento de un hecho punible o la determinación de sus responsables mediante la aportación de antecedentes falsos que llevan al Ministerio Público a realizar u omitir actuaciones.", "g": "N", "i": [], "a": ["Presidio menor en su grado mínimo y multa de dos a doce UTM", "Prisión en su grado máximo y multa de una a cuatro UTM", "Presidio menor en su grado medio y multa de seis a diez UTM", "Presidio menor en sus grados mínimo a medio"], "r": 0, "grp": "269 bis|CP", "x": [{"c": "Art. 269 bis CP", "t": "ART. 269 bis. El que, a sabiendas, obstaculice gravemente el esclarecimiento de un hecho punible o la determinación de sus responsables, mediante la aportación de antecedentes falsos que condujeren al Ministerio Público a realizar u omitir actuaciones de la investigación, será sancionado con la pena de presidio menor en su grado mínimo y multa de dos a doce unidades tributarias mensuales. La pena prevista en el inciso precedente se aumentará en un grado si los antecedentes falsos aportados condujeren al Ministerio Público a solicitar medidas cautelares o a deducir una acusación infundada. El abogado que incurriere en las conductas descritas en los incisos anteriores será castigado, además, con la pena de suspensión de profesión titular durante el tiempo de la condena. …"}]}, {"id": "M-64", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La amenaza seria y verosímil de un mal que constituye delito, cuando no es condicional, se castiga con:", "f": "Art. 296 CP. N° 1 (condicional y el culpable consigue su propósito): presidio menor en sus grados medio a máximo. N° 2 (condicional sin conseguirlo): mínimo a medio. N° 3 (no condicional): grado mínimo.", "g": "N", "i": [], "a": ["Presidio menor en su grado mínimo", "Presidio menor en sus grados medio a máximo", "Prisión en su grado máximo", "Presidio menor en sus grados mínimo a medio"], "r": 0, "grp": "296|CP", "x": [{"c": "Art. 296 CP", "t": "… El que amenazare seriamente a otro con causar a él mismo o a su familia, en su persona, honra o propiedad, un mal que constituya delito, siempre que por los antecedentes aparezca verosímil la consumación del hecho, será castigado: 1º. Con presidio menor en sus grados medio a máximo, si hubiere hecho la amenaza exigiendo una cantidad o imponiendo ilegítimamente cualquiera otra condición y el culpable hubiere conseguido su propósito. 2° Con presidio menor en sus grados mínimo a medio, si hecha la amenaza bajo condición el culpable no hubiere conseguido su propósito, 3.° Con presidio menor en su grado mínimo, si la amenaza no fuere condicional; a no ser que merezca mayor pena el hecho consumado, caso en el cual se impondrá ésta. …"}]}, {"id": "M-65", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El incendio de un edificio destinado a servir de morada que no estuviere actualmente habitado se castiga con:", "f": "Art. 476 CP. El art. 476 agrupa esa hipótesis con el incendio dentro de poblado, de bosques, mieses, pastos y otros.", "g": "N", "i": [], "a": ["Presidio mayor en su grado máximo a presidio perpetuo", "Presidio mayor en su grado mínimo", "Presidio menor en su grado máximo", "Presidio mayor en cualquiera de sus grados"], "r": 3, "grp": "476|CP", "x": [{"c": "Art. 476 CP", "t": "ART. 476. Se castigará con presidio mayor en cualquiera de sus grados: 1.° Al que incendiare un edificio o lugar destinado a servir de morada, que no estuviere actualmente habitado. 2º Al que dentro de poblado ejecutare el incendio en Art. único, N° 3 edificio, aeronave, buque, plataforma naval, vehículos de transporte público de pasajeros, automóviles de dos o más plazas, camiones, instalaciones de servicios sanitarios, de almacenamiento o transporte de combustibles, de distribución o generación de energía eléctrica, portuaria, aeronáutica o ferroviaria, incluyendo las de trenes subterráneos, u otro lugar, medio de transporte, instalación o bien semejante, cuando no hubiere personas en su interior o su presencia no se pudiese prever. 3.º Al que incendiare bosques, mieses, pastos, montes, Art. …"}]}, {"id": "M-66", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El abuso sexual de persona menor de catorce años se castiga con:", "f": "Art. 366 bis CP. No exige ninguna de las circunstancias de los arts. 361 o 363: basta la acción sexual distinta del acceso carnal con persona menor de catorce años.", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio menor en sus grados medio a máximo", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio mayor en su grado mínimo a medio"], "r": 2, "grp": "366 bis|CP", "x": [{"c": "Art. 366 bis CP", "t": "ART. 366 bis. El que realizare una acción sexual distinta del acceso carnal con una persona menor de catorce años, será castigado con la pena de presidio menor en su grado máximo a presidio mayor en su grado mínimo."}]}, {"id": "M-67v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Está exento de responsabilidad criminal el menor de dieciocho años; la responsabilidad de los mayores de catorce y menores de dieciocho se regula por la ley de responsabilidad penal juvenil.", "f": "Art. 10 CP. N° 2 CP.", "g": "N", "r": 1, "grp": "10|CP", "x": [{"c": "Art. 10 CP", "t": "ART. 10. Están exentos de responsabilidad criminal: 1.° El loco o demente, a no ser que haya obrado en un intervalo lúcido, y el que, por cualquier causa independiente de su voluntad, se halla privado totalmente de razón. Inciso Derogado. Inciso Derogado. Art. DECIMONOVENO 2.º El menor de dieciocho años. La responsabilidad de N° 1 los menores de dieciocho años y mayores de catorce se regulará por lo dispuesto en la ley de responsabilidad penal juvenil. 3.° Derogado. 4.° El que obra en defensa de su persona o derechos, siempre que concurran las circunstancias siguientes: Primera.-Agresión Ilegítima. Segunda.- Necesidad racional del medio empleado para …"}]}, {"id": "M-67f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Está exento de responsabilidad criminal el menor de dieciséis años, y el mayor de esa edad responde como adulto.", "f": "Art. 10 CP. N° 2 CP.", "g": "N", "r": 0, "grp": "10|CP", "x": [{"c": "Art. 10 CP", "t": "ART. 10. Están exentos de responsabilidad criminal: 1.° El loco o demente, a no ser que haya obrado en un intervalo lúcido, y el que, por cualquier causa independiente de su voluntad, se halla privado totalmente de razón. Inciso Derogado. Inciso Derogado. Art. DECIMONOVENO 2.º El menor de dieciocho años. La responsabilidad de N° 1 los menores de dieciocho años y mayores de catorce se regulará por lo dispuesto en la ley de responsabilidad penal juvenil. 3.° Derogado. 4.° El que obra en defensa de su persona o derechos, siempre que concurran las circunstancias siguientes: Primera.-Agresión Ilegítima. Segunda.- Necesidad racional del medio empleado para …"}]}, {"id": "M-68v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Dentro de los límites de cada grado, el tribunal determina la cuantía de la pena en atención al número y entidad de las circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito.", "f": "Art. 69 CP. Es la regla final de individualización judicial, que opera una vez fijado el grado.", "g": "N", "r": 1, "grp": "69|CP", "x": [{"c": "Art. 69 CP", "t": "ART. 69. Dentro de los límites de cada grado el tribunal determinará la cuantía de la pena en atención al número y entidad de las circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito, teniendo en especial consideración la circunstancia de ser la víctima un menor de 18 años, un adulto mayor, según lo dispuesto por la ley Nº 19.828, o una persona con discapacidad en los términos de la ley Nº 20.422."}]}, {"id": "M-68f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Dentro de los límites de cada grado, el tribunal determina la cuantía de la pena atendiendo únicamente a los antecedentes penales del condenado.", "f": "Art. 69 CP. Es la regla final de individualización judicial, que opera una vez fijado el grado.", "g": "N", "r": 0, "grp": "69|CP", "x": [{"c": "Art. 69 CP", "t": "ART. 69. Dentro de los límites de cada grado el tribunal determinará la cuantía de la pena en atención al número y entidad de las circunstancias atenuantes y agravantes y a la mayor o menor extensión del mal producido por el delito, teniendo en especial consideración la circunstancia de ser la víctima un menor de 18 años, un adulto mayor, según lo dispuesto por la ley Nº 19.828, o una persona con discapacidad en los términos de la ley Nº 20.422."}]}, {"id": "M-70v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Al culpable de dos o más delitos se le imponen todas las penas correspondientes a las diversas infracciones.", "f": "Art. 74 CP. Concurso real: acumulación material. Las penas se cumplen simultáneamente si es posible; si no, en orden sucesivo, principiando por las más graves.", "g": "N", "r": 1, "grp": "74|CP", "x": [{"c": "Art. 74 CP", "t": "ART. 74. Al culpable de dos o más delitos se le impondrán todas las penas correspondientes a las diversas infracciones. El sentenciado cumplirá todas sus condenas simultáneamente, siendo posible. Cuando no lo fuere, o si de ello hubiere de resultar ilusoria alguna de las penas, las sufrirá en orden sucesivo, principiando por las más graves o sea las más altas en la escala respectiva, excepto las de confinamiento, extrañamiento, relegación
