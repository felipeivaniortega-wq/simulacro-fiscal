 inc. 2° Ley 21.732.", "g": "N", "x": [{"c": "Art. 1 Ley 21.732", "t": "Artículo 1º.- Quien sea parte de una asociación terrorista será sancionado con presidio mayor en su grado mínimo. La pena será de presidio mayor en sus grados mínimo a medio para quien tomare parte en la asociación reclutando nuevos miembros o entregando entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos; y de presidio mayor en su grado medio para quien tomare parte en ella cumpliendo funciones de jefatura, ejerciendo mando en ella, proveyéndole recursos o medios, o habiéndola fundado. La pena será de presidio mayor en su grado medio para quien tomare parte en la asociación reclutando a menores de dieciocho años como miembros o entregándoles entrenamiento militar, de combate o en el uso de armamento o de artefactos explosivos. …"}], "grp": "1|Ley 21.732"}, {"id": "N-SM-76", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Según el artículo 4° de la Ley 21.732, comete delito terrorista quien perpetra alguno de los delitos del artículo 5° con la finalidad de:", "i": [], "a": ["Socavar o desestabilizar las estructuras políticas, sociales o económicas del Estado democrático", "Imponer o inhibir alguna decisión a una autoridad del Estado democrático", "Someter o desmoralizar a la población civil o a una parte de ella", "Cualquiera de las anteriores"], "r": 3, "f": "Art. 4° Ley 21.732, letras a), b) y c).", "g": "N", "x": [{"c": "Art. 4 Ley 21.732", "t": "Artículo 4º.- Siempre se entenderá que comete delito terrorista, aun cuando no forme parte de una asociación terrorista ni actúe en adherencia a los fines de una asociación terrorista o de una agrupación u organización de personas que persiga la comisión de tales delitos con dichos fines, por sí o mediante terceros, quien cometa un delito de aquellos a los que se refiere el artículo 5º de esta ley, con alguna de las siguientes finalidades: a) Socavar o desestabilizar las estructuras políticas, sociales o económicas del Estado democrático. b) Imponer o inhibir alguna decisión a una autoridad del Estado democrático. c) Someter o desmoralizar a la población civil o a una parte de ella. En tales casos, se impondrá al responsable la pena prevista para el delito aumentada en un grado."}], "grp": "4|Ley 21.732"}, {"id": "N-SM-77", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Colocar o detonar un artefacto explosivo que afecte o pueda afectar a una cantidad elevada de personas se castiga, según el artículo 8° de la Ley 21.732, con:", "i": [], "a": ["Presidio mayor en su grado mínimo", "Presidio mayor en su grado medio", "Presidio mayor en su grado máximo, conjuntamente con las penas por la muerte o lesiones causadas", "Presidio perpetuo calificado"], "r": 2, "f": "Art. 8° Ley 21.732.", "g": "N", "x": [{"c": "Art. 8 Ley 21.732", "t": "Artículo 8º.- El que coloque, envíe, active, arroje, detone o haga explosionar una bomba o artefacto explosivo o incendiario, que por sus características y por las circunstancias de tiempo y lugar afecte o pueda afectar a una cantidad elevada de personas, será castigado con la pena de presidio mayor en su grado máximo, conjuntamente con las que corresponda aplicar por la muerte o lesiones causadas."}], "grp": "8|Ley 21.732"}, {"id": "N-SM-78", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Las investigaciones por delitos de la Ley 21.732 pueden iniciarse:", "i": [], "a": ["Sólo por querella del Ministerio encargado de la Seguridad Pública", "De oficio por el Ministerio Público, por denuncia o querella, o por querella del Ministro encargado de la Seguridad Pública", "Sólo de oficio por el Ministerio Público", "Sólo por requerimiento del Fiscal Nacional"], "r": 1, "f": "Art. 16 Ley 21.732.", "g": "N", "x": [{"c": "Art. 16 Ley 21.732", "t": "Artículo 16.- Las investigaciones a que dieren lugar los delitos previstos en esta ley se iniciarán de oficio por el Ministerio Público o por denuncia o querella, de acuerdo con las normas generales, o por querella del Ministro o Ministra del Ministerio encargado de la Seguridad Pública."}], "grp": "16|Ley 21.732"}, {"id": "N-SM-79", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Al empleado público que comete un delito de la Ley 21.732 en el ejercicio de su cargo se le aplica:", "i": [], "a": ["La pena rebajada en un grado", "La pena aumentada en un grado y la inhabilitación absoluta perpetua para cargos y oficios públicos", "Sólo la inhabilitación especial temporal", "La pena del delito sin modificación"], "r": 1, "f": "Art. 14 Ley 21.732.", "g": "N", "x": [{"c": "Art. 14 Ley 21.732", "t": "Artículo 14.- Al empleado público que en el ejercicio de su cargo o con ocasión de éste cometa cualquiera de los delitos contemplados en esta ley se le aplicará la respectiva pena, aumentada en un grado y, sin perjuicio de lo dispuesto en el artículo 28 del Código Penal, la pena accesoria de inhabilitación absoluta perpetua para cargos y oficios públicos."}], "grp": "14|Ley 21.732"}, {"id": "N-SM-80", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Los principios de actuación del artículo 3° de la Ley 21.849 son:", "i": [], "a": ["Legalidad, necesidad, responsabilidad y racionalidad", "Legalidad, proporcionalidad, oportunidad y gradualidad", "Necesidad, proporcionalidad y rendición de cuentas", "Legalidad, objetividad y eficiencia"], "r": 0, "f": "Art. 3° Ley 21.849.", "g": "N", "x": [{"c": "Art. 3 Ley 21.849", "t": "… El personal de las Fuerzas de Orden y Seguridad Pública y de las Fuerzas Armadas, en los supuestos señalados en el artículo 1, deberá ajustar su acción a los siguientes principios de actuación: 1. Principio de legalidad: las actuaciones que realicen siempre deben ajustarse a la Constitución, a los tratados internacionales ratificados por Chile y que se encuentren vigentes, y a la ley. 2. Principio de necesidad: sólo se podrá utilizar la fuerza cuando sea necesaria para el cumplimiento del objetivo encomendado. 3. Principio de responsabilidad: el uso de la fuerza, fuera de los parámetros establecidos en la presente ley, conlleva las responsabilidades de quienes la ejercen y, cuando la ley lo determine, la responsabilidad de los mandos respectivos y de la autoridad civil. …"}], "grp": "3|Ley 21.849"}, {"id": "N-SM-81", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "NO es uno de los grados de uso de la fuerza del artículo 7° de la Ley 21.849:", "i": [], "a": ["Presencia", "Actuación mediante técnicas de comunicación", "Reducción física de la movilidad", "Detención preventiva"], "r": 3, "f": "Art. 7° Ley 21.849: presencia, técnicas de comunicación, reducción física de la movilidad, fuerza menos letal y fuerza potencialmente letal.", "g": "N", "x": [{"c": "Art. 7 Ley 21.849", "t": "… ilícitos. 2. Actuación mediante técnicas de comunicación: uso de medios de persuasión verbal, que incluyen diversas formas de comunicación tales como el diálogo, mediación, negociación y reducción de la tensión con las personas involucradas. 3. Reducción física de la movilidad: uso de la fuerza para el control físico, reducción del transgresor, para doblegar su resistencia, inmovilizarlo, esposarlo o aplicar otro medio de inmovilización. 4. Utilización de fuerza menos letal: uso de la fuerza física o de armamento menos letal para alcanzar el objetivo encomendado. 5. Utilización de fuerza potencialmente letal: el uso de la fuerza potencialmente letal constituye una medida que procede solo cuando resulten insuficientes las medidas establecidas en los grados previos y justificada en caso de cumplimiento del deber, legítima defensa, cumplimiento de una orden judicial, con el objeto de detener a una persona que oponga resistencia a la autoridad, para impedir su …"}], "grp": "7|Ley 21.849"}, {"id": "N-SM-82", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Según la Ley 21.849, el personal dispuesto para proteger infraestructura crítica puede usar fuerza potencialmente letal cuando:", "i": [], "a": ["Exista resistencia pasiva", "Tenga por objeto impedir daños graves e inminentes a la infraestructura crítica", "Lo autorice el Ministerio Público", "Se haya agotado el plazo de advertencia"], "r": 1, "f": "Art. 8° Ley 21.849.", "g": "N", "x": [{"c": "Art. 8 Ley 21.849", "t": "Artículo 8.- Protección de infraestructura crítica. El personal dispuesto para la protección de infraestructura crítica hará uso de la fuerza de conformidad con lo establecido en los artículos precedentes. Asimismo, podrá hacer uso de la fuerza potencialmente letal cuando tuviere por objeto impedir daños graves e inminentes a la infraestructura crítica."}], "grp": "8|Ley 21.849"}, {"id": "N-SM-83", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El fraude informático del artículo 7° de la Ley 21.459 se castiga con presidio menor en sus grados medio a máximo y multa de 11 a 15 UTM cuando el perjuicio excede de:", "i": [], "a": ["4 UTM", "40 UTM", "400 UTM", "1 UTM"], "r": 1, "f": "Art. 7° N° 1 Ley 21.459.", "g": "N", "x": [{"c": "Art. 7 Ley 21.459", "t": "Artículo 7°.- Fraude informático. El que, causando perjuicio a otro, con la finalidad de obtener un beneficio económico para sí o para un tercero, manipule un sistema informático, mediante la introducción, alteración, daño o supresión de datos informáticos o a través de cualquier interferencia en el funcionamiento de un sistema informático, será penado: 1) Con presidio menor en sus grados medio a máximo y multa de once a quince unidades tributarias mensuales, si el valor del perjuicio excediera de cuarenta unidades tributarias mensuales. 2) Con presidio menor en su grado medio y multa de seis a diez unidades tributarias mensuales, si el valor del perjuicio excediere de cuatro unidades tributarias mensuales y no pasare de cuarenta unidades tributarias mensuales. …"}], "grp": "7|Ley 21.459"}, {"id": "N-SM-84", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La falsificación informática cometida por empleado público abusando de su oficio se castiga con:", "i": [], "a": ["Presidio menor en su grado medio", "Presidio menor en sus grados medio a máximo", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio mayor en su grado medio"], "r": 2, "f": "Art. 5° inc. 2° Ley 21.459.", "g": "N", "x": [{"c": "Art. 5 Ley 21.459", "t": "Artículo 5°.- Falsificación informática. El que indebidamente introduzca, altere, dañe o suprima datos informáticos con la intención de que sean tomados como auténticos o utilizados para generar documentos auténticos, será sancionado con la pena de presidio menor en sus grados medio a máximo. Cuando la conducta descrita en el inciso anterior sea cometida por empleado público, abusando de su oficio, será castigado con la pena de presidio menor en su grado máximo a presidio mayor en su grado mínimo."}], "grp": "5|Ley 21.459"}, {"id": "N-SM-85", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El Registro de Evidencias y Antecedentes del Sistema Nacional de Registros de ADN conserva las huellas genéticas:", "i": [], "a": ["De los condenados por sentencia ejecutoriada", "De los imputados formalizados", "Obtenidas en una investigación criminal que correspondan a personas no identificadas", "De los familiares de personas desaparecidas"], "r": 2, "f": "Art. 7° Ley 19.970.", "g": "N", "x": [{"c": "Art. 7 Ley 19.970", "t": "Artículo 7º.- Registro de Evidencias y Antecedentes. En el Registro de Evidencias y Antecedentes se conservarán las huellas genéticas que hubieren sido obtenidas en el curso de una investigación criminal y que correspondieren a personas no identificadas."}], "grp": "7|Ley 19.970"}, {"id": "N-SM-86", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "NO es una pena aplicable a la persona jurídica conforme al artículo 8° de la Ley 20.393:", "i": [], "a": ["La extinción de la persona jurídica", "La inhabilitación para contratar con el Estado", "La supervisión de la persona jurídica", "La clausura temporal de sus establecimientos"], "r": 3, "f": "Art. 8° Ley 20.393: extinción, inhabilitación para contratar con el Estado, pérdida de beneficios fiscales, supervisión, multa y comiso, entre las que enumera.", "g": "N", "x": [{"c": "Art. 8 Ley 20.393", "t": "Artículo 8°.- Penas. Serán aplicables a la persona jurídica una o más de las siguientes penas: 1. La extinción de la persona jurídica. 2. La inhabilitación para contratar con el Estado. 3. La pérdida de beneficios fiscales y la prohibición de recibirlos. 4. La supervisión de la persona jurídica. 5. La multa. 6. El comiso a que se refiere el inciso tercero del artículo 14. 7. La publicación de un extracto de la sentencia condenatoria."}], "grp": "8|Ley 20.393"}, {"id": "N-SM-87", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La entrevista investigativa videograbada debe realizarse:", "i": [], "a": ["Dentro de los cinco días siguientes a la denuncia", "En el tiempo más próximo a la denuncia, salvo que el niño, niña o adolescente no se encuentre disponible y en condiciones", "Sólo una vez formalizada la investigación", "En la audiencia de preparación del juicio oral"], "r": 1, "f": "Art. 7° Ley 21.057.", "g": "N", "x": [{"c": "Art. 7 Ley 21.057", "t": "Artículo 7°.- Oportunidad de la entrevista investigativa videograbada. La entrevista investigativa videograbada se realizará en el tiempo más próximo a la denuncia, a menos que el niño, niña o adolescente no se encuentre disponible y en condiciones físicas y psíquicas para participar en ella, lo que deberá ser calificado por un profesional de la Unidad de Atención a Víctimas y Testigos de la fiscalía respectiva. La evaluación del profesional de la Unidad de Atención a Víctimas y Testigos del Ministerio Público se realizará en el menor tiempo posible y en condiciones que garanticen la menor interacción presencial del niño, niña o adolescente. Los profesionales a cargo de esta evaluación en ningún caso podrán hacer al niño, niña o adolescente preguntas que busquen establecer la ocurrencia de los hechos o la determinación de sus partícipes. …"}], "grp": "7|Ley 21.057"}, {"id": "N-0", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "Para las letras d), e) y f) del artículo 130, el \"tiempo inmediato\" cuando la detención la practican agentes policiales no puede exceder de:", "f": "Art. 130 CPP. Veinticuatro horas para agentes policiales, cuarenta y ocho para la Autoridad Marítima y doce para cualquier otra persona.", "g": "N", "i": [], "a": ["Doce horas", "Veinticuatro horas", "Cuarenta y ocho horas", "Setenta y dos horas"], "r": 1, "grp": "130|CPP", "x": [{"c": "Art. 130 CPP", "t": "… cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato. Para los efectos de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}]}, {"id": "N-1v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Si la detención en flagrancia la practica un particular, el tiempo inmediato no puede exceder de doce horas.", "f": "Art. 130 CPP. Doce horas cuando la detención es realizada por cualquier otra persona.", "g": "N", "r": 1, "grp": "130|CPP", "x": [{"c": "Art. 130 CPP", "t": "… 2 N° 7 a) y f) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}]}, {"id": "N-1f", "o": "Pregu os de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}]}, {"id": "N-3", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "¿Cuál de las siguientes NO es una hipótesis de flagrancia del artículo 130?", "f": "Art. 130 CPP. Las hipótesis son las de las letras a) a f); la denuncia anónima no figura.", "g": "N", "i": [], "a": ["El que fuere sindicado por una denuncia anónima recibida por la policía", "El que acabare de cometer el delito", "El que huyere del lugar y fuere designado por el ofendido u otra persona como autor o cómplice", "El que aparezca en un registro audiovisual cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato"], "r": 0, "grp": "130|CPP", "x": [{"c": "Art. 130 CPP", "t": "Artículo 130.- Situación de flagrancia. Se entenderá que se encuentra en situación de flagrancia: a) El que actualmente se encontrare cometiendo el delito; b) El que acabare de cometerlo; c) El que huyere del lugar de comisión del delito y fuere designado por el ofendido u otra persona como autor o cómplice; d) El que, en un tiempo inmediato a la perpetración de un delito, fuere encontrado con objetos procedentes de aquél o con señales, en sí mismo o en sus vestidos, que permitieren sospechar su participación en él, o con las armas o instrumentos que hubieren sido empleados para cometerlo, y e) El que las víctimas de un delito que reclamen auxilio, o testigos presenciales, señalaren como autor o cómplice de un delito que se hubiere cometido en un tiempo inmediato. …"}]}, {"id": "N-4", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "Practicada una detención por flagrancia, la policía debe informar de ella al Ministerio Público dentro de un plazo máximo de:", "f": "Art. 131 CPP. Informe al fiscal dentro de doce horas; el detenido debe ser conducido ante el juez dentro de veinticuatro horas desde la detención.", "g": "N", "i": [], "a": ["Seis horas", "Veinticuatro horas", "Doce horas", "Dos horas"], "r": 2, "grp": "131|CPP", "x": [{"c": "Art. 131 CPP", "t": "… Si ello no fuere posible por no ser hora de despacho, el detenido podrá permanecer en el recinto policial o de detención hasta el momento de la primera audiencia judicial, por un período que en caso alguno excederá las veinticuatro horas. Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. El fiscal podrá dejar sin efecto la detención u ordenar que el detenido sea conducido ante el juez dentro de un plazo máximo de veinticuatro horas, contado desde que la detención se hubiere practicado. …"}]}, {"id": "N-5v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El detenido por flagrancia debe ser conducido ante el juez dentro de un plazo máximo de veinticuatro horas contado desde que la detención se practicó.", "f": "Art. 131 CPP. Veinticuatro horas desde que la detención se hubiere practicado.", "g": "N", "r": 1, "grp": "131|CPP", "x": [{"c": "Art. 131 CPP", "t": "… Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. El fiscal podrá dejar sin efecto la detención u ordenar que el detenido sea conducido ante el juez dentro de un plazo máximo de veinticuatro horas, contado desde que la detención se hubiere practicado. Si el fiscal nada manifestare, la policía deberá presentar el detenido ante la autoridad judicial en el plazo indicado. Cuando el fiscal ordene poner al detenido a disposición del juez, deberá, en el mismo acto, dar conocimiento de esta situación al abogado de confianza de aquél o a la Defensoría Penal Pública. …"}]}, {"id": "N-5f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El detenido por flagrancia debe ser conducido ante el juez dentro de un plazo máximo de cuarenta y ocho horas contado desde que la detención se practicó.", "f": "Art. 131 CPP. Veinticuatro horas desde que la detención se hubiere practicado.", "g": "N", "r": 0, "grp": "131|CPP", "x": [{"c": "Art. 131 CPP", "t": "… Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. El fiscal podrá dejar sin efecto la detención u ordenar que el detenido sea conducido ante el juez dentro de un plazo máximo de veinticuatro horas, contado desde que la detención se hubiere practicado. Si el fiscal nada manifestare, la policía deberá presentar el detenido ante la autoridad judicial en el plazo indicado. Cuando el fiscal ordene poner al detenido a disposición del juez, deberá, en el mismo acto, dar conocimiento de esta situación al abogado de confianza de aquél o a la Defensoría Penal Pública. …"}]}, {"id": "N-6", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "Si el fiscal o su abogado asistente no concurren a la primera audiencia del detenido, el juez puede suspenderla por un plazo no superior a:", "f": "Art. 132 CPP. Suspensión breve y perentoria no superior a dos horas; transcurrida sin que concurran, se libera al detenido.", "g": "N", "i": [], "a": ["Una hora", "Veinticuatro horas", "Dos horas", "Seis horas"], "r": 2, "grp": "132|CPP", "x": [{"c": "Art. 132 CPP", "t": "Artículo 132. Comparecencia judicial. A la primera audiencia judicial del detenido deberá concurrir el fiscal o el abogado asistente del fiscal. La ausencia de éstos dará lugar a la liberación del detenido. No obstante lo anterior, el juez podrá suspender la audiencia por un plazo breve y perentorio no superior a dos horas, con el fin de permitir la concurrencia del fiscal o su abogado asistente. Transcurrido este plazo sin que concurriere ninguno de ellos, se procederá a la liberación del detenido. En todo caso, el juez deberá comunicar la ausencia del Art. fiscal o de su abogado asistente al fiscal regional respectivo o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, a la mayor brevedad, con el objeto de determinar la eventual responsabilidad disciplinaria que correspondiere. …"}]}, {"id": "N-7v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El fiscal puede solicitar la ampliación del plazo de detención hasta por tres días para preparar su presentación.", "f": "Art. 132 CPP. Ampliación hasta por tres días.", "g": "N", "r": 1, "grp": "132|CPP", "x": [{"c": "Art. 132 CPP", "t": "… 2 N° 8 b) fiscal actuando expresamente facultado por éste, procederá directamente a formalizar la investigación y a solicitar las medidas cautelares que procedieren, siempre que contare con los antecedentes necesarios y que se encontrare presente el defensor del imputado. En el caso de que no pudiere procederse de la manera indicada, el fiscal o el abogado asistente del fiscal actuando en la forma señalada, podrá solicitar una ampliación del plazo de detención hasta por tres días, con el fin de preparar su presentación. El juez accederá a la ampliación del plazo de detención cuando estimare que los antecedentes justifican esa medida. En todo caso, la declaración de ilegalidad de la detención no impedirá que el fiscal o el abogado asistente del fiscal pueda formalizar la investigación y solicitar las medidas cautelares que sean procedentes, de conformidad con lo dispuesto en el inciso anterior, pero …"}]}, {"id": "N-7f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El fiscal puede solicitar la ampliación del plazo de detención hasta por cinco días para preparar su presentación.", "f": "Art. 132 CPP. Ampliación hasta por tres días.", "g": "N", "r": 0, "grp": "132|CPP", "x": [{"c": "Art. 132 CPP", "t": "… 2 N° 8 b) fiscal actuando expresamente facultado por éste, procederá directamente a formalizar la investigación y a solicitar las medidas cautelares que procedieren, siempre que contare con los antecedentes necesarios y que se encontrare presente el defensor del imputado. En el caso de que no pudiere procederse de la manera indicada, el fiscal o el abogado asistente del fiscal actuando en la forma señalada, podrá solicitar una ampliación del plazo de detención hasta por tres días, con el fin de preparar su presentación. El juez accederá a la ampliación del plazo de detención cuando estimare que los antecedentes justifican esa medida. En todo caso, la declaración de ilegalidad de la detención no impedirá que el fiscal o el abogado asistente del fiscal pueda formalizar la investigación y solicitar las medidas cautelares que sean procedentes, de conformidad con lo dispuesto en el inciso anterior, pero …"}]}, {"id": "N-8", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "El conjunto de procedimientos del control de identidad del artículo 85 no puede extenderse por un plazo superior a:", "f": "Art. 85 CPP. Plazo máximo de ocho horas, transcurridas las cuales la persona debe ser puesta en libertad, salvo indicios de ocultación de identidad.", "g": "N", "i": [], "a": ["Seis horas", "Ocho horas", "Cuatro horas", "Doce horas"], "r": 1, "grp": "85|CPP", "x": [{"c": "Art. 85 CPP", "t": "… de órdenes de detención que pudieren afectarle. Si no resultare posible acreditar su identidad, se le tomarán huellas digitales, las que sólo podrán ser usadas para fines de identificación y, cumplido dicho propósito, serán destruidas. El conjunto de procedimientos detallados en los incisos precedentes no deberá extenderse por un plazo superior a ocho horas, transcurridas las cuales la persona que ha estado sujeta a ellos deberá ser puesta en libertad, salvo que existan indicios de que ha ocultado su verdadera identidad o ha proporcionado una falsa, caso en el cual se estará a lo dispuesto en el inciso siguiente. Si la persona se niega a acreditar su identidad o se …"}]}, {"id": "N-9v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Fuera de los casos de flagrancia, nadie puede ser detenido sino por orden de funcionario público expresamente facultado por la ley, intimada en forma legal.", "f": "Art. 125 CPP. Orden de funcionario público expresamente facultado por la ley, salvo delito flagrante.", "g": "N", "r": 1, "grp": "125|CPP", "x": [{"c": "Art. 125 CPP", "t": "Artículo 125.- Procedencia de la detención. Ninguna persona podrá ser detenida sino por orden de funcionario público expresamente facultado por la ley y después que dicha orden le fuere intimada en forma legal, a menos que fuere sorprendida en delito flagrante y, en este caso, para el único objeto de ser conducida ante la autoridad que correspondiere."}]}, {"id": "N-9f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Fuera de los casos de flagrancia, la policía puede detener sin orden cuando existan sospechas fundadas de participación en un crimen.", "f": "Art. 125 CPP. Orden de funcionario público expresamente facultado por la ley, salvo delito flagrante.", "g": "N", "r": 0, "grp": "125|CPP", "x": [{"c": "Art. 125 CPP", "t": "Artículo 125.- Procedencia de la detención. Ninguna persona podrá ser detenida sino por orden de funcionario público expresamente facultado por la ley y después que dicha orden le fuere intimada en forma legal, a menos que fuere sorprendida en delito flagrante y, en este caso, para el único objeto de ser conducida ante la autoridad que correspondiere."}]}, {"id": "N-10v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Tratándose de faltas, por regla general la única medida cautelar personal procedente es la citación.", "f": "Art. 124 CPP. En faltas o delitos sin pena privativa ni restrictiva de libertad sólo procede la citación.", "g": "N", "r": 1, "grp": "124|CPP", "x": [{"c": "Art. 124 CPP", "t": "Artículo 124. Exclusión de otras medidas. Cuando la imputación se refiriere a faltas, o delitos que la ley no sancionare con penas privativas ni restrictivas de libertad, no se podrán ordenar medidas cautelares que recaigan sobre la libertad del imputado, con excepción de la citación. Lo dispuesto en el inciso anterior no tendrá lugar en los casos a que se refiere el inciso cuarto del artículo 134 o cuando procediere el arresto por falta de comparecencia, la detención o la prisión preventiva de acuerdo a lo dispuesto en el artículo 33."}]}, {"id": "N-10f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Tratándose de faltas, procede cualquiera de las medidas cautelares del artículo 155, pero no la prisión preventiva.", "f": "Art. 124 CPP. En faltas o delitos sin pena privativa ni restrictiva de libertad sólo procede la citación.", "g": "N", "r": 0, "grp": "124|CPP", "x": [{"c": "Art. 124 CPP", "t": "Artículo 124. Exclusión de otras medidas. Cuando la imputación se refiriere a faltas, o delitos que la ley no sancionare con penas privativas ni restrictivas de libertad, no se podrán ordenar medidas cautelares que recaigan sobre la libertad del imputado, con excepción de la citación. Lo dispuesto en el inciso anterior no tendrá lugar en los casos a que se refiere el inciso cuarto del artículo 134 o cuando procediere el arresto por falta de comparecencia, la detención o la prisión preventiva de acuerdo a lo dispuesto en el artículo 33."}]}, {"id": "N-11", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "Transcurridos seis meses desde que se ordenó la prisión preventiva o desde el último debate oral sobre ella, el tribunal debe:", "f": "Art. 145 CPP. Revisión de oficio en audiencia cada seis meses.", "g": "N", "i": [], "a": ["Remitir los antecedentes a la Corte de Apelaciones", "Citar de oficio a una audiencia para considerar su cesación o prolongación", "Dejarla sin efecto de pleno derecho", "Sustituirla por arresto domiciliario total"], "r": 1, "grp": "145|CPP", "x": [{"c": "Art. 145 CPP", "t": "Artículo 145.- Substitución de la prisión preventiva y revisión de oficio. En cualquier momento del procedimiento el tribunal, de oficio o a petición de parte, podrá substituir la prisión preventiva por alguna de las medidas que se contemplan en las disposiciones del Párrafo 6º de este Título. Transcurridos seis meses desde que se hubiere ordenado la prisión preventiva o desde el último debate oral en que ella se hubiere decidido, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}]}, {"id": "N-12v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El tribunal debe citar de oficio a audiencia para considerar el término de la prisión preventiva cuando su duración alcance la mitad de la pena privativa de libertad que se pudiere esperar.", "f": "Art. 152 CPP. Mitad de la pena que se pudiere esperar o de la impuesta con recursos pendientes.", "g": "N", "r": 1, "grp": "152|CPP", "x": [{"c": "Art. 152 CPP", "t": "Artículo 152.- Límites temporales de la prisión preventiva. El tribunal, de oficio o a petición de cualquiera de los intervinientes, decretará la terminación de la prisión preventiva cuando no subsistieren los motivos que la hubieren justificado. En todo caso, cuando la duración de la prisión preventiva hubiere alcanzado la mitad de la pena privativa de libertad que se pudiere esperar en el evento de dictarse sentencia condenatoria, o de la que se hubiere impuesto existiendo recursos pendientes, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}]}, {"id": "N-12f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El tribunal debe citar de oficio a audiencia para considerar el término de la prisión preventiva cuando su duración alcance un tercio de la pena privativa de libertad que se pudiere esperar.", "f": "Art. 152 CPP. Mitad de la pena que se pudiere esperar o de la impuesta con recursos pendientes.", "g": "N", "r": 0, "grp": "152|CPP", "x": [{"c": "Art. 152 CPP", "t": "Artículo 152.- Límites temporales de la prisión preventiva. El tribunal, de oficio o a petición de cualquiera de los intervinientes, decretará la terminación de la prisión preventiva cuando no subsistieren los motivos que la hubieren justificado. En todo caso, cuando la duración de la prisión preventiva hubiere alcanzado la mitad de la pena privativa de libertad que se pudiere esperar en el evento de dictarse sentencia condenatoria, o de la que se hubiere impuesto existiendo recursos pendientes, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}]}, {"id": "N-13v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La apelación contra la resolución que niega, sustituye o revoca la prisión preventiva en los delitos del inciso segundo del artículo 149 debe interponerse en la misma audiencia.", "f": "Art. 149 CPP. Debe interponerse en la misma audiencia y goza de preferencia.", "g": "N", "r": 1, "grp": "149|CPP", "x": [{"c": "Art. 149 CPP", "t": "… Gendarmería de Chile, en el ejercicio de sus funciones, el imputado que hubiere sido puesto a disposición del tribunal en calidad de detenido o se encontrare en prisión preventiva no podrá ser puesto en libertad mientras no se encontrare ejecutoriada la resolución que negare, sustituyere o revocare la prisión preventiva. El recurso de apelación contra esta resolución deberá interponerse en la misma audiencia, gozará de preferencia para su vista y fallo y será agregado extraordinariamente a la tabla el mismo día de su ingreso al Tribunal de Alzada, o a más tardar a la del día siguiente hábil. Cada Corte de Apelaciones deberá establecer una sala de turno que conozca estas apelaciones en días feriados. …"}]}, {"id": "N-13f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "La apelación contra la resolución que niega, sustituye o revoca la prisión preventiva en los delitos del inciso segundo del artículo 149 debe interponerse por escrito dentro de quinto día.", "f": "Art. 149 CPP. Debe interponerse en la misma audiencia y goza de preferencia.", "g": "N", "r": 0, "grp": "149|CPP", "x": [{"c": "Art. 149 CPP", "t": "… Gendarmería de Chile, en el ejercicio de sus funciones, el imputado que hubiere sido puesto a disposición del tribunal en calidad de detenido o se encontrare en prisión preventiva no podrá ser puesto en libertad mientras no se encontrare ejecutoriada la resolución que negare, sustituyere o revocare la prisión preventiva. El recurso de apelación contra esta resolución deberá interponerse en la misma audiencia, gozará de preferencia para su vista y fallo y será agregado extraordinariamente a la tabla el mismo día de su ingreso al Tribunal de Alzada, o a más tardar a la del día siguiente hábil. Cada Corte de Apelaciones deberá establecer una sala de turno que conozca estas apelaciones en días feriados. …"}]}, {"id": "N-14", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "¿Cuál de las siguientes NO es una medida cautelar personal del artículo 155?", "f": "Art. 155 CPP. El catálogo del art. 155 no contempla la suspensión de licencia.", "g": "N", "i": [], "a": ["La prohibición de salir del país, de la localidad en la cual residiere o del ámbito territorial que fijare el tribunal", "La privación de libertad, total o parcial, en su casa o en la que el propio imputado señalare", "La prohibición de aproximarse al ofendido o su familia", "La suspensión de la licencia de conducir por el tiempo que dure la investigación"], "r": 3, "grp": "155|CPP", "x": [{"c": "Art. 155 CPP", "t": "… Para garantizar el éxito de las diligencias de investigación o la seguridad de la sociedad, proteger al ofendido o asegurar la comparecencia del imputado a las actuaciones del procedimiento o ejecución de la sentencia, después de formalizada la investigación el tribunal, a petición del fiscal, del querellante o la víctima, podrá imponer al imputado una o más de las siguientes medidas: a) La privación de libertad, total o parcial, en su Art. casa o en la que el propio imputado señalare, si aquélla se encontrare fuera de la ciudad asiento del tribunal; b) La sujeción a la vigilancia de una persona o institución determinada, las que informarán periódicamente al juez; c) La obligación de presentarse periódicamente ante el juez o ante la autoridad que él designare; …"}]}, {"id": "N-15", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Las presentaciones escritas deben ser resueltas por el tribunal:", "f": "Art. 38 CPP. Veinticuatro horas siguientes a su recepción.", "g": "N", "i": [], "a": ["En la audiencia más próxima", "Dentro de cuarenta y ocho horas", "Dentro de tercero día", "Antes de las veinticuatro horas siguientes a su recepción"], "r": 3, "grp": "38|CPP", "x": [{"c": "Art. 38 CPP", "t": "Artículo 38.- Plazos generales para dictar las resoluciones. Las cuestiones debatidas en una audiencia deberán ser resueltas en ella. Las presentaciones escritas serán resueltas por el tribunal antes de las veinticuatro horas siguientes a su recepción. Párrafo 6°. Registro de las actuaciones judiciales"}]}, {"id": "N-16v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Los registros de las actuaciones judiciales son públicos, en todo caso, transcurridos cinco años desde la realización de las actuaciones.", "f": "Art. 44 CPP. Cinco años.", "g": "N", "r": 1, "grp": "44|CPP", "x": [{"c": "Art. 44 CPP", "t": "… Los registros podrán también ser consultados por terceros cuando dieren cuenta de actuaciones que fueren públicas de acuerdo con la ley, a menos que, durante la investigación o la tramitación de la causa, el tribunal restringiere el acceso para evitar que se afecte su normal substanciación o el principio de inocencia. En todo caso, los registros serán públicos transcurridos cinco años desde la realización de las actuaciones consignadas en ellos. A petición de un interviniente o de cualquier persona, el funcionario competente del tribunal expedirá copias fieles de los registros o de la parte de ellos que fuere pertinente, con sujeción a lo dispuesto en los incisos anteriores. Además dicho funcionario certificará si se hubieren deducido recursos en contra de la sentencia definitiva. …"}]}, {"id": "N-16f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Los registros de las actuaciones judiciales son públicos, en todo caso, transcurridos diez años desde la realización de las actuaciones.", "f": "Art. 44 CPP. Cinco años.", "g": "N", "r": 0, "grp": "44|CPP", "x": [{"c": "Art. 44 CPP", "t": "… Los registros podrán también ser consultados por terceros cuando dieren cuenta de actuaciones que fueren públicas de acuerdo con la ley, a menos que, durante la investigación o la tramitación de la causa, el tribunal restringiere el acceso para evitar que se afecte su normal substanciación o el principio de inocencia. En todo caso, los registros serán públicos transcurridos cinco años desde la realización de las actuaciones consignadas en ellos. A petición de un interviniente o de cualquier persona, el funcionario competente del tribunal expedirá copias fieles de los registros o de la parte de ellos que fuere pertinente, con sujeción a lo dispuesto en los incisos anteriores. Además dicho funcionario certificará si se hubieren deducido recursos en contra de la sentencia definitiva. …"}]}, {"id": "N-17", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Quien se vio impedido de ejercer un derecho dentro de plazo por un hecho que no le es imputable debe solicitar un nuevo plazo dentro de:", "f": "Art. 17 CPP. Cinco días desde que cesó el impedimento.", "g": "N", "i": [], "a": ["Los cinco días siguientes a aquel en que hubiere cesado el impedimento", "Los tres días siguientes a aquel en que hubiere cesado el impedimento", "Los diez días siguientes al vencimiento del plazo original", "Las veinticuatro horas siguientes al cese del impedimento"], "r": 0, "grp": "17|CPP", "x": [{"c": "Art. 17 CPP", "t": "Artículo 17.- Nuevo plazo. El que, por un hecho que no le fuere imputable, por defecto en la notificación, por fuerza mayor o por caso fortuito, se hubiere visto impedido de ejercer un derecho o desarrollar una actividad dentro del plazo establecido por la ley, podrá solicitar al tribunal un nuevo plazo, que le podrá ser otorgado por el mismo período. Dicha solicitud deberá formularse dentro de los cinco días siguientes a aquél en que hubiere cesado el impedimento."}]}, {"id": "N-18v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Los intervinientes pueden renunciar, total o parcialmente, a los plazos establecidos a su favor, por manifestación expresa.", "f": "Art. 18 CPP. Renuncia total o parcial por manifestación expresa.", "g": "N", "r": 1, "grp": "18|CPP", "x": [{"c": "Art. 18 CPP", "t": "Artículo 18.- Renuncia de plazos. Los intervinientes en el procedimiento podrán renunciar, total o parcialmente, a los plazos establecidos a su favor, por manifestación expresa. Si el plazo fuere común, la abreviación o la renuncia requerirán el consentimiento de todos los intervinientes y la aprobación del tribunal. Párrafo 2º Comunicaciones entre autoridades"}]}, {"id": "N-18f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Los plazos establecidos a favor de los intervinientes son irrenunciables.", "f": "Art. 18 CPP. Renuncia total o parcial por manifestación expresa.", "g": "N", "r": 0, "grp": "18|CPP", "x": [{"c": "Art. 18 CPP", "t": "Artículo 18.- Renuncia de plazos. Los intervinientes en el procedimiento podrán renunciar, total o parcialmente, a los plazos establecidos a su favor, por manifestación expresa. Si el plazo fuere común, la abreviación o la renuncia requerirán el consentimiento de todos los intervinientes y la aprobación del tribunal. Párrafo 2º Comunicaciones entre autoridades"}]}, {"id": "N-19", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Son intervinientes en el procedimiento penal:", "f": "Art. 12 CPP. Enumeración del art. 12.", "g": "N", "i": [], "a": ["El juez, el fiscal, el imputado y el defensor", "El fiscal, el imputado, el defensor y los testigos", "El fiscal, el imputado, el defensor, la víctima, el querellante y la policía", "El fiscal, el imputado, el defensor, la víctima y el querellante"], "r": 3, "grp": "12|CPP", "x": [{"c": "Art. 12 CPP", "t": "Artículo 12.- Intervinientes. Para los efectos regulados en este Código, se considerará intervinientes en el procedimiento al fiscal, al imputado, al defensor, a la víctima y al querellante, desde que realizaren cualquier actuación procesal o desde el momento en que la ley les permitiere ejercer facultades determinadas."}]}, {"id": "N-20", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "¿Cuál de los siguientes es un delito de acción privada?", "f": "Art. 55 CPP. Acción privada: calumnia e injuria, falta del art. 496 N° 11, provocación a duelo y matrimonio de menor sin consentimiento. Las demás son de previa instancia particular (art. 54).", "g": "N", "i": [], "a": ["La violación de domicilio", "Las lesiones menos graves", "Las amenazas de los artículos 296 y 297 del Código Penal", "La calumnia y la injuria"], "r": 3, "grp": "55|CPP", "x": [{"c": "Art. 55 CPP", "t": "Artículo 55.- Delitos de acción privada. No podrán ser ejercidas por otra persona que la víctima, las acciones que nacen de los siguientes delitos: a) La calumnia y la injuria; b) La falta descrita en el número 11 del artículo 496 del Código Penal; c) La provocación a duelo y el denuesto o descrédito público por no haberlo aceptado, y d) El matrimonio del menor llevado a efecto sin el consentimiento de las personas designadas por la ley y celebrado de acuerdo con el funcionario llamado a autorizarlo."}]}, {"id": "N-21", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "¿Cuál de los siguientes delitos requiere instancia particular previa?", "f": "Art. 54 CPP. Letra b).", "g": "N", "i": [], "a": ["La receptación", "La violación de domicilio", "El robo por sorpresa", "El hurto simple"], "r": 1, "grp": "54|CPP", "x": [{"c": "Art. 54 CPP", "t": "… En los delitos de acción pública previa instancia particular no podrá procederse de oficio sin que, a lo menos, el ofendido por el delito hubiere denunciado el hecho a la justicia, al ministerio público o a la policía. Tales delitos son: a) Las lesiones previstas en los artículos 399 y 494, número 5º, del Código Penal; b) La violación de domicilio; c) La violación de secretos prevista en los artículos 231 y 247, inciso segundo, del Código Penal; d) Las amenazas previstas en los artículos 296 y 297 del Código Penal; e) Los previstos en la ley N° 19.039, que establece normas aplicables a los privilegios industriales y protección de los derechos de propiedad industrial; …"}]}, {"id": "N-22v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La acción penal pública no se extingue por la renuncia de la persona ofendida.", "f": "Art. 56 CPP. La renuncia extingue la acción privada y la civil, no la pública.", "g": "N", "r": 1, "grp": "56|CPP", "x": [{"c": "Art. 56 CPP", "t": "Artículo 56.- Renuncia de la acción penal. La acción penal pública no se extingue por la renuncia de la persona ofendida. Pero se extinguen por esa renuncia la acción penal privada y la civil derivada de cualquier clase de delitos. Si el delito es de aquellos que no pueden ser perseguidos sin previa instancia particular, la renuncia de la víctima a denunciarlo extinguirá la acción penal, salvo que se tratare de delito perpetrado contra menores de edad. Esta renuncia no la podrá realizar el ministerio público."}]}, {"id": "N-22f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La acción penal pública se extingue por la renuncia expresa de la persona ofendida.", "f": "Art. 56 CPP. La renuncia extingue la acción privada y la civil, no la pública.", "g": "N", "r": 0, "grp": "56|CPP", "x": [{"c": "Art. 56 CPP", "t": "Artículo 56.- Renuncia de la acción penal. La acción penal pública no se extingue por la renuncia de la persona ofendida. Pero se extinguen por esa renuncia la acción penal privada y la civil derivada de cualquier clase de delitos. Si el delito es de aquellos que no pueden ser perseguidos sin previa instancia particular, la renuncia de la víctima a denunciarlo extinguirá la acción penal, salvo que se tratare de delito perpetrado contra menores de edad. Esta renuncia no la podrá realizar el ministerio público."}]}, {"id": "N-23v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si respecto de un delito de acción privada sólo se ejerce la acción civil, se considera extinguida la acción penal.", "f": "Art. 66 CPP. Se considera extinguida por esa circunstancia.", "g": "N", "r": 1, "grp": "66|CPP", "x": [{"c": "Art. 66 CPP", "t": "Artículo 66.- Efectos del ejercicio exclusivo de la acción civil. Cuando sólo se ejerciere la acción civil respecto de un hecho punible de acción privada se considerará extinguida, por esa circunstancia, la acción penal. Para estos efectos no constituirá ejercicio de la acción civil la solicitud de diligencias destinadas a preparar la demanda civil o a asegurar su resultado, que se formulare en el procedimiento penal."}]}, {"id": "N-23f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si respecto de un delito de acción privada sólo se ejerce la acción civil, la acción penal queda suspendida hasta el fallo civil.", "f": "Art. 66 CPP. Se considera extinguida por esa circunstancia.", "g": "N", "r": 0, "grp": "66|CPP", "x": [{"c": "Art. 66 CPP", "t": "Artículo 66.- Efectos del ejercicio exclusivo de la acción civil. Cuando sólo se ejerciere la acción civil respecto de un hecho punible de acción privada se considerará extinguida, por esa circunstancia, la acción penal. Para estos efectos no constituirá ejercicio de la acción civil la solicitud de diligencias destinadas a preparar la demanda civil o a asegurar su resultado, que se formulare en el procedimiento penal."}]}, {"id": "N-24", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "La querella puede presentarse:", "f": "Art. 112 CPP. Hasta el cierre de la investigación.", "g": "N", "i": [], "a": ["Hasta la audiencia de preparación del juicio oral", "Hasta quince días antes de la audiencia de preparación del juicio oral", "Sólo hasta la formalización de la investigación", "En cualquier momento, mientras el fiscal no declare cerrada la investigación"], "r": 3, "grp": "112|CPP", "x": [{"c": "Art. 112 CPP", "t": "Artículo 112.- Oportunidad para presentar la querella. La querella podrá presentarse en cualquier momento, mientras el fiscal no declarare cerrada la investigación. Admitida a tramitación, el juez la remitirá al ministerio público y el querellante podrá hacer uso de los derechos que le confiere el artículo 261."}]}, {"id": "N-25", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "El plazo que el juez de garantía otorga al querellante para subsanar los defectos formales de la querella es de:", "f": "Art. 114 CPP. Tres días.", "g": "N", "i": [], "a": ["Veinticuatro horas", "Diez días", "Tres días", "Cinco días"], "r": 2, "grp": "114|CPP", "x": [{"c": "Art. 114 CPP", "t": "Artículo 114.- Inadmisibilidad de la querella. La querella no será admitida a tramitación por el juez de garantía: a) Cuando fuere presentada extemporáneamente, de acuerdo a lo establecido en el artículo 112; b) Cuando, habiéndose otorgado por el juez de garantía un plazo de tres días para subsanar los defectos que presentare por falta de alguno de los requisitos señalados en el artículo 113, el querellante no realizare las modificaciones pertinentes dentro de dicho plazo; c) Cuando los hechos expuestos en ella no fueren constitutivos de delito; d) Cuando de los antecedentes contenidos en ella apareciere de manifiesto que la responsabilidad penal del imputado se encuentra extinguida. En este caso, la declaración de inadmisibilidad se realizará previa citación del ministerio público, y e) Cuando se dedujere por persona no autorizada por la ley."}]}, {"id": "N-26", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "¿Cuál de las siguientes NO es causal de abandono de la querella?", "f": "Art. 120 CPP. Letras a), b) y c) del art. 120.", "g": "N", "i": [], "a": ["No concurrir a la audiencia del juicio oral o ausentarse de ella sin autorización del tribunal", "No asistir a la audiencia de preparación del juicio oral sin causa debidamente justificada", "No adherir a la acusación fiscal ni acusar particularmente en la oportunidad correspondiente", "No ofrecer prueba testimonial en la acusación particular"], "r": 3, "grp": "120|CPP", "x": [{"c": "Art. 120 CPP", "t": "Artículo 120.- Abandono de la querella. El tribunal, de oficio o a petición de cualquiera de los intervinientes, declarará abandonada la querella por quien la hubiere interpuesto: a) Cuando no adhiriere a la acusación fiscal o no acusare particularmente en la oportunidad que correspondiere; b) Cuando no asistiere a la audiencia de preparación del juicio oral sin causa debidamente justificada, y c) Cuando no concurriere a la audiencia del juicio oral o se ausentare de ella sin autorización del tribunal. La resolución que declarare el abandono de la querella será apelable, sin que en la tramitación del recurso pueda disponerse la suspensión del procedimiento. La resolución que negare lugar al abandono será inapelable."}]}, {"id": "N-27v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Procede declarar rebelde al imputado cuando, decretada judicialmente su detención o prisión preventiva, no fuere habido.", "f": "Art. 99 CPP. Causales de las letras a) y b) del art. 99.", "g": "N", "r": 1, "grp": "99|CPP", "x": [{"c": "Art. 99 CPP", "t": "Artículo 99.- Causales de rebeldía. El imputado será declarado rebelde: a) Cuando, decretada judicialmente su detención o prisión preventiva, no fuere habido, o b) Cuando, habiéndose formalizado la investigación en contra del que estuviere en país extranjero, no fuere posible obtener su extradición."}]}, {"id": "N-27f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Procede declarar rebelde al imputado cuando no comparece a la citación del fiscal.", "f": "Art. 99 CPP. Causales de las letras a) y b) del art. 99.", "g": "N", "r": 0, "grp": "99|CPP", "x": [{"c": "Art. 99 CPP", "t": "Artículo 99.- Causales de rebeldía. El imputado será declarado rebelde: a) Cuando, decretada judicialmente su detención o prisión preventiva, no fuere habido, o b) Cuando, habiéndose formalizado la investigación en contra del que estuviere en país extranjero, no fuere posible obtener su extradición."}]}, {"id": "N-28v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el defensor no está presente, las preguntas de la policía al imputado se limitan a constatar su identidad.", "f": "Art. 91 CPP. Sin defensor, sólo identidad; si quiere declarar, ante el fiscal o con su autorización.", "g": "N", "r": 1, "grp": "91|CPP", "x": [{"c": "Art. 91 CPP", "t": "Artículo 91.- Declaraciones del imputado ante la policía. La policía sólo podrá interrogar autónomamente al imputado en presencia de su defensor. Si éste no estuviere presente durante el interrogatorio, las preguntas se limitarán a constatar la identidad del sujeto. Si, en ausencia del defensor, el imputado manifestare su deseo de declarar, la policía tomará las medidas necesarias para que declare inmediatamente ante el fiscal. Si esto no fuere posible, la policía podrá consignar las declaraciones que se allanare a prestar, bajo la responsabilidad y con la autorización del fiscal. El defensor podrá incorporarse siempre y en cualquier momento a esta diligencia."}]}, {"id": "N-28f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el defensor no está presente, la policía puede interrogar al imputado previa lectura de sus derechos.", "f": "Art. 91 CPP. Sin defensor, sólo identidad; si quiere declarar, ante el fiscal o con su autorización.", "g": "N", "r": 0, "grp": "91|CPP", "x": [{"c": "Art. 91 CPP", "t": "Artículo 91.- Declaraciones del imputado ante la policía. La policía sólo podrá interrogar autónomamente al imputado en presencia de su defensor. Si éste no estuviere presente durante el interrogatorio, las preguntas se limitarán a constatar la identidad del sujeto. Si, en ausencia del defensor, el imputado manifestare su deseo de declarar, la policía tomará las medidas necesarias para que declare inmediatamente ante el fiscal. Si esto no fuere posible, la policía podrá consignar las declaraciones que se allanare a prestar, bajo la responsabilidad y con la autorización del fiscal. El defensor podrá incorporarse siempre y en cualquier momento a esta diligencia."}]}, {"id": "N-29v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La declaración del imputado no puede recibirse bajo juramento.", "f": "Art. 98 CPP. El juez se limita a exhortarlo a decir verdad.", "g": "N", "r": 1, "grp": "98|CPP", "x": [{"c": "Art. 98 CPP", "t": "… Durante todo el procedimiento y en cualquiera de sus etapas el imputado tendrá siempre derecho a prestar declaración, como un medio de defenderse de la imputación que se le dirigiere. La declaración judicial del imputado se prestará en audiencia a la cual podrán concurrir los intervinientes en el procedimiento, quienes deberán ser citados al efecto. La declaración del imputado no podrá recibirse bajo juramento. El juez o, en su caso, el presidente del tribunal, se limitará a exhortarlo a que diga la verdad y a que responda con claridad y precisión las preguntas que se le formularen. Regirá, correspondientemente, lo dispuesto en el artículo 326. Si con ocasión de su declaración judicial, el imputado o su defensor solicitaren la práctica de diligencias de investigación, el juez podrá recomendar al ministerio público la realización de las mismas, cuando lo considerare necesario para el ejercicio de la …"}]}, {"id": "N-29f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "La declaración judicial del imputado se recibe bajo juramento o promesa de decir verdad.", "f": "Art. 98 CPP. El juez se limita a exhortarlo a decir verdad.", "g": "N", "r": 0, "grp": "98|CPP", "x": [{"c": "Art. 98 CPP", "t": "… Durante todo el procedimiento y en cualquiera de sus etapas el imputado tendrá siempre derecho a prestar declaración, como un medio de defenderse de la imputación que se le dirigiere. La declaración judicial del imputado se prestará en audiencia a la cual podrán concurrir los intervinientes en el procedimiento, quienes deberán ser citados al efecto. La declaración del imputado no podrá recibirse bajo juramento. El juez o, en su caso, el presidente del tribunal, se limitará a exhortarlo a que diga la verdad y a que responda con claridad y precisión las preguntas que se le formularen. Regirá, correspondientemente, lo dispuesto en el artículo 326. Si con ocasión de su declaración judicial, el imputado o su defensor solicitaren la práctica de diligencias de investigación, el juez podrá recomendar al ministerio público la realización de las mismas, cuando lo considerare necesario para el ejercicio de la …"}]}, {"id": "N-30", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Las personas obligadas a denunciar deben hacerlo dentro de:", "f": "Art. 176 CPP. Veinticuatro horas.", "g": "N", "i": [], "a": ["Los tres días siguientes al hecho", "Los cinco días siguientes al momento en que tomaren conocimiento del hecho criminal", "Las cuarenta y ocho horas siguientes al momento en que tomaren conocimiento del hecho criminal", "Las veinticuatro horas siguientes al momento en que tomaren conocimiento del hecho criminal"], "r": 3, "grp": "176|CPP", "x": [{"c": "Art. 176 CPP", "t": "Artículo 176.- Plazo para efectuar la denuncia. Las personas indicadas en el artículo anterior deberán hacer la denuncia dentro de las veinticuatro horas siguientes al momento en que tomaren conocimiento del hecho criminal. Respecto de los capitanes de naves o de aeronaves, este plazo se contará desde que arribaren a cualquier puerto o aeropuerto de la República."}]}, {"id": "N-31", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El fiscal puede disponer que determinadas actuaciones, registros o documentos se mantengan en secreto respecto del imputado o de los demás intervinientes por un plazo no superior a:", "f": "Art. 182 CPP. Cuarenta días, ampliable por el mismo período por una sola vez con motivos fundados.", "g": "N", "i": [], "a": ["Sesenta días", "Veinte días", "Noventa días", "Cuarenta días"], "r": 3, "grp": "182|CPP", "x": [{"c": "Art. 182 CPP", "t": "… El fiscal podrá disponer que determinadas actuaciones, Art. registros o documentos sean mantenidas en secreto respecto del imputado o de los demás intervinientes, cuando lo considerare necesario para la eficacia de la investigación. En tal caso deberá identificar las piezas o actuaciones respectivas, de modo que no se vulnere la reserva y fijar un plazo no superior a cuarenta días para la mantención del secreto, el cual podrá ser ampliado por el mismo período, por una sola vez, con motivos fundados. Esta ampliación no será oponible ni al imputado ni a su defensa. El imputado o cualquier otro interviniente podrá solicitar del juez de garantía que ponga término al secreto o que lo limite, en cuanto a su duración, a las piezas o actuaciones abarcadas por él, o a las personas a quienes afectare. …"}]}, {"id": "N-32", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Para archivar provisionalmente una investigación por un delito que merece pena aflictiva, el fiscal debe:", "f": "Art. 167 CPP. Aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial.", "g": "N", "i": [], "a": ["Someter la decisión a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial", "Someter la decisión a la aprobación del juez de garantía", "Comunicarla al Fiscal Nacional", "Obtener la conformidad de la víctima"], "r": 0, "grp": "167|CPP", "x": [{"c": "Art. 167 CPP", "t": "Artículo 167.- Archivo provisional. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}]}, {"id": "N-33v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La decisión de no iniciar investigación debe ser siempre fundada y someterse a la aprobación del juez de garantía.", "f": "Art. 168 CPP. Aprobación del juez de garantía.", "g": "N", "r": 1, "grp": "168|CPP", "x": [{"c": "Art. 168 CPP", "t": "Artículo 168.- Facultad para no iniciar investigación. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el fiscal podrá abstenerse de toda investigación, cuando los hechos relatados en la denuncia no fueren constitutivos de delito o cuando los antecedentes y datos suministrados permitieren establecer que se encuentra extinguida la responsabilidad penal del imputado. Esta decisión será siempre fundada y se someterá a la aprobación del juez de garantía."}]}, {"id": "N-33f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La decisión de no iniciar investigación debe someterse a la aprobación del Fiscal Regional.", "f": "Art. 168 CPP. Aprobación del juez de garantía.", "g": "N", "r": 0, "grp": "168|CPP", "x": [{"c": "Art. 168 CPP", "t": "Artículo 168.- Facultad para no iniciar investigación. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el fiscal podrá abstenerse de toda investigación, cuando los hechos relatados en la denuncia no fueren constitutivos de delito o cuando los antecedentes y datos suministrados permitieren establecer que se encuentra extinguida la responsabilidad penal del imputado. Esta decisión será siempre fundada y se someterá a la aprobación del juez de garantía."}]}, {"id": "N-34v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El principio de oportunidad no procede respecto del imputado que hubiere sido beneficiado con él dentro de los dos años anteriores al hecho.", "f": "Art. 170 CPP. Dos años anteriores, contados desde la resolución que lo tuvo por comunicado.", "g": "N", "r": 1, "grp": "170|CPP", "x": [{"c": "Art. 170 CPP", "t": "… el interés público, a menos que la pena mínima asignada al delito excediere la de presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. Tampoco procederá el ejercicio de esta facultad respecto del imputado que hubiere sido beneficiado con ella dentro de los dos años anteriores al hecho de que se trate, contados desde la resolución que lo tuvo por comunicado. El ejercicio de esta facultad se regulará mediante instrucciones generales dictadas por el Ministerio Público, con el objetivo de establecer un uso racional de la misma. Para estos efectos, el fiscal deberá emitir una decisión motivada, la que comunicará al juez de garantía. …"}]}, {"id": "N-34f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El principio de oportunidad no procede respecto del imputado que hubiere sido beneficiado con él dentro de los cinco años anteriores al hecho.", "f": "Art. 170 CPP. Dos años anteriores, contados desde la resolución que lo tuvo por comunicado.", "g": "N", "r": 0, "grp": "170|CPP", "x": [{"c": "Art. 170 CPP", "t": "… el interés público, a menos que la pena mínima asignada al delito excediere la de presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. Tampoco procederá el ejercicio de esta facultad respecto del imputado que hubiere sido beneficiado con ella dentro de los dos años anteriores al hecho de que se trate, contados desde la resolución que lo tuvo por comunicado. El ejercicio de esta facultad se regulará mediante instrucciones generales dictadas por el Ministerio Público, con el objetivo de establecer un uso racional de la misma. Para estos efectos, el fiscal deberá emitir una decisión motivada, la que comunicará al juez de garantía. …"}]}, {"id": "N-35", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El principio de oportunidad no puede ejercerse cuando la pena mínima asignada al delito excede de:", "f": "Art. 170 CPP. Límite: presidio o reclusión menores en su grado mínimo.", "g": "N", "i": [], "a": ["Prisión en su grado máximo", "Presidio o reclusión menores en su grado medio", "Presidio o reclusión menores en su grado mínimo", "Presidio o reclusión menores en su grado máximo"], "r": 2, "grp": "170|CPP", "x": [{"c": "Art. 170 CPP", "t": "Artículo 170.- Principio de oportunidad. Los fiscales del ministerio público podrán no iniciar la persecución penal o abandonar la ya iniciada cuando se tratare de un hecho que no comprometiere gravemente el interés público, a menos que la pena mínima asignada al delito excediere la de presidio o reclusión menores en su grado mínimo o que se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. Tampoco procederá el ejercicio de esta facultad respecto del imputado que hubiere sido beneficiado con ella dentro de los dos años anteriores al hecho de que se trate, contados desde la resolución que lo tuvo por comunicado. El ejercicio de esta facultad se regulará mediante Art. …"}]}, {"id": "N-36", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "¿Cuál de los siguientes NO es un efecto de la formalización de la investigación?", "f": "Art. 233 CPP. Efectos de las letras a), b) y c) del art. 233.", "g": "N", "i": [], "a": ["Suspende el curso de la prescripción de la acción penal", "Interrumpe la prescripción de la pena", "Comienza a correr el plazo del artículo 247", "El Ministerio Público pierde la facultad de archivar provisionalmente el procedimiento"], "r": 1, "grp": "233|CPP", "x": [{"c": "Art. 233 CPP", "t": "Artículo 233.- Efectos de la formalización de la investigación. La formalización de la investigación producirá los siguientes efectos: a) Suspenderá el curso de la prescripción de la acción penal en conformidad a lo dispuesto en el artículo 96 del Código Penal; b) Comenzará a correr el plazo previsto en el artículo 247, y c) El ministerio público perderá la facultad de archivar provisionalmente el procedimiento."}]}, {"id": "N-37", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La suspensión condicional del procedimiento exige que la pena que pudiere imponerse en caso de condena no exceda de:", "f": "Art. 237 CPP. Letra a) del art. 237.", "g": "N", "i": [], "a": ["Dos años de privación de libertad", "Quinientos cuarenta días de privación de libertad", "Cinco años de privación de libertad", "Tres años de privación de libertad"], "r": 3, "grp": "237|CPP", "x": [{"c": "Art. 237 CPP", "t": "… El fiscal, con el acuerdo del imputado, podrá solicitar al juez de garantía la suspensión condicional del procedimiento. El juez podrá requerir del ministerio público los antecedentes que estimare necesarios para resolver. La suspensión condicional del procedimiento podrá Art. a) decretarse: a) Si la pena que pudiere imponerse al imputado, en el evento de dictarse sentencia condenatoria, no excediere de tres años de privación de libertad; b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. …"}]}, {"id": "N-38v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El plazo de observación de la suspensión condicional del procedimiento no puede ser inferior a un año ni superior a tres.", "f": "Art. 237 CPP. No inferior a un año ni superior a tres.", "g": "N", "r": 1, "grp": "237|CPP", "x": [{"c": "Art. 237 CPP", "t": "… fiscal deberá someter su decisión de solicitar la suspensión condicional del procedimiento al Fiscal Regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Al decretar la suspensión condicional del procedimiento, el juez de garantía establecerá las condiciones a las que deberá someterse el imputado, por el plazo que determine, el que no podrá ser inferior a un año ni superior a tres. Durante dicho período no se reanudará el curso de la prescripción de la acción penal. Asimismo, durante el término por el que se prolongare la suspensión condicional del procedimiento se suspenderá el plazo previsto en el artículo 247. La resolución que se pronunciare acerca de la Art. …"}]}, {"id": "N-38f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "El plazo de observación de la suspensión condicional del procedimiento no puede ser inferior a seis meses ni superior a dos años.", "f": "Art. 237 CPP. No inferior a un año ni superior a tres.", "g": "N", "r": 0, "grp": "237|CPP", "x": [{"c": "Art. 237 CPP", "t": "… fiscal deberá someter su decisión de solicitar la suspensión condicional del procedimiento al Fiscal Regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Al decretar la suspensión condicional del procedimiento, el juez de garantía establecerá las condiciones a las que deberá someterse el imputado, por el plazo que determine, el que no podrá ser inferior a un año ni superior a tres. Durante dicho período no se reanudará el curso de la prescripción de la acción penal. Asimismo, durante el término por el que se prolongare la suspensión condicional del procedimiento se suspenderá el plazo previsto en el artículo 247. La resolución que se pronunciare acerca de la Art. …"}]}, {"id": "N-39v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La presencia del defensor en la audiencia en que se ventila la suspensión condicional del procedimiento es requisito de validez de la misma.", "f": "Art. 237 CPP. Requisito de validez.", "g": "N", "r": 1, "grp": "237|CPP", "x": [{"c": "Art. 237 CPP", "t": "… 2 Nº 17 a) condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. La presencia del defensor del imputado en la audiencia en que se ventilare la solicitud de suspensión condicional del procedimiento constituirá un requisito de validez de la misma. Si el querellante o la víctima asistieren a la Art. b) audiencia en que se ventile la solicitud de suspensión condicional del procedimiento, deberán ser oídos por el tribunal. Tratándose de imputados por delitos de homicidio, secuestro, robo con violencia o intimidación en las personas o fuerza en las cosas, sustracción de menores, aborto; …"}]}, {"id": "N-39f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La audiencia de suspensión condicional del procedimiento puede realizarse válidamente sin defensor si el imputado lo consiente.", "f": "Art. 237 CPP. Requisito de validez.", "g": "N", "r": 0, "grp": "237|CPP", "x": [{"c": "Art. 237 CPP", "t": "… 2 Nº 17 a) condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. La presencia del defensor del imputado en la audiencia en que se ventilare la solicitud de suspensión condicional del procedimiento constituirá un requisito de validez de la misma. Si el querellante o la víctima asistieren a la Art. b) audiencia en que se ventile la solicitud de suspensión condicional del procedimiento, deberán ser oídos por el tribunal. Tratándose de imputados por delitos de homicidio, secuestro, robo con violencia o intimidación en las personas o fuerza en las cosas, sustracción de menores, aborto; …"}]}, {"id": "N-40", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Los acuerdos reparatorios sólo pueden referirse a hechos que:", "f": "Art. 241 CPP. Inciso segundo del art. 241.", "g": "N", "i": [], "a": ["Afecten bienes jurídicos disponibles de carácter patrimonial o constituyan faltas", "Tengan asignada una pena no superior a tres años de privación de libertad", "Afecten bienes jurídicos disponibles de carácter patrimonial, consistan en lesiones menos graves o constituyan delitos culposos", "Consistan en lesiones de cualquier clase o delitos culposos"], "r": 2, "grp": "241|CPP", "x": [{"c": "Art. 241 CPP", "t": "… El imputado y la víctima podrán convenir acuerdos reparatorios, los que el juez de garantía aprobará, en audiencia a la que citará a los intervinientes para escuchar sus planteamientos, si verificare que los concurrentes al acuerdo hubieren prestado su consentimiento en forma libre y con pleno conocimiento de sus derechos. Los acuerdos reparatorios sólo podrán referirse a hechos investigados que afectaren bienes jurídicos disponibles de carácter patrimonial, consistieren en lesiones menos graves o constituyeren delitos culposos. Sin perjuicio de lo señalado en los incisos precedentes, los acuerdos reparatorios procederán también respecto de los delitos de los artículos 144 inciso primero, 146, 161-A, 161 B, 231, inciso segundo del 247, 284, 296, 297, 494 Nº 4 y 494 Nº 5, todos del Código Penal. …"}]}, {"id": "N-41", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La suspensión condicional del procedimiento y el acuerdo reparatorio pueden solicitarse y decretarse:", "f": "Art. 245 CPP", "g": "N", "i": [], "a": ["Hasta antes del inicio de la audiencia de juicio oral", "Sólo en la audiencia de formalización de la investigación", "En cualquier momento posterior a la formalización de la investigación; cerrada ésta, sólo durante la audiencia de preparación del juicio oral", "En cualquier momento, incluso antes de la formalización"], "r": 2, "grp": "245|CPP", "x": [{"c": "Art. 245 CPP", "t": "Artículo 245.- Oportunidad para pedir y decretar la suspensión condicional del procedimiento o los acuerdos reparatorios. La suspensión condicional del procedimiento y el acuerdo reparatorio podrán solicitarse y decretarse en cualquier momento posterior a la formalización de la investigación. Si no se planteare en esa misma audiencia la solicitud respectiva, el juez citará a una audiencia, a la que podrán comparecer todos los intervinientes en el procedimiento. Una vez declarado el cierre de la investigación, la suspensión condicional del procedimiento y el acuerdo reparatorio sólo podrán ser decretados durante la audiencia de preparación del juicio oral. Sin perjuicio de lo señalado precedentemente, podrán, excepcionalmente, solicitarse y decretarse la suspensión condicional del procedimiento y los acuerdos reparatorios, aun cuando hubiere finalizado la audiencia de preparación del juicio oral y hasta antes del envío del auto de apertura al tribunal de juicio oral en lo penal. …"}]}, {"id": "N-42", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El plazo legal para cerrar la investigación, contado desde la formalización, es de:", "f": "Art. 247 CPP. Dos años.", "g": "N", "i": [], "a": ["Dieciocho meses", "Tres años", "Dos años", "Un año"], "r": 2, "grp": "247|CPP", "x": [{"c": "Art. 247 CPP", "t": "Artículo 247.- Plazo para declarar el cierre de la investigación. Transcurrido el plazo de dos años desde la fecha en que la investigación hubiere sido formalizada, el fiscal deberá proceder a cerrarla. Si el fiscal no declarare cerrada la investigación en el plazo señalado, el imputado o el querellante podrán solicitar al juez que aperciba al fiscal para que proceda a tal cierre. Para estos efectos, el juez citará a los intervinientes a una audiencia y si el fiscal no compareciere, el juez otorgará un plazo máximo de dos días para que éste se pronuncie, dando cuenta de ello al fiscal regional o el Fiscal Jefe de la Fiscalía Supraterritorial, si corresponde. Transcurrido tal plazo sin que el fiscal se pronuncie o si, compareciendo, se negare a declarar cerrada la investigación, el juez decretará el sobreseimiento definitivo de la causa, informando de ello al fiscal …"}]}, {"id": "N-43", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Cerrada la investigación, el fiscal dispone de diez días para:", "f": "Art. 248 CPP. Letras a), b) y c) del art. 248.", "g": "N", "i": [], "a": ["Solicitar el sobreseimiento, formular acusación o comunicar la decisión de no perseverar", "Formular acusación o archivar provisionalmente", "Formular acusación o solicitar la suspensión condicional del procedimiento", "Solicitar el sobreseimiento o ejercer el principio de oportunidad"], "r": 0, "grp": "248|CPP", "x": [{"c": "Art. 248 CPP", "t": "Artículo 248- Cierre de la investigación. Practicadas las diligencias necesarias para la averiguación del hecho punible y sus autores, cómplices o encubridores, el fiscal declarará cerrada la investigación y podrá, dentro de los diez días siguientes: a) Solicitar el sobreseimiento definitivo o temporal de la causa; b) Formular acusación, cuando estimare que la investigación proporciona fundamento serio para el enjuiciamiento del imputado contra quien se hubiere formalizado la misma, o c) Comunicar la decisión del ministerio público de no perseverar en el procedimiento, por no haberse reunido durante la investigación los antecedentes suficientes para fundar una acusación. La comunicación de la decisión contemplada en la letra c) precedente dejará sin efecto la formalización de la investigación, dará lugar a que el juez revoque las medidas cautelares que se hubieren decretado, y la prescripción de la acción penal continuará corriendo como si nunca se hubiere interrumpido."}]}, {"id": "N-44", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Los intervinientes pueden reiterar la solicitud de diligencias precisas de investigación, para pedir la reapertura, dentro de:", "f": "Art. 257 CPP. Diez días siguientes al cierre.", "g": "N", "i": [], "a": ["Los diez días siguientes al cierre de la investigación", "Los quince días siguientes al cierre de la investigación", "Los tres días siguientes a la acusación", "Los cinco días siguientes al cierre de la investigación"], "r": 0, "grp": "257|CPP", "x": [{"c": "Art. 257 CPP", "t": "Artículo 257. Reapertura de la investigación. Dentro de los diez días siguientes al cierre de la investigación, los intervinientes podrán reiterar la solicitud de diligencias precisas de investigación que oportunamente hubieren formulado durante la investigación y que el Ministerio Público hubiere rechazado o respecto de las cuales no se hubiere pronunciado. El imputado o el querellante podrán solicitar la Art. reapertura de la investigación con el único objeto de pedir la realización de diligencias precisas cuya necesidad de cumplimiento hubiere surgido a raíz de la reformalización de la investigación realizada por el Ministerio Público. Si el juez de garantía acogiere la solicitud a que se refieren los incisos anteriores, ordenará al fiscal reabrir la investigación y proceder al cumplimiento de las diligencias, en el plazo que le fijará. …"}]}, {"id": "N-45", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Por regla general, la entrada y registro en lugares cerrados debe realizarse en el tiempo que media entre:", "f": "Art. 207 CPP. Entre las seis y las veintidós horas, salvo lugares de libre acc
