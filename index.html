ULO TERCERO. DE LAS PENAS. § I. De las penas en general."}]}, {"id": "N-102f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Están exentos de las penas del encubrimiento, sin excepción, los parientes que señala el inciso final del artículo 17.", "f": "Art. 17 CP. La excepción es el N° 1 del art. 17.", "g": "N", "r": 0, "grp": "17|CP", "x": [{"c": "Art. 17 CP", "t": "… suministrándoles auxilios o noticias para que se guarden, precavan o salven. Están exentos de las penas impuestas a los encubridores los que lo sean de su cónyuge, de su conviviente civil, o de sus parientes por consanguinidad o afinidad en toda la línea recta y en la colateral hasta el segundo grado, de sus padres o hijos, con la sola excepción de los que se hallaren comprendidos en el número 1° de este artículo. TÍTULO TERCERO. DE LAS PENAS. § I. De las penas en general."}]}, {"id": "N-103v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las faltas sólo se castigan cuando han sido consumadas.", "f": "Art. 9 CP", "g": "N", "r": 1, "grp": "9|CP", "x": [{"c": "Art. 9 CP", "t": "ART. 9. Las faltas sólo se castigan cuando han sido consumadas. § II. De las circunstancias que eximen de responsabilidad criminal."}]}, {"id": "N-103f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las faltas se castigan desde que hay principio de ejecución.", "f": "Art. 9 CP", "g": "N", "r": 0, "grp": "9|CP", "x": [{"c": "Art. 9 CP", "t": "ART. 9. Las faltas sólo se castigan cuando han sido consumadas. § II. De las circunstancias que eximen de responsabilidad criminal."}]}, {"id": "N-104", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El secuestro se castiga con presidio mayor en su grado mínimo a medio cuando el encierro o detención se prolonga por más de:", "f": "Art. 141 CP. Inciso tercero del art. 141.", "g": "N", "i": [], "a": ["Veinticuatro horas", "Quince días", "Cuarenta y ocho horas", "Setenta y dos horas"], "r": 0, "grp": "141|CP", "x": [{"c": "Art. 141 CP", "t": "… El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}]}, {"id": "N-105v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Quien proporciona lugar para la ejecución del secuestro incurre en la misma pena que el autor.", "f": "Art. 141 CP. Inc. 2°.", "g": "N", "r": 1, "grp": "141|CP", "x": [{"c": "Art. 141 CP", "t": "ART. 141. El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}]}, {"id": "N-105f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Quien proporciona lugar para la ejecución del secuestro es castigado como cómplice.", "f": "Art. 141 CP. Inc. 2°.", "g": "N", "r": 0, "grp": "141|CP", "x": [{"c": "Art. 141 CP", "t": "ART. 141. El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}]}, {"id": "N-106", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La violación de persona menor de catorce años del artículo 362 se castiga con:", "f": "Art. 362 CP. Vigente.", "g": "N", "i": [], "a": ["Presidio mayor en sus grados medio a máximo", "Presidio mayor en cualquiera de sus grados", "Presidio mayor en su grado mínimo a medio", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo"], "r": 0, "grp": "362|CP", "x": [{"c": "Art. 362 CP", "t": "ART. 362. El que accediere carnalmente, por vía vaginal, anal o bucal, a una persona menor de catorce años, será castigado con presidio mayor en sus grados medio a máximo, aunque no concurra circunstancia alguna de las enumeradas en el artículo anterior. § VI. Del estupro y otros delitos sexuales."}]}, {"id": "N-107", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La violación del artículo 361 se castiga con:", "f": "Art. 361 CP", "g": "N", "i": [], "a": ["Presidio mayor en su grado mínimo a medio", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio mayor en su grado medio a máximo", "Presidio mayor en cualquiera de sus grados"], "r": 0, "grp": "361|CP", "x": [{"c": "Art. 361 CP", "t": "ART. 361. La violación será castigada con la pena de presidio mayor en su grado mínimo a medio. Comete violación el que accede carnalmente, por vía, a y vaginal, anal o bucal, a una persona mayor de catorce años, en alguno de los casos siguientes: 1º Cuando se usa de fuerza o intimidación. 2º Cuando la víctima se halla privada de sentido, o cuando se aprovecha su incapacidad para oponerse. 3º Cuando se abusa de la enajenación o trastorno mental de la víctima."}]}, {"id": "N-108v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El estupro supone una víctima menor de dieciocho años pero mayor de catorce.", "f": "Art. 363 CP", "g": "N", "r": 1, "grp": "363|CP", "x": [{"c": "Art. 363 CP", "t": "ART. 363. Será castigado con presidio menor en su grado máximo a presidio mayor en su grado mínimo, el que accediere carnalmente, por vía vaginal, anal o bucal, a una persona menor de edad pero mayor de catorce años, concurriendo cualquiera de las circunstancias siguientes: 1º Cuando se abusa de una anomalía o perturbación b) mental, aun transitoria, de la víctima, que por su menor entidad no sea constitutiva de enajenación o trastorno. 2º Cuando se abusa de una relación de dependencia de la víctima, como en los casos en que el agresor está encargado de su custodia, educación o cuidado, o tiene con ella una relación laboral. 3º Cuando se abusa del grave desamparo en que se encuentra la víctima. 4º Cuando se engaña a la víctima abusando de su inexperiencia o ignorancia sexual."}]}, {"id": "N-108f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El estupro supone una víctima menor de dieciséis años pero mayor de doce.", "f": "Art. 363 CP", "g": "N", "r": 0, "grp": "363|CP", "x": [{"c": "Art. 363 CP", "t": "ART. 363. Será castigado con presidio menor en su grado máximo a presidio mayor en su grado mínimo, el que accediere carnalmente, por vía vaginal, anal o bucal, a una persona menor de edad pero mayor de catorce años, concurriendo cualquiera de las circunstancias siguientes: 1º Cuando se abusa de una anomalía o perturbación b) mental, aun transitoria, de la víctima, que por su menor entidad no sea constitutiva de enajenación o trastorno. 2º Cuando se abusa de una relación de dependencia de la víctima, como en los casos en que el agresor está encargado de su custodia, educación o cuidado, o tiene con ella una relación laboral. 3º Cuando se abusa del grave desamparo en que se encuentra la víctima. 4º Cuando se engaña a la víctima abusando de su inexperiencia o ignorancia sexual."}]}, {"id": "N-109", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Comete infanticidio el padre, la madre o los demás ascendientes que matan al hijo o descendiente dentro de:", "f": "Art. 394 CP", "g": "N", "i": [], "a": ["Las setenta y dos horas después del parto", "Las veinticuatro horas después del parto", "Las cuarenta y ocho horas después del parto", "Los siete días siguientes al parto"], "r": 2, "grp": "394|CP", "x": [{"c": "Art. 394 CP", "t": "ART. 394. Cometen infanticidio el padre, la madre o los demás ascendientes legítimos o ilegítimos que dentro de las cuarenta y ocho horas después del parto, matan al hijo o descendiente, y serán penados con presidio mayor en sus grados mínimo a medio. § III. Lesiones corporales."}]}, {"id": "N-110", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Las lesiones graves del artículo 397 N° 2 son las que producen al ofendido enfermedad o incapacidad para el trabajo por más de:", "f": "Art. 397 CP. N° 2.", "g": "N", "i": [], "a": ["Quince días", "Sesenta días", "Treinta días", "Noventa días"], "r": 2, "grp": "397|CP", "x": [{"c": "Art. 397 CP", "t": "Art. 397. El que hiriere, golpeare o maltratare de obra a otro, será castigado como responsable de lesiones graves: 1.° Con la pena de presidio mayor en su grado mínimo, si de resultas de las lesiones queda el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. 2.° Con la de presidio menor en su grado medio, si las lesiones produjeren al ofendido enfermedad o incapacidad para el trabajo por más de treinta días."}]}, {"id": "N-111v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Las lesiones que dejan al ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme se castigan con presidio mayor en su grado mínimo.", "f": "Art. 397 CP. N° 1.", "g": "N", "r": 1, "grp": "397|CP", "x": [{"c": "Art. 397 CP", "t": "Art. 397. El que hiriere, golpeare o maltratare de obra a otro, será castigado como responsable de lesiones graves: 1.° Con la pena de presidio mayor en su grado mínimo, si de resultas de las lesiones queda el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. 2.° Con la de presidio menor en su grado medio, si las lesiones produjeren al ofendido enfermedad o incapacidad para el trabajo por más de treinta días."}]}, {"id": "N-111f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Las lesiones que dejan al ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme se castigan con presidio menor en su grado máximo.", "f": "Art. 397 CP. N° 1.", "g": "N", "r": 0, "grp": "397|CP", "x": [{"c": "Art. 397 CP", "t": "Art. 397. El que hiriere, golpeare o maltratare de obra a otro, será castigado como responsable de lesiones graves: 1.° Con la pena de presidio mayor en su grado mínimo, si de resultas de las lesiones queda el ofendido demente, inútil para el trabajo, impotente, impedido de algún miembro importante o notablemente deforme. 2.° Con la de presidio menor en su grado medio, si las lesiones produjeren al ofendido enfermedad o incapacidad para el trabajo por más de treinta días."}]}, {"id": "N-112", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El robo por sorpresa se castiga con:", "f": "Art. 436 CP. Inc. 2°.", "g": "N", "i": [], "a": ["Presidio menor en sus grados mínimo a medio", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio menor en sus grados medio a máximo", "Presidio mayor en su grado mínimo"], "r": 2, "grp": "436|CP", "x": [{"c": "Art. 436 CP", "t": "ART. 436. Fuera de los casos previstos en los artículos precedentes, los robos ejecutados con violencia o intimidación en las personas, serán penados con presidio mayor en sus grados mínimo a máximo, cualquiera que sea el valor de las especies sustraídas. Se considerará como robo y se castigará con la pena de presidio menor en sus grados medio a máximo, la apropiación de dinero u otras especies que los ofendidos lleven consigo, cuando se proceda por sorpresa o aparentando riñas en lugares de concurrencia o haciendo otras maniobras dirigidas a causar agolpamiento o confusión. También será considerado robo, y se sancionará con la Art. UNICO, N° 7 pena de presidio menor en su grado máximo, la apropiación de vehículos motorizados, siempre que se valga de la sorpresa, de la distracción de la víctima o se genere por parte del autor cualquier …"}]}, {"id": "N-113", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Fuera de los casos del artículo 433, el robo con violencia o intimidación en las personas se castiga con:", "f": "Art. 436 CP. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio mayor en su grado mínimo a medio", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo", "Presidio mayor en su grado medio a máximo", "Presidio mayor en sus grados mínimo a máximo"], "r": 3, "grp": "436|CP", "x": [{"c": "Art. 436 CP", "t": "ART. 436. Fuera de los casos previstos en los artículos precedentes, los robos ejecutados con violencia o intimidación en las personas, serán penados con presidio mayor en sus grados mínimo a máximo, cualquiera que sea el valor de las especies sustraídas. Se considerará como robo y se castigará con la pena de presidio menor en sus grados medio a máximo, la apropiación de dinero u otras especies que los ofendidos lleven consigo, cuando se proceda por sorpresa o aparentando riñas en lugares de concurrencia o haciendo otras maniobras dirigidas a causar agolpamiento o confusión. También será considerado robo, y se sancionará con la Art. UNICO, N° 7 pena de presidio menor en su grado máximo, la apropiación de vehículos motorizados, siempre que se valga de la sorpresa, de la distracción de la víctima o se genere por parte del autor cualquier …"}]}, {"id": "N-114", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El robo con fuerza en las cosas en lugar habitado o destinado a la habitación o en sus dependencias se castiga con:", "f": "Art. 440 CP", "g": "N", "i": [], "a": ["Presidio mayor en su grado mínimo", "Presidio mayor en sus grados mínimo a medio", "Presidio menor en su grado máximo", "Presidio menor en sus grados medio a máximo"], "r": 0, "grp": "440|CP", "x": [{"c": "Art. 440 CP", "t": "ART. 440. El culpable de robo con fuerza en las cosas efectuado en lugar habitado o destinado a la habitación o en sus dependencias, sufrirá la pena de presidio mayor en su grado mínimo si cometiere el delito: 1.º Con escalamiento, entendiéndose que lo hay cuando se entra por vía no destinada al efecto, por forado o con rompimiento de pared o techos, o fractura de puertas o ventanas. 2.º Haciendo uso de llaves falsas, o verdadera que hubiere sido sustraída, de ganzúas u otros instrumentos semejantes para entrar en el lugar del robo. 3.º A Introduciéndose en el lugar del robo mediante la seducción de algún doméstico, o a favor de nombres supuestos o simulación de autoridad. 4.° Eliminado."}]}, {"id": "N-115", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El robo con fuerza en las cosas en lugar no habitado se castiga con:", "f": "Art. 442 CP", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio menor en sus grados medio a máximo", "Presidio menor en su grado mínimo a medio", "Presidio mayor en su grado mínimo"], "r": 1, "grp": "442|CP", "x": [{"c": "Art. 442 CP", "t": "ART. 442. El robo en lugar no habitado, se castigará con presidio menor en sus grados medio a máximo, siempre que concurra alguna de las circunstancias siguientes: 1.º A Escalamiento. 2.º Fractura de puertas interiores, armarios, arcas u otra clase de muebles u objetos cerrados o sellados. 3.º Haber hecho uso de llaves falsas, o verdadera que se hubiere sustraído, de ganzúas u otros instrumentos semejantes para entrar en el lugar del robo o abrir los muebles cerrados."}]}, {"id": "N-116", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El hurto constituye falta cuando el valor de la cosa hurtada no pasa de:", "f": "Art. 494 bis CP", "g": "N", "i": [], "a": ["Cuatro unidades tributarias mensuales", "Media unidad tributaria mensual", "Una unidad tributaria mensual", "Un cuarto de unidad tributaria mensual"], "r": 1, "grp": "494 bis|CP", "x": [{"c": "Art. 494 bis CP", "t": "ART. 494 bis. Los autores de hurto serán castigados con prisión en su grado mínimo a medio y multa de una a cuatro unidades tributarias mensuales, si el valor de la cosa hurtada no pasa de media unidad tributaria mensual. La falta de que trata este artículo se castigará con Art. UNICO multa de una a cuatro unidades tributarias mensuales, si se encuentra en grado de frustrada. En estos casos, el tribunal podrá conmutar la multa por la realización de trabajos determinados en beneficio de la comunidad, señalando expresamente el tipo de trabajo, el lugar donde deba realizarse, su duración y la persona o institución encargada de controlar su cumplimiento. Los trabajos se realizarán, de preferencia, sin afectar la jornada laboral o de estudio que tenga el infractor, con un máximo de ocho horas semanales. …"}]}, {"id": "N-117v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El hurto falta del artículo 494 bis se castiga también en grado de frustrado.", "f": "Art. 494 bis CP. Excepción expresa a la regla del art. 9°.", "g": "N", "r": 1, "grp": "494 bis|CP", "x": [{"c": "Art. 494 bis CP", "t": "… En los casos en que participen en el hurto individuos mayores de dieciocho años y menores de esa edad, se aplicará a los mayores la pena que les habría correspondido sin esa circunstancia, aumentada en un grado, si éstos se han prevalido de los menores en la perpetración de la falta. En caso de reincidencia en hurto falta frustrado, se duplicará la multa aplicada. Se entenderá que hay reincidencia cuando el responsable haya sido condenado previamente por delito de la misma especie, cualquiera haya sido la pena impuesta y su estado de cumplimiento. Si el responsable ha reincidido dos o más veces se triplicará la multa aplicada. La agravante regulada en el inciso precedente prescribirá de conformidad con lo dispuesto en el artículo 104. …"}]}, {"id": "N-117f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El hurto falta del artículo 494 bis sólo se castiga cuando ha sido consumado.", "f": "Art. 494 bis CP. Excepción expresa a la regla del art. 9°.", "g": "N", "r": 0, "grp": "494 bis|CP", "x": [{"c": "Art. 494 bis CP", "t": "… En los casos en que participen en el hurto individuos mayores de dieciocho años y menores de esa edad, se aplicará a los mayores la pena que les habría correspondido sin esa circunstancia, aumentada en un grado, si éstos se han prevalido de los menores en la perpetración de la falta. En caso de reincidencia en hurto falta frustrado, se duplicará la multa aplicada. Se entenderá que hay reincidencia cuando el responsable haya sido condenado previamente por delito de la misma especie, cualquiera haya sido la pena impuesta y su estado de cumplimiento. Si el responsable ha reincidido dos o más veces se triplicará la multa aplicada. La agravante regulada en el inciso precedente prescribirá de conformidad con lo dispuesto en el artículo 104. …"}]}, {"id": "N-118", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El hurto se castiga con presidio menor en sus grados medio a máximo y multa de once a quince UTM cuando el valor de la cosa hurtada excede de:", "f": "Art. 446 CP. N° 1.", "g": "N", "i": [], "a": ["Diez unidades tributarias mensuales", "Cuarenta unidades tributarias mensuales", "Cuatrocientas unidades tributarias mensuales", "Cuatro unidades tributarias mensuales"], "r": 1, "grp": "446|CP", "x": [{"c": "Art. 446 CP", "t": "Artículo 446.- Los autores de hurto serán castigados: 1.º Con presidio menor en sus grados medio a máximo y multa de once a quince unidades tributarias mensuales, si el valor de la cosa hurtada excediera de cuarenta unidades tributarias mensuales. 2.º Con presidio menor en su grado medio y multa de seis a diez unidades tributarias mensuales, si el valor excediere de cuatro unidades tributarias mensuales y no pasare de cuarenta unidades tributarias mensuales. 3.º Con presidio menor en su grado mínimo y multa de cinco unidades tributarias mensuales, si excediere de media unidad tributaria mensual y no pasare de cuatro unidades tributarias mensules. Si el valor de la cosa hurtada excediere de Art. …"}]}, {"id": "N-119v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Los robos de los artículos 433, 436 inciso primero y 440 se castigan como consumados desde que se encuentran en grado de tentativa.", "f": "Art. 450 CP. Inc. 1°.", "g": "N", "r": 1, "grp": "450|CP", "x": [{"c": "Art. 450 CP", "t": "ART. 450. Los delitos a que se refiere al Párrafo 2 y el artículo 440 del Párrafo 3 de este Título se castigarán como consumados desde que se encuentren en grado de tentativa. La misma regla se aplicará a los delitos sancionados en los Párrafos 3, 4, 4 bis y 4 ter de este Título cuando se cometieren con las circunstancias señaladas en el inciso primero de los artículos 449 ter o 449 quáter."}]}, {"id": "N-119f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Los robos de los artículos 433, 436 inciso primero y 440 se castigan como consumados sólo desde que se encuentran en grado de frustrados.", "f": "Art. 450 CP. Inc. 1°.", "g": "N", "r": 0, "grp": "450|CP", "x": [{"c": "Art. 450 CP", "t": "ART. 450. Los delitos a que se refiere al Párrafo 2 y el artículo 440 del Párrafo 3 de este Título se castigarán como consumados desde que se encuentren en grado de tentativa. La misma regla se aplicará a los delitos sancionados en los Párrafos 3, 4, 4 bis y 4 ter de este Título cuando se cometieren con las circunstancias señaladas en el inciso primero de los artículos 449 ter o 449 quáter."}]}, {"id": "N-120v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el robo con violencia o intimidación en las personas no procede la atenuante del artículo 11 N° 7.", "f": "Art. 450 bis CP", "g": "N", "r": 1, "grp": "450 bis|CP", "x": [{"c": "Art. 450 bis CP", "t": "ART. 450 bis. En el robo con violencia o intimidación en las personas Art. UNICO, N° 3 no procederá la atenuante de responsabilidad penal contenida en el artículo 11, N° 7."}]}, {"id": "N-120f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el robo con violencia o intimidación en las personas no procede la atenuante del artículo 11 N° 9.", "f": "Art. 450 bis CP", "g": "N", "r": 0, "grp": "450 bis|CP", "x": [{"c": "Art. 450 bis CP", "t": "ART. 450 bis. En el robo con violencia o intimidación en las personas Art. UNICO, N° 3 no procederá la atenuante de responsabilidad penal contenida en el artículo 11, N° 7."}]}, {"id": "N-121", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La receptación se castiga, en su figura base, con:", "f": "Art. 456 bis A CP. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio menor en sus grados medio a máximo y multa de cinco a cien UTM", "Presidio menor en cualquiera de sus grados y multa de cinco a cien UTM", "Presidio menor en su grado máximo y multa de once a quince UTM", "Presidio menor en su grado mínimo y multa de cinco a veinte UTM"], "r": 1, "grp": "456 bis A|CP", "x": [{"c": "Art. 456 bis A CP", "t": "… El que conociendo su origen o no pudiendo menos que conocerlo, tenga en su poder, a cualquier título, especies hurtadas, robadas u objeto de abigeato o sustracción de madera, de receptación o de apropiación indebida del artículo 470, número 1°, las transporte, compre, venda, transforme o comercialice en cualquier forma, aun cuando ya hubiese dispuesto de ellas, sufrirá la pena de presidio menor en cualquiera de sus grados y multa de cinco a cien unidades tributarias mensuales. Para la determinación de la pena aplicable el tribunal tendrá especialmente en cuenta el valor de las especies, así como la gravedad del delito en que se obtuvieron, si éste era conocido por el autor. …"}]}, {"id": "N-122", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "En la malversación del artículo 233, el empleado público tiene a su cargo los caudales o efectos:", "f": "Art. 233 CP", "g": "N", "i": [], "a": ["En administración o custodia de cualquier clase", "En depósito, consignación o secuestro", "Sólo en razón de un contrato de depósito", "En comodato o arrendamiento"], "r": 1, "grp": "233|CP", "x": [{"c": "Art. 233 CP", "t": "Artículo 233.- El empleado público que, teniendo a su cargo caudales o efectos públicos o de particulares en depósito, consignación o secuestro, los substrajere o consintiere que otro los substraiga, será castigado: 1.º Con presidio menor en sus grados medio a máximo, si la substracción excediere de una unidad tributaria mensual y no pasare de cuatro unidades tributarias mensuales. 2.º Con presidio menor en su grado máximo a presidio a), b) mayor en su grado mínimo, si excediere de cuatro unidades tributarias mensuales y no pasare de cuarenta unidades tributarias mensuales. 3.º Con presidio mayor en sus grados mínimo a medio, si excediere de cuarenta unidades tributarias mensuales. …"}]}, {"id": "N-123v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La malversación por abandono o negligencia inexcusables se sanciona con suspensión en cualquiera de sus grados, además de la obligación de devolver lo sustraído.", "f": "Art. 234 CP", "g": "N", "r": 1, "grp": "234|CP", "x": [{"c": "Art. 234 CP", "t": "ART. 234. El empleado público que, por abandono o negligencia inexcusables, diere ocasión a que se efectúe por otra persona la sustracción de caudales o efectos públicos o de particulares de que se trata en los tres números del artículo anterior, incurrirá en la pena de suspensión en cualquiera de sus grados, quedando además obligado a la devolución de la cantidad o efectos sustraídos."}]}, {"id": "N-123f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La malversación por abandono o negligencia inexcusables se sanciona con reclusión menor en su grado mínimo.", "f": "Art. 234 CP", "g": "N", "r": 0, "grp": "234|CP", "x": [{"c": "Art. 234 CP", "t": "ART. 234. El empleado público que, por abandono o negligencia inexcusables, diere ocasión a que se efectúe por otra persona la sustracción de caudales o efectos públicos o de particulares de que se trata en los tres números del artículo anterior, incurrirá en la pena de suspensión en cualquiera de sus grados, quedando además obligado a la devolución de la cantidad o efectos sustraídos."}]}, {"id": "N-124v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Comete soborno el que da, ofrece o consiente en dar a un empleado público un beneficio económico o de otra naturaleza.", "f": "Art. 250 CP", "g": "N", "r": 1, "grp": "250|CP", "x": [{"c": "Art. 250 CP", "t": "ART. 250. El que diere, ofreciere o consintiere en dar a un empleado público un beneficio económico o de otra naturaleza, en provecho de éste o de un tercero, en razón del cargo del empleado en los términos del inciso primero del artículo 248, o para que realice las acciones o incurra en las omisiones señaladas en los artículos 248, inciso segundo, 248 bis y 249, o por haberlas realizado o haber incurrido en ellas, será castigado con las mismas penas de multa e inhabilitación establecidas en dichas disposiciones. Tratándose del beneficio dado, ofrecido o consentido en razón del cargo del empleado público en los términos del inciso primero del artículo 248, el sobornante será sancionado, además, con la pena de reclusión menor en su grado medio, en el caso del beneficio dado u ofrecido, o de reclusión menor en su …"}]}, {"id": "N-124f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "Comete soborno sólo el que entrega efectivamente a un empleado público un beneficio económico.", "f": "Art. 250 CP", "g": "N", "r": 0, "grp": "250|CP", "x": [{"c": "Art. 250 CP", "t": "ART. 250. El que diere, ofreciere o consintiere en dar a un empleado público un beneficio económico o de otra naturaleza, en provecho de éste o de un tercero, en razón del cargo del empleado en los términos del inciso primero del artículo 248, o para que realice las acciones o incurra en las omisiones señaladas en los artículos 248, inciso segundo, 248 bis y 249, o por haberlas realizado o haber incurrido en ellas, será castigado con las mismas penas de multa e inhabilitación establecidas en dichas disposiciones. Tratándose del beneficio dado, ofrecido o consentido en razón del cargo del empleado público en los términos del inciso primero del artículo 248, el sobornante será sancionado, además, con la pena de reclusión menor en su grado medio, en el caso del beneficio dado u ofrecido, o de reclusión menor en su …"}]}, {"id": "N-125", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El auxilio al suicidio se castiga con presidio menor en sus grados medio a máximo:", "f": "Art. 393 CP", "g": "N", "i": [], "a": ["Si se efectúa la muerte", "Sólo si el autor obró por móviles egoístas", "Si la víctima es menor de edad", "Aunque la muerte no se produzca"], "r": 0, "grp": "393|CP", "x": [{"c": "Art. 393 CP", "t": "ART. 393. El que con conocimiento de causa prestare auxilio a otro para que se suicide, sufrirá la pena de presidio menor en sus grados medio a máximo, si se efectúa la muerte."}]}, {"id": "N-126", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "¿Cuál de las siguientes NO es una agravante especial del femicidio?", "f": "Art. 390 quáter CP. N° 1 a 4.", "g": "N", "i": [], "a": ["Encontrarse la víctima embarazada", "Ejecutarlo en el contexto de violencia física o psicológica habitual del hechor contra la víctima", "Haber actuado con ensañamiento", "Ejecutarlo en presencia de ascendientes o descendientes de la víctima"], "r": 2, "grp": "390 quáter|CP", "x": [{"c": "Art. 390 quáter CP", "t": "Artículo 390 quáter.- Son circunstancias agravantes de responsabilidad penal para el delito de femicidio, las siguientes: 1. Encontrarse la víctima embarazada. 2. Ser la víctima una niña o una adolescente menor de dieciocho años de edad, una mujer adulta mayor o una mujer en situación de discapacidad en los términos de la ley N° 20.422. 3. Ejecutarlo en presencia de ascendientes o descendientes de la víctima. 4. Ejecutarlo en el contexto de violencia física o psicológica habitual del hechor contra la víctima."}]}, {"id": "N-127v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el femicidio el juez no puede aplicar la atenuante del artículo 11 N° 5.", "f": "Art. 390 quinquies CP", "g": "N", "r": 1, "grp": "390 quinquies|CP", "x": [{"c": "Art. 390 quinquies CP", "t": "Artículo 390 quinquies.- Tratándose del delito de femicidio, el juez no podrá aplicar la circunstancia atenuante de responsabilidad penal prevista en el N° 5 del artículo 11."}]}, {"id": "N-127f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el femicidio el juez no puede aplicar la atenuante del artículo 11 N° 6.", "f": "Art. 390 quinquies CP", "g": "N", "r": 0, "grp": "390 quinquies|CP", "x": [{"c": "Art. 390 quinquies CP", "t": "Artículo 390 quinquies.- Tratándose del delito de femicidio, el juez no podrá aplicar la circunstancia atenuante de responsabilidad penal prevista en el N° 5 del artículo 11."}]}, {"id": "N-128v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La violación con homicidio se castiga con presidio perpetuo a presidio perpetuo calificado.", "f": "Art. 372 bis CP", "g": "N", "r": 1, "grp": "372 bis|CP", "x": [{"c": "Art. 372 bis CP", "t": "ART. 372 BIS. El que, con ocasión de violación, cometiere además homicidio en la persona de la víctima, será castigado con presidio perpetuo a presidio perpetuo calificado. Si el autor del delito descrito en el inciso anterior es un hombre y la víctima una mujer, el delito tendrá el nombre de violación con femicidio."}]}, {"id": "N-128f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "La violación con homicidio se castiga con presidio mayor en su grado máximo a presidio perpetuo.", "f": "Art. 372 bis CP", "g": "N", "r": 0, "grp": "372 bis|CP", "x": [{"c": "Art. 372 bis CP", "t": "ART. 372 BIS. El que, con ocasión de violación, cometiere además homicidio en la persona de la víctima, será castigado con presidio perpetuo a presidio perpetuo calificado. Si el autor del delito descrito en el inciso anterior es un hombre y la víctima una mujer, el delito tendrá el nombre de violación con femicidio."}]}, {"id": "N-129", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El artículo 305 sanciona al que, sin haber sometido su actividad a una evaluación de impacto ambiental a sabiendas de estar obligado a ello, realiza las conductas que enumera, con:", "f": "Art. 305 CP. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio o reclusión menor en su grado máximo", "Presidio o reclusión menor en sus grados mínimo a medio", "Presidio o reclusión menor en sus grados medio a máximo", "Multa de cien a mil UTM únicamente"], "r": 1, "grp": "305|CP", "x": [{"c": "Art. 305 CP", "t": "ART. 305.- Será sancionado con presidio o reclusión menor en sus grados mínimo a medio el que sin haber sometido su actividad a una evaluación de impacto ambiental a sabiendas de estar obligado a ello: 1. Vierta sustancias contaminantes en aguas marítimas o continentales. 2. Extraiga aguas continentales, sean superficiales o subterráneas, o aguas marítimas. 3. Vierta o deposite sustancias contaminantes en el suelo o subsuelo, continental o marítimo. 4. Vierta tierras u otros sólidos en humedales. 5. Extraiga componentes del suelo o subsuelo. 6. Libere sustancias contaminantes al aire. La pena será de presidio o reclusión menor en sus grados medio a máximo si el infractor perpetra el hecho estando obligado a someter su actividad a un estudio de impacto ambiental."}]}, {"id": "N-130", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "¿Cuál de las siguientes circunstancias NO agrava la usurpación conforme al artículo 458 bis?", "f": "Art. 458 bis CP. Numerales 1° a 3° del art. 458 bis.", "g": "N", "i": [], "a": ["Realizar la ocupación con escalamiento", "Realizar la ocupación en un lugar habitado o destinado a la habitación", "Obstaculizar el suministro de servicios públicos o domiciliarios", "Obstaculizar una acción destinada a impedir o dificultar la propagación de incendios"], "r": 0, "grp": "458 bis|CP", "x": [{"c": "Art. 458 bis CP", "t": "ART. 458 BIS. Se impondrá el máximum o el grado máximo, según corresponda, de las penas previstas en los tres artículos anteriores si la ocupación se realiza: 1.° En un lugar habitado o destinado a la habitación. 2.° Obstaculizando una acción destinada a impedir o dificultar la propagación de incendios. 3.° Obstaculizando el suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telefonía."}]}, {"id": "N-131", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Ingresar sin autorización teléfonos o chips telefónicos a un establecimiento penitenciario se sanciona con:", "f": "Art. 304 bis CP. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio menor en su grado medio a máximo", "Presidio menor en su grado mínimo y multa de 4 a 40 UTM", "Prisión en su grado máximo y multa", "Presidio menor en su grado mínimo a medio"], "r": 3, "grp": "304 bis|CP", "x": [{"c": "Art. 304 bis CP", "t": "ART. 304 bis. El que sin estar legal o reglamentariamente autorizado al efecto ingresare, intentare o permitiere ingresar por cualquier medio a un establecimiento penitenciario intercomunicadores, teléfonos, partes de ellos, chips telefónicos u otros elementos tecnológicos que permitan comunicarse con el exterior, será sancionado con la pena de presidio menor en su grado mínimo a medio. El que ingresare, intentare o permitiere ingresar mediante lanzamiento desde el exterior o por vía no destinada al efecto, con dirección al interior de un establecimiento penitenciario, cualquier objeto o sustancia, será sancionado con la pena de presidio menor en sus grados mínimo a medio. La pena establecida en el inciso anterior se aumentará Art. …"}]}, {"id": "N-132v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el homicidio en riña en que no consta el autor de la muerte pero sí quiénes causaron lesiones graves al occiso, se impone a éstos presidio menor en su grado máximo.", "f": "Art. 392 CP. Inc. 1°.", "g": "N", "r": 1, "grp": "392|CP", "x": [{"c": "Art. 392 CP", "t": "ART. 392. Cometiéndose un homicidio en riña o pelea y no constando el autor de la muerte, pero sí los que causaron lesiones graves al occiso, se impondrá a todos éstos la pena de presidio menor en su grado máximo. Si no constare tampoco quienes causaron lesiones graves al ofendido, se impondrá a todos los que hubieren ejercido violencia en su persona la de presidio menor en su grado medio."}]}, {"id": "N-132f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "En el homicidio en riña en que no consta el autor de la muerte pero sí quiénes causaron lesiones graves al occiso, se impone a éstos la pena del homicidio simple rebajada en un grado.", "f": "Art. 392 CP. Inc. 1°.", "g": "N", "r": 0, "grp": "392|CP", "x": [{"c": "Art. 392 CP", "t": "ART. 392. Cometiéndose un homicidio en riña o pelea y no constando el autor de la muerte, pero sí los que causaron lesiones graves al occiso, se impondrá a todos éstos la pena de presidio menor en su grado máximo. Si no constare tampoco quienes causaron lesiones graves al ofendido, se impondrá a todos los que hubieren ejercido violencia en su persona la de presidio menor en su grado medio."}]}, {"id": "N-133v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El maltrato corporal relevante protege a menores de dieciocho años, personas adultas mayores y personas en situación de discapacidad.", "f": "Art. 403 bis CP. Inc. 1°.", "g": "N", "r": 1, "grp": "403 bis|CP", "x": [{"c": "Art. 403 bis CP", "t": "ART. 403 bis.- El que, de manera relevante, maltratare corporalmente a un niño, niña o adolescente menor de dieciocho años, a una persona adulta mayor o a una persona en situación de discapacidad en los términos de la ley N° 20.422 será sancionado con prisión en cualquiera de sus grados o multa de una a cuatro unidades tributarias mensuales, salvo que el hecho sea constitutivo de un delito de mayor gravedad. El que teniendo un deber especial de cuidado o protección respecto de alguna de las personas referidas en el inciso primero, la maltratare corporalmente de manera relevante o no impidiere su maltrato debiendo hacerlo, será castigado con la pena de presidio menor en su grado mínimo, salvo que el hecho fuere constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la …"}]}, {"id": "N-133f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El maltrato corporal relevante protege únicamente a menores de catorce años.", "f": "Art. 403 bis CP. Inc. 1°.", "g": "N", "r": 0, "grp": "403 bis|CP", "x": [{"c": "Art. 403 bis CP", "t": "ART. 403 bis.- El que, de manera relevante, maltratare corporalmente a un niño, niña o adolescente menor de dieciocho años, a una persona adulta mayor o a una persona en situación de discapacidad en los términos de la ley N° 20.422 será sancionado con prisión en cualquiera de sus grados o multa de una a cuatro unidades tributarias mensuales, salvo que el hecho sea constitutivo de un delito de mayor gravedad. El que teniendo un deber especial de cuidado o protección respecto de alguna de las personas referidas en el inciso primero, la maltratare corporalmente de manera relevante o no impidiere su maltrato debiendo hacerlo, será castigado con la pena de presidio menor en su grado mínimo, salvo que el hecho fuere constitutivo de un delito de mayor gravedad, caso en el cual se aplicará sólo la pena asignada por la …"}]}, {"id": "N-134v", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El abuso sexual por sorpresa u otra maniobra que no suponga consentimiento exige que la víctima sea mayor de catorce años y se castiga con presidio menor en su grado mínimo a medio.", "f": "Art. 366 CP. Inc. 3°.", "g": "N", "r": 1, "grp": "366|CP", "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}]}, {"id": "N-134f", "o": "Preguntas nuevas", "t": "vf", "m": "PE", "e": "El abuso sexual por sorpresa u otra maniobra que no suponga consentimiento se castiga con presidio menor en su grado máximo.", "f": "Art. 366 CP. Inc. 3°.", "g": "N", "r": 0, "grp": "366|CP", "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}]}, {"id": "N-135", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Los delitos de la Ley 20.000 se sancionan como consumados desde que:", "f": "Art. 18 Ley 20.000", "g": "N", "i": [], "a": ["Se encuentren frustrados", "Exista conspiración para cometerlos", "Haya principio de ejecución", "La sustancia sea efectivamente transferida"], "r": 2, "grp": "18|Ley 20.000", "x": [{"c": "Art. 18 Ley 20.000", "t": "Artículo 18.- Los delitos de que trata esta ley se sancionarán como consumados desde que haya principio de ejecución. Párrafo 2º De las circunstancias agravantes"}]}, {"id": "N-136v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la reincidencia en los delitos de la Ley 20.000 se consideran las sentencias firmes dictadas en un Estado extranjero, aun cuando la pena impuesta no haya sido cumplida.", "f": "Art. 21 Ley 20.000", "g": "N", "r": 1, "grp": "21|Ley 20.000", "x": [{"c": "Art. 21 Ley 20.000", "t": "Artículo 21.- Para determinar si existe reincidencia en los delitos castigados en esta ley, se considerarán las sentencias firmes dictadas en un Estado extranjero, aun cuando la pena impuesta no haya sido cumplida. Párrafo 3º De la cooperación eficaz"}]}, {"id": "N-136f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la reincidencia en los delitos de la Ley 20.000 sólo se consideran las sentencias extranjeras cuya pena haya sido efectivamente cumplida.", "f": "Art. 21 Ley 20.000", "g": "N", "r": 0, "grp": "21|Ley 20.000", "x": [{"c": "Art. 21 Ley 20.000", "t": "Artículo 21.- Para determinar si existe reincidencia en los delitos castigados en esta ley, se considerarán las sentencias firmes dictadas en un Estado extranjero, aun cuando la pena impuesta no haya sido cumplida. Párrafo 3º De la cooperación eficaz"}]}, {"id": "N-137", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El tráfico del artículo 1° de la Ley 20.000 se castiga con:", "f": "Art. 1 Ley 20.000. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio menor en sus grados medio a máximo y multa de diez a cuarenta UTM", "Presidio mayor en sus grados mínimo a medio y multa de cuarenta a cuatrocientas UTM", "Presidio mayor en sus grados medio a máximo y multa de cien a mil UTM", "Presidio menor en su grado máximo a presidio mayor en su grado mínimo y multa de cuarenta a cuatrocientas UTM"], "r": 1, "grp": "1|Ley 20.000", "x": [{"c": "Art. 1 Ley 20.000", "t": "Artículo 1º.- Los que elaboren, fabriquen, transformen, preparen o extraigan sustancias o drogas estupefacientes o sicotrópicas productoras de dependencia física o síquica, capaces de provocar graves efectos tóxicos o daños considerables a la salud, sin la debida autorización, serán castigados con presidio mayor en sus grados mínimo a medio y multa de cuarenta a cuatrocientas unidades tributarias mensuales. Si se tratare de otras drogas o sustancias de esta índole que no produzcan los efectos indicados en el inciso anterior, podrá rebajarse la pena hasta en un grado. Incurren también en este delito, quienes tengan en su poder elementos, instrumentos, materiales o equipos comúnmente destinados a la elaboración, fabricación, preparación, transformación o extracción de las sustancias o drogas a que se refieren los incisos anteriores. …"}]}, {"id": "N-138", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El tráfico de pequeñas cantidades del artículo 4° de la Ley 20.000 se castiga con:", "f": "Art. 4 Ley 20.000. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio menor en sus grados medio a máximo y multa de diez a cuarenta UTM", "Presidio menor en su grado mínimo y multa de una a diez UTM", "Presidio menor en sus grados mínimo a medio y multa de diez a cuarenta UTM", "Presidio mayor en su grado mínimo y multa de cuarenta a cuatrocientas UTM"], "r": 0, "grp": "4|Ley 20.000", "x": [{"c": "Art. 4 Ley 20.000", "t": "Artículo 4º.- El que, sin la competente autorización posea, transporte, guarde o porte consigo pequeñas cantidades de sustancias o drogas estupefacientes o sicotrópicas, productoras de dependencia física o síquica, o de materias primas que sirvan para obtenerlas, sea que se trate de las indicadas en los incisos primero o segundo del artículo 1º, será castigado con presidio menor en sus grados medio a máximo y multa de diez a cuarenta unidades tributarias mensuales, a menos que justifique que están destinadas a la atención de un tratamiento médico o a su uso o consumo personal exclusivo y próximo en el tiempo. En igual pena incurrirá el que adquiera, transfiera, suministre o facilite a cualquier título pequeñas cantidades de estas sustancias, drogas o materias primas, con el objetivo de que sean consumidas o usadas por otro. …"}]}, {"id": "N-139v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La concurrencia de alguna de las circunstancias del artículo 19 de la Ley 20.000 obliga a aumentar la pena en un grado.", "f": "Art. 19 Ley 20.000. Encabezado.", "g": "N", "r": 1, "grp": "19|Ley 20.000", "x": [{"c": "Art. 19 Ley 20.000", "t": "Artículo 19.- Tratándose de los delitos anteriormente descritos, la pena deberá ser aumentada en un grado si concurre alguna de las circunstancias siguientes: a) Si el imputado formó parte de una agrupación o reunión de delincuentes, sin incurrir en el delito de organización del artículo 16. b) Si se utilizó violencia, armas o engaño en su comisión. c) Si se suministró, promovió, indujo o facilitó el uso o consumo de drogas o sustancias estupefacientes o sicotrópicas a menores de dieciocho años de edad, o a personas con sus facultades mentales disminuidas o perturbadas. d) Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales. e) Si el delito se cometió valiéndose de niños, niñas o adolescentes o personas exentas de responsabilidad penal. …"}]}, {"id": "N-139f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La concurrencia de alguna de las circunstancias del artículo 19 de la Ley 20.000 faculta al tribunal para aumentar la pena hasta en dos grados.", "f": "Art. 19 Ley 20.000. Encabezado.", "g": "N", "r": 0, "grp": "19|Ley 20.000", "x": [{"c": "Art. 19 Ley 20.000", "t": "Artículo 19.- Tratándose de los delitos anteriormente descritos, la pena deberá ser aumentada en un grado si concurre alguna de las circunstancias siguientes: a) Si el imputado formó parte de una agrupación o reunión de delincuentes, sin incurrir en el delito de organización del artículo 16. b) Si se utilizó violencia, armas o engaño en su comisión. c) Si se suministró, promovió, indujo o facilitó el uso o consumo de drogas o sustancias estupefacientes o sicotrópicas a menores de dieciocho años de edad, o a personas con sus facultades mentales disminuidas o perturbadas. d) Si el delito se cometió por funcionarios públicos aprovechando o abusando de su calidad de tales. e) Si el delito se cometió valiéndose de niños, niñas o adolescentes o personas exentas de responsabilidad penal. …"}]}, {"id": "N-140", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Las penas sustitutivas se entienden quebrantadas por el solo ministerio de la ley, dando lugar a su revocación, si durante su cumplimiento el condenado:", "f": "Art. 27 Ley 18.216", "g": "N", "i": [], "a": ["Comete nuevo crimen, simple delito o falta y es condenado por sentencia firme", "Comete nuevo crimen o simple delito y es condenado por sentencia firme", "Incumple por segunda vez las condiciones impuestas", "Es formalizado por un nuevo crimen o simple delito"], "r": 1, "grp": "27|Ley 18.216", "x": [{"c": "Art. 27 Ley 18.216", "t": "Artículo 27.- Las penas sustitutivas reguladas en esta ley siempre se considerarán quebrantadas por el solo ministerio de la ley y darán lugar a su revocación, si durante su cumplimiento el condenado cometiere nuevo crimen o simple delito y fuere condenado por sentencia firme."}]}, {"id": "N-141", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La remisión condicional puede decretarse si la pena privativa o restrictiva de libertad que impone la sentencia no excede de:", "f": "Art. 4 Ley 18.216. Letra a).", "g": "N", "i": [], "a": ["Dos años", "Quinientos cuarenta días", "Tres años", "Cinco años"], "r": 2, "grp": "4|Ley 18.216", "x": [{"c": "Art. 4 Ley 18.216", "t": "Artículo 4°.- La remisión condicional podrá decretarse: a) Si la pena privativa o restrictiva de libertad que impusiere la sentencia no excediere de tres años; b) Si el penado no hubiese sido condenado anteriormente por crimen o simple delito. En todo caso, no se considerarán para estos efectos las condenas cumplidas diez o cinco años antes, respectivamente, de la comisión del nuevo ilícito; c) Si los antecedentes personales del condenado, su conducta anterior y posterior al hecho punible y la naturaleza, modalidades y móviles determinantes del delito permitieren presumir que no volverá a delinquir, y d) Si las circunstancias indicadas en las letras b) y c) precedentes hicieren innecesaria una intervención o la ejecución efectiva de la pena. …"}]}, {"id": "N-142", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La libertad vigilada intensiva procede, entre otros casos, si la pena privativa o restrictiva de libertad impuesta es:", "f": "Art. 15 bis Ley 18.216. Letra a).", "g": "N", "i": [], "a": ["Superior a cinco años y no excede de siete", "Superior a dos años y no excede de tres", "Igual o inferior a trescientos días", "Superior a tres años y no excede de cinco"], "r": 3, "grp": "15 bis|Ley 18.216", "x": [{"c": "Art. 15 bis Ley 18.216", "t": "Artículo 15 bis.- La libertad vigilada intensiva podrá decretarse: a) Si la pena privativa o restrictiva de libertad que impusiere la sentencia fuere superior a tres años y no excediere de cinco, o b) Si se tratare de alguno de los delitos establecidos en los artículos 296, 297, 390, 390 bis, 390 ter, 391, 395, 396, 397, 398 o 399 del Código Penal, cometidos en el contexto de violencia intrafamiliar, y aquellos contemplados en los artículos 363, 365 bis, 366, 366 bis, 366 quáter, 367, 367 ter, 367 quáter inciso segundo, y 411 ter del mismo Código, y la pena privativa o restrictiva de libertad que se impusiere fuere superior a quinientos cuarenta días y no excediere de cinco años. …"}]}, {"id": "N-143", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La prestación de servicios en beneficio de la comunidad puede decretarse si la pena originalmente impuesta es:", "f": "Art. 11 Ley 18.216. Letra a).", "g": "N", "i": [], "a": ["Igual o inferior a trescientos días", "Igual o inferior a un año", "Igual o inferior a sesenta días", "Igual o inferior a quinientos cuarenta días"], "r": 0, "grp": "11|Ley 18.216", "x": [{"c": "Art. 11 Ley 18.216", "t": "Artículo 11.- La pena de prestación de servicios en beneficio de la comunidad podrá decretarse por el juez si se cumplen, copulativamente, los siguientes requisitos: a) Si la pena originalmente impuesta fuere igual o inferior a trescientos días. b) Si existieren antecedentes laborales, educacionales o de otra naturaleza similar que justificaren la pena, o si los antecedentes personales del condenado, su conducta anterior y posterior al hecho punible y la naturaleza, modalidades y móviles determinantes del delito permitieren presumir que la pena de prestación de servicios en beneficio de la comunidad lo disuadirá de cometer nuevos ilícitos. c) Si concurriere la voluntad del condenado de someterse a esta pena. El juez deberá informarle acerca de las consecuencias de su incumplimiento. …"}]}, {"id": "N-144v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La decisión acerca de la concesión, denegación, revocación, sustitución, reemplazo, reducción, intensificación y término anticipado de las penas sustitutivas es apelable.", "f": "Art. 37 Ley 18.216. Apelable para ante el tribunal de alzada.", "g": "N", "r": 1, "grp": "37|Ley 18.216", "x": [{"c": "Art. 37 Ley 18.216", "t": "Artículo 37.- La decisión acerca de la concesión, denegación, revocación, sustitución, reemplazo, reducción, intensificación y término anticipado de las penas sustitutivas que establece esta ley y la referida a la interrupción de la pena privativa de libertad a que alude el artículo 33, será apelable para ante el tribunal de alzada respectivo, de acuerdo a las reglas generales. Sin perjuicio de lo anterior, cuando la decisión que conceda o deniegue una pena sustitutiva esté contenida formalmente en la sentencia definitiva, el recurso de apelación contra dicha decisión deberá interponerse dentro de los cinco días siguientes a su notificación o, si se impugnare además la sentencia definitiva por la vía del recurso de nulidad, se interpondrá conjuntamente con éste, en carácter de subsidiario y para el caso en que el fallo del o de los recursos de nulidad no altere la decisión del tribunal …"}]}, {"id": "N-144f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La decisión acerca de la concesión o denegación de las penas sustitutivas no es susceptible de recurso alguno.", "f": "Art. 37 Ley 18.216. Apelable para ante el tribunal de alzada.", "g": "N", "r": 0, "grp": "37|Ley 18.216", "x": [{"c": "Art. 37 Ley 18.216", "t": "Artículo 37.- La decisión acerca de la concesión, denegación, revocación, sustitución, reemplazo, reducción, intensificación y término anticipado de las penas sustitutivas que establece esta ley y la referida a la interrupción de la pena privativa de libertad a que alude el artículo 33, será apelable para ante el tribunal de alzada respectivo, de acuerdo a las reglas generales. Sin perjuicio de lo anterior, cuando la decisión que conceda o deniegue una pena sustitutiva esté contenida formalmente en la sentencia definitiva, el recurso de apelación contra dicha decisión deberá interponerse dentro de los cinco días siguientes a su notificación o, si se impugnare además la sentencia definitiva por la vía del recurso de nulidad, se interpondrá conjuntamente con éste, en carácter de subsidiario y para el caso en que el fallo del o de los recursos de nulidad no altere la decisión del tribunal …"}]}, {"id": "N-145", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La Ley 20.084 se aplica a quienes, al momento en que se hubiere dado principio de ejecución del delito, sean:", "f": "Art. 3 Ley 20.084", "g": "N", "i": [], "a": ["Mayores de catorce y menores de dieciocho años", "Mayores de catorce y menores de veintiún años", "Mayores de doce y menores de dieciocho años", "Mayores de dieciséis y menores de dieciocho años"], "r": 0, "grp": "3|Ley 20.084", "x": [{"c": "Art. 3 Ley 20.084", "t": "Artículo 3º.- Límites de edad a la responsabilidad. La presente ley se aplicará a quienes al momento en que se hubiere dado principio de ejecución del delito sean mayores de catorce y menores de dieciocho años, los que, para los efectos de esta ley, se consideran adolescentes. En el caso que el delito tenga su inicio entre los catorce y los dieciocho años del imputado y su consumación se prolongue en el tiempo más allá de los dieciocho años de edad, la legislación aplicable será la que rija para los imputados mayores de edad. La edad del imputado deberá ser determinada por el juez competente en cualquiera de las formas establecidas en el Título XVII del Libro I del Código Civil. …"}]}, {"id": "N-146", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La acción penal y la pena respecto de simples delitos cometidos por adolescentes prescriben, por regla general, en:", "f": "Art. 5 Ley 20.084. Dos años; cinco para crímenes; seis meses para faltas.", "g": "N", "i": [], "a": ["Dos años", "Cinco años", "Un año", "Seis meses"], "r": 0, "grp": "5|Ley 20.084", "x": [{"c": "Art. 5 Ley 20.084", "t": "Artículo 5º.- Prescripción. La prescripción de la acción penal y de la pena será de dos años, con excepción de las conductas constitutivas de crímenes, respecto de las cuales será de cinco años, y de las faltas, en que será de seis meses. No obstante, tratándose de los crímenes y simples delitos descritos y sancionados en los artículos 141, inciso final; 142, inciso final, ambos en relación con la violación; los artículos 150 B y 150 E, ambos en relación con los artículos 361, 362 y 365 bis; los artículos 361, 362, 363, 365 bis, 366, 366 bis, 366 quáter, 366 quinquies, 367, 367 ter; el artículo 411 quáter en relación con la explotación sexual; …"}]}, {"id": "N-147", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La internación en régimen cerrado no puede exceder, si el infractor tiene más de dieciséis años, de:", "f": "Art. 18 Ley 20.084. Cinco años para menores de dieciséis; diez para mayores de esa edad.", "g": "N", "i": [], "a": ["Diez años", "Siete años", "Quince años", "Cinco años"], "r": 0, "grp": "18|Ley 20.084", "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}]}, {"id": "N-148v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La internación en régimen cerrado no puede exceder de cinco años si el infractor tiene menos de dieciséis años.", "f": "Art. 18 Ley 20.084", "g": "N", "r": 1, "grp": "18|Ley 20.084", "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}]}, {"id": "N-148f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La internación en régimen cerrado no puede exceder de tres años si el infractor tiene menos de dieciséis años.", "f": "Art. 18 Ley 20.084", "g": "N", "r": 0, "grp": "18|Ley 20.084", "x": [{"c": "Art. 18 Ley 20.084", "t": "Artículo 18.- Límite máximo de las penas privativas de libertad. Las penas de internación en régimen cerrado con programa de reinserción social, que se impongan a los adolescentes no podrán exceder de cinco años si el infractor tuviere menos de dieciséis años, o de diez años si tuviere más de esa edad. Tampoco se podrán imponer por un período inferior a un año de duración. La pena de libertad asistida especial con internación parcial no se podrá imponer por un lapso superior a los 5 años, ni inferior a los 6 meses. Párrafo 4º Sanciones mixtas Párrafo 4º Sanciones mixtas"}]}, {"id": "N-149v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La suspensión condicional del procedimiento respecto de adolescentes se decreta por un plazo no inferior a seis ni superior a doce meses.", "f": "Art. 41 Ley 20.084. Inc. final.", "g": "N", "r": 1, "grp": "41|Ley 20.084", "x": [{"c": "Art. 41 Ley 20.084", "t": "… Transcurrido el plazo previsto en el inciso anterior sin que el imputado hubiere sido objeto de nuevo requerimiento o de una formalización de la investigación, el tribunal dejará sin efecto la sentencia y, en su reemplazo, decretará el sobreseimiento definitivo de la causa. Esta suspensión no afectará la responsabilidad civil derivada del delito. Lo dispuesto en este artículo es sin perjuicio de la posibilidad de decretar la suspensión condicional del procedimiento por un plazo no inferior a 6 ni superior a los 12 meses."}]}, {"id": "N-149f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La suspensión condicional del procedimiento respecto de adolescentes se decreta por un plazo no inferior a uno ni superior a tres años.", "f": "Art. 41 Ley 20.084. Inc. final.", "g": "N", "r": 0, "grp": "41|Ley 20.084", "x": [{"c": "Art. 41 Ley 20.084", "t": "… Transcurrido el plazo previsto en el inciso anterior sin que el imputado hubiere sido objeto de nuevo requerimiento o de una formalización de la investigación, el tribunal dejará sin efecto la sentencia y, en su reemplazo, decretará el sobreseimiento definitivo de la causa. Esta suspensión no afectará la responsabilidad civil derivada del delito. Lo dispuesto en este artículo es sin perjuicio de la posibilidad de decretar la suspensión condicional del procedimiento por un plazo no inferior a 6 ni superior a los 12 meses."}]}, {"id": "N-150", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Tratándose de la conducta del artículo 362 del Código Penal, no puede procederse penalmente contra el adolescente, si no concurren las circunstancias de los artículos 361 o 363, a menos que la diferencia de edad con la víctima sea de a lo menos:", "f": "Art. 4 Ley 20.084. Dos años para el art. 362; tres años en los demás casos.", "g": "N", "i": [], "a": ["Cuatro años", "Dos años", "Un año", "Tres años"], "r": 1, "grp": "4|Ley 20.084", "x": [{"c": "Art. 4 Ley 20.084", "t": "… No podrá procederse penalmente respecto de los delitos previstos en los artículos 362, 365, 366 bis, 366 quáter y 367 quáter inciso segundo, del Código Penal, cuando la conducta se hubiere realizado con una persona menor de 14 años y no concurra ninguna de las circunstancias enumeradas en los artículos 361 ó 363 de dicho Código, según sea el caso, a menos que exista entre aquélla y el imputado una diferencia de, a lo menos, dos años de edad, tratándose de la conducta descrita en el artículo 362, o de tres años en los demás casos. Artículo 4º. Establécese una comisión formada por expertos, la que se encargará de evaluar la implementación de la presente ley e informar trimestralmente acerca del estado de avance de la misma a la Comisión de Constitución, Legislación, Justicia y Reglamento del Senado y a la Comisión de Constitución, Legislación …"}]}, {"id": "N-151", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "Tras la Ley 21.675, ¿cuál de las siguientes calidades NO está contemplada en el artículo 5° de la Ley 20.066?", "f": "Art. 5 Ley 20.066. Numerales 1 a 5 del art. 5°.", "g": "N", "i": [], "a": ["Pariente por consanguinidad o afinidad en la línea colateral hasta el tercer grado inclusive", "Compañero o compañera de trabajo", "Padre o madre de un hijo o hija en común", "Pareja de carácter sentimental o sexual sin convivencia"], "r": 1, "grp": "5|Ley 20.066", "x": [{"c": "Art. 5 Ley 20.066", "t": "… Será constitutivo de violencia intrafamiliar todo maltrato que afecte la vida o la integridad física o psíquica, la libertad o indemnidad sexual, o la subsistencia o autonomía económica, en contra de una persona que tenga o haya tenido, respecto de quien ejerce la violencia, alguna de las siguientes calidades: 1. Cónyuge o conviviente civil. 2. Conviviente. 3. Pareja de carácter sentimental o sexual sin convivencia. 4. Padre o madre de un hijo o hija en común. 5. Pariente por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de quien agrede. También será constitutiva de violencia intrafamiliar la conducta referida en el inciso precedente cuando sea ejercida en contra de o por quien tiene una relación de parentesco por consanguinidad o afinidad en toda la línea recta o en la colateral hasta el tercer grado inclusive de …"}]}, {"id": "N-152v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "En los procesos por delitos constitutivos de violencia intrafamiliar no tienen aplicación los acuerdos reparatorios.", "f": "Art. 19 Ley 20.066. No rige el art. 241 CPP.", "g": "N", "r": 1, "grp": "19|Ley 20.066", "x": [{"c": "Art. 19 Ley 20.066", "t": "Artículo 19.- Improcedencia de acuerdos reparatorios. En los procesos por delitos constitutivos de violencia intrafamiliar no tendrá aplicación el artículo 241 del Código Procesal Penal."}, {"c": "Art. 241 CPP", "t": "Artículo 241.- Procedencia de los acuerdos reparatorios. El imputado y la víctima podrán convenir acuerdos reparatorios, los que el juez de garantía aprobará, en audiencia a la que citará a los intervinientes para escuchar sus planteamientos, si verificare que los concurrentes al acuerdo hubieren prestado su consentimiento en forma libre y con pleno conocimiento de sus derechos. Los acuerdos reparatorios sólo podrán referirse a hechos investigados que afectaren bienes jurídicos disponibles de carácter patrimonial, consistieren en lesiones menos graves o constituyeren delitos culposos. Sin perjuicio de lo señalado en los incisos precedentes, los acuerdos reparatorios procederán también respecto de los delitos de los artículos 144 inciso primero, 146, 161-A, 161 B, 231, inciso segundo del 247, 284, 296, 297, 494 Nº 4 y 494 Nº 5, todos del Código Penal. …"}]}, {"id": "N-152f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "En los procesos por delitos constitutivos de violencia intrafamiliar no tiene aplicación la suspensión condicional del procedimiento.", "f": "Art. 19 Ley 20.066. No rige el art. 241 CPP.", "g": "N", "r": 0, "grp": "19|Ley 20.066", "x": [{"c": "Art. 19 Ley 20.066", "t": "Artículo 19.- Improcedencia de acuerdos reparatorios. En los procesos por delitos constitutivos de violencia intrafamiliar no tendrá aplicación el artículo 241 del Código Procesal Penal."}, {"c": "Art. 241 CPP", "t": "… Sin perjuicio de lo señalado en los incisos precedentes, los acuerdos reparatorios procederán también respecto de los delitos de los artículos 144 inciso primero, 146, 161-A, 161 B, 231, inciso segundo del 247, 284, 296, 297, 494 Nº 4 y 494 Nº 5, todos del Código Penal. Asimismo, procederán también respecto de los delitos contemplados en el decreto con fuerza de ley Nº 3, de 2006, que fija el texto refundido, coordinado y sistematizado de la ley Nº 19.039, de Propiedad Industrial, y en la ley Nº 17.336, de Propiedad Intelectual. En consecuencia, de oficio o a petición del ministerio Art., a) público, el juez negará aprobación a los acuerdos reparatorios convenidos en procedimientos que versaren sobre hechos diversos de los previstos en los incisos segundo y tercero, o si el consentimiento de los que lo hubieren celebrado no apareciere libremente prestado, …"}]}, {"id": "N-153v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El incumplimiento de medidas cautelares en violencia intrafamiliar autoriza al juez a imponer, como apremio, arresto hasta por quince días.", "f": "Art. 10 Ley 20.066. Inc. 1°.", "g": "N", "r": 1, "grp": "10|Ley 20.066", "x": [{"c": "Art. 10 Ley 20.066", "t": "Artículo 10.- Sanciones. En caso de incumplimiento de las medidas cautelares, condiciones de suspensión condicional del procedimiento o medidas accesorias decretadas que se deba a actos u omisiones del imputado o condenado, el juez pondrá en conocimiento del Ministerio Público los antecedentes para los efectos de lo previsto en el inciso segundo del artículo 240 del Código de Procedimiento Civil, sin perjuicio de imponer al infractor, como medida de apremio, arresto hasta por quince días. La policía deberá detener a quien sea sorprendido en quebrantamiento flagrante de las medidas mencionadas en el inciso precedente."}]}, {"id": "N-153f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El incumplimiento de medidas cautelares en violencia intrafamiliar autoriza al juez a imponer, como apremio, arresto hasta por treinta días.", "f": "Art. 10 Ley 20.066. Inc. 1°.", "g": "N", "r": 0, "grp": "10|Ley 20.066", "x": [{"c": "Art. 10 Ley 20.066", "t": "Artículo 10.- Sanciones. En caso de incumplimiento de las medidas cautelares, condiciones de suspensión condicional del procedimiento o medidas accesorias decretadas que se deba a actos u omisiones del imputado o condenado, el juez pondrá en conocimiento del Ministerio Público los antecedentes para los efectos de lo previsto en el inciso segundo del artículo 240 del Código de Procedimiento Civil, sin perjuicio de imponer al infractor, como medida de apremio, arresto hasta por quince días. La policía deberá detener a quien sea sorprendido en quebrantamiento flagrante de las medidas mencionadas en el inciso precedente."}]}, {"id": "N-154v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las medidas cautelares del artículo 15 de la Ley 20.066 pueden decretarse aun antes de la formalización.", "f": "Art. 15 Ley 20.066", "g": "N", "r": 1, "grp": "15|Ley 20.066", "x": [{"c": "Art. 15 Ley 20.066", "t": "Artículo 15.- Medidas cautelares. En cualquier etapa de la investigación o del procedimiento sobre delitos constitutivos de violencia intrafamiliar, y aun antes de la formalización, el juez de garantía o el tribunal de juicio oral en lo penal, según corresponda, podrá decretar las medidas cautelares que sean necesarias para proteger a la víctima de manera eficaz y oportuna, tales como las que establecen el artículo 92 de la ley N°19.968, que crea los Tribunales de Familia, o la ley que estatuye medidas para prevenir, sancionar y erradicar la violencia en contra de las mujeres, en razón de su género."}]}, {"id": "N-154f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las medidas cautelares del artículo 15 de la Ley 20.066 sólo pueden decretarse una vez formalizada la investigación.", "f": "Art. 15 Ley 20.066", "g": "N", "r": 0, "grp": "15|Ley 20.066", "x": [{"c": "Art. 15 Ley 20.066", "t": "Artículo 15.- Medidas cautelares. En cualquier etapa de la investigación o del procedimiento sobre delitos constitutivos de violencia intrafamiliar, y aun antes de la formalización, el juez de garantía o el tribunal de juicio oral en lo penal, según corresponda, podrá decretar las medidas cautelares que sean necesarias para proteger a la víctima de manera eficaz y oportuna, tales como las que establecen el artículo 92 de la ley N°19.968, que crea los Tribunales de Familia, o la ley que estatuye medidas para prevenir, sancionar y erradicar la violencia en contra de las mujeres, en razón de su género."}]}, {"id": "N-155", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La posesión, tenencia o porte de armas de fuego de la letra b) del artículo 2° sin autorización se sanciona con:", "f": "Art. 9 Ley 17.798. Inc. 1°.", "g": "N", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio menor en sus grados mínimo a medio", "Presidio mayor en su grado mínimo", "Presidio menor en su grado medio"], "r": 0, "grp": "9|Ley 17.798", "x": [{"c": "Art. 9 Ley 17.798", "t": "Artículo 9º.- Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras b) y d) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado máximo. Los que poseyeren, tuvieren o portaren algunas de las armas o elementos señalados en las letras c) y e) del artículo 2º, sin las autorizaciones a que se refiere el artículo 4º, o sin la inscripción establecida en el artículo 5º, serán sancionados con presidio menor en su grado medio. Si el infractor tuviere algún permiso de los establecidos en el artículo 4 y en el reglamento de esta ley para los elementos señalados en los literales b) y c) del artículo 2, pero diferente a aquel cuya falta se sanciona en los …"}]}, {"id": "N-156v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las penas por los delitos de la Ley de Control de Armas se imponen sin perjuicio de las que correspondan por los delitos cometidos empleando las armas, conforme al artículo 74 del Código Penal.", "f": "Art. 17 B Ley 17.798. Inc. 1°.", "g": "N", "r": 1, "grp": "17 B|Ley 17.798", "x": [{"c": "Art. 17 B Ley 17.798", "t": "Artículo 17 B.- Las penas por los delitos sancionados en esta ley se impondrán sin perjuicio de las que correspondan por los delitos o cuasidelitos que se cometan empleando las armas o elementos señalados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º, de conformidad con lo dispuesto en el artículo 74 del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en …"}]}, {"id": "N-156f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El delito cometido con el arma absorbe siempre al porte o tenencia ilegal de ella.", "f": "Art. 17 B Ley 17.798. Inc. 1°.", "g": "N", "r": 0, "grp": "17 B|Ley 17.798", "x": [{"c": "Art. 17 B Ley 17.798", "t": "Artículo 17 B.- Las penas por los delitos sancionados en esta ley se impondrán sin perjuicio de las que correspondan por los delitos o cuasidelitos que se cometan empleando las armas o elementos señalados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º, de conformidad con lo dispuesto en el artículo 74 del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en …"}]}, {"id": "N-157v", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la pena en los delitos que señala el artículo 17 B de la Ley de Control de Armas, el tribunal no toma en consideración los artículos 65 a 69 del Código Penal.", "f": "Art. 17 B Ley 17.798. Inc. 2°.", "g": "N", "r": 1, "grp": "17 B|Ley 17.798", "x": [{"c": "Art. 17 B Ley 17.798", "t": "… del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en atención al número y entidad de circunstancias atenuantes y agravantes, y a la mayor o menor extensión del mal producido por el delito. En consecuencia, el tribunal no podrá imponer una pena que sea mayor o menor a la señalada por la ley al delito, salvo lo dispuesto en los artículos 51 a 54, 72, 73 y 103 del Código …"}]}, {"id": "N-157f", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Para determinar la pena en los delitos de la Ley de Control de Armas rigen sin modificación los artículos 65 a 69 del Código Penal.", "f": "Art. 17 B Ley 17.798. Inc. 2°.", "g": "N", "r": 0, "grp": "17 B|Ley 17.798", "x": [{"c": "Art. 17 B Ley 17.798", "t": "… del Código Penal. Para determinar la pena en los delitos previstos en los artículos 8º, 9º, 10, 13, 14 y 14 D, y en todos los casos en que se cometa un delito o cuasidelito empleando alguna de las armas o elementos mencionados en el inciso anterior, el tribunal no tomará en consideración lo dispuesto en los artículos 65 a 69 del Código Penal y, en su lugar, determinará su cuantía dentro de los límites de cada pena señalada por la ley al delito, en atención al número y entidad de circunstancias atenuantes y agravantes, y a la mayor o menor extensión del mal producido por el delito. En consecuencia, el tribunal no podrá imponer una pena que sea mayor o menor a la señalada por la ley al delito, salvo lo dispuesto en los artículos 51 a 54, 72, 73 y 103 del Código …"}]}, {"id": "N-158", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "La conducción en estado de ebriedad sin daños ni lesiones, o con daños materiales o lesiones leves, se sanciona con:", "f": "Art. 196 Ley de Tránsito. Inc. 1°.", "g": "N", "i": [], "a": ["Prisión en su grado máximo y multa de una a cinco UTM", "Multa de dos a diez UTM únicamente", "Presidio menor en su grado mínimo y multa de dos a diez UTM", "Presidio menor en su grado medio y multa de cuatro a doce UTM"], "r": 2, "grp": "196|Ley de Tránsito", "x": [{"c": "Art. 196 Ley de Tránsito", "t": "Artículo 196.- El que infrinja la prohibición establecida en el inciso segundo del artículo 110, cuando la conducción, operación o desempeño fueren ejecutados en estado de ebriedad, o bajo la influencia de sustancias estupefacientes o sicotrópicas, será sancionado con la pena de presidio menor en su grado mínimo y multa de dos a diez unidades tributarias mensuales, además de la suspensión de la licencia para conducir vehículos motorizados por el término de dos años, si fuese sorprendido en una primera ocasión, la suspensión por el término de cinco años, si es sorprendido en un segundo evento y, finalmente, con la cancelación de la licencia al ser sorprendido en una tercera ocasión, ya sea que no se ocasione daño alguno, o que con ello se causen daños materiales o lesiones leves. …"}]}, {"id": "N-159", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "En los delitos del inciso tercero del artículo 196 de la Ley de Tránsito, la ejecución de la pena sustitutiva queda en suspenso por:", "f": "Art. 196 ter Ley de
