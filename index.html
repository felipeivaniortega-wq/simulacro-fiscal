 y destierro, las cuales se ejecutarán después de haber cumplido cualquiera otra pena de las comprendidas en la escala gradual núm. 1."}]}, {"id": "M-70f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Al culpable de dos o más delitos se le impone sólo la pena del delito más grave, aumentada en un grado.", "f": "Art. 74 CP. Concurso real: acumulación material. Las penas se cumplen simultáneamente si es posible; si no, en orden sucesivo, principiando por las más graves.", "g": "N", "r": 0, "grp": "74|CP", "x": [{"c": "Art. 74 CP", "t": "ART. 74. Al culpable de dos o más delitos se le impondrán todas las penas correspondientes a las diversas infracciones. El sentenciado cumplirá todas sus condenas simultáneamente, siendo posible. Cuando no lo fuere, o si de ello hubiere de resultar ilusoria alguna de las penas, las sufrirá en orden sucesivo, principiando por las más graves o sea las más altas en la escala respectiva, excepto las de confinamiento, extrañamiento, relegación y destierro, las cuales se ejecutarán después de haber cumplido cualquiera otra pena de las comprendidas en la escala gradual núm. 1."}]}, {"id": "M-71v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Son cómplices los que, no hallándose comprendidos en el artículo 15, cooperan a la ejecución del hecho por actos anteriores o simultáneos.", "f": "Art. 16 CP. La intervención posterior a la ejecución es propia del encubrimiento (art. 17).", "g": "N", "r": 1, "grp": "16|CP", "x": [{"c": "Art. 16 CP", "t": "ART. 16. Son cómplices los que, no hallándose comprendidos en el artículo anterior, cooperan a la ejecución del hecho por actos anteriores o simultáneos."}]}, {"id": "M-71f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Son cómplices los que cooperan a la ejecución del hecho por actos posteriores a su consumación.", "f": "Art. 16 CP. La intervención posterior a la ejecución es propia del encubrimiento (art. 17).", "g": "N", "r": 0, "grp": "16|CP", "x": [{"c": "Art. 16 CP", "t": "ART. 16. Son cómplices los que, no hallándose comprendidos en el artículo anterior, cooperan a la ejecución del hecho por actos anteriores o simultáneos."}]}, {"id": "M-72v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Hay crimen o simple delito frustrado cuando el delincuente pone de su parte todo lo necesario para que se consume y esto no se verifica por causas independientes de su voluntad.", "f": "Art. 7 CP. La segunda descripción corresponde a la tentativa.", "g": "N", "r": 1, "grp": "7|CP", "x": [{"c": "Art. 7 CP", "t": "ART. 7. Son punibles, no sólo el crimen o simple delito consumado, sino el frustrado y la tentativa. Hay crimen o simple delito frustrado cuando el delincuente pone de su parte todo lo necesario para que el crimen o simple delito se consume y esto no se verifica por causas independientes de su voluntad. Hay tentativa cuando el culpable da principio a la ejecución del crimen o simple delito por hechos directos, pero faltan uno o más para su complemento."}]}, {"id": "M-72f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Hay crimen o simple delito frustrado cuando el culpable da principio a la ejecución por hechos directos, pero faltan uno o más para su complemento.", "f": "Art. 7 CP. La segunda descripción corresponde a la tentativa.", "g": "N", "r": 0, "grp": "7|CP", "x": [{"c": "Art. 7 CP", "t": "ART. 7. Son punibles, no sólo el crimen o simple delito consumado, sino el frustrado y la tentativa. Hay crimen o simple delito frustrado cuando el delincuente pone de su parte todo lo necesario para que el crimen o simple delito se consume y esto no se verifica por causas independientes de su voluntad. Hay tentativa cuando el culpable da principio a la ejecución del crimen o simple delito por hechos directos, pero faltan uno o más para su complemento."}]}, {"id": "M-73v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las acciones u omisiones penadas por la ley se reputan siempre voluntarias, a no ser que conste lo contrario.", "f": "Art. 1 CP. Inc. 2° CP.", "g": "N", "r": 1, "grp": "1|CP", "x": [{"c": "Art. 1 CP", "t": "ARTÍCULO 1. Es delito toda acción u omisión voluntaria penada por la ley. Las acciones u omisiones penadas por la ley se reputan siempre voluntarias, a no ser que conste lo contrario. El que cometiere delito será responsable de él e incurrirá en la pena que la ley señale, aunque el mal recaiga sobre persona distinta de aquella a quien se proponía ofender. En tal caso no se tomarán en consideración las circunstancias, no conocidas por el delincuente, que agravarían su responsabilidad; pero sí aquellas que la atenúen."}]}, {"id": "M-73f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Las acciones u omisiones penadas por la ley se reputan involuntarias mientras no se pruebe el dolo.", "f": "Art. 1 CP. Inc. 2° CP.", "g": "N", "r": 0, "grp": "1|CP", "x": [{"c": "Art. 1 CP", "t": "ARTÍCULO 1. Es delito toda acción u omisión voluntaria penada por la ley. Las acciones u omisiones penadas por la ley se reputan siempre voluntarias, a no ser que conste lo contrario. El que cometiere delito será responsable de él e incurrirá en la pena que la ley señale, aunque el mal recaiga sobre persona distinta de aquella a quien se proponía ofender. En tal caso no se tomarán en consideración las circunstancias, no conocidas por el delincuente, que agravarían su responsabilidad; pero sí aquellas que la atenúen."}]}, {"id": "M-74v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Si después de cometido el delito y antes de la sentencia de término se promulga una ley que exime el hecho de toda pena o le aplica una menos rigorosa, el juzgamiento debe arreglarse a ella.", "f": "Art. 18 CP. Retroactividad de la ley penal más favorable; alcanza incluso a sentencias ejecutoriadas, que el tribunal debe modificar de oficio o a petición de parte.", "g": "N", "r": 1, "grp": "18|CP", "x": [{"c": "Art. 18 CP", "t": "ART. 18. Ningún delito se castigará con otra pena que la que le señale una ley promulgada con anterioridad a su perpetración. Si después de cometido el delito y antes de que se pronuncie sentencia de término, se promulgare otra ley que exima tal hecho de toda pena o le aplique una menos rigorosa, deberá arreglarse a ella su juzgamiento. Si la ley que exima el hecho de toda pena o le aplique una menos rigurosa se promulgare después de ejecutoriada la sentencia, sea que se haya cumplido o no la condena impuesta, el tribunal que hubiere pronunciado dicha sentencia, en primera o única instancia, deberá modificarla de oficio o a petición de parte. En ningún caso la aplicación de este artículo Art. …"}]}, {"id": "M-74f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Si después de cometido el delito se promulga una ley que le aplica una pena menos rigorosa, ésta sólo rige para los hechos cometidos con posterioridad.", "f": "Art. 18 CP. Retroactividad de la ley penal más favorable; alcanza incluso a sentencias ejecutoriadas, que el tribunal debe modificar de oficio o a petición de parte.", "g": "N", "r": 0, "grp": "18|CP", "x": [{"c": "Art. 18 CP", "t": "ART. 18. Ningún delito se castigará con otra pena que la que le señale una ley promulgada con anterioridad a su perpetración. Si después de cometido el delito y antes de que se pronuncie sentencia de término, se promulgare otra ley que exima tal hecho de toda pena o le aplique una menos rigorosa, deberá arreglarse a ella su juzgamiento. Si la ley que exima el hecho de toda pena o le aplique una menos rigurosa se promulgare después de ejecutoriada la sentencia, sea que se haya cumplido o no la condena impuesta, el tribunal que hubiere pronunciado dicha sentencia, en primera o única instancia, deberá modificarla de oficio o a petición de parte. En ningún caso la aplicación de este artículo Art. …"}]}, {"id": "M-75v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La muerte del responsable extingue la responsabilidad penal siempre en cuanto a las penas personales y, respecto de las pecuniarias, sólo cuando a su fallecimiento no se hubiere dictado sentencia ejecutoriada.", "f": "Art. 93 CP. N° 1 CP.", "g": "N", "r": 1, "grp": "93|CP", "x": [{"c": "Art. 93 CP", "t": "ART. 93. La responsabilidad penal se extingue: 1.° Por la muerte del responsable, siempre en cuanto a las penas personales, y respecto de las pecuniarias sólo cuando a su fallecimiento no se hubiere dictado sentencia ejecutoriada. 2.° Por el cumplimiento de la condena. 3.° Por amnistía, la cual extingue por completo la pena y todos sus efectos. 4.° Por indulto. La gracia de indulto sólo remite o conmuta la pena; pero no quita al favorecido el carácter de condenado para los efectos de la reincidencia o nuevo delinquimiento y demás que determinan las leyes. 5.° Por el perdón del ofendido cuando la pena se haya impuesto por delitos respecto de los cuales la ley sólo concede acción privada. 6.° Por la prescripción de la acción penal. 7.° Por la prescripción de la pena."}]}, {"id": "M-75f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La muerte del responsable extingue la responsabilidad penal tanto respecto de las penas personales como de las pecuniarias, en todo caso.", "f": "Art. 93 CP. N° 1 CP.", "g": "N", "r": 0, "grp": "93|CP", "x": [{"c": "Art. 93 CP", "t": "ART. 93. La responsabilidad penal se extingue: 1.° Por la muerte del responsable, siempre en cuanto a las penas personales, y respecto de las pecuniarias sólo cuando a su fallecimiento no se hubiere dictado sentencia ejecutoriada. 2.° Por el cumplimiento de la condena. 3.° Por amnistía, la cual extingue por completo la pena y todos sus efectos. 4.° Por indulto. La gracia de indulto sólo remite o conmuta la pena; pero no quita al favorecido el carácter de condenado para los efectos de la reincidencia o nuevo delinquimiento y demás que determinan las leyes. 5.° Por el perdón del ofendido cuando la pena se haya impuesto por delitos respecto de los cuales la ley sólo concede acción privada. 6.° Por la prescripción de la acción penal. 7.° Por la prescripción de la pena."}]}, {"id": "M-76", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "En la reiteración de crímenes o simples delitos de una misma especie, si las infracciones pueden estimarse como un solo delito, se impone la pena correspondiente a ellas:", "f": "Art. 351 CPP. Si no pueden estimarse como un solo delito, se aplica la pena de la infracción que, con sus circunstancias, tenga pena mayor, aumentada en uno o dos grados. Puede aplicarse el art. 74 CP si resulta una pena menor.", "g": "N", "i": [], "a": ["Aumentándola en un grado", "Sumando las penas de cada infracción", "Aumentándola en uno o dos grados", "En su grado máximo"], "r": 2, "grp": "351|CPP", "x": [{"c": "Art. 351 CPP", "t": "Artículo 351.- Reiteración de crímenes o simples delitos de una misma especie. En los casos de reiteración de crímenes o simples delitos de una misma especie se impondrá la pena correspondiente a las diversas infracciones, estimadas como un solo delito, aumentándola en uno o dos grados. Si, por la naturaleza de las diversas infracciones, éstas no pudieren estimarse como un solo delito, el tribunal aplicará la pena señalada a aquella que, considerada aisladamente, con las circunstancias del caso, tuviere asignada una pena mayor, aumentándola en uno o dos grados, según fuere el número de los delitos. Podrá, con todo, aplicarse las penas en la forma establecida en el artículo 74 del Código Penal si, de seguirse este procedimiento, hubiere de corresponder al condenado una pena menor. …"}, {"c": "Art. 74 CP", "t": "ART. 74. Al culpable de dos o más delitos se le impondrán todas las penas correspondientes a las diversas infracciones. El sentenciado cumplirá todas sus condenas simultáneamente, siendo posible. Cuando no lo fuere, o si de ello hubiere de resultar ilusoria alguna de las penas, las sufrirá en orden sucesivo, principiando por las más graves o sea las más altas en la escala respectiva, excepto las de confinamiento, extrañamiento, relegación y destierro, las cuales se ejecutarán después de haber cumplido cualquiera otra pena de las comprendidas en la escala gradual núm. 1."}]}, {"id": "M-77v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Salvo las excepciones legales, durante el juicio oral no se pueden incorporar ni invocar como medios de prueba ni dar lectura a los registros de actuaciones realizadas por la policía o el Ministerio Público.", "f": "Art. 334 CPP. Las excepciones son los arts. 331 y 332 (lectura de declaraciones anteriores para apoyo de memoria o para demostrar contradicciones).", "g": "N", "r": 1, "grp": "334|CPP", "x": [{"c": "Art. 334 CPP", "t": "Artículo 334.- Prohibición de lectura de registros y documentos. Salvo en los casos previstos en los artículos 331 y 332, no se podrá incorporar o invocar como medios de prueba ni dar lectura durante el juicio oral, a los registros y demás documentos que dieren cuenta de diligencias o actuaciones realizadas por la policía o el ministerio público. Ni aun en los casos señalados se podrá incorporar como medio de prueba o dar lectura a actas o documentos que dieren cuenta de actuaciones o diligencias declaradas nulas, o en cuya obtención se hubieren vulnerado garantías fundamentales."}]}, {"id": "M-77f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Durante el juicio oral pueden incorporarse mediante lectura los partes policiales y los registros de la investigación fiscal.", "f": "Art. 334 CPP. Las excepciones son los arts. 331 y 332 (lectura de declaraciones anteriores para apoyo de memoria o para demostrar contradicciones).", "g": "N", "r": 0, "grp": "334|CPP", "x": [{"c": "Art. 334 CPP", "t": "Artículo 334.- Prohibición de lectura de registros y documentos. Salvo en los casos previstos en los artículos 331 y 332, no se podrá incorporar o invocar como medios de prueba ni dar lectura durante el juicio oral, a los registros y demás documentos que dieren cuenta de diligencias o actuaciones realizadas por la policía o el ministerio público. Ni aun en los casos señalados se podrá incorporar como medio de prueba o dar lectura a actas o documentos que dieren cuenta de actuaciones o diligencias declaradas nulas, o en cuya obtención se hubieren vulnerado garantías fundamentales."}]}, {"id": "M-78v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El tribunal puede ordenar la recepción de prueba no ofrecida oportunamente cuando la parte justifica no haber sabido de su existencia sino hasta ese momento.", "f": "Art. 336 CPP. También admite prueba sobre prueba cuando surge una controversia sobre la veracidad, autenticidad o integridad de una prueba.", "g": "N", "r": 1, "grp": "336|CPP", "x": [{"c": "Art. 336 CPP", "t": "Artículo 336.- Prueba no solicitada oportunamente. A petición de alguna de las partes, el tribunal podrá ordenar la recepción de pruebas que ella no hubiere ofrecido oportunamente, cuando justificare no haber sabido de su existencia sino hasta ese momento. Si con ocasión de la rendición de una prueba surgiere una controversia relacionada exclusivamente con su veracidad, autenticidad o integridad, el tribunal podrá autorizar la presentación de nuevas pruebas destinadas a esclarecer esos puntos, aunque ellas no hubieren sido ofrecidas oportunamente y siempre que no hubiere sido posible prever su necesidad."}]}, {"id": "M-78f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El tribunal de juicio oral no puede recibir en caso alguno prueba que no haya sido incluida en el auto de apertura.", "f": "Art. 336 CPP. También admite prueba sobre prueba cuando surge una controversia sobre la veracidad, autenticidad o integridad de una prueba.", "g": "N", "r": 0, "grp": "336|CPP", "x": [{"c": "Art. 336 CPP", "t": "Artículo 336.- Prueba no solicitada oportunamente. A petición de alguna de las partes, el tribunal podrá ordenar la recepción de pruebas que ella no hubiere ofrecido oportunamente, cuando justificare no haber sabido de su existencia sino hasta ese momento. Si con ocasión de la rendición de una prueba surgiere una controversia relacionada exclusivamente con su veracidad, autenticidad o integridad, el tribunal podrá autorizar la presentación de nuevas pruebas destinadas a esclarecer esos puntos, aunque ellas no hubieren sido ofrecidas oportunamente y siempre que no hubiere sido posible prever su necesidad."}]}, {"id": "M-79v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "En el interrogatorio, la parte que presentó al testigo o perito no puede formular sus preguntas de manera que sugieran la respuesta.", "f": "Art. 330 CPP. En el contrainterrogatorio sí se admiten preguntas sugestivas; lo vedado en todo caso son las engañosas, las destinadas a coaccionar y las poco claras.", "g": "N", "r": 1, "grp": "330|CPP", "x": [{"c": "Art. 330 CPP", "t": "Artículo 330.- Métodos de interrogación. En sus interrogatorios, las partes que hubieren presentado a un testigo o perito no podrán formular sus preguntas de tal manera que ellas sugirieren la respuesta. En relación a la víctima, no se podrán realizar interrogaciones ni contrainterrogatorios que humillen, causen sufrimiento, intimiden o lesionen su dignidad. Durante el contrainterrogatorio, las partes podrán N° 8, a) confrontar al perito o testigo con su propios dichos u otras versiones de los hechos presentadas en el juicio. En ningún caso se admitirán preguntas engañosas, aquéllas destinadas a coaccionar o a acosar ilegítimamente al testigo o perito, ni las que fueren formuladas en términos poco claros para ellos. Estas normas se aplicarán al imputado cuando se N° 8, b) allanare a prestar declaración."}]}, {"id": "M-79f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Las preguntas sugestivas están prohibidas tanto en el interrogatorio como en el contrainterrogatorio.", "f": "Art. 330 CPP. En el contrainterrogatorio sí se admiten preguntas sugestivas; lo vedado en todo caso son las engañosas, las destinadas a coaccionar y las poco claras.", "g": "N", "r": 0, "grp": "330|CPP", "x": [{"c": "Art. 330 CPP", "t": "Artículo 330.- Métodos de interrogación. En sus interrogatorios, las partes que hubieren presentado a un testigo o perito no podrán formular sus preguntas de tal manera que ellas sugirieren la respuesta. En relación a la víctima, no se podrán realizar interrogaciones ni contrainterrogatorios que humillen, causen sufrimiento, intimiden o lesionen su dignidad. Durante el contrainterrogatorio, las partes podrán N° 8, a) confrontar al perito o testigo con su propios dichos u otras versiones de los hechos presentadas en el juicio. En ningún caso se admitirán preguntas engañosas, aquéllas destinadas a coaccionar o a acosar ilegítimamente al testigo o perito, ni las que fueren formuladas en términos poco claros para ellos. Estas normas se aplicarán al imputado cuando se N° 8, b) allanare a prestar declaración."}]}, {"id": "M-80v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La sentencia condenatoria no puede exceder el contenido de la acusación.", "f": "Art. 341 CPP. Principio de congruencia. El tribunal sí puede dar al hecho una calificación jurídica distinta, advirtiéndolo a los intervinientes durante la audiencia.", "g": "N", "r": 1, "grp": "341|CPP", "x": [{"c": "Art. 341 CPP", "t": "Artículo 341.- Sentencia y acusación. La sentencia condenatoria no podrá exceder el contenido de la acusación. En consecuencia, no se podrá condenar por hechos o circunstancias no contenidos en ella. Con todo, el tribunal podrá dar al hecho una calificación jurídica distinta de aquella contenida en la acusación o apreciar la concurrencia de causales modificatorias agravantes de la responsabilidad penal no incluidas en ella, siempre que hubiere advertido a los intervinientes durante la audiencia. Si durante la deliberación uno o más jueces consideraren la posibilidad de otorgar a los hechos una calificación distinta de la establecida en la acusación, que no hubiere sido objeto de discusión durante la audiencia, deberán reabrirla, a objeto de permitir a las partes debatir sobre ella."}]}, {"id": "M-80f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La sentencia condenatoria puede extenderse a hechos no contenidos en la acusación si resultaron probados en el juicio.", "f": "Art. 341 CPP. Principio de congruencia. El tribunal sí puede dar al hecho una calificación jurídica distinta, advirtiéndolo a los intervinientes durante la audiencia.", "g": "N", "r": 0, "grp": "341|CPP", "x": [{"c": "Art. 341 CPP", "t": "Artículo 341.- Sentencia y acusación. La sentencia condenatoria no podrá exceder el contenido de la acusación. En consecuencia, no se podrá condenar por hechos o circunstancias no contenidos en ella. Con todo, el tribunal podrá dar al hecho una calificación jurídica distinta de aquella contenida en la acusación o apreciar la concurrencia de causales modificatorias agravantes de la responsabilidad penal no incluidas en ella, siempre que hubiere advertido a los intervinientes durante la audiencia. Si durante la deliberación uno o más jueces consideraren la posibilidad de otorgar a los hechos una calificación distinta de la establecida en la acusación, que no hubiere sido objeto de discusión durante la audiencia, deberán reabrirla, a objeto de permitir a las partes debatir sobre ella."}]}, {"id": "M-81", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La acusación sólo puede referirse a:", "f": "Art. 259 CPP. Es la primera exigencia de congruencia: formalización, acusación y sentencia deben referirse a los mismos hechos y personas.", "g": "N", "i": [], "a": ["Hechos y personas incluidos en la formalización de la investigación, aunque se efectúe una distinta calificación jurídica", "Hechos incluidos en la formalización y cualquier persona que resulte responsable", "Cualquier hecho que resulte acreditado durante la investigación", "Hechos y personas incluidos en la querella"], "r": 0, "grp": "259|CPP", "x": [{"c": "Art. 259 CPP", "t": "… Si el fiscal solicita la aplicación del comiso de ganancias o, de ser procedente, del comiso por valor equivalente de efectos o instrumentos del delito, deberá indicar su monto aproximado y expresar con claridad y precisión los fundamentos de su solicitud, y señalará los medios de prueba de que piensa valerse y dando, en su caso, cumplimiento a lo dispuesto en el inciso precedente. La acusación sólo podrá referirse a hechos y personas incluidos en la formalización de la investigación, aunque se efectuare una distinta calificación jurídica. Con todo, en la acusación podrá solicitarse el comiso de ganancias respecto de terceros en los casos previstos por la ley. Párrafo 2º Audiencia de preparación del juicio oral"}]}, {"id": "M-82", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La formalización de la investigación es:", "f": "Art. 229 CPP. Es un acto del fiscal, no una resolución judicial: el juez no la califica ni puede negarla.", "g": "N", "i": [], "a": ["La comunicación que el fiscal efectúa al imputado, en presencia del juez de garantía, de que desarrolla actualmente una investigación en su contra respecto de uno o más delitos determinados", "El escrito en que el fiscal solicita la apertura del juicio oral", "La comunicación que la policía efectúa al detenido sobre los motivos de su detención", "La resolución del juez de garantía que somete al imputado al procedimiento"], "r": 0, "grp": "229|CPP", "x": [{"c": "Art. 229 CPP", "t": "Artículo 229.- Concepto de la formalización de la investigación. La formalización de la investigación es la comunicación que el fiscal efectúa al imputado, en presencia del juez de garantía, de que desarrolla actualmente una investigación en su contra respecto de uno o más delitos determinados."}]}, {"id": "M-84", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "¿Cuál de las siguientes NO es causal de sobreseimiento definitivo?", "f": "Art. 250 CPP. La rebeldía es causal de sobreseimiento temporal (art. 252).", "g": "N", "i": [], "a": ["Que el imputado sea declarado rebelde", "Que se haya extinguido la responsabilidad penal del imputado", "Que aparezca claramente establecida la inocencia del imputado", "Que el hecho investigado no sea constitutivo de delito"], "r": 0, "grp": "250|CPP", "x": [{"c": "Art. 250 CPP", "t": "Artículo 250.- Sobreseimiento definitivo. El juez de garantía decretará el sobreseimiento definitivo: a) Cuando el hecho investigado no fuere constitutivo de delito; b) Cuando apareciere claramente establecida la inocencia del imputado; c) Cuando el imputado estuviere exento de responsabilidad criminal en conformidad al artículo 10 del Código Penal o en virtud de otra disposición legal; d) Cuando se hubiere extinguido la responsabilidad penal del imputado por algunos de los motivos establecidos en la ley; e) Cuando sobreviniere un hecho que, con arreglo a la ley, pusiere fin a dicha responsabilidad, y f) Cuando el hecho de que se tratare hubiere sido materia de un procedimiento penal en el que hubiere recaído sentencia firme respecto del imputado. …"}]}, {"id": "M-85", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "¿Cuál de las siguientes es causal de sobreseimiento temporal?", "f": "Art. 252 CPP. Las otras dos causales son la cuestión prejudicial civil y la rebeldía. La insuficiencia de antecedentes da lugar a la decisión de no perseverar, no a sobreseimiento.", "g": "N", "i": [], "a": ["Que después de cometido el delito el imputado caiga en enajenación mental", "Que no existan antecedentes suficientes para fundar una acusación", "Que el imputado esté exento de responsabilidad criminal", "Que el hecho ya haya sido materia de un procedimiento con sentencia firme"], "r": 0, "grp": "252|CPP", "x": [{"c": "Art. 252 CPP", "t": "Artículo 252.- Sobreseimiento temporal. El juez de garantía decretará el sobreseimiento temporal en los siguientes casos: a) Cuando para el juzgamiento criminal se requiriere la resolución previa de una cuestión civil, de acuerdo con lo dispuesto en el artículo 171; b) Cuando el imputado no compareciere al procedimiento y fuere declarado rebelde, de acuerdo con lo dispuesto en los artículos 99 y siguientes, y c) Cuando, después de cometido el delito, el imputado cayere en enajenación mental, de acuerdo con lo dispuesto en el Título VII del Libro Cuarto. El tribunal de juicio oral en lo penal dictará sobreseimiento temporal cuando el acusado no hubiere comparecido a la audiencia del juicio oral y hubiere sido declarado rebelde de conformidad a lo dispuesto en los artículos 100 y 101 de este Código."}]}, {"id": "M-86v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Cualquier persona capaz de parecer en juicio domiciliada en la provincia puede querellarse respecto de hechos punibles cometidos en ella que constituyan delitos terroristas o delitos cometidos por un funcionario público que afecten derechos constitucionales o la probidad pública.", "f": "Art. 111 CPP. Es la excepción a la regla de que la querella corresponde a la víctima.", "g": "N", "r": 1, "grp": "111|CPP", "x": [{"c": "Art. 111 CPP", "t": "Artículo 111.- Querellante. La querella podrá ser interpuesta por la víctima, su representante legal o su heredero testamentario. También se podrá querellar cualquier persona capaz de parecer en juicio domiciliada en la provincia, respecto de hechos punibles cometidos en la misma que constituyeren delitos terroristas, o delitos cometidos por un funcionario público que afectaren derechos de las personas garantizados por la Constitución o contra la probidad pública. Los órganos y servicios públicos sólo podrán interponer querella cuando sus respectivas leyes orgánicas les otorguen expresamente las potestades correspondientes."}]}, {"id": "M-86f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Sólo la víctima, su representante legal o su heredero testamentario pueden deducir querella, sin excepción.", "f": "Art. 111 CPP. Es la excepción a la regla de que la querella corresponde a la víctima.", "g": "N", "r": 0, "grp": "111|CPP", "x": [{"c": "Art. 111 CPP", "t": "Artículo 111.- Querellante. La querella podrá ser interpuesta por la víctima, su representante legal o su heredero testamentario. También se podrá querellar cualquier persona capaz de parecer en juicio domiciliada en la provincia, respecto de hechos punibles cometidos en la misma que constituyeren delitos terroristas, o delitos cometidos por un funcionario público que afectaren derechos de las personas garantizados por la Constitución o contra la probidad pública. Los órganos y servicios públicos sólo podrán interponer querella cuando sus respectivas leyes orgánicas les otorguen expresamente las potestades correspondientes."}]}, {"id": "M-87v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el procedimiento penal termina o se suspende sin decisión sobre la acción civil oportunamente deducida, la prescripción continúa interrumpida siempre que la víctima presente su demanda ante el tribunal civil competente dentro de sesenta días.", "f": "Art. 68 CPP. El plazo se cuenta desde que quede ejecutoriada la resolución que dispone la suspensión o terminación del procedimiento.", "g": "N", "r": 1, "grp": "68|CPP", "x": [{"c": "Art. 68 CPP", "t": "… Si antes de comenzar el juicio oral, el procedimiento penal continuare de conformidad a las normas que regulan el procedimiento abreviado, o por cualquier causa terminare o se suspendiere, sin decisión acerca de la acción civil que se hubiere deducido oportunamente, la prescripción continuará interrumpida siempre que la víctima presentare su demanda ante el tribunal civil competente en el término de sesenta días siguientes a aquél en que, por resolución ejecutoriada, se dispusiere la suspensión o terminación del procedimiento penal. En este caso, la demanda y la resolución que recayere en ella se notificarán por cédula y el juicio se sujetará a las reglas del procedimiento sumario. Si la demanda no fuere deducida ante el tribunal civil competente dentro del referido plazo, la prescripción continuará corriendo como si no se hubiere interrumpido. …"}]}, {"id": "M-87f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Si el procedimiento penal termina o se suspende sin decisión sobre la acción civil oportunamente deducida, la víctima debe presentar su demanda ante el tribunal civil dentro de treinta días.", "f": "Art. 68 CPP. El plazo se cuenta desde que quede ejecutoriada la resolución que dispone la suspensión o terminación del procedimiento.", "g": "N", "r": 0, "grp": "68|CPP", "x": [{"c": "Art. 68 CPP", "t": "… Si antes de comenzar el juicio oral, el procedimiento penal continuare de conformidad a las normas que regulan el procedimiento abreviado, o por cualquier causa terminare o se suspendiere, sin decisión acerca de la acción civil que se hubiere deducido oportunamente, la prescripción continuará interrumpida siempre que la víctima presentare su demanda ante el tribunal civil competente en el término de sesenta días siguientes a aquél en que, por resolución ejecutoriada, se dispusiere la suspensión o terminación del procedimiento penal. En este caso, la demanda y la resolución que recayere en ella se notificarán por cédula y el juicio se sujetará a las reglas del procedimiento sumario. Si la demanda no fuere deducida ante el tribunal civil competente dentro del referido plazo, la prescripción continuará corriendo como si no se hubiere interrumpido. …"}]}, {"id": "M-88v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Las facultades, derechos y garantías del imputado pueden hacerse valer desde la primera actuación del procedimiento dirigido en su contra y hasta la completa ejecución de la sentencia.", "f": "Art. 7 CPP. Primera actuación es cualquier diligencia o gestión, de investigación, cautelar o de otra especie, ante un tribunal, el Ministerio Público o la policía, en que se atribuya a una persona responsabilidad en un hecho punible.", "g": "N", "r": 1, "grp": "7|CPP", "x": [{"c": "Art. 7 CPP", "t": "Artículo 7º.- Calidad de imputado. Las facultades, derechos y garantías que la Constitución Política de la República, este Código y otras leyes reconocen al imputado, podrán hacerse valer por la persona a quien se atribuyere participación en un hecho punible desde la primera actuación del procedimiento dirigido en su contra y hasta la completa ejecución de la sentencia. Para este efecto, se entenderá por primera actuación del procedimiento cualquiera diligencia o gestión, sea de investigación, de carácter cautelar o de otra especie, que se realizare por o ante un tribunal con competencia en lo criminal, el ministerio público o la policía, en la que se atribuyere a una persona responsabilidad en un hecho punible. En las investigaciones iniciadas por el Ministerio Público, los funcionarios policiales o de Gendarmería de Chile, de las Fuerzas Armadas y los funcionarios de los servicios de su dependencia, en cumplimiento …"}]}, {"id": "M-88f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Las facultades, derechos y garantías del imputado pueden hacerse valer sólo desde la formalización de la investigación.", "f": "Art. 7 CPP. Primera actuación es cualquier diligencia o gestión, de investigación, cautelar o de otra especie, ante un tribunal, el Ministerio Público o la policía, en que se atribuya a una persona responsabilidad en un hecho punible.", "g": "N", "r": 0, "grp": "7|CPP", "x": [{"c": "Art. 7 CPP", "t": "Artículo 7º.- Calidad de imputado. Las facultades, derechos y garantías que la Constitución Política de la República, este Código y otras leyes reconocen al imputado, podrán hacerse valer por la persona a quien se atribuyere participación en un hecho punible desde la primera actuación del procedimiento dirigido en su contra y hasta la completa ejecución de la sentencia. Para este efecto, se entenderá por primera actuación del procedimiento cualquiera diligencia o gestión, sea de investigación, de carácter cautelar o de otra especie, que se realizare por o ante un tribunal con competencia en lo criminal, el ministerio público o la policía, en la que se atribuyere a una persona responsabilidad en un hecho punible. En las investigaciones iniciadas por el Ministerio Público, los funcionarios policiales o de Gendarmería de Chile, de las Fuerzas Armadas y los funcionarios de los servicios de su dependencia, en cumplimiento …"}]}, {"id": "M-89v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Ninguna persona será considerada culpable ni tratada como tal en tanto no fuere condenada por una sentencia firme.", "f": "Art. 4 CPP. Presunción de inocencia.", "g": "N", "r": 1, "grp": "4|CPP", "x": [{"c": "Art. 4 CPP", "t": "Artículo 4º.- Presunción de inocencia del imputado. Ninguna persona será considerada culpable ni tratada como tal en tanto no fuere condenada por una sentencia firme."}]}, {"id": "M-89f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Ninguna persona será considerada culpable ni tratada como tal en tanto no se formalice la investigación en su contra.", "f": "Art. 4 CPP. Presunción de inocencia.", "g": "N", "r": 0, "grp": "4|CPP", "x": [{"c": "Art. 4 CPP", "t": "Artículo 4º.- Presunción de inocencia del imputado. Ninguna persona será considerada culpable ni tratada como tal en tanto no fuere condenada por una sentencia firme."}]}, {"id": "M-90v", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Toda actuación del procedimiento que prive al imputado o a un tercero del ejercicio de los derechos que la Constitución asegura, o lo restrinja o perturbe, requiere autorización judicial previa.", "f": "Art. 9 CPP. En casos urgentes la autorización puede pedirse y otorgarse por cualquier medio idóneo (teléfono, fax, correo electrónico), dejando constancia posterior, pero siempre la da el juez.", "g": "N", "r": 1, "grp": "9|CPP", "x": [{"c": "Art. 9 CPP", "t": "Artículo 9º.- Autorización judicial previa. Toda actuación del procedimiento que privare al imputado o a un tercero del ejercicio de los derechos que la Constitución asegura, o lo restringiere o perturbare, requerirá de autorización judicial previa. En consecuencia, cuando una diligencia de investigación pudiere producir alguno de tales efectos, el fiscal deberá solicitar previamente autorización al juez de garantía. Tratándose de casos urgentes, en que la inmediata autorización u orden judicial sea indispensable para el éxito de la diligencia, podrá ser solicitada y otorgada por cualquier medio idóneo al efecto, tales como teléfono, fax, correo electrónico u otro, sin perjuicio de la constancia posterior, en el registro correspondiente. No obstante lo anterior, en caso de una detención se deberá entregar por el funcionario policial que la practique una constancia de aquélla, con indicación del tribunal que la expidió, del delito que le sirve …"}]}, {"id": "M-90f", "o": "Preguntas nuevas", "t": "vf", "m": "PP", "e": "Las actuaciones que restringen derechos constitucionales del imputado pueden ser autorizadas por el Fiscal Regional en casos urgentes.", "f": "Art. 9 CPP. En casos urgentes la autorización puede pedirse y otorgarse por cualquier medio idóneo (teléfono, fax, correo electrónico), dejando constancia posterior, pero siempre la da el juez.", "g": "N", "r": 0, "grp": "9|CPP", "x": [{"c": "Art. 9 CPP", "t": "Artículo 9º.- Autorización judicial previa. Toda actuación del procedimiento que privare al imputado o a un tercero del ejercicio de los derechos que la Constitución asegura, o lo restringiere o perturbare, requerirá de autorización judicial previa. En consecuencia, cuando una diligencia de investigación pudiere producir alguno de tales efectos, el fiscal deberá solicitar previamente autorización al juez de garantía. Tratándose de casos urgentes, en que la inmediata autorización u orden judicial sea indispensable para el éxito de la diligencia, podrá ser solicitada y otorgada por cualquier medio idóneo al efecto, tales como teléfono, fax, correo electrónico u otro, sin perjuicio de la constancia posterior, en el registro correspondiente. No obstante lo anterior, en caso de una detención se deberá entregar por el funcionario policial que la practique una constancia de aquélla, con indicación del tribunal que la expidió, del delito que le sirve …"}]}, {"id": "M-91", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "¿En cuál de los siguientes casos NO puede ordenarse la prisión preventiva?", "f": "Art. 141 CPP. Tampoco procede en delitos de acción privada ni cuando el imputado está cumpliendo efectivamente una pena privativa de libertad.", "g": "N", "i": [], "a": ["Cuando el delito imputado tiene asignada pena de simple delito", "Cuando el delito imputado está sancionado únicamente con penas pecuniarias o privativas de derechos", "Cuando el imputado tiene domicilio conocido", "Cuando el imputado no tiene antecedentes penales"], "r": 1, "grp": "141|CPP", "x": [{"c": "Art. 141 CPP", "t": "Artículo 141. Improcedencia de la prisión preventiva. No se podrá ordenar la prisión preventiva: a) Cuando el delito imputado estuviere sancionado únicamente con penas pecuniarias o privativas de derechos; b) Cuando se tratare de delitos de acción privada, y c) Cuando el imputado se encontrare cumpliendo efectivamente una pena privativa de libertad. Si por cualquier motivo fuere a cesar el cumplimiento efectivo de la pena y el fiscal o el querellante estimaren necesaria la prisión preventiva o alguna de las medidas previstas en el Párrafo 6º, podrá solicitarlas anticipadamente, de conformidad a las disposiciones de este Párrafo, a fin de que, si el tribunal acogiere la solicitud, la medida se aplique al imputado en cuanto cese el cumplimiento efectivo de la pena, sin solución de continuidad. …"}]}, {"id": "M-92v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El tribunal puede restringir o prohibir las comunicaciones del detenido o preso hasta por un máximo de diez días, sin que ello afecte el acceso a su abogado.", "f": "Art. 151 CPP. La restricción nunca alcanza al abogado, al propio tribunal ni a la atención médica.", "g": "N", "r": 1, "grp": "151|CPP", "x": [{"c": "Art. 151 CPP", "t": "Artículo 151.- Prohibición de comunicaciones. El tribunal podrá, a petición del fiscal, restringir o prohibir las comunicaciones del detenido o preso hasta por un máximo de diez días, cuando considerare que ello resulta necesario para el exitoso desarrollo de la investigación. En todo caso esta facultad no podrá restringir el acceso del imputado a su abogado en los términos del artículo 94, letra f), ni al propio tribunal. Tampoco se podrá restringir su acceso a una apropiada atención médica. El tribunal deberá instruir a la autoridad encargada del recinto en que el imputado se encontrare acerca del modo de llevar a efecto la medida, el que en ningún caso podrá consistir en el encierro en celdas de castigo."}]}, {"id": "M-92f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "El tribunal puede restringir o prohibir las comunicaciones del detenido o preso, incluido su abogado, hasta por un máximo de diez días.", "f": "Art. 151 CPP. La restricción nunca alcanza al abogado, al propio tribunal ni a la atención médica.", "g": "N", "r": 0, "grp": "151|CPP", "x": [{"c": "Art. 151 CPP", "t": "Artículo 151.- Prohibición de comunicaciones. El tribunal podrá, a petición del fiscal, restringir o prohibir las comunicaciones del detenido o preso hasta por un máximo de diez días, cuando considerare que ello resulta necesario para el exitoso desarrollo de la investigación. En todo caso esta facultad no podrá restringir el acceso del imputado a su abogado en los términos del artículo 94, letra f), ni al propio tribunal. Tampoco se podrá restringir su acceso a una apropiada atención médica. El tribunal deberá instruir a la autoridad encargada del recinto en que el imputado se encontrare acerca del modo de llevar a efecto la medida, el que en ningún caso podrá consistir en el encierro en celdas de castigo."}]}, {"id": "M-93v", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Las medidas cautelares personales sólo se imponen cuando son absolutamente indispensables para asegurar la realización de los fines del procedimiento y sólo duran mientras subsista la necesidad de su aplicación.", "f": "Art. 122 CPP. Siempre se decretan por resolución judicial fundada.", "g": "N", "r": 1, "grp": "122|CPP", "x": [{"c": "Art. 122 CPP", "t": "Artículo 122.- Finalidad y alcance. Las medidas cautelares personales sólo serán impuestas cuando fueren absolutamente indispensables para asegurar la realización de los fines del procedimiento y sólo durarán mientras subsistiere la necesidad de su aplicación. Estas medidas serán siempre decretadas por medio de resolución judicial fundada. Párrafo 2º Citación"}]}, {"id": "M-93f", "o": "Preguntas nuevas", "t": "vf", "m": "PC", "e": "Las medidas cautelares personales se imponen por el solo hecho de la formalización y duran hasta la sentencia.", "f": "Art. 122 CPP. Siempre se decretan por resolución judicial fundada.", "g": "N", "r": 0, "grp": "122|CPP", "x": [{"c": "Art. 122 CPP", "t": "Artículo 122.- Finalidad y alcance. Las medidas cautelares personales sólo serán impuestas cuando fueren absolutamente indispensables para asegurar la realización de los fines del procedimiento y sólo durarán mientras subsistiere la necesidad de su aplicación. Estas medidas serán siempre decretadas por medio de resolución judicial fundada. Párrafo 2º Citación"}]}, {"id": "M-94", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Dentro de las veinticuatro horas siguientes a que toma conocimiento de un hecho que reviste caracteres de delito de acción penal pública, el fiscal debe:", "f": "Art. 180 CPP. Los fiscales dirigen la investigación y pueden realizar por sí mismos o encomendar a la policía todas las diligencias conducentes.", "g": "N", "i": [], "a": ["Proceder a la práctica de las diligencias pertinentes y útiles al esclarecimiento del hecho", "Solicitar al juez de garantía la autorización para investigar", "Comunicar el hecho al Fiscal Regional", "Formalizar la investigación"], "r": 0, "grp": "180|CPP", "x": [{"c": "Art. 180 CPP", "t": "Artículo 180.- Investigación de los fiscales. Los fiscales dirigirán la investigación y podrán realizar por sí mismos o encomendar a la policía todas las diligencias de investigación que consideraren conducentes al esclarecimiento de los hechos. Sin perjuicio de lo dispuesto en el Párrafo 1º de este Título, dentro de las veinticuatro horas siguientes a que tomare conocimiento de la existencia de un hecho que revistiere caracteres de delito de acción penal pública por alguno de los medios previstos en la ley, el fiscal deberá proceder a la práctica de todas aquellas diligencias pertinentes y útiles al esclarecimiento y averiguación del mismo, de las circunstancias relevantes para la aplicación de la ley penal, de los partícipes del hecho y de las circunstancias que sirvieren para verificar su responsabilidad. …"}]}, {"id": "M-95v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "Contra la sentencia definitiva del procedimiento simplificado sólo procede el recurso de nulidad.", "f": "Art. 399 CPP. La apelación es el recurso contra la sentencia del procedimiento abreviado (art. 414).", "g": "N", "r": 1, "grp": "399|CPP", "x": [{"c": "Art. 399 CPP", "t": "Artículo 399.- Recursos. Contra la sentencia definitiva sólo podrá interponerse el recurso de nulidad previsto en el Título IV del Libro Tercero. El fiscal requirente y el querellante, en su caso, sólo podrán recurrir si hubieren concurrido al juicio. Título II Procedimiento por delito de acción privada"}]}, {"id": "M-95f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "Contra la sentencia definitiva del procedimiento simplificado procede el recurso de apelación.", "f": "Art. 399 CPP. La apelación es el recurso contra la sentencia del procedimiento abreviado (art. 414).", "g": "N", "r": 0, "grp": "399|CPP", "x": [{"c": "Art. 399 CPP", "t": "Artículo 399.- Recursos. Contra la sentencia definitiva sólo podrá interponerse el recurso de nulidad previsto en el Título function score(qs, ans){
  var r = {vf:{b:0,m:0,o:0,n:0}, sm:{b:0,m:0,o:0,n:0}, mat:{}};
  qs.forEach(function(q){
    var g = r[q.t], a = ans[q.id]; g.n++;
    var mm = r.mat[q.m] || (r.mat[q.m] = {b:0,m:0,o:0,n:0}); mm.n++;
    if(a===undefined || a===null){ g.o++; mm.o++; }
    else if(a===q.r){ g.b++; mm.b++; }
    else { g.m++; mm.m++; }
  });
  r.netVF = r.vf.b - r.vf.m/2; r.netSM = r.sm.b - r.sm.m/4;
  r.net = Math.max(0, r.netVF + r.netSM); r.max = qs.length;
  r.nota = nota(r.net, r.max);

}
function nota(p, max){ // escala con 60% de exigencia para el 4,0
  var corte = 0.6*max, n = p < corte ? 1 + 3*p/corte : 4 + 3*(p-corte)/(max-corte);

}

function pick(pool, n){
  var by = {}; pool.forEach(function(q){ (by[q.m] = by[q.m] || []).push(q); });
  var keys = shuffle(Object.keys(by));
  function seenN(q){ var x = store.hist[q.id]; return x ? x.n : 0; }
  keys.forEach(function(k){ by[k] = shuffle(by[k]).sort(function(a,b){ return seenN(b) - seenN(a); }); });
  var out = [], i = 0, guard = 0;
  var used = {};
  while(out.length < n && guard < 20000){ var k = keys[i % keys.length]; if(by[k].length){ var c = by[k].pop(); if(!c.grp || !used[c.grp]){ if(c.grp) used[c.grp] = 1; out.push(c); } } i++; guard++; if(keys.every(function(x){return !by[x].length;})) break; }
  return shuffle(out);
}

function optsFor(q){ return q.t==="vf" ? [{v:1,k:"V",x:"Verdadero"},{v:0,k:"F",x:"Falso"}] : q.a.map(function(x,i){ return {v:i,k:"abcdef".charAt(i)+")",x:x}; }); }
function qCard(q, idx, total, chosen, reveal, onPick){
  var kids = [h("div",{class:"qnum",text:"Pregunta "+(idx+1)+" de "+total+" · "+(q.t==="vf"?"Verdadero o falso":"Selección múltiple")})];
  if(reveal) kids.push(tagsFor(q));
  kids.push(h("p",{class:"stem",text:q.e}));
  if(q.i && q.i.length) kids.push(h("ol",{class:"items"}, q.i.map(function(x){ return h("li",{text:x}); })));
  kids.push(h("div",{class:"opts"}, optsFor(q).map(function(o){
    var cls = "opt";
    if(reveal){ if(o.v===q.r) cls += " right"; else if(chosen===o.v) cls += " wrong"; }
    else if(chosen===o.v) cls += " sel";
    return h("button",{class:cls,type:"button",disabled: reveal ? "disabled" : null,"aria-pressed": chosen===o.v ? "true":"false",onclick:function(){ onPick(o.v); }},[h("span",{class:"k",text:o.k}), h("span",{text:o.x})]);
  })));
  if(reveal){
    var v = (chosen===undefined||chosen===null) ? ["om","Omitida"] : (chosen===q.r ? ["ok","Correcta"] : ["bad","Incorrecta"]);
    kids.push(h("p",{class:"verdict "+v[0],text:v[1]}));
    var fk = [h("p",null,[h("b",{text:"Fundamento. "}), q.f])];
    if(q.t==="sm" && chosen!==undefined && chosen!==null && chosen!==q.r) fk.push(h("p",{class:"small"},[h("b",{text:"Tu respuesta: "}), q.a[chosen]+". "  , h("b",{text:"Correcta: "}), q.a[q.r]+"."]));
    if(q.t==="vf") fk.push(h("p",{class:"small"},[h("b",{text:"La afirmación es "+(q.r===1?"verdadera":"falsa")+"."}), q.r===1 ? "" : " Compárala con el texto legal: el dato que cambia es el que hace falsa la afirmación."]));
    (q.x||[]).forEach(function(x){ fk.push(h("div",{class:"lex"},[h("div",{class:"lexc",text:"Texto legal · "+x.c}), h("p",{text:x.t})])); });
    kids.push(h("div",{class:"fund"},fk));
  }
  return h("div",{class:"card"},kids);
}
function record(q, a){ if(a===undefined||a===null) return; var x = store.hist[q.id] || {n:0,ok:0}; x.n++; if(a===q.r) x.ok++; x.last = a===q.r ? 1 : 0; store.hist[q.id] = x; }

/* ---------- Estudio */
function startStudy(qs){ stopTimer(); S = {mode:"study", qs:qs, i:0, ans:{}, ok:0, done:0}; renderStudy(); }
function renderStudy(){
  var q = S.qs[S.i], a = S.ans[q.id], rev = a!==undefined;
  app.innerHTML = "";
  app.appendChild(h("p",{class:"small muted",text:"Estudio · "+S.ok+" correctas de "+S.done+" respondidas"}));
  app.appendChild(qCard(q, S.i, S.qs.length, a, rev, function(v){ S.ans[q.id] = v; S.done++; if(v===q.r) S.ok++; record(q,v); save(); renderStudy(); }));
  app.appendChild(h("div",{class:"foot"},[
    h("button",{type:"button",disabled:S.i===0?"disabled":null,onclick:function(){ S.i--; renderStudy(); }},["Anterior"]),
    S.i < S.qs.length-1 ? h("button",{class:"primary",type:"button",onclick:function(){ S.i++; renderStudy(); }},[rev?"Siguiente":"Saltar"]) : h("button",{class:"primary",type:"button",onclick:home},["Terminar"])
  ]));
  window.scrollTo(0,0);
}

/* ---------- Simulacro */
function startExam(nvf, nsm, mins){
  var vf = pick(BANK.filter(function(q){return q.t==="vf";}), nvf), sm = pick(BANK.filter(function(q){return q.t==="sm";}), nsm);
  S = {mode:"exam", qs: vf.concat(sm), i:0, ans:{}, end: Date.now()+mins*60000, mins:mins, fin:false, ask:false};
  timerEl.hidden = false; tick = setInterval(drawTimer, 1000); drawTimer(); renderExam();
}
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } timerEl.hidden = true; timerEl.className = "timer"; }
function drawTimer(){
  if(!S || S.mode!=="exam" || S.fin) return;
  var left = Math.max(0, Math.round((S.end-Date.now())/1000)), m = Math.floor(left/60), s = left%60;
  timerEl.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s; timerEl.className = "timer"+(left<300?" low":"");
  if(left<=0) finishExam();
}
function navGrid(){
  return h("div",{class:"nav"}, S.qs.map(function(q,i){
    var a = S.ans[q.id], cls = "";
    if(S.fin){ cls = (a===undefined||a===null) ? "o" : (a===q.r ? "r":"w"); } else if(a!==undefined && a!==null) cls = "done";
    if(i===S.i) cls += " cur";
    return h("button",{class:cls,type:"button","aria-label":"Ir a la pregunta "+(i+1),onclick:function(){ S.i=i; renderExam(); }},[String(i+1)]);
  }));
}
function renderExam(){
  var q = S.qs[S.i], a = S.ans[q.id];
  app.innerHTML = "";
  if(S.fin) app.appendChild(resultCard());
  var answered = S.qs.filter(function(x){ var v=S.ans[x.id]; return v!==undefined && v!==null; }).length;
  if(!S.fin) app.appendChild(h("p",{class:"small muted",text:"Simulacro · "+answered+" respondidas de "+S.qs.length+" · las preguntas 1 a "+S.qs.filter(function(x){return x.t==="vf";}).length+" son de verdadero o falso"}));
  app.appendChild(qCard(q, S.i, S.qs.length, a, S.fin, function(v){ S.ans[q.id] = (S.ans[q.id]===v ? null : v); renderExam(); }));
  var foot = [h("button",{type:"button",disabled:S.i===0?"disabled":null,onclick:function(){ S.i--; renderExam(); }},["Anterior"])];
  if(S.i < S.qs.length-1) foot.push(h("button",{class:"primary",type:"button",onclick:function(){ S.i++; renderExam(); }},["Siguiente"]));
  app.appendChild(h("div",{class:"foot"},foot));
  if(!S.fin && !a && a!==0) app.appendChild(h("p",{class:"small muted",text:"Puedes dejarla en blanco: las omitidas no descuentan. Para desmarcar, pulsa de nuevo la alternativa elegida."}));
  app.appendChild(h("div",{class:"card"},[h("h2",{text: S.fin ? "Revisión pregunta por pregunta" : "Hoja de respuestas"}), navGrid(),
    S.fin ? h("button",{type:"button",onclick:home},["Volver al inicio"]) :
    (S.ask ? h("div",{class:"confirm"},[h("span",{text:"Quedan "+(S.qs.length-answered)+" preguntas sin responder. ¿Entregar de todos modos?"}), h("button",{class:"primary",type:"button",onclick:finishExam},["Entregar"]), h("button",{class:"ghost",type:"button",onclick:function(){ S.ask=false; renderExam(); }},["Seguir respondiendo"])])
           : h("button",{class:"primary",type:"button",onclick:function(){ if(answered<S.qs.length){ S.ask=true; renderExam(); } else finishExam(); }},["Entregar simulacro"]))
  ]));
}
function finishExam(){
  if(!S || S.fin) return;
  S.fin = true; S.ask = false; stopTimer();
  S.qs.forEach(function(q){ record(q, S.ans[q.id]); });
  S.res = score(S.qs, S.ans);
  store.runs.push({d: Date.now(), n: S.qs.length, net: S.res.net, nota: S.res.nota}); if(store.runs.length>40) store.runs.shift();
  save(); S.i = 0; renderExam(); window.scrollTo(0,0);
}
function resultCard(){
  var r = S.res, pass = r.nota>=5;
  var rows = Object.keys(r.mat).sort().map(function(k){ var m = r.mat[k]; return h("tr",null,[h("td",{text:MAT[k]}),h("td",{class:"n",text:String(m.b)}),h("td",{class:"n",text:String(m.m)}),h("td",{class:"n",text:String(m.o)}),h("td",{class:"n",text:Math.round(100*m.b/m.n)+"%"})]); });
  return h("div",{class:"card"},[
    h("h1",{class: pass?"pass":"fail", text:"Nota "+r.nota.toFixed(1).replace(".",",")+(pass?" · pasarías al examen oral":" · bajo el 5,0 exigido")}),
    h("div",{class:"score"},[
      h("div",null,[h("b",{text:fmt(r.net)+" / "+r.max}), h("span",{class:"small muted",text:"puntaje neto"})]),
      h("div",null,[h("b",{text:fmt(r.netVF)}), h("span",{class:"small muted",text:"V/F: "+r.vf.b+" buenas, "+r.vf.m+" malas, "+r.vf.o+" omitidas"})]),
      h("div",null,[h("b",{text:fmt(r.netSM)}), h("span",{class:"small muted",text:"Selección: "+r.sm.b+" buenas, "+r.sm.m+" malas, "+r.sm.o+" omitidas"})])
    ]),
    h("p",{class:"small muted",text:"Descuento: una buena cada dos malas en verdadero o falso y una cada cuatro en selección múltiple. Escala con 60% de exigencia: "+fmt(0.6*r.max)+" puntos netos equivalen a un 4,0 y "+fmt(0.6*r.max+ (r.max-0.6*r.max)/3)+" a un 5,0."}),
    h("div",{class:"tw"},[h("table",null,[h("thead",null,[h("tr",null,[h("th",{text:"Materia"}),h("th",{class:"n",text:"Buenas"}),h("th",{class:"n",text:"Malas"}),h("th",{class:"n",text:"Omitidas"}),h("th",{class:"n",text:"Acierto"})])]), h("tbody",null,rows)])])
  ]);
}
document.getElementById("homeBtn").addEventListener("click", function(){
  if(S && S.mode==="exam" && !S.fin){ S.ask = true; renderExam(); return; }
  home();
});
home();
</script>
