eso público abiertos de noche o casos urgentes.", "g": "N", "i": [], "a": ["Las seis y las veinticuatro horas", "Las ocho y las veinte horas", "Las siete y las veintiuna horas", "Las seis y las veintidós horas"], "r": 3, "grp": "207|CPP", "x": [{"c": "Art. 207 CPP", "t": "Artículo 207.- Horario para el registro. El registro deberá hacerse en el tiempo que media entre las seis y las veintidós horas; pero podrá verificarse fuera de estas horas en lugares de libre acceso público y que se encontraren abiertos durante la noche. Asimismo, procederá en casos urgentes, cuando su ejecución no admitiere demora. En este último evento, la resolución que autorizare la entrada y el registro deberá señalar expresamente el motivo de la urgencia."}]}, {"id": "N-46v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La orden de entrada y registro tiene una vigencia máxima de diez días.", "f": "Art. 208 CPP. Vigencia máxima de diez días.", "g": "N", "r": 1, "grp": "208|CPP", "x": [{"c": "Art. 208 CPP", "t": "Artículo 208.- Contenido de la orden de registro. La orden que autorizare la entrada y registro deberá señalar: a) El o los edificios o lugares que hubieren de ser registrados; b) El fiscal que lo hubiere solicitado; c) La autoridad encargada de practicar el registro, y d) El motivo del registro y, en su caso, del ingreso nocturno. La orden tendrá una vigencia máxima de diez días, después de los cuales caducará la autorización. Con todo, el juez que emitiere la orden podrá establecer un plazo de vigencia inferior."}]}, {"id": "N-46f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La orden de entrada y registro tiene una vigencia máxima de treinta días.", "f": "Art. 208 CPP. Vigencia máxima de diez días.", "g": "N", "r": 0, "grp": "208|CPP", "x": [{"c": "Art. 208 CPP", "t": "Artículo 208.- Contenido de la orden de registro. La orden que autorizare la entrada y registro deberá señalar: a) El o los edificios o lugares que hubieren de ser registrados; b) El fiscal que lo hubiere solicitado; c) La autoridad encargada de practicar el registro, y d) El motivo del registro y, en su caso, del ingreso nocturno. La orden tendrá una vigencia máxima de diez días, después de los cuales caducará la autorización. Con todo, el juez que emitiere la orden podrá establecer un plazo de vigencia inferior."}]}, {"id": "N-47", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La interceptación de comunicaciones telefónicas del artículo 222 no puede exceder de un plazo de:", "f": "Art. 222 CPP. Sesenta días, prorrogable.", "g": "N", "i": [], "a": ["Quince días, prorrogable por períodos de hasta igual duración", "Noventa días, improrrogable", "Treinta días, prorrogable por una sola vez", "Sesenta días, prorrogable por períodos de hasta igual duración"], "r": 3, "grp": "222|CPP", "x": [{"c": "Art. 222 CPP", "t": "… singularizar los medios de comunicación o telecomunicación a intervenir y grabar, tales como números de líneas telefónicas, direcciones IP, casillas de correos, entre otros. También señalará la autoridad o funcionario policial que se encargará de la diligencia de interceptación y grabación, la forma de la interceptación, su alcance y su duración. La interceptación no podrá exceder de sesenta días. El juez podrá prorrogar este plazo por períodos de hasta igual duración, para lo cual deberá examinar cada vez la concurrencia de los requisitos previstos en los incisos precedentes. Las empresas concesionarias de servicios públicos de telecomunicaciones y prestadores de servicios de internet deberán dar cumplimiento a esta medida, proporcionando a los funcionarios encargados de la diligencia las facilidades necesarias para que se lleve a cabo con la oportunidad con que se requiera. …"}]}, {"id": "N-48v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Cualquier persona que se considere afectada por una investigación no formalizada puede pedir al juez de garantía que ordene al fiscal informar sobre los hechos objeto de ella.", "f": "Art. 186 CPP. Control judicial anterior a la formalización.", "g": "N", "r": 1, "grp": "186|CPP", "x": [{"c": "Art. 186 CPP", "t": "Artículo 186.- Control judicial anterior a la formalización de la investigación. Cualquier persona que se considerare afectada por una investigación que no se hubiere formalizado judicialmente, podrá pedir al juez de garantía que le ordene al fiscal informar acerca de los hechos que fueren objeto de ella. También podrá el juez fijarle un plazo para que formalice la investigación."}]}, {"id": "N-48f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Sólo el imputado privado de libertad puede pedir al juez de garantía que ordene al fiscal informar sobre una investigación no formalizada.", "f": "Art. 186 CPP. Control judicial anterior a la formalización.", "g": "N", "r": 0, "grp": "186|CPP", "x": [{"c": "Art. 186 CPP", "t": "Artículo 186.- Control judicial anterior a la formalización de la investigación. Cualquier persona que se considerare afectada por una investigación que no se hubiere formalizado judicialmente, podrá pedir al juez de garantía que le ordene al fiscal informar acerca de los hechos que fueren objeto de ella. También podrá el juez fijarle un plazo para que formalice la investigación."}]}, {"id": "N-49v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Si el testigo citado por el fiscal no comparece sin justa causa, el fiscal debe ocurrir ante el juez de garantía para que autorice conducirlo compulsivamente.", "f": "Art. 23 CPP. El fiscal ocurre ante el juez de garantía para que lo autorice a conducirla compulsivamente.", "g": "N", "r": 1, "grp": "23|CPP", "x": [{"c": "Art. 23 CPP", "t": "Artículo 23.- Citación del ministerio público. Cuando en el desarrollo de su actividad de investigación el fiscal requiriere la comparecencia de una persona, podrá citarla por cualquier medio idóneo. Si la persona citada no compareciere, el fiscal podrá ocurrir ante el juez de garantía para que lo autorice a conducirla compulsivamente a su presencia. Con todo, el fiscal no podrá recabar directamente la comparecencia personal de las personas o autoridades a que se refiere el artículo 300. Si la declaración de dichas personas o autoridades fuere necesaria, procederá siempre previa autorización del juez de garantía y conforme lo establece el artículo 301. Párrafo 4º Notificaciones y citaciones judiciales"}]}, {"id": "N-49f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "Si el testigo citado por el fiscal no comparece sin justa causa, el fiscal puede ordenar directamente a la policía su conducción.", "f": "Art. 23 CPP. El fiscal ocurre ante el juez de garantía para que lo autorice a conducirla compulsivamente.", "g": "N", "r": 0, "grp": "23|CPP", "x": [{"c": "Art. 23 CPP", "t": "Artículo 23.- Citación del ministerio público. Cuando en el desarrollo de su actividad de investigación el fiscal requiriere la comparecencia de una persona, podrá citarla por cualquier medio idóneo. Si la persona citada no compareciere, el fiscal podrá ocurrir ante el juez de garantía para que lo autorice a conducirla compulsivamente a su presencia. Con todo, el fiscal no podrá recabar directamente la comparecencia personal de las personas o autoridades a que se refiere el artículo 300. Si la declaración de dichas personas o autoridades fuere necesaria, procederá siempre previa autorización del juez de garantía y conforme lo establece el artículo 301. Párrafo 4º Notificaciones y citaciones judiciales"}]}, {"id": "N-50", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "Presentada la acusación, el juez de garantía cita a la audiencia de preparación del juicio oral, la que debe tener lugar en un plazo:", "f": "Art. 260 CPP", "g": "N", "i": [], "a": ["No inferior a veinticinco ni superior a treinta y cinco días", "No inferior a quince ni superior a sesenta días", "No inferior a treinta ni superior a cuarenta y cinco días", "No inferior a diez ni superior a veinte días"], "r": 0, "grp": "260|CPP", "x": [{"c": "Art. 260 CPP", "t": "Artículo 260.- Citación a la audiencia. Presentada la acusación, el juez de garantía ordenará su notificación a todos los intervinientes y citará, dentro de las veinticuatro horas siguientes, a la audiencia de preparación del juicio oral, la que deberá tener lugar en un plazo no inferior a veinticinco ni superior a treinta y cinco días. Al acusado se le entregará la copia de la acusación, en la que se dejará constancia, además, del hecho de encontrarse a su disposición, en el tribunal, los antecedentes acumulados durante la investigación."}]}, {"id": "N-51", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El querellante puede adherir a la acusación o acusar particularmente:", "f": "Art. 261 CPP. Quince días antes, por escrito.", "g": "N", "i": [], "a": ["Hasta la víspera de la audiencia de preparación del juicio oral", "Hasta cinco días antes de la audiencia de preparación del juicio oral", "Dentro de los diez días siguientes al cierre de la investigación", "Hasta quince días antes de la fecha fijada para la audiencia de preparación del juicio oral"], "r": 3, "grp": "261|CPP", "x": [{"c": "Art. 261 CPP", "t": "Artículo 261.- Actuación del querellante. Hasta quince días antes de la fecha fijada para la realización de la audiencia de preparación del juicio oral, el querellante, por escrito, podrá: a) Adherir a la acusación del ministerio público o acusar particularmente. En este segundo caso, podrá plantear una distinta calificación de los hechos, otras formas de participación del acusado, solicitar otra pena o ampliar la acusación del fiscal, extendiéndola a hechos o a imputados distintos, siempre que hubieren sido objeto de la formalización de la investigación; b) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; c) Ofrecer la prueba que estimare necesaria para sustentar su acusación, lo que deberá hacerse en los mismos términos previstos en el artículo 259, y d) Deducir demanda civil, cuando procediere."}]}, {"id": "N-52v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El acusado puede ejercer por escrito las facultades del artículo 263 hasta la víspera del inicio de la audiencia de preparación del juicio oral, o verbalmente al inicio de ella.", "f": "Art. 263 CPP. Hasta la víspera por escrito, o verbalmente al inicio de la audiencia.", "g": "N", "r": 1, "grp": "263|CPP", "x": [{"c": "Art. 263 CPP", "t": "Artículo 263.- Facultades del acusado. Hasta la víspera del inicio de la audiencia de preparación del juicio oral, por escrito, o al inicio de dicha audiencia, en forma verbal, el acusado podrá: a) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; b) Deducir excepciones de previo y especial pronunciamiento, y c) Exponer los argumentos de defensa que considere necesarios y señalar los medios de prueba cuyo examen en el juicio oral solicitare, en los mismos términos previstos en el artículo 259."}]}, {"id": "N-52f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "El acusado sólo puede ejercer las facultades del artículo 263 hasta quince días antes de la audiencia de preparación del juicio oral.", "f": "Art. 263 CPP. Hasta la víspera por escrito, o verbalmente al inicio de la audiencia.", "g": "N", "r": 0, "grp": "263|CPP", "x": [{"c": "Art. 263 CPP", "t": "Artículo 263.- Facultades del acusado. Hasta la víspera del inicio de la audiencia de preparación del juicio oral, por escrito, o al inicio de dicha audiencia, en forma verbal, el acusado podrá: a) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; b) Deducir excepciones de previo y especial pronunciamiento, y c) Exponer los argumentos de defensa que considere necesarios y señalar los medios de prueba cuyo examen en el juicio oral solicitare, en los mismos términos previstos en el artículo 259."}]}, {"id": "N-53", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "Si la acusación adolece de vicios formales, el juez puede suspender la audiencia de preparación para su corrección por un período que no exceda de:", "f": "Art. 270 CPP. Cinco días.", "g": "N", "i": [], "a": ["Cinco días", "Quince días", "Tres días", "Diez días"], "r": 0, "grp": "270|CPP", "x": [{"c": "Art. 270 CPP", "t": "… Cuando el juez considerare que la acusación del fiscal, la del querellante o la demanda civil adolecen de vicios formales, ordenará que los mismos sean subsanados, sin suspender la audiencia, si ello fuere posible. En caso contrario, ordenará la suspensión de la misma por el período necesario para la corrección del procedimiento, el que en ningún caso podrá exceder de cinco días. Transcurrido este plazo, si la acusación del querellante o la demanda civil no hubieren sido rectificadas, se tendrán por no presentadas. Si no lo hubiere sido la acusación del fiscal, a petición de éste, el juez podrá conceder una prórroga hasta por otros cinco días, sin perjuicio de lo cual informará al fiscal regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. …"}]}, {"id": "N-54", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El tribunal de juicio oral debe fijar la audiencia de juicio para una fecha:", "f": "Art. 281 CPP. Inc. 3°.", "g": "N", "i": [], "a": ["No antes de diez ni después de treinta días desde la notificación del auto de apertura", "Dentro de los noventa días siguientes a la recepción del auto de apertura", "No antes de veinticinco ni después de treinta y cinco días desde la notificación del auto de apertura", "No antes de quince ni después de sesenta días desde la notificación del auto de apertura"], "r": 3, "grp": "281|CPP", "x": [{"c": "Art. 281 CPP", "t": "… oral en lo penal las personas sometidas a prisión preventiva o a otras medidas cautelares personales. Una vez distribuida la causa, cuando procediere, el Art. juez presidente de la sala respectiva procederá de inmediato a decretar la fecha para la celebración de la audiencia del mismo, la que deberá tener lugar no antes de quince ni después de sesenta días desde la notificación del auto de apertura del juicio oral. Señalará, asimismo, la localidad en la cual se constituirá y funcionará el tribunal de juicio oral en lo penal, si se tratare de alguno de los casos previstos en el artículo 21 A del Código Orgánico de Tribunales. En su resolución, el juez presidente indicará también el nombre de los jueces que integrarán la sala. …"}]}, {"id": "N-55", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La suspensión de la audiencia o la interrupción del juicio oral impide su continuación y obliga a anular lo obrado cuando excede de:", "f": "Art. 283 CPP. Más de diez días: nulidad de lo obrado y reinicio.", "g": "N", "i": [], "a": ["Quince días", "Cinco días", "Treinta días", "Diez días"], "r": 3, "grp": "283|CPP", "x": [{"c": "Art. 283 CPP", "t": "… Con todo, el juicio seguirá adelante cuando la declaración de rebeldía se produjere respecto del imputado a quien se le hubiere otorgado la posibilidad de prestar declaración en el juicio oral, siempre que el tribunal estimare que su ulterior presencia no resulta indispensable para la prosecución del juicio o cuando sólo faltare la dictación de la sentencia. La suspensión de la audiencia o la interrupción del juicio oral por un período que excediere de diez días impedirá su continuación. En tal caso, el tribunal deberá decretar la nulidad de lo obrado en él y ordenar su reinicio. En aquellos casos en que, debido al número de imputados, o de querellantes, o de la prueba ofrecida, el juicio oral se extendiera por más de seis meses, el tribunal podrá suspender la audiencia hasta por tres veces adicionales a las dos señaladas en el inciso primero; …"}]}, {"id": "N-56v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "En el procedimiento penal no existen testigos inhábiles.", "f": "Art. 309 CPP. No hay inhabilidades; la credibilidad se discute en el contrainterrogatorio.", "g": "N", "r": 1, "grp": "309|CPP", "x": [{"c": "Art. 309 CPP", "t": "Artículo 309.- Declaración de testigos. En el procedimiento penal no existirán testigos inhábiles. Sin perjuicio de ello, los intervinientes podrán dirigir al testigo, preguntas tendientes a demostrar su credibilidad o falta de ella, la existencia de vínculos con alguno de los intervinientes que afectaren o pudieren afectar su imparcialidad, o algún otro defecto de idoneidad. Todo testigo dará razón circunstanciada de los hechos sobre los cuales declarare, expresando si los hubiere presenciado, si los dedujere de antecedentes que le fueren conocidos o si los hubiere oído referir a otras personas."}]}, {"id": "N-56f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "En el procedimiento penal son inhábiles para declarar los parientes del imputado hasta el segundo grado.", "f": "Art. 309 CPP. No hay inhabilidades; la credibilidad se discute en el contrainterrogatorio.", "g": "N", "r": 0, "grp": "309|CPP", "x": [{"c": "Art. 309 CPP", "t": "Artículo 309.- Declaración de testigos. En el procedimiento penal no existirán testigos inhábiles. Sin perjuicio de ello, los intervinientes podrán dirigir al testigo, preguntas tendientes a demostrar su credibilidad o falta de ella, la existencia de vínculos con alguno de los intervinientes que afectaren o pudieren afectar su imparcialidad, o algún otro defecto de idoneidad. Todo testigo dará razón circunstanciada de los hechos sobre los cuales declarare, expresando si los hubiere presenciado, si los dedujere de antecedentes que le fueren conocidos o si los hubiere oído referir a otras personas."}]}, {"id": "N-57", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El estándar de convicción para condenar es:", "f": "Art. 340 CPP. Inc. 1°.", "g": "N", "i": [], "a": ["Más allá de toda duda razonable", "Preponderancia de la evidencia", "Plena prueba legal", "Prueba clara y convincente"], "r": 0, "grp": "340|CPP", "x": [{"c": "Art. 340 CPP", "t": "Artículo 340.- Convicción del tribunal. Nadie podrá ser condenado por delito sino cuando el tribunal que lo juzgare adquiriere, más allá de toda duda razonable, la convicción de que realmente se hubiere cometido el hecho punible objeto de la acusación y que en él hubiere correspondido al acusado una participación culpable y penada por la ley. El tribunal formará su convicción sobre la base de la prueba producida durante el juicio oral. No se podrá condenar a una persona con el solo mérito de su propia declaración."}]}, {"id": "N-58v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "No se puede condenar a una persona con el solo mérito de su propia declaración.", "f": "Art. 340 CPP. Inciso final del art. 340.", "g": "N", "r": 1, "grp": "340|CPP", "x": [{"c": "Art. 340 CPP", "t": "Artículo 340.- Convicción del tribunal. Nadie podrá ser condenado por delito sino cuando el tribunal que lo juzgare adquiriere, más allá de toda duda razonable, la convicción de que realmente se hubiere cometido el hecho punible objeto de la acusación y que en él hubiere correspondido al acusado una participación culpable y penada por la ley. El tribunal formará su convicción sobre la base de la prueba producida durante el juicio oral. No se podrá condenar a una persona con el solo mérito de su propia declaración."}]}, {"id": "N-58f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "Se puede condenar a una persona con el solo mérito de su propia declaración si fue prestada ante el tribunal de juicio oral.", "f": "Art. 340 CPP. Inciso final del art. 340.", "g": "N", "r": 0, "grp": "340|CPP", "x": [{"c": "Art. 340 CPP", "t": "Artículo 340.- Convicción del tribunal. Nadie podrá ser condenado por delito sino cuando el tribunal que lo juzgare adquiriere, más allá de toda duda razonable, la convicción de que realmente se hubiere cometido el hecho punible objeto de la acusación y que en él hubiere correspondido al acusado una participación culpable y penada por la ley. El tribunal formará su convicción sobre la base de la prueba producida durante el juicio oral. No se podrá condenar a una persona con el solo mérito de su propia declaración."}]}, {"id": "N-59", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "Al pronunciarse sobre la absolución o condena, el tribunal puede diferir la redacción del fallo hasta por un plazo de:", "f": "Art. 344 CPP. Plazo vigente de diez días (antes cinco); si el juicio duró más de cinco días, un día adicional por cada dos de exceso.", "g": "N", "i": [], "a": ["Cinco días", "Tres días", "Quince días", "Diez días"], "r": 3, "grp": "344|CPP", "x": [{"c": "Art. 344 CPP", "t": "Artículo 344. Plazo para redacción de la sentencia. Al pronunciarse sobre la absolución o condena, el tribunal podrá diferir la redacción del fallo y, en su caso, la determinación de la pena hasta por un plazo de diez días, fijando la fecha de la audiencia en que tendrá lugar su lectura. No obstante, si el juicio hubiere durado más de cinco días, el tribunal dispondrá, para la fijación de la fecha de la audiencia para su comunicación, de un día adicional por cada dos de exceso de duración del juicio. En ambos casos, si el vencimiento del plazo para la redacción del fallo coincidiere con un día domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o festivo. …"}]}, {"id": "N-60v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La decisión de absolución o condena debe pronunciarse en la misma audiencia, una vez concluida la deliberación.", "f": "Art. 343 CPP", "g": "N", "r": 1, "grp": "343|CPP", "x": [{"c": "Art. 343 CPP", "t": "Artículo 343.- Decisión sobre absolución o condena. Una vez concluida la deliberación privada de los jueces, de conformidad a lo previsto en el artículo 339, la sentencia definitiva que recayere en el juicio oral deberá ser pronunciada en la audiencia respectiva, comunicándose la decisión relativa a la absolución o condena del acusado por cada uno de los delitos que se le imputaren, indicando respecto de cada uno de ellos los fundamentos principales tomados en consideración para llegar a dichas conclusiones. Excepcionalmente, cuando la audiencia del juicio se hubiere prolongado por más de dos días y la complejidad del caso no permitiere pronunciar la decisión inmediatamente, el tribunal podrá prolongar su deliberación hasta por veinticuatro horas, hecho que será dado a conocer a los intervinientes en la misma audiencia, fijándose de inmediato la oportunidad en que la decisión les será comunicada. …"}]}, {"id": "N-60f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La decisión de absolución o condena debe comunicarse por escrito dentro de quinto día de cerrado el debate.", "f": "Art. 343 CPP", "g": "N", "r": 0, "grp": "343|CPP", "x": [{"c": "Art. 343 CPP", "t": "Artículo 343.- Decisión sobre absolución o condena. Una vez concluida la deliberación privada de los jueces, de conformidad a lo previsto en el artículo 339, la sentencia definitiva que recayere en el juicio oral deberá ser pronunciada en la audiencia respectiva, comunicándose la decisión relativa a la absolución o condena del acusado por cada uno de los delitos que se le imputaren, indicando respecto de cada uno de ellos los fundamentos principales tomados en consideración para llegar a dichas conclusiones. Excepcionalmente, cuando la audiencia del juicio se hubiere prolongado por más de dos días y la complejidad del caso no permitiere pronunciar la decisión inmediatamente, el tribunal podrá prolongar su deliberación hasta por veinticuatro horas, hecho que será dado a conocer a los intervinientes en la misma audiencia, fijándose de inmediato la oportunidad en que la decisión les será comunicada. …"}]}, {"id": "N-61v", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La apelación del Ministerio Público contra el auto de apertura por exclusión de prueba se concede en ambos efectos.", "f": "Art. 277 CPP. Ambos efectos.", "g": "N", "r": 1, "grp": "277|CPP", "x": [{"c": "Art. 277 CPP", "t": "… pagarse anticipadamente sus gastos de traslado y habitación y los montos respectivos. El auto de apertura del juicio oral sólo será susceptible del recurso de apelación, cuando lo interpusiere el ministerio público por la exclusión de pruebas decretada por el juez de garantía de acuerdo a lo previsto en el inciso tercero del artículo precedente. Este recurso será concedido en ambos efectos. Lo dispuesto en este inciso se entenderá sin perjuicio de la procedencia, en su caso, del recurso de nulidad en contra de la sentencia definitiva que se dictare en el juicio oral, conforme a las reglas generales. Si se excluyeren, por resolución firme, pruebas de cargo que el Ministerio Público considere esenciales para sustentar su acusación en el juicio oral respectivo, el fiscal podrá solicitar el sobreseimiento definitivo de la causa ante el juez competente, el que la decretará en audiencia convocada al …"}]}, {"id": "N-61f", "o": "Preguntas nuevas", "t": "vf", "m": "PJ", "e": "La apelación del Ministerio Público contra el auto de apertura por exclusión de prueba se concede en el solo efecto devolutivo.", "f": "Art. 277 CPP. Ambos efectos.", "g": "N", "r": 0, "grp": "277|CPP", "x": [{"c": "Art. 277 CPP", "t": "… pagarse anticipadamente sus gastos de traslado y habitación y los montos respectivos. El auto de apertura del juicio oral sólo será susceptible del recurso de apelación, cuando lo interpusiere el ministerio público por la exclusión de pruebas decretada por el juez de garantía de acuerdo a lo previsto en el inciso tercero del artículo precedente. Este recurso será concedido en ambos efectos. Lo dispuesto en este inciso se entenderá sin perjuicio de la procedencia, en su caso, del recurso de nulidad en contra de la sentencia definitiva que se dictare en el juicio oral, conforme a las reglas generales. Si se excluyeren, por resolución firme, pruebas de cargo que el Ministerio Público considere esenciales para sustentar su acusación en el juicio oral respectivo, el fiscal podrá solicitar el sobreseimiento definitivo de la causa ante el juez competente, el que la decretará en audiencia convocada al …"}]}, {"id": "N-62", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El recurso de apelación debe entablarse dentro de:", "f": "Art. 366 CPP. Cinco días.", "g": "N", "i": [], "a": ["Los diez días siguientes a la notificación de la resolución impugnada", "Los tres días siguientes a la notificación de la resolución impugnada", "Los quince días siguientes a la notificación de la resolución impugnada", "Los cinco días siguientes a la notificación de la resolución impugnada"], "r": 3, "grp": "366|CPP", "x": [{"c": "Art. 366 CPP", "t": "Artículo 366.- Plazo para interponer el recurso de apelación. El recurso de apelación deberá entablarse dentro de los cinco días siguientes a la notificación de la resolución impugnada."}]}, {"id": "N-63", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El recurso de nulidad debe interponerse por escrito dentro de:", "f": "Art. 372 CPP. Plazo vigente de quince días (antes diez), ante el tribunal que conoció del juicio oral.", "g": "N", "i": [], "a": ["Los quince días siguientes a la notificación de la sentencia definitiva, ante la Corte de Apelaciones respectiva", "Los cinco días siguientes a la notificación de la sentencia definitiva, ante la Corte Suprema", "Los quince días siguientes a la notificación de la sentencia definitiva, ante el tribunal que conoció del juicio oral", "Los diez días siguientes a la notificación de la sentencia definitiva, ante el tribunal que conoció del juicio oral"], "r": 2, "grp": "372|CPP", "x": [{"c": "Art. 372 CPP", "t": "Artículo 372.- Del recurso de nulidad. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda, por las causales expresamente señaladas en la ley. Deberá interponerse, por escrito, dentro de los quince Art. días siguientes a la notificación de la sentencia definitiva, ante el tribunal que hubiere conocido del juicio oral. No obstante, si el juicio hubiere durado más de cinco días, el recurrente dispondrá para la interposición del recurso de un día adicional por cada dos de exceso de duración del juicio. En ningún caso este plazo podrá ser superior a treinta días. Si el vencimiento del plazo para la interposición del recurso coincide con un domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o …"}]}, {"id": "N-64", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "La reposición de las resoluciones dictadas fuera de audiencia debe pedirse:", "f": "Art. 362 CPP. Tercero día y fundada.", "g": "N", "i": [], "a": ["Por escrito y dentro de veinticuatro horas", "Por escrito y dentro de tercero día", "Verbalmente en la audiencia siguiente", "Por escrito y dentro de quinto día"], "r": 1, "grp": "362|CPP", "x": [{"c": "Art. 362 CPP", "t": "Artículo 362.- Reposición de las resoluciones dictadas fuera de audiencias. De las sentencias interlocutorias, de los autos y de los decretos dictados fuera de audiencias, podrá pedirse reposición al tribunal que los hubiere pronunciado. El recurso deberá interponerse dentro de tercero día y deberá ser fundado. El tribunal se pronunciará de plano, pero podrá oír a los demás intervinientes si se hubiere deducido en un asunto cuya complejidad así lo aconsejare. Cuando la reposición se interpusiere respecto de una resolución que también fuere susceptible de apelación y no se dedujere a la vez este recurso para el caso de que la reposición fuere denegada, se entenderá que la parte renuncia a la apelación. La reposición no tendrá efecto suspensivo, salvo cuando contra la misma resolución procediere también la apelación en este efecto."}]}, {"id": "N-65", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El recurso de nulidad fundado en la causal de la letra a) del artículo 373 es conocido por:", "f": "Art. 376 CPP. Inc. 1°.", "g": "N", "i": [], "a": ["Un tribunal de juicio oral no inhabilitado", "El pleno de la Corte de Apelaciones respectiva", "La Corte de Apelaciones respectiva", "La Corte Suprema"], "r": 3, "grp": "376|CPP", "x": [{"c": "Art. 376 CPP", "t": "Artículo 376.- Tribunal competente para conocer del recurso. El conocimiento del recurso que se fundare en la causal prevista en el artículo 373, letra a), corresponderá a la Corte Suprema. La respectiva Corte de Apelaciones conocerá de los recursos que se fundaren en las causales señaladas en el artículo 373, letra b), y en el artículo 374. No obstante lo dispuesto en el inciso precedente, cuando el recurso se fundare en la causal prevista en el artículo 373, letra b), y respecto de la materia de derecho objeto del mismo existieren distintas interpretaciones sostenidas en diversos fallos emanados de los tribunales superiores, corresponderá pronunciarse a la Corte Suprema. Del mismo modo, si un recurso se fundare en distintas causales y por aplicación de las reglas contempladas en los incisos precedentes correspondiere el conocimiento de al menos una de ellas a la Corte Suprema, ésta se …"}]}, {"id": "N-66", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "La Corte debe fallar el recurso de nulidad dentro de:", "f": "Art. 384 CPP. Veinte días.", "g": "N", "i": [], "a": ["Los veinte días siguientes a la fecha en que hubiere terminado de conocer de él", "Los diez días siguientes a la fecha en que hubiere terminado de conocer de él", "Los cinco días siguientes a la vista de la causa", "Los treinta días siguientes a su ingreso"], "r": 0, "grp": "384|CPP", "x": [{"c": "Art. 384 CPP", "t": "Artículo 384.- Fallo del recurso. La Corte deberá fallar el recurso dentro de los veinte días siguientes a la fecha en que hubiere terminado de conocer de él. En la sentencia, el tribunal deberá exponer los fundamentos que sirvieren de base a su decisión; pronunciarse sobre las cuestiones controvertidas, salvo que acogiere el recurso, en cuyo caso podrá limitarse a la causal o causales que le hubieren sido suficientes, y declarar si es nulo o no total o parcialmente el juicio oral y la sentencia definitiva reclamados, o si solamente es nula dicha sentencia, en los casos que se indican en el artículo siguiente. El fallo del recurso se dará a conocer en la audiencia Art. indicada al efecto, con la lectura de su parte resolutiva o de una breve síntesis de la misma."}]}, {"id": "N-67v", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Las resoluciones dictadas por un tribunal de juicio oral en lo penal son inapelables.", "f": "Art. 364 CPP", "g": "N", "r": 1, "grp": "364|CPP", "x": [{"c": "Art. 364 CPP", "t": "Artículo 364.- Resoluciones inapelables. Serán inapelables las resoluciones dictadas por un tribunal de juicio oral en lo penal."}]}, {"id": "N-67f", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "Las resoluciones dictadas por un tribunal de juicio oral en lo penal son apelables en el solo efecto devolutivo.", "f": "Art. 364 CPP", "g": "N", "r": 0, "grp": "364|CPP", "x": [{"c": "Art. 364 CPP", "t": "Artículo 364.- Resoluciones inapelables. Serán inapelables las resoluciones dictadas por un tribunal de juicio oral en lo penal."}]}, {"id": "N-68v", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La interposición de un recurso no suspende la ejecución de la decisión, salvo que se impugne una sentencia definitiva condenatoria o la ley disponga expresamente lo contrario.", "f": "Art. 355 CPP", "g": "N", "r": 1, "grp": "355|CPP", "x": [{"c": "Art. 355 CPP", "t": "Artículo 355.- Efecto de la interposición de recursos. La interposición de un recurso no suspenderá la ejecución de la decisión, salvo que se impugnare una sentencia definitiva condenatoria o que la ley dispusiere expresamente lo contrario."}]}, {"id": "N-68f", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La interposición de un recurso suspende la ejecución de la decisión, salvo que la ley disponga expresamente lo contrario.", "f": "Art. 355 CPP", "g": "N", "r": 0, "grp": "355|CPP", "x": [{"c": "Art. 355 CPP", "t": "Artículo 355.- Efecto de la interposición de recursos. La interposición de un recurso no suspenderá la ejecución de la decisión, salvo que se impugnare una sentencia definitiva condenatoria o que la ley dispusiere expresamente lo contrario."}]}, {"id": "N-69v", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La resolución que falla un recurso de nulidad no es susceptible de recurso alguno, sin perjuicio de la revisión de la sentencia condenatoria firme.", "f": "Art. 387 CPP. Inc. 1°.", "g": "N", "r": 1, "grp": "387|CPP", "x": [{"c": "Art. 387 CPP", "t": "Artículo 387.- Improcedencia de recursos. La resolución que fallare un recurso de nulidad no será susceptible de recurso alguno, sin perjuicio de la revisión de la sentencia condenatoria firme de que se trata en este Código. Tampoco será susceptible de recurso alguno la sentencia que se dictare en el nuevo juicio que se realizare como consecuencia de la resolución que hubiere acogido el recurso de nulidad. No obstante, si la sentencia fuere condenatoria y la que se hubiere anulado hubiese sido absolutoria, procederá el recurso de nulidad en favor del acusado, conforme a las reglas generales. Libro Cuarto Procedimientos especiales y ejecución Título I Procedimiento simplificado"}]}, {"id": "N-69f", "o": "Preguntas nuevas", "t": "vf", "m": "PR", "e": "La resolución que falla un recurso de nulidad es apelable ante la Corte Suprema.", "f": "Art. 387 CPP. Inc. 1°.", "g": "N", "r": 0, "grp": "387|CPP", "x": [{"c": "Art. 387 CPP", "t": "Artículo 387.- Improcedencia de recursos. La resolución que fallare un recurso de nulidad no será susceptible de recurso alguno, sin perjuicio de la revisión de la sentencia condenatoria firme de que se trata en este Código. Tampoco será susceptible de recurso alguno la sentencia que se dictare en el nuevo juicio que se realizare como consecuencia de la resolución que hubiere acogido el recurso de nulidad. No obstante, si la sentencia fuere condenatoria y la que se hubiere anulado hubiese sido absolutoria, procederá el recurso de nulidad en favor del acusado, conforme a las reglas generales. Libro Cuarto Procedimientos especiales y ejecución Título I Procedimiento simplificado"}]}, {"id": "N-70", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El recurso de hecho debe interponerse ante el tribunal de alzada dentro de:", "f": "Art. 369 CPP. Tercero día.", "g": "N", "i": [], "a": ["Quinto día", "Tercero día", "Diez días", "Veinticuatro horas"], "r": 1, "grp": "369|CPP", "x": [{"c": "Art. 369 CPP", "t": "Artículo 369.- Recurso de hecho. Denegado el recurso de apelación, concedido siendo improcedente u otorgado con efectos no ajustados a derecho, los intervinientes podrán ocurrir de hecho, dentro de tercero día, ante el tribunal de alzada, con el fin de que resuelva si hubiere lugar o no al recurso y cuáles debieren ser sus efectos. Presentado el recurso, el tribunal de alzada solicitará, cuando correspondiere, los antecedentes señalados en el artículo 371 y luego fallará en cuenta. Si acogiere el recurso por haberse denegado la apelación, retendrá tales antecedentes o los recabará, si no los hubiese pedido, para pronunciarse sobre la apelación."}]}, {"id": "N-71", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El procedimiento abreviado procede cuando el fiscal requiere la imposición de una pena privativa de libertad no superior a:", "f": "Art. 406 CPP. Inc. 1° vigente.", "g": "N", "i": [], "a": ["Quince años de presidio mayor en su grado medio", "Tres años de presidio o reclusión menores en su grado medio", "Cinco años de presidio o reclusión menores en su grado máximo", "Diez años de presidio mayor en su grado mínimo"], "r": 3, "grp": "406|CPP", "x": [{"c": "Art. 406 CPP", "t": "Artículo 406.- Presupuestos del procedimiento abreviado. Se aplicará el procedimiento abreviado para conocer y fallar, los hechos respecto de los cuales el fiscal requiriere la imposición de una pena privativa de libertad no superior a diez años de presidio mayor en su grado mínimo, o bien cualesquiera otras penas de distinta naturaleza, cualquiera fuere su entidad o monto, ya fueren ellas únicas, conjuntas o alternativas. Para ello, será necesario que el imputado, en Art. conocimiento de los hechos materia de la acusación y de los antecedentes de la investigación que la fundaren, los acepte expresamente y manifieste su conformidad con la aplicación de este procedimiento. La existencia de varios acusados o la atribución de …"}]}, {"id": "N-72v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento abreviado, la sentencia condenatoria no puede imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante.", "f": "Art. 412 CPP. Límite de la pena requerida.", "g": "N", "r": 1, "grp": "412|CPP", "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}]}, {"id": "N-72f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento abreviado, el juez puede imponer una pena superior a la requerida si los antecedentes de la investigación lo justifican.", "f": "Art. 412 CPP. Límite de la pena requerida.", "g": "N", "r": 0, "grp": "412|CPP", "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}]}, {"id": "N-73v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento abreviado, la sentencia condenatoria no puede emitirse exclusivamente sobre la base de la aceptación de los hechos por el imputado.", "f": "Art. 412 CPP. Inc. 2°.", "g": "N", "r": 1, "grp": "412|CPP", "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}]}, {"id": "N-73f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "En el procedimiento abreviado, la aceptación de los hechos por el imputado basta por sí sola para fundar la sentencia condenatoria.", "f": "Art. 412 CPP. Inc. 2°.", "g": "N", "r": 0, "grp": "412|CPP", "x": [{"c": "Art. 412 CPP", "t": "Artículo 412.- Fallo en el procedimiento abreviado. Terminado el debate, el juez dictará sentencia. En caso de ser condenatoria, no podrá imponer una pena superior ni más desfavorable a la requerida por el fiscal o el querellante, en su caso. La sentencia condenatoria no podrá emitirse exclusivamente sobre la base de la aceptación de los hechos por parte del imputado. En ningún caso el procedimiento abreviado obstará a la concesión de alguna de las penas sustitutivas consideradas en la ley, cuando correspondiere. La sentencia no se pronunciará sobre la demanda civil que hubiere sido interpuesta."}]}, {"id": "N-74", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El procedimiento monitorio se aplica a:", "f": "Art. 392 CPP. Sólo pena de multa.", "g": "N", "i": [], "a": ["Los simples delitos cuya pena requerida no exceda de 60 días", "Las faltas respecto de las cuales el fiscal pide sólo pena de multa", "Las faltas y los simples delitos con pena de multa o prisión", "Todas las faltas, cualquiera sea la pena requerida"], "r": 1, "grp": "392|CPP", "x": [{"c": "Art. 392 CPP", "t": "Artículo 392.- Procedimiento monitorio. Se aplicará el procedimiento monitorio a la tramitación de las faltas respecto de las cuales el fiscal pidiere sólo pena de multa. En el requerimiento señalado en el artículo precedente el fiscal indicará el monto de la multa que solicitare imponer. Si el juez estimare suficientemente fundado el requerimiento y la proposición relativa a la multa, deberá acogerlos inmediatamente, dictando una resolución que así lo declare. Dicha resolución contendrá, además, las siguientes indicaciones: a) La instrucción acerca del derecho del imputado de reclamar en contra del requerimiento y de la imposición de la sanción, dentro de los quince días siguientes a su notificación, así como de los efectos de la interposición del reclamo; …"}]}, {"id": "N-75", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El plazo que tiene el imputado para reclamar del requerimiento y de la multa en el procedimiento monitorio es de:", "f": "Art. 392 CPP. Quince días; si paga dentro de ellos, la multa se rebaja en 25%.", "g": "N", "i": [], "a": ["Cinco días desde la notificación", "Diez días desde la notificación", "Quince días desde la notificación", "Treinta días desde la notificación"], "r": 2, "grp": "392|CPP", "x": [{"c": "Art. 392 CPP", "t": "… En el requerimiento señalado en el artículo precedente el fiscal indicará el monto de la multa que solicitare imponer. Si el juez estimare suficientemente fundado el requerimiento y la proposición relativa a la multa, deberá acogerlos inmediatamente, dictando una resolución que así lo declare. Dicha resolución contendrá, además, las siguientes indicaciones: a) La instrucción acerca del derecho del imputado de reclamar en contra del requerimiento y de la imposición de la sanción, dentro de los quince días siguientes a su notificación, así como de los efectos de la interposición del reclamo; b) La instrucción acerca de la posibilidad de que dispone el imputado en orden a aceptar el requerimiento y la multa impuesta, así como de los efectos de la aceptación, y c) El señalamiento del monto de la multa y de la forma en que la misma debiere enterarse en arcas fiscales, así como …"}]}, {"id": "N-76", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "La suspensión de la imposición de condena por falta del artículo 398 suspende la pena y sus efectos por un plazo de:", "f": "Art. 398 CPP. Seis meses; transcurridos sin nuevo requerimiento o formalización, se sobresee definitivamente.", "g": "N", "i": [], "a": ["Tres meses", "Dos años", "Seis meses", "Un año"], "r": 2, "grp": "398|CPP", "x": [{"c": "Art. 398 CPP", "t": "Artículo 398. Suspensión de la imposición de condena por falta. Cuando resulte mérito para condenar por la falta imputada, pero concurrieren antecedentes favorables que no hicieren aconsejable la imposición de la pena al imputado, el juez podrá dictar la sentencia y disponer en ella la suspensión de la pena y sus efectos por un plazo de seis meses. En tal caso, no procederá acumular esta suspensión con alguna de las penas sustitutivas contempladas en la ley N° 18.216. Transcurrido el plazo previsto en el inciso anterior sin que el imputado hubiere sido objeto de nuevo requerimiento o de una formalización de la investigación, el tribunal dejará sin efecto la sentencia y, en su reemplazo, decretará el sobreseimiento definitivo de la causa. Esta suspensión no afecta la responsabilidad civil derivada del delito."}]}, {"id": "N-77", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "La extradición activa procede respecto de delitos que tengan señalada una pena privativa de libertad cuya duración mínima exceda de:", "f": "Art. 431 CPP", "g": "N", "i": [], "a": ["Tres años", "Seis meses", "Cinco años", "Un año"], "r": 3, "grp": "431|CPP", "x": [{"c": "Art. 431 CPP", "t": "Artículo 431.- Procedencia de la extradición activa. Cuando en la tramitación de un procedimiento penal se hubiere formalizado la investigación por un delito que tuviere señalada en la ley una pena privativa de libertad cuya duración mínima excediere de un año, respecto de un individuo que se encontrare en país extranjero, el ministerio público deberá solicitar del juez de garantía que eleve los antecedentes a la Corte de Apelaciones, a fin de que este tribunal, si estimare procedente la extradición del imputado al país en el que actualmente se encontrare, ordene sea pedida. Igual solicitud podrá hacer el querellante, si no la formulare el ministerio público. El mismo procedimiento se empleará en los casos enumerados en el artículo 6º del Código Orgánico de Tribunales. …"}]}, {"id": "N-78", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "La solicitud de extradición pasiva es conocida en primera instancia por:", "f": "Art. 441 CPP. Ministro de la Corte Suprema.", "g": "N", "i": [], "a": ["La Corte de Apelaciones de Santiago", "El juez de garantía del lugar de detención", "La Sala Penal de la Corte Suprema", "Un ministro de la Corte Suprema"], "r": 3, "grp": "441|CPP", "x": [{"c": "Art. 441 CPP", "t": "Artículo 441.- Tribunal de primera instancia en la extradición pasiva. Recibidos los antecedentes, se designará al ministro de la Corte Suprema que conocerá en primera instancia de la solicitud de extradición, quien fijará, desde luego, día y hora para la realización de la audiencia a que se refiere el artículo 448 y pondrá la petición y sus antecedentes en conocimiento del representante del Estado requirente y del imputado, a menos que se hubieren solicitado medidas cautelares personales en contra de este último. Si se hubieren pedido tales medidas, el conocimiento de la petición y los antecedentes se suministrará al imputado una vez que las mismas se hubieren decretado."}]}, {"id": "N-79v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La revisión de una sentencia firme puede pedirse en cualquier tiempo.", "f": "Art. 474 CPP. En cualquier tiempo.", "g": "N", "r": 1, "grp": "474|CPP", "x": [{"c": "Art. 474 CPP", "t": "Artículo 474.- Plazo y titulares de la solicitud de revisión. La revisión de la sentencia firme podrá ser pedida, en cualquier tiempo, por el ministerio público, por el condenado, o su cónyuge o conviviente civil, ascendientes, descendientes o hermanos de éste. Asimismo, podrá interponer tal solicitud quien hubiere cumplido su condena o sus herederos, cuando el condenado hubiere muerto y se tratare de rehabilitar su memoria."}]}, {"id": "N-79f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La revisión de una sentencia firme debe pedirse dentro de un año desde que quedó ejecutoriada.", "f": "Art. 474 CPP. En cualquier tiempo.", "g": "N", "r": 0, "grp": "474|CPP", "x": [{"c": "Art. 474 CPP", "t": "Artículo 474.- Plazo y titulares de la solicitud de revisión. La revisión de la sentencia firme podrá ser pedida, en cualquier tiempo, por el ministerio público, por el condenado, o su cónyuge o conviviente civil, ascendientes, descendientes o hermanos de éste. Asimismo, podrá interponer tal solicitud quien hubiere cumplido su condena o sus herederos, cuando el condenado hubiere muerto y se tratare de rehabilitar su memoria."}]}, {"id": "N-80v", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La revisión de sentencias firmes es de competencia de la Corte Suprema.", "f": "Art. 473 CPP", "g": "N", "r": 1, "grp": "473|CPP", "x": [{"c": "Art. 473 CPP", "t": "Artículo 473.- Procedencia de la revisión. La Corte Suprema podrá rever extraordinariamente las sentencias firmes en que se hubiere condenado a alguien por un crimen o simple delito, para anularlas, en los siguientes casos: a) Cuando, en virtud de sentencias contradictorias, estuvieren sufriendo condena dos o más personas por un mismo delito que no hubiere podido ser cometido más que por una sola; b) Cuando alguno estuviere sufriendo condena como autor, cómplice o encubridor del homicidio de una persona cuya existencia se comprobare después de la condena; c) Cuando alguno estuviere sufriendo condena en virtud de sentencia fundada en un documento o en el testimonio de una o más personas, siempre que dicho documento o dicho testimonio hubiere sido declarado falso por sentencia firme en causa criminal; …"}]}, {"id": "N-80f", "o": "Preguntas nuevas", "t": "vf", "m": "PX", "e": "La revisión de sentencias firmes es de competencia de la Corte de Apelaciones respectiva.", "f": "Art. 473 CPP", "g": "N", "r": 0, "grp": "473|CPP", "x": [{"c": "Art. 473 CPP", "t": "Artículo 473.- Procedencia de la revisión. La Corte Suprema podrá rever extraordinariamente las sentencias firmes en que se hubiere condenado a alguien por un crimen o simple delito, para anularlas, en los siguientes casos: a) Cuando, en virtud de sentencias contradictorias, estuvieren sufriendo condena dos o más personas por un mismo delito que no hubiere podido ser cometido más que por una sola; b) Cuando alguno estuviere sufriendo condena como autor, cómplice o encubridor del homicidio de una persona cuya existencia se comprobare después de la condena; c) Cuando alguno estuviere sufriendo condena en virtud de sentencia fundada en un documento o en el testimonio de una o más personas, siempre que dicho documento o dicho testimonio hubiere sido declarado falso por sentencia firme en causa criminal; …"}]}, {"id": "N-81v", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La Autoridad Marítima tiene el carácter de auxiliar del Ministerio Público.", "f": "Art. 79 CPP. Inciso final incorporado por la Ley 21.845.", "g": "N", "r": 1, "grp": "79|CPP", "x": [{"c": "Art. 79 CPP", "t": "… Sin perjuicio de lo previsto en los incisos anteriores, tratándose de investigaciones en las que apareciere necesario el carácter auxiliar de Gendarmería de Chile para la realización de diligencias de investigación en el interior de establecimientos penales, el Ministerio Público también podrá impartirle instrucciones. En estos casos Gendarmería de Chile deberá actuar de conformidad con lo dispuesto en este Código. Asimismo, la Autoridad Marítima tendrá el carácter de auxiliar del Ministerio Público exclusivamente respecto de las actividades señaladas en el artículo 34 del decreto con fuerza de ley N° 292, de 1953, que aprueba la Ley Orgánica de la Dirección General del Territorio Marítimo y de Marina Mercante, y de las demás que la ley determine."}]}, {"id": "N-81f", "o": "Preguntas nuevas", "t": "vf", "m": "PI", "e": "La Autoridad Marítima no tiene el carácter de auxiliar del Ministerio Público y sólo actúa como denunciante.", "f": "Art. 79 CPP. Inciso final incorporado por la Ley 21.845.", "g": "N", "r": 0, "grp": "79|CPP", "x": [{"c": "Art. 79 CPP", "t": "… Sin perjuicio de lo previsto en los incisos anteriores, tratándose de investigaciones en las que apareciere necesario el carácter auxiliar de Gendarmería de Chile para la realización de diligencias de investigación en el interior de establecimientos penales, el Ministerio Público también podrá impartirle instrucciones. En estos casos Gendarmería de Chile deberá actuar de conformidad con lo dispuesto en este Código. Asimismo, la Autoridad Marítima tendrá el carácter de auxiliar del Ministerio Público exclusivamente respecto de las actividades señaladas en el artículo 34 del decreto con fuerza de ley N° 292, de 1953, que aprueba la Ley Orgánica de la Dirección General del Territorio Marítimo y de Marina Mercante, y de las demás que la ley determine."}]}, {"id": "N-82", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Tras la Ley 21.845, pueden realizar las actuaciones del artículo 83 sin recibir previamente instrucciones particulares de los fiscales:", "f": "Art. 83 CPP. Encabezado del art. 83 vigente.", "g": "N", "i": [], "a": ["Carabineros, Policía de Investigaciones y los inspectores municipales", "Carabineros, Policía de Investigaciones, la Autoridad Marítima en funciones de Policía Marítima y Gendarmería de Chile", "Carabineros, Policía de Investigaciones y las Fuerzas Armadas", "Sólo Carabineros y la Policía de Investigaciones"], "r": 1, "grp": "83|CPP", "x": [{"c": "Art. 83 CPP", "t": "Artículo 83.- Actuaciones de la policía sin orden previa. Corresponderá a los funcionarios de Carabineros de Chile, de la Policía de Investigaciones de Chile, de la Autoridad Marítima en el ejercicio de funciones de Policía Marítima y de Gendarmería de Chile, realizar las siguientes actuaciones, sin necesidad de recibir previamente instrucciones particulares de los fiscales: a) Prestar auxilio a la víctima; b) Practicar la detención en los casos de flagrancia, conforme a la ley. Para estos efectos, podrán coordinarse con entidades públicas o solicitar la colaboración de entidades privadas, cuando ello fuere útil para asegurar el éxito de la detención; c) Resguardar el sitio del suceso. Deberán preservar Art. …"}]}, {"id": "N-83", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La acción penal respecto de los simples delitos prescribe en:", "f": "Art. 94 CP. Crímenes con pena perpetua, quince años; demás crímenes, diez; simples delitos, cinco; faltas, seis meses.", "g": "N", "i": [], "a": ["Cinco años", "Diez años", "Dos años", "Tres años"], "r": 0, "grp": "94|CP", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "N-84v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de los crímenes a que la ley no impone pena perpetua prescribe en diez años.", "f": "Art. 94 CP. Diez años.", "g": "N", "r": 1, "grp": "94|CP", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "N-84f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de los crímenes a que la ley no impone pena perpetua prescribe en quince años.", "f": "Art. 94 CP. Diez años.", "g": "N", "r": 0, "grp": "94|CP", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "N-85v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de las faltas prescribe en seis meses.", "f": "Art. 94 CP. Seis meses.", "g": "N", "r": 1, "grp": "94|CP", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "N-85f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La acción penal respecto de las faltas prescribe en un año.", "f": "Art. 94 CP. Seis meses.", "g": "N", "r": 0, "grp": "94|CP", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}]}, {"id": "N-86", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Las penas de simples delitos impuestas por sentencia ejecutoriada prescriben en:", "f": "Art. 97 CP. Quince, diez y cinco años y seis meses, según el caso.", "g": "N", "i": [], "a": ["Cinco años", "Diez años", "Tres años", "Seis meses"], "r": 0, "grp": "97|CP", "x": [{"c": "Art. 97 CP", "t": "ART. 97. Las penas impuestas por sentencia ejecutoria prescriben: La de presidio, reclusión y relegación perpetuos, en quince años. Las demás penas de crímenes, en diez años. Las penas de simples delitos, en cinco años. Las de faltas, en seis meses."}]}, {"id": "N-87v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Cuando el responsable se ausenta del territorio de la República, para el cómputo de la prescripción se cuenta por uno cada dos días de ausencia.", "f": "Art. 100 CP. Uno por cada dos días de ausencia.", "g": "N", "r": 1, "grp": "100|CP", "x": [{"c": "Art. 100 CP", "t": "ART. 100. Cuando el responsable se ausentare del territorio de la República sólo podrá prescribir la acción penal o la pena contando por uno cada dos días de ausencia, para el cómputo de los años. Para los efectos de aplicar la prescripción de la acción penal o de la pena, no se entenderán ausentes del territorio nacional los que hubieren estado sujetos a prohibición o impedimento de ingreso al país por decisión de la autoridad política o administrativa, por el tiempo que les hubiere afectado tal prohibición o impedimento."}]}, {"id": "N-87f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Cuando el responsable se ausenta del territorio de la República, la prescripción se suspende durante todo el tiempo de la ausencia.", "f": "Art. 100 CP. Uno por cada dos días de ausencia.", "g": "N", "r": 0, "grp": "100|CP", "x": [{"c": "Art. 100 CP", "t": "ART. 100. Cuando el responsable se ausentare del territorio de la República sólo podrá prescribir la acción penal o la pena contando por uno cada dos días de ausencia, para el cómputo de los años. Para los efectos de aplicar la prescripción de la acción penal o de la pena, no se entenderán ausentes del territorio nacional los que hubieren estado sujetos a prohibición o impedimento de ingreso al país por decisión de la autoridad política o administrativa, por el tiempo que les hubiere afectado tal prohibición o impedimento."}]}, {"id": "N-88", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La media prescripción del artículo 103 obliga al tribunal a considerar el hecho como:", "f": "Art. 103 CP. Si ya transcurrió la mitad del plazo de prescripción.", "g": "N", "i": [], "a": ["Revestido de dos o más circunstancias atenuantes muy calificadas y de ninguna agravante", "Constitutivo de un delito frustrado", "Revestido de una circunstancia atenuante muy calificada", "Merecedor de la pena inferior en un grado"], "r": 0, "grp": "103|CP", "x": [{"c": "Art. 103 CP", "t": "ART. 103. Si el responsable se presentare o fuere habido antes de completar el tiempo de la prescripción de la acción penal o de la pena, pero habiendo ya trascurrido la mitad del que se exige, en sus respectivos casos, para tales prescripciones, deberá el tribunal considerar el hecho como revestido de dos o más circunstancias atenuantes muy calificadas y de ninguna agravante y aplicar las reglas de los arts. 65, 66, 67 y 68, sea en la imposición de la pena, sea para disminuir la ya impuesta. Esta regla no se aplica a las prescripciones de las faltas y especiales de corto tiempo."}]}, {"id": "N-89v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La prescripción de la acción penal se interrumpe siempre que el delincuente comete nuevamente crimen o simple delito, y se suspende desde que el procedimiento se dirige contra él.", "f": "Art. 96 CP. Interrupción por nuevo delito; suspensión por dirigirse el procedimiento.", "g": "N", "r": 1, "grp": "96|CP", "x": [{"c": "Art. 96 CP", "t": "ART. 96. Esta prescripción se interrumpe, perdiéndose el tiempo trascurrido, siempre que el delincuente comete nuevamente crimen o simple delito, y se suspende desde que el procedimiento se dirige contra él; pero si se paraliza su prosecución por tres años o se termina sin condenarle, continúa la prescripción como si no se hubiere interrumpido."}]}, {"id": "N-89f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La prescripción de la acción penal se suspende cuando el delincuente comete nuevamente crimen o simple delito, y se interrumpe desde que el procedimiento se dirige contra él.", "f": "Art. 96 CP. Interrupción por nuevo delito; suspensión por dirigirse el procedimiento.", "g": "N", "r": 0, "grp": "96|CP", "x": [{"c": "Art. 96 CP", "t": "ART. 96. Esta prescripción se interrumpe, perdiéndose el tiempo trascurrido, siempre que el delincuente comete nuevamente crimen o simple delito, y se suspende desde que el procedimiento se dirige contra él; pero si se paraliza su prosecución por tres años o se termina sin condenarle, continúa la prescripción como si no se hubiere interrumpido."}]}, {"id": "N-90", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Las penas temporales mayores duran:", "f": "Art. 25 CP. Mayores: cinco años y un día a veinte; menores: sesenta y un días a cinco años.", "g": "N", "i": [], "a": ["De cinco años a veinte años", "De tres años y un día a quince años", "De cinco años y un día a veinte años", "De cinco años y un día a cuarenta años"], "r": 2, "grp": "25|CP", "x": [{"c": "Art. 25 CP", "t": "ART. 25. Las penas temporales mayores duran de cinco años y un día a veinte años, y las temporales menores de sesenta y un días a cinco años. Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; …"}]}, {"id": "N-91v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La pena de prisión dura de uno a sesenta días.", "f": "Art. 25 CP. Uno a sesenta días.", "g": "N", "r": 1, "grp": "25|CP", "x": [{"c": "Art. 25 CP", "t": "… Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; en los simples delitos, de veinte unidades tributarias mensuales, y en las faltas, de cuatro unidades tributarias mensuales; todo ello, sin perjuicio de que en determinadas infracciones, atendida su gravedad, se contemplen multas de cuantía superior. …"}]}, {"id": "N-91f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La pena de prisión dura de uno a noventa días.", "f": "Art. 25 CP. Uno a sesenta días.", "g": "N", "r": 0, "grp": "25|CP", "x": [{"c": "Art. 25 CP", "t": "… Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; en los simples delitos, de veinte unidades tributarias mensuales, y en las faltas, de cuatro unidades tributarias mensuales; todo ello, sin perjuicio de que en determinadas infracciones, atendida su gravedad, se contemplen multas de cuantía superior. …"}]}, {"id": "N-92", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Para los efectos legales se reputan aflictivas:", "f": "Art. 37 CP", "g": "N", "i": [], "a": ["Sólo las penas de crímenes", "Todas las penas de crímenes y, respecto de las de simples delitos, las de presidio, reclusión, confinamiento, extrañamiento y relegación menores en sus grados máximos", "Todas las penas privativas de libertad superiores a un año", "Todas las penas de crímenes y de simples delitos"], "r": 1, "grp": "37|CP", "x": [{"c": "Art. 37 CP", "t": "ART. 37. Para los efectos legales se reputan aflictivas todas las penas de crímenes y, respecto de las de simples delitos, las de presidio, reclusión, confinamiento, extrañamiento y relegación menores en sus grados máximos."}]}, {"id": "N-93", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "A los autores de tentativa de crimen o simple delito, a los cómplices de crimen o simple delito frustrado y a los encubridores de crimen o simple delito consumado se impone la pena:", "f": "Art. 52 CP", "g": "N", "i": [], "a": ["Inferior en dos grados a la señalada por la ley", "Inmediatamente inferior en grado a la señalada por la ley", "Inferior en cuatro grados a la señalada por la ley", "Inferior en tres grados a la señalada por la ley"], "r": 0, "grp": "52|CP", "x": [{"c": "Art. 52 CP", "t": "ART. 52. A los autores de tentativa de crimen o simple delito, a los cómplices de crimen o simple delito frustrado y a los encubridores de crimen o simple delito consumado, se impondrá la pena inferior en dos grados a la que señala la ley para el crimen o simple delito. Exceptúanse de esta regla los encubridores comprendidos en el núm. 3.° del art. 17, en quienes concurra la circunstancia primera del mismo número, a los cuales se impondrá la pena de inhabilitación especial perpetua, si el delincuente encubierto fuere condenado por crimen y la de inhabilitación especial temporal en cualquiera de sus grados, si lo fuere por simple delito. También se exceptúan los encubridores comprendidos en el núm. 4.° del mismo art. 17, a quienes se aplicará la pena de presidio menor en cualquiera de sus grados."}]}, {"id": "N-94v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "A los autores de crimen o simple delito frustrado y a los cómplices de crimen o simple delito consumado se impone la pena inmediatamente inferior en grado.", "f": "Art. 51 CP", "g": "N", "r": 1, "grp": "51|CP", "x": [{"c": "Art. 51 CP", "t": "ART. 51. A los autores de crimen o simple delito frustrado y a los cómplices de crimen o simple delito consumado, se impondrá la pena inmediatamente inferior en grado a la señalada por la ley para el crimen o simple delito."}]}, {"id": "N-94f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "A los autores de crimen o simple delito frustrado y a los cómplices de crimen o simple delito consumado se impone la pena inferior en dos grados.", "f": "Art. 51 CP", "g": "N", "r": 0, "grp": "51|CP", "x": [{"c": "Art. 51 CP", "t": "ART. 51. A los autores de crimen o simple delito frustrado y a los cómplices de crimen o simple delito consumado, se impondrá la pena inmediatamente inferior en grado a la señalada por la ley para el crimen o simple delito."}]}, {"id": "N-95v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "A los encubridores de tentativa de crimen o simple delito se impone la pena inferior en cuatro grados.", "f": "Art. 54 CP", "g": "N", "r": 1, "grp": "54|CP", "x": [{"c": "Art. 54 CP", "t": "ART. 54. A los encubridores de tentativa de crimen o simple delito, se impondrá la pena inferior en cuatro grados a la señalada para el crimen o simple delito."}]}, {"id": "N-95f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "A los encubridores de tentativa de crimen o simple delito se impone la pena inferior en tres grados.", "f": "Art. 54 CP", "g": "N", "r": 0, "grp": "54|CP", "x": [{"c": "Art. 54 CP", "t": "ART. 54. A los encubridores de tentativa de crimen o simple delito, se impondrá la pena inferior en cuatro grados a la señalada para el crimen o simple delito."}]}, {"id": "N-96", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La eximente incompleta del artículo 73 permite aplicar la pena inferior:", "f": "Art. 73 CP. Siempre que concurra el mayor número de requisitos.", "g": "N", "i": [], "a": ["En uno o dos grados al mínimo de los señalados por la ley", "En un grado al mínimo de los señalados por la ley", "En uno, dos o tres grados al mínimo de los señalados por la ley", "En su mínimum"], "r": 2, "grp": "73|CP", "x": [{"c": "Art. 73 CP", "t": "ART. 73. Se aplicará asimismo la pena inferior en uno, dos o tres grados al mínimo de los señalados por la ley, cuando el hecho no fuere del todo excusable por falta de alguno de los requisitos que se exigen para eximir de responsabilidad criminal en los respectivos casos de que trata el art. 10, siempre que concurra el mayor número de ellos, imponiéndola en el grado que el tribunal estime correspondiente, atendido el número entidad de los requisitos que falten o concurran. Esta disposición se entiende sin perjuicio de la contenida en el art. 71."}]}, {"id": "N-97", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Cuando sólo concurre una atenuante muy calificada, el tribunal puede:", "f": "Art. 68 bis CP", "g": "N", "i": [], "a": ["Excluir el grado máximo de la pena", "Imponer la pena inferior en dos grados al mínimo de la señalada al delito", "Imponer el mínimum de la pena", "Imponer la pena inferior en un grado al mínimo de la señalada al delito"], "r": 3, "grp": "68 bis|CP", "x": [{"c": "Art. 68 bis CP", "t": "ART. 68 BIS. Sin perjuicio de lo dispuesto en los cuatro artículos anteriores, cuando sólo concurra una atenuante muy calificada el Tribunal podrá imponer la pena inferior en un grado al mínimo de la señalada al delito."}]}, {"id": "N-98v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La conspiración y la proposición para cometer un crimen o un simple delito sólo son punibles en los casos en que la ley las pena especialmente.", "f": "Art. 8 CP. Inc. 1°.", "g": "N", "r": 1, "grp": "8|CP", "x": [{"c": "Art. 8 CP", "t": "ART. 8. La conspiración y proposición para cometer un crimen o un simple delito, sólo son punibles en los casos en que la ley las pena especialmente. La conspiración existe cuando dos o más personas se conciertan para la ejecución del crimen o simple delito. La proposición se verifica cuando el que ha resuelto cometer un crimen o un simple delito, propone su ejecución a otra u otras personas. Exime de toda pena por la conspiración o proposición para cometer un crimen o un simple delito, el desistimiento de la ejecución de éstos antes de principiar a ponerlos por obra y de iniciarse procedimiento judicial contra el culpable, con tal que denuncie a la autoridad pública el plan y sus circunstancias."}]}, {"id": "N-98f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La conspiración y la proposición para cometer un crimen son siempre punibles con la pena de la tentativa.", "f": "Art. 8 CP. Inc. 1°.", "g": "N", "r": 0, "grp": "8|CP", "x": [{"c": "Art. 8 CP", "t": "ART. 8. La conspiración y proposición para cometer un crimen o un simple delito, sólo son punibles en los casos en que la ley las pena especialmente. La conspiración existe cuando dos o más personas se conciertan para la ejecución del crimen o simple delito. La proposición se verifica cuando el que ha resuelto cometer un crimen o un simple delito, propone su ejecución a otra u otras personas. Exime de toda pena por la conspiración o proposición para cometer un crimen o un simple delito, el desistimiento de la ejecución de éstos antes de principiar a ponerlos por obra y de iniciarse procedimiento judicial contra el culpable, con tal que denuncie a la autoridad pública el plan y sus circunstancias."}]}, {"id": "N-99v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "La división de los delitos en crímenes, simples delitos y faltas es aplicable a los cuasidelitos, que se califican y penan en los casos especiales que determina el Código.", "f": "Art. 4 CP. Y art. 10 N° 13.", "g": "N", "r": 1, "grp": "4|CP", "x": [{"c": "Art. 4 CP", "t": "ART. 4. La división de los delitos es aplicable a los cuasidelitos, que se califican y penan en los casos especiales que determina este Código."}]}, {"id": "N-99f", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Los cuasidelitos se castigan siempre que el hecho, de haber mediado dolo, constituiría crimen o simple delito.", "f": "Art. 4 CP. Y art. 10 N° 13.", "g": "N", "r": 0, "grp": "4|CP", "x": [{"c": "Art. 4 CP", "t": "ART. 4. La división de los delitos es aplicable a los cuasidelitos, que se califican y penan en los casos especiales que determina este Código."}]}, {"id": "N-100", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La atenuante de haber colaborado sustancialmente al esclarecimiento de los hechos está contemplada en el artículo 11:", "f": "Art. 11 CP. N° 6 irreprochable conducta anterior; N° 7 reparar con celo el mal causado; N° 8 denunciarse y confesar; N° 9 colaboración sustancial.", "g": "N", "i": [], "a": ["N° 6", "N° 8", "N° 7", "N° 9"], "r": 3, "grp": "11|CP", "x": [{"c": "Art. 11 CP", "t": "… 21 a) naturalmente hayan producido arrebato y obcecación. 6.° Si la conducta anterior del delincuente ha sido irreprochable. 7.° Si ha procurado con celo reparar el mal causado o impedir sus ulteriores perniciosas consecuencias. 8.° Si pudiendo eludir la acción de la justicia por medio de la fuga u ocultándose, se ha denunciado y confesado el delito. 9ª. Si se ha colaborado sustancialmente al esclarecimiento de los hechos, sin que la colaboración sea asimismo constitutiva de cooperación eficaz de conformidad con la ley. 10.° El haber obrado por celo de la justicia. Artículo primero § IV. De las circunstancias que agravan la responsabilidad criminal."}]}, {"id": "N-101", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Las circunstancias agravantes de reincidencia de los N° 15 y 16 del artículo 12 no se toman en cuenta tratándose de crímenes después de:", "f": "Art. 104 CP. Diez años para crímenes y cinco para simples delitos.", "g": "N", "i": [], "a": ["Diez años, contados desde la fecha en que tuvo lugar el hecho", "Diez años, contados desde el cumplimiento de la condena", "Cinco años, contados desde la fecha en que tuvo lugar el hecho", "Quince años, contados desde el cumplimiento de la condena"], "r": 0, "grp": "104|CP", "x": [{"c": "Art. 104 CP", "t": "ART. 104. Las circunstancias agravantes comprendidas en los núms. 15 y 16 del art. 12, no se tomarán en cuenta tratándose de crímenes, después de diez años, a contar desde la fecha en que tuvo lugar el hecho, ni después de cinco, en los casos de simples delitos."}]}, {"id": "N-102v", "o": "Preguntas nuevas", "t": "vf", "m": "PG", "e": "Están exentos de las penas del encubrimiento los parientes que señala el inciso final del artículo 17, salvo el que se aprovecha por sí mismo o facilita a los culpables los medios para aprovecharse de los efectos del delito.", "f": "Art. 17 CP. La excepción es el N° 1 del art. 17.", "g": "N", "r": 1, "grp": "17|CP", "x": [{"c": "Art. 17 CP", "t": "… suministrándoles auxilios o noticias para que se guarden, precavan o salven. Están exentos de las penas impuestas a los encubridores los que lo sean de su cónyuge, de su conviviente civil, o de sus parientes por consanguinidad o afinidad en toda la línea recta y en la colateral hasta el segundo grado, de sus padres o hijos, con la sola excepción de los que se hallaren comprendidos en el número 1° de este artículo. TÍT
