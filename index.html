icios esenciales, son los siguientes, los que no necesariamente tienen un orden secuencial: 1. Cooperación: colaboración y acatamiento de las indicaciones del personal de las Fuerzas de Orden y Seguridad Pública por parte de una persona o un grupo de personas. 2. Resistencia pasiva: tipo de resistencia de una persona o grupo de personas que, sin hacer uso de fuerza física o violencia, se niega a obedecer las indicaciones del personal de las Fuerzas de Orden y Seguridad Pública previamente identificado como tal, de conformidad con el numeral 2 del artículo 5. …"}], "grp": "6|Ley 21.849"}, {"id": "N-VF-175", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Las Fuerzas de Orden y Seguridad Pública deben enviar informes anuales sobre uso de la fuerza al Ministerio de Seguridad Pública.", "f": "Art. 10 Ley 21.849: los informes son semestrales.", "g": "N", "r": 0, "x": [{"c": "Art. 10 Ley 21.849", "t": "Artículo 10.- Informes. Las Fuerzas de Orden y Seguridad Pública enviarán informes semestrales al Ministerio de Seguridad Pública, por medio de la subsecretaría respectiva, que contengan información estadística relativa al uso de la fuerza y episodios violentos en el mantenimiento del orden público o la seguridad pública interior. Título III Del uso de la fuerza por las Fuerzas Armadas en determinadas circunstancias establecidas en la Constitución y la ley"}], "grp": "10|Ley 21.849"}, {"id": "N-VF-176", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El acceso ilícito simple a un sistema informático se castiga con presidio menor en su grado mínimo o multa de once a veinte unidades tributarias mensuales.", "f": "Art. 2° inc. 1° Ley 21.459.", "g": "N", "r": 1, "x": [{"c": "Art. 2 Ley 21.459", "t": "Artículo 2°.- Acceso ilícito. El que, sin autorización o excediendo la autorización que posea y superando barreras técnicas o medidas tecnológicas de seguridad, acceda a un sistema informático será castigado con la pena de presidio menor en su grado mínimo o multa de once a veinte unidades tributarias mensuales. Si el acceso fuere realizado con el ánimo de apoderarse o usar la información contenida en el sistema informático, se aplicará la pena de presidio menor en sus grados mínimo a medio. Igual pena se aplicará a quien divulgue la información a la cual se accedió de manera ilícita, si no fuese obtenida por éste. En caso de ser una misma persona la que hubiere obtenido y divulgado la información, se aplicará la pena de presidio menor en sus grados medio a máximo. …"}], "grp": "2|Ley 21.459"}, {"id": "N-VF-177", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La receptación de datos informáticos se sanciona con la pena del delito respectivo rebajada en un grado.", "f": "Art. 6° Ley 21.459.", "g": "N", "r": 1, "x": [{"c": "Art. 6 Ley 21.459", "t": "Artículo 6°.- Receptación de datos informáticos. El que conociendo su origen o no pudiendo menos que conocerlo comercialice, transfiera o almacene con el mismo objeto u otro fin ilícito, a cualquier título, datos informáticos, provenientes de la realización de las conductas descritas en los artículos 2°, 3° y 5°, sufrirá la pena asignada a los respectivos delitos, rebajada en un grado."}], "grp": "6|Ley 21.459"}, {"id": "N-VF-178", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El ataque a la integridad de los datos informáticos del artículo 4° de la Ley 21.459 exige que se cause un daño grave al titular.", "f": "Art. 4° Ley 21.459.", "g": "N", "r": 1, "x": [{"c": "Art. 4 Ley 21.459", "t": "Artículo 4°.- Ataque a la integridad de los datos informáticos. El que indebidamente altere, dañe o suprima datos informáticos, será castigado con presidio menor en su grado medio, siempre que con ello se cause un daño grave al titular de estos mismos."}], "grp": "4|Ley 21.459"}, {"id": "N-VF-179", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La huella genética de la víctima que se opone expresamente no se incorpora al Registro de Víctimas.", "f": "Art. 8° Ley 19.970.", "g": "N", "r": 1, "x": [{"c": "Art. 8 Ley 19.970", "t": "Artículo 8º.- Registro de Víctimas. El Registro de Víctimas contendrá las huellas genéticas de las víctimas de un delito, determinadas en el curso de un procedimiento criminal. En todo caso, no se incorporará al Registro la huella genética de la víctima que expresamente se opusiere a ello. Para tal efecto, quien tome la muestra biológica consignará el hecho de corresponder a una víctima. El Servicio Médico Legal o, en su caso, la institución especialmente acreditada que hubiere determinado la huella genética, se abstendrán de incorporarla en el Registro hasta recibir tal instrucción del Ministerio Público, el que previamente consultará a la víctima, informándola acerca de su derecho. Las huellas agregadas a este Registro serán eliminadas en la forma prevista en el artículo 18."}], "grp": "8|Ley 19.970"}, {"id": "N-VF-180", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La incorporación de huellas genéticas de condenados o imputados a los registros del Sistema se ejecuta por orden del fiscal.", "f": "Art. 16 Ley 19.970: por orden del tribunal; la de víctimas, evidencias o desaparecidos, por orden del fiscal.", "g": "N", "r": 0, "x": [{"c": "Art. 16 Ley 19.970", "t": "Artículo 16.- Incorporación de las huellas genéticas en los Registros del Sistema. Tratándose de huellas genéticas correspondientes a condenados o imputados, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del tribunal. Tratándose de huellas genéticas correspondientes a víctimas, evidencias o desaparecidos o sus familiares, su incorporación en los respectivos Registros del Sistema se ejecutará por orden del fiscal del Ministerio Público, sin perjuicio de lo dispuesto en el artículo 8º. En los casos a que se refieren los incisos precedentes, la incorporación en los Registros será ejecutada por el organismo que hubiere determinado la huella genética. En todo caso, las instituciones públicas o privadas no especialmente acreditadas para el ingreso de información al Sistema, remitirán la huella genética al Servicio Médico Legal para que éste la incorpore en el Registro correspondiente. …"}], "grp": "16|Ley 19.970"}, {"id": "N-VF-181", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "El lavado de activos del artículo 27 de la Ley 19.913 se castiga con presidio mayor en sus grados mínimo a medio y multa de doscientas a mil unidades tributarias mensuales.", "f": "Art. 27 Ley 19.913.", "g": "N", "r": 1, "x": [{"c": "Art. 27 Ley 19.913", "t": "Artículo 27.- Será castigado con presidio mayor en sus grados mínimo a medio y multa de doscientas a mil unidades tributarias mensuales: a) El que de cualquier forma oculte o disimule el origen ilícito de determinados bienes, a sabiendas de que provienen, directa o indirectamente, de la perpetración de hechos constitutivos de alguno de los delitos contemplados en la ley Nº 20.000, que Sanciona el tráfico ilícito de estupefacientes y sustancias psicotrópicas; en la ley Nº 18.314, que Determina conductas terroristas y fija su penalidad; en el artículo 10 de la ley Nº 17.798, sobre Control de Armas; en el Título XI de la ley Nº 18.045, sobre Mercado de Valores; en el inciso primero del artículo 39 y en el Título XVII del decreto con fuerza de ley Nº 3, de 1997, del Ministerio de Hacienda, Ley General de Bancos; …"}], "grp": "27|Ley 19.913"}, {"id": "N-VF-182", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "Matar a un carabinero en razón de su cargo se castiga con presidio mayor en su grado máximo a presidio perpetuo calificado.", "f": "Art. 416 inc. 1° Código de Justicia Militar.", "g": "N", "r": 1, "x": [{"c": "Art. 416 CJM", "t": "Artículo 416.- El que matare a un carabinero en razón de su cargo o con motivo u ocasión del ejercicio de sus funciones será castigado con la pena de presidio mayor en su grado máximo a presidio perpetuo calificado. La conducta establecida en el inciso anterior será Art. castigada con presidio perpetuo a presidio perpetuo calificado si concurre alguna de las circunstancias siguientes: a) Si se comete mediante precio, recompensa o promesa, o cualquier otro tipo de beneficio para sí o para un tercero. b) Si se ejecuta con auxilio de gente armada o de personas que aseguren o proporcionen impunidad. c) Si el imputado actúa con su rostro cubierto con el objeto de ocultar su identidad."}], "grp": "416|CJM"}, {"id": "N-VF-183", "o": "Preguntas nuevas", "t": "vf", "m": "LE", "e": "La responsabilidad penal de la persona jurídica exige que el hecho se vea favorecido o facilitado por la falta de implementación efectiva de un modelo adecuado de prevención.", "f": "Art. 3° Ley 20.393.", "g": "N", "r": 1, "x": [{"c": "Art. 3 Ley 20.393", "t": "Artículo 3°.- Presupuestos de la responsabilidad penal. Una persona jurídica será penalmente responsable por cualquiera de los delitos señalados en el artículo 1, perpetrado en el marco de su actividad por o con la intervención de alguna persona natural que ocupe un cargo, función o posición en ella, o le preste servicios gestionando asuntos suyos ante terceros, con o sin su representación, siempre que la perpetración del hecho se vea favorecida o facilitada por la falta de implementación efectiva de un modelo adecuado de prevención de tales delitos, por parte de la persona jurídica. Si concurrieren los requisitos previstos en el inciso anterior, una persona jurídica también será responsable por el hecho perpetrado por o con la intervención de una persona natural relacionada en los términos previstos por dicho inciso con una persona jurídica distinta, siempre que ésta le preste servicios …"}], "grp": "3|Ley 20.393"}, {"id": "N-SM-1", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "El tiempo inmediato de las letras d), e) y f) del artículo 130 del Código Procesal Penal, según quién practica la detención, es de:", "i": [], "a": ["12 horas la policía, 24 horas la Autoridad Marítima y 6 horas otras personas", "24 horas la policía, 48 horas la Autoridad Marítima y 12 horas otras personas", "24 horas en todos los casos", "48 horas la policía, 24 horas la Autoridad Marítima y 12 horas otras personas"], "r": 1, "f": "Art. 130 inc. final CPP, sustituido por la Ley 21.845.", "g": "N", "x": [{"c": "Art. 130 CPP", "t": "… cómplice de un delito que se hubiere cometido en un tiempo inmediato. f) El que aparezca en un registro audiovisual Art. cometiendo un crimen o simple delito al cual la policía tenga acceso en un tiempo inmediato. Para los efectos de lo establecido en las letras d), e) se entenderá por \"tiempo inmediato\" todo aquel que transcurra entre la comisión del hecho y la captura del imputado, siempre que no hubieren transcurrido más de veinticuatro horas, en caso de que la detención se practicare por agentes policiales, o más de cuarenta y ocho horas cuando lo fuere por la Autoridad Marítima en el ejercicio de funciones de Policía Marítima, o más de doce horas, cuando fuere realizada por cualquier otra persona."}], "grp": "130|CPP"}, {"id": "N-SM-2", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "El plazo máximo para que la policía informe al Ministerio Público de una detención por flagrancia es de:", "i": [], "a": ["6 horas", "12 horas", "24 horas", "48 horas"], "r": 1, "f": "Art. 131 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 131 CPP", "t": "… Cuando la detención se practicare en cumplimiento de una orden judicial, los agentes policiales que la hubieren realizado o el encargado del recinto de detención conducirán inmediatamente al detenido a presencia del juez que hubiere expedido la orden. Si ello no fuere posible por no ser hora de despacho, el detenido podrá permanecer en el recinto policial o de detención hasta el momento de la primera audiencia judicial, por un período que en caso alguno excederá las veinticuatro horas. Cuando la detención se practicare en virtud de los artículos 129 y 130, el agente policial que la hubiere realizado o el encargado del recinto de detención deberán informar de ella al ministerio público dentro de un plazo máximo de doce horas. …"}], "grp": "131|CPP"}, {"id": "N-SM-3", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "Ante la ausencia del fiscal en la audiencia de control de detención, el juez puede suspenderla por un plazo no superior a:", "i": [], "a": ["Una hora", "Dos horas", "Seis horas", "Veinticuatro horas"], "r": 1, "f": "Art. 132 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 132 CPP", "t": "Artículo 132. Comparecencia judicial. A la primera audiencia judicial del detenido deberá concurrir el fiscal o el abogado asistente del fiscal. La ausencia de éstos dará lugar a la liberación del detenido. No obstante lo anterior, el juez podrá suspender la audiencia por un plazo breve y perentorio no superior a dos horas, con el fin de permitir la concurrencia del fiscal o su abogado asistente. Transcurrido este plazo sin que concurriere ninguno de ellos, se procederá a la liberación del detenido. En todo caso, el juez deberá comunicar la ausencia del Art. fiscal o de su abogado asistente al fiscal regional respectivo o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, a la mayor brevedad, con el objeto de determinar la eventual responsabilidad disciplinaria que correspondiere. …"}], "grp": "132|CPP"}, {"id": "N-SM-4", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "No se puede ordenar la prisión preventiva:", "i": [], "a": ["Cuando el delito esté sancionado únicamente con penas pecuniarias o privativas de derechos", "Cuando se trate de delitos de acción privada", "Cuando el imputado se encuentre cumpliendo efectivamente una pena privativa de libertad", "En todos los casos anteriores"], "r": 3, "f": "Art. 141 CPP, letras a), b) y c).", "g": "N", "x": [{"c": "Art. 141 CPP", "t": "Artículo 141. Improcedencia de la prisión preventiva. No se podrá ordenar la prisión preventiva: a) Cuando el delito imputado estuviere sancionado únicamente con penas pecuniarias o privativas de derechos; b) Cuando se tratare de delitos de acción privada, y c) Cuando el imputado se encontrare cumpliendo efectivamente una pena privativa de libertad. Si por cualquier motivo fuere a cesar el cumplimiento efectivo de la pena y el fiscal o el querellante estimaren necesaria la prisión preventiva o alguna de las medidas previstas en el Párrafo 6º, podrá solicitarlas anticipadamente, de conformidad a las disposiciones de este Párrafo, a fin de que, si el tribunal acogiere la solicitud, la medida se aplique al imputado en cuanto cese el cumplimiento efectivo de la pena, sin solución de continuidad. …"}], "grp": "141|CPP"}, {"id": "N-SM-5", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "El tribunal debe citar de oficio a audiencia para revisar la prisión preventiva transcurridos:", "i": [], "a": ["Tres meses desde que se ordenó o desde el último debate oral", "Seis meses desde que se ordenó o desde el último debate oral", "Un año desde la formalización", "Dos meses desde la última revisión"], "r": 1, "f": "Art. 145 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 145 CPP", "t": "Artículo 145.- Substitución de la prisión preventiva y revisión de oficio. En cualquier momento del procedimiento el tribunal, de oficio o a petición de parte, podrá substituir la prisión preventiva por alguna de las medidas que se contemplan en las disposiciones del Párrafo 6º de este Título. Transcurridos seis meses desde que se hubiere ordenado la prisión preventiva o desde el último debate oral en que ella se hubiere decidido, el tribunal citará de oficio a una audiencia, con el fin de considerar su cesación o prolongación."}], "grp": "145|CPP"}, {"id": "N-SM-6", "o": "Preguntas nuevas", "t": "sm", "m": "PC", "e": "La caución que reemplaza la prisión preventiva procede cuando ésta se impuso:", "i": [], "a": ["Para proteger a la víctima", "Por peligro para la seguridad de la sociedad", "Únicamente para garantizar la comparecencia al juicio y la eventual ejecución de la pena", "Para asegurar el éxito de la investigación"], "r": 2, "f": "Art. 146 CPP.", "g": "N", "x": [{"c": "Art. 146 CPP", "t": "Artículo 146.- Caución para reemplazar la prisión preventiva. Cuando la prisión preventiva hubiere sido o debiere ser impuesta únicamente para garantizar la comparecencia del imputado al juicio y a la eventual ejecución de la pena, el tribunal podrá autorizar su reemplazo por una caución económica suficiente, cuyo monto fijará. La caución podrá consistir en el depósito por el imputado u otra persona de dinero o valores, la constitución de prendas o hipotecas, o la fianza de una o más personas idóneas calificadas por el tribunal."}], "grp": "146|CPP"}, {"id": "N-SM-7", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El secreto de actuaciones de investigación respecto del imputado puede decretarse por el fiscal por un plazo no superior a:", "i": [], "a": ["Veinte días, sin ampliación", "Cuarenta días, ampliables por el mismo período por una sola vez", "Sesenta días, ampliables indefinidamente", "Noventa días"], "r": 1, "f": "Art. 182 inc. 3° CPP.", "g": "N", "x": [{"c": "Art. 182 CPP", "t": "… El imputado y los demás intervinientes en el procedimiento podrán examinar y obtener copias, a su cargo, de los registros y documentos de la investigación fiscal y podrán examinar los de la investigación policial. El fiscal podrá disponer que determinadas actuaciones, Art. registros o documentos sean mantenidas en secreto respecto del imputado o de los demás intervinientes, cuando lo considerare necesario para la eficacia de la investigación. En tal caso deberá identificar las piezas o actuaciones respectivas, de modo que no se vulnere la reserva y fijar un plazo no superior a cuarenta días para la mantención del secreto, el cual podrá ser ampliado por el mismo período, por una sola vez, con motivos fundados. …"}], "grp": "182|CPP"}, {"id": "N-SM-8", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El fiscal debe pronunciarse sobre una diligencia propuesta por un interviniente dentro de:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Treinta días"], "r": 1, "f": "Art. 183 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 183 CPP", "t": "Artículo 183.- Proposición de diligencias. Durante la investigación, tanto el imputado como los demás intervinientes en el procedimiento podrán solicitar al fiscal todas aquellas diligencias que consideraren pertinentes y útiles para el esclarecimiento de los hechos. El fiscal deberá pronunciarse dentro de los diez días siguientes a la solicitud y ordenará que se lleven a efecto aquellas que estimare conducentes. Si el fiscal rechazare la solicitud o no se pronunciare dentro del plazo establecido en el inciso anterior, se podrá reclamar ante las autoridades del Ministerio Público según lo disponga la ley orgánica constitucional respectiva, dentro del plazo de cinco días contado desde el rechazo o desde el vencimiento del señalado plazo, con el propósito de obtener un pronunciamiento definitivo acerca de la procedencia de la diligencia."}], "grp": "183|CPP"}, {"id": "N-SM-9", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La orden de entrada y registro caduca transcurridos:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Treinta días"], "r": 1, "f": "Art. 208 inc. 2° CPP: vigencia máxima de diez días.", "g": "N", "x": [{"c": "Art. 208 CPP", "t": "Artículo 208.- Contenido de la orden de registro. La orden que autorizare la entrada y registro deberá señalar: a) El o los edificios o lugares que hubieren de ser registrados; b) El fiscal que lo hubiere solicitado; c) La autoridad encargada de practicar el registro, y d) El motivo del registro y, en su caso, del ingreso nocturno. La orden tendrá una vigencia máxima de diez días, después de los cuales caducará la autorización. Con todo, el juez que emitiere la orden podrá establecer un plazo de vigencia inferior."}], "grp": "208|CPP"}, {"id": "N-SM-10", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El plazo legal para el cierre de la investigación, contado desde la formalización, es de:", "i": [], "a": ["Seis meses", "Un año", "Dos años", "Tres años"], "r": 2, "f": "Art. 247 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 247 CPP", "t": "Artículo 247.- Plazo para declarar el cierre de la investigación. Transcurrido el plazo de dos años desde la fecha en que la investigación hubiere sido formalizada, el fiscal deberá proceder a cerrarla. Si el fiscal no declarare cerrada la investigación en el plazo señalado, el imputado o el querellante podrán solicitar al juez que aperciba al fiscal para que proceda a tal cierre. Para estos efectos, el juez citará a los intervinientes a una audiencia y si el fiscal no compareciere, el juez otorgará un plazo máximo de dos días para que éste se pronuncie, dando cuenta de ello al fiscal regional o el Fiscal Jefe de la Fiscalía Supraterritorial, si corresponde. Transcurrido tal plazo sin que el fiscal se pronuncie o si, compareciendo, se negare a declarar cerrada la investigación, el juez decretará el sobreseimiento definitivo de la causa, informando de ello al fiscal …"}], "grp": "247|CPP"}, {"id": "N-SM-11", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "Cerrada la investigación, el fiscal dispone de diez días para:", "i": [], "a": ["Solicitar sobreseimiento, acusar o comunicar la decisión de no perseverar", "Solicitar sobreseimiento o acusar, únicamente", "Acusar o requerir en procedimiento monitorio", "Reabrir la investigación o acusar"], "r": 0, "f": "Art. 248 CPP, letras a), b) y c).", "g": "N", "x": [{"c": "Art. 248 CPP", "t": "Artículo 248- Cierre de la investigación. Practicadas las diligencias necesarias para la averiguación del hecho punible y sus autores, cómplices o encubridores, el fiscal declarará cerrada la investigación y podrá, dentro de los diez días siguientes: a) Solicitar el sobreseimiento definitivo o temporal de la causa; b) Formular acusación, cuando estimare que la investigación proporciona fundamento serio para el enjuiciamiento del imputado contra quien se hubiere formalizado la misma, o c) Comunicar la decisión del ministerio público de no perseverar en el procedimiento, por no haberse reunido durante la investigación los antecedentes suficientes para fundar una acusación. La comunicación de la decisión contemplada en la letra c) precedente dejará sin efecto la formalización de la investigación, dará lugar a que el juez revoque las medidas cautelares que se hubieren decretado, y la prescripción de la acción penal continuará corriendo como si nunca se hubiere interrumpido."}], "grp": "248|CPP"}, {"id": "N-SM-12", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La suspensión condicional del procedimiento se decreta por un plazo:", "i": [], "a": ["No inferior a seis meses ni superior a dos años", "No inferior a un año ni superior a tres", "No inferior a un año ni superior a cinco", "Igual a la pena probable"], "r": 1, "f": "Art. 237 inc. 6° CPP.", "g": "N", "x": [{"c": "Art. 237 CPP", "t": "… por los delitos o cuasidelitos contemplados en otros cuerpos legales que se cometan empleando alguna de las armas o elementos mencionados en las letras a), b), c), d) y e) del artículo 2º y en el artículo 3º de la citada ley Nº17.798, y por conducción en estado de ebriedad causando la muerte o lesiones graves o gravísimas, el fiscal deberá someter su decisión de solicitar la suspensión condicional del procedimiento al Fiscal Regional o al Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Al decretar la suspensión condicional del procedimiento, el juez de garantía establecerá las condiciones a las que deberá someterse el imputado, por el plazo que determine, el que no podrá ser inferior a un año ni superior a tres. …"}], "grp": "237|CPP"}, {"id": "N-SM-13", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "NO es requisito de la suspensión condicional del procedimiento:", "i": [], "a": ["Que la pena que pudiere imponerse no exceda de tres años de privación de libertad", "Que el imputado no haya sido condenado anteriormente por crimen o simple delito", "Que el imputado no tenga vigente otra suspensión condicional", "Que la víctima preste su consentimiento"], "r": 3, "f": "Art. 237 CPP: letras a), b) y c); la víctima debe ser oída si asiste, pero no consiente.", "g": "N", "x": [{"c": "Art. 237 CPP", "t": "… a) Si la pena que pudiere imponerse al imputado, en el evento de dictarse sentencia condenatoria, no excediere de tres años de privación de libertad; b) Si el imputado no hubiere sido condenado anteriormente por crimen o simple delito, y c) Si el imputado no tuviere vigente una suspensión condicional del procedimiento, o hayan transcurrido más de tres años desde la anterior resolución que hubiere decretado una suspensión condicional del procedimiento, al momento de verificarse los hechos materia del nuevo proceso. La presencia del defensor del imputado en la audiencia en que se ventilare la solicitud de suspensión condicional del procedimiento constituirá un requisito de validez de la misma. …"}], "grp": "237|CPP"}, {"id": "N-SM-14", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El juez revoca la suspensión condicional del procedimiento cuando el imputado:", "i": [], "a": ["Incumple sin justificación, grave o reiteradamente, las condiciones, o es objeto de una nueva formalización por hechos distintos", "Es denunciado por un nuevo delito", "Cambia de domicilio sin aviso", "Es citado como testigo en otra causa"], "r": 0, "f": "Art. 239 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 239 CPP", "t": "Artículo 239.- Revocación de la suspensión condicional. Cuando el imputado incumpliere, sin justificación, grave o reiteradamente las condiciones impuestas, o fuere objeto de una nueva formalización de la investigación por hechos distintos, el juez, a petición del fiscal o la víctima, revocará la suspensión condicional del procedimiento, y éste continuará de acuerdo a las reglas generales. Respecto de la suspensión condicional del procedimiento para el tratamiento de drogas y/o alcohol, se entenderá como incumplimiento de las condiciones la no adherencia al tratamiento y el incumplimiento grave y reiterado de las actividades determinantes para su rehabilitación. La resolución dictada de conformidad a este artículo será apelable."}], "grp": "239|CPP"}, {"id": "N-SM-15", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "El principio de oportunidad puede ser dejado sin efecto por el juez dentro del plazo de:", "i": [], "a": ["Cinco días desde su comunicación", "Diez días desde su comunicación", "Quince días desde su comunicación", "Treinta días desde su comunicación"], "r": 1, "f": "Art. 170 inc. 5° CPP.", "g": "N", "x": [{"c": "Art. 170 CPP", "t": "… Para estos efectos, el fiscal deberá emitir una decisión motivada, la que comunicará al juez de garantía. Éste, a su vez, la notificará a los intervinientes, si los hubiere. Dentro de los diez días siguientes a la comunicación de la decisión del fiscal, el juez, de oficio o a petición de cualquiera de los intervinientes, podrá dejarla sin efecto cuando considerare que aquél ha excedido sus atribuciones en cuanto la pena mínima prevista para el hecho de que se tratare excediere la de presidio o reclusión menores en su grado mínimo, o se tratare de un delito cometido por un funcionario público en el ejercicio de sus funciones. También la dejará sin efecto cuando, dentro del mismo plazo, la víctima manifestare de cualquier modo su interés en el inicio o en la continuación de la persecución penal. …"}], "grp": "170|CPP"}, {"id": "N-SM-16", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La decisión de archivo provisional respecto de un delito que merece pena aflictiva debe someterse a la aprobación de:", "i": [], "a": ["El juez de garantía", "El Fiscal Nacional", "El Fiscal Regional o el Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda", "El fiscal adjunto jefe"], "r": 2, "f": "Art. 167 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 167 CPP", "t": "Artículo 167.- Archivo provisional. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el ministerio público podrá archivar provisionalmente aquellas investigaciones en las que no aparecieren antecedentes que permitieren desarrollar actividades conducentes al esclarecimiento de los hechos. Si el delito mereciere pena aflictiva, el fiscal deberá someter la decisión sobre archivo provisional a la aprobación del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Si el delito tuviere asignada pena de crimen, la forma y el medio en que se comunicará a la víctima, el fundamento de la decisión y las diligencias de investigación efectivamente practicadas se regularán en un instructivo general dictado por el Fiscal Nacional. …"}], "grp": "167|CPP"}, {"id": "N-SM-17", "o": "Preguntas nuevas", "t": "sm", "m": "PI", "e": "La facultad de no iniciar investigación debe ser aprobada por:", "i": [], "a": ["El Fiscal Regional", "El juez de garantía", "La víctima", "El fiscal adjunto jefe"], "r": 1, "f": "Art. 168 CPP.", "g": "N", "x": [{"c": "Art. 168 CPP", "t": "Artículo 168.- Facultad para no iniciar investigación. En tanto no se hubiere producido la intervención del juez de garantía en el procedimiento, el fiscal podrá abstenerse de toda investigación, cuando los hechos relatados en la denuncia no fueren constitutivos de delito o cuando los antecedentes y datos suministrados permitieren establecer que se encuentra extinguida la responsabilidad penal del imputado. Esta decisión será siempre fundada y se someterá a la aprobación del juez de garantía."}], "grp": "168|CPP"}, {"id": "N-SM-18", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La audiencia de preparación del juicio oral debe tener lugar, desde la citación, en un plazo:", "i": [], "a": ["No inferior a quince ni superior a treinta días", "No inferior a veinte ni superior a cuarenta días", "No inferior a veinticinco ni superior a treinta y cinco días", "No inferior a treinta ni superior a sesenta días"], "r": 2, "f": "Art. 260 CPP.", "g": "N", "x": [{"c": "Art. 260 CPP", "t": "Artículo 260.- Citación a la audiencia. Presentada la acusación, el juez de garantía ordenará su notificación a todos los intervinientes y citará, dentro de las veinticuatro horas siguientes, a la audiencia de preparación del juicio oral, la que deberá tener lugar en un plazo no inferior a veinticinco ni superior a treinta y cinco días. Al acusado se le entregará la copia de la acusación, en la que se dejará constancia, además, del hecho de encontrarse a su disposición, en el tribunal, los antecedentes acumulados durante la investigación."}], "grp": "260|CPP"}, {"id": "N-SM-19", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El querellante puede adherir a la acusación o acusar particularmente hasta:", "i": [], "a": ["La víspera de la audiencia de preparación", "Cinco días antes de la audiencia de preparación", "Diez días antes de la audiencia de preparación", "Quince días antes de la audiencia de preparación"], "r": 3, "f": "Art. 261 CPP.", "g": "N", "x": [{"c": "Art. 261 CPP", "t": "Artículo 261.- Actuación del querellante. Hasta quince días antes de la fecha fijada para la realización de la audiencia de preparación del juicio oral, el querellante, por escrito, podrá: a) Adherir a la acusación del ministerio público o acusar particularmente. En este segundo caso, podrá plantear una distinta calificación de los hechos, otras formas de participación del acusado, solicitar otra pena o ampliar la acusación del fiscal, extendiéndola a hechos o a imputados distintos, siempre que hubieren sido objeto de la formalización de la investigación; b) Señalar los vicios formales de que adoleciere el escrito de acusación, requiriendo su corrección; c) Ofrecer la prueba que estimare necesaria para sustentar su acusación, lo que deberá hacerse en los mismos términos previstos en el artículo 259, y d) Deducir demanda civil, cuando procediere."}], "grp": "261|CPP"}, {"id": "N-SM-20", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La audiencia de juicio oral debe celebrarse, desde la notificación del auto de apertura:", "i": [], "a": ["No antes de diez ni después de treinta días", "No antes de quince ni después de sesenta días", "No antes de veinte ni después de cuarenta días", "No antes de treinta ni después de noventa días"], "r": 1, "f": "Art. 281 inc. 3° CPP.", "g": "N", "x": [{"c": "Art. 281 CPP", "t": "… El juez de garantía hará llegar el auto de apertura del juicio oral al tribunal competente, no antes de las veinticuatro horas ni después de las setenta y dos horas siguientes al momento en que quedare firme. También pondrá a disposición del tribunal de juicio Art. oral en lo penal las personas sometidas a prisión preventiva o a otras medidas cautelares personales. Una vez distribuida la causa, cuando procediere, el Art. juez presidente de la sala respectiva procederá de inmediato a decretar la fecha para la celebración de la audiencia del mismo, la que deberá tener lugar no antes de quince ni después de sesenta días desde la notificación del auto de apertura del juicio oral. …"}], "grp": "281|CPP"}, {"id": "N-SM-21", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "La interrupción del juicio oral impide su continuación y obliga a anular lo obrado cuando excede de:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Treinta días"], "r": 1, "f": "Art. 283 inc. 3° CPP.", "g": "N", "x": [{"c": "Art. 283 CPP", "t": "… Al reanudarla, efectuará un breve resumen de los actos realizados hasta ese momento. El juicio se suspenderá por las causas señaladas en el artículo 252. Con todo, el juicio seguirá adelante cuando la declaración de rebeldía se produjere respecto del imputado a quien se le hubiere otorgado la posibilidad de prestar declaración en el juicio oral, siempre que el tribunal estimare que su ulterior presencia no resulta indispensable para la prosecución del juicio o cuando sólo faltare la dictación de la sentencia. La suspensión de la audiencia o la interrupción del juicio oral por un período que excediere de diez días impedirá su continuación. En tal caso, el tribunal deberá decretar la nulidad de lo obrado en él y ordenar su reinicio. …"}], "grp": "283|CPP"}, {"id": "N-SM-22", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "Para la lectura de apoyo de memoria del artículo 332 del Código Procesal Penal pueden usarse declaraciones anteriores prestadas ante:", "i": [], "a": ["La policía, el fiscal o el juez de garantía", "El fiscal, el abogado asistente del fiscal o el juez de garantía", "Cualquier funcionario público", "El fiscal únicamente"], "r": 1, "f": "Art. 332 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 332 CPP", "t": "Artículo 332.- Lectura para apoyo de memoria en la audiencia del juicio oral. Sólo una vez que el acusado o el testigo hubieren prestado declaración, se podrá leer en el interrogatorio parte o partes de sus declaraciones anteriores prestadas ante el fiscal, el abogado asistente del fiscal, en su caso, o el juez de garantía, cuando fuere necesario para ayudar la memoria del respectivo acusado o testigo, para demostrar o superar contradicciones o para solicitar las aclaraciones pertinentes. Con los mismos objetivos, se podrá leer durante la declaración de un perito partes del informe que él hubiere elaborado."}], "grp": "332|CPP"}, {"id": "N-SM-23", "o": "Preguntas nuevas", "t": "sm", "m": "PJ", "e": "El plazo ordinario para la redacción del fallo y lectura de sentencia en el juicio oral es de hasta:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Veinte días"], "r": 1, "f": "Art. 344 inc. 1° CPP vigente.", "g": "N", "x": [{"c": "Art. 344 CPP", "t": "Artículo 344. Plazo para redacción de la sentencia. Al pronunciarse sobre la absolución o condena, el tribunal podrá diferir la redacción del fallo y, en su caso, la determinación de la pena hasta por un plazo de diez días, fijando la fecha de la audiencia en que tendrá lugar su lectura. No obstante, si el juicio hubiere durado más de cinco días, el tribunal dispondrá, para la fijación de la fecha de la audiencia para su comunicación, de un día adicional por cada dos de exceso de duración del juicio. En ambos casos, si el vencimiento del plazo para la redacción del fallo coincidiere con un día domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o festivo. …"}], "grp": "344|CPP"}, {"id": "N-SM-24", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El plazo para interponer el recurso de nulidad es de:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Veinte días"], "r": 2, "f": "Art. 372 inc. 2° CPP vigente.", "g": "N", "x": [{"c": "Art. 372 CPP", "t": "Artículo 372.- Del recurso de nulidad. El recurso de nulidad se concede para invalidar el juicio oral total o parcialmente junto con la sentencia definitiva, o sólo esta última, según corresponda, por las causales expresamente señaladas en la ley. Deberá interponerse, por escrito, dentro de los quince Art. días siguientes a la notificación de la sentencia definitiva, ante el tribunal que hubiere conocido del juicio oral. No obstante, si el juicio hubiere durado más de cinco días, el recurrente dispondrá para la interposición del recurso de un día adicional por cada dos de exceso de duración del juicio. En ningún caso este plazo podrá ser superior a treinta días. Si el vencimiento del plazo para la interposición del recurso coincide con un domingo o festivo, el plazo se diferirá hasta el día siguiente que no sea domingo o …"}], "grp": "372|CPP"}, {"id": "N-SM-25", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "Es motivo absoluto de nulidad:", "i": [], "a": ["La errónea aplicación del derecho con influencia sustancial en lo dispositivo", "La infracción sustancial de garantías constitucionales en cualquier etapa", "Que la sentencia haya sido pronunciada por un tribunal incompetente", "La valoración de prueba ilícita"], "r": 2, "f": "Art. 374 letra a) CPP; las dos primeras son las causales genéricas del art. 373.", "g": "N", "x": [{"c": "Art. 374 CPP", "t": "Artículo 374.- Motivos absolutos de nulidad. El juicio oral y la sentencia, o parte de éstos, serán siempre anulados: a) Cuando la sentencia hubiere sido pronunciada por un Art. tribunal incompetente, o no integrado por los jueces designados por la ley; cuando hubiere sido pronunciada por un juez de garantía o con la concurrencia de un juez de tribunal de juicio oral en lo penal legalmente implicado, o cuya recusación estuviere pendiente o hubiere sido declarada por tribunal competente; y cuando hubiere sido acordada por un menor número de votos o pronunciada por menor número de jueces que el requerido por la ley, o con concurrencia de jueces que no hubieren asistido al juicio; …"}], "grp": "374|CPP"}, {"id": "N-SM-26", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El recurso de nulidad fundado en la letra b) del artículo 373 es conocido, por regla general, por:", "i": [], "a": ["La Corte Suprema", "La Corte de Apelaciones respectiva", "El tribunal de juicio oral no inhabilitado", "El juez de garantía"], "r": 1, "f": "Art. 376 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 376 CPP", "t": "… El conocimiento del recurso que se fundare en la causal prevista en el artículo 373, letra a), corresponderá a la Corte Suprema. La respectiva Corte de Apelaciones conocerá de los recursos que se fundaren en las causales señaladas en el artículo 373, letra b), y en el artículo 374. No obstante lo dispuesto en el inciso precedente, cuando el recurso se fundare en la causal prevista en el artículo 373, letra b), y respecto de la materia de derecho objeto del mismo existieren distintas interpretaciones sostenidas en diversos fallos emanados de los tribunales superiores, corresponderá pronunciarse a la Corte Suprema. Del mismo modo, si un recurso se fundare en distintas causales y por aplicación de las reglas contempladas en los incisos precedentes correspondiere el conocimiento de al menos una de ellas a la Corte Suprema, ésta se pronunciará sobre todas. …"}], "grp": "376|CPP"}, {"id": "N-SM-27", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "Contra la sentencia definitiva del procedimiento abreviado procede:", "i": [], "a": ["Sólo el recurso de nulidad", "Sólo el recurso de apelación", "Apelación y nulidad", "Ningún recurso"], "r": 1, "f": "Art. 414 CPP.", "g": "N", "x": [{"c": "Art. 414 CPP", "t": "Artículo 414.- Recursos en contra de la sentencia dictada en el procedimiento abreviado. La sentencia definitiva dictada por el juez de garantía en el procedimiento abreviado sólo será impugnable por apelación, que se deberá conceder en ambos efectos. En el conocimiento del recurso de apelación la Corte podrá pronunciarse acerca de la concurrencia de los supuestos del procedimiento abreviado previstos en el artículo 406."}], "grp": "414|CPP"}, {"id": "N-SM-28", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "Contra la sentencia definitiva del procedimiento simplificado procede:", "i": [], "a": ["Sólo el recurso de nulidad", "Sólo el recurso de apelación", "Apelación y nulidad", "Reposición con apelación subsidiaria"], "r": 0, "f": "Art. 399 CPP.", "g": "N", "x": [{"c": "Art. 399 CPP", "t": "Artículo 399.- Recursos. Contra la sentencia definitiva sólo podrá interponerse el recurso de nulidad previsto en el Título IV del Libro Tercero. El fiscal requirente y el querellante, en su caso, sólo podrán recurrir si hubieren concurrido al juicio. Título II Procedimiento por delito de acción privada"}], "grp": "399|CPP"}, {"id": "N-SM-29", "o": "Preguntas nuevas", "t": "sm", "m": "PR", "e": "El auto de apertura del juicio oral sólo es apelable:", "i": [], "a": ["Por cualquier interviniente, por la exclusión de prueba impertinente", "Por el Ministerio Público, por la exclusión de prueba fundada en el inciso tercero del artículo 276", "Por el querellante, por la exclusión de prueba sobreabundante", "Por la defensa, por la inclusión de prueba ilícita"], "r": 1, "f": "Art. 277 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 277 CPP", "t": "… d) Los hechos que se dieren por acreditados, en conformidad con lo dispuesto en el artículo 275; e) Las pruebas que deberán rendirse en el juicio oral, de acuerdo a lo previsto en el artículo anterior, y f) La individualización de quienes debieren ser citados a la audiencia del juicio oral, con mención de los testigos a los que debiere pagarse anticipadamente sus gastos de traslado y habitación y los montos respectivos. El auto de apertura del juicio oral sólo será susceptible del recurso de apelación, cuando lo interpusiere el ministerio público por la exclusión de pruebas decretada por el juez de garantía de acuerdo a lo previsto en el inciso tercero del artículo precedente. …"}], "grp": "277|CPP"}, {"id": "N-SM-30", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El procedimiento abreviado procede cuando el fiscal requiere una pena privativa de libertad no superior a:", "i": [], "a": ["Cinco años de presidio menor en su grado máximo", "Diez años de presidio mayor en su grado mínimo", "Quince años de presidio mayor en su grado medio", "Tres años de presidio menor en su grado medio"], "r": 1, "f": "Art. 406 inc. 1° CPP vigente.", "g": "N", "x": [{"c": "Art. 406 CPP", "t": "Artículo 406.- Presupuestos del procedimiento abreviado. Se aplicará el procedimiento abreviado para conocer y fallar, los hechos respecto de los cuales el fiscal requiriere la imposición de una pena privativa de libertad no superior a diez años de presidio mayor en su grado mínimo, o bien cualesquiera otras penas de distinta naturaleza, cualquiera fuere su entidad o monto, ya fueren ellas únicas, conjuntas o alternativas. Para ello, será necesario que el imputado, en Art. conocimiento de los hechos materia de la acusación y de los antecedentes de la investigación que la fundaren, los acepte expresamente y manifieste su conformidad con la aplicación de este procedimiento. La existencia de varios acusados o la atribución de …"}], "grp": "406|CPP"}, {"id": "N-SM-31", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El procedimiento monitorio se aplica a:", "i": [], "a": ["Los simples delitos con pena de multa", "Las faltas respecto de las cuales el fiscal pide sólo pena de multa", "Todas las faltas", "Los delitos de acción privada"], "r": 1, "f": "Art. 392 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 392 CPP", "t": "Artículo 392.- Procedimiento monitorio. Se aplicará el procedimiento monitorio a la tramitación de las faltas respecto de las cuales el fiscal pidiere sólo pena de multa. En el requerimiento señalado en el artículo precedente el fiscal indicará el monto de la multa que solicitare imponer. Si el juez estimare suficientemente fundado el requerimiento y la proposición relativa a la multa, deberá acogerlos inmediatamente, dictando una resolución que así lo declare. Dicha resolución contendrá, además, las siguientes indicaciones: a) La instrucción acerca del derecho del imputado de reclamar en contra del requerimiento y de la imposición de la sanción, dentro de los quince días siguientes a su notificación, así como de los efectos de la interposición del reclamo; …"}], "grp": "392|CPP"}, {"id": "N-SM-32", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "El imputado debe ser citado a la audiencia del procedimiento simplificado con una anticipación mínima de:", "i": [], "a": ["Cinco días", "Diez días", "Quince días", "Veinte días"], "r": 1, "f": "Art. 393 inc. 1° CPP.", "g": "N", "x": [{"c": "Art. 393 CPP", "t": "Artículo 393.- Citación a audiencia. Recibido el requerimiento, el tribunal ordenará su notificación al imputado y citará a todos los intervinientes a la audiencia a que se refiere el artículo 394, la que no podrá tener lugar antes de veinte ni después de cuarenta días contados desde la fecha de la resolución. El imputado deberá ser citado con, a lo menos, diez días de anticipación a la fecha de la audiencia. La citación del imputado se hará bajo el apercibimiento señalado en el artículo 33 y a la misma se acompañarán copias del requerimiento y de la querella, en su caso. En el procedimiento simplificado no procederá la interposición de demandas civiles, salvo aquella que tuviere por objeto la restitución de la cosa o su valor. …"}], "grp": "393|CPP"}, {"id": "N-SM-33", "o": "Preguntas nuevas", "t": "sm", "m": "PX", "e": "La solicitud de revisión de una sentencia firme se presenta ante:", "i": [], "a": ["El tribunal que dictó la sentencia", "La Corte de Apelaciones respectiva", "La Corte Suprema", "El juez de garantía del lugar de cumplimiento"], "r": 2, "f": "Arts. 473 y 474 CPP.", "g": "N", "x": [{"c": "Art. 473 CPP", "t": "Artículo 473.- Procedencia de la revisión. La Corte Suprema podrá rever extraordinariamente las sentencias firmes en que se hubiere condenado a alguien por un crimen o simple delito, para anularlas, en los siguientes casos: a) Cuando, en virtud de sentencias contradictorias, estuvieren sufriendo condena dos o más personas por un mismo delito que no hubiere podido ser cometido más que por una sola; b) Cuando alguno estuviere sufriendo condena como autor, cómplice o encubridor del homicidio de una persona cuya existencia se comprobare después de la condena; c) Cuando alguno estuviere sufriendo condena en virtud de sentencia fundada en un documento o en el testimonio de una o más personas, siempre que dicho documento o dicho testimonio hubiere sido declarado falso por sentencia firme en causa criminal; …"}], "grp": "473|CPP"}, {"id": "N-SM-34", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Son intervinientes en el procedimiento penal:", "i": [], "a": ["El fiscal, el imputado, el defensor, la víctima y el querellante", "El fiscal, el imputado, el defensor y el juez", "El fiscal, la policía, el imputado y la víctima", "El fiscal, el imputado, la víctima y los testigos"], "r": 0, "f": "Art. 12 CPP.", "g": "N", "x": [{"c": "Art. 12 CPP", "t": "Artículo 12.- Intervinientes. Para los efectos regulados en este Código, se considerará intervinientes en el procedimiento al fiscal, al imputado, al defensor, a la víctima y al querellante, desde que realizaren cualquier actuación procesal o desde el momento en que la ley les permitiere ejercer facultades determinadas."}], "grp": "12|CPP"}, {"id": "N-SM-35", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Las presentaciones escritas deben ser resueltas por el tribunal:", "i": [], "a": ["En la audiencia más próxima", "Antes de las veinticuatro horas siguientes a su recepción", "Dentro de tercero día", "Dentro de cinco días"], "r": 1, "f": "Art. 38 inc. 2° CPP.", "g": "N", "x": [{"c": "Art. 38 CPP", "t": "Artículo 38.- Plazos generales para dictar las resoluciones. Las cuestiones debatidas en una audiencia deberán ser resueltas en ella. Las presentaciones escritas serán resueltas por el tribunal antes de las veinticuatro horas siguientes a su recepción. Párrafo 6°. Registro de las actuaciones judiciales"}], "grp": "38|CPP"}, {"id": "N-SM-36", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Los registros de las actuaciones judiciales son públicos, en todo caso, transcurridos:", "i": [], "a": ["Dos años desde la actuación", "Cinco años desde la actuación", "Diez años desde la actuación", "Quince años desde la actuación"], "r": 1, "f": "Art. 44 inc. 3° CPP.", "g": "N", "x": [{"c": "Art. 44 CPP", "t": "Artículo 44.- Examen del registro y certificaciones. Salvas las excepciones expresamente previstas en la ley, los intervinientes siempre tendrán acceso al contenido de los registros. Los registros podrán también ser consultados por terceros cuando dieren cuenta de actuaciones que fueren públicas de acuerdo con la ley, a menos que, durante la investigación o la tramitación de la causa, el tribunal restringiere el acceso para evitar que se afecte su normal substanciación o el principio de inocencia. En todo caso, los registros serán públicos transcurridos cinco años desde la realización de las actuaciones consignadas en ellos. A petición de un interviniente o de cualquier persona, el funcionario competente del tribunal expedirá copias fieles de los registros o de la parte de ellos que fuere pertinente, con sujeción a lo dispuesto en los incisos anteriores. …"}], "grp": "44|CPP"}, {"id": "N-SM-37", "o": "Preguntas nuevas", "t": "sm", "m": "PP", "e": "Es delito de acción pública previa instancia particular:", "i": [], "a": ["Las lesiones graves", "Las lesiones menos graves del artículo 399 del Código Penal", "El homicidio simple", "La injuria"], "r": 1, "f": "Art. 54 letra a) CPP.", "g": "N", "x": [{"c": "Art. 54 CPP", "t": "Artículo 54.- Delitos de acción pública previa instancia particular. En los delitos de acción pública previa instancia particular no podrá procederse de oficio sin que, a lo menos, el ofendido por el delito hubiere denunciado el hecho a la justicia, al ministerio público o a la policía. Tales delitos son: a) Las lesiones previstas en los artículos 399 y 494, número 5º, del Código Penal; b) La violación de domicilio; c) La violación de secretos prevista en los artículos 231 y 247, inciso segundo, del Código Penal; d) Las amenazas previstas en los artículos 296 y 297 del Código Penal; e) Los previstos en la ley N° 19.039, que establece normas aplicables a los privilegios industriales y protección de los derechos de propiedad industrial; …"}], "grp": "54|CPP"}, {"id": "N-SM-38", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los requisitos de edad y años de título para ser Fiscal Nacional son:", "i": [], "a": ["30 años de edad y 5 años de título", "35 años de edad y 10 años de título", "40 años de edad y 10 años de título", "40 años de edad y 15 años de título"], "r": 2, "f": "Art. 14 Ley 19.640 y art. 85 CPR.", "g": "N", "x": [{"c": "Art. 14 Ley 19.640", "t": "Artículo 14.- Para ser nombrado Fiscal Nacional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos diez años el título de abogado; c) Haber cumplido cuarenta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}, {"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}], "grp": "14|Ley 19.640"}, {"id": "N-SM-39", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los requisitos de edad y años de título para ser Fiscal Regional son:", "i": [], "a": ["25 años de edad y 5 años de título", "30 años de edad y 5 años de título", "35 años de edad y 10 años de título", "40 años de edad y 10 años de título"], "r": 1, "f": "Art. 31 Ley 19.640 y art. 86 CPR.", "g": "N", "x": [{"c": "Art. 31 Ley 19.640", "t": "Artículo 31.- Para ser nombrado Fiscal Regional, se requiere: a) Ser ciudadano con derecho a sufragio; b) Tener a lo menos cinco años el título de abogado; c) Haber cumplido treinta años de edad, y d) No encontrarse sujeto a alguna de las incapacidades e incompatibilidades previstas en esta ley."}, {"c": "Art. 86 CPR", "t": "Artículo 86.- Existirá un Fiscal Regional en cada una de las regiones en que se divida administrativamente el país, a menos que la población o la extensión geográfica de la región hagan necesario nombrar más de uno. Los fiscales regionales serán nombrados por el Fiscal Nacional, a propuesta en terna de la Corte de Apelaciones de la respectiva región. En caso que en la región exista más de una Corte de Apelaciones, la terna será formada por un pleno conjunto de todas ellas, especialmente convocado al efecto por el Presidente de la Corte de más antigua creación. Los fiscales regionales deberán tener a lo menos cinco años de título de abogado, haber cumplido 30 años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; …"}], "grp": "31|Ley 19.640"}, {"id": "N-SM-40", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional es designado por:", "i": [], "a": ["El Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado", "La Corte Suprema, a propuesta en terna del Senado", "El Senado, a propuesta en quina del Presidente de la República", "El Consejo General del Ministerio Público"], "r": 0, "f": "Art. 85 inc. 1° CPR.", "g": "N", "x": [{"c": "Art. 85 CPR", "t": "Artículo 85.- El Fiscal Nacional será designado por el Presidente de la República, a propuesta en quina de la Corte Suprema y con acuerdo del Senado adoptado por los dos tercios de sus miembros en ejercicio, en sesión especialmente convocada al efecto. Si el Senado no aprobare la proposición del Presidente de la República, la Corte Suprema deberá completar la quina proponiendo un nuevo nombre en sustitución del rechazado, repitiéndose el procedimiento hasta que se apruebe un nombramiento. El Fiscal Nacional deberá tener a lo menos diez años de título de abogado, haber cumplido cuarenta años de edad y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio; durará ocho años en el ejercicio de sus funciones y no podrá ser designado para el período siguiente. …"}], "grp": "85|CPR"}, {"id": "N-SM-41", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Los fiscales adjuntos son designados por:", "i": [], "a": ["El Fiscal Regional, previo concurso público", "El Fiscal Nacional, a propuesta en terna del Fiscal Regional o del Fiscal Jefe de la Fiscalía Supraterritorial", "La Corte de Apelaciones respectiva", "El Presidente de la República"], "r": 1, "f": "Art. 88 CPR y art. 41 Ley 19.640.", "g": "N", "x": [{"c": "Art. 88 CPR", "t": "Artículo 88.- Existirán fiscales adjuntos que serán designados por el Fiscal Nacional, a propuesta en terna del fiscal regional respectivo o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, la que deberá formarse previo concurso público, en conformidad a la ley orgánica constitucional. Deberán tener el título de abogado y poseer las demás calidades necesarias para ser ciudadano con derecho a sufragio."}, {"c": "Art. 41 Ley 19.640", "t": "Artículo 41.- Los fiscales adjuntos serán designados por el Fiscal Nacional, a propuesta en terna del Fiscal Regional respectivo o del Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda, la que deberá formarse previo concurso público. Los concursos se regirán por las reglas generales y bases que al efecto dicte el Fiscal Nacional e incluirán exámenes escritos, orales y una evaluación de los antecedentes académicos y laborales de los postulantes. Las bases que se dicten para el concurso público referido en el inciso anterior serán incorporadas en su llamado, el que será convocado por el Fiscal Regional respectivo o el Fiscal Jefe de la Fiscalía Supraterritorial, según corresponda. Dicho llamado se efectuará mediante avisos que deberán publicarse en el Diario Oficial, al menos dos veces en un diario de circulación nacional y, en el caso de las Fiscalías Regionales, además, …"}], "grp": "88|CPR"}, {"id": "N-SM-42", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "La remoción del Fiscal Nacional puede ser requerida a la Corte Suprema por:", "i": [], "a": ["El Presidente de la República, la Cámara de Diputados o diez de sus miembros", "El Senado o cinco de sus miembros", "El Consejo General del Ministerio Público", "Cualquier interviniente afectado"], "r": 0, "f": "Art. 89 inc. 1° CPR.", "g": "N", "x": [{"c": "Art. 89 CPR", "t": "Artículo 89.- El Fiscal Nacional y los fiscales Nº7 regionales sólo podrán ser removidos por la Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados, o de diez de sus miembros, por incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones. La Corte conocerá del asunto en pleno especialmente convocado al efecto y para acordar la remoción deberá reunir el voto conforme de la mayoría de sus miembros en ejercicio. La remoción de los fiscales regionales también podrá ser solicitada por el Fiscal Nacional. Al Fiscal Jefe de la Fiscalía Supraterritorial, único especializada en crimen organizado y delitos de alta complejidad, le será aplicable lo dispuesto en el inciso primero, además de la remoción por parte del Fiscal Nacional. …"}], "grp": "89|CPR"}, {"id": "N-SM-43", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Las causales de remoción del Fiscal Nacional y de los fiscales regionales son:", "i": [], "a": ["Notable abandono de deberes", "Incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones", "Pérdida de confianza del Presidente de la República", "Condena por falta"], "r": 1, "f": "Art. 89 inc. 1° CPR.", "g": "N", "x": [{"c": "Art. 89 CPR", "t": "Artículo 89.- El Fiscal Nacional y los fiscales Nº7 regionales sólo podrán ser removidos por la Corte Suprema, a requerimiento del Presidente de la República, de la Cámara de Diputados, o de diez de sus miembros, por incapacidad, mal comportamiento o negligencia manifiesta en el ejercicio de sus funciones. La Corte conocerá del asunto en pleno especialmente convocado al efecto y para acordar la remoción deberá reunir el voto conforme de la mayoría de sus miembros en ejercicio. La remoción de los fiscales regionales también podrá ser solicitada por el Fiscal Nacional. Al Fiscal Jefe de la Fiscalía Supraterritorial, único especializada en crimen organizado y delitos de alta complejidad, le será aplicable lo dispuesto en el inciso primero, además de la remoción por parte del Fiscal Nacional. …"}], "grp": "89|CPR"}, {"id": "N-SM-44", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "La Fiscalía Supraterritorial está especializada en:", "i": [], "a": ["Delitos económicos y de corrupción", "Crimen organizado y delitos de alta complejidad", "Delitos de lesa humanidad", "Delitos cometidos en el extranjero"], "r": 1, "f": "Art. 37 bis inc. 1° Ley 19.640.", "g": "N", "x": [{"c": "Art. 37 bis Ley 19.640", "t": "Artículo 37 bis.- La Fiscalía Supraterritorial, especializada en crimen organizado y delitos de alta complejidad, desempeñará sus funciones respecto a ilícitos en los cuales existan antecedentes de la intervención de asociaciones delictivas o criminales, y cuando los hechos requieran una dirección supraterritorial o transnacional de la investigación. Estará a cargo de un Fiscal Jefe, al que corresponderá ejercer las funciones propias del Ministerio Público, por sí o por medio de los fiscales adjuntos que se encuentren bajo su dependencia. Tendrá a su cargo las investigaciones penales de hechos respecto de los cuales concurran las circunstancias descritas en el inciso primero, sea que se hayan iniciado directamente por la Fiscalía Supraterritorial o por alguna Fiscalía Regional. …"}], "grp": "37 bis|Ley 19.640"}, {"id": "N-SM-45", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El Fiscal Nacional puede asumir de oficio y excepcionalmente la dirección de una investigación cuando:", "i": [], "a": ["La gravedad del delito lo exija", "La investidura de las personas involucradas como imputados o víctimas lo haga necesario para garantizar independencia y autonomía", "Lo solicite el Fiscal Regional", "La investigación exceda de dos años"], "r": 1, "f": "Art. 18 Ley 19.640.", "g": "N", "x": [{"c": "Art. 18 Ley 19.640", "t": "Artículo 18.- El Fiscal Nacional podrá asumir, de oficio y de manera excepcional, la dirección de la investigación, el ejercicio de la acción penal pública y la protección de las víctimas o testigos respecto de determinados hechos que se estimaren constitutivos de delitos, cuando la investidura de las personas involucradas como imputados o víctimas lo hiciere necesario para garantizar que dichas tareas se cumplirán con absoluta independencia y autonomía."}], "grp": "18|Ley 19.640"}, {"id": "N-SM-46", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "El fiscal adjunto puede representar las instrucciones particulares del Fiscal Regional cuando estima que:", "i": [], "a": ["Son inconvenientes para la investigación", "Son manifiestamente arbitrarias o atentan contra la ley o la ética profesional", "Exceden la carga de trabajo asignada", "Contradicen instrucciones de la policía"], "r": 1, "f": "Art. 44 inc. 2° Ley 19.640.", "g": "N", "x": [{"c": "Art. 44 Ley 19.640", "t": "Artículo 44.- Dentro de cada fiscalía local los fiscales adjuntos ejercerán directamente las funciones del Ministerio Público en los casos que se les asignen. Con dicho fin dirigirán la investigación de los hechos constitutivos de delitos y, cuando proceda, ejercerán las demás atribuciones que la ley les entregue, de conformidad a esta última y a las instrucciones generales que, dentro del ámbito de sus facultades, respectivamente impartan el Fiscal Nacional y el Fiscal Regional. Los fiscales adjuntos estarán igualmente obligados a obedecer las instrucciones particulares que el Fiscal Regional les dirija con respecto a un caso que les hubiere sido asignado, a menos que estimen que tales instrucciones son manifiestamente arbitrarias o que atentan contra la ley o la ética profesional. …"}], "grp": "44|Ley 19.640"}, {"id": "N-SM-47", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "La distribución de casos entre los fiscales adjuntos de una fiscalía local la realiza:", "i": [], "a": ["El Fiscal Regional", "El fiscal jefe, conforme a las instrucciones del Fiscal Nacional y sobre criterios objetivos", "El administrador de la fiscalía", "El Consejo General"], "r": 1, "f": "Art. 40 inc. 1° Ley 19.640.", "g": "N", "x": [{"c": "Art. 40 Ley 19.640", "t": "Artículo 40.- Cuando una fiscalía local cuente con más de un fiscal adjunto, la distribución de los casos entre los distintos fiscales adjuntos será realizada por el fiscal jefe de conformidad a las instrucciones que al respecto imparta el Fiscal Nacional. En todo caso, la distribución de casos deberá hacerse siempre sobre la base de criterios objetivos, tales como la carga de trabajo, la especialización y la experiencia. En todos los casos en que el fiscal adjunto se encontrare impedido de desempeñar el cargo por cualquier causa será subrogado, por el solo ministerio de la ley, con todas sus facultades y obligaciones, por el abogado asistente perteneciente a la misma fiscalía, designado por el Fiscal Regional. …"}], "grp": "40|Ley 19.640"}, {"id": "N-SM-48", "o": "Preguntas nuevas", "t": "sm", "m": "PB", "e": "Corresponde a los tribunales de juicio oral en lo penal:", "i": [], "a": ["Dictar sentencia en el procedimiento abreviado", "Conocer y juzgar las causas por crimen o simple delito, salvo los simples delitos que corresponden al juez de garantía", "Conocer y fallar las faltas penales", "Autorizar diligencias intrusivas durante la investigación"], "r": 1, "f": "Art. 18 letra a) COT.", "g": "N", "x": [{"c": "Art. 18 COT", "t": "Art. 18. Corresponderá a los tribunales de juicio oral en lo penal: a) Conocer y juzgar las causas por crimen o simple delito, salvo aquellas relativas a simples delitos cuyo conocimiento y fallo corresponda a un juez de garantía; b) Resolver, en su caso, sobre la libertad o prisión preventiva de los acusados puestos a su disposición; c) Resolver todos los incidentes que se promuevan durante el juicio oral; d) Conocer y resolver todas las cuestiones y asuntos que la ley de responsabilidad penal juvenil les encomienden, y e) Conocer y resolver los demás asuntos que la ley y procesal penal y la ley que establece disposiciones especiales sobre el Sistema de Justicia Militar les encomiende."}], "grp": "18|COT"}, {"id": "N-SM-49", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La acción penal prescribe, respectivamente para crímenes con pena perpetua, demás crímenes, simples delitos y faltas, en:", "i": [], "a": ["20 años, 15 años, 10 años y 1 año", "15 años, 10 años, 5 años y 6 meses", "15 años, 10 años, 5 años y 1 año", "10 años, 5 años, 3 años y 6 meses"], "r": 1, "f": "Art. 94 CP.", "g": "N", "x": [{"c": "Art. 94 CP", "t": "ART. 94. La acción penal prescribe: Respecto de los crímenes a que la ley impone pena de presidio, reclusión o relegación perpetuos, en quince años. Respecto de los demás crímenes, en diez años. Respecto de los simples delitos, en cinco años. Respecto de las faltas, en seis meses. Cuando la pena señalada al delito sea compuesta, se estará a la privativa de libertad, para la aplicación de las reglas comprendidas en los tres primeros acápites de este artículo; si no se impusieren penas privativas de libertad, se estará a la mayor. Las reglas precedentes se entienden sin perjuicio de Art. DECIMONOVENO las prescripciones de corto tiempo que establece este Código para delitos determinados."}], "grp": "94|CP"}, {"id": "N-SM-50", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Las penas temporales mayores se extienden:", "i": [], "a": ["De 3 años y un día a 15 años", "De 5 años y un día a 20 años", "De 5 años y un día a 15 años", "De 10 años y un día a 20 años"], "r": 1, "f": "Art. 25 inc. 1° CP.", "g": "N", "x": [{"c": "Art. 25 CP", "t": "ART. 25. Las penas temporales mayores duran de cinco años y un día a veinte años, y las temporales menores de sesenta y un días a cinco años. Las de inhabilitación absoluta y especial temporales para cargos y oficios públicos y profesiones titulares duran de tres años y un día a diez años. La suspensión de cargo u oficio público o profesión titular, dura de sesenta y un días a tres años. Las penas de destierro y de sujeción a la vigilancia de la autoridad, de sesenta y un días a cinco años. La prisión dura de uno a sesenta días. La cuantía de la multa, tratándose de crímenes, no podrá exceder de treinta unidades tributarias mensuales; …"}], "grp": "25|CP"}, {"id": "N-SM-51", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "Con una sola circunstancia agravante y ninguna atenuante, si la pena consta de dos o más grados, el tribunal:", "i": [], "a": ["Debe imponer el grado máximo", "No aplica el grado mínimo", "Puede imponer la pena superior en un grado", "Puede recorrer toda la extensión de la pena"], "r": 1, "f": "Art. 68 inc. 2° CP.", "g": "N", "x": [{"c": "Art. 68 CP", "t": "ART. 68. Cuando la pena señalada por la ley consta de dos o más grados, bien sea que los formen una o dos penas indivisibles y uno o más grados de otra divisible, o diversos grados de penas divisibles, el tribunal al aplicarla podrá recorrer toda su extensión, si no concurren en el hecho circunstancias atenuantes ni agravantes. Habiendo una sola circunstancia atenuante o una sola circunstancia agravante, no aplicará en el primer caso el grado máximo ni en el segundo el mínimo. Si son dos o más las circunstancias atenuantes y no hay ninguna agravante, el tribunal podrá imponer la pena inferior en uno, dos o tres grados al mínimo de los señalados por la ley, según sea el número y entidad de dichas circunstancias. …"}], "grp": "68|CP"}, {"id": "N-SM-52", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "A los encubridores de crimen o simple delito frustrado se impone la pena inferior en:", "i": [], "a": ["Un grado", "Dos grados", "Tres grados", "Cuatro grados"], "r": 2, "f": "Art. 53 CP.", "g": "N", "x": [{"c": "Art. 53 CP", "t": "ART. 53. A los cómplices de tentativa de crimen o simple delito y a los encubridores de crimen o simple delito frustrado, se impondrá la pena inferior en tres grados a la que señala la ley para el crimen o simple delito."}], "grp": "53|CP"}, {"id": "N-SM-53", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "La prescripción de la acción penal se suspende:", "i": [], "a": ["Desde la denuncia", "Desde que el procedimiento se dirige contra el responsable", "Desde la acusación", "Desde la sentencia de primera instancia"], "r": 1, "f": "Art. 96 CP (art. 233 letra a) CPP: la formalización produce ese efecto).", "g": "N", "x": [{"c": "Art. 96 CP", "t": "ART. 96. Esta prescripción se interrumpe, perdiéndose el tiempo trascurrido, siempre que el delincuente comete nuevamente crimen o simple delito, y se suspende desde que el procedimiento se dirige contra él; pero si se paraliza su prosecución por tres años o se termina sin condenarle, continúa la prescripción como si no se hubiere interrumpido."}, {"c": "Art. 233 CPP", "t": "Artículo 233.- Efectos de la formalización de la investigación. La formalización de la investigación producirá los siguientes efectos: a) Suspenderá el curso de la prescripción de la acción penal en conformidad a lo dispuesto en el artículo 96 del Código Penal; b) Comenzará a correr el plazo previsto en el artículo 247, y c) El ministerio público perderá la facultad de archivar provisionalmente el procedimiento."}], "grp": "96|CP"}, {"id": "N-SM-54", "o": "Preguntas nuevas", "t": "sm", "m": "PG", "e": "El indulto:", "i": [], "a": ["Extingue por completo la pena y todos sus efectos", "Sólo remite o conmuta la pena, sin quitar el carácter de condenado para la reincidencia", "Extingue la acción penal", "Sólo procede en delitos de acción privada"], "r": 1, "f": "Art. 93 N° 4 CP.", "g": "N", "x": [{"c": "Art. 93 CP", "t": "ART. 93. La responsabilidad penal se extingue: 1.° Por la muerte del responsable, siempre en cuanto a las penas personales, y respecto de las pecuniarias sólo cuando a su fallecimiento no se hubiere dictado sentencia ejecutoriada. 2.° Por el cumplimiento de la condena. 3.° Por amnistía, la cual extingue por completo la pena y todos sus efectos. 4.° Por indulto. La gracia de indulto sólo remite o conmuta la pena; pero no quita al favorecido el carácter de condenado para los efectos de la reincidencia o nuevo delinquimiento y demás que determinan las leyes. 5.° Por el perdón del ofendido cuando la pena se haya impuesto por delitos respecto de los cuales la ley sólo concede acción privada. 6.° Por la prescripción de la acción penal. 7.° Por la prescripción de la pena."}], "grp": "93|CP"}, {"id": "N-SM-55", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El artículo 458 bis del Código Penal impone el máximum o el grado máximo de la pena de la usurpación cuando la ocupación se realiza:", "i": [], "a": ["En un lugar habitado o destinado a la habitación", "Obstaculizando una acción destinada a impedir la propagación de incendios", "Obstaculizando el suministro de servicios públicos o domiciliarios", "En cualquiera de los casos anteriores"], "r": 3, "f": "Art. 458 bis CP, numerales 1°, 2° y 3°.", "g": "N", "x": [{"c": "Art. 458 bis CP", "t": "ART. 458 BIS. Se impondrá el máximum o el grado máximo, según corresponda, de las penas previstas en los tres artículos anteriores si la ocupación se realiza: 1.° En un lugar habitado o destinado a la habitación. 2.° Obstaculizando una acción destinada a impedir o dificultar la propagación de incendios. 3.° Obstaculizando el suministro de servicios públicos o domiciliarios, tales como electricidad, gas, agua, alcantarillado, colectores de aguas lluvia o telefonía."}], "grp": "458 bis|CP"}, {"id": "N-SM-56", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "Es circunstancia agravante especial del femicidio:", "i": [], "a": ["Encontrarse la víctima embarazada", "Ejecutarlo en presencia de ascendientes o descendientes de la víctima", "Ejecutarlo en el contexto de violencia física o psicológica habitual contra la víctima", "Todas las anteriores"], "r": 3, "f": "Art. 390 quáter CP.", "g": "N", "x": [{"c": "Art. 390 quáter CP", "t": "Artículo 390 quáter.- Son circunstancias agravantes de responsabilidad penal para el delito de femicidio, las siguientes: 1. Encontrarse la víctima embarazada. 2. Ser la víctima una niña o una adolescente menor de dieciocho años de edad, una mujer adulta mayor o una mujer en situación de discapacidad en los términos de la ley N° 20.422. 3. Ejecutarlo en presencia de ascendientes o descendientes de la víctima. 4. Ejecutarlo en el contexto de violencia física o psicológica habitual del hechor contra la víctima."}], "grp": "390 quáter|CP"}, {"id": "N-SM-57", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La pena del secuestro cuando el encierro se prolonga por más de quince días o resulta daño grave es:", "i": [], "a": ["Presidio menor en su grado máximo", "Presidio mayor en su grado mínimo a medio", "Presidio mayor en su grado medio a máximo", "Presidio perpetuo"], "r": 2, "f": "Art. 141 inc. 4° CP.", "g": "N", "x": [{"c": "Art. 141 CP", "t": "… El que sin derecho encerrare o detuviere a otro privándole de su libertad, comete el delito de secuestro y será castigado con la pena de presidio o reclusión menor en su grado máximo. En la misma pena incurrirá el que proporcionare lugar para la ejecución del delito. Si se ejecutare para obtener un rescate o imponer exigencias o arrancar decisiones, o si el encierro o detención se prolongare por más de 24 horas, será castigado con la pena de presidio mayor en su grado mínimo a medio. Si en cualesquiera de los casos anteriores, el encierro Art. ÚNICO N° 1 o la detención se prolongare por más de quince días o si de ello resultare un daño grave en la persona o intereses del secuestrado, la pena será presidio mayor en su grado medio a máximo. …"}], "grp": "141|CP"}, {"id": "N-SM-58", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La violación con homicidio y la violación con femicidio se castigan con:", "i": [], "a": ["Presidio mayor en su grado máximo a presidio perpetuo", "Presidio perpetuo a presidio perpetuo calificado", "Presidio perpetuo calificado", "Presidio mayor en su grado medio a máximo"], "r": 1, "f": "Art. 372 bis CP.", "g": "N", "x": [{"c": "Art. 372 bis CP", "t": "ART. 372 BIS. El que, con ocasión de violación, cometiere además homicidio en la persona de la víctima, será castigado con presidio perpetuo a presidio perpetuo calificado. Si el autor del delito descrito en el inciso anterior es un hombre y la víctima una mujer, el delito tendrá el nombre de violación con femicidio."}], "grp": "372 bis|CP"}, {"id": "N-SM-59", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "El abuso sexual por sorpresa del artículo 366 inciso tercero exige que la víctima sea:", "i": [], "a": ["Menor de catorce años", "Mayor de catorce años", "Menor de dieciocho años", "Mayor de dieciocho años"], "r": 1, "f": "Art. 366 inc. 3° CP.", "g": "N", "x": [{"c": "Art. 366 CP", "t": "ART. 366. El que abusivamente realizare una acción sexual distinta del acceso carnal con una persona mayor de catorce años, será castigado con presidio menor en su grado máximo, cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 361. Igual pena se aplicará cuando el abuso consistiere en la concurrencia de alguna de las circunstancias enumeradas en el artículo 363, siempre que la víctima fuere mayor de catorce y menor de dieciocho años. Se aplicará la pena de presidio menor en su grado mínimo a medio, cuando el abuso consistiere en el empleo de sorpresa u otra maniobra que no suponga consentimiento de la víctima, siempre que ésta sea mayor de catorce años."}], "grp": "366|CP"}, {"id": "N-SM-60", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "En el robo con violencia o intimidación en las personas no procede la atenuante de:", "i": [], "a": ["Irreprochable conducta anterior", "Reparación celosa del mal causado", "Colaboración sustancial", "Arrebato u obcecación"], "r": 1, "f": "Art. 450 bis CP: no procede la del art. 11 N° 7.", "g": "N", "x": [{"c": "Art. 450 bis CP", "t": "ART. 450 bis. En el robo con violencia o intimidación en las personas Art. UNICO, N° 3 no procederá la atenuante de responsabilidad penal contenida en el artículo 11, N° 7."}], "grp": "450 bis|CP"}, {"id": "N-SM-61", "o": "Preguntas nuevas", "t": "sm", "m": "PE", "e": "La pena del ingreso no autorizado de teléfonos a un establecimiento penitenciario es:", "i": [], "a": ["Presidio menor en su grado mínimo y multa", "Presidio menor en su grado mínimo a medio", "Presidio menor en su grado medio a máximo", "Presidio menor en su grado máximo"], "r": 1, "f": "Art. 304 bis inc. 1° CP.", "g": "N", "x": [{"c": "Art. 304 bis CP", "t": "ART. 304 bis. El que sin estar legal o reglamentariamente autorizado al efecto ingresare, intentare o permitiere ingresar por cualquier medio a un establecimiento penitenciario intercomunicadores, teléfonos, partes de ellos, chips telefónicos u otros elementos tecnológicos que permitan comunicarse con el exterior, será sancionado con la pena de presidio menor en su grado mínimo a medio. El que ingresare, intentare o permitiere ingresar mediante lanzamiento desde el exterior o por vía no destinada al efecto, con dirección al interior de un establecimiento penitenciario, cualquier objeto o sustancia, será sancionado con la pena de presidio menor en sus grados mínimo a medio. La pena establecida en el inciso anterior se aumentará Art. …"}], "grp": "304 bis|CP"}, {"id": "N-SM-62", "o": "Preguntas nuevas", "t": "sm", "m": "LE", "e": "El microtráfico del artículo 4° de la Ley 20.000 se castiga con:", "i": [], "a": ["Presidio menor en su grado mínimo y multa", "Presidio menor en sus grados medio a máximo y multa de 10 a 40 UTM", "Presidio mayor en su grado mínimo y multa de 40 a 400 UTM", "Sólo multa de 1 a 10 UTM"], "r": 1, "f": "Art. 4° inc. 1° Ley 20.000.", "g": "N", "x": [{"c": "Art. 4 Ley 20.000", "t": "Artículo 4º.- El que, sin la competente autorización posea, transporte, guarde o porte consigo pequeñas cantidades de sustancias o drogas estupefacientes o sicotrópicas, productoras de dependencia física o
